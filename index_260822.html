// Preflight check: some embedded/sandboxed webviews (e.g. in-app previews) block Web Worker
// creation outright, which makes Tesseract.recognize() fail on every image with no useful detail.
// Detecting this up front lets us give a clear, specific message instead of a generic one.
function canUseWebWorker(){
  return new Promise((resolve)=>{
    try{
      if(typeof Worker==="undefined"){ resolve(false); return; }
      const blob=new Blob(["self.onmessage=function(){self.postMessage('ok');};"], {type:"application/javascript"});
      const url=URL.createObjectURL(blob);
      const w=new Worker(url);
      const timer=setTimeout(()=>{ try{w.terminate();}catch(_){ } resolve(false); }, 1500);
      w.onmessage=()=>{ clearTimeout(timer); try{w.terminate();}catch(_){ } URL.revokeObjectURL(url); resolve(true); };
      w.onerror=()=>{ clearTimeout(timer); try{w.terminate();}catch(_){ } URL.revokeObjectURL(url); resolve(false); };
      w.postMessage("ping");
    }catch(e){ resolve(false); }
  });
}
async function runOcrPipeline(){
  if(!window.Tesseract){ OCR_STATE.status="error"; OCR_STATE.warnings=["OCR 엔진 스크립트를 불러오지 못했습니다 (네트워크 문제일 수 있어요). 다시 시도해주세요."]; renderAll(); return; }
  OCR_STATE.status="processing"; OCR_STATE.progress=0; OCR_STATE.rawText=""; renderAll();
  const workerOk=await canUseWebWorker();
  if(!workerOk){
    OCR_STATE.status="error";
    OCR_STATE.warnings=["이 미리보기 화면은 보안 정책상 OCR에 필요한 웹 워커 실행이 막혀 있어요. 파일을 다운로드한 뒤 Safari나 Chrome 같은 일반 브라우저 앱에서 직접 열어 다시 시도해주세요."];
    renderAll(); return;
  }
  let combinedText="", allWords=[];
  const imageErrors=[];
  for(let i=0;i<OCR_STATE.images.length;i++){
    try{
      const canvas=await preprocessForOcr(OCR_STATE.images[i].dataUrl);
      const { data }=await Tesseract.recognize(canvas, "eng", {
        logger:(m)=>{
          if(m.status==="recognizing text"){
            OCR_STATE.progress=Math.round(((i+m.progress)/OCR_STATE.images.length)*100);
            const el=document.getElementById("ocr-progress-text");
            if(el) el.textContent=`기록을 읽고 있어요… (${OCR_STATE.progress}%)`;
          }
        }
      });
      combinedText += "\n"+(data.text||"");
      if(data.words) allWords=allWords.concat(data.words.map(w=>({text:w.text, confidence:w.confidence})));
    }catch(e){
      console.warn("OCR failed on image", i, e);
      imageErrors.push(`이미지 ${i+1}: ${ocrErrorText(e)}`);
    }
  }
  OCR_STATE.rawText=combinedText.trim();
  if(!combinedText.trim()){
    OCR_STATE.status="error";
    OCR_STATE.warnings = imageErrors.length ? imageErrors : ["OCR 엔진이 이미지에서 아무 글자도 읽지 못했습니다. 이미지가 선명한지, 결과 화면이 잘 보이는지 확인 후 다시 시도해주세요."];
    renderAll(); return;
  }
  const parsed=parseHyroxOcrText(combinedText, allWords);
  const hasAnything = parsed.fields.officialTime || Object.keys(parsed.fields.runs).length || Object.keys(parsed.fields.stations).length;
  if(!hasAnything){
    OCR_STATE.status="error";
    OCR_STATE.warnings=["글자는 읽었지만 HYROX 항목(RUN/SKI ERG/SLED PUSH 등 라벨)을 찾지 못했습니다. 아래 \"인식된 텍스트 보기\"에서 실제로 읽힌 내용을 확인해주세요.", ...imageErrors];
  }else{
    RC_PREFILL={ name:parsed.fields.name, date:parsed.fields.date||todayISO(), division:DIVISIONS[0], officialTime:parsed.fields.officialTime||"", runs:parsed.fields.runs, stations:parsed.fields.stations, transition:parsed.fields.transition||"", share:{} };
    RC_OCR_CONF=parsed.confMap;
    RC_SOURCE_TYPE="OCR_USER_UPLOAD";
    OCR_STATE.status="done"; OCR_STATE.warnings=[...parsed.warnings, ...imageErrors];
  }

}
function ocrConfBadge(conf){
  if(conf==="error") return ` <span title="OCR 인식 오류 가능성 — 확인 필요" style="font-size:11px;">🔴</span>`;

}

// Extracts image File/Blob objects out of a paste ClipboardEvent (covers both the common
// dataTransfer.files path and the items[] path some browsers use for screenshot pastes).
function extractClipboardImages(e){
  const dt = e.clipboardData || window.clipboardData;
  if(!dt) return [];
  const files=[];
  if(dt.files && dt.files.length) Array.from(dt.files).forEach(f=>{ if(f.type && f.type.startsWith("image/")) files.push(f); });
  if(!files.length && dt.items) Array.from(dt.items).forEach(it=>{
    if(it.kind==="file" && it.type && it.type.startsWith("image/")){ const f=it.getAsFile(); if(f) files.push(f); }
  });
  return files;
}
// spec: "하이록스 기록올릴때 이미지 복사붙여넣기되게" — lets a person paste a copied results
// screenshot directly instead of only file-upload/camera. Reuses the exact same handleOcrFiles()
// path as file upload, so nothing downstream (OCR pipeline, parsing, confidence badges) changes.
function handleOcrPasteEvent(e){
  const files=extractClipboardImages(e);
  if(!files.length) return; // let normal text-paste behavior (if any) proceed untouched
  e.preventDefault();
  handleOcrFiles(files);
  showToast("이미지를 붙여넣었습니다 — \"기록 읽기\"를 눌러주세요");
}
function bindOcrImportCard(wrap){

  wrap.querySelector("#ocr-camera-input")?.addEventListener("change",(e)=>{ handleOcrFiles(e.target.files); e.target.value=""; });
  wrap.querySelector("#ocr-paste-zone")?.addEventListener("paste", handleOcrPasteEvent);
  wrap.querySelectorAll("[data-ocr-remove]").forEach(b=>b.addEventListener("click",()=>{
    OCR_STATE.images.splice(Number(b.dataset.ocrRemove),1); renderAll();
  }));
  wrap.querySelector("#ocr-clear-btn")?.addEventListener("click",()=>{

  });
  wrap.querySelector("#ocr-run-btn")?.addEventListener("click",()=>{ runOcrPipeline(); });
  wrap.querySelector("#ocr-raw-toggle")?.addEventListener("click",()=>{ OCR_RAW_OPEN=!OCR_RAW_OPEN; renderAll(); });
}

let EXPANDED_RACE_ID = null;
/* ----------------------------------------------------------------------
 * HYROX RESULT ADMIN IMPORT — raw official CSV -> Supabase
 * ---------------------------------------------------------------------- */
// "Season"은 선택 컬럼이다 — 있으면 같은 해 같은 도시의 중복 대회를 정확히 가르고,
// 없어도 기존 CSV가 그대로 업로드된다 (형식 판정에는 쓰지 않는다).
function hyroxCsvClean(v){
  if(v===undefined || v===null) return "";
  const s=String(v).replace(/^\uFEFF/,"").trim();
  return ["","–","—","-","N/A","NA","null","undefined"].includes(s) ? "" : s;
}
function hyroxCsvDivision(v){
  const s=hyroxCsvClean(v).toUpperCase();
  if(s.includes("MIXED") && s.includes("DOUBLES")) return "Mixed Doubles";
  if(s.includes("PRO") && s.includes("DOUBLES")) return "Pro Doubles";
  if(s.includes("DOUBLES")) return "Open Doubles";
  if(s.includes("PRO")) return "Pro";
  return "Open";
}
function hyroxTimeValue(v){
  const s=hyroxCsvClean(v);
  if(!s) return "";
  if(/^\d+(?:\.\d+)?$/.test(s)){
    const n=Number(s);
    if(Number.isFinite(n) && n>=0 && n<100000){
      const sec=Math.round(n);
      const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), ss=sec%60;
      return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
  }
  return s;
}
// spec: Run 컬럼명이 실제 업로드 파일마다 조금씩 다를 수 있음(Station은 이미 정상 매칭되던 것과
// 대비해 Run만 표본이 비는 문제가 실제로 관측됨) — 단일 하드코딩 헤더 대신 여러 후보 이름을 순서대로
// 시도한다. 첫 번째로 값이 있는 후보를 사용, 전부 비어있으면 빈 문자열(기존과 동일하게 null 처리됨).
function pickCsvValue(row, candidates){
  for(const c of candidates){
    if(row[c]!==undefined){
      const cleaned=hyroxCsvClean(row[c]);
      if(cleaned!=="") return row[c];
    }
  }
  return "";
}
// "S8 2025 Shanghai" 처럼 사람이 읽을 수 있는 단일 라벨. Season 이 없으면 자동으로 빠진다.
// CSV의 Date 열을 YYYY-MM-DD 로 정규화한다.
// 04/12/2025 처럼 앞 두 자리가 12 이하인 슬래시 형식은 "4월 12일"인지 "12월 4일"인지
// 알 수 없다. 이럴 때 임의로 하나를 고르면 대회 날짜가 조용히 8개월 틀어진다 —
// Incheon 연도 누락과 똑같은 종류의 조용한 오염이므로, 추측하지 않고 ""를 돌려
// 업로드 전 검증에서 걸리게 한다.
function hyroxCsvDate(v){
  const raw=hyroxCsvClean(v);
  if(!raw) return "";
  const pad=(n)=>String(n).padStart(2,"0");
  const valid=(y,m,d)=>{ y=+y; m=+m; d=+d;
    if(!(y>=1900&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)) return "";
    return `${y}-${pad(m)}-${pad(d)}`; };
  let m;
  // 1) 연도가 앞에 오는 형식 — 모호함 없음
  if((m=raw.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/))) return valid(m[1],m[2],m[3]);
  // 2) 연도가 뒤에 오는 형식 — 첫 값이 13 이상이면 "일"로 확정할 수 있다
  if((m=raw.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})$/))){
    if(+m[1]>12) return valid(m[3],m[2],m[1]);   // DD/MM/YYYY 확정
    if(+m[2]>12) return valid(m[3],m[1],m[2]);   // MM/DD/YYYY 확정
    return "";                                    // 모호 — 추측 금지
  }
  // 3) "12 Apr 2025" / "Apr 12, 2025" 같은 영문 표기
  const t=Date.parse(raw);
  if(!Number.isNaN(t) && /[A-Za-z]{3}/.test(raw)){
    const d=new Date(t); return valid(d.getFullYear(), d.getMonth()+1, d.getDate());
  }
  return "";
}
/* BUG FIX — CSV 헤더 대소문자
 * 실제 업로드 파일의 헤더는 "season"/"year"(소문자)인데 코드는 row["Year"] 만 읽고 있었다.
 * 그러면 year 가 "" 가 되고 event 라벨에서 연도가 조용히 빠진다 — Incheon 에서 벌어진 일과
 * 정확히 같은 증상이다. 대소문자·공백·구분자를 무시하고 찾도록 통일한다.
 */
function csvField(row, ...names){
  for(const n of names){
    if(row[n]!==undefined) return hyroxCsvClean(row[n]);
  }
  const norm=(k)=>String(k).toLowerCase().replace(/[\s_\-]+/g,"");
  const want=names.map(norm);
  for(const k of Object.keys(row)){
    if(want.includes(norm(k))) return hyroxCsvClean(row[k]);
  }
  return "";
}
function composeEventLabel(season, year, race){
  const s=String(season||"").trim();
  const seasonLabel = s ? (/^\d+$/.test(s) ? `S${s}` : s) : "";
  return [seasonLabel, String(year||"").trim(), String(race||"").trim()].filter(Boolean).join(" ");
}

  // 않는다. Season 은 연도를 걸쳐 있으므로(S7 2024-25, S8 2025-26) 두 대회를 실제로 가른다.
  // event 는 사람이 읽는 표시용 라벨로 계속 유지 — 기존 데이터/중복판정 키와 호환된다.

async function readHyroxUploadFile(file){

    const XLSX=await ensureSheetJS();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:false});

  }catch(e){ console.warn("upload log 저장 실패(업로드 자체는 정상 처리됨):", e?.message||e); }
}
async function loadHyroxUploadLog(){
  let shared=null;
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get("hps:hyroxUploadLog:v1", true);
      shared = r ? JSON.parse(r.value) : null;
    }
  }catch(e){ /* 키 없음 — 정상 */ }
  const local = await StorageService.get("hps:hyroxUploadLog:v1", []);
  // 공유 이력과 로컬 이력을 id 기준으로 합쳐서 최신순으로. 둘 중 하나만 있어도 정상 동작한다.
  const merged = [...(Array.isArray(shared)?shared:[]), ...(Array.isArray(local)?local:[])];
  const seen=new Set(), out=[];
  merged.forEach(e=>{ const k=e&&(e.id||`${e.uploadedAt}|${e.fileName}`); if(!k||seen.has(k)) return; seen.add(k); out.push(e); });
  out.sort((a,b)=>String(b.uploadedAt||"").localeCompare(String(a.uploadedAt||"")));
  return out.slice(0,100);
}
/* ----------------------------------------------------------------------
 * HYROX RESULT SEARCH DB — Supabase-backed
 *
 * IMPORTANT:
 * - Athlete/result rows are NOT embedded in this HTML anymore.
 * - The public site reads them from Supabase via the RPC function
 *   `search_hyrox_results`.
 * - Admins can add official race data from the HPS Admin page by uploading the
 *   original HYROX CSV; no manual CSV conversion or HTML rebuild is needed.
 * ---------------------------------------------------------------------- */
let HYROX_SEARCH_DB = null; // true after Supabase is reachable
let HYROX_SEARCH_DB_PROMISE = null;
let HYROX_SEARCH_DB_COUNT = null;
let HYROX_DB_QUERY = "";
let HYROX_DB_RESULTS = [];
let HYROX_DB_SELECTED = null;

function hyroxDbReady(){
  return !!HYROX_SEARCH_DB;
}

async function ensureHyroxSearchDb(){
  if(HYROX_SEARCH_DB) return HYROX_SEARCH_DB;
  if(HYROX_SEARCH_DB_PROMISE) return HYROX_SEARCH_DB_PROMISE;
  HYROX_SEARCH_DB_PROMISE = (async()=>{
    if(!window.supabase || !window.supabase.createClient){
      throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    }
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
      throw new Error("Supabase URL / anon key가 index.html에 설정되지 않았습니다.");
    }
    // Reuse the existing global client when authentication has already initialized it.
    if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Lightweight connectivity + count check. Athlete rows themselves are never
    // downloaded up front; only matching rows are requested when the user searches.
    const { count, error } = await sb
      .from("hyrox_results")
      .select("id", { count:"exact", head:true });
    if(error) throw error;
    HYROX_SEARCH_DB_COUNT = count;
    HYROX_SEARCH_DB = true;
    return HYROX_SEARCH_DB;
  })();
  try{
    return await HYROX_SEARCH_DB_PROMISE;
  }catch(e){
    HYROX_SEARCH_DB_PROMISE=null;
    HYROX_SEARCH_DB=null;
    throw e;
  }
}

function normalizeHyroxSearchText(v){
  // BUG FIX: NFD decomposes accented Latin (café -> cafe + combining mark, stripped below on purpose)
  // but it ALSO decomposes precomposed Hangul syllables into individual jamo (세 -> ㅅ+ㅔ), which then
  // fall outside the "가-힣" allowed range below and get silently wiped out -> Korean searches like
  // "세희" were being normalized down to an empty string before ever reaching the server. Re-composing
  // with NFC right after stripping Latin combining marks puts Hangul jamo back into whole syllables
  // (a no-op for input that was already NFC, which is how Korean IME input normally arrives) while
  // still keeping the Latin-accent-stripping behavior intact.
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC")
    .toLowerCase().replace(/[^a-z0-9가-힣]+/g," ").trim();
}

function mapHyroxDbRow(row){
  return {
    n:row.name||"",
    e:row.event||"",
    d:row.division||"",
    g:row.gender||"",
    a:row.age_group||"",
    b:row.bib||"",
    rk:row.overall_rank==null?"":String(row.overall_rank),
    ag:row.age_group_rank==null?"":String(row.age_group_rank),
    t:row.total_time||"",
    u:Array.isArray(row.runs_json) ? row.runs_json : (typeof row.runs_json==="string" ? JSON.parse(row.runs_json||"[]") : []),
    s:Array.isArray(row.stations_json) ? row.stations_json : (typeof row.stations_json==="string" ? JSON.parse(row.stations_json||"[]") : []),
    z:row.transition||"",
    dt:row.start_date || row.date || row.event_date || row.race_date || "",
    dt2:row.end_date || "",
  };
}

// Supabase RPC performs token-aware search, so "Joshua White" also finds
// "White, Joshua" without downloading the whole athlete database.
/* ---------------------------------------------------------------------- */
/* 한글 <-> 로마자 교차 검색                                                 */
/*                                                                        */
/* search_hyrox_results RPC는 search_name에 대한 ilike 부분검색이라, DB에    */
/* 저장된 표기와 입력 표기가 다르면(김세희 vs Kim Sehee) 매칭되지 않는다.     */
/* RPC/스키마를 건드리지 않고, 클라이언트에서 표기 후보를 만들어 여러 번      */
/* 검색한 뒤 합치는 방식으로 해결한다.                                       */
/*                                                                        */
/* 한글 -> 로마자: 자모 분해 후 국어의 로마자 표기법으로 변환. 성씨는 실제    */
/* 여권 표기가 표기법과 다른 경우가 많아(이=Lee, 박=Park) 별도 표를 둔다.     */
/* 로마자 -> 한글: 역변환은 원리상 1:다 대응이라 완전하지 않다. 이름에 자주   */
/* 쓰이는 음절만 표로 두고 greedy 분절한다. 후보는 항상 상한을 둬서, 검색이   */
/* 느려지거나 엉뚱한 결과가 쏟아지지 않게 한다.                              */
/* ---------------------------------------------------------------------- */
const RR_INITIAL = ["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RR_VOWEL   = ["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const RR_FINAL   = ["","k","k","k","n","n","n","t","l","l","l","l","l","l","l","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
// 여권에서 실제로 쓰이는 성씨 표기 (표기법 결과와 다른 것 위주)
const SURNAME_ROMAN = {
  "김":["kim"], "이":["lee","yi","rhee"], "박":["park","bak"], "최":["choi","choe"],
  "정":["jung","jeong","chung"], "강":["kang"], "조":["cho","jo"], "윤":["yoon","yun"],
  "장":["jang","chang"], "임":["lim","im"], "한":["han"], "오":["oh","o"], "서":["seo","suh"],
  "신":["shin","sin"], "권":["kwon","gwon"], "황":["hwang"], "안":["ahn","an"], "송":["song"],
  "전":["jeon","jun"], "홍":["hong"], "유":["yoo","yu"], "고":["ko","go"], "문":["moon","mun"],
  "손":["son","sohn"], "양":["yang"], "배":["bae"], "백":["baek","paik"], "허":["heo","hur"],
  "남":["nam"], "심":["shim","sim"], "노":["noh","no"], "구":["koo","gu"], "주":["joo","ju"],
};
// 이름에 흔한 로마자 음절 -> 한글 (역변환용). 완전한 표가 아니라 "자주 쓰는 것"만.
const ROMAN_TO_HANGUL_SYL = {
  se:["세"], sae:["새"], hee:["희","혜"], hui:["희"], hye:["혜"], ji:["지"], jin:["진"],
  min:["민"], jun:["준"], joon:["준"], jung:["정","중"], jeong:["정"], young:["영"], yeong:["영"],
  hyun:["현"], hyeon:["현"], soo:["수"], su:["수"], sung:["성"], seong:["성"], chul:["철"],
  cheol:["철"], ho:["호"], hoon:["훈"], hun:["훈"], woo:["우"], woon:["운"], eun:["은"],
  yoon:["윤"], yun:["윤"], na:["나"], ra:["라"], ha:["하"], da:["다"], bin:["빈"], sol:["솔"],
  a:["아"], ah:["아"], yeon:["연"], yun2:["연"], mi:["미"], ju:["주"], joo:["주"], kyung:["경"],
  gyeong:["경"], kyu:["규"], gyu:["규"], tae:["태"], dong:["동"], sang:["상"], won:["원"],
  hwan:["환"], jae:["재"], chan:["찬"], hyuk:["혁"], seok:["석"], suk:["석"], gun:["건"], geon:["건"],
  bo:["보"], yu:["유"], you:["유"], nam:["남"], rim:["림"], lim:["림"], kim:["김"], lee:["이"],
  park:["박"], choi:["최"], kang:["강"], cho:["조"], jang:["장"], han:["한"], oh:["오"], seo:["서"],
  shin:["신"], kwon:["권"], hwang:["황"], ahn:["안"], song:["송"], jeon:["전"], hong:["홍"],
  ko:["고"], moon:["문"], son:["손"], yang:["양"], bae:["배"], baek:["백"], heo:["허"],
};
function romanizeHangulSyllable(ch){
  const code=ch.charCodeAt(0)-0xAC00;
  if(code<0 || code>11171) return null;
  return RR_INITIAL[Math.floor(code/588)] + RR_VOWEL[Math.floor((code%588)/28)] + RR_FINAL[code%28];
}
function hasHangul(str){ return /[\uAC00-\uD7A3]/.test(str); }
// 로마자 표기법(RR) 결과와 실제로 여권/대회 등록에 쓰는 철자는 자주 다르다.
// 희=hui(표기법) 이지만 대부분 hee 로 쓰고, 철=cheol 이지만 chul, 수=su 지만 soo 로 쓴다.
// RR 결과에 아래 치환을 적용해 "실제로 쓰일 법한" 철자 후보를 추가로 만든다.
const RR_SPELLING_ALT = [
  [/hui/g,"hee"], [/cheol/g,"chul"], [/jeong/g,"jung"], [/yeong/g,"young"],
  [/hyeon/g,"hyun"], [/seong/g,"sung"], [/gyeong/g,"kyung"], [/seok/g,"suk"],
  [/gyu/g,"kyu"], [/geon/g,"gun"], [/su\b/g,"soo"], [/u\b/g,"oo"], [/eo/g,"u"], [/eu/g,"u"],
];
function romanSpellingAlternates(roman, max=2){
  const out=[];
  // 1차: 대표 치환을 전부 적용한 형태
  let a=roman; RR_SPELLING_ALT.forEach(([re,to])=>{ a=a.replace(re,to); });
  if(a!==roman) out.push(a);
  // 2차: 모음 축약(eo/eu)은 빼고 자주 쓰는 철자만 바꾼 보수적인 형태
  let b=roman; RR_SPELLING_ALT.slice(0,10).forEach(([re,to])=>{ b=b.replace(re,to); });
  if(b!==roman && b!==a) out.push(b);
  return out.slice(0,max);
}
// 한글 이름 -> 로마자 후보 (최대 MAX). "김 세희" 같은 띄어쓰기도 그대로 살린다.
function hangulToRomanCandidates(str, max=4){
  if(!hasHangul(str)) return [];
  const words=str.trim().split(/\s+/).filter(Boolean);
  // 각 글자별 후보 목록을 만들고, 조합 폭발을 막기 위해 성씨만 다중 후보를 허용한다.
  const perWord=words.map((w,wi)=>{
    const chars=[...w];
    const out=[];
    // 성씨 후보: 첫 단어의 첫 글자 (또는 붙여쓴 이름의 첫 글자)
    const surnameAlts = (wi===0 && SURNAME_ROMAN[chars[0]]) ? SURNAME_ROMAN[chars[0]] : null;
    const restRoman = chars.slice(surnameAlts?1:0).map(c=>romanizeHangulSyllable(c)||c).join("");
    if(surnameAlts){ surnameAlts.forEach(sa=>out.push(sa+restRoman)); }
    else out.push(chars.map(c=>romanizeHangulSyllable(c)||c).join(""));
    return [...new Set(out)];
  });
  // 단어별 후보를 조합 (상한 적용)
  let combos=[""];
  perWord.forEach((alts,i)=>{
    const next=[];
    combos.forEach(base=>alts.forEach(a=>{ if(next.length<max*3) next.push(i===0? a : base+" "+a); }));
    combos=next;
  });
  return [...new Set(combos.map(c=>c.trim()).filter(c=>c.length>=2))].slice(0,max);
}
// 로마자 -> 한글 후보 (최대 MAX). greedy 최장일치 분절.
function romanToHangulCandidates(str, max=3){
  if(hasHangul(str)) return [];
  const words=str.toLowerCase().replace(/[^a-z\s]/g," ").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return [];
  const keys=Object.keys(ROMAN_TO_HANGUL_SYL).filter(k=>!/\d/.test(k)).sort((a,b)=>b.length-a.length);
  const segWord=(w)=>{
    let i=0, parts=[];
    while(i<w.length){
      const hit=keys.find(k=>w.startsWith(k,i));
      if(!hit) return null;                // 하나라도 모르는 음절이 있으면 포기 (오탐 방지)
      parts.push(ROMAN_TO_HANGUL_SYL[hit]);
      i+=hit.length;
    }
    return parts;
  };
  const perWord=words.map(segWord);
  if(perWord.some(p=>p===null)) return [];
  let combos=[""];
  perWord.forEach((parts,wi)=>{
    let next=combos;
    parts.forEach(alts=>{
      const grown=[];
      next.forEach(base=>alts.forEach(a=>{ if(grown.length<max*4) grown.push(base+a); }));
      next=grown;
    });
    combos = wi===0 ? next : next;
  });
  return [...new Set(combos.filter(c=>c.length>=2))].slice(0,max);
}
// 입력 하나로 만들 수 있는 모든 검색 표기 후보. 원본이 항상 첫 번째(= 최우선).
function buildHyroxSearchVariants(q){
  const out=[q];
  hangulToRomanCandidates(q).forEach(v=>{ out.push(v); romanSpellingAlternates(v).forEach(a=>out.push(a)); });
  romanToHangulCandidates(q).forEach(v=>out.push(v));
  // 띄어쓰기 없이 붙여 쓴 표기도 흔하다 (kim sehee -> kimsehee)
  if(/\s/.test(q)) out.push(q.replace(/\s+/g,""));
  return [...new Set(out.map(v=>normalizeHyroxSearchText(v)).filter(v=>v && v.length>=2))].slice(0,8);
}

async function searchHyroxByName(query, limit=20){
  if(!HYROX_SEARCH_DB) await ensureHyroxSearchDb();
  const q=normalizeHyroxSearchText(query);
  if(q.length<2) return [];
  if(!sb) throw new Error("Supabase 연결이 초기화되지 않았습니다.");

  const safeLimit=Math.max(1,Math.min(Number(limit)||20,50));
  const variants=buildHyroxSearchVariants(q);
  const settled=await Promise.allSettled(variants.map(v=>
    sb.rpc("search_hyrox_results", { search_text:v, result_limit:safeLimit })));

  // 첫 번째(원본 표기) 호출이 에러면 그대로 던진다 — 연결 문제를 조용히 삼키지 않기 위해.
  const first=settled[0];
  if(first.status==="rejected") throw first.reason;
  if(first.value && first.value.error) throw first.value.error;

  const seen=new Set(), out=[];
  settled.forEach((res,vi)=>{
    if(res.status!=="fulfilled" || !res.value || res.value.error) return;
    (res.value.data||[]).forEach((row,ri)=>{
      const r=mapHyroxDbRow(row);
      // 같은 선수의 같은 대회 기록이 여러 표기 후보에서 중복으로 잡힐 수 있다.
      const key=[r.n,r.e,r.d,r.t,r.b].join("|");
      if(seen.has(key)) return;
      seen.add(key);
      // 원본 표기로 잡힌 결과를 항상 위로 (vi=0), 그 다음이 변환 표기.
      out.push({ r, i:out.length, score:vi*1000+ri,
        matchedVariant: vi===0? null : variants[vi] });
    });
  });
  out.sort((a,b)=>a.score-b.score);
  return out.slice(0,safeLimit).map((x,i)=>({...x, i}));
}

function hyroxSourceBadge(r){
  const parts=[r.e, r.d, r.g, r.a].filter(Boolean);
  return parts.join(" · ");
}

// doc7 §3 fix: "불러옴" previously just wrote silently into a draft (RC_PREFILL) with a toast,
// with no visible confirmation step — on the mobile 기록 page in particular, there was no
// "기록 추가" button anywhere nearby to actually finish the save, so the record was never
// written to STATE.races even though the toast implied success. Now this only stages a
// confirmation-modal draft (HYROX_IMPORT_DRAFT); STATE.races is untouched until the user
// explicitly presses "기록 추가" inside that modal (see renderHyroxImportConfirmModal below).
let HYROX_IMPORT_DRAFT = null;
// user request: HYROX 기록 가져오기에서 division이 "Open Doubles"로 저장돼 있어도 실제 gender가
// "Mixed"라면 Mixed Doubles로 등록되어야 한다 — 일부 원본 데이터가 Doubles를 성별 구분 없이 뭉뚱그려
// "Open Doubles"로만 저장해 둔 경우를 가져오기 시점에 바로잡는다. Open Doubles가 아니거나 gender가
// Mixed가 아니면 원래 division을 그대로 유지한다.
function reconcileDivisionWithGender(division, genderRaw){
  const g=String(genderRaw||"").trim().toLowerCase();
  if(division==="Open Doubles" && g.includes("mixed")) return "Mixed Doubles";
  return division;
}
function importHyroxDbRecord(index){
  const item=HYROX_DB_RESULTS?.[index];
  const r=item?.r;
  if(!r) return;
  const runs={};
  RUN_KEYS.forEach((k,i)=>{ runs[k]=r.u?.[i]||""; });
  const stations={};
  STATIONS.forEach((s,i)=>{ stations[s.key]=r.s?.[i]||""; });
  // 요청: 데이터에 이미 대회 시작일(start_date)이 있으니, 검색 결과에서 불러올 때 날짜도 함께
  // 자동으로 채워준다 — mapHyroxDbRow()가 이미 r.dt(=start_date, 없으면 다른 날짜 필드로 폴백)를
  // 만들어두고 있었는데, 이 함수가 그 값을 쓰지 않고 항상 빈 문자열로 덮어쓰고 있던 게 원인이었다.
  // 형식이 YYYY-MM-DD가 아니면(예전 데이터라 날짜가 없거나 이상한 값인 경우) 안전하게 비워두고
  // 기존처럼 직접 입력하도록 한다 — 잘못된 날짜를 추측해서 채우지 않는다.
  const validDate = r.dt && /^\d{4}-\d{2}-\d{2}$/.test(r.dt) ? r.dt : "";
  HYROX_IMPORT_DRAFT = {
    name:r.n||"",
    date:validDate,
    division:reconcileDivisionWithGender(r.d||DIVISIONS[0], r.g),
    officialTime:r.t||"",
    runs, stations, transition:r.z||"",
    share:{},
    _fromHyroxDb:true,
    _hyroxSource:r.e||"",
    _hyroxAge:r.a||"",
    _hyroxGender:r.g||"",
    _hyroxRank:r.rk||"",
    _hyroxBib:r.b||"",
    _hyroxDateFromDb: !!validDate,
  };
  HYROX_DB_SELECTED=index;
  renderHyroxImportConfirmModal();
  openModal();
}
function hyroxImportConfirmRow(label, value){

}
function renderHyroxImportConfirmModal(){

  if(!d){ closeModal(); return; }

    </div>
  `;
  const discard=()=>{ HYROX_IMPORT_DRAFT=null; HYROX_DB_SELECTED=null; closeModal(); };
  panel.querySelector("#hic-close").addEventListener("click", discard);
  panel.querySelector("#hic-cancel").addEventListener("click", discard);
  panel.querySelector("#hic-date").addEventListener("change", e=>{ d.date=e.target.value; d._hyroxDateFromDb=false; });
  panel.querySelector("#hic-confirm").addEventListener("click", ()=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){ showToast("대회 날짜를 YYYY-MM-DD 형식으로 입력해주세요"); return; }
    RC_SOURCE_TYPE="HYROX_DATABASE";

    const data={...d};
    HYROX_IMPORT_DRAFT=null; HYROX_DB_SELECTED=null;

    HYROX_DB_QUERY=""; HYROX_DB_RESULTS=[];

    // end up writing to STATE.races identically.
    if(raceDuplicateExists(data)){ showRaceDuplicateConfirm(data); return; }
    closeModal();

function bindHyroxNameSearch(wrap){
  const input=wrap.querySelector("#hyrox-name-search");
  const btn=wrap.querySelector("#hyrox-name-search-btn");
  const runSearch=async()=>{
    const q=input?.value.trim()||"";
    HYROX_DB_QUERY=q;
    if(q.length<2){
      HYROX_DB_RESULTS=[];
      const st=wrap.querySelector("#hyrox-db-status");
      if(st) st.textContent="이름을 2글자 이상 입력해주세요.";
      const rs=wrap.querySelector("#hyrox-name-results");
      if(rs) rs.innerHTML="";
      return;
    }
    try{
      if(!hyroxDbReady()) await ensureHyroxSearchDb();
      HYROX_DB_RESULTS=await searchHyroxByName(q,20);
      renderAll();
    }catch(e){
      const st=wrap.querySelector("#hyrox-db-status");
      if(st){ st.style.color="var(--red)"; st.textContent="Supabase 백데이터를 불러오지 못했습니다: "+(e.message||e); }
    }
  };
  btn?.addEventListener("click",runSearch);
  input?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); runSearch(); }});
  wrap.querySelectorAll("[data-hyrox-import]").forEach(b=>{
    b.addEventListener("click",()=>importHyroxDbRecord(Number(b.dataset.hyroxImport)));
  });
  if(!HYROX_SEARCH_DB){
    ensureHyroxSearchDb().then(()=>{
      // This card is shared by both the 기록(myrecord) page and the races input page — re-render
      // on whichever one is actually showing, not just "races", or the other page's card stays
      // stuck showing "연결하는 중…" even after the connection finishes in the background.
      const onHostPage = CURRENT_PAGE==="races" || CURRENT_PAGE==="myrecord";
      if(HYROX_DB_QUERY && HYROX_DB_QUERY.trim().length>=2){
        searchHyroxByName(HYROX_DB_QUERY,20).then(r=>{
          HYROX_DB_RESULTS=r;
          if(onHostPage) renderAll();
        });
      } else if(onHostPage) renderAll();
    }).catch(e=>{
      const st=wrap.querySelector("#hyrox-db-status");
      if(st){ st.style.color="var(--red)"; st.textContent="Supabase 백데이터 연결 실패: "+(e.message||e); }
    });
  }
}

function readRaceForm(wrap, prefix){
  const runs={}, stations={}, share={};
  RUN_KEYS.forEach(k=>{ runs[k]=wrap.querySelector(`#${prefix}-run${k}`).value.trim(); });
  STATIONS.forEach(s=>{ stations[s.key]=wrap.querySelector(`#${prefix}-st-${s.key}`).value.trim();
    const shEl=wrap.querySelector(`#${prefix}-share-${s.key}`); if(shEl && shEl.value!=="") share[s.key]=shEl.value; });
  return { name:wrap.querySelector(`#${prefix}-name`).value.trim(), date:wrap.querySelector(`#${prefix}-date`).value||"",
    division:wrap.querySelector(`#${prefix}-div`).value, officialTime:wrap.querySelector(`#${prefix}-time`).value.trim(),
    runs, stations, transition:wrap.querySelector(`#${prefix}-trans`).value.trim(), share,
    _fromHyroxDb: prefix==="rc" && !!RC_PREFILL?._fromHyroxDb,
    _hyroxSource: prefix==="rc" ? (RC_PREFILL?._hyroxSource||"") : "",
    _hyroxAge: prefix==="rc" ? (RC_PREFILL?._hyroxAge||"") : "",
    _hyroxGender: prefix==="rc" ? (RC_PREFILL?._hyroxGender||"") : "",
    _hyroxRank: prefix==="rc" ? (RC_PREFILL?._hyroxRank||"") : "",
    _hyroxBib: prefix==="rc" ? (RC_PREFILL?._hyroxBib||"") : "" };
}
function bindRaceDivToggle(wrap, prefix){
  wrap.querySelector(`#${prefix}-div`)?.addEventListener("change",(e)=>{
    const w=wrap.querySelector(`#${prefix}-share-wrap`); if(w) w.style.display=e.target.value.includes("Doubles")?"block":"none";
  });
}

let RACES_TAB = "input";
function renderRaces(wrap){
  wrap.innerHTML = `
    <div><div class="eyebrow">DATA INPUT · ② HYROX RESULTS</div><h1 class="page-title">HYROX 대회 기록</h1></div>
    <div class="tabs">

      <div class="tab ${RACES_TAB==="log"?"active":""}" data-races-tab="log">기록 (${STATE.races.length})</div>
    </div>
    <div id="races-tab-body"></div>
  `;
  wrap.querySelectorAll("[data-races-tab]").forEach(t=>t.addEventListener("click",()=>{ RACES_TAB=t.dataset.racesTab; renderAll(); }));
  const body=wrap.querySelector("#races-tab-body");
  if(RACES_TAB==="log") renderRacesLogTab(body);
  else renderRacesInputTab(body);
}
function renderRacesInputTab(wrap){
  // spec: switching to another app can fully reload the mobile page — RC_PREFILL being null here
  // (a fresh in-memory session) is the signal to check for a persisted draft and restore it.
  if(RC_PREFILL===null){ const saved=loadLocalDraft("raceEntry"); if(saved){ RC_PREFILL=saved; showToast("이전에 작성 중이던 기록을 불러왔습니다"); } }
  wrap.innerHTML = `
    ${renderHyroxNameSearchCard()}
    ${renderOcrImportCard()}
    <div class="card">
      <div class="row-between"><h2 class="section-title">기록 추가</h2></div>
      ${raceFormFields("rc", RC_PREFILL, RC_OCR_CONF)}
      <div style="margin-top:14px;"><button class="btn" id="rc-add">기록 추가</button></div>
    </div>
  `;
  bindHyroxNameSearch(wrap);
  bindOcrImportCard(wrap);
  bindRaceDivToggle(wrap,"rc");
  // spec: manual typing was lost when navigating to another tab and back, because nothing wrote it
  // back into RC_PREFILL (only OCR results did). Every field change now syncs the whole form's
  // current values into RC_PREFILL, so the next renderRacesInputTab() call (including after
  // navigating away and back) restores exactly what was typed — and now also persists to
  // localStorage so it survives a true page reload (e.g. mobile OS reloading a backgrounded tab).
  wrap.querySelectorAll('[id^="rc-"]').forEach(el=>{
    if(el.tagName==="BUTTON") return;
    el.addEventListener("change", ()=>{ RC_PREFILL = readRaceForm(wrap,"rc"); saveLocalDraft("raceEntry", RC_PREFILL); });
  });
  wrap.querySelector("#rc-add")?.addEventListener("click",()=>{
    const data=readRaceForm(wrap,"rc");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(data.date)){ showToast("대회 날짜를 YYYY-MM-DD 형식으로 입력해주세요"); return; }
    if(!parseTimeToSec(data.officialTime)){ showToast("공식 기록을 mm:ss 또는 h:mm:ss 형식으로 입력해주세요"); return; }
    if(raceDuplicateExists(data)){ showRaceDuplicateConfirm(data); return; }
    finalizeAddRace(data);
  });
}
function raceDuplicateExists(data, excludeId){
  return STATE.races.some(r=> r.id!==excludeId
    && (r.name||"").trim().toLowerCase()===(data.name||"").trim().toLowerCase()
    && r.date===data.date
    && (r.officialTime||"").trim()===(data.officialTime||"").trim());
}
function showRaceDuplicateConfirm(data){
  const panel=document.getElementById("modal-panel");
  panel.innerHTML = `
    <div class="modal-head"><div style="font-family:var(--font-display);font-weight:800;font-size:18px;">중복 가능성이 있는 기록이에요</div><span class="modal-close" id="dup-close">✕</span></div>
    <p class="lead" style="margin:10px 0 16px;">같은 대회명·날짜·기록을 가진 항목이 이미 등록되어 있습니다. 그래도 새 기록으로 추가할까요?</p>
    <div class="hstack" style="gap:10px;">
      <button class="btn sm" id="dup-confirm">그래도 추가</button>
      <button class="btn sm ghost" id="dup-cancel">취소</button>
    </div>
  `;
  openModal();
  panel.querySelector("#dup-confirm")?.addEventListener("click",()=>{ closeModal(); finalizeAddRace(data); });
  panel.querySelector("#dup-cancel")?.addEventListener("click",()=>{ closeModal(); });
  panel.querySelector("#dup-close")?.addEventListener("click",()=>{ closeModal(); });
}
function finalizeAddRace(data){
  const now=new Date().toISOString();
  STATE.races.push({ id:uid(), ...data, source_type: RC_SOURCE_TYPE||"USER_ENTERED", created_at:now, updated_at:now });
  RACES_TAB="log";
  RC_PREFILL=null; RC_OCR_CONF=null; RC_SOURCE_TYPE=null; OCR_STATE=defaultOcrState(); OCR_RAW_OPEN=false;
  clearLocalDraft("raceEntry");
  // Critical UX fix: show the newly added record immediately. Analytics/sync must never block
  // the navigation/render path, and a failure in snapshot calculation must not make the record
  // appear to have failed when it was already added to STATE.
  renderAll();
  showToast("대회 기록이 추가되었습니다");
  persistNow().catch(e=>console.warn("Immediate race save failed:", e));
}
function renderRacesLogTab(wrap){

          <td style="white-space:nowrap;"><span class="list-remove" data-del-race="${r.id}">✕</span></td></tr>`).join("")}</tbody></table></div>`
        : `<div class="empty-note">등록된 대회 기록이 없습니다 — "입력" 탭에서 추가해보세요</div>`}
    </div>
    ${expandedRace ? `<div class="card" style="border:1px solid var(--orange-dim);">
      <div class="row-between"><h2 class="section-title">기록 수정 — ${escapeHtml(expandedRace.name||expandedRace.date)}</h2></div>
      ${raceFormFields("ed", expandedRace)}
      <div class="hstack" style="margin-top:14px; gap:10px;">
        <button class="btn sm" id="ed-save">저장</button>
        <button class="btn sm ghost" id="ed-cancel">취소</button>
        <button class="btn sm danger" id="ed-delete">이 기록 삭제</button>
      </div>
    </div>` : ""}
  `;
  bindRaceDivToggle(wrap,"ed");
  wrap.querySelectorAll("[data-view-race]").forEach(b=>b.addEventListener("click",()=>{
    EXPANDED_RACE_ID = EXPANDED_RACE_ID===b.dataset.viewRace ? null : b.dataset.viewRace;

/* 19. CSV IMPORT (Garmin Connect-style export) — no AI, pure parsing       */
/* ---------------------------------------------------------------------- */
function parseCSV(text){
  // RFC4180-ish parser: handles quoted fields with embedded commas/newlines/escaped quotes.
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==""));
}

/* 5g. V3 — QUALITATIVE FEASIBILITY LABELS (spec §7, §23, §40)             */
/*     "달성확률 78%"처럼 calibration되지 않은 숫자를 실제 확률처럼 보여주지  */
/*     않는다. 내부적으로는 여전히 0-100 스코어를 계산해 정렬/임계값 판단에   */
/*     쓰지만, 사람에게 보여주는 건 항상 🟢/🟡/🟠/🔴 정성 라벨 + 근거뿐이다. */
/* ---------------------------------------------------------------------- */
function probToQualLabel(prob){
  if(prob>=72) return { emoji:"🟢", label:"높은 가능성" };
  if(prob>=48) return { emoji:"🟡", label:"현실적 도전" };
  if(prob>=25) return { emoji:"🟠", label:"공격적 목표" };
  return { emoji:"🔴", label:"현재 데이터 기준 어려움" };
}
// 예상 순위 (근사치). computePodiumComparisonGroup()이 노출하는 benchmark.fieldTimes(비교군 전체
// 유효 기록)와 benchmark.avgFieldSize(비교군에 포함된 대회들의 평균 완주 인원)를 이용한다.
// 백분위(전체 필드 대비 이 기록보다 느린 참가자 비율)는 실제 데이터 그대로라 정확하지만, 그걸
// "N위"라는 절대 순위로 바꾸는 과정은 대회마다 참가자 수가 다르다는 걸 평균으로 근사하는 것이므로
// 참고용입니다 — UI에서 반드시 "근사치"라고 표시해야 합니다.
function computePodiumRankEstimate(predictedSec, ciLow, ciHigh, benchmark){
  const times=benchmark?.fieldTimes, avgFieldSize=benchmark?.avgFieldSize;
  if(!times || !times.length || !avgFieldSize) return null;
  const percentileAt = sec => (times.filter(t=>t>sec).length/times.length)*100;
  const rankAt = sec => Math.max(1, Math.round((1-percentileAt(sec)/100)*avgFieldSize)+1);
  const rankA=rankAt(ciLow), rankB=rankAt(ciHigh);
  return {
    percentile: percentileAt(predictedSec),
    rankLow: Math.min(rankA,rankB), rankHigh: Math.max(rankA,rankB),
    n: times.length, avgFieldSize
  };
}
// general momentum read (NOT tied to a specific target) — driven directly by the measured HPI
// trend rather than an invented "improvement probability %".
// the "근거" bullet list that must always accompany a qualitative feasibility label (spec §7 example
// format) — built entirely from numbers already computed elsewhere (Target Gap Decomposition §5,
// Training Priority §9, HPI trend), nothing invented for the purpose of this list.
function buildGoalFeasibilityReasons(plan){
  // PRODUCTION: Goal Setting is Race-only. Never call HPI/Recovery/Training/Body-metric engines here.
  const reasons=[];
  reasons.push(plan.weeksToRace!=null ? `대회까지 ${Math.round(plan.weeksToRace)}주` : "대회 날짜 미설정");
  reasons.push(`현재 예상 기록 ${fmtTime(plan.currentSec)} (${plan.baselineSource})`);
  reasons.push(plan.totalGapSec>0 ? `목표 Gap ${fmtTime(plan.totalGapSec)}` : "이미 목표 기록 이내");
  reasons.push(`목표 Division ${plan.milestoneDivision||"—"} 기준 Race-only 계산`);
  if(plan.totalGapSec>0){
    reasons.push(`Run/Station/Roxzone으로 목표 Gap을 분해해 표시`);
  }
  return reasons;
}

  wrap.querySelector("#goal-station-detail")?.addEventListener("click",async()=>{
    const panel=wrap.querySelector("#goal-station-detail-panel");
    const detailBtn=wrap.querySelector("#goal-station-detail");
    if(!panel) return;
    if(detailBtn?.dataset.loading==="1") return;
    if(detailBtn){
      detailBtn.dataset.loading="1";

      detailBtn.innerHTML=`<span class="hps-podium-spinner" style="display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;border-width:2px;"></span>분석 중...`;

    panel.innerHTML=`<div class="empty-note" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;"><span class="hps-podium-spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;"></span><span>분석 중입니다...</span></div>`;
    try{
      const goalDiv=effectiveGoalDiv;

      // raceOnlyPrediction()의 최종 total은 sparse cross-division일 때 공식 총기록 anchor로

      // resolveUnifiedPerformance()의 segment 값을 직접 사용한다.
      // Station detail must use the SAME target-Division basis on both sides.
      // If the athlete only has Mixed Doubles and the target is Singles (Open/Pro),
      // bridge through the corresponding gendered Doubles division, then apply the
      // existing empirical Doubles -> Singles conversion. This is local to Goal >
      // Station Detail and does not change the main Race-only engine.
      const stationBridgeDiv = goalDiv==="Open" ? "Open Doubles" : goalDiv==="Pro" ? "Pro Doubles" : null;
      const directUnified=resolveUnifiedPerformance(goalDiv);
      const bridgeUnified=stationBridgeDiv ? resolveUnifiedPerformance(stationBridgeDiv) : null;
      const stationGender=upv4NormGender(effectiveGoalGender);
      // STATIONS UI keys와 Race-only Unified Performance segment keys는 일부 이름이 다릅니다.
      // (burpee→bbj, carry→farmers, lunge→lunges, wallball→wallBalls)
      // 이 매핑이 빠지면 해당 4개 Station만 조회에서 탈락해 화면에 4개만 표시됩니다.
      const stationSegmentKey={
        ski:"ski", sledPush:"sledPush", sledPull:"sledPull", burpee:"bbj",
        row:"row", carry:"farmers", lunge:"lunges", wallball:"wallBalls"
      };
      const stationSegValue=(segKey)=>{
        const engineKey=stationSegmentKey[segKey]||segKey;
        const direct=Number(directUnified?.segments?.[engineKey]?.value);
        if(Number.isFinite(direct)&&direct>0) return direct;
        const bridged=Number(bridgeUnified?.segments?.[engineKey]?.value);
        if(!Number.isFinite(bridged)||bridged<=0||!stationBridgeDiv){
          return getRaceOnlyBenchmarkSegmentSec(goalDiv,engineKey);
        }
        const conv=upv4Conversion(stationGender,stationBridgeDiv,goalDiv,engineKey);
        if(Number.isFinite(Number(conv?.multiplier))) return bridged*Number(conv.multiplier);
        // Match raceOnlyPrediction(): if cross-Division station evidence is unavailable,
        // use the target-Division benchmark fallback. If the derived benchmark table does not
        // contain this station, use the existing BENCH table as the final display-only fallback
        // so all 8 HYROX Stations remain visible in Goal Gap > Station Detail.
        const derivedFallback=getRaceOnlyBenchmarkSegmentSec(goalDiv,engineKey);
        if(Number.isFinite(derivedFallback)&&derivedFallback>0) return derivedFallback;
        const benchKey={bbj:"burpee",farmers:"carry",lunges:"lunge",wallBalls:"wallball"}[engineKey]||engineKey;
        const targetBench=BENCH[goalDiv] || BENCH.Open;
        const benchSec=Number(targetBench?.[benchKey]);
        return Number.isFinite(benchSec)&&benchSec>0 ? benchSec : null;
      };
      const segs=STATIONS.map(st=>({
        key:st.key,
        label:st.label,
        unit:st.unit,
        currentSec:stationSegValue(st.key)
      })).filter(x=>Number.isFinite(x.currentSec)&&x.currentSec>0);
      if(!segs.length){
        panel.innerHTML=`<div class="empty-note">Station별 Race-only 예상시간 데이터를 찾을 수 없습니다.</div>`;
        if(detailBtn){ detailBtn.dataset.loading="0"; detailBtn.disabled=false; detailBtn.innerHTML="Station 상세"; detailBtn.style.opacity=""; }
        return;
      }

      // DNA 약점은 목표 Division/동일 Age Group 컨텍스트에서 별도로 조회한다.
      let peer=null;
      try{
        peer=withDivisionContext(goalDiv,()=>computePeerAnalysis(true));
      }catch(e){ console.warn("[Goal Station Detail] DNA analysis unavailable",e); }
      const dnaMap=new Map((peer?.segments||[]).map(x=>[x.key,Number(x.percentile)]));

      // Station 상세는 사용자가 바로 이해할 수 있도록
      // "각 Station에서 몇 초/몇 분 줄이면 되는가"만 계산한다.
      // 포디움 3위의 특정 기록을 화면/계산의 하한선으로 사용하지 않는다.
      // 목표 Gap 중 Station에 배정된 시간(plan.decomposition.station)을
      // DNA 약점 + 현재 Station 소요시간에 비례하여 나눈다.
      // → 약점(percentile이 낮음)이면서 시간이 많이 걸리는 Station에 더 많은 개선량.
      const rows=segs.map(seg=>{
        const pct=Number.isFinite(dnaMap.get(seg.key))?dnaMap.get(seg.key):null;
        const weakness=pct!=null?Math.max(1,100-pct):1;
        // 현재 시간이 긴 Station일수록 실제 기록에서 줄일 수 있는 절대량이 더 큼.
        const durationWeight=Math.max(1,Number(seg.currentSec)||1);
        return {...seg,pct,weakness,durationWeight,improve:0};
      });

      const totalStationGap=Math.max(0,Math.abs(plan.decomposition.station));
      const weightedTotal=rows.reduce((a,r)=>a+(r.weakness*r.durationWeight),0);
      if(totalStationGap>0 && weightedTotal>0){
        rows.forEach(r=>{
          r.improve=totalStationGap*(r.weakness*r.durationWeight)/weightedTotal;
        });
      }

      // 한 Station에 전체 Station Gap이 몰리는 것을 방지하는 안전장치.
      // 각 Station의 개선 목표는 현재 기록의 40%를 넘지 않도록 제한하고,
      // 남는 시간은 다른 Station에 다시 비례 배분한다.
      let remaining=totalStationGap-rows.reduce((a,r)=>a+r.improve,0);
      for(let pass=0;pass<8 && remaining>0.5;pass++){
        const room=rows.filter(r=>r.currentSec*0.4-r.improve>0.5);
        if(!room.length) break;
        const w=room.reduce((a,r)=>a+(r.weakness*r.durationWeight),0);
        if(w<=0) break;
        let added=0;
        room.forEach(r=>{
          const cap=Math.max(0,r.currentSec*0.4-r.improve);
          const add=Math.min(cap,remaining*(r.weakness*r.durationWeight)/w);
          if(add>0){r.improve+=add;added+=add;}
        });
        if(added<=0.01) break;
        remaining=Math.max(0,totalStationGap-rows.reduce((a,r)=>a+r.improve,0));
      }

      rows.sort((a,b)=>b.improve-a.improve);
      const used=rows.reduce((a,r)=>a+r.improve,0);

      panel.innerHTML=`<div class="card tight" style="background:var(--surface2);">
        <div style="font-size:13px;font-weight:800;margin-bottom:4px;">Station별 개선 목표</div>
        <p class="reason-line" style="margin-bottom:10px;">각 Station에서 몇 분·몇 초를 줄이면 되는지 보여줍니다. DNA 약점이 큰 Station일수록 더 많은 개선량을 배분합니다.</p>
        ${rows.map((r,i)=>`<div style="padding:9px 0;${i<rows.length-1?'border-bottom:1px solid var(--line);':''}">
          <div class="row-between"><div style="font-size:13px;font-weight:700;">${escapeHtml(r.label)}</div><div class="mono" style="font-size:12px;color:${r.pct!=null&&r.pct<50?'var(--red)':'var(--gray)'};">${r.pct!=null?`DNA ${round1(r.pct)}`:'DNA —'}</div></div>
          <div class="hstack" style="margin-top:5px;gap:8px;"><span class="mono" style="width:58px;font-size:11px;">현재 ${fmtTime(r.currentSec)}</span><div class="bar-track"><div class="bar-fill" style="width:${clamp(r.currentSec?((r.improve/Math.max(1,r.currentSec))*100):0,2,100)}%;background:var(--orange);"></div></div><span class="mono" style="width:68px;text-align:right;color:var(--orange);">-${fmtTime(r.improve)}</span></div>
          <div class="reason-line" style="margin-top:3px;">목표 ${fmtTime(Math.max(0,r.currentSec-r.improve))} · 개선 필요 ${fmtTime(r.improve)}</div>
        </div>`).join("")}
        <div class="divider" style="margin:10px 0;"></div>
        <div class="row-between"><span style="font-size:12px;font-weight:700;">Station 개선 배분</span><span class="mono" style="font-weight:800;">약 ${fmtTime(used)}</span></div>
        <p class="reason-line" style="margin-top:5px;">Station에서 줄여야 하는 총 시간은 약 ${fmtTime(used)}입니다.</p>
      </div>`;
      if(detailBtn){ detailBtn.dataset.loading="0"; detailBtn.disabled=false; detailBtn.innerHTML="Station 상세"; detailBtn.style.opacity=""; }
    }catch(e){
      console.error("[Goal Station Detail Error]",e);
      panel.innerHTML=`<div class="empty-note">Station 상세 분석을 불러오지 못했습니다. 입력한 목표와 기록은 유지됩니다.</div>`;
      if(detailBtn){ detailBtn.dataset.loading="0"; detailBtn.disabled=false; detailBtn.innerHTML="Station 상세"; detailBtn.style.opacity=""; }
    }
  });
  wrap.querySelector("#goal-save")?.addEventListener("click",()=>{
    const targetTimeValue=wrap.querySelector("#goal-time")?.value.trim()||"";
    if(!parseTimeToSec(targetTimeValue)){ showToast("목표 기록을 1:24:00 형식으로 입력해주세요"); wrap.querySelector("#goal-time")?.focus(); return; }
    STATE.profile.goalDivision=wrap.querySelector("#goal-target-division")?.value||"Open Doubles";
    STATE.profile.targetTime=targetTimeValue;
    STATE.profile.targetDate=wrap.querySelector("#goal-date")?.value.trim()||"";
    const age=wrap.querySelector("#goal-age-group")?.value;
    if(age!=null) STATE.profile.goalAgeGroup=age===getAgeGroup(Number(STATE.profile.age))?"":age;
    persist(); showToast("목표가 저장되었습니다"); renderAll();
  });
}

/* ---------------------------------------------------------------------- */
/* 19b. DOUBLES TEAM ENGINE                                                */
/*     Completely separate from the Singles engine above: never reads or   */
/*     writes STATE.races, never touches computePeerAnalysis/HPI. Reuses   */
/*     resolveUnifiedPerformance()/raceOnlyPrediction()/                   */
/*     raceOnlyOfficialTimeAnchors() through their new options.races/      */
/*     forceGender/age overrides — same conversion, same tier-floor, same  */
/*     Mixed-Doubles-bridge, same Full-Simulation-blend logic a Singles    */
/*     athlete gets, just resolved against the partner's own data bundle   */
/*     instead of STATE.                                                   */
/* ---------------------------------------------------------------------- */
let GOAL_DOUBLES_MANUAL_MODE = false;
let DOUBLES_PARTNER_SEARCH_QUERY = "";
let DOUBLES_PARTNER_SEARCH_RESULTS = [];
let DOUBLES_PARTNER_MANUAL_DRAFT = null;

// Same-gender pair -> the user's explicit Open/Pro choice decides the tier. Different-gender pair
// -> always Mixed Doubles (this app's DIVISIONS has no separate Open/Pro Mixed tier), so the tier
// choice doesn't apply/isn't shown.
function deriveDoublesTeamDivision(myGender, partnerGender, selectedTier){
  const same = upv4NormGender(myGender)===upv4NormGender(partnerGender);
  if(!same) return "Mixed Doubles";
  return selectedTier==="Pro" ? "Pro Doubles" : "Open Doubles";
}

// Station reps split by role (default 50:50, STATE.doublesTeam.splitPct overrides per station).
// Running (and, for lack of any spec'd alternative, Roxzone transition time — both are "moving as a
// team" segments rather than divisible work) are NOT split: the team is bound by whichever partner
// is slower, so the combined value is the SLOWER (larger) of the two individually-resolved values.
function computeDoublesTeamPrediction(){
  const partner=STATE.doublesPartner;
  if(!partner) return null;
  const sameGender = upv4NormGender(STATE.profile.gender)===upv4NormGender(partner.gender);
  const selectedTier = STATE.doublesTeam.division;
  if(sameGender && !selectedTier) return { needsTierChoice:true, sameGender, teamDivision:null };
  const teamDivision = deriveDoublesTeamDivision(STATE.profile.gender, partner.gender, selectedTier);

  const myPred = raceOnlyPrediction(teamDivision);
  const partnerAge = Number(partner.age);
  const partnerPred = raceOnlyPrediction(teamDivision, {
    races: partner.races||[],
    simulations: partner.simulationTests||[],
    running: partner.running||{},
    forceGender: upv4NormGender(partner.gender),
    age: Number.isFinite(partnerAge) && partnerAge>0 ? partnerAge : null,
  });

  const splitPct = STATE.doublesTeam.splitPct||{};
  const order=["runTotal","ski","sledPush","sledPull","bbj","row","farmers","lunges","wallBalls","roxzone"];
  const SHARED=new Set(["runTotal","roxzone"]);
  const myMap=Object.fromEntries(myPred.parts.map(p=>[p.segment,p]));
  const partnerMap=Object.fromEntries(partnerPred.parts.map(p=>[p.segment,p]));
  const parts=order.map(seg=>{
    const mine=myMap[seg], theirs=partnerMap[seg];
    if(!mine || !theirs) return null; // missing on either side (rare — no benchmark coverage at all)
    if(SHARED.has(seg)){
      const value=Math.max(mine.value, theirs.value);
      return { segment:seg, value, mode:"shared-slower", mySec:mine.value, partnerSec:theirs.value, mySource:mine.source, partnerSource:theirs.source };
    }
    const stationKey=UPV4_SEGMENT_TO_STATION_KEY[seg];
    const myPct=(splitPct[stationKey]!=null ? Number(splitPct[stationKey]) : 50)/100;
    const value=mine.value*myPct + theirs.value*(1-myPct);
    return { segment:seg, value, mode:"split", myPct:myPct*100, mySec:mine.value, partnerSec:theirs.value, mySource:mine.source, partnerSource:theirs.source };
  }).filter(Boolean);

  const predicted=parts.reduce((s,x)=>s+x.value,0);
  // Team uncertainty range: conservatively add both members' own half-widths (from their
  // individually-resolved raceOnlyPrediction confidence) rather than inventing a new model —
  // the team can never be MORE certain than either member's own individual prediction is.
  const myHalfWidth = myPred.ciHigh - myPred.predicted;
  const partnerHalfWidth = partnerPred.ciHigh - partnerPred.predicted;
  const halfWidth = myHalfWidth + partnerHalfWidth;
  const ciLow = Math.max(0, predicted - halfWidth);
  const ciHigh = predicted + halfWidth;
  const CONF_RANK={LOW:0,MEDIUM:1,HIGH:2};
  const confidence = CONF_RANK[myPred.confidence] <= CONF_RANK[partnerPred.confidence] ? myPred.confidence : partnerPred.confidence;
  return { needsTierChoice:false, sameGender, teamDivision, predicted, ciLow, ciHigh, confidence, parts, myPred, partnerPred };
}

// Team Age Group for the Doubles Podium DB comparison: average of both athletes' ages by default
// (STATE.doublesTeam.ageGroup lets the user override this with an explicit choice instead).
function computeDoublesTeamAgeGroup(){
  if(STATE.doublesTeam.ageGroup) return STATE.doublesTeam.ageGroup;
  const partner=STATE.doublesPartner;
  const myAge=Number(STATE.profile.age);
  const partnerAge=Number(partner?.age);
  if(Number.isFinite(myAge) && myAge>0 && Number.isFinite(partnerAge) && partnerAge>0){
    return getAgeGroup(Math.round((myAge+partnerAge)/2));
  }
  return getAgeGroup(myAge); // partner age unknown (e.g. HPS-search-imported without a numeric age) — fall back to my own
}

// Doubles Podium: reuses computePodiumBenchmark()/computePodiumProbability()/probToQualLabel() —
// the exact same real-participant-DB comparison the Singles engine uses — filtered by the TEAM's
// division/ageGroup instead of the individual athlete's. Gender is irrelevant for Mixed Doubles
// (computePodiumComparisonGroup already ignores it for that division), so passing either is fine.
async function computeDoublesTeamPodium(){
  const teamResult=computeDoublesTeamPrediction();
  if(!teamResult || teamResult.needsTierChoice) return null;
  const ageGroup=computeDoublesTeamAgeGroup();
  const genderForFilter=upv4NormGender(STATE.profile.gender);
  const benchmark=await computePodiumBenchmark(null, teamResult.teamDivision, genderForFilter, ageGroup);
  const base={ teamDivision:teamResult.teamDivision, predicted:teamResult.predicted, ageGroup, benchmark };
  if(benchmark.scope==="insufficient") return { ...base, status:"insufficient" };
  const cutoff=benchmark.podium[Math.min(2, benchmark.podium.length-1)];
  const probability=computePodiumProbability(teamResult.predicted, teamResult.ciLow, teamResult.ciHigh, cutoff);
  const rankEstimate=computePodiumRankEstimate(teamResult.predicted, teamResult.ciLow, teamResult.ciHigh, benchmark);
  return { ...base, status:"ok", cutoff, probability, qual:probToQualLabel(probability), gapSec:teamResult.predicted-cutoff, rankEstimate };
}

function bindDoublesSplitSection(wrap){
  wrap.querySelectorAll("[data-dbl-split-mode]").forEach(chip=>chip.addEventListener("click",()=>{
    const mode=chip.dataset.dblSplitMode;
    STATE.doublesTeam.splitMode=mode;
    if(mode==="default") STATE.doublesTeam.splitPct={}; // reset to a clean 50:50 — no stale custom values left lurking
    DOUBLES_PODIUM_SHOWN=false; DOUBLES_PODIUM_RESULT=null; // prediction changed — old podium result no longer applies
    persist(); renderAll();
  }));
  wrap.querySelectorAll("[data-dbl-split-station]").forEach(slider=>{
    slider.addEventListener("input",()=>{
      // live-update the label while dragging, without a full re-render (keeps the slider itself
      // from losing focus/position mid-drag)
      const row=slider.previousElementSibling;
      const key=slider.dataset.dblSplitStation;
      const stLabel=STATIONS.find(s=>s.key===key)?.label||key;
      const partnerName=STATE.doublesPartner?.name||"파트너";
      if(row) row.innerHTML=`<span style="font-size:12.5px;font-weight:700;">${escapeHtml(stLabel)}</span><span class="reason-line">나 ${slider.value}% · ${escapeHtml(partnerName)} ${100-Number(slider.value)}%</span>`;
    });

      STATE.doublesTeam.splitPct[slider.dataset.dblSplitStation]=Number(slider.value);
      DOUBLES_PODIUM_SHOWN=false; DOUBLES_PODIUM_RESULT=null;
      persist(); renderAll();
    });
  });
}

function renderDoublesPartnerSearchResults(){

  // Group by athlete name — picking any one result imports ALL of that same name's races found.
  const byName=new Map();

function bindDoublesPartnerSearch(wrap){
  const input=wrap.querySelector("#dbl-partner-search");
  const btn=wrap.querySelector("#dbl-partner-search-btn");
  const runSearch=async()=>{
    const q=input?.value.trim()||"";
    DOUBLES_PARTNER_SEARCH_QUERY=q;
    if(q.length<2){
      DOUBLES_PARTNER_SEARCH_RESULTS=[];
      const st=wrap.querySelector("#dbl-partner-status");
      if(st) st.textContent="이름을 2글자 이상 입력해주세요.";

      if(st){ st.style.color="var(--red)"; st.textContent="검색 실패: "+(e.message||e); }

  };

  input?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); runSearch(); }});

function pickDoublesPartnerFromSearch(name){
  const rows=DOUBLES_PARTNER_SEARCH_RESULTS.filter(x=>x.r.n===name);
  if(!rows.length) return;
  const races=rows.map(x=>{
    const r=x.r;
    const runs={}; RUN_KEYS.forEach((k,i)=>{ runs[k]=r.u?.[i]||""; });
    const stations={}; STATIONS.forEach((s,i)=>{ stations[s.key]=r.s?.[i]||""; });
    const validDate = r.dt && /^\d{4}-\d{2}-\d{2}$/.test(r.dt) ? r.dt : todayISO();
    return { id:uid(), date:validDate, division:reconcileDivisionWithGender(r.d||DIVISIONS[0], r.g), officialTime:r.t||"", runs, stations, transition:r.z||"" };
  });
  const g=String(rows[0].r.g||"").toLowerCase();
  const gender = (g.includes("female")||g.includes("woman")||g==="w"||g==="f") ? "female" : "male";
  STATE.doublesPartner = {
    id:uid(), name, gender,
    age:"", ageGroupDisplay: rows[0].r.a||"", // HPS 검색은 나이대(예: 35-39)만 제공 — 정확한 나이가 아니므로
                                              // 벤치마크 fallback 계산에는 쓰지 않고 참고 표시로만 남긴다.
    division: races[0]?.division||"Open",
    races, simulationTests:[], running:{ pb5k:"",pb10k:"",pbHalf:"",tt1k:"",tt3k:"",tt5k:"",tt10k:"" },
    source:"hps_search"
  };
  DOUBLES_PARTNER_SEARCH_QUERY=""; DOUBLES_PARTNER_SEARCH_RESULTS=[]; GOAL_DOUBLES_MANUAL_MODE=false;
  persist(); showToast(`${name}님을 파트너로 선택했습니다`); renderAll();
}

function predictionSourceCardHtml(predDiv, p0){
  const b=p0.baseline||{}; const v3=b.v3;
  const wm=v3? v3.workloadModel : describeWorkloadModel(predDiv);
  const contrib=(v3&&v3.contributions)? v3.contributions.slice().sort((a,b2)=>b2.weight-a.weight) : [];
  const exactRows=contrib.filter(c=>!c.crossDivision && c.sourceDate);
  const crossRows=contrib.filter(c=>c.crossDivision);
  const line=(label,val)=>`<div class="row-between" style="font-size:11.5px; padding:2px 0;"><span style="color:var(--gray-dim);">${escapeHtml(label)}</span><span style="color:var(--gray);">${val}</span></div>`;
  const srcRow=(c)=>`<div style="font-size:11.5px; padding:3px 0; border-top:1px solid var(--surface2);">
      <b style="color:var(--orange);">${escapeHtml(String(c.sourceDivision))}</b> · ${escapeHtml(c.sourceDate||"—")} · ${c.rawTime!=null?fmtTime(c.rawTime):"—"}
      ${c.crossDivision?`<span style="color:var(--gray-dim);"> → ${escapeHtml(predDiv)} 환산 ${fmtTime(c.adjustedTime)}</span>`:""}
      <span style="color:var(--gray-dim);"> · 현재성 ${Math.round((c.freshnessWeight||0)*100)}% · 반영 ${c.share}%</span>
    </div>`;
  return `<div class="card">
    <div class="row-between"><h2 class="section-title">현재 예측 기준 (Division · 출처 · 현재성)</h2>
      <span class="badge">${escapeHtml(predDiv)}</span></div>
    <div style="margin-top:8px;">
      ${line("현재 예상기록", `<b style="color:var(--orange);">${fmtTime(p0.predicted)}</b>`)}
      ${line("Exact Race Division", escapeHtml(predDiv))}
      ${line("Base Division (HPI/DNA용)", escapeHtml(divisionBase(predDiv)||"—"))}
      ${line("근거", escapeHtml(b.source||"—"))}
      ${line("Race workload (Open Singles=1.000)", `×${wm.totalRatioVsOpenSingles} · station분담 ${wm.repShare} · Pro중량 ${wm.proWeights?"적용":"미적용"}`)}
      ${line("Segment 기반 여부", v3&&v3.segmentModel? `${v3.segmentModel.actualCount}/${v3.segmentModel.segmentCount} 구간 실측 (Exact 근거 ${Math.round(v3.segmentModel.exactDivisionCoverage*100)}%)` : "—")}
    </div>
    ${exactRows.length? `<div class="eyebrow gray" style="margin-top:10px;">최근 공식 기록 (${escapeHtml(predDiv)})</div>${exactRows.map(srcRow).join("")}`
      : `<div class="reason-line" style="margin-top:10px;">${escapeHtml(predDiv)} 공식 기록 없음 — 아래 Cross-Division signal + Segment + benchmark로 추정됨</div>`}
    ${crossRows.length? `<div class="eyebrow gray" style="margin-top:10px;">Cross-Division 보조 signal (workload 변환 적용)</div>${crossRows.map(srcRow).join("")}` : ""}
    <div class="reason-line" style="margin-top:8px; color:var(--gray-dim);">콘솔: <b>predictionTrace("${escapeHtml(predDiv)}")</b> · <b>compareAllDivisionsV3()</b> · <b>runDivisionRegressionTests()</b></div>
  </div>`;
}

/* 기록 예측 페이지에 있던 "개선 분석" 블록 중 능력 요약/훈련 우선순위(상세) — 이제 주간 훈련계획
   페이지로 이동 (spec: DNA=진단, Weekly Plan=처방). Station-induced degradation/개선 필요 구간 상세/
   개선 가능성이 큰 구간은 각각 새 다중대회 Station→Run Fatigue 섹션으로 대체되었거나(전자), DNA의
   "가장 개선하면 좋은 영역"·"개선 필요 구간 상세"와 중복되어(후자 둘) 제거됨 — 아래 두 섹션만 남는다. */


/* ---------------------------------------------------------------------- */
/* DNA §3/§4/§5/§6 — Station → Run Fatigue UI (모든 등록 대회 기준)          */
/*     "가장 최근 대회 1개"가 아니라 등록된 모든 대회를 computeStationInduced-*/
/*     Degradation()으로 각각 분석한 뒤, 반복성(몇 개 대회 중 몇 번 나타났는가)*/
/*     을 함께 보여준다 — 단발성 이상값을 곧바로 "이 선수의 특성"으로 단정    */
/*     하지 않기 위함(spec §5).                                             */
/* ---------------------------------------------------------------------- */
// 심각도 색상 — buildImprovementTop3()가 이미 쓰는 "8% 이상이면 유의미"(computeStationInducedDegradation
// 기반) 관행을 그대로 재사용한 임계값(8%/15%), 새로 지어낸 기준이 아님.
function stationRunSeverity(degradationSec, baselineSec){
  const pct = baselineSec>0 ? (degradationSec/baselineSec)*100 : 0;
  if(degradationSec<=0) return { emoji:"🟢", color:"var(--green)" };
  if(pct>=15) return { emoji:"🔴", color:"var(--red)" };
  if(pct>=8) return { emoji:"🟠", color:"var(--orange)" };
  return { emoji:"🟡", color:"var(--amber)" };
}
function stationRunFatigueSectionHtml(){
  const agg = computeStationRunDegradationAllRaces();
  if(!agg){
    return `<div class="divider" style="margin:16px 0;"></div><div class="eyebrow gray">🏃 Station → Run Fatigue</div><div class="empty-note" style="margin-top:8px;">대회 기록(러닝 8구간 포함)을 등록하면 스테이션 직후 Run 저하 분석이 표시됩니다.</div>`;
  }
  const { perStation, raceCount, races, diagnosisCounts } = agg;
  const COMPACT_THRESHOLD = 5; // spec §4: 대회가 많아지면 전체 컬럼 대신 최근/평균/반복/추세 요약으로 전환
  const compact = raceCount > COMPACT_THRESHOLD;

  const tableHtml = compact
    ? `<table><thead><tr><th>스테이션</th><th class="num">최근</th><th class="num">평균</th><th>반복</th><th>추세</th></tr></thead><tbody>
        ${perStation.map(s=>{
          const sev=stationRunSeverity(s.latest.degradationSec, s.latest.baselineSec);
          const half=Math.floor(s.measured.length/2);
          const firstHalfAvg = half? mean(s.measured.slice(0,half).map(m=>m.degradationSec)) : null;
          const secondHalfAvg = half? mean(s.measured.slice(-half).map(m=>m.degradationSec)) : null;
          const trend = (firstHalfAvg!=null && secondHalfAvg!=null) ? (secondHalfAvg-firstHalfAvg) : null;
          const trendArrow = trend==null? "—" : trend>2? "▲ 악화" : trend<-2? "▼ 개선" : "→ 유지";
          return `<tr>
            <td>${escapeHtml(s.label)}</td>
            <td class="num mono" style="color:${sev.color};">${sev.emoji} ${s.latest.degradationSec>=0?"+":""}${fmtTime(Math.abs(s.latest.degradationSec))}</td>
            <td class="num mono" style="color:var(--gray-dim);">${s.avgDegradationSec>=0?"+":""}${fmtTime(Math.abs(s.avgDegradationSec))}</td>
            <td class="mono">${s.occurrences}/${s.totalMeasured}</td>
            <td class="mono" style="font-size:11px;color:var(--gray-dim);">${trendArrow}</td>
          </tr>`;
        }).join("")}
      </tbody></table>`
    : `<div style="overflow-x:auto;"><table><thead><tr><th>스테이션</th>${races.map(r=>`<th class="num">${escapeHtml(r.label)}</th>`).join("")}<th class="num">최근</th></tr></thead><tbody>
        ${perStation.map(s=>{
          const sev=stationRunSeverity(s.latest.degradationSec, s.latest.baselineSec);
          return `<tr>
            <td>${escapeHtml(s.label)}</td>
            ${races.map(r=>{ const m=s.series.find(x=>x&&x.date===r.date); return `<td class="num mono" style="color:${m?(m.degradationSec>0?'var(--red)':'var(--green)'):'var(--gray-dim)'};">${m?`${m.degradationSec>=0?"+":""}${fmtTime(Math.abs(m.degradationSec))}`:"—"}</td>`; }).join("")}
            <td class="num mono" style="color:${sev.color};font-weight:700;">${sev.emoji} ${s.latest.degradationSec>=0?"+":""}${fmtTime(Math.abs(s.latest.degradationSec))}</td>
          </tr>`;
        }).join("")}
      </tbody></table></div>`;

  // 반복성 표 ("Station → Run | 발생 | 판단") — 판정 기준: <40% ⚪ 일시적 · 40~59% 🟡 관찰 ·
  // ≥60% 🟢 반복 패턴 · ≥80%(표본<4면 실발생 3회 이상) 🔴 강한 반복 패턴.
  const repetitionRows = perStation.filter(s=>s.totalMeasured>=2)
    .sort((a,b)=> b.occurrenceRatio-a.occurrenceRatio || b.occurrences-a.occurrences);
  const patternHtml = raceCount>=2 ? `
    <div class="divider" style="margin:14px 0;"></div>
    <div class="eyebrow gray" style="margin-bottom:8px;">반복성 — 여러 대회에서 일관되게 나타나는가?</div>
    ${repetitionRows.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>Station → Run</th><th class="num">발생</th><th>판단</th></tr></thead><tbody>
      ${repetitionRows.map(s=>`<tr>
        <td>${escapeHtml(s.label)} → Run</td>
        <td class="num mono">${s.occurrences}/${s.totalMeasured}</td>
        <td>${s.pattern.circle} ${escapeHtml(s.pattern.shortLabel)}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <p class="reason-line" style="margin-top:6px;color:var(--gray-dim);">⚪ 일시적(&lt;40%) · 🟡 관찰(40~59%) · 🟢 반복 패턴(≥60%) · 🔴 강한 반복 패턴(≥80%, 표본 4개 미만이면 실발생 3회 이상)</p>
    ${repetitionRows.some(s=>s.pattern.key==="strong"||s.pattern.key==="repeated") ? "" : `<div class="empty-note" style="margin-top:10px;">여러 대회에서 반복되는 것으로 확인된 스테이션은 아직 없습니다.</div>`}
    ` : `<div class="empty-note">측정된 Station → Run 저하가 없습니다.</div>`}
  ` : `<p class="reason-line" style="margin-top:10px;color:var(--gray-dim);">대회가 2개 이상 등록되면 반복성(여러 대회에서 일관되게 나타나는 패턴인지)을 함께 보여드립니다. 현재 ${raceCount}개 대회만 분석되었습니다.</p>`;

  return `<div class="divider" style="margin:16px 0;"></div>
    <div class="eyebrow gray">🏃 Station → Run Fatigue</div>
    <p class="lead" style="margin:6px 0 10px;">등록된 ${raceCount}개 대회 전체를 각각 분석합니다 — 각 스테이션 직후 Run이 그 경기 평균 Run 페이스보다 얼마나 느려졌는지(해당 스테이션의 피로가 다음 Run으로 넘어간 정도)를 대회별로 비교합니다.</p>
    ${tableHtml}
    ${patternHtml}
    `;
}

function dnaUserDataCompositionBanner(analysis){
  const uc = analysis.userDataComposition;

  // Goal/Base Division must never masquerade as the DNA comparison Division.
  const baseDiv = uc.baseDivision || analysis.userDataComposition?.baseDivision || STATE.profile.division;

  const divLabel = (arr)=> arr && arr.length===1 ? arr[0] : (arr||[]).join("/");
  const raceCountLabel = `최근 ${uc.raceCount}개 경기 반영`;
  // P1: "Race Weight"(경기 전체 가중치 — 이 배너에 표시되는 값, 대회 하나가 전체 DNA에서 차지하는
  // 몫)와 "Segment Effective Weight"(구간별 실제 반영 가중치 — 그 경기에 특정 구간 데이터가 없으면
  // 그 구간에서는 자동으로 제외되고 나머지 경기끼리 다시 100%로 정규화된 값)는 서로 다른 개념이다.
  // 계산 자체는 이미 구간별로 올바르게 이렇게 동작하고 있으므로(computePooledDnaSegment의
  // contributions[].weight), 여기서는 그 차이를 명확히 설명만 해준다.
  const raceWeightRows = uc.races.map(r=>`<div class="row-between" style="font-size:11px;padding:2px 0;"><span style="color:var(--gray-dim);">${escapeHtml(r.name)} (${escapeHtml(r.division)})</span><span class="mono">${Math.round(r.weight*1000)/10}%</span></div>`).join("");
  const weightNote = uc.raceCount>1 ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:11px;color:var(--gray-dim);">경기별 Race Weight 보기</summary>
    <div style="margin-top:6px;padding:8px 10px;background:var(--surface2);border-radius:8px;">

    </div></details>` : "";
  if(!analysis.raceDivisionMismatch){
    return `<div class="card tight" style="background:var(--surface2);border-left:3px solid var(--green);">
      <div class="eyebrow" style="color:var(--green);">🟢 REAL USER DATA</div>

      ${weightNote}
    </div>`;
  }
  let compositionLine;
  if(uc.blended){
    compositionLine = `${escapeHtml(divLabel(uc.tierDivisions))} 70% · ${escapeHtml(divLabel(uc.secondaryDivisions))} 30%`;
  } else {
    compositionLine = `${escapeHtml(divLabel(uc.tierDivisions))} 100%`;
  }
  return `<div class="card tight" style="background:rgba(255,176,32,.08);border-left:3px solid var(--amber);">
    <div class="eyebrow" style="color:var(--amber);">⚠️ ${escapeHtml(baseDiv)} 실제 기록이 부족해 가장 가까운 실제 경기 기록으로 DNA를 계산했습니다</div>
    <div style="font-size:12.5px;color:var(--white);margin-top:6px;">${compositionLine} · ${raceCountLabel}</div>
    <div style="font-size:11px;color:var(--gray-dim);margin-top:2px;">Race DNA는 실제 보유 대회 기록의 Division을 기준으로 비교합니다. 목표 Division은 DNA 비교군을 바꾸지 않습니다.</div>
    ${weightNote}
  </div>`;
}
// spec (Race DNA P0 fix §5): 화면에 "팀 기록 / 개인 workload 환산 기록 / 실제 개인 기록"을 명확히
// 구분해서 보여준다. contributions[]는 computePooledDnaSegment()가 채워둔 그대로(각 경기별
// adjustmentApplied/teamTime/workloadAdjustedTime)를 그대로 읽는다 — 새 계산을 만들지 않는다.
function dnaContributionCompositionLabel(seg){
  const contribs = seg.contributions || [];
  if(!contribs.length) return null;
  const adjusted = contribs.filter(c=>c.adjustmentApplied);
  const direct = contribs.filter(c=>!c.adjustmentApplied);
  if(adjusted.length && direct.length) return { text:"실제 경기 기록 기준 · Doubles share는 보조 정보", adjusted };
  if(adjusted.length) return { text:"팀 경기 기록 기준 · Doubles share는 보조 정보", adjusted };
  return { text:"실제 개인 기록", adjusted:[] };
}

/* 9d. RACE DNA — user-friendly translation layer (spec)                   */
/*     computePeerAnalysis()'s segments/impactList/strengthIdx keep their   */
/*     exact existing shape/math (still used by HPI/Prediction/Training     */

function peerScoreBand(score){

  if(score>=80) return { label:"강점", color:"var(--green)" };
  if(score>=60) return { label:"양호", color:"var(--low)" };
  return { label:"개선 필요", color:"var(--amber)" };
}
const RACE_DNA_TYPE_AXES = [
  { key:"running", emoji:"🏃", label:"페이스형" },
  { key:"power", emoji:"💪", label:"파워형" },
  { key:"engine", emoji:"❤️", label:"심폐형" },
  { key:"fatigueResistance", emoji:"🔋", label:"지구력형" },
  { key:"transition", emoji:"⚡", label:"전환형" },
  { key:"grip", emoji:"🎯", label:"기술형" },
];
// Combines up to 2 axes into a "페이스형 + 파워형" style label — only when there's enough segment
// data AND a real, meaningful standout (score>=60 "양호" and clearly above the athlete's own average
// across axes). Never forces a classification on thin data (spec §1/§8: "근거가 부족하면 단정하지
//마세요") — returns insufficient:true instead, and the UI shows "데이터 수집 중".
// Race DNA 유형은 "실제 peer 표본이 30건 이상인가"와 별개의 문제다.
// 실제 경기 기록/Reference Estimate로 축 점수가 계산됐다면, 표본이 얇다는 이유만으로
// 전체 유형을 "데이터 수집 중"으로 숨기지 않는다. 근거가 너무 얇을 때만 보류한다.
const RACE_DNA_MIN_SEGMENTS_FOR_TYPE = 8;
const RACE_DNA_MIN_AXES_FOR_TYPE = 3;
function raceDnaTypeCombo(strengthIdx, dataSource){
  if(!dataSource || dataSource.totalSegmentCount < RACE_DNA_MIN_SEGMENTS_FOR_TYPE) return { insufficient:true };
  const vals = RACE_DNA_TYPE_AXES.map(ax=>({ ...ax, score:strengthIdx[ax.key] })).filter(a=>a.score!=null);
  if(vals.length < RACE_DNA_MIN_AXES_FOR_TYPE) return { insufficient:true };
  const avg = mean(vals.map(v=>v.score));
  const qualifying = vals.filter(v=>v.score>=60 && (v.score-avg)>=8)
    .sort((a,b)=>(b.score-avg)-(a.score-avg));
  if(!qualifying.length) return { insufficient:false, types:[], balanced:true };
  return { insufficient:false, types:qualifying.slice(0,2), balanced:false };
}
// BUG FIX (DNA audit item #2/#3): Run 1~8 used to compete as 8 separate "강점" candidates, so the
// list could show e.g. "Run 3 / Run 2 / Run 4" instead of a single "Running" entry — not how HYROX
// athletes think about their own strengths. 17-segment internal data (segments, passed in) is
// UNCHANGED; only this user-facing "나의 강점" list now collapses the 8 run legs into one "Running"
// candidate before ranking, exactly like the Impact/Loss side already does for its "Running (8구간
// 합)" line (see computePeerAnalysis's runTimeLoss). Score = mean of the 8 individual run
// percentiles — no new weighting invented, same underlying z/percentile values.
function buildStrengthsTop3(segments){
  const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null && s.percentile!=null);
  const otherSegs = segments.filter(s=>s.kind!=="run" && s.actual!=null && s.percentile!=null);
  const candidates = [...otherSegs];
  if(runSegs.length) candidates.push({ label:"Running", percentile: mean(runSegs.map(s=>s.percentile)) });
  const sorted=[...candidates].sort((a,b)=>b.percentile-a.percentile).slice(0,3);
  const templates=["현재 구간 중 가장 안정적인 수행 능력","그룹 평균보다 뚜렷하게 앞서는 구간","꾸준히 강점으로 나타나는 구간"];
  return sorted.map((s,i)=>({ label:s.label, desc:templates[i]||"강점 구간", score:Math.round(s.percentile) }));
}
// spec §3: individual station bottlenecks (NOT the aggregate "Running (8구간 합)" line — that's used
// in the separate 기록 손실 분석 section) + a specific "Running 지속력" item when measured post-station
// degradation (computeStationInducedDegradation, already real data) is large enough to call out.
function buildImprovementTop3(impactList, race){
  // Primary ranking: measured time-loss bottlenecks.
  const stationItems = impactList.filter(c=>c.key!=="run" && Number.isFinite(c.timeLoss) && c.timeLoss>0).slice(0,3)
    .map(c=>({ label:c.label, key:c.key, reason:`기준 기록보다 ${fmtTime(Math.abs(c.timeLoss))} 느림` }));
  const items=[...stationItems];

  // Keep the existing Station → Run degradation signal.
  const degradation=computeStationInducedDegradation(race);
  const topDeg=degradation.find(d=>Number.isFinite(d.degradationSec) && d.degradationSec>0);
  if(topDeg && Number.isFinite(topDeg.baselineSec) && topDeg.baselineSec>0){
    const pct=(topDeg.degradationSec/topDeg.baselineSec)*100;
    if(pct>=8){
      const degItem={ label:"Running 지속력", key:"run_fatigue", reason:`${topDeg.label} 이후 Running 페이스가 평균보다 ${round1(pct)}% 이상 저하` };
      if(!items.some(x=>x.key===degItem.key)){
        if(items.length<3) items.push(degItem); else items[2]=degItem;
      }
    }
  }

  // Fallback: if there is no positive time-loss bottleneck, do not hide the section.
  // Use the lowest real peer percentiles from the SAME DNA analysis. This is still
  // peer-comparison data, not training/recovery logic or a new benchmark.
  if(!items.length){
    const fallback = (impactList||[])
      .filter(c=>c.key!=="run" && Number.isFinite(c.percentile))
      .sort((a,b)=>a.percentile-b.percentile)
      .slice(0,3)
      .map(c=>({
        label:c.label,
        key:c.key,
        reason:`비교 그룹 대비 ${Math.round(c.percentile)}점 — 현재 기록에서 상대적으로 낮은 영역`
      }));
    items.push(...fallback);
  }

  // If stations are absent/insufficient, include Running as a single aggregated
  // candidate when its eight run legs have a real percentile signal.
  if(items.length<3){
    const runSegs=(impactList||[]).filter(c=>c.key==="run" && Number.isFinite(c.percentile));
    if(runSegs.length){
      const r=runSegs[0];
      if(!items.some(x=>x.key==="run")){
        items.push({
          label:"Running",
          key:"run",
          reason:`비교 그룹 대비 ${Math.round(r.percentile)}점 — 상대적으로 낮은 수행 영역`
        });
      }
    }
  }

  return items.slice(0,3);
}

/* 9f. UNIFIED DNA-BASED WEAKNESS/STRENGTH RANKING (doc7 §8-15)            */
/*     Single source of truth for "개선 필요/우선순위" and "강점" everywhere  */
/*     (Dashboard / 기록예측 / DNA / Podium). Wraps the SAME real peer        */
/*     Z-score/percentile-weighted DNA engine the DNA page already shows     */
/*     (computePeerAnalysis -> buildImprovementTop3/buildStrengthsTop3) —    */
/*     no new statistics, no separate benchmark-gap or Impact×Gap×          */
/*     Trainability ranking competing with it. Every screen that wants      */
/*     "which area needs work" must call THIS, not compute its own.         */
/*     Falls back to the existing Training Priority index-ranking (already  */
/*     a real, separately-used engine for weekly planning) ONLY when there  */
/*     is no race in the current division to run DNA/peer analysis on at    */
/*     all — never invents a third ranking, and the fallback is labeled so  */
/*     the UI can be honest about which source produced the list.          */
/* ---------------------------------------------------------------------- */
function getDnaWeaknessRanking(n=3){
  const peer = computePeerAnalysis(true);
  if(peer){
    const top3 = buildImprovementTop3(peer.impactList, peer.race).slice(0,n);
    if(top3.length) return { source:"dna", items: top3 };
  }
  return { source:"none", items:[] };
}
function buildRaceDnaCoachInsight(improvementTop3){

  const order=improvementTop3.map(i=>i.label).join(" → ");
  return `현재는 ${order} 순으로 실제 경기 데이터에서 가장 큰 차이가 보이는 영역입니다.`;

/* 9g. DNA EVOLUTION ("경기력 변화") — spec: DNA 자체(computePeerAnalysis,    */
/*     전체 historical benchmark 기반, 장기 특성)는 절대 변경하지 않는다.       */
/*     이 섹션은 그 SAME 계산 파이프라인(computeDnaSegmentsForRace →           */
/*     queryPeerSegmentStats → z-score → percentile)을 대회별로 반복 실행해    */
/*     "시간에 따른 DNA Score 변화"만 보여주는 별도의 읽기 전용 뷰다. 새로운     */
/*     benchmark나 새 fallback 구조를 만들지 않고, Race DNA 화면의               */
/*     "+ 상세 분석 보기" 맨 마지막에만 추가된다.                               */

let DNA_EVO_TAB = "all";       // "all" | one of DNA_EVOLUTION_ITEMS[].key
let DNA_EVO_SHOW_ALL = false;  // false = 최근 대회 중심 표시, true = 전체 기록
const DNA_EVO_RECENT_COUNT = 8; // 기본 화면에 표시할 최근 대회 수 (spec §7 — 표시 범위일 뿐, 계산 범위와 무관)
const DNA_EVOLUTION_ITEMS = [
  { key:"run",      label:"Run",           color:"#FF5A1F" },
  { key:"ski",      label:"Ski",           color:"#5C8CFF" },
  { key:"sledPush", label:"Sled Push",     color:"#33D17A" },

  { key:"burpee",   label:"Burpee",        color:"#FFB020" },

  { key:"carry",    label:"Farmers Carry", color:"#FF6BA8" },
  { key:"lunge",    label:"Sandbag Lunge", color:"#C9C24B" },

function dnaEvoItemMeta(key){ return DNA_EVOLUTION_ITEMS.find(i=>i.key===key) || null; }
// spec §4/§13: same canonical segments Race DNA already uses (PEER_SEGMENTS/toSegmentListEntry), same
// percentile pipeline (computeDnaSegmentsForRace, reused verbatim) — run per race, oldest → newest.
// Missing a segment for one race never breaks the others (spec §12 "해당 segment만 missing 처리").
function computeDnaEvolution(){
  const races = [...STATE.races].filter(r=>r && r.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!races.length) return null;
  const points = races.map(race=>{
    const core = computeDnaSegmentsForRace(race);
    if(!core) return null;
    const segments = core.segments;
    const byKey=k=>segments.find(s=>s.key===k);
    const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null && s.percentile!=null);
    const scores = { run: runSegs.length ? mean(runSegs.map(s=>s.percentile)) : null };
    ["ski","sledPush","sledPull","burpee","row","carry","lunge","wallball"].forEach(k=>{
      const s = byKey(k);
      scores[k] = (s && s.actual!=null && s.percentile!=null) ? s.percentile : null;
    });
    return { race, date:race.date, label: race.name || dnaEvoDateLabel(race.date), division:core.group.division, scores };
  }).filter(p=>p && Object.values(p.scores).some(v=>v!=null));
  if(!points.length) return null;
  return { points };
}
function dnaEvoDateLabel(dateStr){
  if(!dateStr) return "—";
  const parts = String(dateStr).split("-");
  return parts.length===3 ? `${parts[0].slice(2)}.${parts[1]}.${parts[2]}` : String(dateStr);
}
// spec §9: 가장 크게 향상/하락한 항목 — 최근 대회 대비 그 이전 대회의 percentile 변화량(=DNA Score
// 변화량) 기준. run/station 통틀어 하나의 목록으로 랭킹한다.
function computeDnaEvoChanges(points){
  if(points.length<2) return [];
  const last = points[points.length-1], prev = points[points.length-2];
  return DNA_EVOLUTION_ITEMS.map(it=>{
    const cur = last.scores[it.key], before = prev.scores[it.key];
    if(cur==null || before==null) return null;
    return { key:it.key, label:it.label, delta: cur-before };
  }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
}
function dnaEvoChangeBadge(delta){
  if(delta>=5) return "🟢";
