  // Division this call was actually asked about (passed in via `group`) — never STATE.profile.division
  // (the athlete's BASE/registered Division). Previously this silently ignored `division` entirely and
  // always looked up STATE.profile.division, so a Goal Division that differs from the Base Division
  // (e.g. Base=Pro Doubles / Goal=Pro) would still be benchmarked against the Base Division's rows.
  const ageBand = deriveAgeBand(STATE.profile.age);
  const benchGender = deriveBenchmarkGender(division);
  const derivedKey = seg.key==="roxzone" ? "transition" : seg.key;
  // Race DNA must never silently compare one age group against an age-relaxed/global pool.
  // For strict DNA calls, only an exact-age real participant pool is eligible. If it does not exist,
  // use the age-adjusted illustrative reference below rather than a broader-age benchmark row.
  let derived = queryDerivedBenchmark(division, benchGender, ageBand, derivedKey);
  // Derived benchmark rows use broader 10-year age bands (e.g. 30-39), so they are NOT
  // an exact 5-year peer group for Race DNA. Strict DNA therefore never consumes them.
  if(group.strictAge && derived) derived=null;
  const derivedP50 = derived ? Number(derived.p50) : null;
  if(Number.isFinite(derivedP50) && derivedP50>0){
    let benchmarkMean=derivedP50;
    if(mixedPersonalMode) benchmarkMean*=mixedShare*mixedAthleteGenderFactor(group.athleteGender);
    const sd = benchmarkMean * SD_PCT[seg.kind];
    return finishStats({ mean:benchmarkMean, sd, n:derived.sample_n||null, isReal:true,
      source:`ASIA/Global 실측 벤치마크 (${derived.benchmark_source}, n=${derived.sample_n ?? "?"})${mixedPersonalMode?` · Mixed ${group.athleteGender} 개인 기준(share ${Math.round(mixedShare*100)}%)`:``}`,
      benchmarkSource:derived.benchmark_source, sampleN:derived.sample_n||null });
  }

  let illustrativeMean;
  if(division==="Mixed Doubles"){

      ? (gender==="female" ? DOUBLES_GENDER_MULT : 1.0)

// the EXACT current division (racesByDivision, not the coarser divisionBase match) — Open and Open

const PERSONAL_HISTORY_HALF_LIFE_DAYS = 120;

  const races = racesByDivision(STATE.profile.division);

    const v=getUserSegmentValue(seg.key, r);

  }).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));
  if(!values.length) return null;
  const latest = values[0];
  const best = values.reduce((a,b)=> a.value<=b.value? a:b);
  const sorted=[...values].sort((a,b)=>a.value-b.value);
  const mid=Math.floor(sorted.length/2);

  values.forEach(v=>{ const w=Math.pow(0.5, v.ageDays/PERSONAL_HISTORY_HALF_LIFE_DAYS); wsum+=w; vsum+=w*v.value; });

}
// doc9 §30-2/§30-7/TEST-07: DNA/Peer percentile must reflect "실제 HYROX 선수 집단에서 본인의 위치" —
// the athlete's OWN value must come from an official race split ONLY, never Simulation or Quick Test.
// resolveSegment() (used everywhere else — Prediction, Station Priority, Prediction) deliberately
// DOES fall through to Simulation/Quick Test when official data is stale or missing, because those
// engines answer "what can this athlete do right now"; DNA answers a different question ("where do I
// rank among real HYROX finishers"), so it needs its own, strictly official-only resolver — reading
// directly from the specific race object computePeerAnalysis is already analyzing, with NO fallback
// tier beyond that. A segment with no official split for this race is null (not filled from anywhere
// else), so DNA never silently shows a Simulation-derived number as if it were a real racing result.
function resolveOfficialSegment(seg, race){
  if(!race) return { sec:null, basis:"benchmark-only" };
  if(seg.type==="run"){
    const sec = parseTimeToSec(race.runs?.[seg.runIdx]);
    return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
  }
  if(seg.type==="station"){
    const sec = parseTimeToSec(race.stations?.[seg.key]);
    return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
  }
  const sec = parseTimeToSec(race.transition);
  return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
}

/* ---------------------------------------------------------------------- */
/* DNA MULTI-RACE POOLING (segment-level fallback + division/recency       */
/* weighting) + Doubles sharePct workload adjustment + Target-Division     */
/* benchmark comparison.                                                    */
/*                                                                          */
/* Design principles (per the "Race DNA 실제 기록 기반 가중치" requests):     */
/*  - "기록이 있는가?" 먼저, "목표 Division과 같은가?"는 그 다음. 목표         */
/*    Division 기록이 있으면 그것만 쓰고(다른 Division과 섞지 않음), 없으면     */
/*    가장 유사한 실제 기록으로 폴백한다 — Peer Group distribution은 실제      */
/*    기록이 단 하나도 없을 때만 쓰는 최후 수단이다.                          */
/*  - 최근 최대 3개 경기, 최근성 가중치 60/30/10 (2개면 60/30 정규화,          */
/*    1개면 100%).                                                          */
/*  - 경기 단위로 "이 경기 하나를 쓴다"가 아니라, 17개 segment 각각을 독립적    */
/*    으로 pooling한다 — 어떤 경기에 Wall Ball이 없으면 그 경기는 Wall Ball    */
/*    에서만 빠지고, Run/Sled 등 다른 segment에는 계속 기여한다.               */
/*  - Doubles station segment는 sharePct가 있으면 기존 estimateSoloStationSec */
/*    ()를 그대로 재사용해 "개인 workload equivalent"로 변환한 뒤에만 벤치     */
/*    마크와 비교한다 — Run/Transition은 sharePct를 절대 적용하지 않는다.      */
/*  - Benchmark 비교 그룹은 항상 "목표(선택한) Division"이다 — 실제 기록이      */
/*    어느 Division에서 나왔든, 그 시간을 목표 Division 기준으로 다시 스케일    */
/*    링(전체 Race Time multiplier)하지 않는다. 즉 Open Doubles 1:25:00       */
/*    이라는 실제 기록은 항상 1:25:00 그대로 유지되고, 그 값이 Pro Doubles     */
/*    동일 그룹 분포에서 몇 percentile인지만 계산한다 — "Pro Doubles라면       */
/*    몇 분에 뛸 것이다" 같은 가상 예측 기록을 만들지 않는다(그건 별도의        */
/*    Division 전환 예측 엔진의 몫이다).                                     */
/* ---------------------------------------------------------------------- */
const DNA_POOL_MAX_RACES = 3;
const DNA_POOL_RECENCY_WEIGHTS = [0.6, 0.3, 0.1];

// Division fallback priority list for a given GOAL division. Mixed Doubles is a real benchmark
// division, but it is NOT collapsed into Open. Mixed can bridge to gendered doubles only as a
// lower-priority fallback, and the athlete's gender is retained for benchmark conversion. Every other goal division falls back through progressively
// less-similar real divisions the athlete may have actually competed in, all the way down to the
// OTHER Singles/Doubles division at the very end (P0 fix: "Open Doubles → Pro Doubles → Open → Pro" /
// "Pro Doubles → Open Doubles → Pro → Open" — a Doubles goal must still be able to fall back to
// whichever Singles division the athlete actually has real data in, not just its "own side" Singles).
//
// P0 fix (Base/Goal/Source separation regression, found via the Base=Pro Doubles/Goal=Pro/
// Source=Open Doubles test case): the Open/Pro (Singles) branches below were previously missing the
// "other side" Doubles division entirely — e.g. goal=Pro only fell back through [Pro, Pro Doubles,
// Open] and NEVER Open Doubles, so an athlete whose only real race was Open Doubles got NO pool at
// all for a Pro goal, even though the Doubles-goal branches above are fully 4-tier symmetric. Made
// Open/Pro symmetric with the Doubles branches so every real race the athlete has ever logged is at
// least reachable as a lowest-priority fallback, regardless of which of the 4 non-Mixed divisions the
// goal or the source race is in.
/* ======================================================================
 * DNA DIVISION CONVERSION GRAPH v2
 *
 * Mixed Doubles is a real benchmark division (gender=MIXED), but an
 * individual athlete inside a Mixed team still has a real sex/gender.
 * Therefore Mixed is kept as-is for benchmark lookup, while fallback
 * routing uses athleteGender to choose the closest gendered division.
 *
 * Priority is similarity, NOT a blanket "Mixed = Open" rule:
 *   exact -> same-format level -> same-gender other format -> Mixed bridge
 *   -> last-resort real division.
 * Every hop is recorded so downstream DNA can apply a conversion factor and
 * lower confidence as the path becomes longer.
 * ====================================================================== */
const DNA_DIVISION_MAX_HOPS = 4;
const DNA_DIVISION_HOP_CONFIDENCE = ["High","Medium","Low","Very Low"];


// Returns the ordered fallback tiers for a GOAL division. Mixed is never
// silently collapsed into Open. For a Mixed goal, the athlete's own Mixed
// record is exact; if absent, we use that athlete's gendered doubles history.
function dnaDivisionTierList(goalDiv, athleteGender=STATE.profile.gender){
  const g = normalizeRaceDivision(goalDiv) || goalDiv;
  const isFemale = athleteGender==="female";
  const ownD = isFemale ? "Women Open Doubles" : "Men Open Doubles";
  const proD = isFemale ? "Women Pro Doubles" : "Men Pro Doubles";
  // The stored race divisions are gender-neutral labels (Open Doubles / Pro
  // Doubles). Gender-specific names above are conceptual only; keep actual
  // labels below so this works with the existing STATE.races schema.
  if(g==="Mixed Doubles") return [
    ["Mixed Doubles"],
    ["Open Doubles"],
    ["Pro Doubles"],
    ["Open"],
    ["Pro"]
  ];
  if(g==="Open Doubles") return [["Open Doubles"], ["Pro Doubles"], ["Open"], ["Pro"], ["Mixed Doubles"]];
  if(g==="Pro Doubles")  return [["Pro Doubles"], ["Open Doubles"], ["Pro"], ["Open"], ["Mixed Doubles"]];
  if(g==="Open") return [["Open"], ["Open Doubles"], ["Pro"], ["Pro Doubles"], ["Mixed Doubles"]];
  if(g==="Pro")  return [["Pro"], ["Pro Doubles"], ["Open"], ["Open Doubles"], ["Mixed Doubles"]];
  return [[g]];
}

function dnaDivisionPath(goalDiv, sourceDiv, athleteGender=STATE.profile.gender){
  const g=normalizeRaceDivision(goalDiv)||goalDiv;
  const s=normalizeRaceDivision(sourceDiv)||sourceDiv;
  if(!g || !s) return {reachable:false, hops:99, path:[], confidence:"Very Low", reason:"unknown-division"};
  if(g===s) return {reachable:true, hops:0, path:[s], confidence:"High", reason:"exact"};

  // Explicit, auditable paths. These are the same similarity rules used by
  // the tier list, but now represent the actual conversion route rather than
  // merely a pooling bucket.
  const routes={
    "Open Doubles": {"Pro Doubles":["Open Doubles","Pro Doubles"],"Open":["Open Doubles","Open"],"Pro":["Open Doubles","Open","Pro"],"Mixed Doubles":["Open Doubles","Mixed Doubles"]},
    "Pro Doubles": {"Open Doubles":["Pro Doubles","Open Doubles"],"Pro":["Pro Doubles","Pro"],"Open":["Pro Doubles","Pro","Open"],"Mixed Doubles":["Pro Doubles","Mixed Doubles"]},
    "Open": {"Open Doubles":["Open","Open Doubles"],"Pro":["Open","Pro"],"Pro Doubles":["Open","Open Doubles","Pro Doubles"],"Mixed Doubles":["Open","Open Doubles","Mixed Doubles"]},
    "Pro": {"Pro Doubles":["Pro","Pro Doubles"],"Open":["Pro","Open"],"Open Doubles":["Pro","Pro Doubles","Open Doubles"],"Mixed Doubles":["Pro","Pro Doubles","Mixed Doubles"]},
    "Mixed Doubles": {"Open Doubles":["Mixed Doubles","Open Doubles"],"Pro Doubles":["Mixed Doubles","Open Doubles","Pro Doubles"],"Open":["Mixed Doubles","Open Doubles","Open"],"Pro":["Mixed Doubles","Open Doubles","Pro Doubles","Pro"]}
  };
  let path=routes[s]?.[g] || null;
  // For a Mixed source/target, the bridge is deliberately gender-aware at the
  // athlete level even though the stored division label remains Mixed Doubles.
  // This prevents Mixed from becoming an unlabelled Open fallback.
  if(!path) return {reachable:false,hops:99,path:[],confidence:"Very Low",reason:"no-route"};
  const hops=path.length-1;
  return {reachable:hops<=DNA_DIVISION_MAX_HOPS,hops,path,confidence:DNA_DIVISION_HOP_CONFIDENCE[Math.min(hops,3)],
    reason:hops===0?"exact":(s==="Mixed Doubles"||g==="Mixed Doubles"?"mixed-bridge":"cross-division")};
}

// P0 fix: race selection within a tier must not let a near-empty race (no official Run/Station/
// Transition splits at all — e.g. only officialTime entered) occupy one of the precious 3 pooling
// slots just because it happens to be the most recent by date. Such a race contributes NOTHING to
// any segment anyway (computePooledDnaSegment skips it per-segment regardless), so letting it "win"
// a slot only ever costs the pool a genuinely useful, more-complete-but-slightly-older race — this
// matters more and more as a user keeps adding new (sometimes partial) records over time. Races WITH
// any real split data are always preferred over races with zero of them; recency (date desc) is still
// the tiebreaker within each of those two groups. The final selection is re-sorted by date before
// recency weights are assigned, so "most recent of the ones actually chosen" still gets the highest
// weight regardless of why each race was chosen.
function pickTopRacesForDnaPool(candidateRacesDateDesc, maxCount){
  const withData = candidateRacesDateDesc.filter(r=>raceDataCompleteness(r)>0);
  const empty = candidateRacesDateDesc.filter(r=>raceDataCompleteness(r)===0);
  const picked = withData.slice(0, maxCount);
  if(picked.length<maxCount) picked.push(...empty.slice(0, maxCount-picked.length));
  return [...picked].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

// Gathers up to DNA_POOL_MAX_RACES real races, prioritized by division tier, with recency weighting
// (60/30/10) WITHIN whichever tier(s) contribute. If the top matching tier alone has fewer than 3
// races, ONE further (lower-priority) tier is blended in at a 70/30 overall split — never more than
// 2 tiers blended at once, so the composition stays simple enough to show in the UI.
function gatherPooledDnaRaces(goalDiv){
  const allRaces = [...STATE.races].filter(r=>r&&r.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!allRaces.length) return { entries:[], exactMatch:false, tierUsed:null, blended:false, tierDivisions:null, secondaryDivisions:null };
  // No selected race = historical/current DNA across the athlete's real records.
  // Do NOT force all records into the configured/goal Division. Each contribution is compared
  // against its own source Division benchmark inside computePooledDnaSegment().
  if(!goalDiv){
    const picked=pickTopRacesForDnaPool(allRaces,DNA_POOL_MAX_RACES);
    const entries=picked.map((race,idx)=>{
      const sourceDiv=normalizeRaceDivision(race.division)||race.division;
      return { race, weight:DNA_POOL_RECENCY_WEIGHTS[idx]||0, tier:0, sourceDivision:sourceDiv, conversion:null };
    });
    const totalW=entries.reduce((sum,e)=>sum+e.weight,0)||1;
    entries.forEach(e=>e.weight/=totalW);
    return { entries, exactMatch:false, tierUsed:null, blended:false,
      tierDivisions:[...new Set(entries.map(e=>e.sourceDivision).filter(Boolean))], secondaryDivisions:null };
  }
  const athleteGender=STATE.profile.gender;
  const tiers = dnaDivisionTierList(goalDiv, athleteGender);
  const racesInTier = (tier)=>allRaces.filter(r=>tier.includes(normalizeRaceDivision(r.division)||r.division));

  // P0: if the athlete has ANY real race in the requested/selected Division, use that
  // Division only. Do not dilute an exact Pro Doubles result with Open/Mixed races merely
  // because the pool has fewer than three races. Cross-division fallback is used only when
  // the exact Division has no race at all. This keeps "Pro Doubles 1 + Mixed 1 + Open 1"
  // from silently becoming a Mixed/Open blended benchmark when Pro Doubles is selected.
  for(let i=0;i<tiers.length;i++){
    const tierAll = racesInTier(tiers[i]);
    if(!tierAll.length) continue;
    const picked = pickTopRacesForDnaPool(tierAll, DNA_POOL_MAX_RACES);
    const isExact = i===0;
    const entries = [];
    picked.forEach((race,idx)=>{
      const sourceDiv=normalizeRaceDivision(race.division)||race.division;
      const conversion=dnaDivisionPath(goalDiv,sourceDiv,athleteGender);
      entries.push({ race, weight:DNA_POOL_RECENCY_WEIGHTS[idx]||0, tier:i, sourceDivision:sourceDiv, conversion });
    });
    const totalW = entries.reduce((sum,e)=>sum+e.weight,0) || 1;
    entries.forEach(e=>e.weight/=totalW);
    return { entries, exactMatch:isExact, tierUsed:i, blended:false,
      tierDivisions:tiers[i], secondaryDivisions:null };
  }
  return {entries:[],exactMatch:false,tierUsed:null,blended:false,tierDivisions:null,secondaryDivisions:null};
}

// Resolves ONE race's contribution to ONE segment — reuses resolveOfficialSegment() for the raw
// official value unchanged, then (Doubles STATION segments only — never Run/Transition, per spec)
// applies the SAME estimateSoloStationSec() the Doubles→Singles conversion already uses, when this
// specific race has a recorded sharePct for this station. A Doubles race with no sharePct keeps its
// raw team actual as-is (never assumes 50%) — flagged so confidence can be lowered downstream.
// spec (Race DNA P0 fix — DNA와 Division 전환 계산 완전 분리): estimateSoloStationSec()는 "이 선수가
// Singles로 나갔다면 전체 workload를 혼자 다 했을 때 걸릴 시간"을 추정하는 함수로, Division 전환
// 예측 전용이다 (그대로 유지, 다른 곳에서 계속 사용). DNA는 그와 다른 질문 — "실제 경기에서 내가
// 담당한 몫을 얼마나 잘 수행했는가" — 이므로, 전체 workload로 부풀리지 않고 팀 기록에 내 담당 비율
// (share%)만 곱한 "내가 실제로 일한 시간"을 최소한의 보정으로 사용한다. share=30(%)이면
// personalSec = teamSec × 0.30 — 2배 이상 부풀리는 일 없음.
function estimateDnaPersonalStationSec(doublesSec, sharePctRaw){
  const sharePct = clamp(Number(sharePctRaw)||50, 1, 99);
  return doublesSec * (sharePct/100);
}
function resolveDnaSegmentContribution(seg, race){
  const slEntry = toSegmentListEntry(seg);
  if(!slEntry) return null;
  const resolved = resolveOfficialSegment(slEntry, race);
  if(resolved.sec==null) return null;
  const sourceDivision = normalizeRaceDivision(race.division)||race.division||null; // this race's OWN division
  const isDoublesRace = String(sourceDivision||"").includes("Doubles");
  const canShare = seg.kind==="station"; // spec: Run 1~8, Transition never share-adjusted
  const sharePctRaw = canShare ? race.share?.[seg.key] : null;
  const hasShare = canShare && sharePctRaw!=null && sharePctRaw!=="" && !isNaN(Number(sharePctRaw));
  if(isDoublesRace && canShare && hasShare){
    // DNA 전용: Division 전환의 estimateSoloStationSec()(전체 workload 환산, Prediction 전용)를 여기서
    // 재사용하지 않는다 — DNA는 estimateDnaPersonalStationSec()(내 담당 몫 시간)만 쓴다.
    const personalSec = estimateDnaPersonalStationSec(resolved.sec, Number(sharePctRaw));
    return { teamTime:resolved.sec, sharePct:Number(sharePctRaw), workloadAdjustedTime:personalSec, sec:personalSec,
      adjustmentApplied:true, hasShareData:true, isDoublesRace, division:sourceDivision, date:race.date, raceName:race.name||race.date };
  }
  // spec (Race DNA — team-record comparison): the primary DNA percentile is always TEAM time vs TEAM
  // benchmark for Doubles stations (see computePooledDnaSegment/computeDnaSegmentsForRace). A missing
  // personal share% only means we can't show the auxiliary "개인 몫" breakdown for this station — it
  // must NOT drop the station from DNA entirely, since we already have the team time we need to score it.
  return { teamTime: isDoublesRace ? resolved.sec : null, sharePct:null, workloadAdjustedTime:null, sec:resolved.sec,
    adjustmentApplied:false, hasShareData:false, isDoublesRace, division:sourceDivision, date:race.date, raceName:race.name||race.date };
}

// One segment, pooled across whichever of the candidate races actually HAVE that segment's data —
// weighted average of (share-adjusted, for Doubles stations) actual seconds, then compared against
// the GOAL Division's own peer benchmark (never the source race's own Division, and never a whole-
// race workload-ratio conversion of the actual itself — see header comment above).
//
// P0 fix (Base/Goal/Source separation): `goalDiv` is the Goal Division (benchmark comparison group —
// STATE.profile.goalDivision || Base Division) and `baseDivision` is passed in ONLY for the debug
// block below (it never affects the actual/benchmark computation). Each pooled race's OWN division
// (Source Division) is tracked per-contribution and surfaced separately in debug — Actual-source and
// Benchmark-source are never allowed to collapse into a single label, even when they differ (e.g.
// Base=Pro Doubles / Goal=Pro / Source=Open Doubles: Actual stays "Open Doubles raw actual", the
// benchmark stays "Pro", and neither is ever mislabeled as the other).
// Converts one pooled DNA segment from its REAL source division into the GOAL division.
// Priority: same-athlete real paired races -> derived real benchmark p50 ratio -> no conversion.
// This keeps source actuals intact for audit/debug while the percentile calculation uses a target-
// comparable value. Mixed uses MIXED benchmark rows as the source and the athlete's gendered
// benchmark as the target, so it is never silently treated as Open.

function computePooledDnaSegment(seg, poolEntries, goalDiv, baseDivision){
  // DNA principle: compare EACH race against the benchmark for THAT race's real Division.
  // Do not convert Open/Mixed/Pro records into another Division just because several
  // Divisions are present in the athlete's history. This keeps DNA as "where am I now?"
  // rather than turning it into a prediction/workload-conversion engine.
  // Doubles share is secondary metadata: it is shown as the athlete's personal workload,
  // but the primary DNA percentile remains based on the original TEAM race time.
  const contributions = poolEntries.map(e=>{
    const c = resolveDnaSegmentContribution(seg, e.race);
    if(!c) return null;
    const sourceDivision = c.division || normalizeRaceDivision(e.race.division) || e.race.division;
    // Doubles (Mixed included): the primary DNA percentile is always TEAM time vs TEAM benchmark.
    // Personal share is shown separately as auxiliary info (dnaContributionCompositionLabel) and
    // never changes the score — a smaller/larger personal share should not make the score look
    // artificially better or worse.
    const comparisonSec = (c.isDoublesRace && c.teamTime!=null) ? c.teamTime : c.sec;
    if(comparisonSec==null) return null;
    const groupFilters = {
      // Mixed rows remain the peer pool; athleteGender only controls the personal station benchmark.
      gender: sourceDivision==="Mixed Doubles" ? "mixed" : (STATE.profile.gender==="female" ? "female":"male"),
      athleteGender: STATE.profile.gender,
      ageGroup: getAgeGroup(Number(STATE.profile.age)),
      division: sourceDivision,
      event:null, date:null, country: STATE.profile.country || null,
      strictAge:true,
    };
    const stats = queryPeerSegmentStats(seg, groupFilters);
    const actualNum=Number(comparisonSec), meanNum=Number(stats.mean), sdNum=Number(stats.sd);
    const z = Number.isFinite(actualNum) && Number.isFinite(meanNum) && Number.isFinite(sdNum) && sdNum>0
      ? (meanNum-actualNum)/sdNum : null;
    const percentile = Number.isFinite(z) ? clamp(normalCdf(z)*100,0.5,99.5) : null;
    return { ...c, weight:e.weight, tier:e.tier, sourceDivision,
      rawSec:actualNum, sec:actualNum, comparisonSec:actualNum,
      peerMean:Number.isFinite(meanNum)?meanNum:null, peerSd:Number.isFinite(sdNum)?sdNum:null, peerN:stats.n, peerIsReal:stats.isReal,
      benchmarkSource:stats.benchmarkSource, sampleN:stats.sampleN,
      z, percentile, timeLoss:comparisonSec-stats.mean };
  }).filter(Boolean);

  if(!contributions.length){
    return { ...seg, actual:null, peerMean:null, peerSd:null, peerN:null, peerIsReal:false,
      benchmarkSource:null, sampleN:null, basis:null, z:null, percentile:null, star:null,
      timeLoss:null, confidence:"none", contributions:[],
      debug:{ baseDivision, goalDivision:goalDiv, sourceDivision:null, actualSource:null,
        benchmarkDivision:null, benchmarkSource:null, sampleN:null, confidence:"none", comparisonMode:"source-division" } };
  }

  const totalW = contributions.reduce((s,c)=>s+Number(c.weight||0),0) || 1;
  const pooledActual = contributions.reduce((s,c)=>s+Number(c.comparisonSec||0)*Number(c.weight||0),0)/totalW;
  const meanVals = contributions.filter(c=>Number.isFinite(c.peerMean));
  const meanW = meanVals.reduce((s,c)=>s+Number(c.weight||0),0) || 1;
  const peerMean = meanVals.length ? meanVals.reduce((s,c)=>s+c.peerMean*Number(c.weight||0),0)/meanW : null;
  const sdVals = contributions.filter(c=>Number.isFinite(c.peerSd) && c.peerSd>0);
  const sdW = sdVals.reduce((s,c)=>s+Number(c.weight||0),0) || 1;
  const peerSd = sdVals.length ? sdVals.reduce((s,c)=>s+c.peerSd*Number(c.weight||0),0)/sdW : null;
  // A missing Z in one historical contribution must not erase valid Z/percentile
  // values from the other contributions. Renormalize over the valid contributions.
  const zVals = contributions.filter(c=>Number.isFinite(c.z));
  const zW = zVals.reduce((s,c)=>s+Number(c.weight||0),0) || 1;
  const z = zVals.length ? zVals.reduce((s,c)=>s+c.z*Number(c.weight||0),0)/zW : null;
  const percentileVals = contributions.filter(c=>Number.isFinite(c.percentile));
  const percentileW = percentileVals.reduce((s,c)=>s+Number(c.weight||0),0) || 1;
  const percentile = percentileVals.length
    ? percentileVals.reduce((s,c)=>s+c.percentile*Number(c.weight||0),0)/percentileW
    : null;
  const timeLoss = contributions.reduce((s,c)=>s+(c.timeLoss??0)*c.weight,0)/totalW;
  const sourceWeights={};
  contributions.forEach(c=>{ const d=c.sourceDivision||"?"; sourceWeights[d]=(sourceWeights[d]||0)+c.weight; });
  const sourceDivisions=Object.keys(sourceWeights);
  const actualSource=sourceDivisions.map(d=>`${d} ${Math.round(sourceWeights[d]/totalW*1000)/10}%`).join(" + ");
  const benchmarkSources=[...new Set(contributions.map(c=>c.benchmarkSource).filter(Boolean))];
  const sampleNs=contributions.map(c=>Number(c.sampleN)).filter(Number.isFinite);
  const peerNs=contributions.map(c=>Number(c.peerN)).filter(Number.isFinite);
  const peerIsReal=contributions.every(c=>c.peerIsReal);
  const anyMissingShare=contributions.some(c=>c.isDoublesRace && !c.hasShareData);
  const confidence=contributions.length>=2 ? (anyMissingShare?"medium":"high") : (anyMissingShare?"low":"medium");
  const debug={
    baseDivision, goalDivision:goalDiv, sourceDivision:sourceDivisions.length===1?sourceDivisions[0]:sourceDivisions,
    actualSource, benchmarkDivision:sourceDivisions.length===1?sourceDivisions[0]:sourceDivisions,
    benchmarkSource:benchmarkSources.join(" + "), sampleN:sampleNs.length?Math.min(...sampleNs):null,
    confidence, comparisonMode:"source-division", doublesShareIsSecondary:true,
  };
  return { ...seg, actual:pooledActual, peerMean, peerSd,
    peerN:peerNs.length?Math.min(...peerNs):null, peerIsReal, benchmarkSource:benchmarkSources.join(" + "),
    sampleN:sampleNs.length?Math.min(...sampleNs):null,
    basis: contributions.some(c=>c.isDoublesRace && c.hasShareData) ? "team-record-primary" : "actual",
    z, percentile, star:percentile!=null ? starRating(z??0) : null, timeLoss, confidence, debug,
    contributions: contributions.map(c=>({ date:c.date, raceName:c.raceName, division:c.division,
      weight:Math.round(c.weight*1000)/1000, teamTime:c.teamTime, sharePct:c.sharePct,
      workloadAdjustedTime:c.workloadAdjustedTime, adjustmentApplied:c.adjustmentApplied,
      resolvedSec:c.rawSec, convertedSec:c.comparisonSec, conversionFactor:1,
      conversionMethod:"none", conversionHops:0, conversionConfidence:"High",
      benchmarkDivision:c.sourceDivision, peerMean:c.peerMean, peerN:c.peerN,
      percentile:c.percentile })) };
}

// Per-division adjustment applied to the PEER_SEGMENTS base (Open Singles) table, by segment kind.
// Doubles reuses the same run-unchanged / station-split logic as the main BENCH table above.
// Mixed Doubles has NO entry here on purpose: per-segment its benchmark is derived by averaging the
// Men's and Women's Open-Doubles benchmarks (see computePeerAnalysis) rather than from a world-record
// ratio applied as a fixed Division correction factor.
const PEER_DIVISION_ADJUST = {
  "Open":           { run:1.00, station:1.00, transition:1.00 },
  "Pro":            { run:0.80, station:0.80, transition:0.85 },
  "Open Doubles":   { run:1.00, station:DOUBLES_STATION_FACTOR, transition:1.05 },
  "Pro Doubles":    { run:0.80, station:0.80*DOUBLES_STATION_FACTOR, transition:0.89 },
};
const SINGLES_GENDER_MULT = 1.22; // ~90min vs ~110min sourced Open Singles average ratio
// Men's vs Women's Pro Doubles world records (47:41 vs 54:24) — used only to derive the Women's-
// Doubles benchmark itself (a real, sourced gender-performance gap). Mixed Doubles never multiplies
// by this directly; it's built by averaging the resulting Men's/Women's Doubles benchmarks instead.
const DOUBLES_GENDER_MULT = 1.14;

// spec (DNA Evolution): the exact per-race, per-segment computation that computePeerAnalysisUncached()
// already does for "the current race" (division/gender/age-group group filters resolved from the race
// itself, queryPeerSegmentStats() → resolveOfficialSegment() → z/percentile — identical call chain, zero
// new benchmark logic) — factored out so DNA Evolution can run it across MULTIPLE historical races
// without duplicating or reinventing any of this math. computePeerAnalysisUncached() below now calls
// this too, so the existing single-race Race DNA screen's output is byte-for-byte unchanged.
function computeDnaSegmentsForRace(race){
  if(!race) return null;
  const profile=STATE.profile;
  const ageGroup=getAgeGroup(Number(profile.age));
  const raceDiv = normalizeRaceDivision(race.division) || profile.division;
  // Mixed Doubles is team-level: compare against Mixed teams regardless of the athlete's sex.
  const gender = raceDiv==="Mixed Doubles" ? "mixed" : (profile.gender==="female" ? "female":"male");
  const division = DIVISIONS.includes(raceDiv) ? raceDiv : (DIVISIONS.includes(profile.division) ? profile.division : "Open");
  const groupFilters = { gender, ageGroup, division, event:null, date:null, country:profile.country||null, strictAge:true };
  const segments = PEER_SEGMENTS.map(seg=>{
    const stats=queryPeerSegmentStats(seg,{...groupFilters, athleteGender:profile.gender});
    const contribution=resolveDnaSegmentContribution(seg,race);
    if(!contribution) return { ...seg, actual:null, peerMean:stats.mean, peerSd:stats.sd, peerN:stats.n,
      peerIsReal:stats.isReal, benchmarkSource:stats.benchmarkSource, sampleN:stats.sampleN,
      basis:null,z:null,percentile:null,star:null,timeLoss:null,contribution:null };
    // Doubles (Mixed included): the primary DNA percentile is always TEAM time vs TEAM benchmark.
    // Personal share is shown separately as auxiliary info and never changes the score.
    const comparisonSec=(contribution.isDoublesRace && contribution.teamTime!=null) ? contribution.teamTime : contribution.sec;
    const z=stats.sd ? (stats.mean-comparisonSec)/stats.sd : null;
    const percentile=z!=null ? clamp(normalCdf(z)*100,0.5,99.5) : null;
    return { ...seg, actual:comparisonSec, peerMean:stats.mean, peerSd:stats.sd, peerN:stats.n,
      peerIsReal:stats.isReal, benchmarkSource:stats.benchmarkSource, sampleN:stats.sampleN,
      basis:contribution.isDoublesRace&&contribution.hasShareData?"team-record-primary":"actual",
      z,percentile,star:percentile!=null?starRating(z??0):null,
      timeLoss:comparisonSec-stats.mean,contribution };
  });
  return { group:{gender,ageGroup,division}, race, segments };
}
// spec (전면수정 Phase 2): 상세분석(Race DNA) 페이지에서, 등록된 대회가 여러 건이면 "가중 평균(전체)"
// 대신 특정 한 경기만 골라서 그 경기 기준 DNA를 볼 수 있게 한다. null이면 기존과 동일하게 최근
// 대회들을 recency-weighted로 pooling한다.
let DNA_RACE_FILTER = null;
function computePeerAnalysis(forceNoFilter){
  const filterKey = forceNoFilter ? "all" : (DNA_RACE_FILTER||"all");
  return memoPure("peer:"+pureCacheProfileKey()+":"+filterKey, ()=>computePeerAnalysisUncached(forceNoFilter));
}
// spec (DNA Division fallback): the race actually chosen for DNA computation is deliberately
// SEPARATE from the athlete's configured Division (STATE.profile.division, which this never mutates
// and which prediction/goal continue to use exactly as before — no change to BASE DIVISION / EXACT
// RACE DIVISION separation elsewhere in this file). "기록이 있는가?"가 먼저, "목표 Division과 같은가?"
// 는 그 다음이라는 원칙 그대로: real race data always wins over a Division match.
//
// Priority (spec): ① exact Division match → ② same Doubles family (Open/Pro Doubles only — Mixed
// Doubles never counts as "the same family" as Open/Pro, and vice versa) → ③ same base Division
// (Open/Pro/Mixed via divisionBase()) → ④ any other real race. Within each tier, prefers whichever
// race has the MOST complete Run+Station+Transition data (so a real but sparse "exact division" match
// never wins over a fuller-data race in a lower tier purely on Division label) — this is exactly what
// fixes "Engine/Strength/Skill 축이 실제 데이터가 있는데도 —로 표시되는" bug: previously the selection
// was just "exact division, else literally the single most-recent race regardless of division or
// completeness", which could pick a sparse race over a complete one sitting right there in the
// athlete's own race history.
function raceDataCompleteness(race){
  let n=0;
  RUN_KEYS.forEach(k=>{ if(parseTimeToSec(race.runs?.[k])!=null) n++; });
  STATIONS.forEach(s=>{ if(parseTimeToSec(race.stations?.[s.key])!=null) n++; });
  if(parseTimeToSec(race.transition)!=null) n++;
  return n; // 0..17
}
// spec (전면수정 Phase 2 - 완전 분리): Race DNA의 비교 Division은 STATE.profile.division(프로필의
// "기준" 필드)도, STATE.profile.goalDivision(목표)도 아니라 — 실제로 보유한 대회 기록 중 가장 최근
// 기록의 Division에서 그대로 뽑는다. "내가 실제로 보유한 기록의 Division"이라는 요구사항을 그대로
// 코드로 옮긴 것 — 목표 설정과 완전히 무관하게 동작한다.
function deriveDnaActualDivision(){
  const races=[...STATE.races].filter(r=>r&&r.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!races.length) return null;
  return normalizeRaceDivision(races[0].division) || races[0].division;
}
// axis-level average that only ever averages over AVAILABLE component segments (never requires all of
// them) and reports a coverage-aware confidence label — so "1/2 segments" and "2/2 segments" both
// produce a score, but the UI can show WHICH one to trust more (spec: "데이터 1개로 계산된 64점과
// 충분한 데이터로 계산된 64점은 동일한 신뢰도로 취급하면 안 된다").
function avgPctWithConf(keys, byKeyFn){
  const vals=[], confs=[];
  keys.forEach(k=>{ const s=byKeyFn(k); if(s && s.percentile!=null){ vals.push(s.percentile); confs.push(s.confidence); } });
  if(!vals.length) return { value:null, count:0, total:keys.length, confidence:"none" };
  const confRank = { high:3, medium:2, low:1, none:0 };
  let label = confs.reduce((w,c)=> confRank[c]<confRank[w] ? c : w, confs[0]);
  if(vals.length<keys.length && label==="high") label="medium"; // partial coverage never reads as full-confidence
  return { value: mean(vals), count:vals.length, total:keys.length, confidence:label };
}
function computePeerAnalysisUncached(forceNoFilter){
  const activeRaceFilter = forceNoFilter ? null : DNA_RACE_FILTER;
  // spec (Race DNA 실제 기록 기반 가중치): the main DNA snapshot no longer picks ONE race and uses only
  // its data — it pools up to 3 real races (recency-weighted 60/30/10, Division-fallback-tiered per
  // dnaDivisionTierList) and resolves each of the 17 segments INDEPENDENTLY across whichever pooled
  // races actually have that segment's data (segment-level fallback, not race-level). Doubles STATION
  // segments apply the athlete's own recorded sharePct via the SAME estimateSoloStationSec() the
  // Doubles→Singles conversion uses; Run/Transition never get share-adjusted. The benchmark comparison
  // group is always the athlete's configured (goal) Division — the real actual seconds themselves are
  // NEVER rescaled by a whole-race Division-workload multiplier (that's Prediction's job, not DNA's).
  // Race DNA는 "목표 Division에서 내가 얼마나 잘할까?"가 아니라
  // "내가 실제로 뛴 Division에서 동조건 참가자 대비 어디인가?"를 보여준다.
  // 따라서 profile.goalDivision은 Race DNA 비교군을 절대 결정하지 않는다.
  //
  // 우선순위
  //  1) 특정 경기를 선택했다면 → 그 경기의 실제 Division
  //  2) 전체 보기라면 → 프로필의 실제/기준 Division에 실제 경기 기록이 있으면 그 Division
  //  3) 그마저 없으면 → 가장 최근 실제 경기의 Division
  //  4) 해당 Division 기록이 전혀 없을 때만 gatherPooledDnaRaces()의 fallback
  //
  // 핵심: Base=Mixed Doubles + Goal=Pro Doubles + Mixed 실제 기록 보유
  //       → Race DNA는 반드시 Mixed Doubles peer sample과 비교한다.
  const chosenRaceForFilter = activeRaceFilter ? STATE.races.find(r=>r && r.id===activeRaceFilter) : null;
  const allDnaRaces = [...STATE.races].filter(r=>r&&r.date)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const profileActualDivision = normalizeRaceDivision(STATE.profile.division) || STATE.profile.division || null;
  const selectedDivision = chosenRaceForFilter
    ? (normalizeRaceDivision(chosenRaceForFilter.division) || chosenRaceForFilter.division)
    : null;
  // Race DNA comparison group is anchored to the athlete's ACTUAL selected/latest race.
  // Never let the profile/base Division silently override the real race Division.
  const actualDivisionForDna = selectedDivision || deriveDnaActualDivision() || null;
  // baseDivision remains the athlete's actual/base setting for metadata.
  // goalDiv is deliberately named for compatibility with the existing pooled-DNA helpers,
  // but in this function it means "DNA comparison Division", NEVER goalDivision.
  const baseDivision = profileActualDivision || actualDivisionForDna;
  const goalDiv = actualDivisionForDna;
  // 특정 경기가 선택되어 있으면(DNA_RACE_FILTER) 그 경기 하나만 weight=1로 사용 — 없으면 기존과
  // 동일하게 최근 대회들을 recency-weighted로 pooling한다.
  let pool;
  if(activeRaceFilter){
    if(chosenRaceForFilter){
      const sourceDiv = normalizeRaceDivision(chosenRaceForFilter.division)||chosenRaceForFilter.division;
      pool = { entries:[{ race:chosenRaceForFilter, weight:1, tier:0, sourceDivision:sourceDiv, conversion:dnaDivisionPath(goalDiv,sourceDiv,STATE.profile.gender) }],
        exactMatch: sourceDiv===goalDiv, tierUsed:0, blended:false, tierDivisions:[sourceDiv], secondaryDivisions:null };
    } else {
      pool = gatherPooledDnaRaces(goalDiv); // stale/deleted id — fall back to normal pooling
    }
  } else {
    pool = gatherPooledDnaRaces(goalDiv);
  }
  if(!pool.entries.length) return null;
  const raceDivisionMismatch = !pool.exactMatch;
  const primaryRace = pool.entries[0].race; // most-weighted race — kept for the handful of call sites
                                             // that still need ONE representative race object (e.g.
                                             // computeStationInducedDegradation's single-race analysis).
  const primarySourceDivision = primaryRace ? (normalizeRaceDivision(primaryRace.division)||primaryRace.division) : null;

  const segmentsRaw = PEER_SEGMENTS.map(seg=>computePooledDnaSegment(seg, pool.entries, goalDiv, baseDivision));
  const segments = segmentsRaw.map(s=>({ ...s, personalHistory: getPersonalSegmentHistory(s) }));
  const have = segments.filter(s=>s.actual!=null);
  if(!have.length) return null;

  const pooledDivisions=[...new Set(pool.entries.map(e=>normalizeRaceDivision(e.race?.division)||e.race?.division).filter(Boolean))];
  const group = { gender: STATE.profile.gender==="female"?"female":"male", ageGroup: getAgeGroup(Number(STATE.profile.age)),
    division: goalDiv || (pooledDivisions.length===1 ? pooledDivisions[0] : "ACTUAL_RACE_DIVISIONS") };
  const byKey=k=>segments.find(s=>s.key===k);
  const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null);
  const stationSegs = segments.filter(s=>s.kind==="station" && s.actual!=null);
  const roxzone = byKey("roxzone");

  // ---- Impact Score (weighted contribution of each bottleneck to total time lost) ----
  const runTimeLoss = runSegs.length===8 ? runSegs.reduce((s,r)=>s+r.timeLoss,0) : null;
  const impactCandidates = [];
  if(runTimeLoss!=null){
    const runPercentiles=runSegs.filter(s=>Number.isFinite(s.percentile)).map(s=>s.percentile);
    impactCandidates.push({
      key:"run", label:"Running (8구간 합)", timeLoss:runTimeLoss, weight:IMPACT_WEIGHTS.run,
      percentile:runPercentiles.length ? mean(runPercentiles) : null
    });
  }
  ["ski","sledPush","sledPull","burpee","row","carry","lunge","wallball"].forEach(k=>{
    const s=byKey(k);
    if(s && s.actual!=null){
      // Carry the SAME peer percentile already displayed in Station별 수행력
      // into the improvement-priority ranking. No new benchmark/statistic is created.
      impactCandidates.push({
        key:k, label:s.label, timeLoss:s.timeLoss, weight:IMPACT_WEIGHTS[k],
        percentile:Number.isFinite(s.percentile) ? s.percentile : null
      });
    }
  });
  const totalWeightedLoss = impactCandidates.reduce((sum,c)=>sum+Math.max(0,c.timeLoss)*c.weight,0);
  const impactList = impactCandidates.map(c=>({ ...c, impactPct: totalWeightedLoss>0 ? (Math.max(0,c.timeLoss)*c.weight/totalWeightedLoss)*100 : 0 }))
    .sort((a,b)=>b.impactPct-a.impactPct);
  const totalLossSec = impactCandidates.reduce((s,c)=>s+Math.max(0,c.timeLoss),0);

  // ---- Strength Index (7 sub-indices, 0-100, percentile-based) — each averages only over the
  // component segments that actually have data, with a coverage-aware confidence label attached
  // (spec: "특정 한 경기에서 Wall Ball이 없다는 이유로 HYROX 기술·효율 전체가 —가 되어서는 안 된다").
  const runningC = avgPctWithConf(runSegs.map(s=>s.key), byKey);
  const stationsC = avgPctWithConf(stationSegs.map(s=>s.key), byKey);
  const powerC = avgPctWithConf(["sledPush","sledPull","lunge"], byKey);
  const engineC = avgPctWithConf(["ski","row","burpee"], byKey);
  const gripC = avgPctWithConf(["carry","sledPull"], byKey);
  const earlyC = avgPctWithConf(["ski","sledPush"], byKey);
  const lateC = avgPctWithConf(["lunge","wallball"], byKey);
  const fatigueResistance = (earlyC.value!=null&&lateC.value!=null) ? clamp(100-(earlyC.value-lateC.value),0,100) : null;
  const fatigueResConf = (earlyC.value!=null&&lateC.value!=null) ? { count:earlyC.count+lateC.count, total:4,
    confidence: (earlyC.confidence==="none"||lateC.confidence==="none")?"none":(earlyC.count+lateC.count<4?"medium":"high") } : { count:0,total:4,confidence:"none" };
  const strengthIdx = { running:runningC.value, stations:stationsC.value, transition:roxzone.percentile, power:powerC.value, engine:engineC.value, grip:gripC.value, fatigueResistance };
  const strengthIdxConfidence = { running:runningC, stations:stationsC, transition:{count:roxzone.percentile!=null?1:0,total:1,confidence:roxzone.confidence||"none"},
    power:powerC, engine:engineC, grip:gripC, fatigueResistance:fatigueResConf };

  const raceDna = classifyRaceDna(strengthIdx);
  const interpretation = buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race:primaryRace });

  // spec §2: per-segment real-data coverage — how many of the (up to 17) segments actually cleared
  // MIN_REAL_SAMPLE and are showing real percentile vs how many fell back to the illustrative model.
  const realSegmentCount = segments.filter(s=>s.peerIsReal).length;
  const totalSegmentCount = segments.filter(s=>s.actual!=null).length;

  // 데이터 출처 요약 (spec §9): 실제 사용자 기록을 하나라도 썼다면 "REAL USER DATA" 구성 정보를,
  // 아니면(이 시점에 도달했다는 것 자체가 실제 기록이 있다는 뜻이므로 사실상 항상 채워짐) 비워둔다.
  const userDataComposition = {
    raceCount: pool.entries.length,
    exactMatch: pool.exactMatch,
    blended: pool.blended,
    tierDivisions: pool.tierDivisions,
    secondaryDivisions: pool.secondaryDivisions,
    races: pool.entries.map(e=>({ date:e.race.date, name:e.race.name||e.race.date, division:normalizeRaceDivision(e.race.division)||e.race.division, weight:Math.round(e.weight*1000)/1000 })),
    // Base/Goal/Source separation, carried through for the UI banner (dnaUserDataCompositionBanner)
    // so it never has to re-derive these from STATE.profile.division itself.
    baseDivision, goalDivision: goalDiv, primarySourceDivision,
  };

  return { group, race:primaryRace, pool, raceDivisionMismatch, segments, impactList, totalLossSec, strengthIdx, strengthIdxConfidence, raceDna, interpretation,
    userDataComposition,
    // Top-level Base/Goal/Source fields (spec: never let UI/debug fall back to reading
    // STATE.profile.division directly and mistaking it for the Goal Division).
    baseDivision, goalDivision: goalDiv, primarySourceDivision,
    dataSource: { isReal: PEER_DATA_SOURCE.isReal, sourceLabel: PEER_DATA_SOURCE.sourceLabel,
      realSegmentCount, totalSegmentCount, externalDbSize: EXTERNAL_RACE_DB.length,
      exactPeerGroupN: exactDnaPeerGroupCount(group) } };
}

/* ---------------------------------------------------------------------- */
/* 9e. PODIUM PROBABILITY ENGINE ("나의 포디움 가능성은?")                    */
/*     Reuses existing engines wholesale — no new prediction formula, no    */
/*     new stats primitive. Current estimate + range comes straight from    */
/*     predictTime() (same Anchor/HPI/confidence machinery every other page */
/*     already uses). Podium cutoff times come from EXTERNAL_RACE_DB — the  */
/*     SAME real-results table queryPeerSegmentStats()/computePeerAnalysis()*/
/*     already use for percentile analysis. Probability is derived by       */
/*     treating predictTime()'s own ciLow/ciHigh band as an approximate      */
/*     normal distribution (using the SAME normalCdf() the rest of this     */
/*     file already uses for percentile math) and asking how much of that   */
/*     distribution clears the podium cutoff — never a step function        */
/*     (current<cutoff -> 100%/0%), per spec §15.                           */
/* ---------------------------------------------------------------------- */
// predictTime()'s range is documented (PREDICTION_TARGET_COVERAGE) as a hand-tuned band targeting
// ~70% central coverage of real outcomes — z=1.036 is the two-tailed z-score for 70% central coverage,
// used only to convert that existing half-width into an approximate standard deviation. No new
// uncertainty model is introduced; this just reads predictTime()'s own stated calibration target.
const PODIUM_RANGE_Z = 1.036;

// spec §11: 대회/지역 -> Division/Gender/AgeGroup 순으로 fallback. EXTERNAL_RACE_DB is the SAME table
// hyroxDbRowToExternal()/queryPeerSegmentStats() already populate and read — no new data structure.
/* ---------------------------------------------------------------------- */
/* PODIUM <-> DNA CONNECTION (doc8)                                        */
/*   predictTime()'s existing Segment Model (buildRaceSegmentModel ->      */
/*   resolveSegment, which already prioritizes real race/simulation actuals*/
/*   and already falls back to the SAME queryDerivedBenchmark() ASIA/Global*/
/*   chain DNA uses) is the SAME underlying real data DNA's percentile is  */
/*   computed from — actual seconds vs. peer-mean seconds. Re-injecting a  */
/*   percentile-derived "adjustment" into predictedSec on top of that would*/
/*   double-count the same facts, which is exactly the kind of invented    */
/*   formula doc8 §18/§28 forbids. So this layer does NOT touch            */
/*   predictedSec's formula. What it DOES add, as genuinely new/missing    */
/*   connections:                                                          */
/*     1) computeDnaRaceCompetitiveScore() — a race-time-WEIGHTED DNA       */
/*        aggregate (doc8 §6/§7/§9 explicitly forbid a flat average across */
/*        segments) surfaced on the Podium card as "DNA Race Score".       */
/*     2) matrixImpliedPercentile()/checkDnaMatrixConsistency() — cross-    */
/*        checks DNA percentile against GLOBAL_MATRIX's own P1-P100 time   */
/*        buckets for the same segment and flags large disagreements as a  */
/*        diagnostic (doc8 §13/§23, PODIUM-DNA-08) — surfaced, not hidden. */
/*     3) The 10K-calibration + Simulation connections above already flow  */
/*        into predictedSec THROUGH the existing Segment Model — this is   */
/*        the real mechanism doc8's "predictedSec 자체를 변경" ask maps to. */
/* ---------------------------------------------------------------------- */
// Time-weighted DNA aggregate: each segment's percentile is weighted by its share of the athlete's
// OWN actual total race time, not counted equally with every other segment — a 20s Sled Push swing
// matters far less to the overall race than a 3min Running total swing (doc8 §6/§7 explicitly forbid
// the flat/simple average). Uses computePeerAnalysis()'s own segment percentiles/actuals as-is — no
// new statistics, purely a race-level aggregation layer on top of the existing DNA numbers.
function computeDnaRaceCompetitiveScore(peer){
  if(!peer) return null;
  const withData = peer.segments.filter(s=>s.actual!=null && s.percentile!=null && s.actual>0);
  if(!withData.length) return null;
  const totalSec = withData.reduce((sum,s)=>sum+s.actual,0);
  if(totalSec<=0) return null;
  const weightedPercentile = withData.reduce((sum,s)=> sum + s.percentile*(s.actual/totalSec), 0);
  return { score: clamp(weightedPercentile,0.5,99.5), segmentCount: withData.length, totalWeightedSec: totalSec };
}
// benchmark_rows' p1..p100 fields are TIME buckets in ASCENDING order (a small bucket number = a FAST/
// elite time; a large one = a SLOW time) — the OPPOSITE convention from DNA's own percentile (higher =
// better/faster). This interpolates the athlete's actual segment time within the row's real buckets and
// flips it to DNA's "higher = better" convention, so the two numbers are directly comparable. Returns
// null (never a guess) when the row has fewer than 2 usable buckets.
const BENCHMARK_PERCENTILE_BUCKETS = [
  { key:"p1", pct:1 }, { key:"p10", pct:10 }, { key:"p25", pct:25 }, { key:"p50", pct:50 },
  { key:"p75", pct:75 }, { key:"p90", pct:90 }, { key:"p100", pct:100 },
];
function matrixImpliedPercentile(row, actualSec){
  if(!row || actualSec==null) return null;

  if(actualSec>=buckets[buckets.length-1].sec) return clamp(100-buckets[buckets.length-1].pct, 0.5, 99.5);
  for(let i=0;i<buckets.length-1;i++){

    if(actualSec>=a.sec && actualSec<=b.sec){
      const frac=(actualSec-a.sec)/(b.sec-a.sec);

// Podium benchmark: rolling 6-calendar-month window at query time.
function getPodiumDataCutoffDate(now=new Date()){
  const d=new Date(now); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-6); return d;
}
function getPodiumRowDate(r){

    const key=canonicalEventKey(r);

    if(!byEvent.has(key)) byEvent.set(key, []);
    byEvent.get(key).push(r);

  const podiums=[];
  byEvent.forEach((list,eventKey)=>{
    if(list.length<PODIUM_MIN_EVENT_FINISHERS) return; // no real 3rd place to extract
    const sorted=[...list].sort((a,b)=>a.overall_time-b.overall_time);
    podiums.push({ event:eventKey, n:list.length,

  const repEvent = eventPodiums.reduce((best,e)=> Math.abs(e.third-cutoff)<Math.abs(best.third-cutoff) ? e : best, eventPodiums[0]);

    podium:[stat(firsts), stat(seconds), cutoff], podiumRows:[null,null,repEvent.thirdRow],
    method, distribution:{ min:Math.min(...thirds), p25:percentileOf(thirds,0.25), median:medianOf(thirds), p75:percentileOf(thirds,0.75), max:Math.max(...thirds) },
    eventCount:eventPodiums.length, totalRiders:eventPodiums.reduce((s,e)=>s+e.n,0),

// doc9 §25: Podium Gap decomposition into per-segment seconds — ONLY when the specific comparison
// record (the actual 3rd-place row from EXTERNAL_RACE_DB) has its own real segment splits, which not
// every uploaded CSV provides. The athlete's side reuses buildRaceSegmentModel()'s real 17-segment
// breakdown (same real actuals/benchmarks predictTime() itself is built from), scaled by the single
// factor that reconciles its total with predictTime()'s own predictedSec — a proportional
// redistribution of the exact same number, not an invented one. Any segment missing from the cutoff
// record is skipped rather than guessed; if fewer than half the segments can be compared this returns
// null so the UI falls back to the existing ranked weakness list instead of a fabricated breakdown.
const PODIUM_GAP_SEGMENT_FIELD = { ski:"ski", sledPush:"sled_push", sledPull:"sled_pull", burpee:"burpee",

function computePodiumGapDecomposition(predictedSec, cutoffRow, targetDivision){
  if(!cutoffRow || predictedSec==null) return null;
  // Podium GAP must use the same Division context as the predicted athlete time.
  // Do not permanently mutate the athlete's base/profile Division.
  const model = targetDivision
    ? buildRaceSegmentModel({ mode:"race", division:targetDivision })
    : buildRaceSegmentModel();
  if(!model.total || model.total<=0) return null;
  const scale = predictedSec/model.total;
  const rows=[];
  let accountedGap=0;
  model.segments.forEach(seg=>{
    const baseSec = seg.sec!=null ? seg.sec : seg.benchmark;
    if(baseSec==null) return;
    const mySec = baseSec*scale;
    const field = seg.type==="run" ? "run_"+seg.runIdx : (seg.type==="transition" ? "transition" : PODIUM_GAP_SEGMENT_FIELD[seg.key]);
    const cutoffSec = field!=null ? cutoffRow[field] : null;
    if(cutoffSec==null) return; // not in the cutoff record — skip, never guess
    const gap = mySec-cutoffSec;
    rows.push({ label:seg.label, key:seg.key, gapSec:gap });
    accountedGap += gap;
  });

  rows.sort((a,b)=>b.gapSec-a.gapSec);

function computePodiumProbability(predictedSec, ciLow, ciHigh, cutoffSec){
  const halfWidth = Math.max(1,(ciHigh-ciLow)/2);

  const buffer = clamp(sigma*0.6, 15, 180);
  return cutoffSec - buffer;

function predictPodiumForDivision(targetDivision, weeksToRace){
  const div=normalizeRaceDivision(targetDivision)||"Open Doubles";
  const r=raceOnlyPrediction(div);
  return { ...r, predictionDivision:div, workloadModel:null, horizonWeeks:0 };
}

async function computePodiumAnalysis(){
  const p=STATE.profile;
  // Podium prediction uses the same race-date horizon as the Prediction page.
  // e.g. 4 weeks to race -> 4-week forecast, 1 week -> 1-week forecast.
  // The selected Division must also be the Division used by the prediction engine.
  const dRace=daysToRace();
  const weeksToRace = 0; // Race-only model: no training/future-HPI projection.
  // IMPORTANT: prediction and podium benchmark must use the SAME selected Division.
  // Use the actual runway to race day, exactly like the Prediction page.
  const goalDiv = normalizeRaceDivision(p.goalDivision || p.division) || "Open Doubles";
  const pred = predictPodiumForDivision(goalDiv, weeksToRace);
  // DNA is supplementary only. Podium prediction must remain usable even if the optional
  // peer-analysis layer fails or is temporarily unavailable on a mobile device.
  let peer=null, dnaScore=null, dnaConsistencyFlags=[], dnaWeaknessRank={source:"none",items:[]};
  try{
    peer = computePeerAnalysis(true);
    dnaScore = computeDnaRaceCompetitiveScore(peer);
    dnaConsistencyFlags = checkDnaMatrixConsistency(peer);
    dnaWeaknessRank = peer ? { source:"dna", items:buildImprovementTop3(peer.impactList, peer.race).slice(0,3) } : dnaWeaknessRank;
  }catch(e){ console.warn("Optional DNA layer failed during podium analysis:", e?.message||e); }
  const genderStr = (p.goalGender || p.gender)==="female" ? "female":"male";
  const ageGroup = p.goalAgeGroup || getAgeGroup(Number(p.age));
  // Target event name is NOT a benchmark filter. The benchmark is always the
  // rolling 6-month global pool.
  const eventName = "";
  const benchmark = await computePodiumBenchmark(null, goalDiv, genderStr, ageGroup);
  const predConf = calcPredictionConfidence();
  const result = { predicted:pred.predicted, ciLow:pred.ciLow, ciHigh:pred.ciHigh, predConfidence:predConf.label,
    benchmark, goalDiv, eventName, weeksToRace, dRace, dnaScore, dnaConsistencyFlags, dnaWeaknessRank };
  result.predictionDivision = pred.predictionDivision;
  result.benchmarkDivision = goalDiv;
  result.divisionMatch = (pred.predictionDivision===goalDiv);
  if(benchmark.scope==="insufficient"){ result.status="insufficient"; return result; }
  const cutoff = benchmark.podium[Math.min(2, benchmark.podium.length-1)];
  const cutoffRow = benchmark.podiumRows ? benchmark.podiumRows[Math.min(2, benchmark.podiumRows.length-1)] : null;
  result.status="ok";
  result.cutoff=cutoff;
  result.gapDecomposition = computePodiumGapDecomposition(pred.predicted, cutoffRow, goalDiv);
  result.predictionDivision = pred.predictionDivision;
  result.benchmarkDivision = goalDiv;
  result.divisionMatch = (pred.predictionDivision===goalDiv);
  result.workloadModel = pred.workloadModel;
  result.probability=computePodiumProbability(pred.predicted, pred.ciLow, pred.ciHigh, cutoff);
  result.qual=probToQualLabel(result.probability);
  result.safeTarget=computePodiumSafeTarget(pred.ciLow, pred.ciHigh, cutoff);
  result.gapSec=pred.predicted-cutoff; // positive = still need to get faster than 3rd place
  // spec §22: blend prediction confidence with comparison-sample size — reuses calcPredictionConfidence()
  // as-is, just adds the sample-size gate on top rather than inventing a second confidence model.
  result.overallConfidence = (predConf.label==="HIGH" && benchmark.n>=30) ? "HIGH"
    : (predConf.label==="LOW" || benchmark.n<10) ? "LOW" : "MEDIUM";
  return result;
}

/* ---------------------------------------------------------------------- */
/* PHASE 4 — RACE DNA: Historical / Current Adjustment / Current /          */
/*     Projected / Confidence / Source (doc 16 §2-3)                        */
/*     Reuses calcHPI(tier1Only) exactly as-is — no new scoring logic.       */
/*     calcHPI(true) already IS "Historical" (Tier-1 실제 대회/PB 증거만),    */
/*     calcHPI(false) already IS "Current" (+Tier-2 Garmin/훈련 추세 EMA).    */
/*     Honesty constraint: only Running/Engine currently have a REAL        */
/*     Tier-1-vs-Tier-2 split in calcRunningIndex/calcEngineIndex — for     */
/*     StrengthEnd/Skill/RaceExec, calcHPI(true) returns the exact same     */
/*     score as calcHPI(false) today (no tier1Only branch exists yet for    */
/*     those sub-calculators), so their "adjustment" is honestly 0 rather   */
/*     than a fabricated split. Recovery has no Historical concept at all   */
/*     (it's inherently a training-trend signal, never race-evidence) and   */
/*     is explicitly marked hasHistoricalConcept:false instead of forcing   */
/*     a Historical number that doesn't mean anything.                     */
/* ---------------------------------------------------------------------- */


function buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race }){
  const have=segments.filter(s=>s.percentile!=null);
  const strongest=[...have].sort((a,b)=>b.percentile-a.percentile)[0];
  const top=impactList.slice(0,3).filter(c=>c.impactPct>0.5);
  const sentences=[];
  if(strongest){
    // per-segment gate (spec §2): percentile language only for THIS segment if it individually
    // cleared MIN_REAL_SAMPLE real records — a globally "connected" DB doesn't make every segment real.
    const rankPhrase = strongest.peerIsReal
      ? `아시아 동일 그룹 상위 ${round1(100-strongest.percentile)}% 수준(${strongest.star.label})`
      : `그룹 평균 대비 ${strongest.star.label} 수준(예시 추정 모델 기준)`;
    sentences.push(`${strongest.label}${strongest.kind==="run"?" 구간":""}은 ${rankPhrase}으로 강점입니다.`);
  }
  if(top[0]){
    const t0=top[0];
    const lossStr = t0.timeLoss>=0 ? `약 ${fmtTime(Math.abs(t0.timeLoss))} 손실` : `오히려 ${fmtTime(Math.abs(t0.timeLoss))} 이득`;
    sentences.push(`반면 ${t0.label}은 평균 대비 ${lossStr}이 발생하며 전체 기록 개선 여지가 가장 큰 구간입니다(영향도 ${round1(t0.impactPct)}%).`);
  }
  if(roxzone && roxzone.timeLoss!=null){
    if(roxzone.timeLoss>3) sentences.push(`Roxzone 전환 시간도 평균보다 느려 총 ${fmtTime(roxzone.timeLoss)}를 추가로 잃고 있습니다.`);
    else if(roxzone.timeLoss<-3) sentences.push(`Roxzone 전환은 평균보다 ${fmtTime(Math.abs(roxzone.timeLoss))} 빨라 강점 구간입니다.`);
  }
  if(top.length){
    sentences.push(`현재 가장 효과적인 개선 순서는 ${top.map(t=>t.label).join(" → ")}입니다.`);
  }
  if(strengthIdx.fatigueResistance!=null && strengthIdx.fatigueResistance<50){
    sentences.push(`레이스 후반부(Lunge·Wall Ball)에서 초반 대비 퍼포먼스가 저하되는 패턴이 있어, 페이싱 전략과 후반 지구력 훈련을 함께 점검하는 것이 좋습니다.`);
  }
  return sentences.join(" ");
}

// generic N-axis radar: items = [{label, score(0-100)}]
function svgRadarGeneric(items, size=280, color="#FF5A1F"){
  const n=items.length; const cx=size/2, cy=size/2, r=size*0.36;
  const angle=(i)=> -Math.PI/2 + i*(2*Math.PI/n);
  const rings=[0.25,0.5,0.75,1];
  let grid="";
  rings.forEach(f=>{
    const pts=items.map((it,i)=>{ const a=angle(i); return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`; }).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="#28282C" stroke-width="1"/>`;
  });
  items.forEach((it,i)=>{ const a=angle(i); grid+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#28282C" stroke-width="1"/>`; });
  const dataPts=items.map((it,i)=>{ const a=angle(i); const v=clamp((it.score??0)/100,0,1); return `${cx+Math.cos(a)*r*v},${cy+Math.sin(a)*r*v}`; }).join(" ");
  let labels="";
  items.forEach((it,i)=>{
    const a=angle(i); const lx=cx+Math.cos(a)*(r+28), ly=cy+Math.sin(a)*(r+28);
    const anchor = Math.abs(Math.cos(a))<0.3? "middle" : (Math.cos(a)>0? "start":"end");
    labels+=`<text x="${lx}" y="${ly-3}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="9" fill="#9497A0">${escapeHtml(it.label.toUpperCase())}</text>`;
    labels+=`<text x="${lx}" y="${ly+9}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="${color}">${it.score!=null?round1(it.score):"—"}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">
    ${grid}
    <polygon points="${dataPts}" fill="${color}33" stroke="${color}" stroke-width="2"/>
    ${items.map((it,i)=>{ const a=angle(i); const v=clamp((it.score??0)/100,0,1); return `<circle cx="${cx+Math.cos(a)*r*v}" cy="${cy+Math.sin(a)*r*v}" r="3" fill="${color}"/>`; }).join("")}
    ${labels}
  </svg>`;
}

// date fields are plain text inputs (native <input type=date> renders inconsistently/unstyleable on
// iOS Safari) — auto-insert dashes as the person types digits, e.g. "20260601" -> "2026-06-01"
function initDateTextMasking(){
  document.addEventListener("input",(e)=>{
    if(e.target.tagName==="INPUT" && e.target.getAttribute("pattern")==="[0-9]{4}-[0-9]{2}-[0-9]{2}"){
      const digits=e.target.value.replace(/[^0-9]/g,"").slice(0,8);
      let formatted=digits;
      if(digits.length>4) formatted=digits.slice(0,4)+"-"+digits.slice(4);
      if(digits.length>6) formatted=digits.slice(0,4)+"-"+digits.slice(4,6)+"-"+digits.slice(6);
      e.target.value=formatted;
    }
  });
}

  const pageBeforeRender = _lastRenderedPage;
  const scrollBeforeRender = window.scrollY || window.pageYOffset || 0;
  const samePageRender = (CURRENT_PAGE === pageBeforeRender);
  // PERF: keep pure-engine cache across page navigation.
  // State-changing paths call persist()/persistNow(), which invalidate the cache.
  // Clearing it on every render made the large Race DNA peer analysis recompute
  // every time the bottom tab was tapped.
  renderNav();

    wrap.querySelector("#render-retry")?.addEventListener("click",()=>renderAll());

  // doc12 §3: "로그인 안하면 기록이 지워진다"는 경고를 기록/DNA/목표 3개 메인 페이지에 표시 — 각 render

  }
  // Real navigation starts at the top. Same-page controls must keep the exact viewport
  // the user was looking at; restore after the new DOM has painted (important on iOS Safari).
  const pageChanged = (CURRENT_PAGE !== pageBeforeRender);
  if(!pageChanged && samePageRender){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      // Detail-open has an intentional destination: the newly opened detail section.
      if(window.__DNA_DETAIL_SCROLL_TO_OPEN){
        const detailStart=document.getElementById("peer-detail-content");

}

function fmtDateDots(d){ return (d||"").replace(/-/g,"."); }
function myRecordHyroxSummary(){
  // FIX: PB는 "가장 최신"이 아니라 "가장 빠른" 기록이고, Division과 무관하게 전체에서 뽑는다.
  // 동시에 Division이 여러 개면 Division별 PB도 함께 낸다.
  const all = [...STATE.races].filter(r=>parseTimeToSec(r.officialTime)!=null);
  const fastest = (arr)=> arr.length ? arr.reduce((a,b)=> parseTimeToSec(a.officialTime)<=parseTimeToSec(b.officialTime)? a:b) : null;
  const pbRace = fastest(all);
  const byDiv = {};
  all.forEach(r=>{ const d=normalizeRaceDivision(r.division)||r.division||"—"; (byDiv[d]=byDiv[d]||[]).push(r); });
  const divisionPBs = Object.keys(byDiv).map(d=>({ division:d, race:fastest(byDiv[d]) }))
    .filter(x=>x.race)
    .sort((a,b)=>parseTimeToSec(a.race.officialTime)-parseTimeToSec(b.race.officialTime));
  const recent = [...STATE.races].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);
  return { pbRace, divisionPBs, recent };
}

// Main Race DNA scores are now derived ONLY from the same peer/race segments shown
// on the detailed Race DNA page. HPI, recovery, ACWR, HR, weight and 1RM
// are deliberately not part of this display path.
function buildRaceOnlyDnaScores(peer){
  if(!peer) return {running:null,engine:null,strengthEnd:null,skill:null,raceExec:null};
  const byKey=k=>peer.segments.find(s=>s.key===k);
  const pct=keys=>{
    const vals=keys.map(byKey).map(s=>s?.percentile).filter(v=>Number.isFinite(v));
    return vals.length ? mean(vals) : null;
  };
  const runKeys=["run1","run2","run3","run4","run5","run6","run7","run8"];
  const running=pct(runKeys);
  const engine=pct(["ski","row","burpee"]);
  const strengthEnd=pct(["sledPush","sledPull","carry","lunge"]);
  const skill=pct(["wallball","roxzone"]);
  const runVals=runKeys.map(byKey).map(s=>s?.percentile).filter(v=>Number.isFinite(v));
  const trans=byKey("roxzone")?.percentile;
  const raceExec = runVals.length ? mean(runVals.concat(Number.isFinite(trans)?[trans]:[])) : (Number.isFinite(trans)?trans:null);
  return {running,engine,strengthEnd,skill,raceExec};
}

function defaultOcrState(){ return { images:[], status:"idle", progress:0, warnings:[], rawText:"" }; }
let OCR_STATE = defaultOcrState();
let RC_PREFILL = null;      // parsed race draft, feeds the "rc" form as prefilled (still editable) values

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
// Resize + grayscale + simple contrast stretch. Kept lightweight (no full convolution) so it
// stays fast on mobile, but this is the part of the pipeline most responsible for OCR accuracy.
// Upscale + sharpen + auto dark/light detection + Otsu binarization. Tesseract's models are trained
// overwhelmingly on dark text on a light background, so a UI screenshot in dark mode (light text on a
// dark card) reads much worse than the same content light-mode — auto-inverting when the image is
// predominantly dark fixes that without the person needing to know or care. Otsu thresholding (finds
// the brightness cutoff that best separates two clusters — text vs background — rather than a plain
// linear min/max stretch) produces cleaner, crisper glyph edges, which is usually the single biggest
// lever for OCR accuracy on compressed screenshots.
function preprocessForOcr(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      // more aggressive upscale for small source images — Tesseract accuracy drops sharply below
      // roughly 300dpi-equivalent text height, and small phone-screenshot crops are common.
      const targetW = img.width<700 ? 2000 : img.width<1100 ? 1700 : Math.min(img.width,2000);
      const scale = targetW/img.width;
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
      ctx.drawImage(img,0,0,w,h);
      const imgData=ctx.getImageData(0,0,w,h);
      const d=imgData.data;

      // 1) grayscale + histogram (for Otsu threshold + dark/light detection)
      const gray=new Uint8ClampedArray(w*h);
      const hist=new Array(256).fill(0);
      let sum=0;
      for(let i=0,p=0;i<d.length;i+=4,p++){
        const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        gray[p]=g; hist[Math.round(g)]++; sum+=g;
      }
      const meanBrightness=sum/gray.length;

      // 2) Otsu's method: find the threshold maximizing between-class variance
      let sumAll=0; for(let t=0;t<256;t++) sumAll+=t*hist[t];
      let wB=0,sumB=0,maxVar=0,threshold=128;
      const total=gray.length;
      for(let t=0;t<256;t++){
        wB+=hist[t]; if(wB===0) continue;
        const wF=total-wB; if(wF===0) break;
        sumB+=t*hist[t];
        const mB=sumB/wB, mF=(sumAll-sumB)/wF;
        const varBetween=wB*wF*(mB-mF)*(mB-mF);
        if(varBetween>maxVar){ maxVar=varBetween; threshold=t; }
      }

      // 3) dark-mode screenshots (mean brightness low = mostly dark background) get inverted so the
      // final image is always dark-text-on-light-background, matching what Tesseract expects.
      const invert = meanBrightness<115;

      // 4) light sharpening (3x3 unsharp-ish kernel) on the grayscale buffer before binarizing —
      // counteracts the softness canvas scaling introduces, which otherwise blurs thin glyph strokes.
      const sharp=new Uint8ClampedArray(w*h);
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const idx=y*w+x;
          if(x===0||y===0||x===w-1||y===h-1){ sharp[idx]=gray[idx]; continue; }
          const c=gray[idx], up=gray[idx-w], down=gray[idx+w], left=gray[idx-1], right=gray[idx+1];
          sharp[idx]=clamp(c*5-up-down-left-right, 0, 255);
        }
      }

      for(let i=0,p=0;i<d.length;i+=4,p++){
        let v = sharp[p] > threshold ? 255 : 0; // Otsu binarization
        if(invert) v = 255-v;
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(imgData,0,0);
      resolve(canvas);
    };
    img.onerror=()=>reject(new Error("image load failed"));
    img.src=dataUrl;
  });
}
async function handleOcrFiles(fileList){
  const files=Array.from(fileList||[]).filter(f=>f.type && f.type.startsWith("image/"));
  for(const f of files){
    try{ const dataUrl=await fileToDataUrl(f); OCR_STATE.images.push({ dataUrl }); }catch(e){ console.warn("ocr file read failed", e); }
  }
  OCR_STATE.status="idle"; OCR_STATE.warnings=[];
  renderAll();
}
// Recognized-label → canonical field-key aliasing. Tolerant of OCR noise (missing spaces,
// hyphens, stray punctuation) — labels are normalized before matching.
function normalizeOcrLabel(s){
  return String(s).replace(/[^A-Za-z0-9가-힣'\- ]/g," ").replace(/\s+/g," ").trim().toUpperCase();
}
function ocrMatchLabelKey(label){
  const L=normalizeOcrLabel(label);
  if(!L) return null;
  // "RUN 1"/"RUN1"/"RUNNING 1" — the official results.hyrox.com page uses "Running N"
  let m=L.match(/\bRUN(?:NING)?\s*[-]?\s*([1-8])\b/);
  if(m) return "run"+m[1];
  if(/SKI\s*-?\s*ERG/.test(L)) return "ski";
  if(/SLED\s*-?\s*PUSH/.test(L)) return "sledPush";
  if(/SLED\s*-?\s*PULL/.test(L)) return "sledPull";
  if(/BURPEE/.test(L) || /\bBBJ\b/.test(L)) return "burpee";
  if(/FARMER'?S?\s*CARRY/.test(L)) return "carry";
  if(/SANDBAG\s*LUNGE/.test(L)) return "lunge";
  if(/WALL\s*BALL/.test(L)) return "wallball";
  if(/ROX\s*-?\s*ZONE/.test(L)) return "transition"; // "Roxzone" / "Roxzone Time"
  if(/\b(TOTAL\s*TIME|OVERALL\s*TIME|FINISH(?:ING)?\s*TIME|TOTAL\s*RESULT)\b/.test(L)) return "officialTime";
  // "Row"/"1000m Row" — matched last and narrowly (word boundary) so it never grabs "Roxzone"/"Row Total"
  if(/\bROW\b/.test(L) && !/ROXZONE/.test(L) && !/\bTOTAL\b/.test(L)) return "row";
  return null;
}
// mm:ss / h:mm:ss parser+validator. Never silently "fixes" an out-of-range value (e.g. 4:72) —
// flags it instead so it surfaces as a review item rather than a wrong number being saved.
function ocrNormalizeTime(raw){
  const m=String(raw).trim().match(/^(\d{1,2})(?::(\d{1,2}))(?::(\d{1,2}))?$/);
  if(!m) return {ok:false, value:raw};
  let h=null,mm,ss;
  if(m[3]!==undefined){ h=Number(m[1]); mm=Number(m[2]); ss=Number(m[3]); } else { mm=Number(m[1]); ss=Number(m[2]); }
  if(ss>59 || mm>59 || (h!==null && h>23)) return {ok:false, value:raw};
  // Official HYROX results pages render every split time in HH:MM:SS even for sub-hour splits
  // (e.g. a 3m40s SkiErg shows as "00:03:40"). OCR reads that literally, which would otherwise get
  // stored as "0:03:40" — reads like an hh:mm:ss value even though it's really mm:ss data. Since
  // every field this app stores station/run splits in expects mm:ss, a 0-hour OCR read is collapsed
  // back down to mm:ss here so it matches the format used everywhere else (manual entry, display,
  // parseTimeToSec). Only applies when h===0 — a real h:mm:ss total (e.g. officialTime) is untouched.
  if(h===0){ h=null; }
  const value = h!==null ? `${h}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${mm}:${String(ss).padStart(2,"0")}`;
  return {ok:true, value};
}
const OCR_PURE_TIME_RE=/^\d{1,2}:\d{1,2}(?::\d{1,2})?$/;
const OCR_EXPECTED_ORDER=["run1","ski","run2","sledPush","run3","sledPull","run4","burpee","run5","row","run6","carry","run7","lunge","run8","wallball"];

// Label→time association is done line-by-line (same line, or the next 1-2 lines) using the fixed
// HYROX station order as a structural prior, per the alias table above.
function parseHyroxOcrText(text, words){
  const lines=String(text).split(/\n/).map(l=>l.trim()).filter(Boolean);
  const runs={}, stations={};
  let officialTime=null, transition=null;
  const wordQueue=(words||[]).slice();
  const matchedOrder=[];
  const warnings=[];
  const confMap={};
  function takeConfidenceFor(timeStr){
    const cleaned=timeStr.replace(/\s+/g,"");
    for(let i=0;i<wordQueue.length;i++){
      const wt=(wordQueue[i].text||"").replace(/\s+/g,"");
      if(wt===cleaned){ const c=wordQueue[i].confidence; wordQueue.splice(i,1); return c; }
    }
    return null;
  }
  function assign(key, rawTime){
    const norm=ocrNormalizeTime(rawTime);
    const conf=takeConfidenceFor(rawTime);

    if(!norm.ok){ confLabel="error"; warnings.push(`${key} 값(${rawTime})이 올바른 시간 형식이 아닌 것 같습니다 — 확인해주세요`); }
    else confLabel = conf==null ? null : (conf>=75 ? "high" : "low");
    if(key.startsWith("run")) runs[key.replace("run","")]=norm.ok?norm.value:rawTime;
    else if(key==="officialTime") officialTime=norm.ok?norm.value:rawTime;
    else if(key==="transition") transition=norm.ok?norm.value:rawTime;
    else stations[key]=norm.ok?norm.value:rawTime;
    confMap[key]=confLabel;
    if(!matchedOrder.includes(key)) matchedOrder.push(key);
  }
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    // Find the first time-like token anywhere in the line (not just at the end) — real result
    // screens often trail a rank/place column after the time (e.g. "01  1000m SkiErg  00:03:40  13"),
    // so anchoring only to line-end would miss it.
    const timeMatch=line.match(/(\d{1,2}:\d{1,2}(?::\d{1,2})?)/);
    let labelPart, timeStr;
    if(timeMatch){ labelPart=line.slice(0,timeMatch.index).trim(); timeStr=timeMatch[1]; } else { labelPart=line; timeStr=null; }
    const key=ocrMatchLabelKey(labelPart);
    if(!key) continue;
    if(!timeStr){
      for(let j=i+1;j<Math.min(i+3,lines.length);j++){ if(OCR_PURE_TIME_RE.test(lines[j])){ timeStr=lines[j]; break; } }
    }
    if(timeStr) assign(key, timeStr);
  }
  // Event name: prefer the actual "Race" row value from results.hyrox.com (e.g. "Race" → "2026 Chengdu")
  // over a generic "HYROX ..." text-search, which can otherwise pick up page chrome like a URL bar.
  let name="";
  const raceLineIdx=lines.findIndex(l=>normalizeOcrLabel(l)==="RACE");
  if(raceLineIdx>=0 && lines[raceLineIdx+1] && !OCR_PURE_TIME_RE.test(lines[raceLineIdx+1])) name=lines[raceLineIdx+1].trim();
  if(!name){ const eventMatch=text.match(/HYROX\s+[A-Za-z가-힣][^\n]{0,28}/); if(eventMatch) name=eventMatch[0].trim().replace(/\s+/g," "); }
  const dateMatch=text.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  const date=dateMatch? `${dateMatch[1]}-${String(dateMatch[2]).padStart(2,"0")}-${String(dateMatch[3]).padStart(2,"0")}` : "";
  let lastIdx=-1, orderOk=true;
  matchedOrder.forEach(k=>{ const idx=OCR_EXPECTED_ORDER.indexOf(k); if(idx===-1) return; if(idx<lastIdx) orderOk=false; lastIdx=Math.max(lastIdx,idx); });
  if(!orderOk) warnings.push("구간 순서가 예상과 달라 확인이 필요합니다");
  const allTimes=[...Object.values(runs), ...Object.values(stations)].map(parseTimeToSec).filter(v=>v!=null);
  const sum=allTimes.length? allTimes.reduce((a,b)=>a+b,0) : null;
  const totalSec=officialTime? parseTimeToSec(officialTime) : null;
  if(sum!=null && totalSec!=null && totalSec < sum*0.9) warnings.push("총 기록이 구간 합계보다 지나치게 작습니다 — 확인해주세요");
  return { fields:{ name, date, officialTime, runs, stations, transition }, confMap, warnings };
}
function ocrErrorText(e){
  if(!e) return "알 수 없는 오류";
  if(typeof e==="string") return e;
  if(e.message) return e.message;
  if(e.name) return e.name;
  try{ return JSON.stringify(e); }catch(_){ return String(e); }
}
