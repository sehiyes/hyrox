}
// spec: y축 그리드/라벨(100/75/50/25/0) + "DNA Score (0-100)" 제목을 항상 함께 그린다. DNA Score는
// 0~100 고정 스케일(퍼센타일 기반)이므로 opts.minY/maxY로 넘어와도 라벨은 이 고정 척도를 기준으로 표시.
function svgMultiLineTrend(series, w=680, h=200, opts={}){
  const usable = series.filter(s=>s.points && s.points.length);
  if(!usable.length) return `<div class="empty-note">데이터가 쌓이면 추이가 표시됩니다</div>`;
  const padL=40, padR=16, padT=18, padB=28;
  const allPts = usable.flatMap(s=>s.points);
  const xs=allPts.map(p=>p.x);
  const minX=Math.min(...xs), maxX=Math.max(...xs)||1;
  const minY = opts.minY!=null? opts.minY : 0;
  const maxY = opts.maxY!=null? opts.maxY : 100;
  const sx=(x)=> padL + (maxX===minX?(w-padL-padR)/2:(x-minX)/(maxX-minX))*(w-padL-padR);
  const sy=(y)=> h-padB - (maxY===minY?0:(clamp(y,minY,maxY)-minY)/(maxY-minY))*(h-padT-padB);
  const lines = usable.map(s=>{
    const pts=s.points;
    const path = pts.length===1
      ? `M${sx(pts[0].x)-4},${sy(pts[0].y)} L${sx(pts[0].x)+4},${sy(pts[0].y)}`
      : pts.map((p,i)=>`${i===0?"M":"L"}${sx(p.x)},${sy(p.y)}`).join(" ");
    const dots = pts.map((p,i)=>{
      const isLast = i===pts.length-1;
      return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${isLast?4.5:3}" fill="${s.color}" ${isLast?`stroke="#0B0B0D" stroke-width="1.5"`:""}/>`;
    }).join("");
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join("");
  // 고정 0-100 스케일의 y축 라벨/그리드 (spec §4)
  const axisTicks = opts.showAxis===false ? [] : [0,25,50,75,100];
  const axisLines = axisTicks.map(v=>`
    <line x1="${padL}" y1="${sy(v)}" x2="${w-padR}" y2="${sy(v)}" stroke="#28282C" stroke-dasharray="${v===50?"3,4":"0"}"/>
    <text x="${padL-8}" y="${sy(v)+3.5}" text-anchor="end" font-family="JetBrains Mono" font-size="9.5" fill="#8A8A92">${v}</text>
  `).join("");
  const axisTitle = opts.showAxis===false ? "" : `<text x="${padL}" y="12" font-family="Inter" font-size="9.5" fill="#8A8A92">DNA Score (0-100)</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${axisTitle}
    ${axisLines}
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#28282C"/>
    ${lines}
  </svg>`;
}

  // spec (전면수정 Phase 2): 그래프 위에 "반복적으로 부족하게 나오는 스테이션"을 바로 확인할 수 있게

  // 강한 반복 패턴, 표본 4개 미만이면 실발생 3회 이상) 기준을 그대로 재사용한다. "부족"의 기준은
  // 이 시스템의 기존 등급 컷(점수<60 = 개선 필요, peerScoreBand와 동일)을 그대로 쓴다.
  const weaknessRepetitionHtml = (()=>{

      if(measured.length<2) return null;
      const weakOccurrences = measured.filter(p=>p.scores[it.key]<60).length;
      if(weakOccurrences===0) return null;
      const ratio = weakOccurrences/measured.length;
      const pattern = ratio>=0.8||(measured.length<4&&weakOccurrences>=3) ? {circle:"🔴",label:"강한 반복 패턴"}
        : ratio>=0.6 ? {circle:"🟢",label:"반복 패턴"}

      return { key:it.key, label:it.label, occurrences:weakOccurrences, total:measured.length, ratio, pattern };
    }).filter(Boolean).sort((a,b)=> b.ratio-a.ratio || b.occurrences-a.occurrences);
    if(!rows.length) return "";
    return `<div style="margin-bottom:14px;">
      <div class="eyebrow gray" style="margin-bottom:6px;">🔁 반복적으로 부족하게 나오는 스테이션</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        ${rows.map(r=>`<div class="row-between" style="font-size:12.5px;"><span>${r.pattern.circle} ${escapeHtml(r.label)}</span><span class="mono" style="color:var(--gray-dim);">${r.occurrences}/${r.total}회 · ${r.pattern.label}</span></div>`).join("")}
      </div>
      <p class="reason-line" style="margin-top:6px;color:var(--gray-dim);">점수 60점 미만(개선 필요 등급)으로 나온 대회 비율 기준입니다 — ⚪ 일시적(&lt;40%) · 🟡 관찰(40~59%) · 🟢 반복 패턴(≥60%) · 🔴 강한 반복 패턴(≥80%, 표본 4개 미만이면 실발생 3회 이상).</p>

  const chartHtml = svgMultiLineTrend(chartSeries, 680, 200, {minY:0,maxY:100});

  let detailHtml = "";

    const key=tab, meta=dnaEvoItemMeta(key);
    const rows = shown.filter(p=>p.scores[key]!=null);
    if(rows.length){
      const last = rows[rows.length-1];
      detailHtml = `<div style="margin-top:14px;">

          </div>`).join("")}
        </div>

    }

  // 변화량 요약 (spec §9) — 최근 두 대회 비교, 전 항목(run+8개 station) 통합 랭킹. changes는 이미
  // |delta| 내림차순 정렬이므로, best/worst는 그 순서 그대로 첫 번째 매칭 항목을 쓴다 — reverse()는
  // 절대 쓰지 않는다 (버그 재발 방지: reverse는 오름차순이 되어 "가장 작은" 음수 변화를 worst로 잘못
  // 골랐었다, 예: Farmers Carry -3.5가 Burpee -95.8 대신 뽑힘).
  const changes = computeDnaEvoChanges(allPoints);
  let changeSummaryHtml = "";
  if(changes.length){
    const best = changes.find(c=>c.delta>0);
    const worst = changes.find(c=>c.delta<0);
    const fmtDelta = (c)=> `${c.delta>=0?"▲":"▼"} ${round1(Math.abs(c.delta))}점`;
    changeSummaryHtml = `<div style="margin-top:14px;">

      </div>
      ${best||worst ? `<p class="reason-line" style="margin-top:8px;">${best?`<b style="color:var(--green);">가장 크게 향상:</b> 🟢 ${escapeHtml(best.label)} +${round1(best.delta)}점`:""}${best&&worst?" · ":""}${worst?`<b style="color:var(--red);">개선이 필요한 변화:</b> ${escapeHtml(worst.label)} ▼${round1(Math.abs(worst.delta))}점`:""}</p>` : ""}

    ? `<div class="hstack" style="margin-top:10px;"><span class="chip" id="dna-evo-show-all">최근 ${DNA_EVO_RECENT_COUNT}개 대회 표시 중 — 전체 ${allPoints.length}개 보기 →</span></div>`
    : (DNA_EVO_SHOW_ALL && allPoints.length>DNA_EVO_RECENT_COUNT ? `<div class="hstack" style="margin-top:10px;"><span class="chip" id="dna-evo-show-all">전체 ${allPoints.length}개 표시 중 — 최근만 보기 →</span></div>` : "");

  return `${head}${weaknessRepetitionHtml}${selector}${chartHtml}${legend}${detailHtml}${changeSummaryHtml}${rangeNote}`;
}

      <span class="chip">${escapeHtml(r.gender==='MIXED'?'Mixed':(r.gender==='female'?'Female':'Male'))} · ${escapeHtml(r.ageGroup||"전체")}</span></div>`;
    if(r.error) return `<div class="card">${head}<div class="empty-note">오류: ${escapeHtml(r.error)}</div></div>`;
    if(!b || b.scope==="insufficient" || !b.podium) return `<div class="card">${head}<div class="empty-note">이 조건의 데이터가 부족해 포디움 기준을 산출할 수 없습니다${b&&b.n!=null?` (유효 ${b.n}건)`:""}.</div></div>`;
    const medal=["🥇","🥈","🥉"];
    return `<div class="card">
      ${head}
      <div style="margin-top:8px;">
        ${b.podium.map((t,i)=>`<div class="row-between" style="padding:5px 0;"><span style="font-size:13.5px;">${medal[i]} ${i+1}위</span><span class="mono" style="font-weight:700;">${fmtTime(t)}</span></div>`).join("")}
      </div>
      <div class="divider" style="margin:10px 0;"></div>
      ${line("적용 Division", `<b>${escapeHtml(b.division)}</b>`)}
      ${line("Source Division", escapeHtml(b.sourceDivision||b.division))}
      ${line("적용 Age Group", b.ageGroupUsed || `<span style="color:var(--amber);">완화됨 — Gender+Division만 적용</span>`)}
      ${line("데이터 범위", `${escapeHtml(b.dataWindow||podiumDataWindowLabel())} · 전체 지역 · ${(b.n||0).toLocaleString()}명`)}
      ${line("분석 대상 대회 수", `${b.eventCount ?? 0}개`)}
      ${line("대회별 3위 기록 수", `${b.eventCount ?? 0}건`)}
      ${line("기준 산출 방식", {"median":"대회별 3위 median","p25":"대회별 3위 P25"}[b.method] || b.method || "—")}
      ${line("Tier", escapeHtml(b.tier||"—"))}
      ${line("최종 포디움 기준(3위)", `<span class="mono" style="color:var(--amber);font-weight:800;">${fmtTime(b.podium[2])}</span>`)}
      ${b.distribution ? `<div class="reason-line" style="margin-top:8px;">3위 기록 분포 — min ${fmtTime(b.distribution.min)} · P25 ${fmtTime(b.distribution.p25)} · median ${fmtTime(b.distribution.median)} · P75 ${fmtTime(b.distribution.p75)} · max ${fmtTime(b.distribution.max)}</div>` : ""}
      ${b.events && b.events.length ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:11.5px;color:var(--gray-dim);">사용된 대회 목록 (${b.events.length}개)</summary>
        <div style="margin-top:6px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:12px;line-height:1.7;">
          ${b.events.map(e=>`· ${escapeHtml(e.event)} (n=${e.n}, 3위=${fmtTime(e.third)})`).join("<br>")}
        </div></details>` : ""}
    </div>`;
  }).join("");
}

// 실제 HYROX 결과 DB 가져오기 — Race DNA 페이지에서 여기로 이동 (DNA 페이지는 분석 결과만 보여주고,
// 데이터 관리는 모델 설명 쪽 탭에서 하도록 분리).

/* 업로드 이력은 "누가 언제 올렸는가"의 기록이고, 이건 한 번 사라지면 복구할 방법이 없다.
   하지만 "지금 DB에 어떤 대회가 몇 건 들어있는가"는 데이터 자체에서 항상 다시 계산할 수
   있다. 이력이 비어 있어도 실무적으로 알고 싶은 건 대부분 이쪽이므로 같이 보여준다.
   이미 동기화된 EXTERNAL_RACE_DB 를 로컬에서 집계하므로 추가 쿼리가 없다. */
function hyroxDbEventSummaryHtml(){
  const agg={};
  (EXTERNAL_RACE_DB||[]).forEach(r=>{
    const k=canonicalEventKey(r)||"(대회명 없음)";
    const a=agg[k]=agg[k]||{ event:k, n:0, divisions:new Set(), minDate:null, maxDate:null };
    a.n++;
    if(r.division) a.divisions.add(r.division);
    if(!eventHasYear(r.event)) a.yearRecovered=true;
    if(r.date){ if(!a.minDate||r.date<a.minDate) a.minDate=r.date; if(!a.maxDate||r.date>a.maxDate) a.maxDate=r.date; }
  });
  const rows=Object.values(agg).sort((a,b)=>b.n-a.n);
  if(!rows.length) return `<div class="divider" style="margin:14px 0;"></div>
    <div class="eyebrow gray">📦 현재 DB 구성</div>
    <div class="empty-note">${renderModelDnaImportTab._autoSyncing ? "Supabase에서 자동으로 다시 불러오는 중입니다... (완료되면 자동으로 갱신됩니다)" : "동기화된 DNA 비교 데이터가 없습니다 — 위 \"Supabase에서 다시 동기화\" 버튼을 눌러보세요."}</div>`;
  return `<div class="divider" style="margin:14px 0;"></div>
    <div class="row-between"><div class="eyebrow gray">📦 현재 DB 구성 (대회별)</div>
      <span class="mono" style="font-size:11px;color:var(--gray-dim);">${rows.length}개 대회 · ${(EXTERNAL_RACE_DB||[]).length.toLocaleString()}건</span></div>
    <p class="reason-line" style="margin:6px 0 8px;">업로드 이력과 달리 이건 <b>데이터에서 직접 집계</b>한 것이라 이력이 없어도 항상 볼 수 있습니다. 단, 스플릿이 인식된 행(DNA 계산 가능 행) 기준이라 <code>hyrox_results</code> 전체 행 수보다 적을 수 있습니다.</p>
    ${rows.some(a=>a.yearRecovered)? `<p class="reason-line" style="margin:0 0 8px;color:var(--amber);">⚠ <b>연도 보정됨</b> 표시가 붙은 대회는 Supabase <code>event</code> 값에 연도가 없어서, 각 행의 <code>date</code>로 연도를 복원해 분리한 것입니다. 포디움 기준(대회별 3위 median)이 연도별로 올바르게 나뉘도록 보정되지만, <b>원본 데이터를 고치는 편이 안전합니다</b> — <code>date</code>가 비어 있는 행은 "(연도미상)"으로 묶여 여전히 섞입니다.</p>`:""}
    <div style="overflow-x:auto;"><table><thead><tr><th>대회</th><th class="num">건수</th><th>기간</th><th>Division</th></tr></thead><tbody>
      ${rows.slice(0,60).map(a=>`<tr>
        <td>${escapeHtml(a.event)}</td>
        <td class="num mono">${a.n.toLocaleString()}</td>
        <td style="white-space:nowrap;color:var(--gray-dim);font-size:11px;">${a.minDate? (a.minDate===a.maxDate? a.minDate : `${a.minDate} ~ ${a.maxDate}`) : "—"}</td>
        <td style="font-size:11px;color:var(--gray-dim);">${escapeHtml([...a.divisions].join(", ")||"—")}${a.yearRecovered? ` <span class="chip" style="font-size:9.5px;color:var(--amber);">연도 보정됨</span>`:""}</td>
      </tr>`).join("")}
    </tbody></table></div>
    ${rows.length>60? `<p class="reason-line" style="margin-top:6px;color:var(--gray-dim);">상위 60개 대회만 표시</p>`:""}`;
}
function renderModelDnaImportTab(wrap){
  // spec (mobile bug fix): PC에서 CSV를 업로드하면 Supabase 공용 hyrox_results 테이블에는 바로
  // 반영되지만, 모바일 브라우저의 EXTERNAL_RACE_DB(이 세션 안의 로컬 상태)는 그 사실을 모른 채
  // 비어있는 상태로 남아 "현재 DB 구성"이 계속 빈 것처럼 보였다 — 사용자가 "Supabase에서 다시
  // 동기화" 버튼을 직접 눌러야만 해결됐던 문제. 이 탭을 열 때 데이터가 비어있으면 자동으로 한 번
  // Supabase에서 재동기화를 시도하고, 성공하면 화면을 자동으로 갱신한다(수동 버튼은 그대로 남겨둠).
  if(sbEnabled() && EXTERNAL_RACE_DB.length===0 && !renderModelDnaImportTab._autoSyncing){
    renderModelDnaImportTab._autoSyncing = true;
    syncExternalRaceDbFromSupabase().then(()=>{
      renderModelDnaImportTab._autoSyncing = false;
      if(EXTERNAL_RACE_DB.length>0) renderAll(); // 성공적으로 채워졌을 때만 다시 그림 — 무한 루프 방지
    }).catch(e=>{ renderModelDnaImportTab._autoSyncing = false; console.warn("모델설명 탭 자동 재동기화 실패:", e); });
  }
  const dbSize = EXTERNAL_RACE_DB.length;
  const sourceLabel = { supabase:"🟢 Supabase 공용 데이터셋", local:"🟡 로컬 캐시(오프라인)", none:"⚪ 데이터 없음" }[EXTERNAL_RACE_DB_SOURCE] || "⚪ 데이터 없음";
  wrap.innerHTML = `
    <div class="card">
      <div class="row-between"><h2 class="section-title">📥 실제 HYROX 결과 DB 가져오기</h2><span class="mono" style="font-size:11px;color:var(--gray-dim);">${sourceLabel} · ${dbSize.toLocaleString()}건</span></div>
      <p class="lead" style="margin:6px 0 12px;">원본 HYROX Full Results CSV를 업로드하면 <b style="color:var(--orange);">Supabase의 공용 <code>hyrox_results</code> 테이블</b>에 누적됩니다. 이 테이블이 이름 검색과 Race DNA/동일그룹 비교(percentile·Z-score) 계산 모두의 원천 데이터입니다 — 한 명이 업로드하면 다른 모든 사용자가 다음에 앱을 열 때 동일한 데이터를 보게 됩니다(브라우저별로 따로 저장되지 않음). 기존에 저장된 개인 기록·Simulation·10K 기록 등은 변경되지 않습니다.</p>
      ${EXTERNAL_RACE_DB_SOURCE==="local" ? `<p class="reason-line" style="color:var(--amber);margin:8px 0;">⚠ 지금은 Supabase에 연결되지 않아 이 브라우저의 로컬 캐시를 보고 있습니다 — 다른 사용자와 데이터가 다를 수 있습니다.</p>` : ""}
      ${EXTERNAL_RACE_DB_TRUNCATED ? `<p class="reason-line" style="color:var(--amber);margin:8px 0;">⚠ 페이지네이션 동기화 중 일부만 불러왔습니다 — 전체 ${(HYROX_SEARCH_DB_COUNT||0).toLocaleString()}건 중 ${EXTERNAL_RACE_DB.length.toLocaleString()}건. 새로고침 후 다시 동기화해주세요.</p>` : ""}
      <div class="reason-line" style="margin:8px 0;padding:10px 12px;background:var(--surface2);border-radius:8px;">
        <b style="color:var(--white);">CSV 권장 컬럼: <code>Season</code> · <code>Year</code> · <code>Target Race</code></b><br>
        세 값은 Supabase에 <code>season</code> / <code>year</code> / <code>event_name</code> 컬럼으로 각각 저장되고, 표시용 라벨 <code>event</code>는 <code>"S8 2025 Shanghai"</code> 형태로 자동 조립됩니다.
        <b style="color:var(--amber);">Season이 없으면</b> 같은 해에 같은 도시에서 두 번 열린 대회(예: 2025 Shanghai 2회)가 한 대회로 합쳐져, 포디움 기준(대회별 3위 median)이 왜곡됩니다.
        Season 컬럼이 없어도 업로드 자체는 정상 동작합니다.
      </div>
      <p class="reason-line" style="margin:8px 0;color:var(--orange);">
        이 탭은 기존 모델 설명 접근 코드로 보호됩니다. 이미 DNA에 등록된 기록을 선수 검색 DB로 옮기거나 새 대회 검색 데이터를 추가할 때 사용합니다.

      <div class="field"><label>JSON 붙여넣기 (배열 또는 {"records":[...]}) — 참고용, EXTERNAL_RACE_DB는 위에서 저장 후 다음 동기화 시 Supabase 데이터로 다시 채워집니다</label>
        <textarea id="peerdb-json" rows="4" placeholder='[{"gender":"male","age":29,"division":"Open","overall_time":5400,"run_1":270,...}]' style="width:100%;font-family:var(--font-mono);font-size:11.5px;"></textarea>

        <label class="btn secondary sm" style="cursor:pointer;">HYROX CSV / Excel 업로드 → Supabase 공용 DB<input type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" id="peerdb-csv-input" style="display:none;"></label>

// PERF: 이전에는 loadState -> loadExternalRaceDb -> loadDerivedBenchmark 를 전부 순차로
// await 한 뒤에야 첫 renderAll()이 실행됐다. 뒤의 두 개는 네트워크 fetch라서, 화면이 나오기
// 전에 왕복 2회를 기다리는 구조였다 (= "데이터부터 읽고 화면이 나오는" 체감 지연).
//
// 이제는:
//   1) 로컬 상태만 읽고 즉시 첫 화면을 그린다 (benchmark/외부 DB는 전부 폴백이 있으므로
//      없어도 정상 동작한다 — queryDerivedBenchmark()는 null -> STATIC_FALLBACK).
//   2) 나머지는 병렬로 로드하고, 도착하는 대로 다시 그린다.
//   3) 연속 렌더 요청은 한 프레임으로 합쳐 중복 계산을 막는다.
let _renderQueued=false;
function scheduleRender(){
  if(_renderQueued) return;
  // DNA pages manage their own async DB-ready render. Do not let background
  // benchmark/auth fetches re-render an actively viewed DNA page, which can
  // make the page look like it refreshed while the user is reading it.
  if(CURRENT_PAGE==="peer" || CURRENT_PAGE==="mydna") return;
  _renderQueued=true;
  (window.requestAnimationFrame||setTimeout)(()=>{ _renderQueued=false; try{ renderAll(); }catch(e){ console.error(e); } },0);
}
(async function init(){
  initMobileMenu();
  initDateTextMasking();
  document.getElementById("modal-overlay")?.addEventListener("click",(e)=>{ if(e.target.id==="modal-overlay") closeModal(); });

  await loadState();
  renderAll();                       // 첫 화면은 즉시 표시하되, DNA/포디움 분석은 실제 DB 준비 전에는 계산하지 않음

  EXTERNAL_RACE_DB_READY_PROMISE = Promise.resolve().then(loadExternalRaceDb).catch(e=>{
    console.warn("EXTERNAL_RACE_DB 로드 실패:",e);
    EXTERNAL_RACE_DB_READY = true;
    return false;
  });
  const bg=[
    EXTERNAL_RACE_DB_READY_PROMISE,
    Promise.resolve().then(loadDerivedBenchmark).catch(e=>console.warn("DERIVED_BENCHMARK 로드 실패:",e)),
  ];
  if(sbEnabled()) bg.push(Promise.resolve().then(initSupabaseAuth).catch(e=>console.warn("Supabase auth 실패:",e)));
  bg.forEach(pr=>pr.then(scheduleRender));   // 도착하는 대로 갱신 (프레임 단위로 합쳐짐)
  await Promise.allSettled(bg);
  scheduleRender();
})();
</script>

<script>
  // HPS cache cleanup.
  // This build does NOT register a service worker. If an older build registered one,
  // remove it and its caches so it cannot keep serving an old index.html.
  (async function(){
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          try { await reg.unregister(); } catch (e) {}
        }
      }
      if (window.caches) {
        const keys = await caches.keys();
        for (const key of keys) {
          try { await caches.delete(key); } catch (e) {}
        }
      }
    } catch (e) {
      console.warn('HPS cache cleanup skipped:', e);
    }
  })();
</script>
