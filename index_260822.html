function upv4IsDoubles(d){ return String(d||"").includes("Doubles"); }
function upv4IsMixed(d){ return String(d||"")==="Mixed Doubles"; }


function getUnifiedContributionPrior(gender, division, segment){
  // Race-only contribution prior. This is deliberately conservative:
  // when a doubles record has no explicit athlete/station contribution,
  // do not infer a personalized workload from HPI, training load, bodyweight,
  // 1RM, recovery, ACWR, or other profile data.
  // A 50/50 prior is used only as a neutral placeholder for an unreported
  // doubles contribution and is never treated as measured personal data.
  if(!upv4IsDoubles(division) || segment === "runTotal") return 1;
  return 0.50;
}

function upv4GetContribution(race, gender, segment){
  if(!upv4IsDoubles(race?.division) || segment==="runTotal") return 1;

  // bug fix: this used to look for race.athleteContribution/myContribution/doublesContribution/
  // contribution and race.stationContributions/doublesStationContributions — none of which the
  // app ever writes anywhere. The real per-station 개인 수행 비율(%) input (HYROX 대회 기록 폼의
  // "개인 수행 비율" 필드) is saved to race.share, keyed by STATIONS[].key (e.g. "burpee", not
  // the UPV4 internal name "bbj"), as a 0-100 percentage. Because of this, a Doubles athlete who
  // carefully filled in their real share% for every station was still silently defaulted to a
  // flat 50/50 guess. Reading race.share here (mapped through the same UPV4_SEGMENT_TO_STATION_KEY
  // table used elsewhere) makes real user-entered share data actually reach the prediction engine.
  const stationKey = UPV4_SEGMENT_TO_STATION_KEY[segment] || segment;
  const sharePct = race?.share?.[stationKey];
  if(sharePct!=null && sharePct!=="" && !isNaN(Number(sharePct))){
    return Math.min(1,Math.max(0,Number(sharePct)/100));
  }

  const prior = getUnifiedContributionPrior(gender, race?.division, segment);
  if(prior!=null) return prior;

  return 0.50;
}

// V7 bugfix: the old unified-conversion lookup function was removed while V5/V6 were merged,
// but upv4Conversion() still called it. That made any cross-Division Race-only prediction
// (e.g. Mixed Doubles -> Pro Doubles) throw ReferenceError before the fallback matrix could run.
// Keep this seam deliberately safe: an optional external matrix may provide an entry, but absence
// must simply return null so the embedded empirical segment matrix below remains the production fallback.
function raceOnlyUnifiedConversionEntry(gender, source, target, segment){
  try{
    const matrix = (typeof window!=="undefined" && window.UNIFIED_CONVERSION_MATRIX) || null;
    if(!matrix) return null;
    const key = `${gender}|${source}|${target}`;
    const row = matrix[key];
    if(!row) return null;
    const entry = row[segment];
    return entry && typeof entry === "object" ? entry : null;
  }catch(e){ return null; }
}
// Global alias kept only for compatibility with older debug tools. Production prediction does not
// depend on this name, so a stale/partial browser global can never break Race-only prediction.
if(typeof window!=="undefined") window.getUnifiedConversionEntry = raceOnlyUnifiedConversionEntry;
// bug fix (Pro Doubles predicted faster than Open Doubles): Open/Pro is a fixed team FORMAT
// (Singles stays Singles, Doubles stays Doubles) with only the LOAD STANDARD changing between
// the two tiers — Pro uses heavier implements at the same distances/reps. Physically, adding
// load to the exact same team can only ever make them the same speed or slower, never faster.
// The embedded empirical ratios below are fit from real race population averages, and for at
// least one gender/segment combination the fitted ratio came out under 1.0 (predicting the
// heavier tier as FASTER) — almost certainly because Pro-division registrants are, on average,
// stronger athletes to begin with (a population-selection effect), which is a different thing
// from "this specific team gets faster by adding weight." This floor enforces the one relationship
// that must always hold regardless of population fit: same-format, heavier-tier conversions are
// never below 1.0, and the reverse (lighter-tier) conversions are never above 1.0. It deliberately
// does NOT apply to pairs that also change team FORMAT (e.g. Open Singles <-> Pro Doubles), since
// format change legitimately dominates the time delta there and can go either direction.
const UPV4_TIER_DIRECTION = {
  "Open|Pro": "heavier", "Pro|Open": "lighter",
  "Open Doubles|Pro Doubles": "heavier", "Pro Doubles|Open Doubles": "lighter",
};
function upv4ApplyTierFloor(source, target, result){
  if(!result || !Number.isFinite(Number(result.multiplier))) return result;
  const dir = UPV4_TIER_DIRECTION[`${source}|${target}`];
  if(!dir) return result;
  const clamped = dir==="heavier" ? Math.max(1, result.multiplier) : Math.min(1, result.multiplier);
  if(clamped===result.multiplier) return result;
  return { ...result, multiplier:clamped, source: result.source+"_TIER_FLOOR" };
}
// Looks up a direct measured empirical ratio for (source -> target), trying the reciprocal of the
// OPPOSITE direction's measured entry when the requested direction itself was never recorded. The
// embedded tables only ever measured ONE direction per pair (e.g. "Open|Open Doubles" but never
// "Open Doubles|Open"); the previous code only special-cased two of these reverse pairs by hand
// (Open Doubles->Open, Pro Doubles->Pro) and left every other reverse direction — including
// Open Doubles/Pro Doubles -> Mixed Doubles, the direction actually needed for an athlete whose
// only real races are Open/Pro Doubles wanting a Mixed Doubles estimate — completely unreachable
// (silently dropped as "no data", not blended in at all). This generalizes that reciprocal lookup
// to any pair, for both the per-segment and (runTotal-only) total tables.
function upv4LookupEmpirical(gender, source, target, segment){
  // "officialTotal" is a synthetic segment id (used only by raceOnlyOfficialTimeAnchors) meaning
  // the WHOLE race's official finish time. This is NOT the same quantity as the "runTotal" segment
  // used everywhere else in this file (upv4SegmentValue/UPV4_SEGMENTS), which means only the summed
  // 8 running legs. UPV4_EMPIRICAL_SEGMENT's own "runTotal" sub-field is a RUNNING-ONLY conversion
  // ratio — mixing it up with UPV4_EMPIRICAL_TOTAL's WHOLE-RACE ratio (which is what "officialTotal"
  // needs) would silently apply the running-only ratio to a full finish time. Kept as a fully
  // separate branch, consulting UPV4_EMPIRICAL_TOTAL only, so the two "runTotal"-shaped strings can
  // never bleed into each other.
  if(segment==="officialTotal"){
    const fwdTotal = UPV4_EMPIRICAL_TOTAL[`${gender}|${source}|${target}`];
    if(Number.isFinite(Number(fwdTotal))){
      return { multiplier:Number(fwdTotal), confidence:"MEDIUM", hops:1, source:"EMBEDDED_EMPIRICAL_TOTAL" };
    }
    const revTotal = UPV4_EMPIRICAL_TOTAL[`${gender}|${target}|${source}`];
    if(Number.isFinite(Number(revTotal)) && Number(revTotal)>0){
      return { multiplier:1/Number(revTotal), confidence:"MEDIUM", hops:1, source:"EMBEDDED_EMPIRICAL_TOTAL_REVERSE" };
    }
    return null;
  }

  const fwdSeg = UPV4_EMPIRICAL_SEGMENT[`${gender}|${source}|${target}`];
  if(fwdSeg && Number.isFinite(Number(fwdSeg[segment]))){
    return { multiplier:Number(fwdSeg[segment]), confidence:"MEDIUM", hops:1, source:"EMBEDDED_EMPIRICAL_SEGMENT" };
  }
  const revSeg = UPV4_EMPIRICAL_SEGMENT[`${gender}|${target}|${source}`];
  if(revSeg && Number.isFinite(Number(revSeg[segment])) && Number(revSeg[segment])>0){
    return { multiplier:1/Number(revSeg[segment]), confidence:"MEDIUM", hops:1, source:"EMBEDDED_EMPIRICAL_SEGMENT_REVERSE" };
  }
  return null;
}
function upv4Conversion(gender, source, target, segment){
  let result = null;

  if(source===target){
    result = {multiplier:1, confidence:"EXACT", hops:0, source:"exact"};
  }

  if(!result){
    const empirical = raceOnlyUnifiedConversionEntry(gender, source, target, segment);
    if(empirical && Number.isFinite(Number(empirical.median_ratio))){
      const hops = Number.isFinite(Number(empirical.hops)) ? Number(empirical.hops) : 1;
      result = {
        multiplier:Number(empirical.median_ratio),
        confidence:empirical.confidence || (hops===1?"MEDIUM":hops===2?"LOW":"VERY_LOW"),
        hops,
        source:"REAL_RACE_CONVERSION_MATRIX"
      };
    }
  }

  // Production fallback: use the embedded gender × source × target × segment empirical ratios
  // (forward direction, then reciprocal of the opposite-direction entry) when the external
  // conversion matrix has not been loaded.
  if(!result){
    result = upv4LookupEmpirical(gender, source, target, segment);
  }

  /*
    Mixed Doubles <-> Singles is a two-hop cross-division conversion, in EITHER direction — bridged
    through the corresponding gendered Doubles division:
      Mixed <-> Open Doubles <-> Open
      Mixed <-> Pro Doubles  <-> Pro
    bug fix: this used to only bridge FROM Mixed Doubles TO Open/Pro (source==="Mixed Doubles").
    The reverse — an athlete whose only real races are Open/Pro Singles wanting a Mixed Doubles
    estimate — fell straight through to CONVERSION_MATRIX_NOT_LOADED (multiplier:null), silently
    dropping every one of that athlete's real races and leaving the prediction to fall back to a
    generic, athlete-independent benchmark. This is intentionally limited to these two paths. No
    generic benchmark, HPI, body metrics, training data, or other signal is introduced.
  */
  if(!result){
    const mixedBridge = { "Open": "Open Doubles", "Pro": "Pro Doubles" };
    const bridgeMid = source==="Mixed Doubles" ? mixedBridge[target]
                     : target==="Mixed Doubles" ? mixedBridge[source]
                     : null;
    if(bridgeMid){
      const first=upv4Conversion(gender,source,bridgeMid,segment);
      const second=upv4Conversion(gender,bridgeMid,target,segment);
      if(Number.isFinite(Number(first?.multiplier)) && Number.isFinite(Number(second?.multiplier))){
        result = {
          multiplier:Number(first.multiplier)*Number(second.multiplier),
          confidence:"LOW",
          hops:2,
          source:`COMPOSED_EMPIRICAL_${source.replace(/\s+/g,"_")}_TO_${bridgeMid.replace(/\s+/g,"_")}_TO_${target.replace(/\s+/g,"_")}`
        };
      }
    }
  }

  if(!result){
    const path=(UPV4_DIVISION_GRAPH[target]||[]).find(x=>x[0]===source);
    result = {
      multiplier:null,
      confidence:"UNAVAILABLE",
      hops:path ? path[1] : null,
      source:"CONVERSION_MATRIX_NOT_LOADED"
    };
  }

  return upv4ApplyTierFloor(source, target, result);
}

function upv4SegmentValue(race, segment){
  if(segment==="runTotal"){
    const keys = (typeof RUN_KEYS!=="undefined"?RUN_KEYS:[]);
    const vals=keys.map(k=>parseTimeToSec(race?.runs?.[k])).filter(v=>v!=null);
    // An official HYROX finish time is the TOTAL race time, not the 8 km run total.
    // Never inject the full race time into RUN_TOTAL when run splits are missing.
    return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
  }
  if(segment==="roxzone") return parseTimeToSec(race?.transition);
  // bug fix: this used to map segment -> itself (e.g. bbj -> "bbj"), but race.stations is
  // keyed by STATIONS[].key (burpee/carry/lunge/wallball), never by the UPV4 internal names
  // (bbj/farmers/lunges/wallBalls). That mismatch meant Burpee/Farmers Carry/Sandbag Lunge/
  // Wall Ball could never find their real race data here — silently treated as "no data" for
  // every athlete, even ones who had actually recorded those 4 stations.
  const key=UPV4_SEGMENT_TO_STATION_KEY[segment]||segment;
  const st=race?.stations?.[key];
  return parseTimeToSec(st);
}

/* ---------------------------------------------------------------------- */
/* FULL SIMULATION -> RACE-ONLY PREDICTION (feature)                       */
/* Only the portion of a Simulation that was actually attempted in real    */
/* HYROX race order — starting from the very first station (SkiErg), with  */
/* no gaps — is trusted. This mirrors the concern that motivated removing  */
/* isolated Quick Test entries: a single station measured on its own, with */
/* no race-like context around it, is a much weaker signal than the same   */
/* station measured as part of an actual attempt at the race sequence.     */
/* ---------------------------------------------------------------------- */
// Counts how many STATIONS[] entries (0..8) are validly filled starting from index 0, stopping at
// the first gap. "Validly filled" requires BOTH a parseable time AND an exact unit match against
// the station's official distance/reps (STATIONS[].unit) — the same exact-unit-match safety rule
// the legacy engine already used for Quick Test/Simulation station data, so a half-distance rep is
// never silently blended in as if it were the full official distance.
function simulationValidStationPrefix(sim){
  let n=0;
  for(const st of STATIONS){
    const s=sim?.stations?.[st.key];
    const sec=s && parseTimeToSec(s.time);
    if(!sec) break;
    if(String(s.amount||"").trim().toLowerCase()!==String(st.unit).trim().toLowerCase()) break;
    n++;
  }
  return n;
}
// Resolves one UPV4_SEGMENTS value from a Simulation record, respecting the valid-prefix rule above:
//  - a station counts only if it falls within the valid prefix (index < n)
//  - a run leg counts up to and including the leg right after the last valid station (run(n+1)) —
//    run1 is always eligible regardless of station progress, since it happens before any station
//  - roxzone (aggregate transition time) and the runTotal aggregate both only make sense once every
//    station has been validly completed (n===8) — see raceOnlyOfficialTimeAnchors for the same rule
//    applied to the record's own totalTime field
function upv4SimulationSegmentValue(sim, segment){
  const n=simulationValidStationPrefix(sim);
  if(segment==="roxzone"){
    if(n<8) return null;
    return parseTimeToSec(sim.transition);
  }
  const stationKey=UPV4_SEGMENT_TO_STATION_KEY[segment];
  if(stationKey){
    const idx=STATIONS.findIndex(s=>s.key===stationKey);
    if(idx<0 || idx>=n) return null; // outside the order-verified prefix — not trusted
    const s=sim.stations?.[stationKey];
    return s ? parseTimeToSec(s.time) : null;
  }
  if(segment==="runTotal"){
    const maxRun=n+1;
    let sum=0, any=false;
    RUN_KEYS.forEach(k=>{
      if(k>maxRun) return;
      const r=sim.runs?.[k];
      if(!r || !r.time || !r.distanceM) return; // never guess a missing distance
      const sec=parseTimeToSec(r.time);
      if(!sec) return;
      sum += (sec/r.distanceM)*1000; // normalize to a 1km-equivalent pace, same convention every
      any=true;                      // other run-leg source in this file already uses
    });
    return any ? sum : null;
  }
  return null;
}

function upv4ResolveAthleteGender(race){
  // Mixed Doubles is a team-level result, so a DB row's gender/team label must
  // never override the athlete's selected target gender. Goal > gender override
  // is authoritative when present (e.g. profile=male, target=Female).
  if(upv4IsMixed(race?.division)){
    const g=STATE?.profile?.goalGender || STATE?.profile?.gender;
    return upv4NormGender(g);
  }
  if(race?.athleteGender==="female"||race?.athlete_gender==="female") return "female";
  if(race?.athleteGender==="male"||race?.athlete_gender==="male") return "male";
  return upv4NormGender(STATE?.profile?.goalGender || STATE?.profile?.gender);
}

/*
  Core resolver:
  - goalDivision is the ONLY target context.
  - all real races are candidates, with one exception: when the athlete has ANY real race in the
    same team FORMAT as the goal (Singles<->Singles or Doubles<->Doubles), races that require a
    format-CHANGING conversion (Singles<->Doubles) are set aside for this goal. A Singles->Doubles
    conversion has to assume how a hypothetical partner would split the workload — a much bigger,
    unverified extrapolation than a same-format tier conversion (Open<->Pro, which only changes
    implement weight) — and blending it in at equal weight can pull a Doubles goal's estimate below
    real, same-format Doubles evidence at a lighter tier (e.g. predicting Pro Doubles faster than
    the athlete's own real Open Doubles result). Only used as a last resort when the athlete has NO
    same-format evidence at all for this goal, in which case every real race is still a candidate,
    per the original rule above.
  - Mixed Doubles is never silently renamed to Open.
  - Run is aggregated; contribution only affects Doubles stations.
*/
function resolveUnifiedPerformance(goalDivision, options={}){
  const goal=normalizeRaceDivision(goalDivision)||goalDivision;
  // feature (Doubles Team Engine): options.races/options.simulations let a caller resolve an
  // ARBITRARY athlete's data (e.g. a Doubles partner's own race history) through this exact same
  // pipeline, instead of always reading STATE.races/STATE.simulationTests. Omitting them keeps the
  // original Singles behavior byte-for-byte. options.forceGender likewise overrides per-race
  // gender resolution — needed because upv4ResolveAthleteGender() falls back to the CURRENT
  // profile's gender when a race carries no explicit athleteGender, which would silently use my
  // own gender for a partner's races unless we pin it explicitly.
  const races=(options.races || STATE?.races || []).filter(r=>r && r.date);
  // feature: Full Simulation now also feeds this pool (see upv4SimulationSegmentValue's header
  // comment) — an athlete with zero real races but a real Full Simulation should still get
  // segment data here, so the emptiness guard below now checks both sources.
  const sims=(options.simulations || STATE?.simulationTests || []).filter(s=>s && s.date);
  if(!goal || (!races.length && !sims.length)) return {goalDivision:goal,segments:{},records:[],confidence:"NONE"};

  const records=[];
  const targetCandidates=(UPV4_DIVISION_GRAPH[goal]||[[goal,0]]).map(x=>x[0]);
  const goalIsDoubles=upv4IsDoubles(goal);
  const hasSameFormatEvidence=races.some(r=>{
    const src=normalizeRaceDivision(r.division)||r.division;
    return src && upv4IsDoubles(src)===goalIsDoubles;
  });

  for(const race of races){
    const source=normalizeRaceDivision(race.division)||race.division;
    if(hasSameFormatEvidence && source && upv4IsDoubles(source)!==goalIsDoubles) continue;
    const gender=options.forceGender || upv4ResolveAthleteGender(race);

    /* Mixed is gender-aware for conversion, but remains Mixed Doubles as source. */
    let best=null;
    for(const targetSource of targetCandidates){
      if(targetSource===source){ best={source,target:targetSource}; break; }
    }
    if(!best){
      /* A Mixed source can only bridge when target is gendered Doubles. */
      const mixedBridge=upv4IsMixed(source) && (goal==="Open Doubles"||goal==="Pro Doubles");
      if(mixedBridge) best={source,target:goal};
      else best={source,target:source};
    }

    for(const segment of UPV4_SEGMENTS){
      const raw=upv4SegmentValue(race,segment);
      if(raw==null) continue;
      const conv=upv4Conversion(gender,source,goal,segment);
      const contribution=upv4GetContribution(race,gender,segment);
      const recency=upv4RecencyWeight(race.date);
      const completeness=typeof raceDataCompleteness==="function"
        ? Math.max(0.25,raceDataCompleteness(race)/17) : 1;
      // bug fix: same dead-field issue as upv4GetContribution() — checks the actual storage
      // field (race.share, mapped via UPV4_SEGMENT_TO_STATION_KEY) instead of fields the app
      // never writes, so a real user-entered share% now correctly earns full confidence.
      const stationKeyForConf = UPV4_SEGMENT_TO_STATION_KEY[segment] || segment;
      const hasRealShare = race?.share?.[stationKeyForConf]!=null && race.share[stationKeyForConf]!=="" && !isNaN(Number(race.share[stationKeyForConf]));
      const contributionConfidence = upv4IsDoubles(source) && segment!=="runTotal"
        ? (hasRealShare ? 1 : 0.75)
        : 1;

      /*
        Conversion transforms the source segment into target-equivalent seconds.
        Contribution is a confidence/representation weight for Doubles stations,
        not a multiplication of elapsed time.
      */
      if(conv.multiplier==null) continue;
      const converted=raw*conv.multiplier;
      const weight=recency*completeness*contributionConfidence;
      records.push({
        date:race.date,sourceDivision:source,goalDivision:goal,
        gender,segment,rawSec:raw,convertedSec:converted,
        conversion:conv,recencyWeight:recency,
        completeness,contribution,weight,
        officialTime:parseTimeToSec(race.officialTime), isSimulation:false
      });
    }
  }

  // feature: Full Simulation as a lower-trust supplementary source — reuses the exact same
  // conversion/tiering machinery as real races above (upv4Conversion, same-format preference),
  // just at SOURCE_TRUST_V3.simulation weight and restricted to whichever segments fall within
  // the order-verified prefix (see upv4SimulationSegmentValue). Simulation only ever records
  // Open/Pro (no Doubles option), so for a Doubles goal it's always cross-format — exactly like a
  // real Singles race would be — and gets set aside the same way once real Doubles evidence exists.
  for(const sim of sims){
    const source=sim.division==="Pro" ? "Pro" : "Open";
    if(hasSameFormatEvidence && upv4IsDoubles(source)!==goalIsDoubles) continue;
    const gender=options.forceGender || upv4NormGender(STATE?.profile?.goalGender || STATE?.profile?.gender);
    for(const segment of UPV4_SEGMENTS){
      const raw=upv4SimulationSegmentValue(sim,segment);
      if(raw==null) continue;
      const conv=upv4Conversion(gender,source,goal,segment);
      if(conv.multiplier==null) continue;
      const converted=raw*conv.multiplier;
      const weight=upv4RecencyWeight(sim.date)*(SOURCE_TRUST_V3.simulation||0.7);
      records.push({
        date:sim.date,sourceDivision:source,goalDivision:goal,
        gender,segment,rawSec:raw,convertedSec:converted,
        conversion:conv,recencyWeight:upv4RecencyWeight(sim.date),
        completeness:1,contribution:1,weight,
        officialTime:null, isSimulation:true
      });
    }
  }

  const segments={};
  for(const seg of UPV4_SEGMENTS){
    const xs=records.filter(x=>x.segment===seg && Number.isFinite(x.convertedSec));
    if(!xs.length) continue;
    const sumW=xs.reduce((s,x)=>s+x.weight,0);
    segments[seg]={
      value:sumW ? xs.reduce((s,x)=>s+x.convertedSec*x.weight,0)/sumW : null,
      sampleN:xs.length,
      sources:[...new Set(xs.map(x=>x.sourceDivision))],
      // transparency: lets callers (e.g. raceOnlyPrediction's part labels) say "Simulation 기반"
      // instead of implying real race evidence when every contributing record for this specific
      // segment actually came from a Full Simulation rather than an official race.
      allSimulation:xs.every(x=>x.isSimulation),
      records:xs.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10)
    };
  }
  return {
    goalDivision:goal,
    segments,
    records,
    sourceDivisions:[...new Set(records.map(x=>x.sourceDivision))],
    modelVersion:"UNIFIED-PERFORMANCE-V4",
    noBaseDivision:true
  };
}

/* Explicit audit helper: can be run from console without mutating STATE. */
function auditUnifiedPerformanceV4(goalDivision){
  const r=resolveUnifiedPerformance(goalDivision);
  console.table(Object.entries(r.segments).map(([segment,x])=>({
    segment, valueSec:x.value, sampleN:x.sampleN, sources:x.sources.join(" | ")
  })));
  return r;
}

/* ---------------------------------------------------------------------- */
/* RACE-ONLY PRODUCTION PREDICTION V5                                      */
/* Goal Division is the sole target. No HPI, Recovery, body metrics,      */
/* 1RM, training log, ACWR, HR trend, or Base Division is allowed to move  */
/* the race-time center. Cross-Division evidence uses gender-aware         */
/* empirical segment conversion; if a segment is missing, only that        */
/* segment falls back to the target benchmark.                             */
/* ---------------------------------------------------------------------- */
function getRaceOnlyBenchmarkSegmentSec(goalDiv, segment){
  // bug fix: same UPV4-name vs STATIONS-key mismatch as upv4SegmentValue() above — getSegmentBenchmarkSec()
  // expects STATIONS[].key (burpee/carry/lunge/wallball), not the UPV4 internal names, so this fallback
  // silently returned null for those 4 stations whenever the real-data lookup above also failed.
  const segMap={runTotal:"runTotal", roxzone:"roxzone", ...UPV4_SEGMENT_TO_STATION_KEY};
  const key=segMap[segment]||segment;
  if(key==="runTotal"){
    const vals=RUN_KEYS.map(k=>runLegBenchmarkSec(RUN_KEYS.indexOf(k)).sec).filter(v=>v!=null);
    return vals.length?vals.reduce((a,b)=>a+b,0):null;
  }
  if(key==="roxzone") return transitionBenchmarkSec().sec;
  const d=getSegmentBenchmarkSec(key);
  return d?.sec ?? null;
}
/* ---------------------------------------------------------------------- */
/* OFFICIAL-TIME ANCHOR FOR RACE-ONLY PREDICTION                          */
/* A single cross-Division race must NOT become an unrealistically fast    */
/* segment-sum prediction. Official HYROX finish time is the authoritative */
/* total; Division conversion is applied to that total when available.     */
/* No HPI / recovery / body metrics / 1RM / training data are used here.   */
/* ---------------------------------------------------------------------- */
function raceOnlyOfficialTimeAnchors(goalDivision, options={}){
  const goal=normalizeRaceDivision(goalDivision)||goalDivision;
  // bug fix: this used to source rows from resolveUnifiedPerformance's per-segment `records`,
  // which only ever contains a race at all if at least one Run/Station/Transition split was
  // entered for it (see upv4SegmentValue). A race logged with ONLY an official finish time — no
  // splits, which is a completely normal way to log a result — produced zero records and was
  // therefore invisible here, even though the official time itself is real, standalone evidence.
  // Reading straight from STATE.races makes every logged official time count, split data or not.
  // feature (Doubles Team Engine): options.races/options.simulations/options.forceGender mirror the
  // same override added to resolveUnifiedPerformance() — omitted, this is byte-for-byte the
  // original STATE-reading behavior.
  const rows=(options.races || STATE?.races || []).filter(r=>r && r.date && parseTimeToSec(r.officialTime)!=null);
  const byRace=new Map();
  rows.forEach(race=>{
    const official=parseTimeToSec(race.officialTime);
    if(!Number.isFinite(official) || official<=0) return;
    const source=normalizeRaceDivision(race.division)||race.division;
    if(!source) return;
    const gender=options.forceGender || upv4ResolveAthleteGender(race);
    const key=[race.date||"", source, official, gender].join("|");
    if(byRace.has(key)) return;
    byRace.set(key,{date:race.date,sourceDivision:source,officialTime:official,gender,isSimulation:false});
  });
  // feature: a Full Simulation's own total time is real, self-measured evidence of the athlete's
  // current ability — but only when it actually completed all 8 stations in real race order (see
  // simulationValidStationPrefix). A partial attempt's "total time" can't be trusted as a race-
  // equivalent total (it's not clear what portion of the race it actually represents), so it's
  // excluded here entirely — the same partial attempt's individual completed segments still feed
  // resolveUnifiedPerformance's per-segment blend, just not this whole-race anchor.
  (options.simulations || STATE?.simulationTests || []).filter(s=>s && s.date && parseTimeToSec(s.totalTime)!=null).forEach(sim=>{
    if(simulationValidStationPrefix(sim)<8) return;
    const official=parseTimeToSec(sim.totalTime);
    if(!Number.isFinite(official) || official<=0) return;
    const source=sim.division==="Pro" ? "Pro" : "Open";
    const gender=options.forceGender || upv4NormGender(STATE?.profile?.goalGender || STATE?.profile?.gender);
    const key=["sim", sim.date||"", source, official, gender].join("|");
    if(byRace.has(key)) return;
    byRace.set(key,{date:sim.date,sourceDivision:source,officialTime:official,gender,isSimulation:true});
  });

  const anchors=[...byRace.values()].map(r=>{
    // bug fix: this used to check UPV4_EMPIRICAL_TOTAL directly before ever calling
    // upv4Conversion(), so it bypassed upv4Conversion's tier-direction floor and its Mixed-Doubles
    // bidirectional bridge entirely — the exact same problems fixed there, just duplicated via a
    // second code path. Routing every conversion through upv4Conversion (which itself still checks
    // UPV4_EMPIRICAL_TOTAL first) gives identical results for every case that already worked, and
    // correctly fixed results for the cases that didn't.
    const conv=upv4Conversion(r.gender,r.sourceDivision,goal,"officialTotal");
    if(!Number.isFinite(Number(conv?.multiplier))) return null;
    const multiplier=Number(conv.multiplier);
    const method = r.isSimulation ? "SIMULATION_OFFICIAL_TIME"
      : r.sourceDivision===goal ? "EXACT_OFFICIAL_TIME"
      : conv.hops===2 ? "OFFICIAL_TIME_COMPOSED_CONVERSION" : "OFFICIAL_TIME_TOTAL_CONVERSION";
    return {...r,multiplier,convertedTotal:r.officialTime*multiplier,method};
  }).filter(Boolean);

  if(!anchors.length) return null;

  /* Target-division official races are strongest. Same-team-FORMAT official races (Doubles-goal
     using other-tier Doubles evidence, or vice versa for Singles) are the next best thing — they
     only require a same-format tier conversion (Open<->Pro weight standard), never the much
     bigger, unverified Singles<->Doubles workload-split assumption. Cross-format official races
     are used only when that's genuinely all the athlete has. See resolveUnifiedPerformance's
     header comment for the same reasoning applied to the segment-level pooling.
     A Simulation is never "exact" evidence even when its division matches the goal exactly — it's
     unofficial, self-measured data, so it should never outrank/exclude a real race in a same-
     format-but-different-tier division the way real exact-division evidence would. */
  const goalIsDoubles=upv4IsDoubles(goal);
  const exact=anchors.filter(a=>a.sourceDivision===goal && !a.isSimulation);
  const sameFormat=anchors.filter(a=>upv4IsDoubles(a.sourceDivision)===goalIsDoubles);
  const pool=exact.length?exact:(sameFormat.length?sameFormat:anchors);
  const weighted=pool.map(a=>({
    ...a,
    weight:upv4RecencyWeight(a.date||todayISO()) * (a.sourceDivision===goal ? 1 : 0.75) * (a.isSimulation ? (SOURCE_TRUST_V3.simulation||0.7) : 1)
  }));
  const sumW=weighted.reduce((s,a)=>s+a.weight,0)||1;
  const predicted=weighted.reduce((s,a)=>s+a.convertedTotal*a.weight,0)/sumW;
  const crossCount=pool.filter(a=>a.sourceDivision!==goal).length;

  return {
    predicted,
    anchors:weighted,
    anchorCount:pool.length,
    crossDivision:crossCount>0,
    exactDivision:exact.length>0,
    method:pool.length===1 ? pool[0].method : (exact.length?"WEIGHTED_EXACT_OFFICIAL_TIMES":sameFormat.length?"WEIGHTED_SAME_FORMAT_OFFICIAL_TIMES":"WEIGHTED_CROSS_FORMAT_OFFICIAL_TIMES")
  };
}

function raceOnlyPrediction(targetDivision, options={}){
  const goal=normalizeRaceDivision(targetDivision)||"Open Doubles";
  // feature (Doubles Team Engine): options.races/simulations/forceGender/running/age let this exact
  // function resolve an ARBITRARY athlete (e.g. a Doubles partner) instead of always STATE — omitted,
  // this is byte-for-byte the original Singles/STATE-reading behavior.
  const u=resolveUnifiedPerformance(goal, options);
  const running = options.running || STATE.running;
  const order=["runTotal","ski","sledPush","sledPull","bbj","row","farmers","lunges","wallBalls","roxzone"];
  const parts=[];
  let actualCount=0;
  order.forEach(seg=>{
    let v=u.segments?.[seg]?.value;
    let source=u.segments?.[seg] ? (u.segments[seg].allSimulation ? "Full Simulation 기반" : "실제 대회/Division 환산") : null;
    if(v==null && seg==="runTotal"){
      const pb10=parseTimeToSec(running.pb10k || running.tt10k);
      if(pb10){ v=(pb10/10+30)*8; source="10K TT/PB +30초/km · 8km"; }
      else {
        const fallback = [
          {km:5, time:running.pb5k || running.tt5k, label:"5K TT/PB"},
          {km:3, time:running.tt3k, label:"3K TT"},
          {km:1, time:running.tt1k, label:"1K TT"}
        ].map(x=>({...x, sec:parseTimeToSec(x.time)})).find(x=>x.sec);
        if(fallback){
          v=(fallback.sec/fallback.km+30)*8;
          source=`${fallback.label} +30초/km · 8km (10K 없음)`;
        }
      }
    }
    if(v==null){
      // feature (Doubles Team Engine): route the benchmark fallback through the SAME
      // gender/age-aware context used above, so a partner's benchmark fallback matches their own
      // demographic rather than the logged-in athlete's — options.forceGender/options.age only, no
      // change to the existing Singles call (which passes neither).
      v = (options.forceGender || options.age!=null)
        ? withPredictionContext({mode:"race", division:goal, gender:options.forceGender, age:options.age}, ()=>getRaceOnlyBenchmarkSegmentSec(goal,seg))
        : getRaceOnlyBenchmarkSegmentSec(goal,seg);
      source="동일 조건 benchmark";
    }
    if(v!=null){
      parts.push({segment:seg,value:v,source});
      if(u.segments?.[seg]) actualCount++;
    }
  });

  const segmentTotal=parts.reduce((a,x)=>a+x.value,0);
  const coverage=actualCount/order.length;

  /* IMPORTANT: When the user has only one Mixed/Open/other official race and
     asks for another Division, the converted segment sum can omit transition
     time or otherwise overstate the athlete's ability. Use the official total
     converted through the empirical TOTAL matrix as the race-time center.
     Segment detail remains available for DNA/diagnostics, but cannot override
     the official total anchor in this sparse-evidence case. */
  const officialAnchor=raceOnlyOfficialTimeAnchors(goal, options);
  let total=segmentTotal;
  let predictionSource=`Race-only Performance (${goal})`;
  let anchorNote=null;
  let anchorCoverage=coverage;

  if(officialAnchor){
    const hasExact=officialAnchor.exactDivision;
    const sparseCross=!hasExact && officialAnchor.anchorCount<=2;
    const segmentVsAnchor=Math.abs(segmentTotal-officialAnchor.predicted)/Math.max(officialAnchor.predicted,1);
    if(sparseCross || segmentVsAnchor>0.05){
      total=officialAnchor.predicted;
      predictionSource=officialAnchor.crossDivision
        ? `Official race total → ${goal} Division conversion`
        : `Official ${goal} race total`;
      anchorNote=officialAnchor.crossDivision
        ? `공식 완주기록 ${officialAnchor.anchorCount}건을 목표 Division 전체기록 변환으로 사용했습니다. 구간 합산이 공식 총기록보다 5% 이상 벗어나면 구간 합산으로 과소예측하지 않습니다.`
        : `공식 ${goal} 완주기록을 현재 예상기록의 기준으로 사용했습니다.`;
      anchorCoverage=Math.max(coverage,0.9);
    }
  }

  const confidence=anchorNote
    ? (officialAnchor?.exactDivision ? "HIGH" : "MEDIUM")
    : (coverage>=0.8?"HIGH":coverage>=0.5?"MEDIUM":"LOW");
  // Fixed race-evidence range. HPI/RaceExec is intentionally not used.
  const halfWidth=anchorNote ? (officialAnchor?.exactDivision?120:240) : (coverage>=0.8?120:coverage>=0.5?180:240);
  return {
    predicted:total, ciLow:Math.max(0,total-halfWidth), ciHigh:total+halfWidth,
    predictionDivision:goal, coverage:anchorCoverage, actualCount, segmentCount:order.length,
    confidence, parts, sourceDivisions:u.sourceDivisions||[], officialAnchor,
    baseline:{
      recentActual:null, bestRecentActual:null, segmentEstimate:{value:total,source:predictionSource},
      protectionWeight:0, anchorNote,
      source:predictionSource,
      v5:{segmentModel:{actualCount,segmentCount:order.length,exactDivisionCoverage:goal&&u.records?.length?((u.records||[]).filter(x=>x.sourceDivision===goal).length>0?coverage:0):0}}
    },
    modelVersion:"RACE-ONLY-V6-OFFICIAL-TOTAL-ANCHOR"
  };
}

/* ---------------------------------------------------------------------- */
/* CANONICAL CURRENT-PERFORMANCE BASELINE (audit item #3)                  */
/*   Single source of truth for "현재 예상 기록", reused by every page:      */
/*   기록 예측 (getBaselineTime), 목표 설정 (buildSegmentGapAnalysis),        */
/*   Goal Scenario (getGoalAwareBaseline), Division 전환 (computeDivision-   */
/*   Transition/computeDoublesToSingles), Dashboard.                        */
/*   Implementation note: getBaselineTime()'s existing cascade (fresh race  */
/*   > segment model > stale race > benchmark×HPI) is NOT duplicated here — */
/*   this just re-runs that exact same function under a temporary division  */
/*   context, so "same input data -> same base division -> same baseline"   */
/*   is structurally guaranteed rather than merely intended.                */
/* ---------------------------------------------------------------------- */
function withDivisionContext(division, fn){
  const prevDiv = STATE.profile.division, prevGoal = STATE.profile.goalDivision;
  try{
    STATE.profile.division = division;
    STATE.profile.goalDivision = ""; // avoid recursively triggering goal-aware branching while swapped
    return fn();
  } finally {
    STATE.profile.division = prevDiv;
    STATE.profile.goalDivision = prevGoal;
  }
}


function daysToRace(){
  if(!STATE.profile.targetDate) return null;
  return daysBetween(todayISO(), STATE.profile.targetDate);
}

/* ---------------------------------------------------------------------- */
/* 4d. PREDICTION CONFIDENCE — weighted data-completeness (not field count) */
/*     Drives how much the prediction is allowed to move away from the      */
/*     Anchor (current actual PB). Sparse data -> low confidence -> the      */
/*     prediction stays close to the Anchor instead of swinging wildly.     */
/* ---------------------------------------------------------------------- */
function calcPredictionConfidence(){
  const races=STATE.races;
  const race=latestRace();
  const items=[
    {w:0.35,ok:!!(race&&race.officialTime)},
    {w:0.25,ok:!!(race&&RUN_KEYS.some(k=>race.runs?.[k]) )},
    {w:0.20,ok:!!(race&&STATIONS.some(s=>race.stations?.[s.key])) || STATE.stationTests.length>0 || STATE.simulationTests.length>0},
    {w:0.20,ok:!!(STATE.running.pb5k||STATE.running.pb10k||STATE.running.pbHalf)}
  ];
  const confidence=clamp(items.reduce((s,i)=>s+(i.ok?i.w:0),0),0,1);
  const label=confidence>=0.65?"HIGH":confidence>=0.35?"MEDIUM":"LOW";
  const missing=[];
  if(!race||!race.officialTime) missing.push("HYROX 대회 기록");
  if(!(race&&RUN_KEYS.some(k=>race.runs?.[k]))) missing.push("HYROX Run 스플릿 또는 러닝 PB");
  if(!(race&&STATIONS.some(s=>race.stations?.[s.key])) && !STATE.stationTests.length && !STATE.simulationTests.length) missing.push("Station 테스트/Simulation");
  return {confidence,label,missing,categories:{race:!!(race&&race.officialTime),run:!!(race&&RUN_KEYS.some(k=>race.runs?.[k])) || !!(STATE.running.pb5k||STATE.running.pb10k||STATE.running.pbHalf),station:!!STATE.stationTests.length||!!STATE.simulationTests.length}};
}

/* ---------------------------------------------------------------------- */
/* 4b. PREDICTION ACCURACY TRACKING (spec §1)                              */
/*     Every time a prediction snapshot is recorded (recordHpiSnapshot),    */
/*     it's matched against whichever real race result comes next          */
/*     chronologically — recomputed fresh each call (never mutated/cached）  */
/*     so edited/deleted race history is always reflected correctly.        */
/*     Feeds MAE / median error / range-coverage back into predictTime()'s  */
/*     range width via getRangeCalibrationMultiplier() — the range widens   */
/*     or narrows based on MEASURED past accuracy, never shrunk arbitrarily.*/
/* ---------------------------------------------------------------------- */
// spec: NOT a fixed 68%/95% textbook CI — this range is a hand-tuned display band (see the
// HIGH/MEDIUM/LOW seconds table above). We treat "about 70% of real outcomes should land inside it"
// as the calibration target and tune the multiplier toward that as real match data accumulates.

// Matches every prediction snapshot to the first real race whose date is after the snapshot's date.
// A snapshot with no later race yet is simply unmatched (not an error) — most snapshots will be
// unmatched most of the time; that's expected, not a data problem.


// Prediction Bias Calibration (spec ⑨/⑩): errorSec = actual-predicted (positive = model predicted
// FASTER than what actually happened, i.e. model was too optimistic; negative = model predicted
// SLOWER than actual, i.e. too conservative). Below PREDICTION_BIAS_MIN_SAMPLES this returns a 0
// adjustment (no behavior change at all — same as before this feature existed). Once enough matched
// real outcomes exist, HALF the measured median bias is applied (a conservative partial correction,
// never a full snap-to-history override), capped so a handful of noisy outcomes can't swing forecasts
// wildly. Deliberately NEVER applied to the horizon=0 Current Anchor (spec ①/⑩ — Anchor and forecast
// calibration must stay separate) — predictTime() only applies this to horizonWeeks>0 forecasts.

// Range calibration (spec: "range을 임의로 좁히는 것이 아니라 실제 데이터가 쌓이면 calibration").
// Below the minimum sample size this returns exactly 1 (no change to the hand-tuned defaults above).
// Once enough matched real outcomes exist, the multiplier is driven purely by measured coverage vs
// the target — under-coverage (band too narrow, real results falling outside it) widens the range;
// over-coverage (band comfortably wider than needed) narrows it, capped so a single good/bad streak
// can't swing it to an extreme.

function predictTime(hpiResult, horizonWeeks=0){
  // PRODUCTION: all time horizons read the same current Race-only estimate.
  // This site measures current race position, not future training outcomes.
  const div = normalizeRaceDivision(
    activePredictionContext().mode==="race"
      ? activePredictionContext().exactDivision
      : (STATE.profile.goalDivision || STATE.profile.division)
  ) || "Open Doubles";
  if(activePredictionContext().mode!=="race") {
    return withPredictionContext({mode:"race",division:div},()=>predictTime(hpiResult,horizonWeeks));
  }
  const r = raceOnlyPrediction(div);
  const confidence = r.confidence==="HIGH"?0.85:r.confidence==="MEDIUM"?0.60:0.35;
  return {
    predicted:r.predicted, ciLow:r.ciLow, ciHigh:r.ciHigh,
    baseline:{
      value:r.predicted, source:`Race-only Performance (${div})`, baselineHpiDate:null,
      recentActual:null, bestRecentActual:null, segmentEstimate:r.baseline?.segmentEstimate||null,
      protectionWeight:0, anchorNote:null, raceOnly:r,
      v5:{modelVersion:"RACE-ONLY-V6-OFFICIAL-TOTAL-ANCHOR", targetDivision:div, hpiExcluded:true, baseDivisionExcluded:true}
    },
    projectedHpi:null, deltaHpi:0, tier2Gap:0, improvementProb:null, horizonWeeks, fraction:0,
    confidence, confidenceLabel:r.confidence,
    missingData:[],
    dataCategories:[
      {label:"HYROX/개인 경기 데이터",status:r.actualCount>0?"green":"yellow"},
      {label:"선택 Division benchmark",status:"green"},
      {label:"HPI · Recovery · 훈련 · 신체정보",status:"red"}
    ],
    rawModelPrediction:r.predicted,
    biasCalibration:{adjustmentSec:0,applied:false,n:0,meanBiasSec:null,medianBiasSec:null},
    modelVersion:"RACE-ONLY-V6-OFFICIAL-TOTAL-ANCHOR"
  };
}


/* ---------------------------------------------------------------------- */
/* 5b-2. V3 — SEGMENT-BASED RACE PERFORMANCE MODEL                         */
/*     Decomposes race time into its 17 constituent segments (8 Runs,      */
/*     8 Stations, Transition/Roxzone). Builds a "Current Estimated Race   */
/*     Time" from segment-level actuals whenever they exist, instead of    */
/*     a single flat number. Reuses the existing per-station freshness/    */
/*     adjustment logic (getStationDataMeta) rather than duplicating it.   */
/*     Each segment is tagged with a `basis` so the UI can always show     */
/*     whether a number is real, adjusted, or a reference benchmark —      */
/*     never displayed as a real stat when it isn't one.                   */
/* ---------------------------------------------------------------------- */
const SEGMENT_LIST = [
  ...RUN_KEYS.map(k=>({ type:"run", key:`run${k}`, runIdx:k, label:`Run ${k}` })),
  ...STATIONS.map(s=>({ type:"station", key:s.key, label:s.label })),
  { type:"transition", key:"transition", label:"Transition/Roxzone" },
];
// ASIA/Global derived-benchmark hookup (review item #3): previously ONLY computeStationPriority()
// consulted DERIVED_BENCHMARK — the 17-segment Anchor model (and therefore getBaselineTime() /
// predictTime() / Goal Setting / Division Transition, everything downstream of it) fell straight to
// the static hardcoded BENCH table whenever a segment had no real athlete data at all. That's the
// literal mechanism behind "Row 1000m 기준 2:30" showing up as a benchmark-only segment value even
// though the real Asia P50 for this athlete's Division/Gender/AgeBand is ~5:07-5:45 — BENCH's static
// number, not the imported Asia data, was what actually fed the prediction. Fixed by routing every
// benchmark-only lookup used by the segment model through the SAME queryDerivedBenchmark() fallback
// chain (ASIA -> ASIA_AGE_RELAXED -> GLOBAL_HISTORICAL -> GLOBAL_HISTORICAL_AGE_RELAXED ->
// GLOBAL_MATRIX) computeStationPriority already uses, before falling back to BENCH. Real personal
// data (actual/actual-adjusted/actual-stale/estimated-training-pace) is untouched and still always
// wins — this only changes what fills in for segments with NO personal data at all.
function getSegmentBenchmarkSec(segmentKey){
  // feature (Doubles Team Engine): use the active prediction context's gender/age override when
  // present (see withPredictionContext), so a partner's benchmark fallback matches THEIR
  // demographic — otherwise unchanged, falling through to STATE.profile as always. ctx.gender is
  // "male"/"female" (this app's usual convention); deriveBenchmarkGender()'s own "M"/"W"/"MIXED"
  // convention is only used when no explicit override is active.
  const ctx=activePredictionContext();
  const ageBand = deriveAgeBand(ctx.age!=null ? ctx.age : STATE.profile.age);
  const benchGender = ctx.gender ? (ctx.gender==="female"?"W":"M") : deriveBenchmarkGender();
  const derived = queryDerivedBenchmark(currentPredictionDivision(), benchGender, ageBand, segmentKey);
  if(derived && derived.p50) return { sec:derived.p50, source:derived.benchmark_source, sampleN:derived.sample_n, confidence:derived.confidence };
  return null;
}
// KEY-MAPPING FIX: segment keys passed to queryDerivedBenchmark() must be the SAME key strings this
// app already uses everywhere else for these segments — SEGMENT_LIST's own seg.key ("run1".."run8"
// for run legs, "transition" for roxzone, STATIONS[].key for stations, e.g. "sledPush") — not a
// separately-invented naming scheme. computeStationPriority() already queries stations this way
// (`s.key`, camelCase, e.g. "sledPush" — NOT the snake_case "sled_push" used by the UNRELATED
// EXTERNAL_RACE_DB/RACE_RECORD_SCHEMA peer-DB system). Previously this function used "run_"+runIdx
// and "roxzone", which don't match SEGMENT_LIST's "run1".."run8"/"transition" keys and therefore never
// matched anything in derived_benchmark.json, silently falling through to STATIC_FALLBACK for every
// run leg and the transition segment regardless of what was actually imported.
function segmentBenchmarkWithFallback(segKey, staticFallbackSec){
  const derived = getSegmentBenchmarkSec(segKey);
  return { sec: derived ? derived.sec : staticFallbackSec, source: derived ? derived.source : "STATIC_FALLBACK" };
}
// HYROX run legs are 1km each. Per-leg derived benchmark (segment key "run1".."run8", matching
// SEGMENT_LIST's own run seg.key) preferred over the flat static bench().runKm.
function runLegBenchmarkSec(runIdx){
  return segmentBenchmarkWithFallback("run"+runIdx, bench().runKm);
}
// transition/roxzone: segment key "transition" (matching SEGMENT_LIST's own transition seg.key, NOT
// "roxzone"). Static fallback fixed at 300s (5min) — matches the existing peer-benchmark "roxzone"
// base (PEER_SEGMENTS: { key:"roxzone", base:300 }) — since SEGMENT_LIST's transition segment is the
// FULL race Transition/Roxzone aggregate, not one single station-to-station gap; runKm*0.15 (~45-50s)
// was scaled for the latter and understated the former by ~6x. Only applies when no derived ASIA/
// Global row exists at all — the derived chain (ASIA -> ... -> GLOBAL_MATRIX) is unchanged and still
// takes priority whenever a matching row is available.
function transitionBenchmarkSec(){
  return segmentBenchmarkWithFallback("transition", 300);
}


// spec (Simulation -> 17-segment connection, same official-priority rule as collectStationCandidates
// above): a Simulation run leg's actual distance is converted to its 1km-pace equivalent (exact
// division, no invented factor) since every run segment elsewhere in this app represents "time for
// this 1km leg". Distance MUST be present — a run entry with a time but no distance is skipped
// entirely rather than assumed to be 1km. No-simulation users: identical output to before (empty loop).
// spec (Simulation -> 17-segment connection, same official-priority rule as collectStationCandidates
// above): a Simulation run leg's actual distance is converted to its 1km-pace equivalent (exact
// division, no invented factor) since every run segment elsewhere in this app represents "time for
// this 1km leg". Distance MUST be present — a run entry with a time but no distance is skipped
// entirely rather than assumed to be 1km. No-simulation users: identical output to before (empty loop).
// Division-aware: races/simulations are filtered to the current profile's Division base first (see
// divisionBase()/collectStationCandidates() above for the full rationale).
function runLegCandidates(runIdx){
  const predCtx=activePredictionContext();
  const out=[...STATE.races].filter(r=>{
    return ctxAcceptsRecordDivision(r.division, predCtx);
  })
    .map(r=>({ date:r.date, sec:parseTimeToSec(r.runs?.[runIdx]), source:"race" }))
    .filter(c=>c.sec!=null);
  // doc12 §3: 더 이상 "최근 공식 기록<=21일" 이유만으로 Simulation 후보를 배제하지 않음 — 항상 추가하고
  // recency 정렬로 실제 더 최근인 쪽이 자연스럽게 선택되도록 함 (collectStationCandidates와 동일 원칙).
  STATE.simulationTests.filter(t=>{
    return ctxAcceptsRecordDivision(t.division, predCtx);
  }).forEach(t=>{
    const r=t.runs && t.runs[runIdx];
    if(!r || !r.time || r.distanceM==null || r.distanceM<=0) return; // never guess a missing distance
    const timeSec=parseTimeToSec(r.time);
    if(!timeSec) return;
    out.push({ date:t.date, sec:(timeSec/r.distanceM)*1000, source:"simulation" });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}
function transitionCandidates(){
  const predCtx=activePredictionContext();
  const out=[...STATE.races].filter(r=>{
    return ctxAcceptsRecordDivision(r.division, predCtx);
  })
    .map(r=>({ date:r.date, sec:parseTimeToSec(r.transition), source:"race" }))
    .filter(c=>c.sec!=null);
  STATE.simulationTests.filter(t=>{
    return ctxAcceptsRecordDivision(t.division, predCtx);
  }).forEach(t=>{
    if(!t.transition) return;
    const sec=parseTimeToSec(t.transition);
    if(!sec) return;
    out.push({ date:t.date, sec, source:"simulation" });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}

// resolves ONE segment's current value. Priority: fresh actual (<=14d, same threshold as stations
// elsewhere) > stale actual with a small capped nudge from the training-log trend (mirrors
// getStationDataMeta's own logic, reused for stations) > benchmark reference (flagged, not "actual").
// spec (doc8, 추가 필수사항): "10K TT를 HYROX Run pace와 동일시하지 말고, 기존 HYROX 데이터에서 확인
// 가능한 관계/보정 로직을 사용" — a flat 10K TT pace is NOT the same as HYROX run-leg pace (fatigue,
// footing, station transitions all slow it down), so this derives the athlete's OWN personal ratio
// between their real HYROX run-leg pace (race or simulation) and their nearest-preceding 10K TT pace,
// from their own paired history only. Never a universal constant, never used with fewer than 2 pairs.

function resolveSegment(seg){
  const b=bench();
  if(seg.type==="station"){
    const meta=getStationDataMeta()[seg.key];
    const stationBench = segmentBenchmarkWithFallback(seg.key, b[seg.key]);
    const benchmark = stationBench.sec, benchmarkSource = stationBench.source;
    if(meta && meta.value){
      return { ...seg, sec:parseTimeToSec(meta.value), date:meta.date, ageDays:meta.ageDays, isFresh:meta.isFresh,
        source:meta.source, adjusted:meta.adjusted, benchmark, benchmarkSource,
        basis: meta.isFresh?"actual":(meta.adjusted?"actual-adjusted":"actual-stale") };
    }
    return { ...seg, sec:null, benchmark, benchmarkSource, basis:"benchmark-only" };
  }
  if(seg.type==="run"){
    const legBench = runLegBenchmarkSec(seg.runIdx);
    const cands=runLegCandidates(seg.runIdx);
    if(cands.length){
      const top=cands[0]; const ageDays=daysBetween(top.date, todayISO()); const isFresh=ageDays<=STATION_STALE_DAYS;
      let sec=top.sec, adjusted=false;
      // Training-log recency/pace is intentionally NOT used to adjust stale race segments.
      return { ...seg, sec, rawSec:top.sec, date:top.date, ageDays, isFresh, source:top.source, adjusted,
        benchmark:legBench.sec, benchmarkSource:legBench.source, basis: isFresh?"actual":(adjusted?"actual-adjusted":"actual-stale") };
    }
    const pb10=parseTimeToSec(STATE.running.pb10k || STATE.running.tt10k);
    if(pb10){
      const sec=pb10/10 + 30;
      return { ...seg, sec, benchmark:legBench.sec, benchmarkSource:legBench.source, basis:"estimated-10k-pb", source:"pb10k", calibration:{ rule:"10K TT/PB + 30초/km" } };
    }
    return { ...seg, sec:null, benchmark:legBench.sec, benchmarkSource:legBench.source, basis:"benchmark-only" };
  }
  // transition
  const transBench = transitionBenchmarkSec();
  const cands=transitionCandidates();
  if(cands.length){
    const top=cands[0]; const ageDays=daysBetween(top.date, todayISO());
    return { ...seg, sec:top.sec, date:top.date, ageDays, isFresh: ageDays<=STATION_STALE_DAYS, source:top.source,
      benchmark: transBench.sec, benchmarkSource:transBench.source, basis: ageDays<=STATION_STALE_DAYS?"actual":"actual-stale" };
  }
  return { ...seg, sec:null, benchmark: transBench.sec, benchmarkSource:transBench.source, basis:"benchmark-only" };
}

// V3 (요구사항 §5): 호출 상황에 따라 base/exact division을 암묵적으로 고르던 구조를 제거.
// 이제 mode를 명시한다.
//   buildRaceSegmentModel({ mode:"hpi" })                        -> Base Division (Open/Pro/Mixed)
//   buildRaceSegmentModel({ mode:"race", division:"Pro Doubles" }) -> Exact Race Division
// 인자를 생략하면 현재 활성 context를 따른다 (context가 없으면 hpi = 기존 동작 그대로).
// 두 모드 모두 §12의 추적 필드(exactDivision/baseDivision/sourceDivision/sourceDate/
// freshnessDays/freshnessWeight/basis/rawTime/adjustedTime/finalTime)를 반환한다.
function buildRaceSegmentModel(opts){
  const run=(ctx)=>{
    if(ctx.mode==="race") return buildRaceSegmentModelV3(ctx);
    const segments = SEGMENT_LIST.map(seg=>enrichLegacySegment(resolveSegment(seg), ctx));
    const withActual = segments.filter(s=>s.basis && s.basis.startsWith("actual"));
    const dataCoverage = withActual.length / segments.length;
    let total=0;
    segments.forEach(s=>{ total += (s.sec!=null ? s.sec : s.benchmark); });
    return { mode:"hpi", exactDivision:ctx.exactDivision, baseDivision:ctx.baseDivision,
      segments, total, dataCoverage, segmentCount:segments.length, actualCount:withActual.length,
      exactDivisionCoverage:0, meanFreshness:0,
      sourceDivisions:[...new Set(segments.map(s=>s.sourceDivision))] };
  };
  if(opts && (opts.mode || opts.division)){
    return withPredictionContext({ mode:opts.mode||"hpi", division:opts.division }, ()=>run(activePredictionContext()));
  }
  return run(activePredictionContext());
}

// only trusted as the primary "current estimate" anchor once at least half the 17 segments are
// backed by real data — below that, getBaselineTime() falls through to its existing behavior.

/* ---------------------------------------------------------------------- */
/* 5c. PREDICTION ATTRIBUTION — "왜 예상 기록이 바뀌었는가", 지수별로 분해   */
/*     Compares the two most recent HPI snapshots and converts each        */
/*     index's score change into a seconds-equivalent, using the same      */
/*     weights/k the prediction engine itself uses — so the breakdown      */
/*     always sums to the actual predicted-time change (no hidden terms).  */
/* ---------------------------------------------------------------------- */

// V3 (spec §35): breaks the index-level attribution above down further into individual segments
// (Running/Sled Push/Wall Ball/Transition...) instead of stopping at "Running Index" / "Strength
// Endurance Index". No new totals are invented — each index's timeImpact is split across ITS OWN
// segments (via segmentIndexKey(), same mapping used by §5 Target Gap Decomposition and §9 Training
// Priority) in proportion to each segment's Realistic improvement potential, so the segment-level
// breakdown always sums to exactly the same total as the index-level one. Indices with no matching
// segments (or where segment weights are all zero) are kept at index level rather than fabricating a split.

/* ---------------------------------------------------------------------- */
/* 5d. A / B / C GOAL SCENARIOS — Challenge / Realistic / Safe             */
/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/* 5e. GOAL PLAN — target time vs current, decomposed by priority          */
/*     (impact × improvability), NOT proportionally split across splits.   */
/*     Reuses the already-tested prediction/priority/scenario engines      */
/*     rather than inventing a parallel calculation path.                  */
/* ---------------------------------------------------------------------- */
function computeGoalPlan(){
  const targetSec=parseTimeToSec(STATE.profile.targetTime);
  if(!targetSec) return null;
  const goalDivForPlan = normalizeRaceDivision(STATE.profile.goalDivision) || "Open Doubles";
  const raceOnly = withPredictionContext({mode:"race", division:goalDivForPlan}, ()=>raceOnlyPrediction(goalDivForPlan));
  const currentSec=Number(raceOnly?.predicted);
  if(!Number.isFinite(currentSec)) return null;
  const totalGapSec=currentSec-targetSec;
  let decomposition={run:totalGapSec*0.5,station:totalGapSec*0.4,roxzone:totalGapSec*0.1};
  try{
    const segs=(raceOnly.baseline?.segmentEstimate?.segments||raceOnly.segments||[]).filter(x=>x&&Number(x.currentSec)>0);
    if(segs.length){
      const sumByType=types=>segs.filter(x=>types.includes(x.type)).reduce((a,x)=>a+Number(x.currentSec||0),0);
      const run=sumByType(["run"]), station=sumByType(["station"]), roxzone=sumByType(["transition","roxzone"]);
      const denom=run+station+roxzone;
      if(denom>0) decomposition={run:totalGapSec*(run/denom),station:totalGapSec*(station/denom),roxzone:totalGapSec*(roxzone/denom)};
    }
  }catch(e){}
  const confInfo=typeof calcPredictionConfidence==='function' ? calcPredictionConfidence() : {confidence:0.5,label:"MEDIUM",missing:[]};
  let probability=totalGapSec<=0?95:totalGapSec<=30?65:totalGapSec<=120?40:15;
  const confidence=Number.isFinite(confInfo.confidence)?confInfo.confidence:0.5;
  const probLow=clamp(probability-Math.round((1-confidence)*25),3,95);
  const probHigh=clamp(probability+Math.round((1-confidence)*25),3,95);
  const feasibility=totalGapSec<=0?"already-met":totalGapSec<=30?"realistic":totalGapSec<=120?"challenge":"unrealistic";
  return {targetSec,currentSec,totalGapSec,decomposition,segmentGap:null,probability,probLow,probHigh,feasibility,
    milestones:[],weeksToRace:daysToRace()!=null?Math.max(0,daysToRace()/7):null,priorityTop3:[],
    baselineSource:`Race-only Performance (${goalDivForPlan})`,confidence:confidence,confidenceLabel:confInfo.label||"MEDIUM",missingData:confInfo.missing||[],
    milestoneDivision:goalDivForPlan,goalAwareDebug:{path:"race-only-goal",division:goalDivForPlan,source:`Race-only Performance (${goalDivForPlan})`}};
}


/* ---------------------------------------------------------------------- */
/* 5a. TRAINING PRIORITY ENGINE                                            */
/*     Training data feeds BOTH the race prediction (already wired into    */
/*     the HPI/prediction engines above) AND next-training-direction        */
/*     decisions here. Priority is NOT "whichever index scores lowest" —    */
/*     it's Impact(race-time weight) × Improvability(headroom), so a index  */
/*     that's already 90+ never gets over-prioritized just because it's     */
/*     numerically the smallest gap to another 90+ index.                  */
/* ---------------------------------------------------------------------- */
// within ONE race: how much did each station's fatigue carry into the run right after it,
// relative to that race's own average run pace (the "general" baseline for that day)?
const STATION_RUN_MAP = {
  ski:{before:1,after:2}, sledPush:{before:2,after:3}, sledPull:{before:3,after:4}, burpee:{before:4,after:5},
  row:{before:5,after:6}, carry:{before:6,after:7}, lunge:{before:7,after:8}, wallball:{before:8,after:null},
};
function computeStationInducedDegradation(race){
  if(!race) return [];
  const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
  const avgRun=mean(runsSec.filter(v=>v!=null));
  if(!avgRun) return [];
  const out=[];
  STATIONS.forEach(s=>{
    const map=STATION_RUN_MAP[s.key];
    if(map.after==null) return; // Wall Ball finishes the race, no run after it
    const afterSec=runsSec[map.after-1];
    if(afterSec!=null) out.push({ key:s.key, label:s.label, afterRunSec:afterSec, baselineSec:avgRun, degradationSec: afterSec-avgRun });
  });
  return out.sort((a,b)=>b.degradationSec-a.degradationSec);
}

/* ---------------------------------------------------------------------- */
/* 5a-3. V3 — RACE EXECUTION DIAGNOSIS (spec §16)                          */
/*     Run1→Run8 slowing down does NOT automatically mean "부족한 러닝     */
/*     체력" — it could be station-induced fatigue carrying into the next  */
/*     run, or a pure pacing problem (starting too fast). This checks how   */
/*     much of the measured Run1→Run8 fade the measured post-station        */
/*     slowdowns (computeStationInducedDegradation) actually account for,   */
/*     rather than asserting a cause without evidence.                      */
/* ---------------------------------------------------------------------- */
function analyzeRaceExecution(race){
  race = race || latestRace();
  if(!race) return null;
  const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
  const first=runsSec[0], last=runsSec[7];
  if(first==null || last==null) return null;
  const fadeSec=last-first;
  const fadePct=(fadeSec/first)*100;
  const degradation=computeStationInducedDegradation(race);
  const explainedSec=degradation.reduce((s,d)=>s+Math.max(0,d.degradationSec),0);
  // spec fix (verify math before claiming causation): fadeSec (Run1→Run8, a TWO-POINT endpoint
  // difference) and explainedSec (a SUM of seven independent post-station-vs-race-average deviations)
  // are not the same kind of quantity — explainedSec can legitimately exceed fadeSec (e.g. a bad
  // mid-race station effect that the athlete partly recovers from by Run8). A raw ratio above 1 is
  // NOT evidence that "station effects explain more than 100% of the fade"; it means the two numbers
  // aren't directly comparable that race, so the claim must be softened rather than clamped-and-hidden.
  const explainedRatioRaw = fadeSec>0 ? explainedSec/fadeSec : null;
  const explainedRatio = explainedRatioRaw!=null ? clamp(explainedRatioRaw,0,1) : null; // for the "설명 비율" itself, cap at 100% — never claim >100%
  let diagnosis;
  if(fadeSec<=0){
    diagnosis={ key:"good", label:"Pacing 양호", detail:"Run1 대비 Run8이 느려지지 않았습니다." };
  } else if(explainedRatioRaw!=null && explainedRatioRaw>1.05){
    // sum of individual post-station slowdowns clearly exceeds the net first-to-last difference —
    // don't claim it "explains" the fade; say what actually happened instead (localized, partly-recovered).
    diagnosis={ key:"station-uneven", label:"Station 영향이 구간마다 회복됨",
      detail:`개별 스테이션 직후 저하 합(${fmtTime(explainedSec)})이 Run1→Run8 순 차이(${fmtTime(fadeSec)})보다 큽니다 — 특정 스테이션 이후 크게 느려졌다가 이후 구간에서 페이스를 일부 회복했다는 뜻이며, "전체 저하의 대부분을 설명한다"고 단정할 수는 없습니다. 어떤 스테이션이 반복적으로 영향을 주는지는 여러 대회 데이터로 판단하는 것이 더 정확합니다.` };
  } else if(explainedRatio!=null && explainedRatio>=0.7){
    diagnosis={ key:"station", label:"Station-induced Fatigue가 주요 원인",
      detail:`측정된 스테이션 이후 Run 저하분(${fmtTime(explainedSec)})이 전체 페이스 저하(${fmtTime(fadeSec)})의 약 ${round1(explainedRatio*100)}%를 차지합니다 — 러닝 체력 부족보다 스테이션→러닝 전환 능력이 핵심일 가능성이 있습니다 (단일 대회 관찰값이므로 여러 대회에서 반복되는지 함께 확인하세요).` };
  } else if(explainedRatio!=null && explainedRatio>=0.3){
    diagnosis={ key:"mixed", label:"Station 영향 + Pacing 혼합",
      detail:"측정된 스테이션 저하만으로는 전체 페이스 저하를 다 설명하지 못합니다 — 초반 오버페이스 가능성도 함께 점검해보세요." };
  } else {
    diagnosis={ key:"pacing", label:"Pacing 문제 가능성",

/* ---------------------------------------------------------------------- */
/* 5a-3b. STATION → RUN FATIGUE ACROSS ALL RACES (DNA §3/§4/§5/§6)         */
/*     Reuses computeStationInducedDegradation(race) — UNCHANGED — once     */
/*     per registered race, then aggregates into a per-station history so    */
/*     a single noisy race can no longer be read as "the athlete's DNA".     */
/*     Repetition (not just the latest race) is the whole point: a pattern   */
/*     that shows up in every race is a real characteristic; one that shows  */
/*     up once might just be that day's bad transition.                     */
/* ---------------------------------------------------------------------- */
const STATION_RUN_DEGRADATION_NOISE_FLOOR_SEC = 3; // a few seconds of timing/rounding noise never counts as "an occurrence"
// 반복성 판정 기준 (요청 사양):
//   발생비율 <40%        → ⚪ 일시적          (우연/개별 대회 가능성)
//   발생비율 40~59%      → 🟡 관찰            (반복 가능성 있음)
//   발생비율 ≥60%        → 🟢 반복 패턴       (여러 대회에서 반복적으로 나타남)
//   발생비율 ≥80%        → 🔴 강한 반복 패턴  (매우 일관되게 나타남)
// 표본이 4개 미만일 때는 "강한 반복"을 비율만으로 인정하지 않는다 — 실제 발생 횟수가 3회 이상일
// 때만 강한 반복으로 인정한다 (예: 2/2=100%이어도 관측이 2번뿐이면 "매우 일관"이라고 부르기엔
// 근거가 약하므로 한 단계 아래(반복 패턴)로 유지).
function classifyStationRunPattern(occurrences, totalMeasured){
  if(totalMeasured<2) return { key:"insufficient", label:"데이터 1건 — 반복 여부 판단 불가", emoji:"⚪", shortLabel:"—", circle:"⚪", meaning:"" };
  const ratio = occurrences/totalMeasured;
  let key;
  if(ratio>=0.8-1e-9) key="strong";
  else if(ratio>=0.6-1e-9) key="repeated";
  else if(ratio>=0.4-1e-9) key="frequent";
  else key="occasional";
  if(key==="strong" && totalMeasured<4 && occurrences<3) key="repeated"; // 표본<4는 실발생 3회 이상이어야 강한 반복
  const META = {
    occasional: { label:"일시적인 패턴", shortLabel:"일시적", emoji:"⚪", circle:"⚪", meaning:"우연/개별 대회 가능성" },
    frequent:   { label:"관찰이 필요한 패턴", shortLabel:"관찰", emoji:"🟡", circle:"🟡", meaning:"반복 가능성 있음" },
    repeated:   { label:"반복적으로 나타나는 패턴", shortLabel:"반복 패턴", emoji:"🟢", circle:"🟢", meaning:"여러 대회에서 반복적으로 나타남" },
    strong:     { label:"매우 일관되게 나타나는 패턴", shortLabel:"강한 반복 패턴", emoji:"🔴", circle:"🔴", meaning:"매우 일관되게 나타남" },
  };
  return { key, ...META[key] };
}
function computeStationRunDegradationAllRaces(){
  const races=[...STATE.races].filter(r=>r&&r.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!races.length) return null;
  const perRace = races.map(race=>({
    race, label: race.name || dnaEvoDateLabel(race.date), date: race.date,
    degradation: computeStationInducedDegradation(race), // reused verbatim, one race at a time
    execution: analyzeRaceExecution(race), // reused verbatim — already fixed above (no overclaiming)
  })).filter(p=>p.degradation.length>0);
  if(!perRace.length) return null;

  const stations = STATIONS.filter(s=>STATION_RUN_MAP[s.key].after!=null); // every station except Wall Ball (finishes the race)
  const perStation = stations.map(s=>{
    const series = perRace.map(p=>{
      const d = p.degradation.find(x=>x.key===s.key);
      return d ? { label:p.label, date:p.date, degradationSec:d.degradationSec, afterRunSec:d.afterRunSec, baselineSec:d.baselineSec } : null;
    });
    const measured = series.filter(Boolean);
    if(!measured.length) return null;
    const occurrences = measured.filter(m=>m.degradationSec>STATION_RUN_DEGRADATION_NOISE_FLOOR_SEC);
    const occurrenceRatio = occurrences.length/measured.length;
    const avgDegradationSec = mean(measured.map(m=>m.degradationSec));
    const avgOccurrenceDegradationSec = occurrences.length? mean(occurrences.map(m=>m.degradationSec)) : 0;
    const latest = measured[measured.length-1];
    const pattern = classifyStationRunPattern(occurrences.length, measured.length);
    return {
      key:s.key, label:s.label, series, measured, occurrences: occurrences.length, totalMeasured: measured.length,
      occurrenceRatio, avgDegradationSec, avgOccurrenceDegradationSec, latest, pattern,
    };
  }).filter(Boolean).sort((a,b)=>b.latest.degradationSec-a.latest.degradationSec);

  // aggregate diagnosis distribution across races (spec §6 — reuses analyzeRaceExecution() per race,
  // no new causal model; just summarizes how often each diagnosis showed up across the athlete's races)
  const diagnosisCounts={};
  perRace.forEach(p=>{ if(p.execution){ const k=p.execution.diagnosis.key; diagnosisCounts[k]=(diagnosisCounts[k]||0)+1; } });

  return { races: perRace, perStation, raceCount: perRace.length, diagnosisCounts };
}

// Loose validation: a usable row needs at minimum gender + division to be filterable into any
// comparison group. Everything else (individual segment times) can be partially missing — a row
// missing wallball but present for everything else still contributes to every OTHER segment's n.
// doc11 (포디움 기준 데이터 연결 오류): EXTERNAL_RACE_DB[].age_group previously carried whatever raw
// string format the source export used, completely unnormalized, then computePodiumComparisonGroup()
// compares it with EXACT string equality against getAgeGroup(userAge)'s own canonical output
// ("18-24".."60+"). Any cosmetic difference — stray whitespace ("30 - 34"), an en-dash instead of a
// hyphen ("30–34"), or a gender/"AG" prefix some exports include ("F30-34", "AG 30-34") — silently
// failed that comparison and produced "insufficient data" even when abundant real rows existed for
// that exact age group. This only cleans formatting noise; it never re-buckets a genuinely different
// band (a real 10-year "30-39" stays "30-39", it is NOT coerced into "30-34" — doc11 §10 explicitly
// forbids merging different bands to inflate sample size).
function normalizeAgeGroupLabel(raw){
  if(raw==null) return null;
  let s=String(raw).trim();

  s=s.replace(/[–—]/g,"-");                                   // en/em dash -> hyphen
  s=s.replace(/^(AG|Age\s*Group)\s*[:\-]?\s*/i,"");            // strip "AG "/"Age Group:" prefixes
  s=s.replace(/^[FMW]\s*[:\-]?\s*(?=\d)/i,"");                 // strip a leading gender-letter prefix (e.g. "F30-34")
  s=s.trim();

/* ----------------------------------------------------------------------
 * RAW vs ANALYSIS-VALID separation (요청: "RAW DATA와 ANALYSIS DATA 분리")
 * ----------------------------------------------------------------------
 * RAW hyrox_results (Supabase) is NEVER edited or filtered here — a row like total_time="0:08:02"
 * stays in the raw table forever exactly as-is, because it may be a genuine official result. This
 * function only decides whether a given (already-normalized) row is fit to feed DNA/Podium/Peer/
 * Benchmark/Race-Prediction analysis. It intentionally does NOT apply an arbitrary "total_time < XX"
 * cutoff (explicitly requested not to) — it only flags rows that are structurally impossible to be a
 * real HYROX finish (zero/negative/missing time), which is a data-integrity check, not a performance
 * judgment. Anything not caught by an explicit rule below is left analysis_valid=true; a stricter,
 * evidence-based rule (e.g. cross-checking total_time against the sum of that row's own run+station

 * this function is the single seam every analysis consumer (filterExternalRaceDb /

function classifyAnalysisValidity(overallTimeSec, r){
  if(overallTimeSec==null) return { valid:false, reason:"MISSING_REQUIRED_DATA" }; // total_time missing/unparseable
  if(overallTimeSec<=0) return { valid:false, reason:"ZERO_TIME" }; // 00:00:00 등
  // Cross-check against the row's own splits, ONLY when enough of them exist to be meaningful — this is
  // evidence from the row itself, not an invented global threshold, so it stays inside the "no arbitrary
  // threshold" rule while still catching cases like the observed 0:08:02 (a real official field that is
  // far shorter than the athlete's own recorded segments could add up to).
  const segs=[r.run_1,r.run_2,r.run_3,r.run_4,r.run_5,r.run_6,r.run_7,r.run_8,
    r.ski,r.sled_push,r.sled_pull,r.burpee,r.row,r.carry,r.lunge,r.wallball,r.transition].filter(v=>v!=null);
  if(segs.length>=8){ // need a reasonably complete split set before trusting a sum-comparison

async function fetchSiteJson(candidates){
  for(const path of candidates){
    try{
      const url=new URL(path, document.baseURI).href + (path.includes("?")?"&":"?") + "v=" + Date.now();
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok) continue;
      const data=await res.json();
      return {path,data};
    }catch(e){ /* try next candidate */ }
  }
  return null;
}

async function fetchAllHyroxResultsFromSupabase(){
  const rows=[];

  const hardPageCeiling = 2000; // safety valve only (2000*1000=2M rows) — never expected to trigger
  for(let page=0; page<hardPageCeiling; page++){
    const to = from + EXTERNAL_RACE_DB_PAGE_SIZE - 1;
    const { data, error } = await sb.from("hyrox_results").select("*").order("id",{ascending:true}).range(from,to);
    if(error) throw error;
    if(!data || !data.length) break;
    rows.push(...data);
    if(data.length < EXTERNAL_RACE_DB_PAGE_SIZE) break; // last page reached
    from += EXTERNAL_RACE_DB_PAGE_SIZE;

// (underscore) for individual run legs, but every caller in this file (PEER_SEGMENTS, SEGMENT_LIST,
// runLegBenchmarkSec/"run"+runIdx) uses "run1".."run8" (no underscore). That mismatch meant EVERY
// per-run-leg lookup against the real ASIA/Global derived benchmark silently failed and fell straight
// through to STATIC_FALLBACK — for every user, no matter how much real Run-leg data existed — which is
// almost certainly the actual root cause behind the recurring "Run 1-8 percentile" issues in this

function peerDbFilterCacheKey(group){

function filterExternalRaceDb(group){

    // set here, never the full participant row array.
    for(const [key,rows] of idx){

// Single seam function: given a segment definition + the athlete's comparison group, return

// pass, spec ①/⑪/⑫/⑮/⑯) — the EXACT SAME queryDerivedBenchmark()/ASIA->...->GLOBAL_MATRIX chain
// Prediction and Station Priority already use, keyed on the athlete's own Division+Gender+AgeBand, so
// DNA never silently disagrees with Prediction about which benchmark source applies. Only when NO row

function mixedAthleteGenderFactor(gender){

function queryPeerSegmentStats(seg, group){
  const { gender, ageGroup, division } = group;
  const statsCacheKey = `${peerDbFilterCacheKey(group)}|${seg.key}|${group.mixedPersonalMode===true?'personal':''}|${group.mixedSharePct??''}|${group.athleteGender??''}`;
  if(_peerSegmentStatsCache.has(statsCacheKey)) return _peerSegmentStatsCache.get(statsCacheKey);
  const finishStats = value => { _peerSegmentStatsCache.set(statsCacheKey, value); return value; };
  const mixedPersonalMode = normalizeRaceDivision(division)==="Mixed Doubles" &&
    seg.kind==="station" && group.mixedPersonalMode===true && !!group.athleteGender;
  // Personal-share fraction actually worked by the athlete on this station (e.g. 0.3 for a 30% share).
  // Falls back to an even 50/50 split only if the caller didn't supply the real share — but every
  // current caller does supply it whenever mixedPersonalMode is true, so this is a defensive default,
  // not the expected path. Without this, comparing a share-adjusted actual time against a benchmark
  // that always assumes a 50% split made any share below 50% look artificially great (and any share
  // above 50% look artificially bad), regardless of true fitness.
  const mixedShare = mixedPersonalMode ? clamp(Number(group.mixedSharePct ?? 0.5), 0.05, 0.95) : 0.5;

  // Newly uploaded official HYROX results are the first real-data source for Race DNA.
  // Once the exact gender/age-group/division segment has >= MIN_REAL_SAMPLE rows,
  // the uploaded participant distribution takes priority over the pre-aggregated Asia/Global
  // benchmark. This means adding a new race CSV can actually change the DNA percentile/impact.
  const matched = filterExternalRaceDb(group);
  const field = segmentDbField(seg);
  // Supabase/CSV payloads can contain numeric-looking strings. DNA math must never let
  // one non-numeric value turn the SD/Z-score into NaN while the mean still renders.
  const realValues = matched.map(r=>Number(r[field])).filter(v=>Number.isFinite(v) && v>0);

    let realMean=mean(realValues);
    const variance=mean(realValues.map(v=>(v-realMean)*(v-realMean)));
    let realSd = (Number.isFinite(variance) && variance>0)
      ? Math.sqrt(variance)
      : (Number.isFinite(realMean) && realMean>0 ? realMean*SD_PCT[seg.kind] : null);

  // ASIA -> ... -> GLOBAL derived benchmark fallback exactly as before.
