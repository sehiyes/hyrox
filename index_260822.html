<html lang="ko" style="background:#0A0A0B;">
<head>
<meta charset="UTF-8">

<script>
  // HPS build cache-buster.
  // A new build version forces Safari/GitHub Pages to request this HTML again.
  (function(){
    var HPS_BUILD_VERSION = "20260820-division-fix-02";
    try {
      var url = new URL(window.location.href);
      if (url.searchParams.get("hpsv") !== HPS_BUILD_VERSION) {
        url.searchParams.set("hpsv", HPS_BUILD_VERSION);
        window.location.replace(url.toString());
      }
    } catch (e) {}

<title>HPS — HYROX Performance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --surface:#141416; --surface2:#1C1C1F; --surface3:#232326;
  --line:#28282C; --orange:#FF5A1F; --orange-dim:#C2450F; --orange-glow:rgba(255,90,31,.16);
  --white:#F5F4F1; --gray:#9497A0; --gray-dim:#5C5E66;
  --green:#33D17A; --red:#FF4D4D; --amber:#FFB020;
  --crit:#FF4D4D; --high:#FF9A3D; --med:#FFB020; --low:#5C8CFF;
  --font-display:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{margin:0;padding:0;background:var(--bg) !important;color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
::selection{background:var(--orange-glow);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh; background:var(--bg);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.brand-mark{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.5px; color:var(--white); display:flex; align-items:center; gap:8px;}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange);}
.brand-sub{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; margin-top:4px; text-transform:uppercase;}
.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-group-label{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; text-transform:uppercase; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--gray); font-weight:500; transition:background .15s, color .15s; user-select:none;
}
.nav-item:hover{background:var(--surface2); color:var(--white);}
.nav-item.active{background:var(--orange-glow); color:var(--orange); font-weight:600;}
.nav-item .n-ico{width:16px; text-align:center; font-size:13px; opacity:.9;}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--gray-dim); font-family:var(--font-mono); line-height:1.6;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:56px 34px 60px; background:var(--bg);}
.page{display:none; flex-direction:column; gap:18px; max-width:1180px; overflow-x:hidden;}
.page.active{display:flex;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:600;}
.eyebrow.gray{color:var(--gray-dim);}
h1.page-title{font-family:var(--font-display); font-size:32px; font-weight:800; margin:2px 0 0; letter-spacing:.3px;}
h2.section-title{font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; letter-spacing:.3px;}
p.lead{font-size:12.5px; color:var(--gray); margin:0; line-height:1.6; max-width:640px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; min-width:0;}
.card.tight{padding:14px 16px;}
.grid{display:grid; gap:14px; min-width:0;}
.grid > *{min-width:0;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11.5px; color:var(--gray); font-weight:600;}
input,select,textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--white);
  padding:9px 10px; font-size:13px; font-family:var(--font-body); outline:none; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange-dim);}
input[type=date]{font-family:var(--font-mono); color-scheme:dark;}
input[type=checkbox]{width:auto;}
textarea{resize:vertical; min-height:60px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; background:var(--orange); color:#100; border:none;
  border-radius:9px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--surface3); color:var(--white); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--gray); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--red); border:1px solid rgba(255,77,77,.35);}
.btn.sm{padding:6px 11px; font-size:11.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--gray-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--white);}
tr:last-child td{border-bottom:none;}
td.num, th.num{font-family:var(--font-mono); text-align:right;}

.badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.badge.crit{background:rgba(255,77,77,.14); color:var(--crit);}
.badge.high{background:rgba(255,154,61,.14); color:var(--high);}
.badge.med{background:rgba(255,176,32,.14); color:var(--med);}
.badge.low{background:rgba(92,140,255,.14); color:var(--low);}
.badge.elite{background:rgba(51,209,122,.16); color:var(--green);}
.badge.phase-base{background:rgba(148,151,160,.14); color:var(--gray);}
.badge.phase-build{background:rgba(255,176,32,.14); color:var(--amber);}
.badge.phase-peak{background:var(--orange-glow); color:var(--orange);}
.badge.phase-taper{background:rgba(51,209,122,.14); color:var(--green);}

.bar-track{flex:1; height:6px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.stat-num{font-family:var(--font-mono); font-weight:700;}
.mono{font-family:var(--font-mono);}
.empty-note{font-size:12.5px; color:var(--gray-dim); text-align:center; padding:22px 10px; border:1px dashed var(--line); border-radius:10px;}
.divider{height:1px; background:var(--line); margin:4px 0;}
.hstack{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.chip{font-family:var(--font-mono); font-size:10.5px; padding:4px 9px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); color:var(--gray); cursor:pointer;}
.chip.on{background:var(--orange-glow); color:var(--orange); border-color:transparent;}
.list-remove{cursor:pointer; color:var(--gray-dim); font-size:14px;}
.list-remove:hover{color:var(--red);}
.reason-line{font-size:11.5px; color:var(--gray); font-family:var(--font-mono); line-height:1.6;}
.rule-id{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim);}
::placeholder{color:var(--gray-dim);}

.toast{position:fixed; bottom:20px; right:24px; background:var(--surface3); border:1px solid var(--line); border-left:3px solid var(--orange); padding:11px 16px; border-radius:9px; font-size:12.5px; z-index:999; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;}
.toast.show{opacity:1; transform:translateY(0);}

/* ---------- DATA STATUS / COACH LEVEL / MODAL (no-data-required layer) ---------- */
.status-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:10px;}
.status-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--gray);}
.status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.status-dot.on{background:var(--green); box-shadow:0 0 6px rgba(51,209,122,.5);}
.status-dot.off{background:var(--gray-dim);}
.coach-level-badge{font-family:var(--font-display); font-weight:700; font-size:13px; padding:4px 12px; border-radius:20px; letter-spacing:.3px;}
.coach-level-badge.basic{background:rgba(92,140,255,.14); color:var(--low);}
.coach-level-badge.personal{background:rgba(255,176,32,.14); color:var(--amber);}
.coach-level-badge.advanced{background:var(--orange-glow); color:var(--orange);}
.pz-bar-track{width:100%; height:7px; border-radius:6px; background:var(--surface3); overflow:hidden; margin-top:8px;}
.pz-bar-fill{height:100%; background:linear-gradient(90deg,var(--orange-dim),var(--orange)); border-radius:6px; transition:width .3s;}
.qbtn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:9px; background:var(--surface2); border:1px solid var(--line); color:var(--white); font-size:12.5px; cursor:pointer; user-select:none; transition:background .15s,border-color .15s;}
.qbtn:hover{border-color:var(--gray-dim);}
.qbtn.on{background:var(--orange-glow); color:var(--orange); border-color:transparent; font-weight:700;}
.qbtn-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); z-index:1010; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .18s;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal-panel{width:100%; max-width:520px; max-height:88vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:20px 20px calc(26px + env(safe-area-inset-bottom)); transform:translateY(16px); transition:transform .18s;}
.modal-overlay.show .modal-panel{transform:translateY(0);}
@media (min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-panel{border-radius:16px; margin-bottom:0;}
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-close{cursor:pointer; color:var(--gray); font-size:18px; line-height:1; padding:4px;}
.modal-step-dots{display:flex; gap:5px; margin-bottom:14px;}
.modal-step-dots span{width:20px; height:3px; border-radius:2px; background:var(--line);}
.modal-step-dots span.done{background:var(--orange);}
.data-tier-note{font-size:11.5px; color:var(--gray); background:var(--surface2); border-radius:8px; padding:9px 11px; margin-top:10px; line-height:1.5;}

/* signature race-strip */
.race-strip{display:flex; gap:2px; align-items:flex-end; height:64px; padding:0 2px;}
.race-strip .seg{flex:1; border-radius:3px 3px 1px 1px; position:relative; min-width:4px; transition:height .3s;}
.race-strip .seg.run{background:linear-gradient(180deg, var(--orange), var(--orange-dim));}
.race-strip .seg.station{background:linear-gradient(180deg,#4B7BFF,#2C4FAD);}
.race-strip-labels{display:flex; gap:2px; margin-top:4px;}
.race-strip-labels span{flex:1; text-align:center; font-family:var(--font-mono); font-size:8px; color:var(--gray-dim); min-width:4px;}

.step-chain{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:12px; padding:10px 0;}
.step-item .step-num{width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--orange); flex-shrink:0;}
.step-item .step-line{width:1px; background:var(--line); flex:1; margin:0 auto;}
.step-conn{display:flex; flex-direction:column; align-items:center; width:22px; flex-shrink:0;}
.step-conn .ln{width:1px; flex:1; background:var(--line); min-height:10px;}
.step-body{padding-top:1px;}
.step-q{font-size:11.5px; color:var(--gray-dim); text-transform:uppercase; letter-spacing:.5px; font-family:var(--font-mono);}
.step-a{font-size:13px; color:var(--white); margin-top:2px; font-weight:600;}
.step-conclusion{margin-top:6px; padding:12px 14px; background:var(--orange-glow); border-radius:10px; border-left:3px solid var(--orange);}
.step-conclusion .lbl{font-family:var(--font-mono); font-size:10px; color:var(--orange); letter-spacing:1px; text-transform:uppercase;}
.step-conclusion .val{font-size:14px; font-weight:700; margin-top:3px;}

.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.day-card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:12px 10px; min-height:120px; display:flex; flex-direction:column; gap:6px;}
.day-card .d-name{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1px;}
.day-card .d-type{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.1;}
.day-card .d-desc{font-size:10.5px; color:var(--gray); line-height:1.4; flex:1;}
.day-card .d-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--gray-dim);}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}

.roadmap-track{position:relative; padding-left:2px;}
.phase-block{display:flex; gap:0; margin-bottom:2px; border-radius:8px; overflow:hidden;}
.phase-seg{padding:14px; position:relative;}
.tabs{display:flex; gap:4px; background:var(--surface2); padding:4px; border-radius:10px; width:fit-content; max-width:100%; flex-wrap:wrap;}
.tab{padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; color:var(--gray); cursor:pointer; white-space:nowrap;}
.tab.active{background:var(--orange); color:#100;}

.kv{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--gray-dim);}
.kv .v{font-family:var(--font-mono); font-weight:600;}

.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;}
.account-badge{
  position:fixed; top:14px; right:14px; z-index:1001;
  display:flex; align-items:center; gap:6px;
  background:var(--surface2); border:1px solid var(--line); border-radius:20px;
  padding:8px 14px; font-size:12px; font-weight:600; color:var(--white); cursor:pointer;
  transition:filter .15s;
}
.account-badge:hover{ filter:brightness(1.15); }
.account-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--gray-dim); }
.account-badge.signed-in .dot{ background:var(--green); box-shadow:0 0 6px var(--green); }

@media(max-width:820px){
  #app{flex-direction:column;}
  .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:14px; left:14px; z-index:1001;
    width:40px; height:40px; border-radius:9px;
    background:var(--surface2); border:1px solid var(--line); color:var(--white);
    font-size:18px; cursor:pointer;
  }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw;
    flex-direction:column; overflow-y:auto; z-index:1000;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-overlay{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .sidebar-overlay.show{ opacity:1; pointer-events:auto; }
  .nav{flex-direction:column; overflow-x:visible;}
  .nav-group-label{display:block;}
  .main{padding:64px 18px 92px;}
  /* iOS Safari auto-zooms the whole page when a focused input's font-size is under 16px — this is
     what caused "입력하면 화면이 확대되는" behavior. 16px here (vs 13px on desktop) stops that. */
  input,select,textarea{font-size:16px;}
  .bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:1002;
    background:var(--surface); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(0,0,0,.35);
  }
  .bottom-nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 4px; border-radius:10px; cursor:pointer; user-select:none;
    color:var(--gray-dim); font-family:var(--font-mono); font-size:10.5px; font-weight:600;
  }
  .bottom-nav-item .bn-ico{font-size:19px; line-height:1;}
  .bottom-nav-item.active{ color:var(--orange); }
  .bottom-nav-item.active .bn-ico{ filter:drop-shadow(0 0 6px var(--orange-glow)); }
}
@media(min-width:821px){ .bottom-nav{display:none;} }
@media(max-width:480px){
  .grid-2,.grid-3,.grid-4,.grid-6,.grid-auto{grid-template-columns:1fr;}
  input[type=date]{font-size:13px;}
}
input,select,textarea{min-width:0;}
</style>

<script>
/* ============================================================
   HPS — HYROX Performance System
   Rule-based training engine. No AI calls. Pure deterministic JS.
   ============================================================ */

/* ---------------------------------------------------------------------- */
/* 0. CONSTANTS & REFERENCE DATA                                          */
/* ---------------------------------------------------------------------- */
const STATIONS = [
  { key:"ski",      label:"SkiErg",             unit:"1000m",  group:"engine" },
  { key:"sledPush",  label:"Sled Push",          unit:"50m",    group:"strength" },
  { key:"sledPull",  label:"Sled Pull",          unit:"50m",    group:"strength" },
  { key:"burpee",    label:"Burpee Broad Jump",  unit:"80m",    group:"engine" },
  { key:"row",       label:"Row",                unit:"1000m",  group:"engine" },
  { key:"carry",     label:"Farmer Carry",       unit:"200m",   group:"skill" },
  { key:"lunge",     label:"Sandbag Lunge",      unit:"100m",   group:"strength" },
  { key:"wallball",  label:"Wall Ball",          unit:"100reps",group:"skill" },
];
const RUN_KEYS = [1,2,3,4,5,6,7,8];
const DIVISIONS = ["Open","Pro","Open Doubles","Mixed Doubles","Pro Doubles"];

// Illustrative reference benchmark seconds per division (used only to normalize scores 0-100).
// Doubles: runs are completed together at ~unchanged individual pace, while station reps are
// split between partners. Public race-data analyses report doubles teams finishing ~22% faster
// overall than singles; since running is shared unchanged, that saving is concentrated in the
// station legs — solving for that split implies a ~0.46x station-time factor (worked out against

function fmtTime(totalSec){
  if(totalSec==null||isNaN(totalSec))return "--:--";
  totalSec=Math.round(totalSec);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function parseTimeToSec(str){
  if(str===undefined||str===null||str==="")return null;
  const parts=String(str).split(":").map(Number);
  if(parts.some((p)=>isNaN(p)))return null;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  return Number(parts[0]);
}
function fmtPace(secPerKm){
  if(secPerKm==null||isNaN(secPerKm))return "--:--/km";
  return fmtTime(secPerKm)+"/km";
}

function mean(arr){ arr=arr.filter(v=>v!=null&&!isNaN(v)); return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
// linear-interpolation percentile (0..1), used by the event-based Podium benchmark below — a single
// very fast/slow event never dominates since it's one data point among many events, not a raw row.
function percentileOf(arr, p){
  const a=arr.filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y);
  if(!a.length) return null;
  if(a.length===1) return a[0];
  const idx=(a.length-1)*p;
  const lo=Math.floor(idx), hi=Math.ceil(idx);
  if(lo===hi) return a[lo];
  return a[lo] + (a[hi]-a[lo])*(idx-lo);
}
function medianOf(arr){ return percentileOf(arr, 0.5); }

const LOAD_ELASTICITY = { sledPush:0.82, sledPull:0.85, carry:0.68, lunge:0.58, wallball:0.60 };
function divisionLoadAdjustmentPct(stationKey, sourceIsPro, targetIsPro){
  if(sourceIsPro===targetIsPro) return 0;
  const ratio=LOAD_RATIO_OPEN_TO_PRO[stationKey];
  if(!ratio) return 0;
  const elasticity=LOAD_ELASTICITY[stationKey] ?? 0.7;
  if(!sourceIsPro && targetIsPro) return (ratio-1)*elasticity;   // Open -> Pro: heavier, positive (slower)
  if(sourceIsPro && !targetIsPro) return (1/ratio-1)*elasticity; // Pro -> Open: lighter, negative (faster)
  return 0;
}

const MEM_FALLBACK = {};
let storageWarned = false;
/* BUG FIX — "업로드 이력이 매번 사라짐"
 *
 * window.storage 는 이 앱이 Claude artifact 안에서 실행될 때만 존재하는 API다.
 * GitHub Pages / 자체 호스팅 / file:// 로 열면 window.storage 가 아예 없어서,
 * 아래 두 함수가 전부 MEM_FALLBACK(= 단순 자바스크립트 객체)으로 떨어졌다.
 * MEM_FALLBACK 은 페이지를 새로고침하면 통째로 사라진다.
 *
 * STATE(hps:state:v1)는 로그인 시 Supabase user_data 로 따로 동기화되기 때문에
 * 살아남았지만, 업로드 이력(hps:hyroxUploadLog:v1)은 Supabase 동기화 대상이
 * 아니라서 새로고침 때마다 초기화됐던 것이다.
 *
 * 그래서 localStorage 계층을 중간에 추가한다:
 *   window.storage  (있으면 최우선)  ->  localStorage  ->  MEM_FALLBACK
 * localStorage 는 용량 한도(~5MB)가 있으므로 실패해도 절대 던지지 않고,
 * 그 경우 기존처럼 MEM_FALLBACK 으로 세션 내에서만 유지된다.
 */
const LS_PREFIX = "hps:ls:";
function lsGet(key){
  try{
    if(typeof localStorage==="undefined") return undefined;
    const raw=localStorage.getItem(LS_PREFIX+key);
    return raw==null? undefined : JSON.parse(raw);
  }catch(e){ return undefined; }
}
function lsSet(key, value){
  try{
    if(typeof localStorage==="undefined") return false;
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(value));
    return true;
  }catch(e){
    // QuotaExceededError 등 — EXTERNAL_RACE_DB 처럼 큰 데이터는 여기서 실패할 수 있다.
    // 실패해도 조용히 넘어간다 (MEM_FALLBACK 과 Supabase 동기화가 각각 제 역할을 한다).
    if(!lsSet._warned){ console.warn("localStorage 저장 실패(세션 내 데이터는 유지됩니다):", e?.name||e); lsSet._warned=true; }
    return false;
  }
}
const StorageService = {
  async get(key, fallback){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){ /* key not found or storage unavailable */ }
    if(key in MEM_FALLBACK) return MEM_FALLBACK[key];
    const fromLs = lsGet(key);
    if(fromLs!==undefined){ MEM_FALLBACK[key]=fromLs; return fromLs; }
    return fallback;
  },
  async set(key, value){
    MEM_FALLBACK[key]=value;
    let persisted=false;
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(key, JSON.stringify(value), false);
        persisted=true;
      }
    }catch(e){
      // transient platform-side hiccup — MEM_FALLBACK above already keeps data intact for this session,
      // so this is non-fatal. Log once rather than spamming on every keystroke's debounced autosave.
      if(!storageWarned){ console.warn("자동저장에 일시적 문제가 있습니다 (세션 내 데이터는 유지됩니다):", e?.message||e); storageWarned=true; }
    }
    if(!persisted) lsSet(key, value);
  }
};

async function initSupabaseAuth(){
  if(!sbEnabled() || !window.supabase || !window.supabase.createClient) return;
  // persistSession (default true) is what makes "already logged in on this device" work automatically —
  // Supabase stores the session in localStorage and getSession() below restores it on the next page load.
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, storage: window.localStorage }
  });
  sbStatus = "signedOut";
  sb.auth.onAuthStateChange(async (event, session)=>{
    sbUser = session?.user || null;
    sbStatus = sbUser ? "signedIn" : "signedOut";
    if(sbUser && event==="SIGNED_IN") await pullFromSupabase();
    
    renderAll();
  });
  let { data, error } = await sb.auth.getSession();
  // bug fix (mobile "다시 들어가면 로그인 풀림"): a stored session whose short-lived ACCESS token has
  // expired should be silently refreshed using the long-lived REFRESH token — getSession() is supposed
  // to do this automatically, but on some mobile reloads (e.g. right after the OS resurrects a
  // previously-suspended/backgrounded tab) it can race and come back empty even though a valid refresh
  // token still exists in localStorage. Explicitly retry with refreshSession() once before concluding
  // the person is actually logged out, instead of dropping them to the login screen on a false negative.
  if(!data?.session){
    try{
      const refreshed = await sb.auth.refreshSession();
      if(refreshed?.data?.session) data = refreshed.data;
    }catch(e){ /* genuinely no valid session (real logout / revoked / never logged in) — fall through */ }
  }
  sbUser = data?.session?.user || null;
  sbStatus = sbUser ? "signedIn" : "signedOut";
  if(sbUser) await pullFromSupabase(); // same-device return visit: session restored, pull latest cloud data
  
}

    // (this app's Singles/solo record store) — never merged into it, so nothing in the existing
    // Singles engine (Race DNA, Race-only prediction, Podium) can ever accidentally read a
    // partner's races as if they were the athlete's own. gender/age/division here are the
    // partner's own reported values, used only as reference context — the Doubles Team Division
    // actually used for calculation is chosen by the user on the Doubles tab, independent of
    // either athlete's individual division.
    doublesPartner: null, // null | { id, name, gender, age, division, races:[], simulationTests:[], running:{...} }
    doublesTeam: { division:null, splitPct:{}, splitMode:"default", ageGroup:"" }, // splitPct: {stationKey: myPct 0-100}, empty = 50:50 default
  };
}

function stripLegacyTrainingState(state){
  if(!state || typeof state!=="object") return state;
  // V39 migration: these fields belonged exclusively to the removed training/recovery engine.
  for(const k of ["trainingLog","hpiHistory","predictionHistory","weeklyOverride","boxSchedule","emaState","restingHrLog","bodyMetricsHistory","hr","strength"]){
    delete state[k];
  }
  if(state.profile){
    delete state.profile.fitnessProfile;
    for(const k of ["height","weight","bodyFat","skeletalMuscle","partnerName","availableHoursPerWeek"]){ delete state.profile[k]; }
  }
  if(state.settings){
    delete state.settings.improvementPerHpiPoint;
    delete state.settings.deloadMode;
    delete state.settings.deloadCustomWeeks;
  }
  return state;
}

let STATE = defaultState();
// PHASE 5 STEP 4-C (fix): dev-only flag gating experimental Candidate UI (e.g. the V2 debug card).
// URL query param only — no persistence, no STATE field, so it can never accidentally leak into a
// saved/synced profile or show up for a normal user who didn't explicitly add ?debug=1 to the URL.
let CURRENT_PAGE = "myrecord";

async function loadState(){

  if(saved){

    // deep-merge nested objects so new fields in defaultState are preserved

    }
  }
}
let saveTimer=null;

async function persistNow(){

/* ---------------------------------------------------------------------- */
/* 4. HPI ENGINE  — six explainable 0-100 indices + overall HPI            */
/*    Each metric normalized via scoreLowerBetter / scoreHigherBetter,     */
/*    then combined with documented sub-weights, then combined into HPI    */
/*    with documented top-level weights (INDEX_WEIGHTS).                   */
/* ---------------------------------------------------------------------- */
function bench(){
  const d = currentPredictionDivision();
  return BENCH[d] || BENCH.Open;
}
// BUG FIX (audit item #2): this used to return the single most-recent race across ALL divisions,
// so a fresh race in a DIFFERENT division than the athlete's current profile division could silently
// become "the" baseline for calcHPI()/getBaselineTime()/analyzeBottleneck()/etc. Now scoped to the
// requested division's base category (Open/Pro/Mixed) by default — the athlete's current profile
// division, same as every other division-aware candidate function in this file (runLegCandidates(),
// collectStationCandidates(), transitionCandidates()). An explicit divisionOverride lets callers that
// need a specific OTHER division's latest race (e.g. Division Transition's fromDiv) ask for it directly,
// still going through the same division-base filter rather than reading STATE.races unfiltered.
function latestRace(divisionOverride){
  const targetBase = divisionOverride ? divisionBase(divisionOverride) : null;
  const r=[...STATE.races].filter(r=>!targetBase || divisionBase(r.division)===targetBase).sort((a,b)=>b.date.localeCompare(a.date));
  return r[0]||null;
}
const STATION_STALE_DAYS = 14;
// doc12 긴급 수정: 이전에는 이 값을 기준으로 "최근 Official 기록이 있으면 Simulation 후보를 아예 배제"
// 하는 하드 게이트로 사용했다 (collectStationCandidates/runLegCandidates/transitionCandidates) — 21일
// 이내 공식 기록이 있다는 이유만으로 그보다 더 최근/더 나은 Simulation 신호가 100% 차단되는 문제
// (TEST-04)였다. 이 하드 게이트는 제거되었고 위 세 함수 모두 이제 Simulation을 항상 후보로 추가한 뒤
// recency 정렬로 처리한다. 이 상수는 더 이상 게이트로 쓰이지 않으며 과거 동작 참고용으로만 남겨둔다.
// cardio-driven stations: a measured running-pace trend is a fairly direct signal, so a larger cap applies.
// strength/grip stations: general strength-session volume is a much weaker/indirect proxy (it doesn't
// confirm the SPECIFIC lift or load actually improved), so it's allowed only a small, capped nudge —
// present but deliberately minor, never a substitute for a fresh station test.

// spec (Simulation Division 구분 + this bug report): three distinct base categories — Open/Pro/Mixed.
// BUG FIX: the original version only checked for "Pro" and defaulted everything else (including
// "Mixed Doubles") to "Open" — meaning a Mixed Doubles race/simulation was silently treated as
// equivalent to Open division evidence anywhere this function gates a candidate list. Checking "Mixed"
// FIRST (same precedence pattern already used by deriveBenchmarkGender() elsewhere in this file) fixes
// that without touching anything else. Never invented for missing data — returns null when a division
// string is empty/undefined, which then simply never matches "Open"/"Pro"/"Mixed" and gets excluded
// (conservative: unclassified legacy data is treated as none of the three, not defaulted to Open).
function divisionBase(divisionStr){
  if(!divisionStr) return null;
  const s=String(divisionStr);
  if(s.includes("Mixed")) return "Mixed";
  return s.includes("Pro") ? "Pro" : "Open";
}
// V3: the old mutable `PREDICTION_DIVISION_OVERRIDE` global is GONE. Division is now resolved
// exactly once, at an explicit context boundary (withPredictionContext), and every downstream
// function asks activePredictionContext() instead of guessing from STATE.profile.division.
// These three wrappers are kept only so existing call sites keep working unchanged.
function currentPredictionDivision(){
  const c=activePredictionContext();
  if(c.mode==="race") return c.exactDivision;
  return normalizeRaceDivision(STATE.profile.goalDivision) || "Open Doubles";
}
function currentProfileDivisionBase(){
  return activePredictionContext().baseDivision || "Open";
}
// IMPORTANT CHANGE: this no longer swaps STATE.profile.division. Swapping it silently turned the
// athlete's BASE division (HPI/DNA/physiology) into the selected RACE division — the exact
// base/exact conflation this pass removes. HPI now always stays on the athlete's real division;
// only race evidence + race benchmarks follow the exact selected Division.

/* ====================================================================== */
/* V3 PREDICTION ENGINE — BASE DIVISION / EXACT RACE DIVISION /            */
/*                        FRESHNESS / CAPABILITY / RACE WORKLOAD           */
/*                                                                        */
/* 이 블록은 doc-v3 요구사항의 핵심 구조 변경이다. 조건문 추가가 아니라       */
/* "무엇이 무엇을 결정하는가"를 5개의 독립 개념으로 분리한다.                 */
/*                                                                        */
/*  1) BASE DIVISION   (Open/Pro/Mixed) — HPI/DNA/생리학 모델 전용.         */
/*  2) EXACT RACE DIVISION (5종) — Race Prediction 전용. 절대 축약 금지.     */
/*  3) FRESHNESS       — 기록이 "지금"을 얼마나 대표하는가 (날짜 기반).       */
/*  4) ATHLETE CAPABILITY — Division 중립 공간(= Open Singles 기준)으로      */
/*                      환산된 선수 능력. 모든 기록은 여기로 모인다.          */
/*  5) RACE WORKLOAD   — 선택한 Division의 경기 조건(중량/분담/파트너).       */
/*                                                                        */
/* 예측식:  observed(D)  --÷workload(D)-->  capabilityRef                  */
/*          capabilityRef --×workload(T)-->  predicted(T)                  */
/*                                                                        */
/* 따라서 "Pro Doubles 기록을 Open Doubles 현재값으로 복사"하는 경로는       */
/* 구조적으로 존재할 수 없다. 반대로 "Exact Division 기록이 1년 전이어도      */
/* 무조건 그것으로 고정"되는 경로도 존재하지 않는다 (freshness 가중).         */
/* ====================================================================== */

const RACE_DIVISIONS = ["Open","Pro","Open Doubles","Pro Doubles","Mixed Doubles"];
// capability 정규화 기준 공간. Open Singles = workload 1.0 (룰북상 가장 단순한 기준).
// "Open이 좋다/기준이다"는 뜻이 아니라 단위계일 뿐이다.
const RACE_REF_DIVISION = "Open";

function normalizeRaceDivision(d){
  if(!d) return null;
  const s=String(d).trim();
  const hit=RACE_DIVISIONS.find(x=>x.toLowerCase()===s.toLowerCase());
  if(hit) return hit;
  const t=s.toLowerCase();
  const dbl=t.includes("double");
  if(t.includes("mixed")) return "Mixed Doubles";
  if(t.includes("pro"))  return dbl?"Pro Doubles":"Pro";
  if(t.includes("open")) return dbl?"Open Doubles":"Open";
  return null;
}

/* ---------------------------------------------------------------------- */
/* 5-1. 명시적 PREDICTION CONTEXT (요구사항 §5)                             */
/*   함수 내부에서 STATE.profile.division을 "추측"하거나 divisionBase()로    */
/*   내려가는 경로를 제거한다. Division 해석은 오직 context 경계에서 1회.     */
/*     withPredictionContext({mode:"race", division:"Pro Doubles"}, fn)     */
/*     withPredictionContext({mode:"hpi"}, fn)                              */
/*   스택이 비어 있으면 = 명시 컨텍스트 없음 = HPI 모드(하위호환).            */
/* ---------------------------------------------------------------------- */
const PRED_CTX_STACK = [];
function activePredictionContext(){
  if(PRED_CTX_STACK.length) return PRED_CTX_STACK[PRED_CTX_STACK.length-1];
  const exact = normalizeRaceDivision(STATE.profile.goalDivision) || "Open Doubles";
  return { mode:"hpi", exactDivision:exact, baseDivision:divisionBase(exact)||"Open", implicit:true };
}
function withPredictionContext(opts, fn){
  const mode = (opts && opts.mode==="race") ? "race" : "hpi";
  const exact = normalizeRaceDivision(opts && opts.division)
             || normalizeRaceDivision(STATE.profile.goalDivision) || "Open Doubles";
  // feature (Doubles Team Engine): opts.gender/opts.age let a caller (e.g. computing a Doubles
  // partner's own benchmark fallback) temporarily override WHOSE demographic getSegmentBenchmarkSec()
  // matches against, instead of always reading STATE.profile. Omitted for every existing call site,
  // so getSegmentBenchmarkSec() falls through to STATE.profile exactly as before.
  PRED_CTX_STACK.push({ mode, exactDivision:exact, baseDivision:divisionBase(exact)||"Open", implicit:false,
    gender: opts && opts.gender || null, age: opts && opts.age!=null ? opts.age : null });
  try{ return fn(); } finally { PRED_CTX_STACK.pop(); }
}
// 후보 데이터 필터의 단일 진입점. race 모드 = 정확 일치, hpi 모드 = base 일치.
function ctxAcceptsRecordDivision(recDiv, ctx){
  const c = ctx||activePredictionContext();
  const d = normalizeRaceDivision(recDiv);
  if(c.mode==="race") return d===c.exactDivision;
  return d!=null && divisionBase(d)===c.baseDivision;
}

/* ---------------------------------------------------------------------- */
/* 5-2. RACE WORKLOAD MODEL (요구사항 §10, §11)                             */
/*   "Pro 선수 집단이 빠르다"(population)와 "같은 선수가 Pro 중량을 들면      */
/*   얼마나 느려지는가"(workload)를 완전히 분리한다.                          */
/*   아래 모델은 population 통계를 일절 쓰지 않고, HYROX 룰북의 물리적 사실   */
/*   만으로 구성된다:                                                       */
/*     · repShare    : 이 선수가 실제로 수행하는 station 작업의 비율          */
/*                     (Singles 1.0 / Doubles 0.5 — 파트너와 분담)          */
/*     · proWeights  : Pro 중량 규격 적용 여부 (기존 LOAD_RATIO_OPEN_TO_PRO  */
/*                     × LOAD_ELASTICITY 재사용 — 새 상수 만들지 않음)       */
/*     · doubles     : 파트너 교대에 따른 Roxzone 증가                       */
/*   Run 거리는 모든 Division에서 8×1km로 동일하므로 run workload는 거리가    */
/*   아니라 "누적된 station 부하가 다리에 남긴 피로"로만 달라진다.            */
/* ---------------------------------------------------------------------- */
const RACE_WORKLOAD_SPEC = {
  "Open":          { repShare:1.0, proWeights:false, doubles:false },
  "Pro":           { repShare:1.0, proWeights:true,  doubles:false },
  "Open Doubles":  { repShare:0.5, proWeights:false, doubles:true  },
  "Pro Doubles":   { repShare:0.5, proWeights:true,  doubles:true  },
  "Mixed Doubles": { repShare:0.5, proWeights:false, doubles:true  },
};
// station 부하가 100% 늘면 run leg가 약 10% 느려진다는 결합 계수. Doubles가
// 러닝에서 약간 빨라지고 Pro가 약간 느려지는 유일한 경로 — Division별 고정
// 보정값이 아니라 station workload에서 계산되어 나온다.
const RUN_FATIGUE_COUPLING = 0.10;
// Doubles는 파트너 교대만큼 Roxzone이 늘어난다. 이 파일에 이미 존재하던
// PEER_DIVISION_ADJUST["Open Doubles"].transition(1.05)과 동일한 값을 쓴다.
const DOUBLES_TRANSITION_FACTOR = 1.05;
// 각 파트너는 reps의 절반만 수행하고, 파트너가 일하는 동안 부분 회복한다 —
// 그래서 1인 station 시간은 정확히 절반보다 조금 더 줄어든다. 이 파일에 이미
// 있던 DOUBLES_STATION_FACTOR(0.46)에서 지수를 역산하므로 새 상수가 아니다.
function doublesShareElasticity(){ return Math.log(DOUBLES_STATION_FACTOR)/Math.log(0.5); }
// Mixed Doubles: 중량 규격은 Open이지만 팀 구성이 달라 팀 station/run 시간이
// 달라진다. 이 파일의 기존 BENCH 표(Mixed vs Open Doubles)에서 직접 도출한다.
let _mixedFactorCache=null;
function mixedPartnerFactors(){
  if(_mixedFactorCache) return _mixedFactorCache;
  const md=BENCH["Mixed Doubles"], od=BENCH["Open Doubles"];
  const ratios=STATIONS.map(s=>(md[s.key]&&od[s.key])? md[s.key]/od[s.key] : null).filter(v=>v!=null).sort((a,b)=>a-b);
  const station = ratios.length ? ratios[Math.floor(ratios.length/2)] : 1.07;
  const run = (md.runKm&&od.runKm) ? md.runKm/od.runKm : 1.07;
  _mixedFactorCache={ station, run };
  return _mixedFactorCache;
}
function stationWorkloadMult(division, stationKey){
  const div=normalizeRaceDivision(division)||RACE_REF_DIVISION;
  const spec=RACE_WORKLOAD_SPEC[div]||RACE_WORKLOAD_SPEC[RACE_REF_DIVISION];
  let m=1;
  if(spec.doubles) m*=Math.pow(spec.repShare, doublesShareElasticity());
  if(spec.proWeights) m*=(1+divisionLoadAdjustmentPct(stationKey,false,true));
  if(div==="Mixed Doubles") m*=mixedPartnerFactors().station;
  return m;
}
// 이 Division 전체 station 작업량 지수 (Open Singles=1.0). 시간 가중은 BENCH.Open
// 구성비를 쓴다 — 개인 예측값이 아니라 "구간 비중"으로만 사용.
const _stationLoadCache={};
function stationLoadIndex(division){
  const div=normalizeRaceDivision(division)||RACE_REF_DIVISION;
  if(_stationLoadCache[div]!=null) return _stationLoadCache[div];
  const ref=BENCH[RACE_REF_DIVISION];
  let num=0, den=0;
  STATIONS.forEach(s=>{ const w=ref[s.key]||0; den+=w; num+=w*stationWorkloadMult(div,s.key); });
  const v = den? num/den : 1;
  _stationLoadCache[div]=v;
  return v;
}
function runWorkloadMult(division){
  const div=normalizeRaceDivision(division)||RACE_REF_DIVISION;
  let m = 1 + RUN_FATIGUE_COUPLING*(stationLoadIndex(div)-stationLoadIndex(RACE_REF_DIVISION));
  if(div==="Mixed Doubles") m*=mixedPartnerFactors().run;
  return m;
}
function transitionWorkloadMult(division){
  const div=normalizeRaceDivision(division)||RACE_REF_DIVISION;
  const spec=RACE_WORKLOAD_SPEC[div]||RACE_WORKLOAD_SPEC[RACE_REF_DIVISION];
  let m=1;
  if(spec.doubles) m*=DOUBLES_TRANSITION_FACTOR;
  m *= 1 + RUN_FATIGUE_COUPLING*(stationLoadIndex(div)-stationLoadIndex(RACE_REF_DIVISION));
  if(div==="Mixed Doubles") m*=mixedPartnerFactors().station;
  return m;
}
function segmentWorkloadMult(division, seg){
  if(seg.type==="run") return runWorkloadMult(division);
  if(seg.type==="transition") return transitionWorkloadMult(division);
  return stationWorkloadMult(division, seg.key);
}
// Division 전체 workload 프로파일 — 구간 split이 없는 "총시간만 있는 기록"을
// 환산할 때 사용한다.
const _workloadProfileCache={};
function divisionWorkloadProfile(division){
  const div=normalizeRaceDivision(division)||RACE_REF_DIVISION;
  if(_workloadProfileCache[div]) return _workloadProfileCache[div];
  const ref=BENCH[RACE_REF_DIVISION];
  const runsRef=8*ref.runKm;
  const stationsRef=STATIONS.reduce((s,st)=>s+(ref[st.key]||0),0);
  const transRef=300;
  const runs=runsRef*runWorkloadMult(div);
  const stations=STATIONS.reduce((s,st)=>s+(ref[st.key]||0)*stationWorkloadMult(div,st.key),0);
  const transition=transRef*transitionWorkloadMult(div);
  const p={ division:div, runs, stations, transition, total:runs+stations+transition,
    refTotal:runsRef+stationsRef+transRef };
  p.ratioVsRef = p.total/p.refTotal;
  _workloadProfileCache[div]=p;
  return p;
}
function describeWorkloadModel(division){
  const p=divisionWorkloadProfile(division), spec=RACE_WORKLOAD_SPEC[normalizeRaceDivision(division)]||{};
  return { division:normalizeRaceDivision(division), repShare:spec.repShare, proWeights:!!spec.proWeights,
    doubles:!!spec.doubles, stationLoadIndex:round1(stationLoadIndex(division)*1000)/1000,
    runMult:Math.round(runWorkloadMult(division)*1000)/1000,
    transitionMult:Math.round(transitionWorkloadMult(division)*1000)/1000,
    totalRatioVsOpenSingles:Math.round(p.ratioVsRef*1000)/1000 };
}

/* ---------------------------------------------------------------------- */
/* 5-3. FRESHNESS (요구사항 §7, §8)                                         */
/*   "Exact Division 기록이 있으면 무조건 그것"을 구조적으로 불가능하게 하는  */
/*   장치. 반감기 120일 — 3개월 전 기록은 0.59, 1년 전 기록은 0.12의 발언권.  */
/* ---------------------------------------------------------------------- */
const FRESHNESS_HALFLIFE_DAYS = 120;
function freshnessWeight(days){
  if(days==null || !isFinite(days)) return 0;
  return Math.pow(0.5, Math.max(0,days)/FRESHNESS_HALFLIFE_DAYS);
}
// 데이터 종류별 신뢰도 (공식기록 > 개별테스트 > 시뮬레이션)
const SOURCE_TRUST_V3 = { race:1.0, test:0.8, simulation:0.7 };
// 다른 Division 기록: workload 변환을 거쳤더라도 보조 signal이므로 감쇠한다.
const CROSS_DIVISION_TRUST = 0.6;
// Division 개념 자체가 없는 데이터(Quick Test / 훈련로그). 선수 프로필 Division의
// workload 하에서 측정된 것으로 간주하고 변환한다 — 이 가정은 명시적으로 기록된다.
const NO_DIVISION_TRUST = 0.75;
// 증거 총량이 이보다 낮을 때만 population benchmark가 빈자리를 메운다.
const BENCHMARK_FLOOR_WEIGHT = 0.25;

/* ---------------------------------------------------------------------- */
/* 5-4. EXACT-DIVISION POPULATION BENCHMARK (요구사항 §11)                  */
/*   해당 Division의 실측 population row가 있으면 그대로 쓴다.               */
/*   없으면 다른 Division의 population 표(BENCH.Pro 등)를 빌려오지 않고,     */
/*   기준 Division의 benchmark를 WORKLOAD 모델로 변환해서 만든다.            */
/*   ← 이것이 "Pro Singles가 Open Singles보다 빠르게 나오던" 버그의 근원.     */
/* ---------------------------------------------------------------------- */
function staticRefSegmentSec(seg){
  const ref=BENCH[RACE_REF_DIVISION];
  if(seg.type==="run") return ref.runKm;
  if(seg.type==="transition") return 300;
  return ref[seg.key]!=null? ref[seg.key] : null;
}
function benchmarkForSegmentV3(seg, ctx){
  const div=ctx.exactDivision;
  const ageBand=deriveAgeBand(STATE.profile.age), g=deriveBenchmarkGender();
  const direct=queryDerivedBenchmark(div, g, ageBand, seg.key);
  if(direct && direct.p50) return { sec:direct.p50, source:direct.benchmark_source, derived:true };
  const refRow=queryDerivedBenchmark(RACE_REF_DIVISION, g, ageBand, seg.key);
  const refSec=(refRow && refRow.p50)? refRow.p50 : staticRefSegmentSec(seg);
  if(refSec==null) return { sec:null, source:null, derived:false };
  const scale=segmentWorkloadMult(div,seg)/segmentWorkloadMult(RACE_REF_DIVISION,seg);
  return { sec:refSec*scale, derived:!!(refRow&&refRow.p50),
    source:`${refRow&&refRow.p50?refRow.benchmark_source:"STATIC_FALLBACK"}→workload(${div})` };
}

/* ---------------------------------------------------------------------- */
/* 5-5. SEGMENT CANDIDATE GATHERING (요구사항 §6, §9, §12, §13)             */
/*   모든 후보는 반드시 sourceDivision을 들고 다니고, 반드시                 */
/*   ÷source workload → ×target workload 변환을 거친 뒤에야 합산된다.        */
/*   같은 Division 기록을 그대로 복사하는 경로는 exact일 때 scale=1이 되어    */
/*   자연히 성립할 뿐, 별도 분기가 아니다.                                    */
/* ---------------------------------------------------------------------- */
const MIN_CANDIDATE_WEIGHT = 0.02;
const MAX_CANDIDATES_PER_SEGMENT = 6;

function assumedDivisionForUnlabeled(ctx){
  // Quick Test에는 Division 필드가 없다. 선택된 Race Division workload에서 측정된
  // 개인 테스트로 간주한다. 프로필의 기준 Division은 사용하지 않는다.
  return ctx.exactDivision;
}

function gatherSegmentCandidatesV3(seg, ctx){
  const target=ctx.exactDivision;
  const tgtMult=segmentWorkloadMult(target, seg);
  const out=[];
  const add=(rawSec, date, sourceType, sourceDivisionRaw, note)=>{
    if(rawSec==null || !isFinite(rawSec) || rawSec<=0 || !date) return;
    const srcDiv=normalizeRaceDivision(sourceDivisionRaw);
    const assumed = srcDiv || assumedDivisionForUnlabeled(ctx);
    const srcMult=segmentWorkloadMult(assumed, seg);
    if(!srcMult || !isFinite(srcMult) || srcMult<=0) return;
    const exact = srcDiv===target;
    const capabilityRef = rawSec/srcMult;                 // → Division 중립 능력 공간
    const adjustedTime  = capabilityRef*tgtMult;          // → 선택 Division 조건으로 환산
    const days=daysBetween(date, todayISO());
    if(days<0) return;
    const fw=freshnessWeight(days);
    const divTrust = srcDiv ? (exact?1:CROSS_DIVISION_TRUST) : NO_DIVISION_TRUST;
    out.push({ rawTime:rawSec, capabilityRef, adjustedTime, sourceDate:date, freshnessDays:days,
      freshnessWeight:fw, source:sourceType, sourceDivision:srcDiv, assumedDivision:srcDiv?null:assumed,
      crossDivision: !!srcDiv && !exact, workloadScale: tgtMult/srcMult,
      weight:(SOURCE_TRUST_V3[sourceType]||0.5)*fw*divTrust, note:note||null });
  };

  STATE.races.forEach(r=>{
    if(seg.type==="run")            add(parseTimeToSec(r.runs?.[seg.runIdx]), r.date, "race", r.division);
    else if(seg.type==="station")   add(parseTimeToSec(r.stations?.[seg.key]), r.date, "race", r.division);
    else                            add(parseTimeToSec(r.transition), r.date, "race", r.division);
  });

  (STATE.simulationTests||[]).forEach(t=>{
    if(seg.type==="run"){
      const r=t.runs&&t.runs[seg.runIdx];
      if(r&&r.time&&r.distanceM>0){ const s=parseTimeToSec(r.time); if(s) add((s/r.distanceM)*1000, t.date, "simulation", t.division); }
    } else if(seg.type==="station"){
      const s=t.stations&&t.stations[seg.key];
      const meta=STATIONS.find(x=>x.key===seg.key);
      if(s&&s.time&&s.amount&&meta && String(s.amount).trim().toLowerCase()===String(meta.unit).trim().toLowerCase())
        add(parseTimeToSec(s.time), t.date, "simulation", t.division);
    } else if(t.transition){
      add(parseTimeToSec(t.transition), t.date, "simulation", t.division);
    }
  });

  if(seg.type==="station"){
    (STATE.stationTests||[]).forEach(t=>{
      const v=t.values&&t.values[seg.key];
      if(v) add(parseTimeToSec(v), t.date, "test", null, "Quick Test에는 Division 필드가 없음 — 프로필 Division workload 가정");
    });
  }
  if(seg.type==="run"){
    // Running fallback: use the explicitly entered PB, never a training-log entry.
    // 10K PB is converted to HYROX run pace with the existing conservative +30 sec/km rule.
    const pb10=parseTimeToSec(STATE.running.pb10k);
    if(pb10){
      const runPace=pb10/10 + 30;
      const pseudoDate=todayISO();
      add(runPace, pseudoDate, "pb10k", null, "10K PB + 30초/km");
    }
  }

  out.sort((a,b)=>b.weight-a.weight);
  return out;
}

/* ---------------------------------------------------------------------- */
/* 5-6. SEGMENT RESOLUTION V3 (요구사항 §12 — 14개 추적 필드)               */
/* ---------------------------------------------------------------------- */
function resolveSegmentV3(seg, ctx){
  const all=gatherSegmentCandidatesV3(seg, ctx);
  const used=all.filter(c=>c.weight>=MIN_CANDIDATE_WEIGHT).slice(0, MAX_CANDIDATES_PER_SEGMENT);
  const bm=benchmarkForSegmentV3(seg, ctx);
  const common={ key:seg.key, type:seg.type, label:seg.label, runIdx:seg.runIdx,
    exactDivision:ctx.exactDivision, baseDivision:ctx.baseDivision,
    benchmark:bm.sec, benchmarkSource:bm.source };

  if(!used.length){
    return { ...seg, ...common, source:"benchmark", sourceDivision:ctx.exactDivision, sourceDate:null,
      freshnessDays:null, freshnessWeight:0, basis:"benchmark-only",
      rawTime:null, adjustedTime:null, finalTime:bm.sec, sec:null,
      evidenceWeight:0, candidates:[] };
  }
  const wsum=used.reduce((s,c)=>s+c.weight,0);
  const blended=used.reduce((s,c)=>s+c.adjustedTime*c.weight,0)/wsum;
  // 증거가 얇을 때만 population benchmark가 나머지를 메운다 (§8 F단계).
  const fill = bm.sec!=null ? Math.max(0, BENCHMARK_FLOOR_WEIGHT-wsum) : 0;
  const finalTime = fill>0 ? (blended*wsum + bm.sec*fill)/(wsum+fill) : blended;
  const top=used[0];
  const hasExact=used.some(c=>!c.crossDivision && c.sourceDivision);
  const basis = top.source==="race"
      ? (top.crossDivision ? "cross-division-race-signal" : (top.freshnessDays<=STATION_STALE_DAYS?"actual":"actual-stale"))
      : top.source==="test" ? "actual-quicktest"
      : top.source==="simulation" ? (top.crossDivision?"cross-division-simulation":"simulation")
      : top.source==="pb10k" ? "estimated-10k-pb"
      : "estimated-reference";
  return { ...seg, ...common,
    source:top.source, sourceDivision: top.sourceDivision || `(무표기·${top.assumedDivision} 가정)`,
    sourceIsCrossDivision: !!top.crossDivision,
    sourceDate:top.sourceDate, freshnessDays:top.freshnessDays, freshnessWeight:Math.round(top.freshnessWeight*1000)/1000,
    basis, rawTime:top.rawTime, adjustedTime:top.adjustedTime, finalTime,
    sec: finalTime, isFresh: top.freshnessDays<=STATION_STALE_DAYS,
    hasExactDivisionEvidence:hasExact, crossDivisionOnly:!hasExact,
    evidenceWeight:Math.round((wsum+fill)*1000)/1000, benchmarkFillWeight:Math.round(fill*1000)/1000,
    candidates:used.map(c=>({ source:c.source, sourceDivision:c.sourceDivision||`(무표기·${c.assumedDivision} 가정)`,
      sourceDate:c.sourceDate, freshnessDays:c.freshnessDays, freshnessWeight:Math.round(c.freshnessWeight*1000)/1000,
      rawTime:c.rawTime, adjustedTime:Math.round(c.adjustedTime), workloadScale:Math.round(c.workloadScale*1000)/1000,
      crossDivision:c.crossDivision, weight:Math.round(c.weight*1000)/1000, note:c.note })) };
}

/* ---------------------------------------------------------------------- */
/* 5-7. HPI 모드 segment 메타데이터 보강                                     */
/*   HPI 모드는 기존 resolveSegment()를 그대로 쓴다(§21 기능 보존).          */
/*   다만 §12의 추적 필드를 붙여, 콘솔에서 어느 Division 기록이 들어왔는지    */
/*   즉시 확인할 수 있게 한다.                                               */
/* ---------------------------------------------------------------------- */
function inferSourceDivisionByDate(seg, date, sourceType){
  if(!date) return null;
  const pools = sourceType==="simulation" ? (STATE.simulationTests||[]) : STATE.races;
  const hits = pools.filter(r=>r.date===date).map(r=>normalizeRaceDivision(r.division)).filter(Boolean);
  const uniq=[...new Set(hits)];
  return uniq.length===1 ? uniq[0] : (uniq.length>1 ? `(중복후보: ${uniq.join("|")})` : null);
}
function enrichLegacySegment(s, ctx){
  const days = s.date? daysBetween(s.date, todayISO()) : null;
  const srcDiv = (s.source==="race"||s.source==="simulation") ? inferSourceDivisionByDate(s, s.date, s.source) : null;
  const finalTime = s.sec!=null? s.sec : s.benchmark;
  return { ...s, exactDivision:ctx.exactDivision, baseDivision:ctx.baseDivision,
    sourceDivision: srcDiv || (s.source? `(무표기·${s.source})` : ctx.baseDivision),
    sourceDate:s.date||null, freshnessDays:days, freshnessWeight: days!=null? Math.round(freshnessWeight(days)*1000)/1000 : 0,
    rawTime: s.rawSec!=null? s.rawSec : s.sec, adjustedTime: s.sec, finalTime, mode:"hpi" };
}

/* ---------------------------------------------------------------------- */
/* 5-8. RACE-LEVEL CAPABILITY SOURCES + CURRENT ANCHOR (요구사항 §8)        */
/*   A. Exact Division 최근 공식기록                                        */
/*   B. Exact Division 과거 공식기록   ← A/B는 같은 후보군, freshness로 구분  */
/*   C. 다른 Division 공식기록 (workload 변환 + CROSS_DIVISION_TRUST 감쇠)   */
/*   D. Segment 실측 모델                                                    */
/*   E. Training / Simulation                                               */
/*   F. Population Benchmark (증거 총량이 얇을 때만)                          */
/* ---------------------------------------------------------------------- */

function buildRaceSegmentModelV3(ctx){
  const segments=SEGMENT_LIST.map(seg=>resolveSegmentV3(seg, ctx));
  const withActual=segments.filter(s=>s.basis && s.basis!=="benchmark-only");
  const exactBacked=segments.filter(s=>s.hasExactDivisionEvidence);
  const total=segments.reduce((s,x)=>s+(x.finalTime!=null?x.finalTime:0),0);
  const fresh=withActual.map(s=>s.freshnessWeight).filter(v=>v!=null);
  return { mode:"race", exactDivision:ctx.exactDivision, baseDivision:ctx.baseDivision,
    segments, total, segmentCount:segments.length, actualCount:withActual.length,
    dataCoverage: withActual.length/segments.length,
    exactDivisionCoverage: exactBacked.length/segments.length,
    meanFreshness: fresh.length? fresh.reduce((a,b)=>a+b,0)/fresh.length : 0,
    // REPORTING FIX: 이전에는 "가중치 1위 후보"의 sourceDivision 하나만 노출했다. 그래서
    // exactDivisionCoverage=100%(= 모든 구간에 Exact 근거가 있음)인데도 sourceDivisions에는
    // 더 최근인 타 Division만 찍혀서, 마치 leakage처럼 보이는 오해가 발생했다. 이제 실제로
    // 기여한 모든 Division을 exact/cross로 나눠서 전부 노출한다.
    sourceDivisions: summarizeSegmentSourceDivisions(segments, ctx),
    sourceDivisionsExact: [...new Set(segments.flatMap(sg=>sg.candidates.filter(c=>!c.crossDivision).map(c=>c.sourceDivision)))],
    sourceDivisionsCross:[...new Set(segments.flatMap(sg=>sg.candidates.filter(c=>c.crossDivision).map(c=>c.sourceDivision)))],
    topSourceDivisions:  [...new Set(segments.map(sg=>sg.sourceDivision))],
    leakage: detectSegmentLeakage(segments, ctx) };
}
// 모든 기여 Division을 "이름(exact|cross, 기여 구간 수)" 형태로 요약.
function summarizeSegmentSourceDivisions(segments, ctx){
  const acc={};
  segments.forEach(sg=>(sg.candidates||[]).forEach(c=>{
    const k=String(c.sourceDivision);
    acc[k]=acc[k]||{ division:k, cross:!!c.crossDivision, segments:0 };
    acc[k].segments++;
  }));
  return Object.values(acc).sort((a,b)=>b.segments-a.segments)
    .map(x=>`${x.division}[${x.cross?"cross":"exact"}·${x.segments}구간]`);
}
// 진짜 leakage 정의: 타 Division 기록이 crossDivision 표기 없이, 또는 workload 변환 없이
// (workloadScale===1) 사용된 경우. 표기 + 변환을 모두 거친 cross-division signal은 §9/§13에서
// 명시적으로 허용된 경로이므로 leakage가 아니다.
function detectSegmentLeakage(segments, ctx){
  const bad=[];
  segments.forEach(sg=>(sg.candidates||[]).forEach(c=>{
    if(!RACE_DIVISIONS.includes(String(c.sourceDivision))) return;
    const isOther = c.sourceDivision!==ctx.exactDivision;
    if(isOther && !c.crossDivision) bad.push({ segment:sg.key, sourceDivision:c.sourceDivision, reason:"crossDivision 미표기" });
    // 주의: scale===1 자체는 leakage가 아니다. SkiErg/Row/Burpee는 Pro에서 추가 중량이 없고,
    // Open Doubles와 Pro Doubles는 repShare가 둘 다 0.5이므로 두 Division 간 workloadScale이
    // 정확히 1.0인 것이 물리적으로 옳다. 검사해야 할 것은 "변환을 했는가"가 아니라
    // "기록된 scale이 workload 모델이 산출하는 값과 일치하는가"이다.
    if(isOther && c.crossDivision){
      const expected = segmentWorkloadMult(ctx.exactDivision, sg)/segmentWorkloadMult(c.sourceDivision, sg);
      if(Math.abs((c.workloadScale||0)-Math.round(expected*1000)/1000) > 0.002)
        bad.push({ segment:sg.key, sourceDivision:c.sourceDivision,
          reason:`workload 변환 불일치 (기록=${c.workloadScale}, 모델=${Math.round(expected*1000)/1000})` });
    }
    if(!isOther && c.crossDivision) bad.push({ segment:sg.key, sourceDivision:c.sourceDivision, reason:"exact인데 cross로 표기됨" });
  }));
  return bad;
}

// spec (Simulation -> 17-segment connection): official race/manual-test data ALWAYS wins outright
// when it's fresh (<=STATION_STALE_DAYS, same existing constant used everywhere else in this file —
// no new threshold). Simulation only ever supplements when official data for that specific segment is
// either MISSING or STALE. For zero-simulation users this is a no-op — the simulation forEach loops
// over an empty array, so `out`/candidate list is byte-identical to the pre-existing behavior.
// Division-aware: normal HPI uses the base division; exact race prediction sets
// PREDICTION_DIVISION_OVERRIDE and then ALL race/simulation candidates are filtered by the exact
// selected race Division. This prevents Open/Open Doubles and Pro/Pro Doubles leakage. Quick Test (STATE.stationTests) has no
// Division concept in its data model and is intentionally left unfiltered (out of scope for this
// change — flagged in the implementation report, not silently assumed).
function collectStationCandidates(key){
  const predCtx=activePredictionContext();
  const out=[];
  STATE.stationTests.forEach(t=>{ const v=t.values&&t.values[key]; if(v) out.push({date:t.date, value:v, source:"test"}); });
  STATE.races.filter(r=>{
    return ctxAcceptsRecordDivision(r.division, predCtx);
  }).forEach(r=>{ const v=r.stations&&r.stations[key]; if(v) out.push({date:r.date, value:v, source:"race"}); });
  // doc12 §3 재검토: 이전에는 최근 공식 기록(<=21일)이 있으면 Simulation 후보 자체를 후보 목록에서
  // 아예 배제했다 — 21일 이내 공식 기록이 있다는 이유만으로 그보다 더 최근의 좋은 Simulation 신호가
  // 100% 차단되는 문제(TEST-04)였다. 이제는 항상 후보로 추가하고, 아래 recency 정렬이 실제로 더 최근인
  // 쪽을 자연스럽게 선택하도록 한다 — 공식 기록을 무시하는 것도 아니고(더 최근이면 그대로 이김),
  // Simulation을 무조건 차단하는 것도 아니다.
  const stMeta=STATIONS.find(s=>s.key===key);
  const officialUnit=stMeta?stMeta.unit:null;
  if(officialUnit){
    // spec: only counts when the performed amount EXACTLY matches the official station distance/reps
    // (e.g. "50m" for Sled Push) — a half-distance rep is never blended into a full-distance benchmark.
    // No unit conversion/estimation attempted; string match only (trim+case-insensitive).
    STATE.simulationTests.filter(t=>{
    return ctxAcceptsRecordDivision(t.division, predCtx);
  }).forEach(t=>{
      const s=t.stations && t.stations[key];
      if(!s || !s.time || !s.amount) return;
      if(String(s.amount).trim().toLowerCase()!==String(officialUnit).trim().toLowerCase()) return;
      out.push({date:t.date, value:s.time, source:"simulation"});
    });
  }
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}
// Running performance tests are stored directly in STATE.running. They are calibration/performance
// inputs, not training-session history.
const RUN_TT_OPTIONS = [
  { key:"tt1k", distanceKm:1, label:"1K TT", field:"tt1k", pbField:null },
  { key:"tt3k", distanceKm:3, label:"3K TT", field:"tt3k", pbField:null },
  { key:"tt5k", distanceKm:5, label:"5K TT", field:"tt5k", pbField:"pb5k" },
  { key:"tt10k", distanceKm:10, label:"10K TT", field:"tt10k", pbField:"pb10k" },
];
function runningTtRecords(){
  return RUN_TT_OPTIONS.map(opt=>{
    const time=STATE.running?.[opt.field];
    if(!time) return null;
    const sec=parseTimeToSec(time);
    return sec ? { id:`running-${opt.key}`, date:"", type:"tt", distanceKm:opt.distanceKm, avgPaceSecKm:sec/opt.distanceKm, time } : null;
  }).filter(Boolean);
}
function saveRunningTT({distanceKm,time,date,source="calibration",note="Running TT"}){
  const sec=parseTimeToSec(time), km=Number(distanceKm);
  if(!sec || ![1,3,5,10].includes(km)) return false;
  const opt=RUN_TT_OPTIONS.find(o=>o.distanceKm===km);
  if(!opt) return false;
  STATE.running[opt.field]=fmtTime(sec);
  if(opt.pbField){
    const cur=parseTimeToSec(STATE.running[opt.pbField]);
    if(!cur || sec<cur) STATE.running[opt.pbField]=fmtTime(sec);
  }
  return true;
}
function deleteRunningTT(id){
  const opt=RUN_TT_OPTIONS.find(o=>`running-${o.key}`===id);
  if(!opt) return;
  const deletedValue=STATE.running?.[opt.field] || "";
  STATE.running[opt.field]="";
  // TT values can previously have been promoted into the PB field.
  // Remove that mirror only when it is exactly the deleted TT value;
  // a separately-entered/faster PB must remain untouched.
  if(opt.pbField && STATE.running?.[opt.pbField]===deletedValue){
    STATE.running[opt.pbField]="";
  }
  persist();
  renderAll();
}
function editRunningTT(id){
  const opt=RUN_TT_OPTIONS.find(o=>`running-${o.key}`===id);
  if(!opt) return;
  const cur=STATE.running?.[opt.field]||"";
  const next=prompt(`${opt.label} 기록 (mm:ss)`,cur);
  if(next==null) return;
  const sec=parseTimeToSec(next);
  if(!sec) return showToast("기록을 mm:ss 형식으로 입력해주세요");
  saveRunningTT({distanceKm:opt.distanceKm,time:fmtTime(sec),source:"edit",note:opt.label});
  persist(); renderAll();
}

  conservative:{ label:"보수적", desc:"일시적인 변화의 영향을 적게 반영합니다." },
  recommended:{ label:"추천", desc:"최근 데이터와 장기 추세를 균형 있게 반영합니다." },

/* 5. PREDICTION ENGINE                                                    */
/*    Explainable formula:                                                 */
/*    PredictedTime = Baseline × (1 - ΔHPI×k - ConsistencyBonus + FatiguePenalty) */
/*    CI width driven by Race Execution Index (pacing consistency).        */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/* CURRENT ANCHOR — baseline hierarchy with Recent-Actual protection        */
/*   A. Fresh actual race (<=STATION_STALE_DAYS)        -> use directly     */
/*      (unchanged, top priority, same as before this pass)                */
/*   B. Best recent actual race within RECENT_ACTUAL_WINDOW_DAYS, even if   */
/*      not "fresh" by the 14-day station-staleness definition             */
/*   C. Segment model (>=50% real segment coverage, unchanged calculation)  */
/*   D. Benchmark x HPI estimate (unchanged, see getBaselineTime below)     */
/*                                                                          */
/*   Why this exists: previously, the moment a race passed 14 days old,    */
/*   the model jumped straight to the Segment Model (C) and would use it   */
/*   even when it was SLOWER than a real recent finish — i.e. the model    */
/*   could "forget" that the athlete had already run e.g. 1:17:05 by       */
/*   quoting a blended synthetic 1:21:24 as "current ability". B now sits  */
/*   between A and C specifically to catch that case.                      */
/*                                                                          */
/*   When B exists and is FASTER than or equal to C: no conflict, C is     */
/*   used as-is (segment model already agrees a real result is achievable  */
/*   or better). When C is SLOWER than B, the anchor is pulled toward B —  */
/*   NOT hard-overridden to B (an unexplained "PB forever" anchor is also  */
/*   wrong) — via a smooth, fully-explainable blend:                       */
/*     freshness       = how recent B is (linear decay to 0 over the       */
/*                        window — an old best-recent-actual naturally     */
/*                        stops protecting)                                */
/*     explainDiscount = reduced further when there's a real, already-     */
/*                        computed reason C could legitimately be slower   */
/*                        right now: low recent training volume, HPI       */
/*                        decline since B's date, or high current fatigue  */
/*                        — each such signal cuts protection by 35%        */
/*     protectionWeight = freshness * explainDiscount                      */
/*     anchor = B*protectionWeight + C*(1-protectionWeight)                */
/*   No arbitrary hardcoded offsets ("-2min", "snap to PB") anywhere here. */
/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/* SIMULATION -> RACE-LEVEL ANCHOR (doc12 긴급 수정 요청)                    */
/*   Previously a Simulation's own `totalTime` was NEVER consulted as a     */
/*   race-level performance signal — only its individual Run/Station/      */
/*   Transition splits fed the 17-segment model (buildRaceSegmentModel()). */
/*   A Full Simulation with a genuinely fast totalTime but no (or partial)  */
/*   segment breakdown therefore had ZERO effect on getBaselineTime()'s     */
/*   Anchor. Below adds `getBestSimulationCandidate()` as an explicit,      */
/*   confidence-scored race-level signal, and computeCurrentAnchor() now    */
/*   blends it into whatever Anchor Step A/B/C/D would otherwise produce — */
/*   never a full override (Simulation != official result, principle §7),  */
/*   never fully ignored (the actual bug being fixed).                     */
/* ---------------------------------------------------------------------- */
                                             // (unchanged, existing mechanism) but is not trusted enough
                                             // to move the race-level Anchor directly.
                                             // exceeds 50% blend weight, so Anchor never just "becomes"
                                             // the Simulation time outright (forbidden by principle §3).
                                             // its pull is dampened hard — a single off-day Simulation
                                             // should not meaningfully worsen the prediction (TEST-03).

function upv4MonthsSince(date){
  const d = new Date(date);
  if(!date || Number.isNaN(d.getTime())) return Infinity;
  return Math.max(0, (Date.now()-d.getTime())/(1000*60*60*24*30.4375));
}
function upv4RecencyWeight(date){
  const m=upv4MonthsSince(date);
  return (UPV4_RECENCY_BANDS.find(x=>m<=x.maxMonths)||UPV4_RECENCY_BANDS.at(-1)).weight;
