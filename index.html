/*     Distinct from EXTERNAL_RACE_DB above (raw per-athlete records used   */
/*     by the Peer/DNA percentile page) — this is the PRE-AGGREGATED        */
/*     P10/25/50/75/90 table produced by the offline Phase 2 pipeline       */
/*     (510k+ raw rows -> ~1,900 compact rows). Consulted by both           */
/*     computeStationPriority AND the 17-segment Anchor model (resolveSegment*/
/*     / getSegmentBenchmarkSec / runLegBenchmarkSec / transitionBenchmarkSec*/
/*     / getBaselineTime's final no-data fallback) as of the review fix —   */
/*     any segment with no real personal data now prefers the imported Asia/*/
/*     Global P50 over the static BENCH table wherever that segment feeds   */
/*     into a prediction, not just Station Priority.                        */
/*     Never merges Asia+Global; follows the fixed 6-step fallback chain.   */
/* ---------------------------------------------------------------------- */
let DERIVED_BENCHMARK = [];       // benchmark_rows[] from the imported derived_benchmark.json
let DERIVED_BENCHMARK_META = null; // { versions: {...} } from the same file, for the DNA page's status display
async function loadDerivedBenchmark(){
  const stored = await StorageService.get("hps:derivedBenchmark:v1", null);
  if(stored && Array.isArray(stored.benchmark_rows)){
    DERIVED_BENCHMARK=stored.benchmark_rows;
    DERIVED_BENCHMARK_META=stored.versions||null;
    return;
  }
  try{
    const hit=await fetchSiteJson(["derived_benchmark.json"]);
    const parsed=hit?.data;
    if(parsed && Array.isArray(parsed.benchmark_rows)){
      DERIVED_BENCHMARK=parsed.benchmark_rows;
      DERIVED_BENCHMARK_META=parsed.versions||null;
      await StorageService.set("hps:derivedBenchmark:v1", {benchmark_rows:DERIVED_BENCHMARK,versions:DERIVED_BENCHMARK_META});
      console.info("Derived benchmark loaded:",hit.path,DERIVED_BENCHMARK.length);
    }
  }catch(e){ console.warn("derived_benchmark.json load skipped:",e?.message||e); }
}
async function importDerivedBenchmark(jsonText){
  let parsed;
  try{ parsed=JSON.parse(jsonText); }catch(e){ return { ok:false, error:"JSON 파싱 실패: "+(e.message||e) }; }
  if(!Array.isArray(parsed.benchmark_rows)) return { ok:false, error:"benchmark_rows 배열을 찾을 수 없습니다 — Phase 2 파이프라인 산출물(derived_benchmark.json) 형식이어야 합니다." };
  DERIVED_BENCHMARK = parsed.benchmark_rows;
  DERIVED_BENCHMARK_META = parsed.versions || null;
  await StorageService.set("hps:derivedBenchmark:v1", { benchmark_rows:DERIVED_BENCHMARK, versions:DERIVED_BENCHMARK_META });
  return { ok:true, count: DERIVED_BENCHMARK.length, versions: DERIVED_BENCHMARK_META };
}
async function clearDerivedBenchmark(){ DERIVED_BENCHMARK=[]; DERIVED_BENCHMARK_META=null; await StorageService.set("hps:derivedBenchmark:v1", null); }

// same 10-year age-band scheme as the offline pipeline (build_derived_benchmark.py A-5) — derived
// only, never overwrites the user's own age field.
function deriveAgeBand(age){
  const n=Number(age);
  if(!n || n<16) return null;
  if(n<=29) return "16-29";
  if(n<=39) return "30-39";
  if(n<=49) return "40-49";
  if(n<=59) return "50-59";
  if(n<=69) return "60-69";
  return "70+";
}
// Mixed Doubles benchmark rows are keyed by TEAM category ("MIXED"), not the individual's own gender —
// a male or female athlete competing Mixed Doubles both query the same "MIXED" benchmark group.
function deriveBenchmarkGender(){
  if((STATE.profile.division||"").includes("Mixed")) return "MIXED";
  return STATE.profile.gender==="female" ? "W" : "M";
}
// spec (Phase 2 fallback chain, fixed order): ASIA -> ASIA_AGE_RELAXED -> GLOBAL_HISTORICAL ->
// GLOBAL_HISTORICAL_AGE_RELAXED -> GLOBAL_MATRIX -> null (caller falls through to the existing
// hardcoded bench() as STATIC_FALLBACK). Each step queries ONE source in isolation — never merged.
const DERIVED_BENCHMARK_FALLBACK_ORDER = ["ASIA","ASIA_AGE_RELAXED","GLOBAL_HISTORICAL","GLOBAL_HISTORICAL_AGE_RELAXED","GLOBAL_MATRIX"];
// KEY-MAPPING FIX (found while wiring DNA -> Podium, doc8): benchmark_rows[].segment uses "run_1".."run_8"
// (underscore) for individual run legs, but every caller in this file (PEER_SEGMENTS, SEGMENT_LIST,
// runLegBenchmarkSec/"run"+runIdx) uses "run1".."run8" (no underscore). That mismatch meant EVERY
// per-run-leg lookup against the real ASIA/Global derived benchmark silently failed and fell straight
// through to STATIC_FALLBACK — for every user, no matter how much real Run-leg data existed — which is
// almost certainly the actual root cause behind the recurring "Run 1-8 percentile" issues in this
// project. Normalizing the key here (once, inside the resolver) fixes every caller at once: DNA's own
// Run 1-8 percentile/Z-score (queryPeerSegmentStats), the segment-model prediction baseline
// (getSegmentBenchmarkSec/runLegBenchmarkSec), and the new Podium DNA connection below.
function normalizeDerivedBenchmarkSegmentKey(segment){
  return /^run[1-8]$/.test(segment) ? "run_"+segment.slice(3) : segment;
}
function queryDerivedBenchmark(division, gender, ageBand, segment){
  if(!DERIVED_BENCHMARK.length) return null;
  const normalizedSegment = normalizeDerivedBenchmarkSegmentKey(segment);
  for(const source of DERIVED_BENCHMARK_FALLBACK_ORDER){
    const ageRelaxed = source.endsWith("_AGE_RELAXED") || source==="GLOBAL_MATRIX";
    const row = DERIVED_BENCHMARK.find(r=> r.benchmark_source===source && r.division===division && r.gender===gender
      && r.segment===normalizedSegment && r.age_band===(ageRelaxed?null:ageBand));
    if(row) return row;
  }
  return null;
}
function filterExternalRaceDb(group){
  const { gender, ageGroup, division } = group;
  return EXTERNAL_RACE_DB.filter(r=>{
    if(r.analysis_valid===false) return false; // RAW is preserved in EXTERNAL_RACE_DB; only ANALYSIS-valid rows feed DNA/Peer/Podium
    if(gender && r.gender!==gender) return false;
    if(ageGroup && r.age_group!==ageGroup) return false;
    if(division && r.division!==division) return false;
    // event/date/country: only filter when the record actually has a value AND it differs — an
    // unlabeled record isn't excluded just because the athlete's own race has an event name, since
    // that would shrink an already-scarce real dataset for no statistical reason.
    if(group.event && r.event && r.event!==group.event) return false;
    if(group.country && r.country && r.country!==group.country) return false;
    return true;
  });
}
function segmentDbField(seg){
  if(seg.key==="roxzone") return "transition";
  if(seg.key.startsWith("run")) return "run_"+seg.key.replace("run","");
  return { sledPush:"sled_push", sledPull:"sled_pull" }[seg.key] || seg.key;
}
// Single seam function: given a segment definition + the athlete's comparison group, return
// { mean, sd, n, isReal, source }. Checks the REAL ASIA/Global DERIVED_BENCHMARK resolver FIRST (this
// pass, spec ①/⑪/⑫/⑮/⑯) — the EXACT SAME queryDerivedBenchmark()/ASIA->...->GLOBAL_MATRIX chain
// Prediction and Station Priority already use, keyed on the athlete's own Division+Gender+AgeBand, so
// DNA never silently disagrees with Prediction about which benchmark source applies. Only when NO row
// exists anywhere in that chain does this fall through to EXTERNAL_RACE_DB (spec §2, unchanged) and
// finally the illustrative PEER_SEGMENTS model — no more "30 real participants or illustrative", since
// a pre-aggregated ASIA/Global row with its own sample_n now outranks that check entirely.
function queryPeerSegmentStats(seg, group){
  const { gender, ageGroup, division } = group;

  // Newly uploaded official HYROX results are the first real-data source for Race DNA.
  // Once the exact gender/age-group/division segment has >= MIN_REAL_SAMPLE rows,
  // the uploaded participant distribution takes priority over the pre-aggregated Asia/Global
  // benchmark. This means adding a new race CSV can actually change the DNA percentile/impact.
  const matched = filterExternalRaceDb(group);
  const field = segmentDbField(seg);
  const realValues = matched.map(r=>r[field]).filter(v=>v!=null);
  if(realValues.length>=MIN_REAL_SAMPLE){
    const realMean=mean(realValues);
    const variance=mean(realValues.map(v=>(v-realMean)*(v-realMean)));
    const realSd = variance!=null && variance>0 ? Math.sqrt(variance) : realMean*SD_PCT[seg.kind];
    return { mean:realMean, sd:realSd, n:realValues.length, isReal:true,
      source:`HYROX 업로드 실측 참가자 DB (n=${realValues.length})`,
      benchmarkSource:"EXTERNAL_RACE_DB", sampleN:realValues.length };
  }

  // If the newly uploaded/local participant sample is still thin, keep the existing
  // ASIA -> ... -> GLOBAL derived benchmark fallback exactly as before.
  const ageBand = deriveAgeBand(STATE.profile.age);
  const benchGender = deriveBenchmarkGender();
  const derivedKey = seg.key==="roxzone" ? "transition" : seg.key;
  const derived = queryDerivedBenchmark(STATE.profile.division, benchGender, ageBand, derivedKey);
  if(derived && derived.p50){
    const sd = derived.p50 * SD_PCT[seg.kind];
    return { mean:derived.p50, sd, n:derived.sample_n||null, isReal:true,
      source:`ASIA/Global 실측 벤치마크 (${derived.benchmark_source}, n=${derived.sample_n ?? "?"})`,
      benchmarkSource:derived.benchmark_source, sampleN:derived.sample_n||null };
  }

  const am = AGE_MULT[ageGroup] || 1.0;
  let illustrativeMean;
  if(division==="Mixed Doubles"){
    const divMultD = PEER_DIVISION_ADJUST["Open Doubles"][seg.kind] ?? 1.0;
    const menMean = seg.base * PEER_CALIBRATION_SCALE * 1.0 * divMultD * am;
    const womenMean = seg.base * PEER_CALIBRATION_SCALE * DOUBLES_GENDER_MULT * divMultD * am;
    illustrativeMean = (menMean+womenMean)/2;
  } else {
    const gm = (division==="Open Doubles" || division==="Pro Doubles")
      ? (gender==="female" ? DOUBLES_GENDER_MULT : 1.0)
      : (gender==="female" ? SINGLES_GENDER_MULT : 1.0);
    const adj = PEER_DIVISION_ADJUST[division] || PEER_DIVISION_ADJUST.Open;
    const divMult = adj[seg.kind] ?? 1.0;
    illustrativeMean = seg.base * PEER_CALIBRATION_SCALE * gm * divMult * am;
  }
  const illustrativeSd = illustrativeMean * SD_PCT[seg.kind];
  const source = realValues.length>0
    ? `예시 벤치마크 모델 (실제 데이터 ${realValues.length}건 — ${MIN_REAL_SAMPLE}건 미만이라 percentile 미표시, 데이터 부족)`
    : PEER_DATA_SOURCE.sourceLabel;
  return { mean:illustrativeMean, sd:illustrativeSd, n:realValues.length||null, isReal:false, source, benchmarkSource:"STATIC_FALLBACK", sampleN:realValues.length||null };
}
const PEER_SEGMENTS = [
  { key:"run1", label:"Run 1", kind:"run", base:265 },
  { key:"ski", label:"SkiErg", kind:"station", base:275 },
  { key:"run2", label:"Run 2", kind:"run", base:258 },
  { key:"sledPush", label:"Sled Push", kind:"station", base:225 },
  { key:"run3", label:"Run 3", kind:"run", base:272 },
  { key:"sledPull", label:"Sled Pull", kind:"station", base:252 },
  { key:"run4", label:"Run 4", kind:"run", base:265 },
  { key:"burpee", label:"Burpee Broad Jump", kind:"station", base:288 },
  { key:"run5", label:"Run 5", kind:"run", base:270 },
  { key:"row", label:"Row", kind:"station", base:260 },
  { key:"run6", label:"Run 6", kind:"run", base:258 },
  { key:"carry", label:"Farmer Carry", kind:"station", base:160 },
  { key:"run7", label:"Run 7", kind:"run", base:266 },
  { key:"lunge", label:"Sandbag Lunge", kind:"station", base:315 },
  { key:"run8", label:"Run 8", kind:"run", base:260 },
  { key:"wallball", label:"Wall Ball", kind:"station", base:330 },
  { key:"roxzone", label:"Roxzone (전환)", kind:"transition", base:300 },
];
const SD_PCT = { run:0.09, station:0.14, transition:0.20 };
const AGE_GROUPS = ["18-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60+"];
// peak performance at 25-29 (1.00), ~1.5-3%/5yr degradation after 30, ~11% slower by 50-54
const AGE_MULT   = { "18-24":1.02,"25-29":1.00,"30-34":1.02,"35-39":1.04,"40-44":1.07,"45-49":1.10,"50-54":1.114,"55-59":1.16,"60+":1.22 };
// recalibrates the illustrative split table so the 25-29 Open-Male total lands near the
// publicly reported ~80min peak-age benchmark (overall Open-Men average ~90min across all ages)
const PEER_CALIBRATION_SCALE = 1.06;
const IMPACT_WEIGHTS = { run:25, ski:8, sledPush:12, sledPull:10, burpee:10, row:8, carry:7, lunge:10, wallball:10 }; // sums to 100

function getAgeGroup(age){
  if(!age||isNaN(age)) return "30-34";
  if(age<25) return "18-24"; if(age<30) return "25-29"; if(age<35) return "30-34"; if(age<40) return "35-39";
  if(age<45) return "40-44"; if(age<50) return "45-49"; if(age<55) return "50-54"; if(age<60) return "55-59"; return "60+";
}
// Abramowitz-Stegun erf approximation, then standard normal CDF
function erf(x){
  const sign = x<0? -1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normalCdf(z){ return 0.5*(1+erf(z/Math.SQRT2)); }
function starRating(z){
  if(z>=1.5) return { stars:5, label:"엘리트 수준" };
  if(z>=0.5) return { stars:4, label:"강점" };
  if(z>=-0.5) return { stars:3, label:"평균" };
  if(z>=-1.5) return { stars:2, label:"개선 필요" };
  return { stars:1, label:"개선 필요" };
}
function getUserSegmentValue(key, race){
  if(key==="roxzone") return parseTimeToSec(race.transition);
  if(key.startsWith("run")){ const n=Number(key.replace("run","")); return parseTimeToSec(race.runs?.[n]); }
  return parseTimeToSec(race.stations?.[key]);
}
// spec ⑤/⑥: personal DIVISION-scoped race history for a segment — Latest / Best / Median /
// recency-weighted Current Estimate / n / last-measured date, across ALL of the athlete's races in
// the EXACT current division (racesByDivision, not the coarser divisionBase match) — Open and Open
// Doubles, or Pro and Pro Doubles, are never pooled together here.
const PERSONAL_HISTORY_HALF_LIFE_DAYS = 120;
function getPersonalSegmentHistory(seg){
  const races = racesByDivision(STATE.profile.division);
  const values = races.map(r=>{
    const v=getUserSegmentValue(seg.key, r);
    return v!=null ? { value:v, date:r.date, ageDays:daysBetween(r.date, todayISO()) } : null;
  }).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date));
  if(!values.length) return null;
  const latest = values[0];
  const best = values.reduce((a,b)=> a.value<=b.value? a:b);
  const sorted=[...values].sort((a,b)=>a.value-b.value);
  const mid=Math.floor(sorted.length/2);
  const median = sorted.length%2 ? sorted[mid].value : (sorted[mid-1].value+sorted[mid].value)/2;
  let wsum=0, vsum=0;
  values.forEach(v=>{ const w=Math.pow(0.5, v.ageDays/PERSONAL_HISTORY_HALF_LIFE_DAYS); wsum+=w; vsum+=w*v.value; });
  const currentEstimate = wsum>0 ? vsum/wsum : latest.value;
  return { latest:latest.value, latestDate:latest.date, best:best.value, bestDate:best.date, median, currentEstimate, n:values.length };
}
// PEER_SEGMENTS' "roxzone" key vs SEGMENT_LIST's "transition" key refer to the same segment — see the
// Prediction-baseline key-mapping fix above. This bridges PEER_SEGMENTS entries into resolveSegment()'s
// SEGMENT_LIST-keyed lookup so DNA reuses the EXACT SAME Race actual > Station test > Training log
// hierarchy the Prediction engine already implements (spec ⑦/⑯), instead of a second copy of that logic.
function toSegmentListEntry(peerSeg){
  const key = peerSeg.key==="roxzone" ? "transition" : peerSeg.key;
  return SEGMENT_LIST.find(s=>s.key===key) || null;
}
// doc9 §30-2/§30-7/TEST-07: DNA/Peer percentile must reflect "실제 HYROX 선수 집단에서 본인의 위치" —
// the athlete's OWN value must come from an official race split ONLY, never Simulation or trainingLog.
// resolveSegment() (used everywhere else — Prediction, Station Priority, Training Plan) deliberately
// DOES fall through to Simulation/trainingLog when official data is stale or missing, because those
// engines answer "what can this athlete do right now"; DNA answers a different question ("where do I
// rank among real HYROX finishers"), so it needs its own, strictly official-only resolver — reading
// directly from the specific race object computePeerAnalysis is already analyzing, with NO fallback
// tier beyond that. A segment with no official split for this race is null (not filled from anywhere
// else), so DNA never silently shows a Simulation-derived number as if it were a real racing result.
function resolveOfficialSegment(seg, race){
  if(!race) return { sec:null, basis:"benchmark-only" };
  if(seg.type==="run"){
    const sec = parseTimeToSec(race.runs?.[seg.runIdx]);
    return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
  }
  if(seg.type==="station"){
    const sec = parseTimeToSec(race.stations?.[seg.key]);
    return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
  }
  const sec = parseTimeToSec(race.transition);
  return sec!=null ? { sec, date:race.date, source:"race", basis:"actual" } : { sec:null, basis:"benchmark-only" };
}

// Per-division adjustment applied to the PEER_SEGMENTS base (Open Singles) table, by segment kind.
// Doubles reuses the same run-unchanged / station-split logic as the main BENCH table above.
// Mixed Doubles has NO entry here on purpose: per-segment its benchmark is derived by averaging the
// Men's and Women's Open-Doubles benchmarks (see computePeerAnalysis) rather than from a world-record
// ratio applied as a fixed Division correction factor.
const PEER_DIVISION_ADJUST = {
  "Open":           { run:1.00, station:1.00, transition:1.00 },
  "Pro":            { run:0.80, station:0.80, transition:0.85 },
  "Open Doubles":   { run:1.00, station:DOUBLES_STATION_FACTOR, transition:1.05 },
  "Pro Doubles":    { run:0.80, station:0.80*DOUBLES_STATION_FACTOR, transition:0.89 },
};
const SINGLES_GENDER_MULT = 1.22; // ~90min vs ~110min sourced Open Singles average ratio
// Men's vs Women's Pro Doubles world records (47:41 vs 54:24) — used only to derive the Women's-
// Doubles benchmark itself (a real, sourced gender-performance gap). Mixed Doubles never multiplies
// by this directly; it's built by averaging the resulting Men's/Women's Doubles benchmarks instead.
const DOUBLES_GENDER_MULT = 1.14;

function computePeerAnalysis(){
  // spec ⑤: EXACT current division only (racesByDivision, not latestRace()'s coarser divisionBase
  // match) — Open and Open Doubles, or Pro and Pro Doubles, must never be pooled as "the same" race history.
  const race=racesByDivision(STATE.profile.division)[0] || null;
  if(!race) return null;
  const profile=STATE.profile;
  const ageGroup=getAgeGroup(Number(profile.age));
  const gender = profile.gender==="female" ? "female":"male";
  const division = DIVISIONS.includes(profile.division) ? profile.division : "Open";
  const am = AGE_MULT[ageGroup] || 1.0;
  // Comparison group filters (spec §1): Gender/AgeGroup/Division are already wired into the
  // illustrative model's math. Event/Date/Country are accepted here so the *interface* a real DB
  // query would use is already the interface the UI calls — queryPeerSegmentStats() currently
  // ignores them (the illustrative model has no such breakdown), but a real integration filters on
  // all six without touching computePeerAnalysis or any rendering code.
  const groupFilters = {
    gender, ageGroup, division,
    event: race.name || null,           // e.g. "HYROX Seoul" — null = all events
    date: race.date || null,            // real DB would use this for a date-window filter (e.g. same season)
    country: profile.country || null,   // not currently collected in the profile form; null = all regions
  };

  // Calculation order (spec §1), same whether the source is illustrative or a real DB:
  //   내 기록 → 동일 그룹 평균/SD (queryPeerSegmentStats) → z-score → percentile → time loss →
  //   가장 큰 limiter (Impact Score) → 개선 우선순위 (impactList sort)
  const segments = PEER_SEGMENTS.map(seg=>{
    // peerMean/peerSd now flow through the queryPeerSegmentStats() seam (spec §7/①/⑯) — ASIA/Global
    // derived benchmark first, same resolver Prediction uses, illustrative model only as final fallback.
    const stats = queryPeerSegmentStats(seg, groupFilters);
    const { mean:peerMean, sd:peerSd, n:peerN, isReal:peerIsReal, benchmarkSource, sampleN } = stats;
    // doc9 §30-2/§30-7/TEST-07: DNA's "actual" now comes ONLY from this specific official race —
    // resolveOfficialSegment() has no Simulation/trainingLog fallback tier, so changing Simulation data
    // can never move a DNA percentile/Z-score. (Prediction's own segment model, below/elsewhere, keeps
    // using the full resolveSegment() hierarchy including Simulation — that's a deliberately different,
    // separate question: "current estimated ability" vs. DNA's "position among real HYROX finishers".)
    const slEntry = toSegmentListEntry(seg);
    const resolved = slEntry ? resolveOfficialSegment(slEntry, race) : null;
    const actual = resolved && resolved.sec!=null ? resolved.sec : null;
    const personalHistory = getPersonalSegmentHistory(seg);
    const basis = resolved ? resolved.basis : null;
    if(actual==null) return { ...seg, actual:null, peerMean, peerSd, peerN, peerIsReal, benchmarkSource, sampleN, personalHistory, basis, z:null, percentile:null, star:null, timeLoss:null };
    const z = (peerMean-actual)/peerSd;
    const percentile = clamp(normalCdf(z)*100, 0.5, 99.5);
    const timeLoss = actual-peerMean;
    return { ...seg, actual, peerMean, peerSd, peerN, peerIsReal, benchmarkSource, sampleN, personalHistory, basis, z, percentile, star:starRating(z), timeLoss };
  });
  const have = segments.filter(s=>s.actual!=null);
  if(!have.length) return null;

  const byKey=k=>segments.find(s=>s.key===k);
  const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null);
  const stationSegs = segments.filter(s=>s.kind==="station" && s.actual!=null);
  const roxzone = byKey("roxzone");

  // ---- Impact Score (weighted contribution of each bottleneck to total time lost) ----
  const runTimeLoss = runSegs.length===8 ? runSegs.reduce((s,r)=>s+r.timeLoss,0) : null;
  const impactCandidates = [];
  if(runTimeLoss!=null) impactCandidates.push({ key:"run", label:"Running (8구간 합)", timeLoss:runTimeLoss, weight:IMPACT_WEIGHTS.run });
  ["ski","sledPush","sledPull","burpee","row","carry","lunge","wallball"].forEach(k=>{
    const s=byKey(k); if(s && s.actual!=null) impactCandidates.push({ key:k, label:s.label, timeLoss:s.timeLoss, weight:IMPACT_WEIGHTS[k] });
  });
  const totalWeightedLoss = impactCandidates.reduce((sum,c)=>sum+Math.max(0,c.timeLoss)*c.weight,0);
  const impactList = impactCandidates.map(c=>({ ...c, impactPct: totalWeightedLoss>0 ? (Math.max(0,c.timeLoss)*c.weight/totalWeightedLoss)*100 : 0 }))
    .sort((a,b)=>b.impactPct-a.impactPct);
  const totalLossSec = impactCandidates.reduce((s,c)=>s+Math.max(0,c.timeLoss),0);

  // ---- Strength Index (7 sub-indices, 0-100, percentile-based) ----
  const pct=(k)=>{ const s=byKey(k); return s&&s.percentile!=null? s.percentile : null; };
  const avgPct=(keys)=>{ const vals=keys.map(pct).filter(v=>v!=null); return vals.length? mean(vals): null; };
  const runningIdx = runSegs.length? mean(runSegs.map(s=>s.percentile)) : null;
  const stationsIdx = stationSegs.length? mean(stationSegs.map(s=>s.percentile)) : null;
  const transitionIdx = roxzone.percentile;
  const powerIdx = avgPct(["sledPush","sledPull","lunge"]);
  const engineIdx = avgPct(["ski","row","burpee"]);
  const gripIdx = avgPct(["carry","sledPull"]);
  const earlyAvg = avgPct(["ski","sledPush"]);
  const lateAvg = avgPct(["lunge","wallball"]);
  const fatigueResistance = (earlyAvg!=null&&lateAvg!=null) ? clamp(100-(earlyAvg-lateAvg),0,100) : null;
  const strengthIdx = { running:runningIdx, stations:stationsIdx, transition:transitionIdx, power:powerIdx, engine:engineIdx, grip:gripIdx, fatigueResistance };

  const raceDna = classifyRaceDna(strengthIdx);
  const interpretation = buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race });

  // spec §2: per-segment real-data coverage — how many of the (up to 17) segments actually cleared
  // MIN_REAL_SAMPLE and are showing real percentile vs how many fell back to the illustrative model.
  const realSegmentCount = segments.filter(s=>s.peerIsReal).length;
  const totalSegmentCount = segments.filter(s=>s.actual!=null).length;

  return { group:{gender,ageGroup,division}, race, segments, impactList, totalLossSec, strengthIdx, raceDna, interpretation,
    dataSource: { isReal: PEER_DATA_SOURCE.isReal, sourceLabel: PEER_DATA_SOURCE.sourceLabel,
      realSegmentCount, totalSegmentCount, externalDbSize: EXTERNAL_RACE_DB.length } };
}

/* ---------------------------------------------------------------------- */
/* 9e. PODIUM PROBABILITY ENGINE ("나의 포디움 가능성은?")                    */
/*     Reuses existing engines wholesale — no new prediction formula, no    */
/*     new stats primitive. Current estimate + range comes straight from    */
/*     predictTime() (same Anchor/HPI/confidence machinery every other page */
/*     already uses). Podium cutoff times come from EXTERNAL_RACE_DB — the  */
/*     SAME real-results table queryPeerSegmentStats()/computePeerAnalysis()*/
/*     already use for percentile analysis. Probability is derived by       */
/*     treating predictTime()'s own ciLow/ciHigh band as an approximate      */
/*     normal distribution (using the SAME normalCdf() the rest of this     */
/*     file already uses for percentile math) and asking how much of that   */
/*     distribution clears the podium cutoff — never a step function        */
/*     (current<cutoff -> 100%/0%), per spec §15.                           */
/* ---------------------------------------------------------------------- */
const PODIUM_MIN_SAMPLE = 5; // below this, cutoffs are not shown as real numbers (spec §11/§21)
// predictTime()'s range is documented (PREDICTION_TARGET_COVERAGE) as a hand-tuned band targeting
// ~70% central coverage of real outcomes — z=1.036 is the two-tailed z-score for 70% central coverage,
// used only to convert that existing half-width into an approximate standard deviation. No new
// uncertainty model is introduced; this just reads predictTime()'s own stated calibration target.
const PODIUM_RANGE_Z = 1.036;

// hyroxDbRowToExternal()/queryPeerSegmentStats() already populate and read — no new data structure.
/* ---------------------------------------------------------------------- */
/* PODIUM <-> DNA CONNECTION (doc8)                                        */
/*   predictTime()'s existing Segment Model (buildRaceSegmentModel ->      */
/*   resolveSegment, which already prioritizes real race/simulation actuals*/
/*   and already falls back to the SAME queryDerivedBenchmark() ASIA/Global*/
/*   chain DNA uses) is the SAME underlying real data DNA's percentile is  */
/*   computed from — actual seconds vs. peer-mean seconds. Re-injecting a  */
/*   percentile-derived "adjustment" into predictedSec on top of that would*/
/*   double-count the same facts, which is exactly the kind of invented    */
/*   formula doc8 §18/§28 forbids. So this layer does NOT touch            */
/*   predictedSec's formula. What it DOES add, as genuinely new/missing    */
/*   connections:                                                          */
/*     1) computeDnaRaceCompetitiveScore() — a race-time-WEIGHTED DNA       */
/*        aggregate (doc8 §6/§7/§9 explicitly forbid a flat average across */
/*        segments) surfaced on the Podium card as "DNA Race Score".       */
/*     2) matrixImpliedPercentile()/checkDnaMatrixConsistency() — cross-    */
/*        checks DNA percentile against GLOBAL_MATRIX's own P1-P100 time   */
/*        buckets for the same segment and flags large disagreements as a  */
/*        diagnostic (doc8 §13/§23, PODIUM-DNA-08) — surfaced, not hidden. */
/*     3) The 10K-calibration + Simulation connections above already flow  */
/*        into predictedSec THROUGH the existing Segment Model — this is   */
/*        the real mechanism doc8's "predictedSec 자체를 변경" ask maps to. */
/* ---------------------------------------------------------------------- */
// Time-weighted DNA aggregate: each segment's percentile is weighted by its share of the athlete's
// OWN actual total race time, not counted equally with every other segment — a 20s Sled Push swing
// matters far less to the overall race than a 3min Running total swing (doc8 §6/§7 explicitly forbid
// the flat/simple average). Uses computePeerAnalysis()'s own segment percentiles/actuals as-is — no
// new statistics, purely a race-level aggregation layer on top of the existing DNA numbers.
function computeDnaRaceCompetitiveScore(peer){
  if(!peer) return null;
  const withData = peer.segments.filter(s=>s.actual!=null && s.percentile!=null && s.actual>0);
  if(!withData.length) return null;
  const totalSec = withData.reduce((sum,s)=>sum+s.actual,0);
  if(totalSec<=0) return null;
  const weightedPercentile = withData.reduce((sum,s)=> sum + s.percentile*(s.actual/totalSec), 0);
  return { score: clamp(weightedPercentile,0.5,99.5), segmentCount: withData.length, totalWeightedSec: totalSec };
}
// benchmark_rows' p1..p100 fields are TIME buckets in ASCENDING order (a small bucket number = a FAST/
// elite time; a large one = a SLOW time) — the OPPOSITE convention from DNA's own percentile (higher =
// better/faster). This interpolates the athlete's actual segment time within the row's real buckets and
// flips it to DNA's "higher = better" convention, so the two numbers are directly comparable. Returns
// null (never a guess) when the row has fewer than 2 usable buckets.
const BENCHMARK_PERCENTILE_BUCKETS = [
  { key:"p1", pct:1 }, { key:"p10", pct:10 }, { key:"p25", pct:25 }, { key:"p50", pct:50 },
  { key:"p75", pct:75 }, { key:"p90", pct:90 }, { key:"p100", pct:100 },
];
function matrixImpliedPercentile(row, actualSec){
  if(!row || actualSec==null) return null;
  const buckets = BENCHMARK_PERCENTILE_BUCKETS.map(b=>({ pct:b.pct, sec:row[b.key] })).filter(b=>b.sec!=null).sort((a,b)=>a.sec-b.sec);
  if(buckets.length<2) return null;
  if(actualSec<=buckets[0].sec) return clamp(100-buckets[0].pct, 0.5, 99.5);
  if(actualSec>=buckets[buckets.length-1].sec) return clamp(100-buckets[buckets.length-1].pct, 0.5, 99.5);
  for(let i=0;i<buckets.length-1;i++){
    const a=buckets[i], b=buckets[i+1];
    if(actualSec>=a.sec && actualSec<=b.sec){
      const frac=(actualSec-a.sec)/(b.sec-a.sec);
      const timeRankPct=a.pct+frac*(b.pct-a.pct);
      return clamp(100-timeRankPct, 0.5, 99.5);
    }
  }
  return null;
}
const DNA_MATRIX_DIVERGENCE_THRESHOLD = 20; // percentile points — diagnostic-only flag, not a correction
function checkDnaMatrixConsistency(peer){
  if(!peer || !DERIVED_BENCHMARK.length) return [];
  const benchGender = deriveBenchmarkGender();
  const flags=[];
  peer.segments.forEach(seg=>{
    if(seg.actual==null || seg.percentile==null) return;
    const segKey = seg.key==="roxzone" ? "transition" : normalizeDerivedBenchmarkSegmentKey(seg.key);
    const matrixRow = DERIVED_BENCHMARK.find(r=>r.benchmark_source==="GLOBAL_MATRIX" && r.division===STATE.profile.division
      && r.gender===benchGender && r.segment===segKey);
    if(!matrixRow) return;
    const matrixPct = matrixImpliedPercentile(matrixRow, seg.actual);
    if(matrixPct==null) return;
    const diff = Math.abs(seg.percentile-matrixPct);
    if(diff>=DNA_MATRIX_DIVERGENCE_THRESHOLD){
      flags.push({ key:seg.key, label:seg.label, dnaPercentile:round1(seg.percentile), matrixPercentile:round1(matrixPct), diff:round1(diff), dnaSource:seg.benchmarkSource });
    }
  });
  return flags;
}

        .eq("division","Open Doubles")
        .eq("gender","Mixed")
        .order("id",{ascending:true}).range(start,to);

      if(!data || !data.length) break;

      if(data.length<EXTERNAL_RACE_DB_PAGE_SIZE) break;

// [포디움 기준 재설계 — "전체 DB 상위 3명" 버그 수정]
// 이전 로직은 Gender+Division+AgeGroup으로 필터한 뒤, 그 전체 풀(pool)에서 가장 빠른 3명을 그대로
// "포디움 기준"으로 사용했다 — 이는 사실상 해당 조건의 "세계 최상위 3명"이지, "실제 대회에서 포디움에
//드는 데 필요한 기준"이 아니다. 아래는 이벤트(대회)별로 실제 3위 기록을 먼저 추출하고, 그 분포의
// median(또는 지정 percentile)을 최종 기준으로 삼는다 — 특정 대회 하나의 극단적으로 빠른 기록 때문에
// 기준이 지나치게 낮아지는 것도 방지된다.
const PODIUM_MIN_EVENT_FINISHERS = 3; // an event needs >=3 valid finishers to have a real 3rd place
const PODIUM_MIN_EVENTS_FOR_TIER = 1; // >=1 qualifying event required before a tier is usable at all
function computeEventPodiums(rows){
  const byEvent=new Map();
  rows.forEach(r=>{
    const key=(r.event||"").trim();
    if(!key) return; // no event label — can't attribute to a specific race, excluded from event-level analysis
    if(!byEvent.has(key)) byEvent.set(key, []);
    byEvent.get(key).push(r);
  });
  const podiums=[];
  byEvent.forEach((list,eventKey)=>{
    if(list.length<PODIUM_MIN_EVENT_FINISHERS) return; // no real 3rd place to extract
    const sorted=[...list].sort((a,b)=>a.overall_time-b.overall_time);
    podiums.push({ event:eventKey, n:list.length,
      first:sorted[0].overall_time, second:sorted[1].overall_time, third:sorted[2].overall_time,
      thirdRow:sorted[2] });
  });
  return podiums;
}
// method: "median" (default, spec §8) or "p25" (stricter — closer to a harder podium bar)
function buildPodiumBenchmarkFromEventPodiums(eventPodiums, method){
  if(!eventPodiums.length) return null;
  const firsts=eventPodiums.map(e=>e.first), seconds=eventPodiums.map(e=>e.second), thirds=eventPodiums.map(e=>e.third);
  const stat = method==="p25" ? (arr=>percentileOf(arr,0.25)) : medianOf;
  const cutoff = stat(thirds);
  // gap-decomposition needs one REAL row's actual segment splits — pick whichever event's real 3rd-place
  // row sits closest to the computed statistical cutoff, as the best available real representative.
  const repEvent = eventPodiums.reduce((best,e)=> Math.abs(e.third-cutoff)<Math.abs(best.third-cutoff) ? e : best, eventPodiums[0]);
  return {
    podium:[stat(firsts), stat(seconds), cutoff], podiumRows:[null,null,repEvent.thirdRow],
    method, distribution:{ min:Math.min(...thirds), p25:percentileOf(thirds,0.25), median:medianOf(thirds), p75:percentileOf(thirds,0.75), max:Math.max(...thirds) },
    eventCount:eventPodiums.length, totalRiders:eventPodiums.reduce((s,e)=>s+e.n,0),
    events:eventPodiums.map(e=>({event:e.event, n:e.n, third:e.third})).sort((a,b)=>a.third-b.third),
  };
}
async function computePodiumComparisonGroup(eventName, division, gender, ageGroup){

    try{

      const raw = await fetchPodiumDivisionRowsFromSupabase(division);
      rawFetchedCount = raw.length;
      sourceRows = raw.map(hyroxDbRowToExternal).filter(Boolean);
      convertedCount = sourceRows.length;
      usedLiveQuery = true;
    }catch(e){
      console.warn("[Podium Trace] Supabase 직접 query 실패 — 로컬 EXTERNAL_RACE_DB로 폴백:", e?.message||e);

      return d===division;
    }); // offline/폴백 경로

    + `\n\ncandidate filter:\ngender = ${gender}\ndivision = ${division}\nageGroup = ${ageGroup}`
    + `\n\nSupabase raw rows fetched: ${rawFetchedCount}${usedLiveQuery?` (division="${division}" 직접 query — cross-division 혼합 없음)`:` (로컬 캐시 폴백)`}`
    + `\nhyroxDbRowToExternal() 변환 성공 rows: ${convertedCount}`);

  // Its podium benchmark must include both male and female Mixed Doubles teams.

    ? sourceRows

    if(evRows.length>=PODIUM_MIN_EVENT_FINISHERS){

        events:[{event:eventName, n:evRows.length, third:sorted[2].overall_time}],
        distribution:{ min:sorted[2].overall_time, p25:sorted[2].overall_time, median:sorted[2].overall_time, p75:sorted[2].overall_time, max:sorted[2].overall_time } };
      const result = { ...built, scope:"event", n:validRows.length, division,
        gender:division==="Mixed Doubles" ? "MIXED" : gender, ageGroup,
        sourceDivision:division, tier:"REQUESTED_EVENT_ACTUAL", ageGroupUsed:ageGroup };
      logPodiumTrace(result, validRows.length);
      return result;
    }
  }

  // Tier 1: Gender + Division + AgeGroup — 이벤트별 실제 3위 분포 (요청 §1~8의 핵심 로직).

// every uploaded CSV provides. The athlete's side reuses buildRaceSegmentModel()'s real 17-segment
// breakdown (same real actuals/benchmarks predictTime() itself is built from), scaled by the single
// factor that reconciles its total with predictTime()'s own predictedSec — a proportional
// redistribution of the exact same number, not an invented one. Any segment missing from the cutoff
// record is skipped rather than guessed; if fewer than half the segments can be compared this returns

const PODIUM_GAP_SEGMENT_FIELD = { ski:"ski", sledPush:"sled_push", sledPull:"sled_pull", burpee:"burpee",

function computePodiumGapDecomposition(predictedSec, cutoffRow, targetDivision){

  const scale = predictedSec/model.total;
  const rows=[];
  let accountedGap=0;
  model.segments.forEach(seg=>{
    const baseSec = seg.sec!=null ? seg.sec : seg.benchmark;
    if(baseSec==null) return;
    const mySec = baseSec*scale;
    const field = seg.type==="run" ? "run_"+seg.runIdx : (seg.type==="transition" ? "transition" : PODIUM_GAP_SEGMENT_FIELD[seg.key]);
    const cutoffSec = field!=null ? cutoffRow[field] : null;
    if(cutoffSec==null) return; // not in the cutoff record — skip, never guess
    const gap = mySec-cutoffSec;
    rows.push({ label:seg.label, key:seg.key, gapSec:gap });
    accountedGap += gap;
  });
  if(rows.length < model.segments.length*0.5) return null;
  rows.sort((a,b)=>b.gapSec-a.gapSec);
  const totalGap = predictedSec-cutoffRow.overall_time;
  return { rows, totalGap, accountedGap, unaccountedGap: totalGap-accountedGap, coverage: rows.length/model.segments.length };
}
// P(actual finish time <= cutoff), given the SAME center/range predictTime() already reports —
// never claims literal 0%/100% off a probabilistic estimate (spec §14/§15).
function computePodiumProbability(predictedSec, ciLow, ciHigh, cutoffSec){
  const halfWidth = Math.max(1,(ciHigh-ciLow)/2);
  const sigma = halfWidth/PODIUM_RANGE_Z;
  const z = (cutoffSec-predictedSec)/sigma;
  return clamp(normalCdf(z)*100, 1, 99);
}
// "안정적인 포디움 목표" (spec §16): a bit faster than the exact cutoff, scaled to the same uncertainty
// band, so hitting it leaves real margin rather than exactly grazing the cutoff.
function computePodiumSafeTarget(ciLow, ciHigh, cutoffSec){
  const halfWidth = Math.max(1,(ciHigh-ciLow)/2);
  const sigma = halfWidth/PODIUM_RANGE_Z;
  const buffer = clamp(sigma*0.6, 15, 180);
  return cutoffSec - buffer;
}

// PODIUM DIVISION-AWARE PREDICTION
// The podium benchmark already uses the selected goal Division, but the previous
// implementation fed it a prediction from the athlete's base/profile Division.
// That made Open / Open Doubles / Pro Doubles show the same "현재 예상 기록".
// Reuse the existing production prediction engine under a temporary Division context
// so all of its existing race/segment/benchmark fallback logic remains intact.
// STATE.profile.division is always restored by withDivisionContext().
function predictPodiumForDivision(targetDivision, weeksToRace){
  const div = targetDivision || STATE.profile.division;
  // IMPORTANT: podium prediction must use the exact selected race Division.
  // HPI/physiology remains base-category aware, but race evidence and race benchmarks
  // must not pool Open with Open Doubles or Pro with Pro Doubles.
  const prevPredictionDivision = PREDICTION_DIVISION_OVERRIDE;
  PREDICTION_DIVISION_OVERRIDE = div;
  try{
    return withDivisionContext(div, ()=>{
      const targetHpi = calcHPI();
      return predictTime(targetHpi, weeksToRace);
    });
  } finally {
    PREDICTION_DIVISION_OVERRIDE = prevPredictionDivision;
  }
}

async function computePodiumAnalysis(){
  const p=STATE.profile;
  // Podium prediction uses the same race-date horizon as the Prediction page.
  // e.g. 4 weeks to race -> 4-week forecast, 1 week -> 1-week forecast.
  // The selected Division must also be the Division used by the prediction engine.
  const dRace=daysToRace();
  const weeksToRace = dRace!=null ? clamp(dRace/7,0,20) : 0;
  // IMPORTANT: prediction and podium benchmark must use the SAME selected Division.
  // Use the actual runway to race day, exactly like the Prediction page.
  const goalDiv = p.goalDivision || p.division;
  const pred = predictPodiumForDivision(goalDiv, weeksToRace);
  // doc8: DNA Race Score + Matrix consistency, surfaced alongside (not injected into) pred — see the
  // PODIUM <-> DNA CONNECTION block above for why predictedSec itself is intentionally left untouched.
  const peer = computePeerAnalysis();
  const dnaScore = computeDnaRaceCompetitiveScore(peer);
  const dnaConsistencyFlags = checkDnaMatrixConsistency(peer);
  const dnaWeaknessRank = getDnaWeaknessRanking(3);
  const genderStr = (p.goalGender || p.gender)==="female" ? "female":"male";
  const ageGroup = p.goalAgeGroup || getAgeGroup(Number(p.age));
  const eventName = (p.targetEventName||"").trim();
  const benchmark = await computePodiumBenchmark(eventName, goalDiv, genderStr, ageGroup);
  const predConf = calcPredictionConfidence();
  const result = { predicted:pred.predicted, ciLow:pred.ciLow, ciHigh:pred.ciHigh, predConfidence:predConf.label,
    benchmark, goalDiv, eventName, weeksToRace, dRace, dnaScore, dnaConsistencyFlags, dnaWeaknessRank };
  if(benchmark.scope==="insufficient"){ result.status="insufficient"; return result; }
  const cutoff = benchmark.podium[Math.min(2, benchmark.podium.length-1)];
  const cutoffRow = benchmark.podiumRows ? benchmark.podiumRows[Math.min(2, benchmark.podiumRows.length-1)] : null;
  result.status="ok";
  result.cutoff=cutoff;
  result.gapDecomposition = computePodiumGapDecomposition(pred.predicted, cutoffRow, goalDiv);
  result.predictionDivision = goalDiv;
  result.probability=computePodiumProbability(pred.predicted, pred.ciLow, pred.ciHigh, cutoff);
  result.qual=probToQualLabel(result.probability);
  result.safeTarget=computePodiumSafeTarget(pred.ciLow, pred.ciHigh, cutoff);
  result.gapSec=pred.predicted-cutoff; // positive = still need to get faster than 3rd place
  // spec §22: blend prediction confidence with comparison-sample size — reuses calcPredictionConfidence()
  // as-is, just adds the sample-size gate on top rather than inventing a second confidence model.
  result.overallConfidence = (predConf.label==="HIGH" && benchmark.n>=30) ? "HIGH"
    : (predConf.label==="LOW" || benchmark.n<10) ? "LOW" : "MEDIUM";
  return result;
}

/* ---------------------------------------------------------------------- */
/* PHASE 4 — RACE DNA: Historical / Current Adjustment / Current /          */
/*     Projected / Confidence / Source (doc 16 §2-3)                        */
/*     Reuses calcHPI(tier1Only) exactly as-is — no new scoring logic.       */
/*     calcHPI(true) already IS "Historical" (Tier-1 실제 대회/PB 증거만),    */
/*     calcHPI(false) already IS "Current" (+Tier-2 Garmin/훈련 추세 EMA).    */
/*     Honesty constraint: only Running/Engine currently have a REAL        */
/*     Tier-1-vs-Tier-2 split in calcRunningIndex/calcEngineIndex — for     */
/*     StrengthEnd/Skill/RaceExec, calcHPI(true) returns the exact same     */
/*     score as calcHPI(false) today (no tier1Only branch exists yet for    */
/*     those sub-calculators), so their "adjustment" is honestly 0 rather   */
/*     than a fabricated split. Recovery has no Historical concept at all   */
/*     (it's inherently a training-trend signal, never race-evidence) and   */
/*     is explicitly marked hasHistoricalConcept:false instead of forcing   */
/*     a Historical number that doesn't mean anything.                     */
/* ---------------------------------------------------------------------- */
const RACE_DNA_AXES_WITH_REAL_SPLIT = ["running","engine"]; // only these differ between calcHPI(true/false) today
function buildRaceDnaHistoricalCurrentProjected(){
  const current = calcHPI(false);
  const historical = calcHPI(true);
  const dRace = daysToRace();
  const weeksToRace = dRace!=null ? clamp(dRace/7, 0, 20) : 8;
  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const axes = ["running","engine","strengthEnd","skill","recovery","raceExec"];
  const result = {};
  axes.forEach(key=>{
    const curScore = current.indices[key].score;
    const histScore = key==="recovery" ? null : historical.indices[key].score; // no Historical concept for Recovery
    const hasRealSplit = RACE_DNA_AXES_WITH_REAL_SPLIT.includes(key);
    const adjustment = (hasRealSplit && curScore!=null && histScore!=null) ? round1(curScore-histScore) : (key!=="recovery" ? 0 : null);
    // projected: same bounded weekly-growth assumption predictTime() already uses for the overall HPI,
    // applied per-axis at HALF the full-HPI rate (deliberately more conservative per-axis than the
    // whole-HPI projection, since doc 16 §2-3 warns against over-trusting a single index's trend) and
    // hard-capped to 100.
    // KNOWN LIMITATION (registered for Phase 5, not fixed here — Phase 4's job is the state structure,
    // not a better projection engine): `growth` is ONE shared overall-HPI trend rate applied identically
    // to every axis below (Running/Engine/StrengthEnd/Skill/RaceExec all get the same pt/week number).
    // Phase 5 target: replace this with each axis's OWN trend + Trainability + per-segment projected
    // change (segment->Index mapping via STATION_PARENT_INDEX and the Conservative/Realistic/Aggressive
    // segment-potential calc in buildSegmentGapAnalysis()/computeGoalScenarios() already exist and are
    // the natural inputs — this is a connection job, not a new engine, per the Phase 3 finding that the
    // model's weakness is specifically in per-axis future-trend direction, not current-state estimation).
    const projected = curScore!=null ? clamp(round1(curScore + growth*weeksToRace*0.5), 0, 100) : null;
    result[key] = {
      historical: histScore, adjustment, current: curScore, projected,
      confidence: current.indices[key].confidence,
      source: histScore!=null ? "실제 대회 기록/PB" : (key==="recovery" ? "훈련 추세 신호 (대회 근거 없음)" : "데이터 부족"),
      hasHistoricalConcept: key!=="recovery",
      hasRealTierSplit: hasRealSplit, // false = Historical/Current 구분이 아직 이 Index엔 실제로 구현되어 있지 않음(솔직히 표시)
    };
  });
  return { axes: result, weeksToRace, growthPerWeek: round1(growth||0) };
}

function buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race }){
  const have=segments.filter(s=>s.percentile!=null);
  const strongest=[...have].sort((a,b)=>b.percentile-a.percentile)[0];
  const top=impactList.slice(0,3).filter(c=>c.impactPct>0.5);
  const sentences=[];
  if(strongest){
    // per-segment gate (spec §2): percentile language only for THIS segment if it individually
    // cleared MIN_REAL_SAMPLE real records — a globally "connected" DB doesn't make every segment real.
    const rankPhrase = strongest.peerIsReal
      ? `아시아 동일 그룹 상위 ${round1(100-strongest.percentile)}% 수준(${strongest.star.label})`
      : `그룹 평균 대비 ${strongest.star.label} 수준(예시 추정 모델 기준)`;
    sentences.push(`${strongest.label}${strongest.kind==="run"?" 구간":""}은 ${rankPhrase}으로 강점입니다.`);
  }
  if(top[0]){
    const t0=top[0];
    const lossStr = t0.timeLoss>=0 ? `약 ${fmtTime(Math.abs(t0.timeLoss))} 손실` : `오히려 ${fmtTime(Math.abs(t0.timeLoss))} 이득`;
    sentences.push(`반면 ${t0.label}은 평균 대비 ${lossStr}이 발생하며 전체 기록 개선 여지가 가장 큰 구간입니다(영향도 ${round1(t0.impactPct)}%).`);
  }
  if(roxzone && roxzone.timeLoss!=null){
    if(roxzone.timeLoss>3) sentences.push(`Roxzone 전환 시간도 평균보다 느려 총 ${fmtTime(roxzone.timeLoss)}를 추가로 잃고 있습니다.`);
    else if(roxzone.timeLoss<-3) sentences.push(`Roxzone 전환은 평균보다 ${fmtTime(Math.abs(roxzone.timeLoss))} 빨라 강점 구간입니다.`);
  }
  if(top.length){
    sentences.push(`현재 가장 효과적인 개선 순서는 ${top.map(t=>t.label).join(" → ")}입니다.`);
  }
  if(strengthIdx.fatigueResistance!=null && strengthIdx.fatigueResistance<50){
    sentences.push(`레이스 후반부(Lunge·Wall Ball)에서 초반 대비 퍼포먼스가 저하되는 패턴이 있어, 페이싱 전략과 후반 지구력 훈련을 함께 점검하는 것이 좋습니다.`);
  }
  return sentences.join(" ");
}

/* 9c. GOAL SIMULATION — "이 구간을 N초 개선하면 최종 기록이 얼마나 단축되는가" */
/* ---------------------------------------------------------------------- */
function simulateGoal(baseTotalSec, runPaceImproveSecPerKm, stationImprovements){
  // stationImprovements: { key: seconds }
  const steps=[];
  let running=baseTotalSec;
  steps.push({ label:"현재 기록", value:running });
  if(runPaceImproveSecPerKm){
    const delta=runPaceImproveSecPerKm*8;
    running -= delta;
    steps.push({ label:`Run Pace ${runPaceImproveSecPerKm>0?"-":"+"}${Math.abs(runPaceImproveSecPerKm)}초/km (×8km)`, value:running, delta:-delta });
  }
  STATIONS.forEach(s=>{
    const imp=Number(stationImprovements[s.key])||0;
    if(imp){ running -= imp; steps.push({ label:`${s.label} ${imp>0?"-":"+"}${Math.abs(imp)}초`, value:running, delta:-imp }); }
  });
  return { steps, finalTotal:running, totalSaved: baseTotalSec-running };
}

function svgRadar(indices, size=280){
  const keys=Object.keys(INDEX_WEIGHTS);
  const n=keys.length; const cx=size/2, cy=size/2, r=size*0.36;
  const angle=(i)=> -Math.PI/2 + i*(2*Math.PI/n);
  const rings=[0.25,0.5,0.75,1];
  let grid="";
  rings.forEach(f=>{
    const pts=keys.map((k,i)=>{ const a=angle(i); return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`; }).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="#28282C" stroke-width="1"/>`;

  const dataPts=keys.map((k,i)=>{ const a=angle(i); const v=clamp((indices[k].score??0)/100,0,1); return `${cx+Math.cos(a)*r*v},${cy+Math.sin(a)*r*v}`; }).join(" ");
  let labels="";
  keys.forEach((k,i)=>{
    const a=angle(i); const lx=cx+Math.cos(a)*(r+26), ly=cy+Math.sin(a)*(r+26);

    labels+=`<text x="${lx}" y="${ly-3}" text-anchor="${anchor}" font-family="Pretendard, sans-serif" font-size="10" fill="#9497A0">${INDEX_META[k].friendly}</text>`;

  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">
    ${grid}
    <polygon points="${dataPts}" fill="rgba(255,90,31,.22)" stroke="#FF5A1F" stroke-width="2"/>

    ${labels}
  </svg>`;
}

function svgLineTrend(points, w=560, h=140, opts={}){
  if(!points.length) return `<div class="empty-note">데이터가 쌓이면 추이가 표시됩니다</div>`;
  const pad=28;
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs)||1;
  const minY = opts.minY!=null? opts.minY : Math.min(...ys)*0.95;
  const maxY = opts.maxY!=null? opts.maxY : Math.max(...ys)*1.05;
  const sx=(x)=> pad + (maxX===minX?0:(x-minX)/(maxX-minX))*(w-pad*2);
  const sy=(y)=> h-pad - (maxY===minY?0:(y-minY)/(maxY-minY))*(h-pad*2);
  const path=points.map((p,i)=> `${i===0?"M":"L"}${sx(p.x)},${sy(p.y)}`).join(" ");
  const area=`${path} L${sx(xs[xs.length-1])},${h-pad} L${sx(xs[0])},${h-pad} Z`;
  const dots=points.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3" fill="#FF5A1F"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#28282C"/>
    <path d="${area}" fill="rgba(255,90,31,.12)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#FF5A1F" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function raceStrip(race){
  if(!race) return `<div class="empty-note">등록된 대회 기록이 없습니다</div>`;
  const b=bench();
  const segs=[];
  for(let i=1;i<=8;i++){
    const runSec=parseTimeToSec(race.runs?.[i]);
    segs.push({ kind:"run", label:`R${i}`, sec:runSec, ref:b.runKm });
    if(i<=8 && STATIONS[i-1]){
      const s=STATIONS[i-1]; const sec=parseTimeToSec(race.stations?.[s.key]);
      segs.push({ kind:"station", label:s.label.split(" ")[0], sec, ref:b[s.key] });
    }
  }
  const maxSec=Math.max(10,...segs.map(s=>s.sec||0));
  const bars=segs.map(s=>{
    const hpx = s.sec? Math.max(6,(s.sec/maxSec)*64) : 4;
    const over = s.sec && s.ref ? s.sec>s.ref*1.1 : false;
    return `<div class="seg ${s.kind}" style="height:${hpx}px; ${over?'filter:brightness(1.3) hue-rotate(-15deg);':''}" title="${s.label}: ${s.sec?fmtTime(s.sec):'—'}"></div>`;
  }).join("");
  const labels=segs.map(s=>`<span>${s.kind==='run'?s.label:''}</span>`).join("");
  return `<div class="race-strip">${bars}</div><div class="race-strip-labels">${labels}</div>`;
}

// date fields are plain text inputs (native <input type=date> renders inconsistently/unstyleable on
// iOS Safari) — auto-insert dashes as the person types digits, e.g. "20260601" -> "2026-06-01"
function initDateTextMasking(){
  document.addEventListener("input",(e)=>{
    if(e.target.tagName==="INPUT" && e.target.getAttribute("pattern")==="[0-9]{4}-[0-9]{2}-[0-9]{2}"){
      const digits=e.target.value.replace(/[^0-9]/g,"").slice(0,8);
      let formatted=digits;
      if(digits.length>4) formatted=digits.slice(0,4)+"-"+digits.slice(4);
      if(digits.length>6) formatted=digits.slice(0,4)+"-"+digits.slice(4,6)+"-"+digits.slice(6);
      e.target.value=formatted;
    }
  });
}

  const ds=dataStatus();

  const hasSimple = !!fp.completedAt || ds.running || ds.strength || STATE.trainingLog.some(t=>t.source==="quick");
  const hasAdvanced = ds.garmin || STATE.trainingLog.length>=8;
  const level = hasAdvanced ? "Advanced" : hasSimple ? "Personal" : "Basic";
  const META = {
    Basic:    { cls:"basic",    label:"Basic Coach" },
    Personal: { cls:"personal", label:"Personal Coach" },
    Advanced: { cls:"advanced", label:"Advanced Coach" },
  };
  return { level, ...META[level], desc:coachGuidanceMessage(level, ds) };
}
// ---- Guidance message — tailored to exactly which data categories are present/missing,
// so the dashboard nudges the person toward whatever would move their Coach Level forward next.
function coachGuidanceMessage(level, ds){
  ds = ds || dataStatus();
  const fp=STATE.profile.fitnessProfile;
  const hasAnything = ds.race || ds.running || ds.strength || ds.garmin || STATE.trainingLog.length>0 || !!fp.completedAt;
  if(!hasAnything){
    return "아직 입력된 데이터가 없어요! 아래 \"오늘 운동 기록하기\" 또는 \"간단 질문 답변하기\"로 시작해보세요 — 기록이 없어도 목표만 설정하면 기본 분석은 볼 수 있지만, 조금만 입력해도 훈련 강도와 계획이 훨씬 정확해집니다.";
  }
  if(level==="Advanced"){
    return "훈련 기록과 기기 데이터가 꾸준히 쌓이고 있어 피로도·훈련 상태까지 반영한 고도화된 분석을 제공하고 있습니다.";
  }
  if(level==="Personal"){
    if(!ds.race) return "대회 기록은 아직 없지만, 입력해주신 운동 정보를 바탕으로 기초 분석과 훈련 방향을 제공하고 있습니다. 대회 기록을 추가하면 예측 정확도가 크게 올라갑니다.";
    const missing=[];
    if(!ds.running) missing.push("러닝");
    if(!ds.strength) missing.push("근력");
    if(!ds.garmin) missing.push("Garmin/기기 연동");
    const missingText = missing.length? `${missing.join("·")} 데이터를 추가하면 ` : "꾸준히 기록을 쌓으면 ";
    return `입력하신 운동 정보를 반영해 훈련 강도와 우선순위를 조정하고 있습니다. ${missingText}더 정교해집니다.`;
  }
  // level === "Basic" but hasAnything is true — race exists (the only way to reach Basic + hasAnything)
  if(ds.race){
    return "현재 HYROX 경기 기록을 기반으로 분석하고 있습니다. 운동 기록을 추가하면 훈련 강도와 주간 계획을 더 정밀하게 조정할 수 있습니다.";
  }
  return "아직 데이터가 충분하지 않아 기본 분석만 제공하고 있습니다. \"오늘 운동 기록하기\" 또는 \"간단 질문 답변하기\"로 조금만 채워도 훈련 강도와 계획이 더 정교해집니다.";
}

// self-reported hardest-station narrative: only speaks about what's missing / self-reported,
// never converts the subjective rating into a fabricated time. Actual data always wins if present.
function fitnessProfileNarrative(asArray=false){
  const fp=STATE.profile.fitnessProfile;
  if(!fp.completedAt) return asArray ? [] : "";
  const meta=getStationDataMeta();
  const parts=[];
  if(fp.hardestStations && fp.hardestStations.length){
    fp.hardestStations.filter(k=>k!=="unknown").forEach(key=>{
      const st=STATIONS.find(s=>s.key===key);
      if(!st) return;
      if(!meta[st.key]){
        parts.push(`${st.label} 실제 기록이 없어 정확한 성능 평가는 어렵지만, 사용자가 가장 어려운 Station 중 하나로 평가했기 때문에 초기 훈련에서는 ${st.label}을(를) 우선적으로 포함합니다.`);
      } else {
        parts.push(`${st.label}은(는) 사용자가 가장 어렵게 느끼는 Station 중 하나이며, 실제 기록도 이를 뒷받침합니다.`);
      }
    });
  }
  // conflict check: self-rated confident/ok on a station where actual data shows a large benchmark gap
  Object.entries(fp.stationSelfRating||{}).forEach(([key,rating])=>{
    if((rating==="confident"||rating==="ok") && meta[key]){
      const sec=parseTimeToSec(meta[key].value);
      const b=bench()[key];
      if(sec && b && sec > b*1.15){
        const st=STATIONS.find(s=>s.key===key);
        if(st) parts.push(`주관적으로는 ${st.label}을(를) 강점으로 느끼지만, 실제 기록은 벤치마크 대비 개선 여지가 있는 것으로 나타납니다.`);
      }
    }
  });
  return asArray ? parts : parts.join(" ");
}

const PACE_RELEVANT_ACTIVITIES = ["running","row","ski"];
// ---- draft persistence across true page reloads (spec: mobile OS can reload/suspend a backgrounded
// tab when switching to another app — in-memory-only draft variables like QL_DRAFT/RC_PREFILL don't
// survive that, only STATE (via StorageService) does. These write the in-progress draft to
// localStorage on every change so a reload restores exactly what was being typed. Drafts older than
// 12h are treated as stale and ignored, not resurrected.) ----
function saveLocalDraft(key, value){ try{ localStorage.setItem(`hps:draft:${key}`, JSON.stringify({ value, savedAt:Date.now() })); }catch(e){} }
function loadLocalDraft(key, maxAgeMs=1000*60*60*12){
  try{
    const raw=localStorage.getItem(`hps:draft:${key}`);
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed || parsed.value==null) return null;
    if(Date.now()-parsed.savedAt > maxAgeMs) return null;
    return parsed.value;
  }catch(e){ return null; }
}
function clearLocalDraft(key){ try{ localStorage.removeItem(`hps:draft:${key}`); }catch(e){} }

let QL_DRAFT=null;
// resolves the effective amount string, expanding "custom" (직접입력) into "Xkm"/"X분" so the
// rest of the pipeline (parseQuickAmount, notes, pace-pair detection) can treat it identically
// to a preset choice
function effectiveQuickAmount(entry){
  if(entry.amount!=="custom") return entry.amount;
  const kind=AMOUNT_KIND[entry.activity];
  if(!entry.customAmountValue) return null;
  if(kind==="distance") return `${entry.customAmountValue}km`;
  if(kind==="duration") return `${entry.customAmountValue}분`;
  return entry.customAmountValue;
}
function parseQuickAmount(entry){
  let distanceKm=null, durationMin=null;
  const amount=effectiveQuickAmount(entry);
  if(amount){
    if(/km$/.test(amount)){ const km=parseFloat(amount); distanceKm=isNaN(km)?null:km; }
    else if(/분$/.test(amount)){ const min=parseInt(amount,10); durationMin=isNaN(min)?null:min; }
  }
  // optional complementary field the person can add so a real pace can be computed —
  // only applied when it fills the metric the amount choice didn't already cover
  if(distanceKm==null && entry.pairDistanceKm) distanceKm=Number(entry.pairDistanceKm)||null;
  if(durationMin==null && entry.pairDurationMin) durationMin=Number(entry.pairDurationMin)||null;
  return { distanceKm, durationMin };
}
const QUICK_TYPE_MAP = { running:"run", hyrox:"wod", strength:"strength", conditioning:"conditioning", hybrid:"hybrid", row:"wod", ski:"wod", recovery:"recovery", other:"wod" };
// live preview while filling in the interval detail fields — same math used at submit time
// (spec: 반복 페이스는 반복 구간 자체의 페이스만 의미해야 하고, 회복 구간은 포함하지 않음).
function intervalPreviewCalc(d){
  const distM=Number(d.intervalRepDistanceM), count=Number(d.intervalRepCount), repSec=parseTimeToSec(d.intervalRepTimeStr);
  if(!distM || !count || !repSec) return null;
  const workKm = (distM*count)/1000;
  const workPaceSecKm = Math.round(repSec/(distM/1000));
  return { workKm, workPaceSecKm };
}
function submitQuickLog(entry){
  const parsed=parseQuickAmount(entry);
  let type=QUICK_TYPE_MAP[entry.activity]||"wod";
  if(entry.activity==="running" && entry.runSubType) type=RUN_SUBTYPE_TO_TYPE[entry.runSubType]||"run";
  const feelingLabel=(FEELING_OPTIONS.find(f=>f.key===entry.feeling)||{}).label||"";
  const effAmount=effectiveQuickAmount(entry);
  const noteParts=[];
  // ---- structured interval fields (spec) ----
  // Work Volume/Interval Work Pace are computed from the rep-only fields (distance/count/rep time) —
  // recovery time is used only for total session duration, never folded into the work pace itself.
  let intervalFields = { intervalRepDistanceM:null, intervalRepCount:null, intervalRepTimeSec:null,
    intervalRecoveryTimeSec:null, intervalRecoveryType:null, intervalWorkDistanceKm:null, intervalWorkPaceSecKm:null };
  if(type==="interval"){
    const distM=Number(entry.intervalRepDistanceM)||null;
    const count=Number(entry.intervalRepCount)||null;
    const repSec=parseTimeToSec(entry.intervalRepTimeStr);
    const recSec=parseTimeToSec(entry.intervalRecoveryTimeStr);
    const workKm = (distM && count) ? (distM*count)/1000 : null;
    const workPaceSecKm = (distM && repSec) ? Math.round(repSec/(distM/1000)) : null;
    intervalFields = { intervalRepDistanceM:distM, intervalRepCount:count, intervalRepTimeSec:repSec,
      intervalRecoveryTimeSec:recSec, intervalRecoveryType: entry.intervalRecoveryType==="rest" ? "rest" : (entry.intervalRecoveryType||recSec?"jog":null),
      intervalWorkDistanceKm: workKm!=null?round1(workKm):null, intervalWorkPaceSecKm:workPaceSecKm };
    // Overwrite the rough quick-amount distance/duration with the precise structured values when
    // available — this is strictly more accurate data the person just entered, not a guess.
    if(workKm!=null && repSec!=null && count!=null){
      const totalWorkSec = repSec*count;
      const totalRecSec = (recSec!=null && count>1) ? recSec*(count-1) : 0;
      parsed.distanceKm = round1(workKm);
      parsed.durationMin = round1((totalWorkSec+totalRecSec)/60);
    }
    const ivSummary = (distM&&count&&entry.intervalRepTimeStr)
      ? `${distM}m×${count} / 반복 ${entry.intervalRepTimeStr}${entry.intervalRecoveryTimeStr?` / 회복 ${entry.intervalRecoveryTimeStr}`:""} / ${intervalFields.intervalRecoveryType==="rest"?"정지 휴식":"조깅 회복"}`
      : "";
    if(ivSummary) noteParts.push(ivSummary);
  }
  if(effAmount) noteParts.push(effAmount);
  if(feelingLabel) noteParts.push(`컨디션: ${feelingLabel}`);
  if(entry.note) noteParts.push(entry.note);
  // ---- HR Drift (spec §5) ----
  // ONLY computed when the person actually provided both first-half and second-half average HR for
  // this session — never derived from a single overall avgHr/maxHr/restingHr. Restricted to non-interval
  // run types in the UI itself (interval reps/recovery have wildly different paces by design, so a
  // "same/similar pace" assumption wouldn't hold there). Left "" (falsy) otherwise, which every existing
  // consumer of hrDrift already treats as "no data" — never fabricated.
  let hrDrift="";
  const fh=Number(entry.firstHalfAvgHr), sh=Number(entry.secondHalfAvgHr);
  if(fh && sh) hrDrift = round1(((sh-fh)/fh)*100);
  STATE.trainingLog.push({ id:uid(), date:entry.date||todayISO(), type,
    distanceKm:parsed.distanceKm, durationMin:parsed.durationMin,
    avgPaceSecKm:(parsed.distanceKm && parsed.durationMin)? Math.round((parsed.durationMin*60)/parsed.distanceKm) : null,
    avgHr:Number(entry.avgHr)||null, maxHr:Number(entry.maxHr)||null, restingHr:Number(entry.restingHr)||null,
    firstHalfAvgHr:fh||null, secondHalfAvgHr:sh||null,
    hrDrift, recoveryDrop:"", intensityRpe:entry.rpe,
    painFlag:entry.painFlag==="yes", painArea:(entry.painArea||"").trim(),
    note:noteParts.join(" · "), source:entry.detailOpen?"manual":"quick",
    ...intervalFields });
  // 최고 심박은 러닝 페이지의 심박존 계산용 Max HR 추정에도 쓰일 수 있도록, 여기 입력한 값이 기존
  // 추정치(최근 평균심박×1.05)보다 크면 그대로 신뢰(실측값이 추정치보다 우선). restingHr은 기존
  // restingHrLog(Apple Health 안정시 심박과 동일한 저장소)에 함께 적재해 심박 기준값 추정에 반영됩니다.
  // source를 함께 저장해 자동 import 데이터와 구분하되(spec §7), 아래 restingHrTrend() 등 Rule Engine
  // 소비 지점에서는 source에 관계없이 동일한 {date,value} 구조로 취급합니다.
  if(entry.restingHr && !isNaN(Number(entry.restingHr))){
    STATE.restingHrLog.push({ date:entry.date||todayISO(), value:Math.round(Number(entry.restingHr)), source:"manual" });
  }
  // auto-write PBs into their dedicated fields — never fabricated, only written when the person
  // explicitly confirms a PB was achieved today
  if(entry.activity==="running" && entry.pbAchieved && entry.pbDistance && entry.pbTime){
    const opt=PB_DISTANCE_OPTIONS.find(o=>o.key===entry.pbDistance);
    if(opt) STATE.running[opt.field]=entry.pbTime;
  }
  if(entry.activity==="strength" && entry.strengthPbAchieved && entry.strengthPbLift && entry.strengthPbValue){
    STATE.strength[entry.strengthPbLift]=entry.strengthPbValue;
  }
  recordHpiSnapshot();
  persist();
}
function openQuickLogModal(){
  const savedDraft = loadLocalDraft("quicklog");
  QL_DRAFT = savedDraft || { date: todayISO(), activity:null, amount:null, customAmountValue:"", pairDistanceKm:"", pairDurationMin:"", rpe:null, feeling:null, detailOpen:false,
    avgHr:"", maxHr:"", restingHr:"", firstHalfAvgHr:"", secondHalfAvgHr:"", painFlag:"", painArea:"", note:"",
    runSubType:null, intervalRepDistanceM:"", intervalRepCount:"", intervalRepTimeStr:"", intervalRecoveryTimeStr:"", intervalRecoveryType:"jog",
    pbAchieved:false, pbDistance:null, pbTime:"",
    strengthPbAchieved:false, strengthPbLift:null, strengthPbValue:"" };
  if(!QL_DRAFT.date) QL_DRAFT.date = todayISO(); // backward-compat: drafts saved before the date field existed
  renderQuickLogModal();
  openModal();
  // delegated on the panel itself (survives renderQuickLogModal's innerHTML rewrites) — one listener
  // covers every field, including the several that don't trigger a re-render.
  document.getElementById("modal-panel")?.addEventListener("change", ()=>saveLocalDraft("quicklog", QL_DRAFT));
  if(savedDraft) showToast("이전에 작성 중이던 기록을 불러왔습니다");
}

    <div style="margin-top:14px;"><div style="font-size:13px;font-weight:700;margin-bottom:2px;">Q1. 일주일에 보통 몇 번 운동하나요?</div>
      <div class="qbtn-grid">${WEEKLY_FREQ_OPTIONS.map(o=>`<div class="qbtn ${d.weeklyFreq===o.key?"on":""}" data-fs="weeklyFreq" data-val="${o.key}">${o.label}</div>`).join("")}</div></div>

      <div class="qbtn-grid">${RUNNING_FREQ_OPTIONS.map(o=>`<div class="qbtn ${d.runningFreq===o.key?"on":""}" data-fs="runningFreq" data-val="${o.key}">${o.label}</div>`).join("")}</div></div>

      <div class="qbtn-grid">${PB5K_OPTIONS.map(o=>`<div class="qbtn ${d.pb5kRange===o.key?"on":""}" data-fs="pb5kRange" data-val="${o.key}">${o.label}</div>`).join("")}</div></div>

      <div class="qbtn-grid">${STATIONS.map(s=>`<div class="qbtn ${d.hardestStations.includes(s.key)?"on":""}" data-fs-multi="hardestStations" data-val="${s.key}">${s.label}</div>`).join("")}<div class="qbtn ${d.hardestStations.includes("unknown")?"on":""}" data-fs-multi="hardestStations" data-val="unknown">모르겠음</div></div></div>

      <div style="display:flex;flex-direction:column;gap:7px;">
        ${STATIONS.map(s=>`<div class="hstack" style="justify-content:space-between;gap:8px;">
          <span style="font-size:11.5px;color:var(--gray);width:104px;flex-shrink:0;">${s.label}</span>
          <div style="display:flex;gap:5px;">${STATION_RATING_OPTIONS.map(r=>`<span class="qbtn ${(d.stationSelfRating[s.key]===r.key)?"on":""}" data-fs-station="${s.key}" data-val="${r.key}" style="padding:5px 8px;font-size:14px;">${r.label}</span>`).join("")}</div>
        </div>`).join("")}
      </div></div>
    <div style="margin-top:16px;"><div style="font-size:13px;font-weight:700;margin-bottom:2px;">Q6. 일주일에 HYROX 훈련을 몇 번 할 수 있나요?</div>
      <div class="qbtn-grid">${AVAILABILITY_OPTIONS.map(o=>`<div class="qbtn ${d.weeklyAvailability===o.key?"on":""}" data-fs="weeklyAvailability" data-val="${o.key}">${o.label}</div>`).join("")}</div></div>

  panel.querySelectorAll("[data-fs-multi]").forEach(b=>b.addEventListener("click",()=>{

    const arr = FS_DRAFT[field] || (FS_DRAFT[field]=[]);
    if(val==="unknown"){
      // "모르겠음" is exclusive — picking it clears any specific stations, and vice versa
      FS_DRAFT[field] = arr.includes("unknown") ? [] : ["unknown"];
    } else {
      const withoutUnknown = arr.filter(v=>v!=="unknown");

    showToast("답변이 저장되었습니다 — 훈련계획에 반영됩니다");
    renderAll();
  });
}

      <div class="row-between" style="padding:2px 0;"><span style="font-size:11px;color:var(--gray-dim);">데이터</span><span style="font-size:12.5px;font-weight:600;">${r.benchmark.scope==='event' ? `${escapeHtml(r.eventName||'해당 대회')} · ${r.benchmark.n.toLocaleString()}명` : `Asia 전체 · ${r.benchmark.n.toLocaleString()}명`}</span></div>

        <summary style="cursor:pointer;font-size:11.5px;color:var(--gray-dim);">📊 산출 근거 자세히 보기 (관리자/디버그용)</summary>
        <div style="margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:12px;line-height:1.7;">

          <div>적용 Age Group: <b>${r.benchmark.ageGroupUsed || "(완화됨 — Gender+Division만 적용)"}</b></div>

          <div>Tier: <b>${escapeHtml(r.benchmark.tier||"—")}</b></div>

          ${r.benchmark.events && r.benchmark.events.length ? `<div style="margin-top:6px;">사용된 대회 목록:<br>${r.benchmark.events.map(e=>`· ${escapeHtml(e.event)} (n=${e.n}, 3위=${fmtTime(e.third)})`).join("<br>")}</div>` : ""}
        </div>
      </details>
    </div>

    <div class="divider" style="margin:0;"></div>
    <div style="padding:14px 20px 18px;">
      <div class="row-between"><span style="font-size:12px;color:var(--gray);">신뢰도</span><span class="badge ${r.overallConfidence==='HIGH'?'elite':r.overallConfidence==='MEDIUM'?'med':'crit'}">${r.overallConfidence}</span></div>
    </div>
    <div class="divider" style="margin:0;"></div>
    <div style="padding:14px 20px 18px;">
      <button class="btn sm secondary" id="mg-goto-prediction" style="width:100%;justify-content:center;">기록 예측 보러가기</button>
    </div>
  </div>`;
  el.querySelector("#mg-goto-prediction")?.addEventListener("click",()=>{ CURRENT_PAGE="prediction"; renderAll(); });
}

let DASH_INSIGHT_EXPANDED = false;
function statCard(label,val,sub,color){
  const len=String(val).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim().length;
  const fontSize = len>8 ? 14 : len>5 ? 17 : 30;
  return `<div class="card tight">
    <div class="eyebrow gray">${label}</div>
    <div style="font-family:var(--font-display); font-size:${fontSize}px; font-weight:800; color:${color}; margin-top:4px; line-height:1.3; word-break:keep-all;">${val}</div>
    <div style="font-size:10.5px; color:var(--gray-dim); margin-top:2px;">${sub}</div>
  </div>`;
}
function prioClass(p){ return {Critical:"crit",High:"high",Medium:"med",Low:"low"}[p]||"low"; }

// basis -> {label, badge class}: keeps "실제로 측정된 값"과 "기준값(reference)"을 시각적으로 항상 구분한다.
const SEGMENT_BASIS_META = {
  "actual":            { label:"실측",        cls:"elite" },
  "actual-adjusted":   { label:"실측(보정)",   cls:"low" },
  "actual-stale":      { label:"실측(오래됨)", cls:"med" },
  "estimated-training-pace": { label:"훈련로그 추정", cls:"med" },
  "estimated-10k-calibrated": { label:"10K 보정 추정", cls:"med" },
  "benchmark-only":    { label:"Reference",   cls:"crit" },
};
function segmentModelTable(model){
  const rows = model.segments.map(s=>{
    const meta = SEGMENT_BASIS_META[s.basis] || SEGMENT_BASIS_META["benchmark-only"];
    const valSec = s.sec!=null ? s.sec : s.benchmark;
    const isReal = s.sec!=null;
    return `<tr>
      <td style="padding:6px 8px;font-size:12.5px;color:var(--white);">${s.label}</td>
      <td style="padding:6px 8px;"><span class="badge ${meta.cls}">${meta.label}</span></td>
      <td style="padding:6px 8px;font-family:var(--font-mono);font-size:12.5px;color:${isReal?"var(--white)":"var(--gray-dim)"};text-align:right;">${fmtTime(valSec)}</td>
      <td style="padding:6px 8px;font-size:11px;color:var(--gray-dim);text-align:right;">${s.date? `${s.date} (${s.ageDays}일 전)` : "—"}</td>
    </tr>`;
  }).join("");
  return `<div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr style="border-bottom:1px solid var(--line);">
        <th style="padding:6px 8px;text-align:left;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">구간</th>
        <th style="padding:6px 8px;text-align:left;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">근거</th>
        <th style="padding:6px 8px;text-align:right;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">시간</th>
        <th style="padding:6px 8px;text-align:right;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">데이터 시점</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:1px solid var(--line);">
        <td style="padding:8px;font-weight:700;font-size:13px;" colspan="2">합계 (Current Estimate)</td>
        <td style="padding:8px;font-family:var(--font-mono);font-weight:700;font-size:13px;text-align:right;color:var(--orange);" colspan="2">${fmtTime(model.total)}</td>
      </tr></tfoot>
    </table>
  </div>`;
}

// V3 — per-segment Target Gap Decomposition table: allocated share of the total gap + Conservative/
// Realistic/Aggressive potential-improvement ceilings, so a person can see WHY a segment got its share
// (trainability, data confidence) instead of just a number.
const SEGMENT_CONF_META = { high:{label:"데이터 신뢰도 높음",cls:"elite"}, medium:{label:"데이터 신뢰도 보통",cls:"low"}, low:{label:"데이터 신뢰도 낮음",cls:"crit"} };
function segmentTargetGapTable(segmentGap){
  const rows = segmentGap.segments.map(s=>{
    const conf=SEGMENT_CONF_META[s.confidence];
    return `<tr>
      <td style="padding:6px 8px;font-size:12.5px;color:var(--white);">${s.label}</td>
      <td style="padding:6px 8px;"><span class="badge ${conf.cls}" title="${conf.label}">${s.confidence.toUpperCase()}</span></td>
      <td style="padding:6px 8px;font-family:var(--font-mono);font-size:12px;color:var(--red);text-align:right;">-${fmtTime(s.allocatedSec)}</td>
      <td style="padding:6px 8px;font-family:var(--font-mono);font-size:11px;color:var(--gray-dim);text-align:right;">Cons -${fmtTime(s.conservativeSec)}</td>
      <td style="padding:6px 8px;font-family:var(--font-mono);font-size:11px;color:var(--gray-dim);text-align:right;">Aggr -${fmtTime(s.aggressiveSec)}</td>
    </tr>`;
  }).join("");
  const warn = segmentGap.feasibility==="beyond-model"
    ? `<p class="reason-line" style="color:var(--red);margin-top:8px;">이 목표 Gap(${fmtTime(segmentGap.totalGapSec)})은 17개 구간의 Aggressive 개선 합(${fmtTime(segmentGap.sumAggressive)})조차 초과합니다 — 현재 데이터 기준으로는 훈련 강도를 높이는 것만으로 도달하기 어렵습니다. 목표 기록 또는 대회까지 남은 기간 조정을 검토해보세요.</p>`
    : `<p class="reason-line" style="margin-top:8px;color:var(--gray-dim);">Realistic 개선 합: -${fmtTime(segmentGap.sumRealistic)} · Aggressive 개선 합: -${fmtTime(segmentGap.sumAggressive)} ${!segmentGap.hasRaceDate?"· 대회 날짜 미설정 → 8주 기준으로 가정":""}</p>`;
  return `<div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr style="border-bottom:1px solid var(--line);">
        <th style="padding:6px 8px;text-align:left;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">구간</th>
        <th style="padding:6px 8px;text-align:left;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">신뢰도</th>
        <th style="padding:6px 8px;text-align:right;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">현실적 단축 목표</th>
        <th style="padding:6px 8px;text-align:right;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">Conservative</th>
        <th style="padding:6px 8px;text-align:right;font-size:10.5px;color:var(--gray-dim);text-transform:uppercase;">Aggressive</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>${warn}`;
}

function bodyMetricChip(label, field, unit, isPct){
