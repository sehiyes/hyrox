    test:c=>STATE.stationTests.length===0 && STATE.races.length===0,
    action:"전체 스테이션 벤치마크 테스트 권장",
    reason:"등록된 스테이션 기록이 없음" },
  { id:"STA-4", category:"HYROX Station", priority:"Low",
    test:c=>STATIONS.every(s=>{ const sec=parseTimeToSec(latestStationValues()[s.key]); return sec && scoreLowerBetter(sec,c.b[s.key])>85; }),
    action:"현 상태 유지(Maintenance) 세션",
    reason:"전 스테이션 점수 85 이상" },
  { id:"STA-5", category:"HYROX Station", priority:"High",
    // V3 (spec §15): triggers on an ACTUALLY MEASURED station→run degradation, independent of race
    // timing — a >8% post-station slowdown is a real HYROX-specific limiter, not just "raw running fitness".
    test:c=>{
      const deg=computeStationInducedDegradation(latestRace());
      if(!deg.length) return false;
      const top=deg[0];
      return top.degradationSec>0 && (top.degradationSec/top.baselineSec)>0.08;
    },
    action:c=>{ const top=computeStationInducedDegradation(latestRace())[0]; return `${top.label} + Run Brick 세션 우선 편성`; },
    reason:c=>{ const top=computeStationInducedDegradation(latestRace())[0]; return `${top.label} 이후 Run이 해당 경기 평균 대비 +${round1((top.degradationSec/top.baselineSec)*100)}% 느려짐 (Station-induced degradation 측정치)`; } },

  // ---------------- Race Preparation Rules ----------------
  { id:"RACE-1", category:"Race Preparation", priority:"Critical",
    test:c=>c.dLeft!=null && c.dLeft<=7 && c.dLeft>=0,
    action:"Taper 강제 적용 — 고강도 세션 금지",
    reason:c=>`대회까지 ${c.dLeft}일`},
  { id:"RACE-2", category:"Race Preparation", priority:"High",
    test:c=>c.wLeft!=null && c.wLeft>2 && c.wLeft<=3,
    action:"Full Race Simulation 1회 배치",
    reason:"대회 2~3주 전" },
  { id:"RACE-3", category:"Race Preparation", priority:"Medium",
    test:c=>c.wLeft!=null && c.wLeft>4 && c.wLeft<=6,
    action:"Race-pace Brick 세션(Run+Station 조합) 배치",
    reason:"대회 4~6주 전" },
  { id:"RACE-4", category:"Race Preparation", priority:"Low",
    test:c=>c.wLeft!=null && c.wLeft>10,
    action:"Base 유지, 대회 특이성 훈련 최소화",
    reason:"대회까지 10주 이상 여유" },

  // ---------------- Weekly Planning Rules ----------------
  { id:"WK-1", category:"Weekly Planning", priority:"High",
    test:c=>c.counts7.wod+c.counts7.interval>3,
    action:"고강도 세션 1회를 Recovery로 대체",
    reason:"이번 주 고강도 세션이 3회 초과" },
  { id:"WK-2", category:"Weekly Planning", priority:"Medium",
    test:c=>false, // evaluated structurally inside planner (consecutive high-intensity days)
    action:"고강도 세션 사이 Easy/Recovery 삽입",
    reason:"연속 고강도 배치 감지" },
  { id:"WK-3", category:"Weekly Planning", priority:"Medium",
    test:c=>Number(STATE.profile.availableHoursPerWeek)>0 && Number(STATE.profile.availableHoursPerWeek)<3,
    action:"세션 수 축소, 세션당 밀도 증가",
    reason:c=>`주간 가용시간 ${STATE.profile.availableHoursPerWeek}시간으로 제한적`},
  { id:"WK-4", category:"Weekly Planning", priority:"Low",
    test:c=>true,
    action:"기본 요일 템플릿 사용",
    reason:"요일별 세부 선호 미설정 (기본값 적용)" },

  // ---------------- Deload Rules ----------------
  { id:"DEL-1", category:"Deload", priority:"High",
    test:c=>c.loadByWeek.length===4 && c.loadByWeek[3]<c.loadByWeek[2] && c.loadByWeek[2]<c.loadByWeek[1] && c.loadByWeek[1]<c.loadByWeek[0],
    action:"이번 주 Deload (볼륨 -30~40%)",
    reason:"4주 연속 훈련 부하 증가 감지" },
  { id:"DEL-2", category:"Deload", priority:"High",
    test:c=>c.painFlags.length>0,
    action:"즉시 Deload + 통증 부위 동작 회피",
    reason:c=>`통증 플래그 감지 (${c.painFlags.map(p=>p.painArea||"부위 미기재").join(", ")})`},
  { id:"DEL-3", category:"Deload", priority:"Medium",
    // V3 (spec §19): triggers on the direct today-decision (shouldDeloadNow), not on "cadence == 4 weeks"
    // — those are now separate questions (this rule; vs the settings-page cadence recommendation).
    test:c=>shouldDeloadNow().needed && !(c.hpiResult.fatigue>85),
    action:"Deload 필요 — 이번 주 볼륨 감축 권장",
    reason:c=>shouldDeloadNow().reasons.join(" · ") },

  // ---------------- Taper Rules ----------------
  { id:"TAP-1", category:"Taper", priority:"Critical",
    test:c=>c.dLeft!=null && c.dLeft<=10 && c.dLeft>3,
    action:"볼륨 -40~60%, 강도는 낮은 세트 수로 유지",
    reason:c=>`대회까지 ${c.dLeft}일 (Taper 구간)`},
  { id:"TAP-2", category:"Taper", priority:"High",
    test:c=>c.dLeft!=null && c.dLeft<=3 && c.dLeft>=0,
    action:"완전 휴식 또는 가벼운 Shakeout 세션만",
    reason:c=>`대회까지 ${c.dLeft}일`},
  { id:"TAP-3", category:"Taper", priority:"Medium",
    test:c=>c.phase==="Taper" && c.hpiResult.fatigue>60,
    action:"추가 휴식일 편성",
    reason:c=>`Taper 구간인데도 Fatigue Score ${round1(c.hpiResult.fatigue)}로 높음`},

  // ---------------- Injury Prevention Rules ----------------
  { id:"INJ-1", category:"Injury Prevention", priority:"Critical",
    test:c=>c.painFlags.length>0,
    action:"해당 동작 회피 + 재활/의료 상담 권장",
    reason:c=>`통증 보고: ${c.painFlags.map(p=>p.painArea||"부위 미기재").join(", ")}`},
  { id:"INJ-2", category:"Injury Prevention", priority:"High",
    test:c=>c.loadByWeek.length===4 && c.loadByWeek.slice(0,3).every(v=>v>0) && stdev(c.loadByWeek.slice(0,3))/ (mean(c.loadByWeek.slice(0,3))||1) < 0.1,
    action:"훈련 패턴 변형 / 크로스트레이닝 삽입",
    reason:"3주 연속 동일 강도 패턴 반복 (과사용 위험)" },
  { id:"INJ-3", category:"Injury Prevention", priority:"Medium",
    test:c=>false,
    action:"체성분/영양 상태 점검 권장",
    reason:"체지방률 급격 변화 감지" },
  { id:"INJ-4", category:"Injury Prevention", priority:"Low",
    test:c=>c.counts14.recovery===0,
    action:"Mobility 세션 추가",
    reason:"최근 2주 Mobility/Recovery 세션 0회" },
];

function evaluateRules(ctx){
  ctx = ctx || buildRuleContext();
  const fired = RULES.filter(r=>{ try{ return r.test(ctx); }catch(e){ return false; } })
    .map(r=>({ ...r, actionText: typeof r.action==="function"? r.action(ctx): r.action, reasonText: typeof r.reason==="function"? r.reason(ctx): r.reason }));
  fired.sort((a,b)=>PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority]);
  return { ctx, fired };
}

/* ---------------------------------------------------------------------- */
/* 6a-2. COACH INSIGHT — user-facing translation layer over the Rule Engine */
/*     (spec: Rule Engine 계산 로직은 그대로 두고, 결과를 자연어로 변환).      */
/*     Consolidates multiple fired rules that share a category into ONE     */
/*     Coach Insight card (문제→근거→추천), and translates Critical/High/    */
/*     Medium/Low into plain language used only for sort order — never      */
/*     shown to the user as a raw priority label. Rule IDs are attached to  */
/*     each insight for internal/debug use only (e.g. window.__insights)    */
/*     and are never rendered in user-facing markup.                        */
/* ---------------------------------------------------------------------- */
const RULE_CATEGORY_META = {
  Recovery:            { emoji:"🔋", title:"회복 상태" },
  Intensity:           { emoji:"⚡", title:"훈련 강도" },
  Fatigue:             { emoji:"😮‍💨", title:"피로 관리" },
  Running:             { emoji:"🏃", title:"러닝 능력" },
  Strength:            { emoji:"💪", title:"힘 지속력" },
  "HYROX Station":     { emoji:"🎯", title:"HYROX 스테이션 효율" },
  "Race Preparation":  { emoji:"🏁", title:"대회 준비" },
  "Weekly Planning":   { emoji:"📅", title:"주간 훈련 구성" },
  Deload:              { emoji:"📉", title:"훈련량 조절" },
  Taper:               { emoji:"🪶", title:"테이퍼링" },
  "Injury Prevention": { emoji:"🩹", title:"부상 예방" },
};
const PRIORITY_NATURAL = {
  Critical: "지금 가장 먼저 개선해야 할 부분",
  High:     "우선 개선할 부분",
  Medium:   "이번 주 보완하면 좋은 부분",
  Low:      "현재는 유지해도 좋은 부분",
};
// Groups evaluateRules()'s fired list by category (spec §6: "여러 Rule이 같은 문제를 가리키면
// 하나로 통합") and reframes each group as 문제/근거/추천. Nothing here recomputes anything — every
// piece of text is the SAME reasonText/actionText the Rule Engine already produced per rule; this
// only regroups and relabels them. ruleIds is kept on the object for debugging but must never be
// rendered in user-facing HTML.
// spec (Rule Conflict / Safety Override, user doc §4): a fixed override chain — Injury > Severe
// Fatigue/Recovery > Deload/Taper > Race Urgency > Training Priority > Station Weakness > general.
// The Weekly Plan already enforces this for actual SESSIONS (see recoveryDayOverride etc. in
// generateWeeklyPlan) — this does the equivalent for Coach Insight, which previously built its
// category cards independently and could show e.g. "🏃 러닝 능력 — Threshold Run 추천" in the very
// same week the plan was suppressing every hard session for recovery (regression-test finding).
function computeSafetyOverrideSuppression(fired){
  const criticalIds = fired.filter(r=>r.priority==="Critical").map(r=>r.id);
  const active = criticalIds.some(id=>["INJ-1","FAT-1","REC-1","TAP-1","TAP-2","RACE-1"].includes(id));
  return { active, suppressCategories: active ? ["Running","HYROX Station","Strength","Weekly Planning"] : [] };
}
function buildCoachInsights(ruleResult){
  const byCategory = {};
  ruleResult.fired.forEach(r=>{ (byCategory[r.category] = byCategory[r.category]||[]).push(r); });
  const suppression = computeSafetyOverrideSuppression(ruleResult.fired);
  let insights = Object.entries(byCategory).map(([category, rules])=>{
    rules = [...rules].sort((a,b)=>PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority]);
    const top = rules[0];
    const meta = RULE_CATEGORY_META[category] || { emoji:"📌", title:category };
    return {
      category, emoji:meta.emoji, title:meta.title,
      priority: top.priority, priorityLabel: PRIORITY_NATURAL[top.priority], priorityRank: PRIORITY_ORDER[top.priority],
      evidence: rules.map(r=>r.reasonText),
      actions: [...new Set(rules.map(r=>r.actionText))],
      ruleCount: rules.length,
      ruleIds: rules.map(r=>r.id), // internal/debug only — never render
    };
  });
  if(suppression.active) insights = insights.filter(ins=>!suppression.suppressCategories.includes(ins.category));
  insights.sort((a,b)=>a.priorityRank-b.priorityRank);
  return insights;
}

/* ---------------------------------------------------------------------- */
/* 6b. V3 — PAIN SUBSTITUTION MATRIX (spec §17-18)                         */
/*     Pain is promoted from a simple Fatigue/Recovery penalty to a        */
/*     Training Prescription Modifier: Pain Area -> Affected Movement ->   */
/*     Restricted Exercise -> Alternative Exercise. Never a medical         */
/*     diagnosis — a free-text keyword match only decides which generic    */
/*     exercise categories to avoid, and severe/worsening language always  */
/*     surfaces a "see a professional" note instead of a training plan.    */
/* ---------------------------------------------------------------------- */
const PAIN_AREA_KEYWORDS = {
  knee:     ["무릎","knee"],
  shoulder: ["어깨","shoulder"],
  back:     ["허리","등","back","spine"],
  ankle:    ["발목","ankle"],
  wrist:    ["손목","wrist","팔목","forearm"],
  hip:      ["골반","고관절","hip"],
};
function classifyPainArea(text){
  const t=(text||"").toLowerCase();
  for(const [key,kws] of Object.entries(PAIN_AREA_KEYWORDS)){
    if(kws.some(k=>t.includes(k.toLowerCase()))) return key;
  }
  return t.trim() ? "general" : "general";
}
const PAIN_SEVERE_KEYWORDS = ["심함","심각","악화","기능저하","기능 저하","걷기 힘","움직이기 힘","severe","worsening"];

// each entry restricts a mix of SESSION_LIBRARY types and specific "station:<key>" tags, and points
// to ONE substitute type (+ optional station focus) — deliberately coarse/conservative, not a
// clinical protocol (spec §17 explicitly forbids diagnosing).
const PAIN_MATRIX = {
  knee:     { restrict:["run","interval","long","wod","sim","brick","station:burpee","station:lunge"],
              altType:"station", altStationFocus:"ski",
              note:"무릎 통증: 러닝·점프·버피·런지 제한 → SkiErg + 상체/코어 위주로 대체" },
  shoulder: { restrict:["station:ski","station:wallball","station:row","station:carry"],
              altType:"run", altStationFocus:null,
              note:"어깨 통증: SkiErg·Wall Ball·당기는 동작 제한 → Easy Run + 하체 근력으로 대체" },
  back:     { restrict:["strength","station:sledPush","station:sledPull","station:lunge","station:wallball","wod","sim"],
              altType:"recovery", altStationFocus:null,
              note:"허리 통증: 고중량 근력·Sled·런지·월볼 제한 → 코어 안정화 + 가벼운 유산소로 대체" },
  ankle:    { restrict:["run","interval","long","wod","sim","brick","station:burpee","station:lunge"],
              altType:"station", altStationFocus:"ski",
              note:"발목 통증: 러닝·점프 계열 제한 → SkiErg/Row + 상체 근력으로 대체" },
  wrist:    { restrict:["station:wallball","station:carry","station:sledPush","station:sledPull","station:row"],
              altType:"run", altStationFocus:null,
              note:"손목 통증: Wall Ball·Farmers Carry·Sled·Row 등 그립 부하 제한 → Easy Run + 하체 근력으로 대체" },
  hip:      { restrict:["station:lunge","run","station:sledPush","station:sledPull","interval","wod","sim"],
              altType:"station", altStationFocus:"ski",
              note:"고관절 통증: 런지·러닝·Sled 제한 → SkiErg/Row + 코어로 대체" },
  general:  { restrict:["interval","wod","sim","brick"],
              altType:"recovery", altStationFocus:null,
              note:"통증 부위가 명확히 기재되지 않아 보수적으로 고강도 세션을 제한합니다 — 부위를 구체적으로 기록하면 더 정확한 대체 운동을 제안할 수 있습니다" },
};

// resolves the most recent active pain report (within 5 days) into a restriction set. Returns null
// when there's no recent pain flag at all — the substitution logic below only ever engages when the
// person actually reported something, never speculatively.
function getPainRestrictions(){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-5);
  const recentPain=STATE.trainingLog.filter(l=>l.painFlag && new Date(l.date)>=cutoff).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recentPain.length) return null;
  const latest=recentPain[0];
  const areaKey=classifyPainArea(latest.painArea);
  const matrix=PAIN_MATRIX[areaKey];
  const isSevere=PAIN_SEVERE_KEYWORDS.some(k=>(latest.painArea||"").includes(k));
  return { date:latest.date, ageDays:daysBetween(latest.date, todayISO()), rawArea:latest.painArea||"(부위 미기재)", areaKey, isSevere, ...matrix };
}

// checks ONE planned session (type + optional featured station) against the active pain restriction
// set. Returns null (no change) when nothing overlaps, or a substitution descriptor when it does.
function getExerciseSubstitutions(plannedType, plannedStationKey, painRestrictions){
  if(!painRestrictions) return null;
  const tags=[plannedType, plannedStationKey?`station:${plannedStationKey}`:null].filter(Boolean);
  if(!tags.some(t=>painRestrictions.restrict.includes(t))) return null;
  return { altType:painRestrictions.altType, altStationFocus:painRestrictions.altStationFocus, note:painRestrictions.note,
    areaKey:painRestrictions.areaKey, rawArea:painRestrictions.rawArea };
}

/* ---------------------------------------------------------------------- */
/* 6c. V3 — SESSION PRESCRIPTION ENGINE (spec §12-13)                      */
/*     Turns a session TYPE ("Threshold Run") into an actual prescription   */
/*     (warm-up / main set / cooldown, target RPE, personalized pace) —     */
/*     pace is derived from the athlete's own data in priority order        */
/*     (explicit pace field > recent training log > 5K PB > benchmark),     */
/*     never a fixed population number. Volume is trimmed automatically     */
/*     when recent fatigue is high, instead of a separate manual rule.      */
/* ---------------------------------------------------------------------- */
// personal pace (sec/km) for a given run "kind", following the data-priority order from spec §13.
// Also returns `basis` — the distance/rep-count context the pace was recorded against (spec: long
// run/tempo pace without a distance, or interval pace without a rep-meter distance, is ambiguous —
// pace alone can vary a lot depending on what distance it was actually run at).
function personalPace(kind){
  const r=STATE.running;
  const fieldMap={ easy:"easyPace", tempo:"tempoPace", threshold:"thresholdPace", interval:"intervalPace" };
  const basisMap={
    long:     r.longRunDistanceKm ? `기준 ${r.longRunDistanceKm}km 기준` : null,
    tempo:    r.tempoDistanceKm ? `기준 ${r.tempoDistanceKm}km 템포런 기준` : null,
    interval: r.intervalRepM ? `기준 ${r.intervalRepM}m 반복 기준` : null,
  };
  // priority order (spec): 1) explicit user-set pace  2) structured Interval Work Pace (interval kind
  // only)  3) general recent training-log pace  4) 5K PB  5) Reference Benchmark. An explicit user
  // setting always wins outright — it's never overridden by logged data even if more recent.
  const explicit=fieldMap[kind] ? parseTimeToSec(r[fieldMap[kind]]) : null;
  if(explicit) return { sec:explicit, source:"개인 설정 페이스", basis:basisMap[kind]||null };
  if(kind==="interval"){
    const recentIntervalAvg=recentRunPaceAvg(21,"interval");
    if(recentIntervalAvg) return { sec:recentIntervalAvg, source:"최근 3주 구조화된 Interval Work Pace 기반 (반복 구간만, 회복 제외)", basis:basisMap[kind]||null };
  }
  const recentAvg=recentRunPaceAvg(21);
  if(recentAvg){
    const mult={ easy:1.15, tempo:1.0, threshold:0.95, interval:0.88, race:1.0 }[kind] || 1.0;
    return { sec:recentAvg*mult, source:"최근 3주 훈련 로그 평균 페이스 기반", basis:basisMap[kind]||null };
  }
  const pb5k=parseTimeToSec(r.pb5k);
  if(pb5k){
    const basePace=pb5k/5;
    const mult={ easy:1.25, tempo:1.08, threshold:1.0, interval:0.92, race:1.05 }[kind] || 1.1;
    return { sec:basePace*mult, source:"최근 5K PB 기반 추정", basis:basisMap[kind]||null };
  }
  return { sec:bench().runKm*1.1, source:"개인 데이터 부족 → Reference Benchmark 기반 추정", basis:basisMap[kind]||null };
}

// which station to feature in a Brick/Station-focus session: prefers the station showing the
// biggest measured post-station run degradation (spec §15), falls back to the top-priority
// station-group index from the V3 Training Priority engine.
// spec (simulation finding): the old fallback here just picked the FIRST station in a hardcoded
// per-Index group list (e.g. strengthEnd always defaulted to "sledPush" first, even if Sled Pull or
// Lunge were the athlete's actual larger gap). Now prefers the REAL top entry from
// computeStationPriority() (actual record vs benchmark) whenever real station data exists, and only
// falls back to the generic group-first guess when there's no real station data to work with at all.
function pickFeaturedStationKey(){
  const degradation=computeStationInducedDegradation(latestRace());
  if(degradation.length) return degradation[0].key;
  try{
    const stationPriority=computeStationPriority();
    if(stationPriority.length && stationPriority[0].gapPct>0) return stationPriority[0].key;
  }catch(e){}
  const priority=computeTrainingPriority();
  const groupMap={ engine:["ski","burpee","row"], strengthEnd:["sledPush","sledPull","lunge"], skill:["carry","wallball"] };
  const top=priority.find(p=>groupMap[p.key]);
  return top ? groupMap[top.key][0] : "sledPush";
}

function generateSessionPrescription(type, ctx, stationFocusOverride){
  ctx = ctx || buildRuleContext();
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const volFactor = fatigueHigh ? 0.8 : 1;
  const volumeNote = fatigueHigh ? "최근 fatigue가 높아 volume을 약 20% 줄였습니다" : null;

  if(type==="interval"){
    const pace=personalPace("threshold");
    const ivPace=personalPace("interval");
    const reps=Math.max(3,Math.round(4*volFactor));
    const repM=Number(STATE.running.intervalRepM)||null;
    const mainBlock = repM
      ? `${reps} × ${repM}m @ Interval Pace ${fmtTime(ivPace.sec*(repM/1000))} (동일 거리 조깅 회복) — ${ivPace.source}${ivPace.basis?` · ${ivPace.basis}`:""}`
      : `${reps} × 8분 @ Threshold (2분 Easy 회복)`;
    return { title:"Threshold Run", purpose:"Running Gap 감소",
      blocks:["15분 Easy 웜업", mainBlock, "10분 쿨다운"],
      targetRpe:"7-8", pace:`${fmtTime(pace.sec)}/km (${pace.source})`, volumeNote };
  }
  if(type==="brick"){
    const stKey = stationFocusOverride || pickFeaturedStationKey();
    const station=STATIONS.find(s=>s.key===stKey) || STATIONS[1];
    const reps=Math.max(3,Math.round(4*volFactor));
    return { title:`${station.label} + Run Brick`, purpose:`${station.label} 이후 Run pace degradation 개선`,
      blocks:["Warm-up 10분", `${station.label} → 400~600m Run → 반복 (총 ${reps}세트)`],
      targetRpe:"7-8", pace:null, volumeNote };
  }
  if(type==="station"){
    const stKey = stationFocusOverride || pickFeaturedStationKey();
    const station=STATIONS.find(s=>s.key===stKey) || STATIONS[0];
    const reps=Math.max(4,Math.round(6*volFactor));
    return { title:`${station.label} Focus`, purpose:`${station.label} 약점 보강`,
      blocks:["Warm-up 10분", `${station.label} ${reps}세트 (레이스 페이스보다 약간 낮은 강도, 세트 간 90초 휴식)`, "쿨다운 5분"],
      targetRpe:"6-7", pace:null, volumeNote };
  }
  if(type==="sim"){
    return { title:"Full HYROX Simulation", purpose:"Race execution / pacing 훈련",
      blocks:["Warm-up 15분", "8 Run + 8 Station 실전 시뮬레이션 (레이스 페이싱 목표)"],
      targetRpe:"9", pace:null, volumeNote };
  }
  if(type==="run"){
    const pace=personalPace("easy");
    return { title:"Easy Run", purpose:"유산소 베이스 유지",
      blocks:[`${Math.round(35*volFactor)}분 Zone2 지속주`],
      targetRpe:"4-5", pace:`${fmtTime(pace.sec)}/km (${pace.source})`, volumeNote };
  }
  if(type==="long"){
    // spec fix: "Long run" prescription now uses Long Run Pace + the athlete's own reference distance
    // (STATE.running.longRunDistanceKm) instead of a flat easy-pace minute count, so it actually matches
    // what "long run" means for this athlete rather than a generic duration.
    const pace=personalPace("long");
    const distKm=Number(STATE.running.longRunDistanceKm)||null;
    const mainBlock = distKm
      ? `${distKm}km Zone2 지속주${pace.basis?` (${pace.basis})`:""}`
      : `${Math.round(70*volFactor)}분 Zone2 지속주 (기준 거리 미설정 — Running 페이지에서 입력 시 거리 기준으로 처방됩니다)`;
    return { title:"Long Run", purpose:"거리 기반 유산소 베이스",
      blocks:[mainBlock],
      targetRpe:"5", pace:`${fmtTime(pace.sec)}/km (${pace.source})`, volumeNote };
  }
  if(type==="strength"){
    const s=STATE.strength;
    const loadNote = (s.squat||s.deadlift) ? `최근 기록 기준 (Squat ${s.squat||"—"}kg / Deadlift ${s.deadlift||"—"}kg)` : "체중 기준 강도 조절 (기록 입력 시 개인화)";
    return { title:"Strength Session", purpose:"Squat/Deadlift 위주 근력-지구력",
      blocks:["Warm-up 10분", `Squat·Deadlift 4x5 (${loadNote})`, "보조 근력 3세트"],
      targetRpe:"6-7", pace:null, volumeNote };
  }
  if(type==="recovery"){
    return { title:"Recovery / Mobility", purpose:"회복 촉진",
      blocks:["가벼운 유산소 20분 (Zone1)", "모빌리티/스트레칭 15분"], targetRpe:"2-3", pace:null, volumeNote:null };
  }
  if(type==="shakeout"){
    return { title:"Shakeout", purpose:"신경계 각성 유지, 피로 축적 없이",
      blocks:["20분 매우 가벼운 조깅 + 스트라이드 4x20초"], targetRpe:"2", pace:null, volumeNote:null };
  }
  return null; // rest / box: no structured prescription needed
}

function boxCategoryFor(type){
  return { "웨이트":"strength", "하이브리드":"wod", "컨디셔닝":"wod" }[type] || null;
}
// spec §7: box exposure is judged by the ACTUAL stations selected for that box day, not by
// text-matching "sled" in the type/label (a "하이브리드" box could easily include Sled Push/Pull and
// the old approach would never know). Falls back to an empty list (unknown) when nothing was selected
// — never guessed from the label text.
function boxSessionStations(box){ return Array.isArray(box.stations) ? box.stations : []; }
// spec §9: heavy/fatigue-costly stations get a slightly higher weekly cap (2) than lighter ones (1),
// mirroring the same LOAD_VARIABLE_STATIONS grouping already used elsewhere for fatigue weighting.
function stationWeeklyCap(stationKey){ return LOAD_VARIABLE_STATIONS.includes(stationKey) ? 2 : 1; }

/* 5c-2. COMPLETE ADD-ON SESSION GENERATOR (spec)                          */
/*     "약점 Station = 그 Station만 5~10분 추가" 규칙을 제거. 원인(어떤       */
/*     능력이 부족한가) → 목적 → 훈련 유형 → 구체적 세션(거리/횟수/RPE) 순    */
/*     서로 완성된 세션을 만든다. 대부분 기존 generateSessionPrescription()   */
/*     의 same 거리/페이스/피로 스케일링 로직을 재사용 — 새 숫자 체계를        */
/*     따로 만들지 않는다.                                                  */
/* ---------------------------------------------------------------------- */
// spec §4: Run + Station brick rep amounts per station (kept as ranges, not a single fixed number —
// generateStationAddOnSession scales the ROUND COUNT by fatigue/race-phase, not these reps).
const STATION_BRICK_REPS = {
  sledPush:"Sled Push 25m", sledPull:"Sled Pull 25m", burpee:"Burpee Broad Jump 10~20회",
  lunge:"Sandbag Lunge 20~30m", wallball:"Wall Ball 15~25회", carry:"Farmer Carry 50m",
  ski:"SkiErg 300m", row:"Row 300m",
};
// spec §3/§6/§9: HYROX race-performance weakness -> Run+Station brick (trains "performing the station
// under running fatigue", the actual race skill) rather than an isolated station-only rep scheme.
// Round count scales down near race day / when fatigue is high (spec §10), same volFactor convention
// used everywhere else in this file.
function buildStationAddOnSession(stationKey, ctx){
  const station = STATIONS.find(s=>s.key===stationKey);
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const volFactor = fatigueHigh ? 0.8 : 1;
  const dRace=daysToRace();
  const weeksToRace = dRace!=null ? clamp(dRace/7,0.5,52) : 8;
  const baseRounds = weeksToRace<2 ? 2 : weeksToRace<4 ? 3 : 4; // fewer rounds close to race day
  const rounds = Math.max(2, Math.round(baseRounds*volFactor));
  const rep = STATION_BRICK_REPS[stationKey] || `${station.label} 반복`;
  const parentIndex = STATION_PARENT_INDEX[stationKey];
  return {
    title: `🔥 HYROX ${INDEX_META[parentIndex]?.friendly || "Strength Endurance"}`,
    purpose: `${station.label} 자체의 힘보다 "${station.label} 이후 다시 달리는 능력"을 개선하기 위한 세션입니다.`,
    blocks: [`Warm-up 10분`, `500m Run → ${rep} → 500m Run → ${rep} × ${rounds} rounds`],
    targetRpe:"7-8", pace:null,
    volumeNote: fatigueHigh? "최근 fatigue가 높아 라운드 수를 줄였습니다" : null,
  };
}
// spec: "매번 Run+Station brick도 안 된다" — 같은 Station이 이번 주 다시 뽑히더라도 매번 똑같은
// 훈련 유형을 반복하지 않도록, Station 자체의 반복 수행력(근지구력)을 직접 훈련하는 순수 볼륨
// 세션을 별도로 마련해서 boxAddOnRecommendation에서 첫 번째/두 번째 노출마다 다른 유형을 고른다.
function buildStationVolumeSession(stationKey, ctx){
  const station = STATIONS.find(s=>s.key===stationKey);
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const sets = Math.max(3, Math.round(5*(fatigueHigh?0.8:1)));
  return {
    title: `💪 ${station.label} 근지구력`,
    purpose: `${station.label} 자체의 반복 수행력(근지구력)을 직접 향상시키기 위한 세션입니다.`,
    blocks: [`Warm-up 8분`, `${station.label} ${sets}세트 (레이스 페이스보다 약간 낮은 강도, 세트 간 90초 휴식)`, "쿨다운 5분"],
    targetRpe:"6-7", pace:null,
    volumeNote: fatigueHigh? "최근 fatigue가 높아 세트 수를 줄였습니다" : null,
  };
}
// spec §1/§9: Station 저조가 "기술/리듬" 문제일 가능성 — 짧은 세트를 자주, 짧은 휴식으로 EMOM 형태로
// 수행 리듬과 페이싱을 다듬는 세션. 세 번째 대안으로 순환에 포함해 매번 같은 패턴이 반복되지 않게 한다.
function buildStationTechniqueSession(stationKey, ctx){
  const station = STATIONS.find(s=>s.key===stationKey);
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const rounds = Math.max(6, Math.round(8*(fatigueHigh?0.8:1)));
  const rep = STATION_BRICK_REPS[stationKey] || `${station.label} 반복`;
  return {
    title: `🎯 ${station.label} 기술/리듬`,
    purpose: `${station.label}의 동작 효율과 페이싱 리듬을 다듬기 위한 세션입니다 — 힘보다 일정한 템포 유지가 목표입니다.`,
    blocks: [`Warm-up 8분`, `EMOM ${rounds}분: 매분 시작마다 ${rep} (남은 시간 휴식)`, "쿨다운 5분"],
    targetRpe:"5-6", pace:null,
    volumeNote: fatigueHigh? "최근 fatigue가 높아 EMOM 길이를 줄였습니다" : null,
  };
}
// spec §7: box Station 후반 Running degradation이 특히 큰 경우 — Station → Run 반복(전환 자체를
// 훈련), buildStationAddOnSession과 형태는 비슷하지만 목적이 "전환 속도"로 다르게 표시된다.
function buildTransitionAddOnSession(stationKey, ctx){
  const station = STATIONS.find(s=>s.key===stationKey);  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const rounds = Math.max(3, Math.round(4*(fatigueHigh?0.8:1)));
  return {
    title:"⚡ Transition Training", purpose:`${station.label} 이후 Running 페이스 저하를 줄이기 위한 전환 훈련입니다.`,
    blocks:[`Warm-up 10분`, `${station.label} → 500m Run × ${rounds}`],
    targetRpe:"7-8", pace:null, volumeNote: fatigueHigh? "최근 fatigue가 높아 세트 수를 줄였습니다" : null,
  };
}
// spec §7: Engine/Aerobic 부족 -> Run+Ski/Row/Burpee 복합 컨디셔닝. featuredKey는 실제로 가장 약한
// Engine 계열 Station을 반영해서 세션에 포함시킨다 — 라벨에는 "Burpee 포함"이라고 써놓고 실제 처방은
// 항상 SkiErg+Row로 고정되어 있던 불일치 버그 수정.
const ENGINE_STATION_UNIT = { ski:"SkiErg 300m", row:"Row 300m", burpee:"Burpee Broad Jump 10~20회" };
function buildEngineAddOnSession(ctx, featuredKey){
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const rounds = Math.max(3, Math.round(4*(fatigueHigh?0.8:1)));
  const engineKeys = ["ski","row","burpee"];
  const primary = (featuredKey && ENGINE_STATION_UNIT[featuredKey]) ? featuredKey : "ski";
  const secondary = engineKeys.find(k=>k!==primary) || "row";
  const station = STATIONS.find(s=>s.key===primary);
  return {
    title:"❤️ Engine 컨디셔닝",
    purpose: featuredKey ? `${station.label}을 포함해 심폐 부담이 큰 구간에서의 지속 강도를 향상시키기 위한 세션입니다.` : "SkiErg/Row 등 심폐 부담이 큰 구간에서의 지속 강도를 향상시키기 위한 세션입니다.",
    blocks:[`Run 400m → ${ENGINE_STATION_UNIT[primary]} → Run 400m → ${ENGINE_STATION_UNIT[secondary]} × ${rounds} rounds`],
    targetRpe:"7", pace:null, volumeNote: fatigueHigh? "최근 fatigue가 높아 라운드 수를 줄였습니다" : null,
  };
}
// spec: session TYPE comes from Training Priority FIRST (computeTrainingPriority()'s existing
// Impact×Gap×Trainability×Urgency×Specificity×Recovery engine — reused as-is, no new algorithm).
// Station gap is used ONLY afterward, to decide WHICH station fills the chosen session — never to
// decide what kind of session to run. This replaces the previous structure where a big Station gap
// (e.g. Sled Push/Pull) could dominate every add-on regardless of what the athlete's overall training
// priority actually was (e.g. Running).
function buildGenericHyroxCircuit(ctx){
  const fatigueHigh = ctx.hpiResult.fatigue>65 || shouldDeloadNow().needed;
  const rounds = Math.max(2, Math.round(3*(fatigueHigh?0.8:1)));
  return {
    title:"🎯 HYROX Specific Circuit", purpose:"여러 Station을 연결한 복합 훈련으로 HYROX 실전 적응력을 높이기 위한 세션입니다.",
    blocks:[`Warm-up 10분`, `500m Run → Sled Push 25m → 500m Run → Sandbag Lunge 20~30m → 500m Run → Burpee Broad Jump 10~20회 × ${rounds}`],
    targetRpe:"7-8", pace:null, volumeNote: fatigueHigh? "최근 fatigue가 높아 라운드 수를 줄였습니다" : null,
  };
}
const INDEX_ADDON_SESSION_TYPE = { running:"interval", engine:"engineCircuit", strengthEnd:"hyroxBrick", skill:"hyroxBrick", raceExec:"racePaceBrick" };
// spec: which stations are even eligible candidates for a given Index's session — Running never
// forces a station in; Engine/StrengthEnd/Skill are restricted to their own real HYROX station group
// (previously hyroxBrick could pull from ANY station regardless of which Index was actually driving
// the session, so e.g. an Engine-priority week could end up featuring Sled Push).
const INDEX_STATION_GROUPS = {
  engine: ["ski","row","burpee"],
  strengthEnd: ["sledPush","sledPull","lunge","carry"],
  skill: ["wallball","carry"],
};
// spec: weekly total across ALL hard add-on types (Interval/Engine Circuit/HYROX Brick/Race Pace
// Brick combined) — prevents them piling up on top of an already-substantial week of box sessions.
const MAX_WEEKLY_HARD_ADDONS = 4;
// spec: this week's add-on slots allocated PROPORTIONALLY to each top-3 Index's priorityScore
// (largest-remainder method, same technique already used elsewhere in this file for day-count
// allocation) instead of a flat rotation — Running 80 / Engine 40 / StrengthEnd 20 over 4 box days
// lands ~2/1/1, not an equal split. Interleaved (not blocked) so same-day-adjacent repeats are
// naturally reduced too.
function buildIndexAddOnSequence(trainingPriority, slotCount){
  const top3 = trainingPriority.slice(0,3).filter(p=>INDEX_ADDON_SESSION_TYPE[p.key] && p.priorityScore>0);
  if(!top3.length || slotCount<=0) return [];
  const totalScore = top3.reduce((s,p)=>s+p.priorityScore,0);
  if(totalScore<=0) return [];
  const raw = top3.map(p=>({ key:p.key, exact:(p.priorityScore/totalScore)*slotCount }));
  const counts={}; let used=0;
  raw.forEach(r=>{ counts[r.key]=Math.floor(r.exact); used+=counts[r.key]; });
  const remainder = raw.map(r=>({key:r.key, frac:r.exact-Math.floor(r.exact)})).sort((a,b)=>b.frac-a.frac);
  let idx=0;
  while(used<slotCount && remainder.length){ counts[remainder[idx%remainder.length].key]++; used++; idx++; }
  const seq=[]; const pool={...counts};
  while(seq.length<slotCount){
    let added=false;
    for(const p of top3){ if(pool[p.key]>0){ seq.push(p.key); pool[p.key]--; added=true; if(seq.length>=slotCount) break; } }
    if(!added) break;
  }
  return seq;
}
function boxAddOnRecommendation(box, weekCtx, addOnState){
  const cat = boxCategoryFor(box.type);
  const boxStations = boxSessionStations(box);
  const stationPriority = weekCtx.stationPriority || [];
  const top3 = weekCtx.top3; // Index-level priority (computeTrainingPriority) — the decision starts here now

  // REC-1 safety override (spec/regression finding): a Critical "고강도 세션 전면 금지" week must not
  // get a hard box add-on recommendation either — this is the same override applied to the weekly
  // plan's own slots, extended to cover box add-ons so the two can't contradict each other.
  if(weekCtx.recoveryDayOverride){
    return { text:"이번 주는 회복이 최우선입니다 — 오늘은 박스 세션 외 추가훈련 없이 마무리하세요.", prescription:null };
  }

  if((addOnState.totalHardSessions||0) >= MAX_WEEKLY_HARD_ADDONS){
    return { text:"이번 주 추가훈련이 이미 충분히 배정되었습니다 — 오늘은 박스 세션으로 마무리하세요.", prescription:null };
  }

  // weighted pick from the precomputed proportional sequence tried FIRST; falls back through the
  // rest of top3 in priority order if that particular pick isn't usable today (box already covers
  // it, capped, etc.) — same as before, just seeded by the weighted sequence instead of a flat rotation.
  const seqPick = weekCtx.indexSequence?.[addOnState.sequencePos] ?? null;
  addOnState.sequencePos = (addOnState.sequencePos||0)+1;
  const order = seqPick ? [seqPick, ...top3.filter(k=>k!==seqPick)] : top3;

  for(const idxKey of order){
    if(idxKey==="recovery") continue; // no session TYPE to build for "recovery" — handled by the final fallback below
    // today's box already delivers this Index's typical stimulus -> this priority is satisfied today, try the next one
    if((idxKey==="strengthEnd" && cat==="strength") || ((idxKey==="engine"||idxKey==="skill") && cat==="wod")) continue;
    const sessionType = INDEX_ADDON_SESSION_TYPE[idxKey];
    if(!sessionType) continue;
    const used = addOnState.indexExposure[idxKey]||0;
    if(used>=2) continue; // this Index's weekly add-on budget already spent -> try the next priority instead

    if(sessionType==="interval"){
      if(weekCtx.hasInterval) continue; // already have a real Threshold/Interval day this week -> nothing to add here
      addOnState.indexExposure.running=used+1;
      addOnState.totalHardSessions=(addOnState.totalHardSessions||0)+1;
      const p=generateSessionPrescription("interval", weekCtx.ctx);
      return { text:"이번 주 러닝 자극(Interval/Threshold)이 부족합니다", prescription:{ ...p, purpose:"HYROX Running pace 향상" } };
    }

    // Station gap now only picks WHICH station fills this session — restricted to the Index's OWN
    // real station group (spec: Engine→Ski/Row/Burpee, StrengthEnd→Sled/Lunge/Carry, Skill→Wall
    // Ball/Carry). Race Pace Brick alone connects multiple stations regardless of group, by design.
    // A small gap (<5% slower than benchmark) isn't worth featuring — falls through to the generic
    // circuit/no-op path instead of forcing a marginal station in.
    const MIN_GAP_TO_FEATURE = 0.05;
    const allowedStations = sessionType==="racePaceBrick" ? null : (INDEX_STATION_GROUPS[idxKey] || []);
    const relevantStations = stationPriority.filter(sp=>{
      if(sp.gapPct < MIN_GAP_TO_FEATURE) return false;
      if(boxStations.includes(sp.key)) return false;
      const exposureSoFar=(addOnState.stationExposure[sp.key]||0)+(weekCtx.boxStationCounts[sp.key]||0);
      if(exposureSoFar>=stationWeeklyCap(sp.key)) return false;
      return allowedStations ? allowedStations.includes(sp.key) : true;
    });
    const featured = relevantStations[0];

    if(sessionType==="engineCircuit"){
      addOnState.indexExposure.engine=used+1;
      addOnState.totalHardSessions=(addOnState.totalHardSessions||0)+1;
      if(featured){ addOnState.stationExposure[featured.key]=(addOnState.stationExposure[featured.key]||0)+1; }
      return { text:`Engine 컨디셔닝 보완이 필요합니다${featured?` (${featured.label} 포함)`:""}`, prescription: buildEngineAddOnSession(weekCtx.ctx, featured?.key) };
    }
    if(sessionType==="hyroxBrick"){
      if(!featured) continue; // no eligible station in this Index's own group right now -> try the NEXT priority (spec: don't force a Station in)
      addOnState.indexExposure[idxKey]=used+1;
      addOnState.totalHardSessions=(addOnState.totalHardSessions||0)+1;
      const priorUses=addOnState.stationExposure[featured.key]||0;
      const builder = priorUses===0? buildStationAddOnSession : priorUses===1? buildStationVolumeSession : buildStationTechniqueSession;
      addOnState.stationExposure[featured.key]=priorUses+1;
      addOnState.lastStationKey=featured.key;
      const p=builder(featured.key, weekCtx.ctx);
      // Phase 2-2: name the actual benchmark source when it's real Asia/Global data, not just "기준"
      const srcLabel = { ASIA:"Asia 실측", ASIA_AGE_RELAXED:"Asia 실측(전연령)", GLOBAL_HISTORICAL:"Global 실측",
        GLOBAL_HISTORICAL_AGE_RELAXED:"Global 실측(전연령)", GLOBAL_MATRIX:"Global Matrix" }[featured.benchSource];
      const benchNote = srcLabel ? ` (${srcLabel} 기준, n=${featured.benchSampleN})` : "";
      return { text:`${INDEX_META[idxKey].friendly} 보완 — ${featured.label} 기준보다 ${round1(featured.gapPct*100)}% 느림${benchNote}`, prescription:p };
    }
    if(sessionType==="racePaceBrick"){
      addOnState.indexExposure.raceExec=used+1;
      addOnState.totalHardSessions=(addOnState.totalHardSessions||0)+1;
      const p=generateSessionPrescription("brick", weekCtx.ctx, featured?.key);
      return { text:"Race Execution 보완 — Race Pace Brick", prescription:p };
    }
  }
  // exhausted every priority in top3 with no valid session to add -> either genuinely nothing needed,
  // or every relevant station is capped/covered; a generic multi-station circuit is the last resort
  // rather than forcing any single over-exposed station.
  const anyStrengthEndOrSkillPriority = top3.includes("strengthEnd") || top3.includes("skill");
  if(anyStrengthEndOrSkillPriority && !addOnState.usedGenericCircuit && cat!=="wod" && cat!=="strength"){
    addOnState.usedGenericCircuit=true;
    return { text:"HYROX 복합 훈련 보완", prescription: buildGenericHyroxCircuit(weekCtx.ctx) };
  }
  return { text:"오늘 박스 세션으로 충분합니다. 추가훈련 없음.", prescription:null };
}
function generateWeeklyPlan(ruleResult){
  const { ctx, fired } = ruleResult;
  const phase = ctx.phase;
  const ratio = PHASE_RATIO[phase];
  const critical = fired.filter(r=>r.priority==="Critical");
  const fixedBoxDays = new Set(Object.keys(STATE.boxSchedule||{}).filter(k=>STATE.boxSchedule[k]?.active).map(Number));
  const painR = getPainRestrictions(); // V3: active pain report (if any), reused across the whole week's substitutions

  // --- training-priority bias: Impact × Improvability, not just the lowest raw score ---
  // spec §2/§5: use the TOP 3 priorities (not just #1) so the week can actually address more than
  // one area — "가장 낮은 점수" (weakest single index) is deliberately NOT the same thing as "이번 주
  // 가장 많이 훈련해야 하는 영역". weakest is kept as an alias to top3[0] for the few call-sites below
  // that only care about the single top priority (station-day bias, long-run bias).
  const trainingPriority = computeTrainingPriority();
  const top3 = trainingPriority.slice(0,3).map(p=>p.key);
  const weakest = top3[0];
  // spec (simulation finding): the old gate here was `weakest!=="running"`, which — combined with
  // STA-1 being hardcoded to Wall Ball only (see below) — meant a severe individual station weakness
  // (e.g. Sled Pull +53% vs benchmark) produced NO station-focus day in the plan whenever Running
  // happened to also be top priority, which is common. Use the REAL per-station gap data instead of
  // gating on which Index is #1 — insert a station-focus day whenever there's a genuinely large
  // single-station gap, regardless of whether Running is also a priority this week.
  const weeklyStationPriority = computeStationPriority();
  const topStationGap = weeklyStationPriority[0];
  const hasSevereStationGap = topStationGap && topStationGap.gapPct >= 0.12;

  // --- hard overrides from Critical rules (safety-first: overrides box schedule too) ---
  if(critical.some(r=>r.id==="TAP-2")){
    return WEEKDAYS.map((d,i)=> i===6 || i===3 ? sessionSlot("shakeout",d,ctx,painR) : sessionSlot("rest",d,ctx,painR));
  }
  if(critical.some(r=>r.id==="RACE-1" || r.id==="TAP-1")){
    const days = WEEKDAYS.map((d,i)=> [0,2,4].includes(i) ? sessionSlot("shakeout",d,ctx,painR) : sessionSlot("rest",d,ctx,painR));
    return days;
  }
  if(critical.some(r=>r.id==="FAT-1")){
    return WEEKDAYS.map((d,i)=> i===1||i===4 ? sessionSlot("recovery",d,ctx,painR) : sessionSlot("rest",d,ctx,painR));
  }
  // spec (Rule Conflict/Safety Override, regression-test finding): REC-1's own action text says
  // "고강도 세션 전면 금지" (all high-intensity sessions banned this week) but was never actually wired
  // into any enforcement — the 100-profile regression suite caught real cases where REC-1 fired
  // (Critical) while the generated plan still contained an Interval day. Lighter than FAT-1 (which
  // forces full rest) — REC-1 still allows Easy Run/Strength/Recovery, just bans the hard session
  // TYPES (interval/wod/sim/brick/long), and suppresses box add-ons that would push a hard session too.
  const recoveryDayOverride = critical.some(r=>r.id==="REC-1");

  const deloadNow=shouldDeloadNow();

  // largest-remainder allocation across the FULL week by phase ratio, then subtract what fixed
  // box days already cover (e.g. a 웨이트 day already counts toward the strength quota) so the
  // remaining open days aren't over- or under-supplied.
  const boxCategoryCounts = {};
  fixedBoxDays.forEach(i=>{ const cat=boxCategoryFor(STATE.boxSchedule[i]?.type); if(cat) boxCategoryCounts[cat]=(boxCategoryCounts[cat]||0)+1; });
  const openDayCount = Math.max(0, 7-fixedBoxDays.size);
  const cats = ["run","strength","wod","recovery"];
  const raw = cats.map(c=>({c, exact: (ratio[c]/100)*7}));
  let counts = {}; let used=0;
  raw.forEach(r=>{ counts[r.c]=Math.floor(r.exact); used+=counts[r.c]; });
  let remainder = raw.map(r=>({c:r.c, frac:r.exact-Math.floor(r.exact)})).sort((a,b)=>b.frac-a.frac);
  let idx=0;
  while(used<7){ counts[remainder[idx%remainder.length].c]++; used++; idx++; }
  cats.forEach(c=>{ counts[c]=Math.max(0, counts[c]-(boxCategoryCounts[c]||0)); });

  // V3 (spec §19): when the direct today-decision says a deload is needed, actually reduce volume
  // in the generated week — not just show a recommendation text elsewhere. Shifts one hard (wod) and
  // one strength day into recovery, roughly matching the "-30~40%" language used in DEL-1/DEL-3.
  if(deloadNow.needed){
    if(counts.wod>0){ counts.wod-=1; counts.recovery+=1; }
    if(counts.strength>1){ counts.strength-=1; counts.recovery+=1; }
  }

  // ---- MANDATORY SESSIONS reserved FIRST (spec §3) ----
  // Interval/Threshold (RUN-1), Simulation (RACE-2), Race-specific Brick (RACE-3/STA-5) are reserved
  // BEFORE the ratio-based slots are built and BEFORE the openDayCount slice, so they can never be
  // silently dropped by later truncation — the exact bug this replaces (interval appended past the
  // array length the day-assignment step actually iterates over).
  const mandatory=[];
  if(fired.some(r=>r.id==="RUN-1") && !deloadNow.needed && !recoveryDayOverride) mandatory.push("interval");
  if(fired.some(r=>r.id==="RACE-2")) mandatory.push("sim");
  if(fired.some(r=>r.id==="RACE-3" || r.id==="STA-5")) mandatory.push("brick");
  const reservedMandatory = mandatory.slice(0, openDayCount);
  reservedMandatory.forEach(m=>{
    // borrow the slot from whichever category it most naturally displaces
    if(m==="interval" && counts.run>0) counts.run--;
    else if(counts.wod>0) counts.wod--;
    else if(counts.run>0) counts.run--;
    else if(counts.strength>0) counts.strength--;
  });

  // build ordered slot list for the REMAINING (non-mandatory) days: rest anchored Mon or as counts
  // allow; alternate hard/easy
  let ratioSlots=[];
  for(let i=0;i<counts.run;i++) ratioSlots.push(i===0 && counts.run>1 ? "long":"run");
  for(let i=0;i<counts.strength;i++) ratioSlots.push("strength");
  for(let i=0;i<counts.wod;i++) ratioSlots.push(i===0 && hasSevereStationGap ? "station":"wod");
  for(let i=0;i<counts.recovery;i++) ratioSlots.push(i===0?"rest":"recovery");
  let slots=[...reservedMandatory, ...ratioSlots];
  while(slots.length<openDayCount) slots.push("recovery");
  slots=slots.slice(0,openDayCount); // safe now — mandatory sessions are already at the front, never truncated away

  // rule-based content substitutions (non-mandatory, lower-risk swaps on whatever slots remain)
  // spec (simulation finding): STA-1 is hardcoded to Wall Ball only, so it never fired for e.g. a
  // severe Sled Pull gap — replaced with the general real-data check above (hasSevereStationGap),
  // which fires for ANY station's genuine gap, not just Wall Ball. STA-1 itself is left in the Rule
  // Engine unchanged (still a valid, real Wall-Ball-specific insight for the reasoning/insight layer)
  // but no longer gates this substitution.
  if(hasSevereStationGap && !slots.includes("station")) { const i=slots.lastIndexOf("wod"); if(i>=0) slots[i]="station"; }
  // REC-1 enforcement (see above): downgrade every remaining hard slot to recovery, applied AFTER the
  // other substitutions so it always wins — this is a safety override, nothing should re-upgrade it.
  if(recoveryDayOverride){ slots = slots.map(s=> ["interval","wod","sim","brick","long","station"].includes(s) ? "recovery" : s); }
  if(fired.some(r=>r.id==="WK-1")) { const i=slots.indexOf("wod"); if(i>=0) slots[i]="recovery"; }
  if(fired.some(r=>r.id==="FAT-3")) { const i=slots.findIndex(s=>s==="wod"); if(i>=0) slots[i]="recovery"; } // never downgrade the reserved mandatory interval itself
  if(fired.some(r=>r.id==="RUN-4")) { if(!slots.includes("long")){ const i=slots.indexOf("run"); if(i>=0) slots[i]="long"; } }

  // WK-2: avoid 2 consecutive hard days (interval/wod/sim/brick) -> insert recovery between
  const hard=new Set(["interval","wod","sim","brick","long"]);
  for(let i=0;i<slots.length-1;i++){
    if(hard.has(slots[i]) && hard.has(slots[i+1])){
      slots[i+1] = slots.includes("recovery")? "recovery" : "recovery";
    }
  }
  // ensure at least one rest among the open days
  if(!slots.includes("rest") && slots.length){ const softIdx=slots.indexOf("recovery"); slots[softIdx>=0?softIdx:slots.length-1]="rest"; }

  // distribute across the OPEN days only, following a Mon/Wed/Fri/Sat/Tue/Thu/Sun preference order
  const orderPreference=[0,2,4,5,1,3,6];
  const openOrder = orderPreference.filter(d=>!fixedBoxDays.has(d));
  const finalSlots=new Array(7).fill(null);
  openOrder.forEach((dayIdx,i)=>{ if(slots[i]!=null) finalSlots[dayIdx]=slots[i]; });
  fixedBoxDays.forEach(dayIdx=>{ finalSlots[dayIdx]="__box__"; });
  for(let i=0;i<7;i++) if(finalSlots[i]==null) finalSlots[i]="recovery";

  // ---- final validation pass (spec §8) ----
  const planWarnings = validateWeeklyPlan(finalSlots, fired, deloadNow.needed, recoveryDayOverride);

  // ---- box add-on: STATION-priority-aware, frequency-capped across the week (spec §1-§13) ----
  const hasInterval = finalSlots.includes("interval");
  // total weekly exposure to each station across ALL fixed box days this week (spec §7/§9) —
  // computed once up front so the per-day add-on picker (below) can see the whole week's box content,
  // not just what it's processed so far.
  const boxStationCounts = {};
  fixedBoxDays.forEach(dayIdx=>{
    boxSessionStations(STATE.boxSchedule[dayIdx]||{}).forEach(k=>{ boxStationCounts[k]=(boxStationCounts[k]||0)+1; });
  });
  const weekCtx = { top3, hasInterval, stationPriority: weeklyStationPriority, boxStationCounts, ctx, recoveryDayOverride,
    indexSequence: buildIndexAddOnSequence(trainingPriority, fixedBoxDays.size) };
  const addOnState = { stationExposure:{}, lastStationKey:null, indexExposure:{}, sequencePos:0, usedGenericCircuit:false, totalHardSessions:0 };
  const boxSlot=(i)=>{
    const box=STATE.boxSchedule[i];
    const addOnResult=boxAddOnRecommendation(box, weekCtx, addOnState);
    return { day:WEEKDAYS[i], type:"box", label:`박스: ${box.label||box.type||"세션"}`,
      desc:"크로스핏 박스 고정 세션 (외부 프로그램)", addOn:addOnResult.text, addOnPrescription:addOnResult.prescription, hr:"—", rpe:"—" };
  };

  const days = finalSlots.map((type,i)=> type==="__box__" ? boxSlot(i) : sessionSlot(type||"recovery", WEEKDAYS[i], ctx, painR));
  if(planWarnings.length) days.planWarnings=planWarnings; // attached for the UI to surface (spec §8), non-breaking for existing array consumers
  return days;
}
// spec §8: re-checks the finished week against the same invariants the plan is SUPPOSED to satisfy,
// and auto-fixes the one case that's safe to fix mechanically (a fired RUN-1 with no Interval slot
// anywhere — converts the least-important remaining hard slot). Returns human-readable warnings for
// anything it either fixed or couldn't safely fix on its own, for the UI to show ("추천 이유 == 실제
// 계획" per spec §9).
function validateWeeklyPlan(finalSlots, fired, deloadNeeded, recoveryDayOverride){
  const warnings=[];
  const has=(t)=>finalSlots.includes(t);
  // spec (Rule Conflict / Safety Override): this auto-fix exists to make sure RUN-1 (Training
  // Priority: "Interval 필요") never gets silently dropped — but a Critical safety override (REC-1
  // "고강도 세션 전면 금지" etc.) must always win over that. Regression-test finding: this exact
  // conflict (RUN-1 wants Interval, REC-1 bans it) was slipping through because this validator ran
  // AFTER the REC-1 downgrade and didn't know about it, silently re-inserting the banned Interval.
  if(fired.some(r=>r.id==="RUN-1") && !deloadNeeded && !recoveryDayOverride && !has("interval")){
    const order=["wod","strength","station","run","recovery"];
    let fixed=false;
    for(const t of order){ const i=finalSlots.indexOf(t); if(i>=0){ finalSlots[i]="interval"; fixed=true;
      warnings.push(`RUN-1(Interval 부족)이 발동했지만 계획에 Interval이 없어 ${WEEKDAYS[i]} 세션을 Interval Run으로 자동 교체했습니다.`); break; } }
    if(!fixed) warnings.push("RUN-1이 발동했지만 계획에 Interval을 배치할 여유 슬롯이 없습니다 — 박스 고정 스케줄을 확인해주세요.");
  } else if(recoveryDayOverride && fired.some(r=>r.id==="RUN-1")){
    warnings.push("RUN-1(Interval 필요)이 발동했지만, Recovery Day 안전 우선순위(REC-1)가 더 높아 이번 주는 Interval을 배치하지 않았습니다.");
  }
  if(!has("rest") && !has("recovery")){
    warnings.push("이번 주 계획에 회복일이 없습니다.");
  }
  const hardCount = finalSlots.filter(t=>["interval","wod","sim","brick","long"].includes(t)).length;
  if(hardCount>=5) warnings.push(`고강도 세션이 주 ${hardCount}회로 많습니다 — 회복 상태를 확인해주세요.`);
  return warnings;
}
// V3: builds the actual day-card — applies pain substitution first (if the planned type/station is
// restricted), THEN generates the personalized session prescription for whichever type ends up being
// used, so a substituted day still gets a real prescription rather than just a label change.
function sessionSlot(type, dayLabel, ctx, painR){
  const stationHint = (type==="station"||type==="brick") ? pickFeaturedStationKey() : null;
  const sub = painR ? getExerciseSubstitutions(type, stationHint, painR) : null;
  const finalType = sub ? sub.altType : type;
  const lib=SESSION_LIBRARY[finalType]||SESSION_LIBRARY.recovery;
  const prescription = ctx ? generateSessionPrescription(finalType, ctx, sub?.altStationFocus||stationHint) : null;
  return { day:dayLabel, type:finalType, label: sub? `${lib.label} (통증 대체)` : lib.label, desc:lib.desc, hr:lib.hr, rpe:lib.rpe,
    prescription,
    painSubstitution: sub ? { originalType:type, originalLabel:(SESSION_LIBRARY[type]||{}).label||type, reason:sub.note, isSevere:painR.isSevere, rawArea:painR.rawArea } : null };
}
function applyManualOverrides(plan){
  const out = plan.map((slot,i)=>{
    const ov=STATE.weeklyOverride[i];
    return ov ? { ...slot, label:ov.label||slot.label, desc:ov.desc||slot.desc } : slot;
  });
  if(plan.planWarnings) out.planWarnings=plan.planWarnings; // preserve spec §8 validation warnings through the override step
  return out;
}

/* 8. COACH REASONING CHAIN — transparent step-by-step derivation          */
/* ---------------------------------------------------------------------- */
function buildReasoningChain(ruleResult){
  const { ctx, fired } = ruleResult;
  const steps=[];
  const painR = getPainRestrictions();
  steps.push({ q:"Step 1 — Safety / Pain 확인", a: painR
    ? `${painR.rawArea} 통증 보고 (${painR.ageDays}일 전) → ${painR.isSevere?"심한 통증/기능저하 표현 감지, 훈련보다 전문가 평가·휴식 우선 권장":"해당 부위 관련 동작 제한 적용, 대체 운동으로 전환"}`
    : "최근 5일 내 보고된 통증 없음" });
  const recoveryState = fired.some(r=>r.category==="Recovery"&&r.priority==="Critical") ? "위험" :
                          fired.some(r=>r.category==="Recovery") ? "주의" : "양호";
  steps.push({ q:"Step 2 — 회복 상태 확인", a:`${recoveryState} (Recovery Index ${ctx.hpiResult.indices.recovery.score!=null?round1(ctx.hpiResult.indices.recovery.score):"N/A"}, Fatigue ${round1(ctx.hpiResult.fatigue)})` });
  const hasInterval = ctx.counts7.interval>0;
  steps.push({ q:"Step 3 — 최근 7일 인터벌 실시 여부", a: hasInterval? "있음":"없음" });
  steps.push({ q:"Step 4 — 대회까지 남은 기간 → 시즌 단계", a:`${ctx.dLeft!=null? ctx.dLeft+"일":"미설정"} → ${ctx.phase} 구간` });
  const priority=computeTrainingPriority();
  const top=priority[0];
  steps.push({ q:"Step 5 — 훈련 우선순위 (Impact×Gap×Trainability×Urgency×Specificity×Recovery)", a:`${top.label} (점수 ${round1(top.score??0)}, 개선여지 ${round1(top.headroom)}점, 레이스 비중 ${Math.round(top.impactWeight*100)}%) — 단순 최저점이 아니라 6요소 종합 기준` });

  let conclusion;
  const topRule = fired[0];
  if(painR && painR.isSevere){
    conclusion = `통증 표현이 심각하게 보고되어, 오늘은 훈련 강도 조정보다 전문가 평가/완전 휴식을 우선 권장합니다.`;
  } else if(topRule){
    conclusion = `${topRule.actionText} — ${topRule.reasonText}`;
  } else if(!hasInterval && ctx.phase!=="Taper"){
    conclusion = "Threshold Run 세션 추천";
  } else {
    conclusion = "현재 계획 유지, 약점 영역 보강 세션 편성";
  }
  if(painR && !painR.isSevere) conclusion += ` (${painR.rawArea} 통증으로 일부 세션이 대체 운동으로 조정되었습니다)`;
  return { steps, conclusion };
}

/* ---------------------------------------------------------------------- */
/* 8b. RULE ENGINE ↔ GPT BOUNDARY (spec §3)                                */
/*     Everything above this point (HPI, Prediction, Goal Gap, Training     */
/*     Priority, Pain restriction, Recovery, Training prescription,         */
/*     Race DNA) is the Rule Engine: deterministic, numeric, the single     */
/*     source of truth. A future GPT integration must sit strictly on the   */
/*     other side of this boundary:                                        */
/*       Rule Engine  → computes numbers, decides safety, decides sessions  */
/*       GPT          → explains those numbers in natural language,        */
/*                       answers free-form questions, gives feedback on     */
/*                       logged sessions, writes the coaching copy          */
/*     GPT is never the source of a number and never allowed to overrule a  */
/*     Rule Engine safety decision (e.g. pain restrictions) — it only       */
/*     receives buildCoachContext()'s JSON and talks about it. Nothing in   */
/*     this section calls an external API; it only assembles/validates the  */
/*     hand-off payload so the seam is ready when GPT is wired in.          */
/* ---------------------------------------------------------------------- */
// Builds the single structured JSON snapshot a GPT layer would receive. Every field is either a
// number/enum already computed by the Rule Engine above, or explicitly null when the underlying
// engine has nothing to say (never a fabricated placeholder) — GPT is expected to read `null` as
// "no data, say so" rather than invent a number.
function buildCoachContext(){
  const hpiResult = calcHPI();
  const ruleResult = evaluateRules();
  const priority = computeTrainingPriority();
  const pred = predictTime(hpiResult, 0);
  const plan = computeGoalPlan();
  const painR = getPainRestrictions();
  const reasoning = buildTopRecommendationReasoning(ruleResult);
  const topRule = ruleResult.fired[0] || null;
  let raceDna = null;
  try{ const peer = computePeerAnalysis(); if(peer) raceDna = { type:peer.raceDna.id, label:peer.raceDna.label,
    strengthIdx:peer.strengthIdx, isRealData:peer.dataSource.isReal }; } catch(e){ raceDna = null; }

  return {
    generatedAt: new Date().toISOString(),
    hpi: hpiResult.hpi!=null ? round1(hpiResult.hpi) : null,
    indices: Object.fromEntries(Object.entries(hpiResult.indices).map(([k,v])=>[k, v.score!=null?round1(v.score):null])),
    fatigue: round1(hpiResult.fatigue),
    recovery: hpiResult.indices.recovery.score!=null ? round1(hpiResult.indices.recovery.score) : null,
    painRestrictions: painR ? { areaKey:painR.areaKey, rawArea:painR.rawArea, isSevere:painR.isSevere,
      ageDays:painR.ageDays, note:painR.note } : null,
    trainingPriority: priority.slice(0,5).map(p=>({ key:p.key, label:p.label, score:p.score!=null?round1(p.score):null,
      headroom:round1(p.headroom), impactWeightPct:Math.round(p.impactWeight*100) })),
    prediction: { seconds:pred.predicted, range: pred.ciLow!=null?{low:pred.ciLow, high:pred.ciHigh}:null,
      confidence: pred.confidenceLabel || null, source:pred.baseline.source },
    goalGap: plan ? { targetSec:plan.targetSec, totalGapSec:plan.totalGapSec, alreadyMet:!!plan.alreadyMet } : null,
    raceDNA: raceDna,
    recommendedSession: topRule ? { action:topRule.actionText, reason:topRule.reasonText, ruleId:topRule.id,

function generateRoadmap(){
  const dLeft=daysToRace();
  if(dLeft==null) return null;
  const totalWeeks=Math.max(1,Math.ceil(dLeft/7));
  const taperWeeks = totalWeeks>=2?2:1;
  const peakWeeks = Math.min(4, Math.max(0,totalWeeks-taperWeeks-2));
  const buildWeeks = Math.min(6, Math.max(0, totalWeeks-taperWeeks-peakWeeks-2));
  const baseWeeks = Math.max(0, totalWeeks-taperWeeks-peakWeeks-buildWeeks);

  const blocks=[];
  let cursor=new Date();
  function pushBlock(phase,weeks){
    if(weeks<=0)return;
    const start=new Date(cursor);
    const end=new Date(cursor); end.setDate(end.getDate()+weeks*7-1);
    cursor=new Date(end); cursor.setDate(cursor.getDate()+1);
    blocks.push({ phase, weeks, start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10), ...PHASE_RATIO[phase],
      milestone: {Base:"체력 테스트(5K/10K) + 벤치마크 스테이션 테스트",Build:"Race-pace Brick 세션 2회 이상",Peak:"Full Simulation 1~2회",Taper:"컨디션 점검 + 장비 점검"}[phase] });
  }
  pushBlock("Base",baseWeeks); pushBlock("Build",buildWeeks); pushBlock("Peak",peakWeeks); pushBlock("Taper",taperWeeks);
  return blocks;
}

const RACE_RECORD_SCHEMA = ["race_id","athlete_id","gender","age","age_group","division","event","country","date",
  "overall_time","run_1","run_2","run_3","run_4","run_5","run_6","run_7","run_8",

function numOrNull(v){ if(v==null||v==="") return null; const n=Number(v); return (isNaN(n)||n<=0)?null:n; }
// spec (Run 1~8 key-mismatch defense): tries each candidate key in order and returns the first
// usable numeric value. Guards against a JSON/CSV import using the app's own "run1".."run8"/
// "sledPush" naming convention instead of RACE_RECORD_SCHEMA's "run_1".."run_8"/"sled_push" —
// previously this failed silently (field just came back null, no error), which is exactly the kind
// of bug that makes Run look like "no data" even when the import genuinely contained it.
function numOrNullAlias(r, ...keys){
  for(const k of keys){ const v=numOrNull(r[k]); if(v!=null) return v; }
  return null;
}
// Loose validation: a usable row needs at minimum gender + division to be filterable into any
// comparison group. Everything else (individual segment times) can be partially missing — a row
// missing wallball but present for everything else still contributes to every OTHER segment's n.
// doc11 (포디움 기준 데이터 연결 오류): EXTERNAL_RACE_DB[].age_group previously carried whatever raw
// string format the source export used, completely unnormalized, then computePodiumComparisonGroup()
// compares it with EXACT string equality against getAgeGroup(userAge)'s own canonical output
// ("18-24".."60+"). Any cosmetic difference — stray whitespace ("30 - 34"), an en-dash instead of a
// hyphen ("30–34"), or a gender/"AG" prefix some exports include ("F30-34", "AG 30-34") — silently
// failed that comparison and produced "insufficient data" even when abundant real rows existed for
// that exact age group. This only cleans formatting noise; it never re-buckets a genuinely different
// band (a real 10-year "30-39" stays "30-39", it is NOT coerced into "30-34" — doc11 §10 explicitly
// forbids merging different bands to inflate sample size).
function normalizeAgeGroupLabel(raw){
  if(raw==null) return null;
  let s=String(raw).trim();
  if(!s) return null;
  s=s.replace(/[–—]/g,"-");                                   // en/em dash -> hyphen
  s=s.replace(/^(AG|Age\s*Group)\s*[:\-]?\s*/i,"");            // strip "AG "/"Age Group:" prefixes
  s=s.replace(/^[FMW]\s*[:\-]?\s*(?=\d)/i,"");                 // strip a leading gender-letter prefix (e.g. "F30-34")
  s=s.trim();
  const range=s.match(/^(\d{2})\s*-\s*(\d{2})$/);
  if(range) return `${range[1]}-${range[2]}`;
  const plus=s.match(/^(\d{2})\s*\+$/);
  if(plus) return `${plus[1]}+`;
  return s; // unrecognized format — return the cleaned string as-is rather than discarding real data
}
function validateRaceRecordRow(r){
  if(!r || typeof r!=="object") return false;
  const gender=String(r.gender||"").toLowerCase();
  if(gender!=="male" && gender!=="female" && gender!=="mixed") return false;
  if(!r.division) return false;
  return true;
}
/* ----------------------------------------------------------------------
 * RAW vs ANALYSIS-VALID separation (요청: "RAW DATA와 ANALYSIS DATA 분리")
 * ----------------------------------------------------------------------
 * RAW hyrox_results (Supabase) is NEVER edited or filtered here — a row like total_time="0:08:02"
 * stays in the raw table forever exactly as-is, because it may be a genuine official result. This
 * function only decides whether a given (already-normalized) row is fit to feed DNA/Podium/Peer/
 * Benchmark/Race-Prediction analysis. It intentionally does NOT apply an arbitrary "total_time < XX"
 * cutoff (explicitly requested not to) — it only flags rows that are structurally impossible to be a
 * real HYROX finish (zero/negative/missing time), which is a data-integrity check, not a performance
 * judgment. Anything not caught by an explicit rule below is left analysis_valid=true; a stricter,
 * evidence-based rule (e.g. cross-checking total_time against the sum of that row's own run+station
 * splits, when all are present) can be added here later without touching the raw table or any caller —
 * this function is the single seam every analysis consumer (filterExternalRaceDb /
 * computePodiumComparisonGroup / queryPeerSegmentStats) now goes through.
 */
function classifyAnalysisValidity(overallTimeSec, r){
  if(overallTimeSec==null) return { valid:false, reason:"MISSING_REQUIRED_DATA" }; // total_time missing/unparseable
  if(overallTimeSec<=0) return { valid:false, reason:"ZERO_TIME" }; // 00:00:00 등
  // Cross-check against the row's own splits, ONLY when enough of them exist to be meaningful — this is
  // evidence from the row itself, not an invented global threshold, so it stays inside the "no arbitrary
  // threshold" rule while still catching cases like the observed 0:08:02 (a real official field that is
  // far shorter than the athlete's own recorded segments could add up to).
  const segs=[r.run_1,r.run_2,r.run_3,r.run_4,r.run_5,r.run_6,r.run_7,r.run_8,
    r.ski,r.sled_push,r.sled_pull,r.burpee,r.row,r.carry,r.lunge,r.wallball,r.transition].filter(v=>v!=null);
  if(segs.length>=8){ // need a reasonably complete split set before trusting a sum-comparison
    const segSum=segs.reduce((a,b)=>a+b,0);
    if(overallTimeSec < segSum*0.9) return { valid:false, reason:"INVALID_SEGMENT" }; // total_time contradicts its own splits
  }
  return { valid:true, reason:null };
}
function normalizeExternalRaceRow(r){
  const genderRaw = String(r.gender||"").toLowerCase();
  const gender = genderRaw.includes("mixed") ? "mixed" : (genderRaw==="female" ? "female" : "male");
  const age = r.age!=null && r.age!=="" ? Number(r.age) : null;
  const overall_time = numOrNull(r.overall_time);
  const partial = {
    race_id: r.race_id || uid(), athlete_id: r.athlete_id || null, gender,
    age, age_group: normalizeAgeGroupLabel(r.age_group) || (age!=null ? getAgeGroup(age) : null),
    division: DIVISIONS.includes(r.division) ? r.division : "Open",
    event: r.event || null, country: r.country || null, date: r.date || null,
    overall_time,
    run_1:numOrNullAlias(r,"run_1","run1"), run_2:numOrNullAlias(r,"run_2","run2"),
    run_3:numOrNullAlias(r,"run_3","run3"), run_4:numOrNullAlias(r,"run_4","run4"),
    run_5:numOrNullAlias(r,"run_5","run5"), run_6:numOrNullAlias(r,"run_6","run6"),
    run_7:numOrNullAlias(r,"run_7","run7"), run_8:numOrNullAlias(r,"run_8","run8"),
    ski:numOrNull(r.ski), sled_push:numOrNullAlias(r,"sled_push","sledPush"), sled_pull:numOrNullAlias(r,"sled_pull","sledPull"), burpee:numOrNull(r.burpee),
    row:numOrNull(r.row), carry:numOrNull(r.carry), lunge:numOrNull(r.lunge), wallball:numOrNull(r.wallball),
    transition:numOrNull(r.transition),
  };
  const validity = classifyAnalysisValidity(overall_time, partial);
  partial.analysis_valid = validity.valid;
  partial.analysis_exclusion_reason = validity.reason;
  return partial;
}
async function fetchSiteJson(candidates){
  for(const path of candidates){
    try{
      const url=new URL(path, document.baseURI).href + (path.includes("?")?"&":"?") + "v=" + Date.now();
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok) continue;
      const data=await res.json();
      return {path,data};
    }catch(e){ /* try next candidate */ }
  }
  return null;
}

// 호출했다. hyrox_results가 50,000행을 넘어서면(현재 86,500+) PostgREST가 반환하는 앞쪽 50,000행이
// "가장 최근에 upsert된 행"까지 포함한다는 보장이 없다 — 실제로 사용자가 새로 업로드한 2026 Chiba/
// Chengdu/Osaka/Hangzhou 배치 전체가 조용히 잘려나갈 수 있었고, 이것이 "Women+Open Doubles+30-34 =
// 2,863건이 Supabase엔 실존하지만 앱에는 0건"으로 보이는 근본 원인이다. 아래는 .range()로 테이블
// 전체를 페이지 단위로 끝까지 가져와 이 truncation을 원천적으로 없앤다 — 86,500이든 500,000이든 전량.
async function fetchAllHyroxResultsFromSupabase(){
  const rows=[];
  let from=0;
  const hardPageCeiling = 2000; // safety valve only (2000*1000=2M rows) — never expected to trigger
  for(let page=0; page<hardPageCeiling; page++){
    const to = from + EXTERNAL_RACE_DB_PAGE_SIZE - 1;
    const { data, error } = await sb.from("hyrox_results").select("*").order("id",{ascending:true}).range(from,to);
    if(error) throw error;
    if(!data || !data.length) break;
    rows.push(...data);
    if(data.length < EXTERNAL_RACE_DB_PAGE_SIZE) break; // last page reached
    from += EXTERNAL_RACE_DB_PAGE_SIZE;
  }
  return rows;
}

// CSV import — reuses the app's existing generic parseCSV() RFC4180 parser. Header row is matched
// case-insensitively against RACE_RECORD_SCHEMA field names, with a few common export-tool aliases.
const RACE_CSV_HEADER_ALIASES = {
  overall_time:["overall_time","total_time","finish_time","officialtime","official_time"],
  sled_push:["sled_push","sledpush"], sled_pull:["sled_pull","sledpull"], wallball:["wallball","wall_ball"],
  age_group:["age_group","agegroup"], race_id:["race_id","raceid"], athlete_id:["athlete_id","athleteid","bib"],
};
async function importRaceRecordsCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2) return { ok:false, error:"헤더 행 + 데이터 행이 최소 1줄씩 필요합니다." };
  const headers=rows[0].map(h=>h.trim().toLowerCase());
  const colIndex={};
  RACE_RECORD_SCHEMA.forEach(field=>{
    const aliases=RACE_CSV_HEADER_ALIASES[field]||[field];
    const idx=headers.findIndex(h=>aliases.includes(h));
    if(idx>=0) colIndex[field]=idx;
  });
  if(colIndex.gender==null || colIndex.division==null) return { ok:false, error:"CSV에 최소 gender, division 열이 필요합니다." };
  const valid=[]; let rejected=0;
  rows.slice(1).forEach(cols=>{
    const obj={};
    RACE_RECORD_SCHEMA.forEach(field=>{ if(colIndex[field]!=null) obj[field]=cols[colIndex[field]]; });
    if(validateRaceRecordRow(obj)) valid.push(normalizeExternalRaceRow(obj)); else rejected++;
  });
  EXTERNAL_RACE_DB.push(...valid);
  await persistExternalRaceDb();
  return { ok:true, imported:valid.length, rejected, total:EXTERNAL_RACE_DB.length };
}
