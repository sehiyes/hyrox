<!DOCTYPE html>
<html lang="ko" style="background:#0A0A0B;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPS — HYROX Performance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --surface:#141416; --surface2:#1C1C1F; --surface3:#232326;
  --line:#28282C; --orange:#FF5A1F; --orange-dim:#C2450F; --orange-glow:rgba(255,90,31,.16);
  --white:#F5F4F1; --gray:#9497A0; --gray-dim:#5C5E66;
  --green:#33D17A; --red:#FF4D4D; --amber:#FFB020;
  --crit:#FF4D4D; --high:#FF9A3D; --med:#FFB020; --low:#5C8CFF;
  --font-display:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{margin:0;padding:0;background:var(--bg) !important;color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
::selection{background:var(--orange-glow);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh; background:var(--bg);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.brand-mark{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.5px; color:var(--white); display:flex; align-items:center; gap:8px;}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange);}
.brand-sub{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; margin-top:4px; text-transform:uppercase;}
.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-group-label{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; text-transform:uppercase; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--gray); font-weight:500; transition:background .15s, color .15s; user-select:none;
}
.nav-item:hover{background:var(--surface2); color:var(--white);}
.nav-item.active{background:var(--orange-glow); color:var(--orange); font-weight:600;}
.nav-item .n-ico{width:16px; text-align:center; font-size:13px; opacity:.9;}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--gray-dim); font-family:var(--font-mono); line-height:1.6;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:56px 34px 60px; background:var(--bg);}
.page{display:none; flex-direction:column; gap:18px; max-width:1180px;}
.page.active{display:flex;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:600;}
.eyebrow.gray{color:var(--gray-dim);}
h1.page-title{font-family:var(--font-display); font-size:32px; font-weight:800; margin:2px 0 0; letter-spacing:.3px;}
h2.section-title{font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; letter-spacing:.3px;}
p.lead{font-size:12.5px; color:var(--gray); margin:0; line-height:1.6; max-width:640px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px;}
.card.tight{padding:14px 16px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11.5px; color:var(--gray); font-weight:600;}
input,select,textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--white);
  padding:9px 10px; font-size:13px; font-family:var(--font-body); outline:none; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange-dim);}
input[type=date]{font-family:var(--font-mono); color-scheme:dark;}
input[type=checkbox]{width:auto;}
textarea{resize:vertical; min-height:60px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; background:var(--orange); color:#100; border:none;
  border-radius:9px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--surface3); color:var(--white); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--gray); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--red); border:1px solid rgba(255,77,77,.35);}
.btn.sm{padding:6px 11px; font-size:11.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--gray-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--white);}
tr:last-child td{border-bottom:none;}
td.num, th.num{font-family:var(--font-mono); text-align:right;}

.badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.badge.crit{background:rgba(255,77,77,.14); color:var(--crit);}
.badge.high{background:rgba(255,154,61,.14); color:var(--high);}
.badge.med{background:rgba(255,176,32,.14); color:var(--med);}
.badge.low{background:rgba(92,140,255,.14); color:var(--low);}
.badge.elite{background:rgba(51,209,122,.16); color:var(--green);}
.badge.phase-base{background:rgba(148,151,160,.14); color:var(--gray);}
.badge.phase-build{background:rgba(255,176,32,.14); color:var(--amber);}
.badge.phase-peak{background:var(--orange-glow); color:var(--orange);}
.badge.phase-taper{background:rgba(51,209,122,.14); color:var(--green);}

.bar-track{flex:1; height:6px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.stat-num{font-family:var(--font-mono); font-weight:700;}
.mono{font-family:var(--font-mono);}
.empty-note{font-size:12.5px; color:var(--gray-dim); text-align:center; padding:22px 10px; border:1px dashed var(--line); border-radius:10px;}
.divider{height:1px; background:var(--line); margin:4px 0;}
.hstack{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.chip{font-family:var(--font-mono); font-size:10.5px; padding:4px 9px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); color:var(--gray); cursor:pointer;}
.chip.on{background:var(--orange-glow); color:var(--orange); border-color:transparent;}
.list-remove{cursor:pointer; color:var(--gray-dim); font-size:14px;}
.list-remove:hover{color:var(--red);}
.reason-line{font-size:11.5px; color:var(--gray); font-family:var(--font-mono); line-height:1.6;}
.rule-id{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim);}
::placeholder{color:var(--gray-dim);}

.toast{position:fixed; bottom:20px; right:24px; background:var(--surface3); border:1px solid var(--line); border-left:3px solid var(--orange); padding:11px 16px; border-radius:9px; font-size:12.5px; z-index:999; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;}
.toast.show{opacity:1; transform:translateY(0);}

/* signature race-strip */
.race-strip{display:flex; gap:2px; align-items:flex-end; height:64px; padding:0 2px;}
.race-strip .seg{flex:1; border-radius:3px 3px 1px 1px; position:relative; min-width:4px; transition:height .3s;}
.race-strip .seg.run{background:linear-gradient(180deg, var(--orange), var(--orange-dim));}
.race-strip .seg.station{background:linear-gradient(180deg,#4B7BFF,#2C4FAD);}
.race-strip-labels{display:flex; gap:2px; margin-top:4px;}
.race-strip-labels span{flex:1; text-align:center; font-family:var(--font-mono); font-size:8px; color:var(--gray-dim); min-width:4px;}

.step-chain{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:12px; padding:10px 0;}
.step-item .step-num{width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--orange); flex-shrink:0;}
.step-item .step-line{width:1px; background:var(--line); flex:1; margin:0 auto;}
.step-conn{display:flex; flex-direction:column; align-items:center; width:22px; flex-shrink:0;}
.step-conn .ln{width:1px; flex:1; background:var(--line); min-height:10px;}
.step-body{padding-top:1px;}
.step-q{font-size:11.5px; color:var(--gray-dim); text-transform:uppercase; letter-spacing:.5px; font-family:var(--font-mono);}
.step-a{font-size:13px; color:var(--white); margin-top:2px; font-weight:600;}
.step-conclusion{margin-top:6px; padding:12px 14px; background:var(--orange-glow); border-radius:10px; border-left:3px solid var(--orange);}
.step-conclusion .lbl{font-family:var(--font-mono); font-size:10px; color:var(--orange); letter-spacing:1px; text-transform:uppercase;}
.step-conclusion .val{font-size:14px; font-weight:700; margin-top:3px;}

.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.day-card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:12px 10px; min-height:120px; display:flex; flex-direction:column; gap:6px;}
.day-card .d-name{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1px;}
.day-card .d-type{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.1;}
.day-card .d-desc{font-size:10.5px; color:var(--gray); line-height:1.4; flex:1;}
.day-card .d-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--gray-dim);}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}

.roadmap-track{position:relative; padding-left:2px;}
.phase-block{display:flex; gap:0; margin-bottom:2px; border-radius:8px; overflow:hidden;}
.phase-seg{padding:14px; position:relative;}
.tabs{display:flex; gap:4px; background:var(--surface2); padding:4px; border-radius:10px; width:fit-content;}
.tab{padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; color:var(--gray); cursor:pointer;}
.tab.active{background:var(--orange); color:#100;}

.kv{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--gray-dim);}
.kv .v{font-family:var(--font-mono); font-weight:600;}

.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;}
.account-badge{
  position:fixed; top:14px; right:14px; z-index:1001;
  display:flex; align-items:center; gap:6px;
  background:var(--surface2); border:1px solid var(--line); border-radius:20px;
  padding:8px 14px; font-size:12px; font-weight:600; color:var(--white); cursor:pointer;
  transition:filter .15s;
}
.account-badge:hover{ filter:brightness(1.15); }
.account-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--gray-dim); }
.account-badge.signed-in .dot{ background:var(--green); box-shadow:0 0 6px var(--green); }

@media(max-width:820px){
  #app{flex-direction:column;}
  .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:14px; left:14px; z-index:1001;
    width:40px; height:40px; border-radius:9px;
    background:var(--surface2); border:1px solid var(--line); color:var(--white);
    font-size:18px; cursor:pointer;
  }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw;
    flex-direction:column; overflow-y:auto; z-index:1000;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-overlay{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .sidebar-overlay.show{ opacity:1; pointer-events:auto; }
  .nav{flex-direction:column; overflow-x:visible;}
  .nav-group-label{display:block;}
  .main{padding:64px 18px 40px;}
}
@media(max-width:480px){
  .grid-2,.grid-3,.grid-4,.grid-6,.grid-auto{grid-template-columns:1fr;}
  input[type=date]{font-size:13px;}
}
input,select,textarea{min-width:0;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="background:#0A0A0B; margin:0;">
<div id="app">
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">☰</button>
  <div class="account-badge" id="account-badge"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>HPS</div>
      <div class="brand-sub">HYROX Performance System</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   HPS — HYROX Performance System
   Rule-based training engine. No AI calls. Pure deterministic JS.
   ============================================================ */

/* ---------------------------------------------------------------------- */
/* 0. CONSTANTS & REFERENCE DATA                                          */
/* ---------------------------------------------------------------------- */
const STATIONS = [
  { key:"ski",      label:"SkiErg",             unit:"1000m",  group:"engine" },
  { key:"sledPush",  label:"Sled Push",          unit:"50m",    group:"strength" },
  { key:"sledPull",  label:"Sled Pull",          unit:"50m",    group:"strength" },
  { key:"burpee",    label:"Burpee Broad Jump",  unit:"80m",    group:"engine" },
  { key:"row",       label:"Row",                unit:"1000m",  group:"engine" },
  { key:"carry",     label:"Farmer Carry",       unit:"200m",   group:"skill" },
  { key:"lunge",     label:"Sandbag Lunge",      unit:"100m",   group:"strength" },
  { key:"wallball",  label:"Wall Ball",          unit:"100reps",group:"skill" },
];
const RUN_KEYS = [1,2,3,4,5,6,7,8];
const DIVISIONS = ["Open","Pro","Open Doubles","Mixed Doubles","Pro Doubles"];

// Illustrative reference benchmark seconds per division (used only to normalize scores 0-100).
// Doubles: runs are completed together at ~unchanged individual pace, while station reps are
// split between partners. Public race-data analyses report doubles teams finishing ~22% faster
// overall than singles; since running is shared unchanged, that saving is concentrated in the
// station legs — solving for that split implies a ~0.46x station-time factor (worked out against
// this table's own Open row, not a literal population average). Mixed Doubles is commonly reported
// as ~5-10% slower than same-sex doubles pairs, so ~7% is applied on top of Open Doubles.
const DOUBLES_STATION_FACTOR = 0.46;
const BENCH = {
  Open:{ ski:270, sledPush:120, sledPull:150, burpee:240, row:255, carry:105, lunge:210, wallball:300, runKm:300, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
  Pro: { ski:200, sledPush:80,  sledPull:100, burpee:170, row:190, carry:75,  lunge:150, wallball:220, runKm:220, weeklyKm:60, squatDL:2.8, hrDrift:5, hrRecoveryDrop:30 },
  "Open Doubles": { ski:124, sledPush:55, sledPull:69, burpee:110, row:117, carry:48, lunge:97, wallball:138, runKm:300, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
  "Pro Doubles":  { ski:92,  sledPush:37, sledPull:46, burpee:78,  row:87,  carry:35, lunge:69, wallball:101, runKm:220, weeklyKm:60, squatDL:2.8, hrDrift:5, hrRecoveryDrop:30 },
  "Mixed Doubles":{ ski:133, sledPush:59, sledPull:74, burpee:118, row:125, carry:51, lunge:104, wallball:148, runKm:321, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
};

const WEEKDAYS = ["월","화","수","목","금","토","일"];

const INDEX_WEIGHTS = { running:0.25, engine:0.20, strengthEnd:0.20, skill:0.15, recovery:0.10, raceExec:0.10 };
const INDEX_META = {
  running:    { label:"Running Index",              why:"HYROX 총 시간의 약 절반(8km)이 러닝이므로 가장 큰 비중을 둡니다." },
  engine:     { label:"Engine Index",                why:"SkiErg/Row/Burpee는 심폐 엔진 의존도가 높아 유산소 능력을 대표합니다." },
  strengthEnd:{ label:"Strength Endurance Index",    why:"Sled/Lunge/기초근력은 파워-지구력 복합 요구를 반영합니다." },
  skill:      { label:"HYROX Skill Index",           why:"Wall Ball·전환 효율은 기술/경기운영 숙련도를 나타냅니다." },
  recovery:   { label:"Recovery Index",              why:"회복 상태는 훈련을 실제 퍼포먼스로 전환하는 승수 역할을 합니다." },
  raceExec:   { label:"Race Execution Index",        why:"페이싱 균일성·전환속도는 실전 경기운영 능력을 나타냅니다." },
};

const PHASES = ["Base","Build","Peak","Taper"];
const PHASE_RATIO = {
  Base:  { run:40, strength:30, wod:15, recovery:15, goal:"유산소 기반 + 기초근력 구축" },
  Build: { run:35, strength:25, wod:25, recovery:15, goal:"러닝 역치 향상 + HYROX 특이성 도입" },
  Peak:  { run:25, strength:20, wod:35, recovery:20, goal:"경기 강도 시뮬레이션 + 페이싱 정교화" },
  Taper: { run:15, strength:10, wod:10, recovery:65, goal:"피로 해소 + 신경계 각성 유지" },
};

/* ---------------------------------------------------------------------- */
/* 1. UTILS                                                                */
/* ---------------------------------------------------------------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round1=(v)=>Math.round(v*10)/10;
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const weeksBetween=(a,b)=>daysBetween(a,b)/7;

function fmtTime(totalSec){
  if(totalSec==null||isNaN(totalSec))return "--:--";
  totalSec=Math.round(totalSec);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function parseTimeToSec(str){
  if(str===undefined||str===null||str==="")return null;
  const parts=String(str).split(":").map(Number);
  if(parts.some((p)=>isNaN(p)))return null;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  return Number(parts[0]);
}
function fmtPace(secPerKm){
  if(secPerKm==null||isNaN(secPerKm))return "--:--/km";
  return fmtTime(secPerKm)+"/km";
}
// lower-is-better normalization: score = (benchmark/actual)*100, capped [0,100]
function scoreLowerBetter(actual, benchmark){
  if(!actual||actual<=0||!benchmark)return null;
  return clamp((benchmark/actual)*100,0,100);
}
// higher-is-better normalization: score = (actual/target)*100, capped [0,100]
function scoreHigherBetter(actual, target){
  if(actual==null||!target)return null;
  return clamp((actual/target)*100,0,100);
}
function weightedAvg(pairs){ // [[score,weight], ...] ignoring nulls, renormalizing weights
  const valid=pairs.filter(p=>p[0]!=null && !isNaN(p[0]));
  if(!valid.length)return null;
  const wsum=valid.reduce((s,p)=>s+p[1],0);
  return valid.reduce((s,p)=>s+p[0]*p[1],0)/wsum;
}
function mean(arr){ arr=arr.filter(v=>v!=null&&!isNaN(v)); return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function stdev(arr){
  arr=arr.filter(v=>v!=null&&!isNaN(v));
  if(arr.length<2)return 0;
  const m=mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)**2)));
}

const MEM_FALLBACK = {};
let storageWarned = false;
const StorageService = {
  async get(key, fallback){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){ /* key not found or storage unavailable */ }
    return key in MEM_FALLBACK ? MEM_FALLBACK[key] : fallback;
  },
  async set(key, value){
    MEM_FALLBACK[key]=value;
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(key, JSON.stringify(value), false);
      }
    }catch(e){
      // transient platform-side hiccup — MEM_FALLBACK above already keeps data intact for this session,
      // so this is non-fatal. Log once rather than spamming on every keystroke's debounced autosave.
      if(!storageWarned){ console.warn("자동저장에 일시적 문제가 있습니다 (세션 내 데이터는 유지됩니다):", e?.message||e); storageWarned=true; }

};

/* ---------------------------------------------------------------------- */
/* 4. HPI ENGINE  — six explainable 0-100 indices + overall HPI            */
/*    Each metric normalized via scoreLowerBetter / scoreHigherBetter,     */
/*    then combined with documented sub-weights, then combined into HPI    */
/*    with documented top-level weights (INDEX_WEIGHTS).                   */
/* ---------------------------------------------------------------------- */
function bench(){ return BENCH[STATE.profile.division] || BENCH.Open; }
function latestRace(){ const r=[...STATE.races].sort((a,b)=>b.date.localeCompare(a.date)); return r[0]||null; }
const STATION_STALE_DAYS = 14;
// cardio-driven stations: a measured running-pace trend is a fairly direct signal, so a larger cap applies.
const ENGINE_STATIONS_ADJUSTABLE = ["ski","row","burpee"];
const MAX_STALE_ADJUST_PCT = 0.05; // hard cap: ±5%, regardless of how strong the training trend looks
// strength/grip stations: general strength-session volume is a much weaker/indirect proxy (it doesn't
// confirm the SPECIFIC lift or load actually improved), so it's allowed only a small, capped nudge —
// present but deliberately minor, never a substitute for a fresh station test.
const STRENGTH_STATIONS_ADJUSTABLE = ["sledPush","sledPull","carry","lunge","wallball"];
const MAX_STRENGTH_STALE_ADJUST_PCT = 0.02; // hard cap: ±2%
const MIN_STRENGTH_SESSIONS_FOR_SIGNAL = 3; // require some real volume before trusting the signal at all

function collectStationCandidates(key){
  const out=[];
  STATE.stationTests.forEach(t=>{ const v=t.values&&t.values[key]; if(v) out.push({date:t.date, value:v, source:"test"}); });
  STATE.races.forEach(r=>{ const v=r.stations&&r.stations[key]; if(v) out.push({date:r.date, value:v, source:"race"}); });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
// average running pace (sec/km) from the unified training log within ±windowDays of centerDate
function avgRunPaceNear(centerDate, windowDays=10){
  const center=new Date(centerDate);
  const start=new Date(center); start.setDate(start.getDate()-windowDays);
  const end=new Date(center); end.setDate(end.getDate()+windowDays);
  const logs=STATE.trainingLog.filter(l=>isRunType(l.type)&&l.avgPaceSecKm && new Date(l.date)>=start && new Date(l.date)<=end);
  return logs.length? mean(logs.map(l=>Number(l.avgPaceSecKm))) : null;
}
// count of "strength"-type unified training log sessions within ±windowDays of centerDate (volume proxy)
function strengthSessionsNear(centerDate, windowDays=21){
  const center=new Date(centerDate);
  const start=new Date(center); start.setDate(start.getDate()-windowDays);
  const end=new Date(center); end.setDate(end.getDate()+windowDays);
  return STATE.trainingLog.filter(l=>l.type==="strength" && new Date(l.date)>=start && new Date(l.date)<=end).length;
}
// per-station freshness resolution: <=14 days -> trust directly. >14 days:
//  - cardio stations get a capped ±5% nudge from measured running-pace change
//  - strength/grip stations get a much smaller capped ±2% nudge from strength-session volume change
//  - both require real training-log evidence on both sides; nothing is ever assumed without data
function getStationDataMeta(){
  const meta={};
  STATIONS.forEach(s=>{
    const candidates=collectStationCandidates(s.key);
    if(!candidates.length){ meta[s.key]=null; return; }
    const top=candidates[0];
    const ageDays=daysBetween(top.date, todayISO());
    const isFresh=ageDays<=STATION_STALE_DAYS;
    let valueStr=top.value, adjusted=false, adjustPct=0;
    if(!isFresh && ENGINE_STATIONS_ADJUSTABLE.includes(s.key)){
      const oldPace=avgRunPaceNear(top.date,10), recentPace=avgRunPaceNear(todayISO(),10);
      if(oldPace && recentPace){
        adjustPct = clamp((oldPace-recentPace)/oldPace, -MAX_STALE_ADJUST_PCT, MAX_STALE_ADJUST_PCT);
        if(Math.abs(adjustPct)>0.002){
          const sec=parseTimeToSec(top.value);
          if(sec){ valueStr=fmtTime(sec*(1-adjustPct)); adjusted=true; }
        }
      }
    } else if(!isFresh && STRENGTH_STATIONS_ADJUSTABLE.includes(s.key)){
      const oldVol=strengthSessionsNear(top.date,21), recentVol=strengthSessionsNear(todayISO(),21);
      if(recentVol>=MIN_STRENGTH_SESSIONS_FOR_SIGNAL || oldVol>=MIN_STRENGTH_SESSIONS_FOR_SIGNAL){
        const denom=Math.max(oldVol,MIN_STRENGTH_SESSIONS_FOR_SIGNAL);
        adjustPct = clamp((recentVol-oldVol)/denom, -1, 1) * MAX_STRENGTH_STALE_ADJUST_PCT;
        if(Math.abs(adjustPct)>0.002){
          const sec=parseTimeToSec(top.value);
          if(sec){ valueStr=fmtTime(sec*(1-adjustPct)); adjusted=true; }
        }
      }
    }
    meta[s.key]={ value:valueStr, rawValue:top.value, date:top.date, ageDays, isFresh, source:top.source, adjusted, adjustPct };
  });
  return meta;
}
function latestStationValues(){
  const meta=getStationDataMeta();
  const out={};
  STATIONS.forEach(s=>{ out[s.key]= meta[s.key]? meta[s.key].value : undefined; });
  return out;
}
function isRunType(t){ return t==="run"||t==="interval"||t==="long"; }
// weekly running-distance series from the unified training log, most-recent week first,
// including weeks with 0km so genuine gaps are reflected (not skipped).
function weeklyKmSeries(weeksBack=8){
  const out=[];
  for(let i=0;i<weeksBack;i++){
    const end=new Date(); end.setDate(end.getDate()-7*i);
    const start=new Date(end); start.setDate(start.getDate()-7);
    out.push(STATE.trainingLog.filter(l=>{ const d=new Date(l.date); return d>start && d<=end && isRunType(l.type); })
      .reduce((s,l)=>s+(Number(l.distanceKm)||0),0));
  }
  return out;
}
function recentMileageAvg(weeks=8){
  const series=weeklyKmSeries(weeks);
  return series.length ? mean(series) : null;
}
// recent training-log entries carrying HR data, most-recent first
function recentHrLog(n=5){
  return [...STATE.trainingLog].filter(l=>l.avgHr||l.hrDrift||l.recoveryDrop).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
}
// recovery signal derived from the unified training log (RPE trend + optional pain flag),
// normalized to {date, rpe, painFlag, painArea} so downstream rules stay unchanged.
function recentRecovery(days=7){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  return STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff)
    .map(l=>({ date:l.date, rpe:l.intensityRpe, painFlag:!!l.painFlag, painArea:l.painArea||"" }));
}
function recentTraining(days=7){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  return STATE.trainingLog.filter(r=>new Date(r.date)>=cutoff);
}
function trainingCountByType(days=14){
  const logs=recentTraining(days);
  const c={run:0,strength:0,wod:0,interval:0,recovery:0};
  logs.forEach(l=>{ if(c[l.type]!=null) c[l.type]++; });
  return c;
}

/* ---------------------------------------------------------------------- */
/* 4b. EMA SMOOTHING for Tier-2 (training-trend) sub-scores                */
/*     Data priority hierarchy:                                            */
/*      Tier 1 (dominant): station tests/PBs within 14 days — updates      */
/*        instantly, never smoothed (see getStationDataMeta/latestStation- */
/*        Values). Drives ~70-80% of any prediction change.                */
/*      Tier 2 (supporting, capped): Garmin/training-log volume & HR       */
/*        trend (weekly mileage adequacy, pacing fade, HR drift, HR        */
/*        recovery). These are smoothed via EMA so a single new session    */
/*        never swings the score — only a sustained trend does — and       */
/*        their effect on the final prediction is hard-capped separately   */
/*        in predictTime() below. The EMA rate itself is user-facing via   */
/*        the "예측 민감도" (Prediction Sensitivity) setting — everything   */
/*        else about Tier 1/Tier 2 stays a fixed internal parameter.       */
/* ---------------------------------------------------------------------- */
const SENSITIVITY_ALPHA = { conservative:0.10, recommended:0.20, sensitive:0.35 };
const SENSITIVITY_META = {
  conservative:{ label:"보수적", desc:"일시적인 훈련 결과의 영향을 적게 반영하고 장기 추세를 더 중요하게 봅니다." },
  recommended:{ label:"추천", desc:"최근 데이터와 장기 추세를 균형 있게 반영합니다 (기본값)." },
  sensitive:{ label:"민감", desc:"최근 훈련 변화에 더 빠르게 반응합니다." },
};
function currentEmaAlpha(){ return SENSITIVITY_ALPHA[STATE.settings.predictionSensitivity] ?? SENSITIVITY_ALPHA.recommended; }
function readEma(key, rawValue){
  const s = STATE.emaState || {};
  if(rawValue==null) return s[key]!=null ? s[key] : null; // no fresh signal -> hold last smoothed value if any
  return s[key]!=null ? s[key] : rawValue; // first-ever observation: no history to smooth against yet
}
function commitEma(key, rawValue){
  if(rawValue==null) return;
  if(!STATE.emaState) STATE.emaState={};
  const prev=STATE.emaState[key];
  const alpha=currentEmaAlpha();
  STATE.emaState[key] = (prev==null) ? rawValue : prev*(1-alpha)+rawValue*alpha;
}
// recomputes the raw Tier-2 sub-scores fresh and folds them into their EMA trails. Called only at
// genuine new-data-entry events (recordHpiSnapshot), never on every render, so the smoothing reflects
// real observations over time rather than re-converging on every page view.
function commitTrainingTrendEma(){
  const b=bench();
  const avgKm=recentMileageAvg(8);
  commitEma("runningMileage", avgKm!=null? scoreHigherBetter(avgKm, b.weeklyKm) : null);
  const race=latestRace();
  let rawFade=null;
  if(race){ const r1=parseTimeToSec(race.runs?.[1]), r8=parseTimeToSec(race.runs?.[8]);
    if(r1&&r8){ const fadePct=((r8-r1)/r1)*100; rawFade=clamp(100-Math.max(0,fadePct)*4,0,100); } }
  commitEma("runningFade", rawFade);
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  commitEma("engineDrift", driftVals.length? clamp(100-(mean(driftVals)-b.hrDrift)*8,0,100) : null);
  const recDropVals=hrLogs.map(h=>Number(h.recoveryDrop)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  commitEma("engineRec", recDropVals.length? scoreHigherBetter(mean(recDropVals), b.hrRecoveryDrop) : null);
}

// ---- Running Index ----
function calcRunningIndex(tier1Only=false){
  const b=bench(); const race=latestRace();
  const detail=[];
  // 1) race-pace score: avg run split vs benchmark per-km pace
  let racePaceScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length){
      const avgSplit=mean(runsSec);
      racePaceScore=scoreLowerBetter(avgSplit, b.runKm);
      detail.push(`최근 대회 평균 러닝 스플릿 ${fmtTime(avgSplit)}/km vs 기준 ${fmtTime(b.runKm)}/km`);
    }
  }
  if(racePaceScore==null && STATE.running.thresholdPace){
    const th=parseTimeToSec(STATE.running.thresholdPace);
    racePaceScore=scoreLowerBetter(th, b.runKm*0.92);
    detail.push(`대회 기록 없음 → Threshold Pace ${fmtTime(th)}/km 로 대체 추정`);
  }
  // 2) PB score — best available PB normalized to a 1km-equivalent pace vs benchmark
  let pbScore=null;
  const pb5=parseTimeToSec(STATE.running.pb5k), pb10=parseTimeToSec(STATE.running.pb10k), pbH=parseTimeToSec(STATE.running.pbHalf);
  const pacesFromPb=[];
  if(pb5) pacesFromPb.push(pb5/5);
  if(pb10) pacesFromPb.push(pb10/10);
  if(pbH) pacesFromPb.push(pbH/21.0975);
  if(pacesFromPb.length){ pbScore=scoreLowerBetter(Math.min(...pacesFromPb), b.runKm*0.85); detail.push(`최고 PB 페이스 ${fmtTime(Math.min(...pacesFromPb))}/km`); }
  // 3) weekly mileage adequacy — Tier 2 (training-trend), EMA-smoothed so one big/small week doesn't swing it
  const avgKm=recentMileageAvg(8);
  const rawMileageScore= avgKm!=null ? scoreHigherBetter(avgKm, b.weeklyKm) : null;
  const mileageScore = tier1Only ? null : readEma("runningMileage", rawMileageScore);
  if(avgKm!=null) detail.push(`최근 8주 평균 주간거리 ${round1(avgKm)}km vs 목표 ${b.weeklyKm}km${tier1Only?"":" (EMA 스무딩 적용)"}`);
  // 4) pacing fade (run1 vs run8) — Tier 2, EMA-smoothed
  let rawFadeScore=null;
  if(race){
    const r1=parseTimeToSec(race.runs?.[1]), r8=parseTimeToSec(race.runs?.[8]);
    if(r1&&r8){ const fadePct=((r8-r1)/r1)*100; rawFadeScore=clamp(100-Math.max(0,fadePct)*4,0,100); detail.push(`Run1→Run8 페이스 저하 ${round1(fadePct)}%`); }
  }
  const fadeScore = tier1Only ? null : readEma("runningFade", rawFadeScore);
  const score = weightedAvg([[racePaceScore,0.40],[pbScore,0.25],[mileageScore,0.20],[fadeScore,0.15]]);
  return { score, detail, sub:{racePaceScore,pbScore,mileageScore,fadeScore} };
}

// ---- Engine Index ----
function calcEngineIndex(tier1Only=false){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const skiSec=parseTimeToSec(st.ski), rowSec=parseTimeToSec(st.row), burpeeSec=parseTimeToSec(st.burpee);
  const skiRowScore = weightedAvg([[scoreLowerBetter(skiSec,b.ski),0.5],[scoreLowerBetter(rowSec,b.row),0.5]]);
  if(skiSec) detail.push(`SkiErg ${fmtTime(skiSec)} vs 기준 ${fmtTime(b.ski)}`);
  if(rowSec) detail.push(`Row ${fmtTime(rowSec)} vs 기준 ${fmtTime(b.row)}`);
  const burpeeScore = scoreLowerBetter(burpeeSec,b.burpee);
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const rawDriftScore = driftVals.length ? clamp(100-(mean(driftVals)-b.hrDrift)*8,0,100) : null;
  const driftScore = tier1Only ? null : readEma("engineDrift", rawDriftScore);
  if(driftVals.length) detail.push(`최근 훈련기록 평균 HR Drift ${round1(mean(driftVals))}% vs 기준 ${b.hrDrift}%${tier1Only?"":" (EMA 스무딩 적용)"}`);
  const recDropVals=hrLogs.map(h=>Number(h.recoveryDrop)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const rawRecScore = recDropVals.length ? scoreHigherBetter(mean(recDropVals), b.hrRecoveryDrop) : null;
  const recScore = tier1Only ? null : readEma("engineRec", rawRecScore);
  if(recDropVals.length) detail.push(`1분 Recovery HR 하강폭 평균 ${round1(mean(recDropVals))}bpm vs 목표 ${b.hrRecoveryDrop}bpm${tier1Only?"":" (EMA 스무딩 적용)"}`);
  const score = weightedAvg([[skiRowScore,0.35],[burpeeScore,0.15],[driftScore,0.30],[recScore,0.20]]);
  return { score, detail, sub:{skiRowScore,burpeeScore,driftScore,recScore} };
}

// ---- Strength Endurance Index ----
function calcStrengthIndex(){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const pushSec=parseTimeToSec(st.sledPush), pullSec=parseTimeToSec(st.sledPull), lungeSec=parseTimeToSec(st.lunge), carrySec=parseTimeToSec(st.carry);
  const sledScore=weightedAvg([[scoreLowerBetter(pushSec,b.sledPush),0.5],[scoreLowerBetter(pullSec,b.sledPull),0.5]]);
  if(pushSec) detail.push(`Sled Push ${fmtTime(pushSec)} vs 기준 ${fmtTime(b.sledPush)}`);
  if(pullSec) detail.push(`Sled Pull ${fmtTime(pullSec)} vs 기준 ${fmtTime(b.sledPull)}`);
  const lungeScore=scoreLowerBetter(lungeSec,b.lunge);
  const carryScore=scoreLowerBetter(carrySec,b.carry);
  const sq=Number(STATE.strength.squat), dl=Number(STATE.strength.deadlift), bw=Number(STATE.profile.weight);
  let rawScore=null;
  if(sq&&dl&&bw){ const ratio=(sq+dl)/bw; rawScore=scoreHigherBetter(ratio,b.squatDL); detail.push(`(Squat+Deadlift)/체중 = ${round1(ratio)} vs 목표 ${b.squatDL}`); }
  const score = weightedAvg([[sledScore,0.35],[lungeScore,0.20],[rawScore,0.30],[carryScore,0.15]]);
  return { score, detail, sub:{sledScore,lungeScore,rawScore,carryScore} };
}

// ---- HYROX Skill Index ----
function calcSkillIndex(){
  const b=bench(); const st=latestStationValues(); const race=latestRace();
  const detail=[];
  const wbSec=parseTimeToSec(st.wallball);
  const wbScore=scoreLowerBetter(wbSec,b.wallball);
  if(wbSec) detail.push(`Wall Ball ${fmtTime(wbSec)} vs 기준 ${fmtTime(b.wallball)}`);
  let transScore=null;
  if(race && race.officialTime){
    const total=parseTimeToSec(race.officialTime);
    const trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ const pct=(trans/total)*100; transScore=clamp(100-Math.max(0,pct-6)*10,0,100); detail.push(`전환시간 비중 ${round1(pct)}% (총 시간 대비)`); }
  }
  let consistScore=null;
  const vals=STATIONS.map(s=>{ const sec=parseTimeToSec(st[s.key]); const bb=b[s.key]; return sec&&bb? sec/bb : null; }).filter(v=>v!=null);
  if(vals.length>=3){ const sd=stdev(vals); consistScore=clamp(100-sd*220,0,100); detail.push(`스테이션별 벤치마크 대비 변동계수 ${round1(sd*100)}%`); }
  const score = weightedAvg([[wbScore,0.35],[transScore,0.35],[consistScore,0.30]]);
  return { score, detail, sub:{wbScore,transScore,consistScore} };
}

// ---- Recovery Index ----
function calcRecoveryIndex(){
  const detail=[];
  const acwr=calcACWR();
  const acwrScore = acwr!=null? clamp(100-Math.abs(acwr-1.0)*90,0,100) : null;
  if(acwr!=null) detail.push(`ACWR(급성:만성 부하비) ${round1(acwr)} (이상 범위 0.8~1.3)`);
  const recent7=recentTraining(7);
  const rpeVals=recent7.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpeTrendScore = rpeVals.length? clamp(100-(mean(rpeVals)-5)*10,0,100) : null;
  if(rpeVals.length) detail.push(`최근 7일 평균 RPE ${round1(mean(rpeVals))} (기준 5)`);
  const trainingDays = new Set(recent7.map(l=>l.date)).size;
  const restDays = clamp(7-trainingDays,0,7);
  const restScore = scoreHigherBetter(restDays, 1.5);
  detail.push(`최근 7일 중 훈련일 ${trainingDays}일 (추정 휴식일 ${restDays}일 vs 목표 1.5일)`);
  const score = weightedAvg([[acwrScore,0.5],[rpeTrendScore,0.3],[restScore,0.2]]);
  return { score, detail, sub:{acwrScore,rpeTrendScore,restScore} };
}

// ---- Race Execution Index ----
function calcRaceExecIndex(){
  const detail=[]; const race=latestRace();
  let pacingScore=null, transSpeedScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length>=4){ const sd=stdev(runsSec); const m=mean(runsSec); const cv=sd/m; pacingScore=clamp(100-cv*100*6,0,100); detail.push(`러닝 스플릿 변동계수 ${round1(cv*100)}% (낮을수록 균일)`); }
    const total=parseTimeToSec(race.officialTime), trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ transSpeedScore=clamp(100-((trans/total)*100-6)*9,0,100); }
  }
  const races=[...STATE.races].sort((a,b)=>a.date.localeCompare(b.date));
  let consistScore=70;
  if(races.length>=2){
    const times=races.map(r=>parseTimeToSec(r.officialTime)).filter(v=>v);
    if(times.length>=2){ const sd=stdev(times); const m=mean(times); consistScore=clamp(100-(sd/m)*100*3,0,100); detail.push(`대회 기록 변동계수 ${round1((sd/m)*100)}%`); }
  } else detail.push("대회 기록 2회 미만 → 기본값(70) 사용");
  const score = weightedAvg([[pacingScore,0.40],[transSpeedScore,0.30],[consistScore,0.30]]);
  return { score, detail, sub:{pacingScore,transSpeedScore,consistScore} };
}

function calcACWR(){
  // acute = last 7d load (duration*rpe), chronic = last 28d/4 weekly avg
  const load=(logs)=>logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0);
  const cutoff7=new Date(); cutoff7.setDate(cutoff7.getDate()-7);
  const cutoff28=new Date(); cutoff28.setDate(cutoff28.getDate()-28);
  const acute=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff7));
  const chronic4wk=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff28))/4;
  if(!chronic4wk)return null;
  return acute/chronic4wk;
}

function calcFatigueScore(){
  // 0-100, higher = more fatigued. Combines ACWR overload + recent RPE trend + reported pain (all from the unified training log).
  const acwr=calcACWR();
  const acwrPenalty = acwr!=null? clamp((acwr-1.0)*60,0,50) : 0;
  const recent3=recentTraining(3);
  const rpeVals=recent3.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpePenalty = rpeVals.length? clamp((mean(rpeVals)-6)*9,0,35) : 0;
  const painPenalty = STATE.trainingLog.some(l=>l.painFlag && daysBetween(l.date, todayISO())<=3) ? 15 : 0;
  return clamp(acwrPenalty+rpePenalty+painPenalty,0,100);
}

/* ---------------------------------------------------------------------- */
/* 4c. DELOAD AUTO-RECOMMENDATION                                          */
/*     Dedicated 6-component weighted fatigue read specifically for the    */
/*     "회복 주기" (recovery-cycle) coaching setting — separate from the    */
/*     general calcFatigueScore() used by the Rule Engine/Dashboard, so     */
/*     that tuning this doesn't disturb the already-tuned safety rules.    */
/* ---------------------------------------------------------------------- */
const DELOAD_WEIGHTS = { trainingLoad:0.30, rpe:0.20, hrDrift:0.15, performanceDrop:0.15, recentHighIntensity:0.10, recoveryPain:0.10 };
function calcDeloadFatigueScore(){
  const b=bench();
  const acwr=calcACWR();
  const trainingLoadScore = acwr!=null ? clamp((acwr-1.0)*70,0,100) : 0;

  const recent7=recentTraining(7);
  const rpeVals=recent7.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpeScore = rpeVals.length ? clamp((mean(rpeVals)-5)*15,0,100) : 0;

  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const hrDriftScore = driftVals.length ? clamp((mean(driftVals)-b.hrDrift)*10,0,100) : 0;

  const trend=hpiTrendPerWeek();
  const performanceDropScore = (trend!=null && trend<0) ? clamp(-trend*20,0,100) : 0;

  const counts7=trainingCountByType(7);
  const highIntensityCount=(counts7.wod||0)+(counts7.interval||0);
  const recentHighIntensityScore = clamp((highIntensityCount-2)*25,0,100);

  const painFlag = STATE.trainingLog.some(l=>l.painFlag && daysBetween(l.date, todayISO())<=7);
  const trainingDays=new Set(recent7.map(l=>l.date)).size;
  const restDays=clamp(7-trainingDays,0,7);
  const recoveryPainScore = painFlag ? 100 : clamp((2-restDays)*30,0,100);

  return clamp(
    trainingLoadScore*DELOAD_WEIGHTS.trainingLoad + rpeScore*DELOAD_WEIGHTS.rpe + hrDriftScore*DELOAD_WEIGHTS.hrDrift +
    performanceDropScore*DELOAD_WEIGHTS.performanceDrop + recentHighIntensityScore*DELOAD_WEIGHTS.recentHighIntensity +
    recoveryPainScore*DELOAD_WEIGHTS.recoveryPain, 0, 100);
}
// 높은 피로 → 4주 / 정상 → 5주 / 낮은 피로 + 적응 양호(HPI 상승 추세) → 6주
function getRecommendedDeloadWeeks(){
  const score=calcDeloadFatigueScore();
  const trend=hpiTrendPerWeek();
  if(score>=65) return 4;
  if(score<35 && trend!=null && trend>0) return 6;
  return 5;
}
function getEffectiveDeloadWeeks(){
  const mode=STATE.settings.deloadMode || "auto";
  if(mode==="auto") return getRecommendedDeloadWeeks();
  if(mode==="custom") return clamp(Number(STATE.settings.deloadCustomWeeks)||5,2,10);
  return Number(mode)||5;
}

function calcHPI(tier1Only=false){
  const running=calcRunningIndex(tier1Only), engine=calcEngineIndex(tier1Only), strengthEnd=calcStrengthIndex(),
        skill=calcSkillIndex(), recovery=calcRecoveryIndex(), raceExec=calcRaceExecIndex();
  const fatigue=calcFatigueScore();
  const indices={running,engine,strengthEnd,skill,recovery,raceExec};
  // tier1Only excludes Recovery entirely (it has no test/PB equivalent — it's inherently a training-
  // trend signal) and Running/Engine already dropped their Tier2 sub-scores above; weightedAvg
  // renormalizes across whatever's left automatically via its null-filtering.
  const weightKeys = tier1Only ? Object.keys(INDEX_WEIGHTS).filter(k=>k!=="recovery") : Object.keys(INDEX_WEIGHTS);
  const hpi = weightedAvg(weightKeys.map(k=>[indices[k].score, INDEX_WEIGHTS[k]]));
  return { hpi, indices, fatigue };
}

/* ---------------------------------------------------------------------- */
/* 5. PREDICTION ENGINE                                                    */
/*    Explainable formula:                                                 */
/*    PredictedTime = Baseline × (1 - ΔHPI×k - ConsistencyBonus + FatiguePenalty) */
/*    CI width driven by Race Execution Index (pacing consistency).        */
/* ---------------------------------------------------------------------- */
function getBaselineTime(hpiResult){
  const race=latestRace();
  if(race && race.officialTime) return { value:parseTimeToSec(race.officialTime), source:"최근 대회 공식 기록", baselineHpiDate:race.date };
  // no race on file: estimate total race time from this division's benchmark table (8 runs + 8 stations + ~5min roxzone)
  const b=bench();
  const refTotal = 8*b.runKm + STATIONS.reduce((s,st)=>s+(b[st.key]||0),0) + 300;
  const estFactor = clamp(1 - ((hpiResult.hpi-50)/100)*0.5, 0.6, 1.5);
  return { value: refTotal*estFactor, source:"대회 기록 없음 → 현재 지표 기반 추정", baselineHpiDate:null };
}
function getHpiAtDate(dateStr){
  const hist=[...STATE.hpiHistory].filter(h=>h.date<=dateStr).sort((a,b)=>b.date.localeCompare(a.date));
  return hist[0]? hist[0].hpi : null;
}
function hpiTrendPerWeek(){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length<2) return null;
  const first=hist[0], last=hist[hist.length-1];
  const wks=weeksBetween(first.date,last.date);
  if(wks<2) return null; // too little real time span to trust as a sustained weekly rate -> use phase default instead
  const rate=(last.hpi-first.hpi)/wks;
  return clamp(rate,-3,3); // sanity cap: genuine week-over-week HPI trends rarely exceed ~3pts/week
}
function defaultWeeklyGrowth(phase){
  return { Base:0.8, Build:0.5, Peak:0.2, Taper:0.0 }[phase] || 0.3;
}
function currentPhase(){
  const target=STATE.profile.targetDate;
  if(!target) return "Build";
  const wksLeft=weeksBetween(todayISO(), target);
  if(wksLeft<0) return "Taper";
  if(wksLeft<=1.5) return "Taper";
  if(wksLeft<=4) return "Peak";
  if(wksLeft<=8) return "Build";
  return "Base";
}
function daysToRace(){
  if(!STATE.profile.targetDate) return null;
  return daysBetween(todayISO(), STATE.profile.targetDate);
}

function predictTime(hpiResult, horizonWeeks=0){
  const k = Number(STATE.settings.improvementPerHpiPoint)/100; // fraction per HPI point, default 0.35%
  const baseline=getBaselineTime(hpiResult);
  const baselineHpi = baseline.baselineHpiDate? getHpiAtDate(baseline.baselineHpiDate) : null;
  const refHpi = baselineHpi!=null? baselineHpi : Math.max(30, hpiResult.hpi-8);

  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const dampedGrowth = growth * Math.pow(0.92,Math.max(0,horizonWeeks-1)); // diminishing returns
  const projectedHpi = clamp(hpiResult.hpi + dampedGrowth*horizonWeeks, 0, 100);

  const deltaHpi = projectedHpi - refHpi;

  // Data priority hierarchy: Tier 1 (station tests within 14d + PBs) should drive the large majority
  // of any predicted change; Tier 2 (Garmin/training-log volume & HR trend, EMA-smoothed above) is a
  // supporting signal only, hard-capped so it can never move the prediction by more than ~4% on its own.
  const hpiTier1 = calcHPI(true);
  const tier2Gap = hpiResult.hpi - hpiTier1.hpi; // how many HPI points Tier-2 signals are currently adding/removing
  const tier2FractionRaw = tier2Gap * k;
  const TIER2_CAP = 0.04; // ±4%, middle of the requested 3-5% band
  const tier2Excess = tier2FractionRaw - clamp(tier2FractionRaw, -TIER2_CAP, TIER2_CAP);

  const counts=trainingCountByType(14);
  const targetSessions = 8; // rough target sessions/2wk for full consistency bonus
  const consistency = clamp(Object.values(counts).reduce((a,b)=>a+b,0)/targetSessions,0,1.3);
  // deliberately small cap: showing up consistently is a minor tiebreaker, not a driver of the prediction.
  // Real capability change (fresh station benchmark tests, PB updates) flows through deltaHpi*k above,
  // which is where the model's weight is meant to live — training volume alone must not inflate the forecast.
  const consistencyBonus = clamp(consistency-0.5,0,0.8) * 0.005; // up to -0.5% max

  const projectedFatigue = horizonWeeks>0 && currentPhase()==="Taper" ? Math.max(20,hpiResult.fatigue-15*horizonWeeks) : hpiResult.fatigue;
  const fatiguePenalty = projectedFatigue>70 ? ((projectedFatigue-70)/10)*0.01 : 0;

  const fraction = clamp(deltaHpi*k - tier2Excess - consistencyBonus + fatiguePenalty, -0.35, 0.15);
  const predicted = baseline.value * (1 - fraction);

  const raceExecScore = hpiResult.indices.raceExec.score ?? 60;
  const ciPct = (100-raceExecScore)/100*0.05 + 0.015; // 1.5%~6.5% half-width
  const ciLow = predicted*(1-ciPct), ciHigh = predicted*(1+ciPct);

  const trendBonus = (growth||0)*5;
  const fatiguePenaltyPts = hpiResult.fatigue>70? (hpiResult.fatigue-70)*0.6:0;
  const improvementProb = clamp(50 + trendBonus - fatiguePenaltyPts + (consistency-0.7)*8, 5, 95);

  return { predicted, ciLow, ciHigh, baseline, projectedHpi, deltaHpi, tier2Gap, improvementProb, horizonWeeks, fraction };
}

function fatiguePenaltySeconds(fatigueScore){
  return fatigueScore>70 ? ((fatigueScore-70)/10)*0.01 : 0;
}

/* ---------------------------------------------------------------------- */
/* 5c. PREDICTION ATTRIBUTION — "왜 예상 기록이 바뀌었는가", 지수별로 분해   */
/*     Compares the two most recent HPI snapshots and converts each        */
/*     index's score change into a seconds-equivalent, using the same      */
/*     weights/k the prediction engine itself uses — so the breakdown      */
/*     always sums to the actual predicted-time change (no hidden terms).  */
/* ---------------------------------------------------------------------- */
function computePredictionAttribution(){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length<2) return null;
  const prev=hist[hist.length-2], curr=hist[hist.length-1];
  const hpiResult=calcHPI();
  const k=Number(STATE.settings.improvementPerHpiPoint)/100;
  const baseline=getBaselineTime(hpiResult).value;
  const items=Object.keys(INDEX_WEIGHTS).map(key=>{
    if(prev[key]==null||curr[key]==null) return null;
    const deltaScore=curr[key]-prev[key];
    // positive deltaScore (improvement) should REDUCE predicted time -> negative seconds
    const timeImpact = -(deltaScore*INDEX_WEIGHTS[key]*k*baseline);
    return { key, label:INDEX_META[key].label.replace(" Index",""), deltaScore, timeImpact };
  }).filter(Boolean);
  if(prev.fatigue!=null && curr.fatigue!=null){
    const deltaPenalty = fatiguePenaltySeconds(curr.fatigue)-fatiguePenaltySeconds(prev.fatigue);
    items.push({ key:"fatigue", label:"Fatigue", deltaScore:curr.fatigue-prev.fatigue, timeImpact: deltaPenalty*baseline });
  }
  items.sort((a,b)=>a.timeImpact-b.timeImpact);
  const totalTimeImpact=items.reduce((s,i)=>s+i.timeImpact,0);
  return { fromDate:prev.date, toDate:curr.date, items, totalTimeImpact };
}

/* ---------------------------------------------------------------------- */
/* 5d. A / B / C GOAL SCENARIOS — Challenge / Realistic / Safe             */
/* ---------------------------------------------------------------------- */
function computeGoalScenarios(){
  const hpiResult=calcHPI();
  const priority=computeTrainingPriority();
  const topTraining=priority[0]?.label?.replace(" Index","") || "—";
  const pSafe=predictTime(hpiResult,4), pReal=predictTime(hpiResult,8), pChallenge=predictTime(hpiResult,12);
  const dLeft=daysToRace();
  const risks=[];
  if(hpiResult.fatigue>60) risks.push("현재 피로도가 높음 — 무리한 강도 상승은 부상 위험을 키울 수 있음");
  if(hpiResult.indices.recovery.score!=null && hpiResult.indices.recovery.score<60) risks.push("회복 지표가 낮음 — 목표 기간 내내 훈련을 꾸준히 유지할 수 있는지가 관건");
  if(dLeft!=null && dLeft<28) risks.push("대회까지 4주 미만 — 큰 폭의 향상보다 컨디션 관리가 우선");
  if(!risks.length) risks.push("현재 특별한 위험 신호는 없음");

  return {
    A: { key:"A", label:"Challenge", sub:"도전적인 목표", predicted:pChallenge.ciLow, weeks:12,
      prob: clamp(pChallenge.improvementProb-25,5,95), risks: risks.slice(0,2), training: topTraining },
    B: { key:"B", label:"Realistic", sub:"현재 데이터 기준 현실적인 목표", predicted:pReal.predicted, weeks:8,
      prob: pReal.improvementProb, risks: risks.slice(0,2), training: topTraining },
    C: { key:"C", label:"Safe", sub:"달성 가능성이 높은 목표", predicted:pSafe.ciHigh, weeks:4,
      prob: clamp(pSafe.improvementProb+20,5,95), risks: risks.slice(0,2), training: topTraining },
  };
}

function analyzeBottleneck(hpiResult){
  const race=latestRace(); const b=bench(); const st=latestStationValues();
  const items=[];
  STATIONS.forEach(s=>{
    const sec=parseTimeToSec(st[s.key]); const bb=b[s.key];
    if(sec&&bb){ const gapPct=((sec-bb)/bb)*100; items.push({ label:s.label, key:s.key, kind:"station", gapPct, actual:sec, bench:bb }); }
  });
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
    const avgRun=mean(runsSec.filter(v=>v!=null));
    if(avgRun){ const gapPct=((avgRun-b.runKm)/b.runKm)*100; items.push({ label:"Running (평균 스플릿)", key:"run", kind:"run", gapPct, actual:avgRun, bench:b.runKm }); }
  }
  items.sort((a,b2)=>b2.gapPct-a.gapPct);
  const worstIndexEntry = Object.entries(hpiResult.indices).sort((a,b2)=>(a[1].score??100)-(b2[1].score??100))[0];
  return { items: items.slice(0,8), worstIndex: worstIndexEntry ? {key:worstIndexEntry[0], ...worstIndexEntry[1]} : null };
}

/* ---------------------------------------------------------------------- */
/* 5a. TRAINING PRIORITY ENGINE                                            */
/*     Training data feeds BOTH the race prediction (already wired into    */
/*     the HPI/prediction engines above) AND next-training-direction        */
/*     decisions here. Priority is NOT "whichever index scores lowest" —    */
/*     it's Impact(race-time weight) × Improvability(headroom), so a index  */
/*     that's already 90+ never gets over-prioritized just because it's     */
/*     numerically the smallest gap to another 90+ index.                  */
/* ---------------------------------------------------------------------- */
// within ONE race: how much did each station's fatigue carry into the run right after it,
// relative to that race's own average run pace (the "general" baseline for that day)?
function computeStationInducedDegradation(race){
  if(!race) return [];
  const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
  const avgRun=mean(runsSec.filter(v=>v!=null));
  if(!avgRun) return [];
  const out=[];
  STATIONS.forEach(s=>{
    const map=STATION_RUN_MAP[s.key];
    if(map.after==null) return; // Wall Ball finishes the race, no run after it
    const afterSec=runsSec[map.after-1];
    if(afterSec!=null) out.push({ key:s.key, label:s.label, afterRunSec:afterSec, baselineSec:avgRun, degradationSec: afterSec-avgRun });
  });
  return out.sort((a,b)=>b.degradationSec-a.degradationSec);
}

// per-index recency-weighted trend from hpiHistory: is this index ACTUALLY improving over the
// long term, or just "doing well recently"? (spec explicitly wants these kept separate)
function indexLongTermTrend(key, weeks=8){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-weeks*7);
  const inWindow=hist.filter(h=>new Date(h.date)>=cutoff && h[key]!=null);
  if(inWindow.length<2) return null;
  const first=inWindow[0][key], last=inWindow[inWindow.length-1][key];
  const wks=Math.max(1,weeksBetween(inWindow[0].date, inWindow[inWindow.length-1].date));
  return (last-first)/wks; // points/week
}

// Impact × Improvability training-priority ranking (spec section 7):
// priority is high when the index both (a) governs a large share of race time [impactWeight,
// reusing the same weights the HPI itself is built from] and (b) still has real room to grow
// [headroom = 100-score]. A 90+ index never outranks a 65 index just by having a smaller gap.
function computeTrainingPriority(){
  const hpiResult=calcHPI();
  const rows=Object.entries(INDEX_WEIGHTS).map(([key,impactWeight])=>{
    const score=hpiResult.indices[key].score;
    const headroom = score!=null ? Math.max(0,100-score) : 50;
    const trend=indexLongTermTrend(key,8);
    const priorityScore = impactWeight*100*(headroom/100);
    return { key, label:INDEX_META[key].label, score, headroom, trend, impactWeight, priorityScore,
      sufficient: score!=null && score>=85 };
  });
  rows.sort((a,b)=>b.priorityScore-a.priorityScore);
  return rows;
}

function buildLimitingFactorNarrative(priority){
  const sufficient=priority.filter(r=>r.sufficient).map(r=>r.label.replace(" Index",""));
  const limiting=priority.filter(r=>!r.sufficient).slice(0,2).map(r=>r.label.replace(" Index",""));
  const parts=[];
  if(sufficient.length) parts.push(`현재 ${sufficient.join("·")}은(는) 목표 기록에 충분한 수준입니다.`);
  if(limiting.length) parts.push(`${limiting.join("·")}이(가) 현재 기록을 가장 크게 제한하고 있어 우선 훈련 대상입니다.`);
  if(!parts.length) parts.push("모든 영역이 고르게 발달되어 있습니다 — 유지 훈련과 레이스 특이성 훈련을 병행하세요.");
  return parts.join(" ");
}

/* ---------------------------------------------------------------------- */
/* 5b. DIVISION TRANSITION PREDICTION ENGINE                               */
/*     Open<->Pro, Doubles->Singles. Real race-pair data takes priority     */
/*     over generic benchmark-gap fallbacks. Direct (station-time) and      */
/*     Secondary (station-induced run degradation) impact are separated,   */
/*     never double-counted: Direct + Secondary + Transition + Residual    */
/*     always reconciles exactly to the observed total time difference.    */
/*     Not surfaced on the Dashboard — see the "모델 설명" page / "Division */
/*     전환 예측" page only.                                                */
/* ---------------------------------------------------------------------- */
// official HYROX sequence: Run1,Ski,Run2,SledPush,Run3,SledPull,Run4,Burpee,Run5,Row,Run6,Carry,Run7,Lunge,Run8,WallBall
const STATION_RUN_MAP = {
  ski:{before:1,after:2}, sledPush:{before:2,after:3}, sledPull:{before:3,after:4}, burpee:{before:4,after:5},
  row:{before:5,after:6}, carry:{before:6,after:7}, lunge:{before:7,after:8}, wallball:{before:8,after:null},
};
// stations whose load actually changes across most division transitions (used for generic fallback estimates)
const LOAD_VARIABLE_STATIONS = ["sledPush","sledPull","carry","lunge","wallball"];

function racesByDivision(div){ return STATE.races.filter(r=>r.division===div).sort((a,b)=>b.date.localeCompare(a.date)); }

// decompose ONE race-pair (same athlete, two divisions) into Direct / Secondary / Transition / Residual,
// reconciling exactly to the observed total time difference (principle: never double-count the same effect).
function decomposeRacePair(raceFrom, raceTo){
  const totalFrom=parseTimeToSec(raceFrom.officialTime), totalTo=parseTimeToSec(raceTo.officialTime);
  if(!totalFrom||!totalTo) return null;
  const runsFrom=RUN_KEYS.map(k=>parseTimeToSec(raceFrom.runs?.[k]));
  const runsTo=RUN_KEYS.map(k=>parseTimeToSec(raceTo.runs?.[k]));
  const validRunDeltas=RUN_KEYS.map((k,i)=> (runsFrom[i]!=null&&runsTo[i]!=null)? runsTo[i]-runsFrom[i] : null).filter(v=>v!=null);
  // "general" run degradation: the portion of run-time change NOT attributable to any specific station
  // (overall fitness/pacing/conditions difference between the two races)
  const generalRunDegradation = validRunDeltas.length? mean(validRunDeltas) : 0;

  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    const secFrom=parseTimeToSec(raceFrom.stations?.[s.key]), secTo=parseTimeToSec(raceTo.stations?.[s.key]);
    if(secFrom!=null && secTo!=null) directImpact[s.key]=secTo-secFrom;
    const map=STATION_RUN_MAP[s.key];
    if(map.after!=null && runsFrom[map.after-1]!=null && runsTo[map.after-1]!=null){
      const afterDelta = runsTo[map.after-1]-runsFrom[map.after-1];
      secondaryImpact[s.key] = afterDelta - generalRunDegradation; // excess beyond general degradation = station-induced
    }
  });
  const transFrom=parseTimeToSec(raceFrom.transition), transTo=parseTimeToSec(raceTo.transition);
  const transitionImpact = (transFrom!=null&&transTo!=null) ? transTo-transFrom : null;

  const directSum=Object.values(directImpact).reduce((a,b)=>a+b,0);
  const secondarySum=Object.values(secondaryImpact).reduce((a,b)=>a+b,0);
  const totalActual = totalTo-totalFrom;
  const accountedSoFar = directSum+secondarySum+(transitionImpact||0);
  const residual = totalActual-accountedSoFar; // whatever the decomposition doesn't explain (general fitness delta, race-day variance, etc.)

  return { fromDate:raceFrom.date, toDate:raceTo.date, totalActual, directImpact, secondaryImpact, transitionImpact, residual, generalRunDegradation, directSum, secondarySum };
}

// find up to maxPairs (fromDivision race, toDivision race) pairs, most recent toDivision race first,
// each paired with its temporally-nearest fromDivision race (within ~9 months if possible)
function pairRacesForTransition(fromDiv, toDiv, maxPairs=5){
  const fromRaces=racesByDivision(fromDiv), toRaces=racesByDivision(toDiv);
  if(!fromRaces.length||!toRaces.length) return [];
  const pairs=[];
  toRaces.slice(0,maxPairs).forEach(toRace=>{
    let best=null, bestGap=Infinity;
    fromRaces.forEach(fromRace=>{
      const gap=Math.abs(daysBetween(fromRace.date, toRace.date));
      if(gap<bestGap){ bestGap=gap; best=fromRace; }
    });
    if(best){
      const d=decomposeRacePair(best, toRace);
      if(d) pairs.push({ ...d, withinWindow: bestGap<=270 });
    }
  });
  return pairs;
}

// recency-weighted personal transition pattern from real race pairs (most recent weighted highest)
function weightedPersonalPattern(pairs){
  if(!pairs.length) return null;
  const weights = pairs.map((_,i)=>Math.pow(0.6,i));
  const wsum=weights.reduce((a,b)=>a+b,0);
  const wAvg=(getter)=>{
    let s=0,ws=0;
    pairs.forEach((p,i)=>{ const v=getter(p); if(v!=null){ s+=v*weights[i]; ws+=weights[i]; } });
    return ws? s/ws : null;
  };
  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    directImpact[s.key]=wAvg(p=>p.directImpact[s.key]);
    secondaryImpact[s.key]=wAvg(p=>p.secondaryImpact[s.key]);
  });
  const transitionImpact=wAvg(p=>p.transitionImpact);
  const residual=wAvg(p=>p.residual);
  // adaptation trend: oldest pair's total loss vs newest pair's total loss
  const sorted=[...pairs].sort((a,b)=>a.toDate.localeCompare(b.toDate));
  const adaptationImprovement = sorted.length>=2 ? (sorted[0].totalActual - sorted[sorted.length-1].totalActual) : null;
  return { directImpact, secondaryImpact, transitionImpact, residual, adaptationImprovement, pairCount:pairs.length };
}

// official HYROX rulebook loaded-weight ratios, Pro/Open (men's Singles, 25/26-26/27 season).
// SkiErg/Row/Burpee carry no added weight in Pro — only these 5 stations get heavier.
const LOAD_RATIO_OPEN_TO_PRO = { sledPush:202/152, sledPull:153/103, carry:64/48, lunge:30/20, wallball:9/6 };
// documented assumption: time increases sub-linearly with load increase, but NOT uniformly across
// station types. Sled Push/Pull are power/friction-driven (push against resistance) — response to
// added load is fairly linear since technique doesn't change much (~0.8-0.85). Wall Ball/Lunge are
// gravity + muscular-endurance driven — added load compounds with core/joint fatigue late in a long
// set, so the time hit is more severe and non-linear (~0.55-0.6). Farmer Carry sits in between
// (grip/core endurance, moderate non-linearity).
const LOAD_ELASTICITY = { sledPush:0.82, sledPull:0.85, carry:0.68, lunge:0.58, wallball:0.60 };

// generic fallback when no real toDivision race exists: applies the REAL official load-ratio for
// Open<->Pro to the athlete's own current station time (not a population-skill benchmark gap, which
// would conflate "how fast elite Pro athletes are" with "how much slower THIS athlete gets under more load").
function genericTransitionEstimate(fromDiv, toDiv){
  const st=latestStationValues();
  const isOpenToPro = fromDiv==="Open" && toDiv==="Pro";
  const isProToOpen = fromDiv==="Pro" && toDiv==="Open";
  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    const userSec=parseTimeToSec(st[s.key]);
    let pctChange=0;
    const ratio=LOAD_RATIO_OPEN_TO_PRO[s.key];
    const elasticity=LOAD_ELASTICITY[s.key] ?? 0.7;
    if(ratio){
      if(isOpenToPro) pctChange=(ratio-1)*elasticity;
      else if(isProToOpen) pctChange=(1/ratio-1)*elasticity;
      // other division pairs (Doubles/Mixed combos): no documented load-ratio basis -> leave at 0 rather than guess
    }
    directImpact[s.key] = userSec!=null ? userSec*pctChange : 0;
    // no real before/after run data available in this division -> assume secondary impact is a documented
    // fraction of direct impact, heavier for load-variable (heavy/grip) stations
    const secFrac = LOAD_VARIABLE_STATIONS.includes(s.key) ? 0.28 : 0.12;
    secondaryImpact[s.key] = directImpact[s.key]*secFrac;
  });
  // no documented basis to assume a generic transition-time change between divisions -> leave at 0
  return { directImpact, secondaryImpact, transitionImpact:0, residual:0, adaptationImprovement:null, pairCount:0 };
}

function computeDivisionTransition(fromDiv, toDiv){
  if(fromDiv===toDiv) return null;
  const fromRace=racesByDivision(fromDiv)[0];
  const baseline = fromRace ? parseTimeToSec(fromRace.officialTime) : null;
  const pairs = pairRacesForTransition(fromDiv, toDiv, 5);
  const usablePairs = pairs.filter(p=>Object.keys(p.directImpact).length>=3); // need reasonable station coverage
  let pattern, confidence, mode;
  if(usablePairs.length>=2){ pattern=weightedPersonalPattern(usablePairs); confidence="High"; mode="personal"; }
  else if(usablePairs.length===1){ pattern=weightedPersonalPattern(usablePairs); confidence="Medium"; mode="personal"; }
  else { pattern=genericTransitionEstimate(fromDiv,toDiv); confidence= fromRace? "Low":"Low"; mode="generic"; }
  if(!baseline) return null; // need at least a fromDivision race to project from

  const directSum=Object.values(pattern.directImpact).reduce((a,b)=>a+(b||0),0);
  const secondarySum=Object.values(pattern.secondaryImpact).reduce((a,b)=>a+(b||0),0);
  const transitionImpact=pattern.transitionImpact||0;
  const residual=pattern.residual||0;
  let centerDelta = directSum+secondarySum+transitionImpact+residual;

  // Pro/division-specific adaptation: if personal trend shows improving transition loss, extrapolate
  // a conservative half of the observed improvement forward
  let adaptationNote=null;
  if(pattern.adaptationImprovement!=null && pattern.adaptationImprovement>0){
    const adj = pattern.adaptationImprovement*0.5;
    centerDelta -= adj;
    adaptationNote = `과거 전환 손실이 개선 추세 (최근 ${round1(pattern.adaptationImprovement)}초 단축) → 절반만 반영해 -${round1(adj)}초 보정`;
  }

  const rangePct = { High:0.04, Medium:0.08, Low:0.15 }[confidence];
  const predictedCenterNow = baseline+centerDelta;
  const predictedNow = { low:predictedCenterNow*(1-rangePct), high:predictedCenterNow*(1+rangePct) };

  // "8주 특화훈련 후": scale down the heavy-station direct+secondary impact by projected
  // Strength/Engine index improvement over 8 weeks (reuses the existing HPI growth-rate model)
  const hpiResult=calcHPI();
  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const projectedGainPts = clamp(growth*8*0.92, 0, 15); // same diminishing-returns damping as predictTime()
  const adaptationFactor = clamp(1-(projectedGainPts/100)*1.4, 0.6, 1.0); // heavy-station impact shrinks with fitness gain
  const centerDeltaAfterTraining = (directSum+secondarySum)*adaptationFactor + transitionImpact + residual - (adaptationNote? pattern.adaptationImprovement*0.5:0);
  const predictedCenterAfter = baseline+centerDeltaAfterTraining;
  const predictedAfterTraining = { low:predictedCenterAfter*(1-rangePct*0.85), high:predictedCenterAfter*(1+rangePct*0.85) };

  const breakdown = STATIONS.map(s=>({
    key:s.key, label:s.label,
    direct:pattern.directImpact[s.key]||0, secondary:pattern.secondaryImpact[s.key]||0,
  })).sort((a,b)=>(b.direct+b.secondary)-(a.direct+a.secondary));

  return {
    fromDiv, toDiv, mode, confidence, baseline, pairCount:pattern.pairCount,
    directSum, secondarySum, transitionImpact, residual, adaptationNote,
    predictedNow, predictedAfterTraining, breakdown, topStations:breakdown.slice(0,3),
  };
}

/* Doubles -> Singles: driven by the athlete's OWN workload share per station in the doubles race.
   Per spec: if share data is missing, do NOT assume an even 50:50 split — flag high uncertainty instead. */
function computeDoublesToSingles(fromDiv, toDiv){
  const doublesRace = racesByDivision(fromDiv)[0];
  if(!doublesRace) return null;
  const baseline = parseTimeToSec(doublesRace.officialTime);
  if(!baseline) return null;
  const share = doublesRace.share || {};
  const hasShareData = STATIONS.some(s=>share[s.key]!=null && share[s.key]!=="");
  const singlesRaces = racesByDivision(toDiv);
  const st = latestStationValues();

  const directImpact={}, secondaryImpact={};
  let confidence, mode;
  if(singlesRaces.length){
    // best case: real singles race also exists — decompose directly (share data used only for narrative, not required)
    const pairs=pairRacesForTransition(fromDiv, toDiv, 3);
    const usable=pairs.filter(p=>Object.keys(p.directImpact).length>=3);
    if(usable.length){ const pattern=weightedPersonalPattern(usable); Object.assign(directImpact,pattern.directImpact); Object.assign(secondaryImpact,pattern.secondaryImpact);
      confidence = usable.length>=2? "High":"Medium"; mode="personal";
      var transitionImpact=pattern.transitionImpact||0, residual=pattern.residual||0, adaptationImprovement=pattern.adaptationImprovement;
    }
  }
  if(!Object.keys(directImpact).length){
    mode="workload";
    if(!hasShareData){
      confidence="Low";
      // no share info at all: cannot personalize -> generic doubles-station-factor reversal, explicitly flagged
      STATIONS.forEach(s=>{
        const doublesSec=parseTimeToSec(doublesRace.stations?.[s.key]);
        if(doublesSec!=null){ directImpact[s.key]=doublesSec*((1/DOUBLES_STATION_FACTOR)-1); secondaryImpact[s.key]=directImpact[s.key]*0.25; }
      });
    } else {
      confidence = STATIONS.every(s=>share[s.key]!=null&&share[s.key]!=="") ? "Medium" : "Low";
      STATIONS.forEach(s=>{
        const doublesSec=parseTimeToSec(doublesRace.stations?.[s.key]);
        const sharePct=Number(share[s.key]);
        if(doublesSec!=null && sharePct>0){
          // doublesSec already reflects the FULL team's time for that station (both partners' turns combined
          // in team elapsed time). The user's own per-rep pace, extrapolated to 100% workload:
          const userOwnPaceForFullReps = doublesSec/(sharePct/100);
          directImpact[s.key] = userOwnPaceForFullReps-doublesSec;
          secondaryImpact[s.key] = directImpact[s.key]*0.30; // singles = no rest between reps -> extra fatigue assumption
        }
      });
    }
  }
  const transImpact = typeof transitionImpact!=="undefined" ? transitionImpact : 0;
  const resid = typeof residual!=="undefined" ? residual : 0;
  const directSum=Object.values(directImpact).reduce((a,b)=>a+(b||0),0);
  const secondarySum=Object.values(secondaryImpact).reduce((a,b)=>a+(b||0),0);
  const centerDelta = directSum+secondarySum+transImpact+resid;
  const rangePct = { High:0.05, Medium:0.10, Low:0.18 }[confidence];
  const predictedCenterNow = baseline+centerDelta;
  const predictedNow = { low:predictedCenterNow*(1-rangePct), high:predictedCenterNow*(1+rangePct) };

  const hpiResult=calcHPI();
  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const projectedGainPts = clamp(growth*8*0.92, 0, 15);
  const adaptationFactor = clamp(1-(projectedGainPts/100)*1.4, 0.6, 1.0);
  const predictedCenterAfter = baseline+(directSum+secondarySum)*adaptationFactor+transImpact+resid;
  const predictedAfterTraining = { low:predictedCenterAfter*(1-rangePct*0.85), high:predictedCenterAfter*(1+rangePct*0.85) };

  const breakdown = STATIONS.map(s=>({ key:s.key, label:s.label, direct:directImpact[s.key]||0, secondary:secondaryImpact[s.key]||0 }))
    .sort((a,b)=>(b.direct+b.secondary)-(a.direct+a.secondary));

  return { fromDiv, toDiv, mode, confidence, baseline, hasShareData, directSum, secondarySum,
    transitionImpact:transImpact, residual:resid, predictedNow, predictedAfterTraining, breakdown, topStations:breakdown.slice(0,3) };
}

function isDoublesDiv(d){ return (d||"").includes("Doubles"); }
function predictDivisionTransition(fromDiv, toDiv){
  if(isDoublesDiv(fromDiv) && !isDoublesDiv(toDiv)) return computeDoublesToSingles(fromDiv, toDiv);
  return computeDivisionTransition(fromDiv, toDiv);
}

/* ---------------------------------------------------------------------- */
/* 6. RULE ENGINE — 10 categories, IF/THEN, Priority-based conflict resolution */
/*    Each rule: { id, category, priority, test(ctx)->bool, action, reason(ctx)->string } */
/*    To extend: push a new object into RULES. No other code changes needed.*/
/* ---------------------------------------------------------------------- */
const PRIORITY_ORDER = { Critical:0, High:1, Medium:2, Low:3 };

function buildRuleContext(){
  const hpiResult=calcHPI();
  const bottleneck=analyzeBottleneck(hpiResult);
  const counts14=trainingCountByType(14);
  const counts7=trainingCountByType(7);
  const recov=recentRecovery(7);
  const recov3=recentRecovery(3);
  const dLeft=daysToRace();
  const wLeft = dLeft!=null? dLeft/7 : null;
  const phase=currentPhase();
  const acwr=calcACWR();
  const painFlags=recov.filter(r=>r.painFlag);
  const mileageAvg=recentMileageAvg(8);
  const b=bench();
  const loadByWeek=(()=>{
    const wks=[];
    for(let i=0;i<4;i++){
      const start=new Date(); start.setDate(start.getDate()-7*(i+1));
      const end=new Date(); end.setDate(end.getDate()-7*i);
      const logs=STATE.trainingLog.filter(l=>{const d=new Date(l.date); return d>=start&&d<end;});
      wks.push(logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0));
    }
    return wks; // [thisWeek(partial-ish), -1, -2, -3]
  })();
  return { hpiResult, bottleneck, counts14, counts7, recov, recov3, dLeft, wLeft, phase, acwr, painFlags, mileageAvg, b, loadByWeek };
}

const RULES = [
