<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPS — HYROX Performance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --surface:#141416; --surface2:#1C1C1F; --surface3:#232326;
  --line:#28282C; --orange:#FF5A1F; --orange-dim:#C2450F; --orange-glow:rgba(255,90,31,.16);
  --white:#F5F4F1; --gray:#9497A0; --gray-dim:#5C5E66;
  --green:#33D17A; --red:#FF4D4D; --amber:#FFB020;
  --crit:#FF4D4D; --high:#FF9A3D; --med:#FFB020; --low:#5C8CFF;
  --font-display:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
::selection{background:var(--orange-glow);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.brand-mark{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.5px; color:var(--white); display:flex; align-items:center; gap:8px;}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange);}
.brand-sub{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; margin-top:4px; text-transform:uppercase;}
.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-group-label{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; text-transform:uppercase; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--gray); font-weight:500; transition:background .15s, color .15s; user-select:none;
}
.nav-item:hover{background:var(--surface2); color:var(--white);}
.nav-item.active{background:var(--orange-glow); color:var(--orange); font-weight:600;}
.nav-item .n-ico{width:16px; text-align:center; font-size:13px; opacity:.9;}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--gray-dim); font-family:var(--font-mono); line-height:1.6;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:28px 34px 60px;}
.page{display:none; flex-direction:column; gap:18px; max-width:1180px;}
.page.active{display:flex;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:600;}
.eyebrow.gray{color:var(--gray-dim);}
h1.page-title{font-family:var(--font-display); font-size:32px; font-weight:800; margin:2px 0 0; letter-spacing:.3px;}
h2.section-title{font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; letter-spacing:.3px;}
p.lead{font-size:12.5px; color:var(--gray); margin:0; line-height:1.6; max-width:640px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px;}
.card.tight{padding:14px 16px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11.5px; color:var(--gray); font-weight:600;}
input,select,textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--white);
  padding:9px 10px; font-size:13px; font-family:var(--font-body); outline:none; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange-dim);}
input[type=date]{font-family:var(--font-mono); color-scheme:dark;}
input[type=checkbox]{width:auto;}
textarea{resize:vertical; min-height:60px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; background:var(--orange); color:#100; border:none;
  border-radius:9px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--surface3); color:var(--white); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--gray); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--red); border:1px solid rgba(255,77,77,.35);}
.btn.sm{padding:6px 11px; font-size:11.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--gray-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--white);}
tr:last-child td{border-bottom:none;}
td.num, th.num{font-family:var(--font-mono); text-align:right;}

.badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.badge.crit{background:rgba(255,77,77,.14); color:var(--crit);}
.badge.high{background:rgba(255,154,61,.14); color:var(--high);}
.badge.med{background:rgba(255,176,32,.14); color:var(--med);}
.badge.low{background:rgba(92,140,255,.14); color:var(--low);}
.badge.elite{background:rgba(51,209,122,.16); color:var(--green);}
.badge.phase-base{background:rgba(148,151,160,.14); color:var(--gray);}
.badge.phase-build{background:rgba(255,176,32,.14); color:var(--amber);}
.badge.phase-peak{background:var(--orange-glow); color:var(--orange);}
.badge.phase-taper{background:rgba(51,209,122,.14); color:var(--green);}

.bar-track{flex:1; height:6px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.stat-num{font-family:var(--font-mono); font-weight:700;}
.mono{font-family:var(--font-mono);}
.empty-note{font-size:12.5px; color:var(--gray-dim); text-align:center; padding:22px 10px; border:1px dashed var(--line); border-radius:10px;}
.divider{height:1px; background:var(--line); margin:4px 0;}
.hstack{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.chip{font-family:var(--font-mono); font-size:10.5px; padding:4px 9px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); color:var(--gray); cursor:pointer;}
.chip.on{background:var(--orange-glow); color:var(--orange); border-color:transparent;}
.list-remove{cursor:pointer; color:var(--gray-dim); font-size:14px;}
.list-remove:hover{color:var(--red);}
.reason-line{font-size:11.5px; color:var(--gray); font-family:var(--font-mono); line-height:1.6;}
.rule-id{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim);}
::placeholder{color:var(--gray-dim);}

.toast{position:fixed; bottom:20px; right:24px; background:var(--surface3); border:1px solid var(--line); border-left:3px solid var(--orange); padding:11px 16px; border-radius:9px; font-size:12.5px; z-index:999; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;}
.toast.show{opacity:1; transform:translateY(0);}

/* signature race-strip */
.race-strip{display:flex; gap:2px; align-items:flex-end; height:64px; padding:0 2px;}
.race-strip .seg{flex:1; border-radius:3px 3px 1px 1px; position:relative; min-width:4px; transition:height .3s;}
.race-strip .seg.run{background:linear-gradient(180deg, var(--orange), var(--orange-dim));}
.race-strip .seg.station{background:linear-gradient(180deg,#4B7BFF,#2C4FAD);}
.race-strip-labels{display:flex; gap:2px; margin-top:4px;}
.race-strip-labels span{flex:1; text-align:center; font-family:var(--font-mono); font-size:8px; color:var(--gray-dim); min-width:4px;}

.step-chain{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:12px; padding:10px 0;}
.step-item .step-num{width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--orange); flex-shrink:0;}
.step-item .step-line{width:1px; background:var(--line); flex:1; margin:0 auto;}
.step-conn{display:flex; flex-direction:column; align-items:center; width:22px; flex-shrink:0;}
.step-conn .ln{width:1px; flex:1; background:var(--line); min-height:10px;}
.step-body{padding-top:1px;}
.step-q{font-size:11.5px; color:var(--gray-dim); text-transform:uppercase; letter-spacing:.5px; font-family:var(--font-mono);}
.step-a{font-size:13px; color:var(--white); margin-top:2px; font-weight:600;}
.step-conclusion{margin-top:6px; padding:12px 14px; background:var(--orange-glow); border-radius:10px; border-left:3px solid var(--orange);}
.step-conclusion .lbl{font-family:var(--font-mono); font-size:10px; color:var(--orange); letter-spacing:1px; text-transform:uppercase;}
.step-conclusion .val{font-size:14px; font-weight:700; margin-top:3px;}

.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.day-card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:12px 10px; min-height:120px; display:flex; flex-direction:column; gap:6px;}
.day-card .d-name{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1px;}
.day-card .d-type{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.1;}
.day-card .d-desc{font-size:10.5px; color:var(--gray); line-height:1.4; flex:1;}
.day-card .d-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--gray-dim);}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}

.roadmap-track{position:relative; padding-left:2px;}
.phase-block{display:flex; gap:0; margin-bottom:2px; border-radius:8px; overflow:hidden;}
.phase-seg{padding:14px; position:relative;}
.tabs{display:flex; gap:4px; background:var(--surface2); padding:4px; border-radius:10px; width:fit-content;}
.tab{padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; color:var(--gray); cursor:pointer;}
.tab.active{background:var(--orange); color:#100;}

.kv{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--gray-dim);}
.kv .v{font-family:var(--font-mono); font-weight:600;}

.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;}

@media(max-width:820px){
  #app{flex-direction:column;}
  .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:14px; left:14px; z-index:1001;
    width:40px; height:40px; border-radius:9px;
    background:var(--surface2); border:1px solid var(--line); color:var(--white);
    font-size:18px; cursor:pointer;
  }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw;
    flex-direction:column; overflow-y:auto; z-index:1000;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-overlay{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .sidebar-overlay.show{ opacity:1; pointer-events:auto; }
  .nav{flex-direction:column; overflow-x:visible;}
  .nav-group-label{display:block;}
  .main{padding:64px 18px 40px;}
}
</style>
</head>
<body>
<div id="app">
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>HPS</div>
      <div class="brand-sub">HYROX Performance System</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   HPS — HYROX Performance System
   Rule-based training engine. No AI calls. Pure deterministic JS.
   ============================================================ */

/* ---------------------------------------------------------------------- */
/* 0. CONSTANTS & REFERENCE DATA                                          */
/* ---------------------------------------------------------------------- */
const STATIONS = [
  { key:"ski",      label:"SkiErg",             unit:"1000m",  group:"engine" },
  { key:"sledPush",  label:"Sled Push",          unit:"50m",    group:"strength" },
  { key:"sledPull",  label:"Sled Pull",          unit:"50m",    group:"strength" },
  { key:"burpee",    label:"Burpee Broad Jump",  unit:"80m",    group:"engine" },
  { key:"row",       label:"Row",                unit:"1000m",  group:"engine" },
  { key:"carry",     label:"Farmer Carry",       unit:"200m",   group:"skill" },
  { key:"lunge",     label:"Sandbag Lunge",      unit:"100m",   group:"strength" },
  { key:"wallball",  label:"Wall Ball",          unit:"100reps",group:"skill" },
];
const RUN_KEYS = [1,2,3,4,5,6,7,8];
const DIVISIONS = ["Open","Pro","Open Doubles","Mixed Doubles","Pro Doubles"];

// Illustrative reference benchmark seconds per division (used only to normalize scores 0-100).
// Doubles: runs are completed together at ~unchanged individual pace, while station reps are
// split between partners. Public race-data analyses report doubles teams finishing ~22% faster
// overall than singles; since running is shared unchanged, that saving is concentrated in the
// station legs — solving for that split implies a ~0.46x station-time factor (worked out against
// this table's own Open row, not a literal population average). Mixed Doubles is commonly reported
// as ~5-10% slower than same-sex doubles pairs, so ~7% is applied on top of Open Doubles.
const DOUBLES_STATION_FACTOR = 0.46;
const BENCH = {
  Open:{ ski:270, sledPush:120, sledPull:150, burpee:240, row:255, carry:105, lunge:210, wallball:300, runKm:300, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
  Pro: { ski:200, sledPush:80,  sledPull:100, burpee:170, row:190, carry:75,  lunge:150, wallball:220, runKm:220, weeklyKm:60, squatDL:2.8, hrDrift:5, hrRecoveryDrop:30 },
  "Open Doubles": { ski:124, sledPush:55, sledPull:69, burpee:110, row:117, carry:48, lunge:97, wallball:138, runKm:300, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
  "Pro Doubles":  { ski:92,  sledPush:37, sledPull:46, burpee:78,  row:87,  carry:35, lunge:69, wallball:101, runKm:220, weeklyKm:60, squatDL:2.8, hrDrift:5, hrRecoveryDrop:30 },
  "Mixed Doubles":{ ski:133, sledPush:59, sledPull:74, burpee:118, row:125, carry:51, lunge:104, wallball:148, runKm:321, weeklyKm:40, squatDL:2.2, hrDrift:8, hrRecoveryDrop:22 },
};

const WEEKDAYS = ["월","화","수","목","금","토","일"];

const INDEX_WEIGHTS = { running:0.25, engine:0.20, strengthEnd:0.20, skill:0.15, recovery:0.10, raceExec:0.10 };
const INDEX_META = {
  running:    { label:"Running Index",              why:"HYROX 총 시간의 약 절반(8km)이 러닝이므로 가장 큰 비중을 둡니다." },
  engine:     { label:"Engine Index",                why:"SkiErg/Row/Burpee는 심폐 엔진 의존도가 높아 유산소 능력을 대표합니다." },
  strengthEnd:{ label:"Strength Endurance Index",    why:"Sled/Lunge/기초근력은 파워-지구력 복합 요구를 반영합니다." },
  skill:      { label:"HYROX Skill Index",           why:"Wall Ball·전환 효율은 기술/경기운영 숙련도를 나타냅니다." },
  recovery:   { label:"Recovery Index",              why:"회복 상태는 훈련을 실제 퍼포먼스로 전환하는 승수 역할을 합니다." },
  raceExec:   { label:"Race Execution Index",        why:"페이싱 균일성·전환속도는 실전 경기운영 능력을 나타냅니다." },
};

const PHASES = ["Base","Build","Peak","Taper"];
const PHASE_RATIO = {
  Base:  { run:40, strength:30, wod:15, recovery:15, goal:"유산소 기반 + 기초근력 구축" },
  Build: { run:35, strength:25, wod:25, recovery:15, goal:"러닝 역치 향상 + HYROX 특이성 도입" },
  Peak:  { run:25, strength:20, wod:35, recovery:20, goal:"경기 강도 시뮬레이션 + 페이싱 정교화" },
  Taper: { run:15, strength:10, wod:10, recovery:65, goal:"피로 해소 + 신경계 각성 유지" },
};

/* ---------------------------------------------------------------------- */
/* 1. UTILS                                                                */
/* ---------------------------------------------------------------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round1=(v)=>Math.round(v*10)/10;
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const weeksBetween=(a,b)=>daysBetween(a,b)/7;

function fmtTime(totalSec){
  if(totalSec==null||isNaN(totalSec))return "--:--";
  totalSec=Math.round(totalSec);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function parseTimeToSec(str){
  if(str===undefined||str===null||str==="")return null;
  const parts=String(str).split(":").map(Number);
  if(parts.some((p)=>isNaN(p)))return null;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  return Number(parts[0]);
}
function fmtPace(secPerKm){
  if(secPerKm==null||isNaN(secPerKm))return "--:--/km";
  return fmtTime(secPerKm)+"/km";
}
// lower-is-better normalization: score = (benchmark/actual)*100, capped [0,100]
function scoreLowerBetter(actual, benchmark){
  if(!actual||actual<=0||!benchmark)return null;
  return clamp((benchmark/actual)*100,0,100);
}
// higher-is-better normalization: score = (actual/target)*100, capped [0,100]
function scoreHigherBetter(actual, target){
  if(actual==null||!target)return null;
  return clamp((actual/target)*100,0,100);
}
function weightedAvg(pairs){ // [[score,weight], ...] ignoring nulls, renormalizing weights
  const valid=pairs.filter(p=>p[0]!=null && !isNaN(p[0]));
  if(!valid.length)return null;
  const wsum=valid.reduce((s,p)=>s+p[1],0);
  return valid.reduce((s,p)=>s+p[0]*p[1],0)/wsum;
}
function mean(arr){ arr=arr.filter(v=>v!=null&&!isNaN(v)); return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function stdev(arr){
  arr=arr.filter(v=>v!=null&&!isNaN(v));
  if(arr.length<2)return 0;
  const m=mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)**2)));
}
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------------------------------------------------------------- */
/* 2. STORAGE (persistent, artifact-safe: window.storage w/ in-memory fallback) */
/* ---------------------------------------------------------------------- */
const MEM_FALLBACK = {};
const StorageService = {
  async get(key, fallback){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){ /* key not found or storage unavailable */ }
    return key in MEM_FALLBACK ? MEM_FALLBACK[key] : fallback;
  },
  async set(key, value){
    MEM_FALLBACK[key]=value;
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(key, JSON.stringify(value), false);
      }
    }catch(e){ console.warn("storage set failed", key, e); }
  }
};

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------------------------------------------------------------------- */
/* 3. STATE MODEL                                                         */

let CURRENT_PAGE = "dashboard";

async function loadState(){

/* ---------------------------------------------------------------------- */
/* 4. HPI ENGINE  — six explainable 0-100 indices + overall HPI            */
/*    Each metric normalized via scoreLowerBetter / scoreHigherBetter,     */
/*    then combined with documented sub-weights, then combined into HPI    */
/*    with documented top-level weights (INDEX_WEIGHTS).                   */
/* ---------------------------------------------------------------------- */
function bench(){ return BENCH[STATE.profile.division] || BENCH.Open; }
function latestRace(){ const r=[...STATE.races].sort((a,b)=>b.date.localeCompare(a.date)); return r[0]||null; }
function latestStationValues(){
  // prefer most recent dedicated station test, else fall back to latest race splits
  const tests=[...STATE.stationTests].sort((a,b)=>b.date.localeCompare(a.date));
  if(tests[0]) return tests[0].values;
  const race=latestRace();
  return race ? race.stations : {};
}
function isRunType(t){ return t==="run"||t==="interval"||t==="long"; }
// weekly running-distance series from the unified training log, most-recent week first,
// including weeks with 0km so genuine gaps are reflected (not skipped).
function weeklyKmSeries(weeksBack=8){
  const out=[];
  for(let i=0;i<weeksBack;i++){
    const end=new Date(); end.setDate(end.getDate()-7*i);
    const start=new Date(end); start.setDate(start.getDate()-7);
    out.push(STATE.trainingLog.filter(l=>{ const d=new Date(l.date); return d>start && d<=end && isRunType(l.type); })
      .reduce((s,l)=>s+(Number(l.distanceKm)||0),0));
  }
  return out;
}
function recentMileageAvg(weeks=8){
  const series=weeklyKmSeries(weeks);
  return series.length ? mean(series) : null;
}
// recent training-log entries carrying HR data, most-recent first
function recentHrLog(n=5){
  return [...STATE.trainingLog].filter(l=>l.avgHr||l.hrDrift||l.recoveryDrop).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
}
// recovery signal derived from the unified training log (RPE trend + optional pain flag),
// normalized to {date, rpe, painFlag, painArea} so downstream rules stay unchanged.
function recentRecovery(days=7){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  return STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff)
    .map(l=>({ date:l.date, rpe:l.intensityRpe, painFlag:!!l.painFlag, painArea:l.painArea||"" }));
}
function recentTraining(days=7){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  return STATE.trainingLog.filter(r=>new Date(r.date)>=cutoff);
}
function trainingCountByType(days=14){
  const logs=recentTraining(days);
  const c={run:0,strength:0,wod:0,interval:0,recovery:0};
  logs.forEach(l=>{ if(c[l.type]!=null) c[l.type]++; });
  return c;
}

// ---- Running Index ----
function calcRunningIndex(){
  const b=bench(); const race=latestRace();
  const detail=[];
  // 1) race-pace score: avg run split vs benchmark per-km pace
  let racePaceScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length){
      const avgSplit=mean(runsSec);
      racePaceScore=scoreLowerBetter(avgSplit, b.runKm);
      detail.push(`최근 대회 평균 러닝 스플릿 ${fmtTime(avgSplit)}/km vs 기준 ${fmtTime(b.runKm)}/km`);
    }
  }
  if(racePaceScore==null && STATE.running.thresholdPace){
    const th=parseTimeToSec(STATE.running.thresholdPace);
    racePaceScore=scoreLowerBetter(th, b.runKm*0.92);
    detail.push(`대회 기록 없음 → Threshold Pace ${fmtTime(th)}/km 로 대체 추정`);
  }
  // 2) PB score — best available PB normalized to a 1km-equivalent pace vs benchmark
  let pbScore=null;
  const pb5=parseTimeToSec(STATE.running.pb5k), pb10=parseTimeToSec(STATE.running.pb10k), pbH=parseTimeToSec(STATE.running.pbHalf);
  const pacesFromPb=[];
  if(pb5) pacesFromPb.push(pb5/5);
  if(pb10) pacesFromPb.push(pb10/10);
  if(pbH) pacesFromPb.push(pbH/21.0975);
  if(pacesFromPb.length){ pbScore=scoreLowerBetter(Math.min(...pacesFromPb), b.runKm*0.85); detail.push(`최고 PB 페이스 ${fmtTime(Math.min(...pacesFromPb))}/km`); }
  // 3) weekly mileage adequacy
  const avgKm=recentMileageAvg(8);
  const mileageScore= avgKm!=null ? scoreHigherBetter(avgKm, b.weeklyKm) : null;
  if(avgKm!=null) detail.push(`최근 8주 평균 주간거리 ${round1(avgKm)}km vs 목표 ${b.weeklyKm}km`);
  // 4) pacing fade (run1 vs run8)
  let fadeScore=null;
  if(race){
    const r1=parseTimeToSec(race.runs?.[1]), r8=parseTimeToSec(race.runs?.[8]);
    if(r1&&r8){ const fadePct=((r8-r1)/r1)*100; fadeScore=clamp(100-Math.max(0,fadePct)*4,0,100); detail.push(`Run1→Run8 페이스 저하 ${round1(fadePct)}%`); }
  }
  const score = weightedAvg([[racePaceScore,0.40],[pbScore,0.25],[mileageScore,0.20],[fadeScore,0.15]]);
  return { score, detail, sub:{racePaceScore,pbScore,mileageScore,fadeScore} };
}

// ---- Engine Index ----
function calcEngineIndex(){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const skiSec=parseTimeToSec(st.ski), rowSec=parseTimeToSec(st.row), burpeeSec=parseTimeToSec(st.burpee);
  const skiRowScore = weightedAvg([[scoreLowerBetter(skiSec,b.ski),0.5],[scoreLowerBetter(rowSec,b.row),0.5]]);
  if(skiSec) detail.push(`SkiErg ${fmtTime(skiSec)} vs 기준 ${fmtTime(b.ski)}`);
  if(rowSec) detail.push(`Row ${fmtTime(rowSec)} vs 기준 ${fmtTime(b.row)}`);
  const burpeeScore = scoreLowerBetter(burpeeSec,b.burpee);
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const driftScore = driftVals.length ? clamp(100-(mean(driftVals)-b.hrDrift)*8,0,100) : null;
  if(driftVals.length) detail.push(`최근 훈련기록 평균 HR Drift ${round1(mean(driftVals))}% vs 기준 ${b.hrDrift}%`);
  const recDropVals=hrLogs.map(h=>Number(h.recoveryDrop)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const recScore = recDropVals.length ? scoreHigherBetter(mean(recDropVals), b.hrRecoveryDrop) : null;
  if(recDropVals.length) detail.push(`1분 Recovery HR 하강폭 평균 ${round1(mean(recDropVals))}bpm vs 목표 ${b.hrRecoveryDrop}bpm`);
  const score = weightedAvg([[skiRowScore,0.35],[burpeeScore,0.15],[driftScore,0.30],[recScore,0.20]]);
  return { score, detail, sub:{skiRowScore,burpeeScore,driftScore,recScore} };
}

// ---- Strength Endurance Index ----
function calcStrengthIndex(){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const pushSec=parseTimeToSec(st.sledPush), pullSec=parseTimeToSec(st.sledPull), lungeSec=parseTimeToSec(st.lunge), carrySec=parseTimeToSec(st.carry);
  const sledScore=weightedAvg([[scoreLowerBetter(pushSec,b.sledPush),0.5],[scoreLowerBetter(pullSec,b.sledPull),0.5]]);
  if(pushSec) detail.push(`Sled Push ${fmtTime(pushSec)} vs 기준 ${fmtTime(b.sledPush)}`);
  if(pullSec) detail.push(`Sled Pull ${fmtTime(pullSec)} vs 기준 ${fmtTime(b.sledPull)}`);
  const lungeScore=scoreLowerBetter(lungeSec,b.lunge);
  const carryScore=scoreLowerBetter(carrySec,b.carry);
  const sq=Number(STATE.strength.squat), dl=Number(STATE.strength.deadlift), bw=Number(STATE.profile.weight);
  let rawScore=null;
  if(sq&&dl&&bw){ const ratio=(sq+dl)/bw; rawScore=scoreHigherBetter(ratio,b.squatDL); detail.push(`(Squat+Deadlift)/체중 = ${round1(ratio)} vs 목표 ${b.squatDL}`); }
  const score = weightedAvg([[sledScore,0.35],[lungeScore,0.20],[rawScore,0.30],[carryScore,0.15]]);
  return { score, detail, sub:{sledScore,lungeScore,rawScore,carryScore} };
}

// ---- HYROX Skill Index ----
function calcSkillIndex(){
  const b=bench(); const st=latestStationValues(); const race=latestRace();
  const detail=[];
  const wbSec=parseTimeToSec(st.wallball);
  const wbScore=scoreLowerBetter(wbSec,b.wallball);
  if(wbSec) detail.push(`Wall Ball ${fmtTime(wbSec)} vs 기준 ${fmtTime(b.wallball)}`);
  let transScore=null;
  if(race && race.officialTime){
    const total=parseTimeToSec(race.officialTime);
    const trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ const pct=(trans/total)*100; transScore=clamp(100-Math.max(0,pct-6)*10,0,100); detail.push(`전환시간 비중 ${round1(pct)}% (총 시간 대비)`); }
  }
  let consistScore=null;
  const vals=STATIONS.map(s=>{ const sec=parseTimeToSec(st[s.key]); const bb=b[s.key]; return sec&&bb? sec/bb : null; }).filter(v=>v!=null);
  if(vals.length>=3){ const sd=stdev(vals); consistScore=clamp(100-sd*220,0,100); detail.push(`스테이션별 벤치마크 대비 변동계수 ${round1(sd*100)}%`); }
  const score = weightedAvg([[wbScore,0.35],[transScore,0.35],[consistScore,0.30]]);
  return { score, detail, sub:{wbScore,transScore,consistScore} };
}

// ---- Recovery Index ----
function calcRecoveryIndex(){
  const detail=[];
  const acwr=calcACWR();
  const acwrScore = acwr!=null? clamp(100-Math.abs(acwr-1.0)*90,0,100) : null;
  if(acwr!=null) detail.push(`ACWR(급성:만성 부하비) ${round1(acwr)} (이상 범위 0.8~1.3)`);
  const recent7=recentTraining(7);
  const rpeVals=recent7.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpeTrendScore = rpeVals.length? clamp(100-(mean(rpeVals)-5)*10,0,100) : null;
  if(rpeVals.length) detail.push(`최근 7일 평균 RPE ${round1(mean(rpeVals))} (기준 5)`);
  const trainingDays = new Set(recent7.map(l=>l.date)).size;
  const restDays = clamp(7-trainingDays,0,7);
  const restScore = scoreHigherBetter(restDays, 1.5);
  detail.push(`최근 7일 중 훈련일 ${trainingDays}일 (추정 휴식일 ${restDays}일 vs 목표 1.5일)`);
  const score = weightedAvg([[acwrScore,0.5],[rpeTrendScore,0.3],[restScore,0.2]]);
  return { score, detail, sub:{acwrScore,rpeTrendScore,restScore} };
}

// ---- Race Execution Index ----
function calcRaceExecIndex(){
  const detail=[]; const race=latestRace();
  let pacingScore=null, transSpeedScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length>=4){ const sd=stdev(runsSec); const m=mean(runsSec); const cv=sd/m; pacingScore=clamp(100-cv*100*6,0,100); detail.push(`러닝 스플릿 변동계수 ${round1(cv*100)}% (낮을수록 균일)`); }
    const total=parseTimeToSec(race.officialTime), trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ transSpeedScore=clamp(100-((trans/total)*100-6)*9,0,100); }
  }
  const races=[...STATE.races].sort((a,b)=>a.date.localeCompare(b.date));
  let consistScore=70;
  if(races.length>=2){
    const times=races.map(r=>parseTimeToSec(r.officialTime)).filter(v=>v);
    if(times.length>=2){ const sd=stdev(times); const m=mean(times); consistScore=clamp(100-(sd/m)*100*3,0,100); detail.push(`대회 기록 변동계수 ${round1((sd/m)*100)}%`); }
  } else detail.push("대회 기록 2회 미만 → 기본값(70) 사용");
  const score = weightedAvg([[pacingScore,0.40],[transSpeedScore,0.30],[consistScore,0.30]]);
  return { score, detail, sub:{pacingScore,transSpeedScore,consistScore} };
}

function calcACWR(){
  // acute = last 7d load (duration*rpe), chronic = last 28d/4 weekly avg
  const load=(logs)=>logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0);
  const cutoff7=new Date(); cutoff7.setDate(cutoff7.getDate()-7);
  const cutoff28=new Date(); cutoff28.setDate(cutoff28.getDate()-28);
  const acute=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff7));
  const chronic4wk=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff28))/4;
  if(!chronic4wk)return null;
  return acute/chronic4wk;
}

function calcFatigueScore(){
  // 0-100, higher = more fatigued. Combines ACWR overload + recent RPE trend + reported pain (all from the unified training log).
  const acwr=calcACWR();
  const acwrPenalty = acwr!=null? clamp((acwr-1.0)*60,0,50) : 0;
  const recent3=recentTraining(3);
  const rpeVals=recent3.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpePenalty = rpeVals.length? clamp((mean(rpeVals)-6)*9,0,35) : 0;
  const painPenalty = STATE.trainingLog.some(l=>l.painFlag && daysBetween(l.date, todayISO())<=3) ? 15 : 0;
  return clamp(acwrPenalty+rpePenalty+painPenalty,0,100);
}

function calcHPI(){
  const running=calcRunningIndex(), engine=calcEngineIndex(), strengthEnd=calcStrengthIndex(),
        skill=calcSkillIndex(), recovery=calcRecoveryIndex(), raceExec=calcRaceExecIndex();
  const fatigue=calcFatigueScore();
  const indices={running,engine,strengthEnd,skill,recovery,raceExec};
  const hpi = weightedAvg(Object.keys(INDEX_WEIGHTS).map(k=>[indices[k].score, INDEX_WEIGHTS[k]]));
  return { hpi, indices, fatigue };
}

/* ---------------------------------------------------------------------- */
/* 5. PREDICTION ENGINE                                                    */
/*    Explainable formula:                                                 */
/*    PredictedTime = Baseline × (1 - ΔHPI×k - ConsistencyBonus + FatiguePenalty) */
/*    CI width driven by Race Execution Index (pacing consistency).        */
/* ---------------------------------------------------------------------- */
function getBaselineTime(hpiResult){
  const race=latestRace();
  if(race && race.officialTime) return { value:parseTimeToSec(race.officialTime), source:"최근 대회 공식 기록", baselineHpiDate:race.date };
  // no race on file: estimate total race time from this division's benchmark table (8 runs + 8 stations + ~5min roxzone)
  const b=bench();
  const refTotal = 8*b.runKm + STATIONS.reduce((s,st)=>s+(b[st.key]||0),0) + 300;
  const estFactor = clamp(1 - ((hpiResult.hpi-50)/100)*0.5, 0.6, 1.5);
  return { value: refTotal*estFactor, source:"대회 기록 없음 → 현재 지표 기반 추정", baselineHpiDate:null };
}
function getHpiAtDate(dateStr){
  const hist=[...STATE.hpiHistory].filter(h=>h.date<=dateStr).sort((a,b)=>b.date.localeCompare(a.date));
  return hist[0]? hist[0].hpi : null;
}
function hpiTrendPerWeek(){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length<2) return null;
  const first=hist[0], last=hist[hist.length-1];
  const wks=Math.max(1,weeksBetween(first.date,last.date));
  return (last.hpi-first.hpi)/wks;
}
function defaultWeeklyGrowth(phase){
  return { Base:0.8, Build:0.5, Peak:0.2, Taper:0.0 }[phase] || 0.3;
}
function currentPhase(){
  const target=STATE.profile.targetDate;
  if(!target) return "Build";
  const wksLeft=weeksBetween(todayISO(), target);
  if(wksLeft<0) return "Taper";
  if(wksLeft<=1.5) return "Taper";
  if(wksLeft<=4) return "Peak";
  if(wksLeft<=8) return "Build";
  return "Base";
}
function daysToRace(){
  if(!STATE.profile.targetDate) return null;
  return daysBetween(todayISO(), STATE.profile.targetDate);
}

function predictTime(hpiResult, horizonWeeks=0){
  const k = Number(STATE.settings.improvementPerHpiPoint)/100; // fraction per HPI point, default 0.35%
  const baseline=getBaselineTime(hpiResult);
  const baselineHpi = baseline.baselineHpiDate? getHpiAtDate(baseline.baselineHpiDate) : null;
  const refHpi = baselineHpi!=null? baselineHpi : Math.max(30, hpiResult.hpi-8);

  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const dampedGrowth = growth * Math.pow(0.92,Math.max(0,horizonWeeks-1)); // diminishing returns
  const projectedHpi = clamp(hpiResult.hpi + dampedGrowth*horizonWeeks, 0, 100);

  const deltaHpi = projectedHpi - refHpi;
  const counts=trainingCountByType(14);
  const targetSessions = 8; // rough target sessions/2wk for full consistency bonus
  const consistency = clamp(Object.values(counts).reduce((a,b)=>a+b,0)/targetSessions,0,1.3);
  const consistencyBonus = clamp(consistency-0.5,0,0.8) * 0.015; // up to -1.5% if very consistent

  const projectedFatigue = horizonWeeks>0 && currentPhase()==="Taper" ? Math.max(20,hpiResult.fatigue-15*horizonWeeks) : hpiResult.fatigue;
  const fatiguePenalty = projectedFatigue>70 ? ((projectedFatigue-70)/10)*0.01 : 0;

  const fraction = clamp(deltaHpi*k - consistencyBonus + fatiguePenalty, -0.35, 0.15);
  const predicted = baseline.value * (1 - fraction);

  const raceExecScore = hpiResult.indices.raceExec.score ?? 60;
  const ciPct = (100-raceExecScore)/100*0.05 + 0.015; // 1.5%~6.5% half-width
  const ciLow = predicted*(1-ciPct), ciHigh = predicted*(1+ciPct);

  const trendBonus = (growth||0)*5;
  const fatiguePenaltyPts = hpiResult.fatigue>70? (hpiResult.fatigue-70)*0.6:0;
  const improvementProb = clamp(50 + trendBonus - fatiguePenaltyPts + (consistency-0.7)*20, 5, 95);

  return { predicted, ciLow, ciHigh, baseline, projectedHpi, deltaHpi, improvementProb, horizonWeeks, fraction };
}

function analyzeBottleneck(hpiResult){
  const race=latestRace(); const b=bench(); const st=latestStationValues();
  const items=[];
  STATIONS.forEach(s=>{
    const sec=parseTimeToSec(st[s.key]); const bb=b[s.key];
    if(sec&&bb){ const gapPct=((sec-bb)/bb)*100; items.push({ label:s.label, key:s.key, kind:"station", gapPct, actual:sec, bench:bb }); }
  });
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
    const avgRun=mean(runsSec.filter(v=>v!=null));
    if(avgRun){ const gapPct=((avgRun-b.runKm)/b.runKm)*100; items.push({ label:"Running (평균 스플릿)", key:"run", kind:"run", gapPct, actual:avgRun, bench:b.runKm }); }
  }
  items.sort((a,b2)=>b2.gapPct-a.gapPct);
  const worstIndexEntry = Object.entries(hpiResult.indices).sort((a,b2)=>(a[1].score??100)-(b2[1].score??100))[0];
  return { items: items.slice(0,8), worstIndex: worstIndexEntry ? {key:worstIndexEntry[0], ...worstIndexEntry[1]} : null };
}

/* ---------------------------------------------------------------------- */
/* 6. RULE ENGINE — 10 categories, IF/THEN, Priority-based conflict resolution */
/*    Each rule: { id, category, priority, test(ctx)->bool, action, reason(ctx)->string } */
/*    To extend: push a new object into RULES. No other code changes needed.*/
/* ---------------------------------------------------------------------- */
const PRIORITY_ORDER = { Critical:0, High:1, Medium:2, Low:3 };

function buildRuleContext(){
  const hpiResult=calcHPI();
  const bottleneck=analyzeBottleneck(hpiResult);
  const counts14=trainingCountByType(14);
  const counts7=trainingCountByType(7);
  const recov=recentRecovery(7);
  const recov3=recentRecovery(3);
  const dLeft=daysToRace();
  const wLeft = dLeft!=null? dLeft/7 : null;
  const phase=currentPhase();
  const acwr=calcACWR();
  const painFlags=recov.filter(r=>r.painFlag);
  const mileageAvg=recentMileageAvg(8);
  const b=bench();
  const loadByWeek=(()=>{
    const wks=[];
    for(let i=0;i<4;i++){
      const start=new Date(); start.setDate(start.getDate()-7*(i+1));
      const end=new Date(); end.setDate(end.getDate()-7*i);
      const logs=STATE.trainingLog.filter(l=>{const d=new Date(l.date); return d>=start&&d<end;});
      wks.push(logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0));
    }
    return wks; // [thisWeek(partial-ish), -1, -2, -3]
  })();
  return { hpiResult, bottleneck, counts14, counts7, recov, recov3, dLeft, wLeft, phase, acwr, painFlags, mileageAvg, b, loadByWeek };
}

const RULES = [
  // ---------------- Recovery Rules ----------------
  { id:"REC-1", category:"Recovery", priority:"Critical",

function evaluateRules(ctx){
  ctx = ctx || buildRuleContext();
  const fired = RULES.filter(r=>{ try{ return r.test(ctx); }catch(e){ return false; } })
    .map(r=>({ ...r, actionText: typeof r.action==="function"? r.action(ctx): r.action, reasonText: typeof r.reason==="function"? r.reason(ctx): r.reason }));
  fired.sort((a,b)=>PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority]);
  return { ctx, fired };
}

/* 7. WEEKLY PLANNER — deterministic, phase-ratio + rule-modulated          */
/* ---------------------------------------------------------------------- */
const SESSION_LIBRARY = {
  run:      { label:"Easy Run",        desc:"Zone2 유산소 러닝, 대화 가능한 강도", hr:"Zone 2 (60-70%)", rpe:"4-5" },

function boxCategoryFor(type){
  return { "웨이트":"strength", "하이브리드":"wod", "컨디셔닝":"wod" }[type] || null;
}
function boxAddOnRecommendation(box, weakest){
  const cat = boxCategoryFor(box.type);
  const coversWeak = (cat==="strength" && (weakest==="strengthEnd"||weakest==="skill"))
    || (cat==="wod" && (weakest==="engine"||weakest==="skill"));
  if(coversWeak) return "오늘 박스 세션이 약점 영역과 겹칩니다 — 추가 볼륨보다 회복에 집중하세요";
  if(weakest==="running") return "박스 세션 전후 Easy Run 20~30분 추가를 권장합니다";
  if(weakest==="engine") return "박스 세션에 SkiErg/Row 5~10분 컨디셔닝을 붙여보세요";
  if(weakest==="strengthEnd") return "박스 세션 후 Sled Push/Pull 보강 5~10분을 권장합니다";
  if(weakest==="skill") return "박스 세션 후 Wall Ball 100개 등 스킬 보강을 권장합니다";
  if(weakest==="recovery") return "오늘은 박스 세션 강도만으로 충분 — 추가훈련보다 수면/식사에 신경쓰세요";
  return "현재 구성 그대로 유지 — 별도 추가훈련은 선택사항입니다";
}
function generateWeeklyPlan(ruleResult){
  const { ctx, fired } = ruleResult;
  const phase = ctx.phase;
  const ratio = PHASE_RATIO[phase];
  const critical = fired.filter(r=>r.priority==="Critical");
  const fixedBoxDays = new Set(Object.keys(STATE.boxSchedule||{}).filter(k=>STATE.boxSchedule[k]?.active).map(Number));

  // --- weakest area bias (computed early so box-day add-on recs can use it) ---
  const idxScores = Object.entries(ctx.hpiResult.indices).map(([k,v])=>[k,v.score??50]);
  idxScores.sort((a,b)=>a[1]-b[1]);
  const weakest = idxScores[0][0];

  const boxSlot=(i)=>{
    const box=STATE.boxSchedule[i];
    const addOn=boxAddOnRecommendation(box, weakest);
    return { day:WEEKDAYS[i], type:"box", label:`박스: ${box.label||box.type||"세션"}`,
      desc:"크로스핏 박스 고정 세션 (외부 프로그램)", addOn, hr:"—", rpe:"—" };
  };

  // --- hard overrides from Critical rules (safety-first: overrides box schedule too) ---
  if(critical.some(r=>r.id==="TAP-2")){
    return WEEKDAYS.map((d,i)=> i===6 || i===3 ? sessionSlot("shakeout",d) : sessionSlot("rest",d));
  }
  if(critical.some(r=>r.id==="RACE-1" || r.id==="TAP-1")){
    const days = WEEKDAYS.map((d,i)=> [0,2,4].includes(i) ? sessionSlot("shakeout",d) : sessionSlot("rest",d));
    return days;
  }
  if(critical.some(r=>r.id==="FAT-1")){
    return WEEKDAYS.map((d,i)=> i===1||i===4 ? sessionSlot("recovery",d) : sessionSlot("rest",d));
  }

  // largest-remainder allocation across the FULL week by phase ratio, then subtract what fixed
  // box days already cover (e.g. a 웨이트 day already counts toward the strength quota) so the
  // remaining open days aren't over- or under-supplied.
  const boxCategoryCounts = {};
  fixedBoxDays.forEach(i=>{ const cat=boxCategoryFor(STATE.boxSchedule[i]?.type); if(cat) boxCategoryCounts[cat]=(boxCategoryCounts[cat]||0)+1; });
  const openDayCount = Math.max(0, 7-fixedBoxDays.size);
  const cats = ["run","strength","wod","recovery"];
  const raw = cats.map(c=>({c, exact: (ratio[c]/100)*7}));
  let counts = {}; let used=0;
  raw.forEach(r=>{ counts[r.c]=Math.floor(r.exact); used+=counts[r.c]; });
  let remainder = raw.map(r=>({c:r.c, frac:r.exact-Math.floor(r.exact)})).sort((a,b)=>b.frac-a.frac);
  let idx=0;
  while(used<7){ counts[remainder[idx%remainder.length].c]++; used++; idx++; }
  cats.forEach(c=>{ counts[c]=Math.max(0, counts[c]-(boxCategoryCounts[c]||0)); });

  // build ordered slot list: rest anchored Mon or as counts allow; alternate hard/easy
  let slots=[];
  for(let i=0;i<counts.run;i++) slots.push(i===0 && counts.run>1 ? "long":"run");
  for(let i=0;i<counts.strength;i++) slots.push("strength");
  for(let i=0;i<counts.wod;i++) slots.push(i===0 && weakest!=="running" ? "station":"wod");
  for(let i=0;i<counts.recovery;i++) slots.push(i===0?"rest":"recovery");
  while(slots.length<openDayCount) slots.push("recovery");
  slots=slots.slice(0,openDayCount);

  // rule-based content substitutions
  if(fired.some(r=>r.id==="RUN-1")) { const i=slots.indexOf("run"); if(i>=0) slots[i]="interval"; else slots.push("interval"); }
  if(fired.some(r=>r.id==="STA-1")) { const i=slots.lastIndexOf("wod"); if(i>=0) slots[i]="station"; }
  if(fired.some(r=>r.id==="RACE-2")) { const i=slots.lastIndexOf("wod"); if(i>=0) slots[i]="sim"; }
  if(fired.some(r=>r.id==="RACE-3")) { const i=slots.lastIndexOf("wod"); if(i>=0) slots[i]="brick"; }
  if(fired.some(r=>r.id==="WK-1")) { const i=slots.indexOf("wod"); if(i>=0) slots[i]="recovery"; }
  if(fired.some(r=>r.id==="FAT-3")) { const i=slots.findIndex(s=>s==="interval"||s==="wod"); if(i>=0) slots[i]="recovery"; }
  if(fired.some(r=>r.id==="RUN-4")) { if(!slots.includes("long")){ const i=slots.indexOf("run"); if(i>=0) slots[i]="long"; } }

  // WK-2: avoid 2 consecutive hard days (interval/wod/sim/brick) -> insert recovery between
  const hard=new Set(["interval","wod","sim","brick","long"]);
  for(let i=0;i<slots.length-1;i++){
    if(hard.has(slots[i]) && hard.has(slots[i+1])){
      slots[i+1] = slots.includes("recovery")? "recovery" : "recovery";
    }
  }
  // ensure at least one rest among the open days
  if(!slots.includes("rest") && slots.length){ const softIdx=slots.indexOf("recovery"); slots[softIdx>=0?softIdx:slots.length-1]="rest"; }

  // distribute across the OPEN days only, following a Mon/Wed/Fri/Sat/Tue/Thu/Sun preference order
  const orderPreference=[0,2,4,5,1,3,6];
  const openOrder = orderPreference.filter(d=>!fixedBoxDays.has(d));
  const finalSlots=new Array(7).fill(null);
  openOrder.forEach((dayIdx,i)=>{ if(slots[i]!=null) finalSlots[dayIdx]=slots[i]; });
  fixedBoxDays.forEach(dayIdx=>{ finalSlots[dayIdx]="__box__"; });

  return finalSlots.map((type,i)=> type==="__box__" ? boxSlot(i) : sessionSlot(type||"recovery", WEEKDAYS[i]));
}
function sessionSlot(type, dayLabel){
  const lib=SESSION_LIBRARY[type]||SESSION_LIBRARY.recovery;
  return { day:dayLabel, type, label:lib.label, desc:lib.desc, hr:lib.hr, rpe:lib.rpe };
}
function applyManualOverrides(plan){
  return plan.map((slot,i)=>{
    const ov=STATE.weeklyOverride[i];
    return ov ? { ...slot, label:ov.label||slot.label, desc:ov.desc||slot.desc } : slot;
  });
}

/* ---------------------------------------------------------------------- */
/* 8. COACH REASONING CHAIN — transparent step-by-step derivation          */
/* ---------------------------------------------------------------------- */
function buildReasoningChain(ruleResult){
  const { ctx, fired } = ruleResult;
  const steps=[];
  const recoveryState = fired.some(r=>r.category==="Recovery"&&r.priority==="Critical") ? "위험" :
                          fired.some(r=>r.category==="Recovery") ? "주의" : "양호";
  steps.push({ q:"Step 1 — 회복 상태 확인", a:`${recoveryState} (Recovery Index ${ctx.hpiResult.indices.recovery.score!=null?round1(ctx.hpiResult.indices.recovery.score):"N/A"}, Fatigue ${round1(ctx.hpiResult.fatigue)})` });
  const hasInterval = ctx.counts7.interval>0;
  steps.push({ q:"Step 2 — 최근 7일 인터벌 실시 여부", a: hasInterval? "있음":"없음" });
  steps.push({ q:"Step 3 — 대회까지 남은 기간 → 시즌 단계", a:`${ctx.dLeft!=null? ctx.dLeft+"일":"미설정"} → ${ctx.phase} 구간` });
  const idxScores=Object.entries(ctx.hpiResult.indices).map(([k,v])=>[k,v.score??50]).sort((a,b)=>a[1]-b[1]);
  steps.push({ q:"Step 4 — 약점 영역 비교", a:`${INDEX_META[idxScores[0][0]].label} 가 가장 낮음 (${round1(idxScores[0][1])}점)` });

  let conclusion;
  const topRule = fired[0];
  if(topRule){
    conclusion = `${topRule.actionText} — ${topRule.reasonText}`;
  } else if(!hasInterval && ctx.phase!=="Taper"){
    conclusion = "Threshold Run 세션 추천";
  } else {
    conclusion = "현재 계획 유지, 약점 영역 보강 세션 편성";
  }
  return { steps, conclusion };
}

/* ---------------------------------------------------------------------- */
/* 9. RACE ROADMAP GENERATOR                                               */
/* ---------------------------------------------------------------------- */
function generateRoadmap(){
  const dLeft=daysToRace();
  if(dLeft==null) return null;
  const totalWeeks=Math.max(1,Math.ceil(dLeft/7));
  const taperWeeks = totalWeeks>=2?2:1;
  const peakWeeks = Math.min(4, Math.max(0,totalWeeks-taperWeeks-2));
  const buildWeeks = Math.min(6, Math.max(0, totalWeeks-taperWeeks-peakWeeks-2));
  const baseWeeks = Math.max(0, totalWeeks-taperWeeks-peakWeeks-buildWeeks);

  const blocks=[];
  let cursor=new Date();
  function pushBlock(phase,weeks){
    if(weeks<=0)return;
    const start=new Date(cursor);
    const end=new Date(cursor); end.setDate(end.getDate()+weeks*7-1);
    cursor=new Date(end); cursor.setDate(cursor.getDate()+1);
    blocks.push({ phase, weeks, start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10), ...PHASE_RATIO[phase],
      milestone: {Base:"체력 테스트(5K/10K) + 벤치마크 스테이션 테스트",Build:"Race-pace Brick 세션 2회 이상",Peak:"Full Simulation 1~2회",Taper:"컨디션 점검 + 장비 점검"}[phase] });
  }
  pushBlock("Base",baseWeeks); pushBlock("Build",buildWeeks); pushBlock("Peak",peakWeeks); pushBlock("Taper",taperWeeks);
  return blocks;
}

/* ---------------------------------------------------------------------- */
/* 9b. PEER COMPARISON & RACE DNA ENGINE                                   */
/*     "아시아권 동일 성별/연령대/디비전 선수 대비" 퍼센타일 · Z-score 분석. */
/*                                                                          */
/*  ⚠ 데이터 출처에 대해:                                                   */
/*  official HYROX 사이트(results.hyrox.com)는 대회별 "개인" 결과만 조회    */
/*  가능하며, 지역별/전체 평균 같은 집계 통계는 공개 API로 제공하지 않는다.  */
/*  (지역·연령·성별 평균을 얻으려면 결과 페이지 수만 건을 개별 스크레이핑   */
/*  해야 하는데, 이는 이 정적 HTML 파일이 실행 시점에 브라우저에서 CORS      */
/*  제약 없이 할 수 있는 일이 아니다.)                                      */
/*  아래 base 값은 HyroxDataLab/RoxHype 등 커뮤니티가 공개한 대규모(70만+    */
/*  건) 결과 분석글의 "전 세계 평균/연령대별 저하율" 수치에 맞춰 눈금을      */
/*  보정한 예시치이며, 지역이 "아시아"로 한정된 공식 수치는 아니다.          */
/*  station 단위 세부 splits는 공개된 벤치마크가 없어 위 총 기록 분포를      */
/*  8 Run + 8 Station + Roxzone 구조에 맞춰 비례 배분한 추정값이다.          */
/*  실서비스라면 hyroxresultapi.com 같은 유료 결과 API나 자체 결과 DB로      */
/*  이 테이블을 교체하는 것을 권장한다.                                     */
/* ---------------------------------------------------------------------- */
const PEER_SEGMENTS = [
  { key:"run1", label:"Run 1", kind:"run", base:265 },
  { key:"ski", label:"SkiErg", kind:"station", base:275 },
  { key:"run2", label:"Run 2", kind:"run", base:258 },
  { key:"sledPush", label:"Sled Push", kind:"station", base:225 },
  { key:"run3", label:"Run 3", kind:"run", base:272 },
  { key:"sledPull", label:"Sled Pull", kind:"station", base:252 },
  { key:"run4", label:"Run 4", kind:"run", base:265 },
  { key:"burpee", label:"Burpee Broad Jump", kind:"station", base:288 },
  { key:"run5", label:"Run 5", kind:"run", base:270 },
  { key:"row", label:"Row", kind:"station", base:260 },
  { key:"run6", label:"Run 6", kind:"run", base:258 },
  { key:"carry", label:"Farmer Carry", kind:"station", base:160 },
  { key:"run7", label:"Run 7", kind:"run", base:266 },
  { key:"lunge", label:"Sandbag Lunge", kind:"station", base:315 },
  { key:"run8", label:"Run 8", kind:"run", base:260 },
  { key:"wallball", label:"Wall Ball", kind:"station", base:330 },
  { key:"roxzone", label:"Roxzone (전환)", kind:"transition", base:300 },
];
const SD_PCT = { run:0.09, station:0.14, transition:0.20 };
const AGE_GROUPS = ["18-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60+"];
// peak performance at 25-29 (1.00), ~1.5-3%/5yr degradation after 30, ~11% slower by 50-54
const AGE_MULT   = { "18-24":1.02,"25-29":1.00,"30-34":1.02,"35-39":1.04,"40-44":1.07,"45-49":1.10,"50-54":1.114,"55-59":1.16,"60+":1.22 };
// recalibrates the illustrative split table so the 25-29 Open-Male total lands near the
// publicly reported ~80min peak-age benchmark (overall Open-Men average ~90min across all ages)
const PEER_CALIBRATION_SCALE = 1.06;
const IMPACT_WEIGHTS = { run:25, ski:8, sledPush:12, sledPull:10, burpee:10, row:8, carry:7, lunge:10, wallball:10 }; // sums to 100

function getAgeGroup(age){
  if(!age||isNaN(age)) return "30-34";
  if(age<25) return "18-24"; if(age<30) return "25-29"; if(age<35) return "30-34"; if(age<40) return "35-39";
  if(age<45) return "40-44"; if(age<50) return "45-49"; if(age<55) return "50-54"; if(age<60) return "55-59"; return "60+";
}
// Abramowitz-Stegun erf approximation, then standard normal CDF
function erf(x){
  const sign = x<0? -1:1; x=Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t=1/(1+p*x);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normalCdf(z){ return 0.5*(1+erf(z/Math.SQRT2)); }
function starRating(z){
  if(z>=1.5) return { stars:5, label:"엘리트 수준" };
  if(z>=0.5) return { stars:4, label:"강점" };
  if(z>=-0.5) return { stars:3, label:"평균" };
  if(z>=-1.5) return { stars:2, label:"개선 필요" };
  return { stars:1, label:"병목" };
}
function getUserSegmentValue(key, race){
  if(key==="roxzone") return parseTimeToSec(race.transition);
  if(key.startsWith("run")){ const n=Number(key.replace("run","")); return parseTimeToSec(race.runs?.[n]); }
  return parseTimeToSec(race.stations?.[key]);
}

// Per-division adjustment applied to the PEER_SEGMENTS base (Open Singles) table, by segment kind.
// Doubles reuses the same run-unchanged / station-split logic as the main BENCH table above.
// Mixed Doubles' run/station/transition multipliers are calibrated so that, combined with
// DOUBLES_GENDER_MULT below, Mixed sits ~7% slower than Men's Doubles and ~6-7% faster than
// Women's Doubles — matching the commonly reported "slower than same-sex men, faster than
// same-sex women" pattern, not simply "slower than same-sex pairs" in both directions.
const PEER_DIVISION_ADJUST = {
  "Open":           { run:1.00, station:1.00, transition:1.00 },
  "Pro":            { run:0.80, station:0.80, transition:0.85 },
  "Open Doubles":   { run:1.00, station:DOUBLES_STATION_FACTOR, transition:1.05 },
  "Pro Doubles":    { run:0.80, station:0.80*DOUBLES_STATION_FACTOR, transition:0.89 },
  "Mixed Doubles":  { run:1.07, station:DOUBLES_STATION_FACTOR*1.07, transition:1.12 },
};
const SINGLES_GENDER_MULT = 1.22; // ~90min vs ~110min sourced Open Singles average ratio
const DOUBLES_GENDER_MULT = 1.14; // Men's vs Women's Pro Doubles world records (47:41 vs 54:24)

function computePeerAnalysis(){
  const race=latestRace();
  if(!race) return null;
  const profile=STATE.profile;
  const ageGroup=getAgeGroup(Number(profile.age));
  const gender = profile.gender==="female" ? "female":"male";
  const division = DIVISIONS.includes(profile.division) ? profile.division : "Open";
  // Mixed Doubles is a team-level benchmark that already sits between Men's and Women's same-sex
  // doubles (via the divMult above) — it should NOT also be scaled by the individual athlete's own
  // gender, or it would stack two "slower" factors and end up slower than Women's Doubles, which
  // is backwards. Open/Pro Doubles are same-sex team divisions, so the doubles-specific gender gap applies.
  let gm;
  if(division==="Mixed Doubles") gm = 1.0;
  else if(division==="Open Doubles" || division==="Pro Doubles") gm = gender==="female" ? DOUBLES_GENDER_MULT : 1.0;
  else gm = gender==="female" ? SINGLES_GENDER_MULT : 1.0;
  const adj = PEER_DIVISION_ADJUST[division] || PEER_DIVISION_ADJUST.Open;
  const am = AGE_MULT[ageGroup] || 1.0;

  const segments = PEER_SEGMENTS.map(seg=>{
    const divMult = adj[seg.kind] ?? 1.0;
    const peerMean = seg.base * PEER_CALIBRATION_SCALE * gm * divMult * am;
    const peerSd = peerMean * SD_PCT[seg.kind];
    const actual = getUserSegmentValue(seg.key, race);
    if(actual==null) return { ...seg, actual:null, peerMean, peerSd, z:null, percentile:null, star:null, timeLoss:null };
    const z = (peerMean-actual)/peerSd;
    const percentile = clamp(normalCdf(z)*100, 0.5, 99.5);
    const timeLoss = actual-peerMean;
    return { ...seg, actual, peerMean, peerSd, z, percentile, star:starRating(z), timeLoss };
  });
  const have = segments.filter(s=>s.actual!=null);
  if(!have.length) return null;

  const byKey=k=>segments.find(s=>s.key===k);
  const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null);
  const stationSegs = segments.filter(s=>s.kind==="station" && s.actual!=null);
  const roxzone = byKey("roxzone");

  // ---- Impact Score (weighted contribution of each bottleneck to total time lost) ----
  const runTimeLoss = runSegs.length===8 ? runSegs.reduce((s,r)=>s+r.timeLoss,0) : null;
  const impactCandidates = [];
  if(runTimeLoss!=null) impactCandidates.push({ key:"run", label:"Running (8구간 합)", timeLoss:runTimeLoss, weight:IMPACT_WEIGHTS.run });
  ["ski","sledPush","sledPull","burpee","row","carry","lunge","wallball"].forEach(k=>{
    const s=byKey(k); if(s && s.actual!=null) impactCandidates.push({ key:k, label:s.label, timeLoss:s.timeLoss, weight:IMPACT_WEIGHTS[k] });
  });
  const totalWeightedLoss = impactCandidates.reduce((sum,c)=>sum+Math.max(0,c.timeLoss)*c.weight,0);
  const impactList = impactCandidates.map(c=>({ ...c, impactPct: totalWeightedLoss>0 ? (Math.max(0,c.timeLoss)*c.weight/totalWeightedLoss)*100 : 0 }))
    .sort((a,b)=>b.impactPct-a.impactPct);
  const totalLossSec = impactCandidates.reduce((s,c)=>s+Math.max(0,c.timeLoss),0);

  // ---- Strength Index (7 sub-indices, 0-100, percentile-based) ----
  const pct=(k)=>{ const s=byKey(k); return s&&s.percentile!=null? s.percentile : null; };
  const avgPct=(keys)=>{ const vals=keys.map(pct).filter(v=>v!=null); return vals.length? mean(vals): null; };
  const runningIdx = runSegs.length? mean(runSegs.map(s=>s.percentile)) : null;
  const stationsIdx = stationSegs.length? mean(stationSegs.map(s=>s.percentile)) : null;
  const transitionIdx = roxzone.percentile;
  const powerIdx = avgPct(["sledPush","sledPull","lunge"]);
  const engineIdx = avgPct(["ski","row","burpee"]);
  const gripIdx = avgPct(["carry","sledPull"]);
  const earlyAvg = avgPct(["ski","sledPush"]);
  const lateAvg = avgPct(["lunge","wallball"]);
  const fatigueResistance = (earlyAvg!=null&&lateAvg!=null) ? clamp(100-(earlyAvg-lateAvg),0,100) : null;
  const strengthIdx = { running:runningIdx, stations:stationsIdx, transition:transitionIdx, power:powerIdx, engine:engineIdx, grip:gripIdx, fatigueResistance };

  const raceDna = classifyRaceDna(strengthIdx);
  const interpretation = buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race });

  return { group:{gender,ageGroup,division}, race, segments, impactList, totalLossSec, strengthIdx, raceDna, interpretation };
}

const RACE_DNA_TYPES = [
  { id:"finisher", emoji:"🔴", label:"Finisher Weak Type", desc:"후반 Wall Ball·Lunge 약점형",
    test:(s)=> s.fatigueResistance!=null && s.fatigueResistance<45 },
  { id:"power", emoji:"🟠", label:"Power Type", desc:"슬레드·캐리 강점형",
    test:(s)=>{ const others=[s.running,s.engine,s.transition].filter(v=>v!=null); return s.power!=null && others.length && s.power-mean(others)>12 && s.power===Math.max(...[s.power,s.running,s.engine,s.transition].filter(v=>v!=null)); } },
  { id:"engine", emoji:"🔵", label:"Engine Type", desc:"심폐 지속력형",
    test:(s)=>{ const others=[s.running,s.power,s.transition].filter(v=>v!=null); return s.engine!=null && others.length && s.engine-mean(others)>10 && s.engine===Math.max(...[s.power,s.running,s.engine,s.transition].filter(v=>v!=null)); } },
  { id:"transition", emoji:"🟡", label:"Transition Type", desc:"Roxzone 활용 우수형",
    test:(s)=> s.transition!=null && s.transition>=80 && s.transition===Math.max(...[s.power,s.running,s.engine,s.transition].filter(v=>v!=null)) },
  { id:"runner", emoji:"🟢", label:"Runner Type", desc:"러닝 강점형",
    test:(s)=>{ const others=[s.power,s.engine,s.transition].filter(v=>v!=null); return s.running!=null && others.length && s.running-mean(others)>12 && s.running===Math.max(...[s.power,s.running,s.engine,s.transition].filter(v=>v!=null)); } },
  { id:"hybrid", emoji:"🟣", label:"Hybrid Type", desc:"균형형", test:()=>true },
];
function classifyRaceDna(s){
  return RACE_DNA_TYPES.find(t=>{ try{ return t.test(s); }catch(e){ return false; } }) || RACE_DNA_TYPES[RACE_DNA_TYPES.length-1];
}

function buildInterpretation({ segments, impactList, strengthIdx, roxzone, totalLossSec, race }){
  const have=segments.filter(s=>s.percentile!=null);
  const strongest=[...have].sort((a,b)=>b.percentile-a.percentile)[0];
  const top=impactList.slice(0,3).filter(c=>c.impactPct>0.5);
  const sentences=[];
  if(strongest){
    sentences.push(`${strongest.label}${strongest.kind==="run"?" 구간":""}은 아시아 동일 그룹 상위 ${round1(100-strongest.percentile)}% 수준(${strongest.star.label})으로 강점입니다.`);
  }
  if(top[0]){
    const t0=top[0];
    const lossStr = t0.timeLoss>=0 ? `약 ${fmtTime(Math.abs(t0.timeLoss))} 손실` : `오히려 ${fmtTime(Math.abs(t0.timeLoss))} 이득`;
    sentences.push(`반면 ${t0.label}은 평균 대비 ${lossStr}이 발생하며 전체 기록 개선 여지가 가장 큰 구간입니다(영향도 ${round1(t0.impactPct)}%).`);
  }
  if(roxzone && roxzone.timeLoss!=null){
    if(roxzone.timeLoss>3) sentences.push(`Roxzone 전환 시간도 평균보다 느려 총 ${fmtTime(roxzone.timeLoss)}를 추가로 잃고 있습니다.`);
    else if(roxzone.timeLoss<-3) sentences.push(`Roxzone 전환은 평균보다 ${fmtTime(Math.abs(roxzone.timeLoss))} 빨라 강점 구간입니다.`);
  }
  if(top.length){
    sentences.push(`현재 가장 효과적인 개선 순서는 ${top.map(t=>t.label).join(" → ")}입니다.`);
  }
  if(strengthIdx.fatigueResistance!=null && strengthIdx.fatigueResistance<50){
    sentences.push(`레이스 후반부(Lunge·Wall Ball)에서 초반 대비 퍼포먼스가 저하되는 패턴이 있어, 페이싱 전략과 후반 지구력 훈련을 함께 점검하는 것이 좋습니다.`);
  }
  return sentences.join(" ");
}

/* ---------------------------------------------------------------------- */
/* 9c. GOAL SIMULATION — "이 구간을 N초 개선하면 최종 기록이 얼마나 단축되는가" */
/* ---------------------------------------------------------------------- */
function simulateGoal(baseTotalSec, runPaceImproveSecPerKm, stationImprovements){
  // stationImprovements: { key: seconds }
  const steps=[];
  let running=baseTotalSec;
  steps.push({ label:"현재 기록", value:running });
  if(runPaceImproveSecPerKm){
    const delta=runPaceImproveSecPerKm*8;
    running -= delta;
    steps.push({ label:`Run Pace ${runPaceImproveSecPerKm>0?"-":"+"}${Math.abs(runPaceImproveSecPerKm)}초/km (×8km)`, value:running, delta:-delta });
  }
  STATIONS.forEach(s=>{
    const imp=Number(stationImprovements[s.key])||0;
    if(imp){ running -= imp; steps.push({ label:`${s.label} ${imp>0?"-":"+"}${Math.abs(imp)}초`, value:running, delta:-imp }); }
  });
  return { steps, finalTotal:running, totalSaved: baseTotalSec-running };
}

/* ---------------------------------------------------------------------- */
/* 10. SVG CHART HELPERS (dependency-free)                                 */
/* ---------------------------------------------------------------------- */
function svgRadar(indices, size=280){
  const keys=Object.keys(INDEX_WEIGHTS);
  const n=keys.length; const cx=size/2, cy=size/2, r=size*0.36;
  const angle=(i)=> -Math.PI/2 + i*(2*Math.PI/n);
  const rings=[0.25,0.5,0.75,1];
  let grid="";
  rings.forEach(f=>{
    const pts=keys.map((k,i)=>{ const a=angle(i); return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`; }).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="#28282C" stroke-width="1"/>`;
  });
  keys.forEach((k,i)=>{ const a=angle(i); grid+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#28282C" stroke-width="1"/>`; });
  const dataPts=keys.map((k,i)=>{ const a=angle(i); const v=clamp((indices[k].score??0)/100,0,1); return `${cx+Math.cos(a)*r*v},${cy+Math.sin(a)*r*v}`; }).join(" ");
  let labels="";
  keys.forEach((k,i)=>{
    const a=angle(i); const lx=cx+Math.cos(a)*(r+26), ly=cy+Math.sin(a)*(r+26);
    const anchor = Math.abs(Math.cos(a))<0.3? "middle" : (Math.cos(a)>0? "start":"end");
    const score=indices[k].score;
    labels+=`<text x="${lx}" y="${ly-3}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="9" fill="#9497A0">${INDEX_META[k].label.replace(" Index","").toUpperCase()}</text>`;
    labels+=`<text x="${lx}" y="${ly+9}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#FF5A1F">${score!=null?round1(score):"—"}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">
    ${grid}
    <polygon points="${dataPts}" fill="rgba(255,90,31,.22)" stroke="#FF5A1F" stroke-width="2"/>
    ${keys.map((k,i)=>{ const a=angle(i); const v=clamp((indices[k].score??0)/100,0,1); return `<circle cx="${cx+Math.cos(a)*r*v}" cy="${cy+Math.sin(a)*r*v}" r="3" fill="#FF5A1F"/>`; }).join("")}
    ${labels}
  </svg>`;
}

// generic N-axis radar: items = [{label, score(0-100)}]
function svgRadarGeneric(items, size=280, color="#FF5A1F"){
  const n=items.length; const cx=size/2, cy=size/2, r=size*0.36;
  const angle=(i)=> -Math.PI/2 + i*(2*Math.PI/n);
  const rings=[0.25,0.5,0.75,1];
  let grid="";
  rings.forEach(f=>{
    const pts=items.map((it,i)=>{ const a=angle(i); return `${cx+Math.cos(a)*r*f},${cy+Math.sin(a)*r*f}`; }).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="#28282C" stroke-width="1"/>`;
  });
  items.forEach((it,i)=>{ const a=angle(i); grid+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#28282C" stroke-width="1"/>`; });
  const dataPts=items.map((it,i)=>{ const a=angle(i); const v=clamp((it.score??0)/100,0,1); return `${cx+Math.cos(a)*r*v},${cy+Math.sin(a)*r*v}`; }).join(" ");
  let labels="";
  items.forEach((it,i)=>{
    const a=angle(i); const lx=cx+Math.cos(a)*(r+28), ly=cy+Math.sin(a)*(r+28);
    const anchor = Math.abs(Math.cos(a))<0.3? "middle" : (Math.cos(a)>0? "start":"end");
    labels+=`<text x="${lx}" y="${ly-3}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="9" fill="#9497A0">${escapeHtml(it.label.toUpperCase())}</text>`;
    labels+=`<text x="${lx}" y="${ly+9}" text-anchor="${anchor}" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="${color}">${it.score!=null?round1(it.score):"—"}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">
    ${grid}
    <polygon points="${dataPts}" fill="${color}33" stroke="${color}" stroke-width="2"/>
    ${items.map((it,i)=>{ const a=angle(i); const v=clamp((it.score??0)/100,0,1); return `<circle cx="${cx+Math.cos(a)*r*v}" cy="${cy+Math.sin(a)*r*v}" r="3" fill="${color}"/>`; }).join("")}
    ${labels}
  </svg>`;
}

function svgLineTrend(points, w=560, h=140, opts={}){
  if(!points.length) return `<div class="empty-note">데이터가 쌓이면 추이가 표시됩니다</div>`;
  const pad=28;
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs)||1;
  const minY = opts.minY!=null? opts.minY : Math.min(...ys)*0.95;
  const maxY = opts.maxY!=null? opts.maxY : Math.max(...ys)*1.05;
  const sx=(x)=> pad + (maxX===minX?0:(x-minX)/(maxX-minX))*(w-pad*2);
  const sy=(y)=> h-pad - (maxY===minY?0:(y-minY)/(maxY-minY))*(h-pad*2);
  const path=points.map((p,i)=> `${i===0?"M":"L"}${sx(p.x)},${sy(p.y)}`).join(" ");
  const area=`${path} L${sx(xs[xs.length-1])},${h-pad} L${sx(xs[0])},${h-pad} Z`;
  const dots=points.map(p=>`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3" fill="#FF5A1F"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#28282C"/>
    <path d="${area}" fill="rgba(255,90,31,.12)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#FF5A1F" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function svgBottleneckBars(items, w=560){
  if(!items.length) return `<div class="empty-note">스테이션/러닝 기록을 입력하면 병목 구간이 표시됩니다</div>`;
  const rowH=30; const h=items.length*rowH+10;
  const maxGap=Math.max(10,...items.map(it=>Math.abs(it.gapPct)));
  let rows="";
  items.forEach((it,i)=>{
    const y=i*rowH+8;
    const barW=Math.min(220,(Math.abs(it.gapPct)/maxGap)*220);
    const color = it.gapPct>15? "#FF4D4D" : it.gapPct>5? "#FFB020" : "#33D17A";
    rows+=`<text x="0" y="${y+13}" font-family="Inter" font-size="11.5" fill="#F5F4F1">${escapeHtml(it.label)}</text>
      <rect x="230" y="${y+3}" width="220" height="14" rx="4" fill="#1C1C1F"/>
      <rect x="230" y="${y+3}" width="${barW}" height="14" rx="4" fill="${color}"/>
      <text x="460" y="${y+13}" font-family="JetBrains Mono" font-size="11" fill="${color}">${it.gapPct>=0?"+":""}${round1(it.gapPct)}%</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${rows}</svg>`;
}

function raceStrip(race){
  if(!race) return `<div class="empty-note">등록된 대회 기록이 없습니다</div>`;
  const b=bench();
  const segs=[];
  for(let i=1;i<=8;i++){
    const runSec=parseTimeToSec(race.runs?.[i]);
    segs.push({ kind:"run", label:`R${i}`, sec:runSec, ref:b.runKm });
    if(i<=8 && STATIONS[i-1]){
      const s=STATIONS[i-1]; const sec=parseTimeToSec(race.stations?.[s.key]);
      segs.push({ kind:"station", label:s.label.split(" ")[0], sec, ref:b[s.key] });
    }
  }
  const maxSec=Math.max(10,...segs.map(s=>s.sec||0));
  const bars=segs.map(s=>{
    const hpx = s.sec? Math.max(6,(s.sec/maxSec)*64) : 4;
    const over = s.sec && s.ref ? s.sec>s.ref*1.1 : false;
    return `<div class="seg ${s.kind}" style="height:${hpx}px; ${over?'filter:brightness(1.3) hue-rotate(-15deg);':''}" title="${s.label}: ${s.sec?fmtTime(s.sec):'—'}"></div>`;
  }).join("");
  const labels=segs.map(s=>`<span>${s.kind==='run'?s.label:''}</span>`).join("");
  return `<div class="race-strip">${bars}</div><div class="race-strip-labels">${labels}</div>`;
}

/* 19. CSV IMPORT (Garmin Connect-style export) — no AI, pure parsing       */
/* ---------------------------------------------------------------------- */
function parseCSV(text){
  // RFC4180-ish parser: handles quoted fields with embedded commas/newlines/escaped quotes.
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==""));
}
function guessColumn(headers, keywords, prefer){
  const lower=headers.map(h=>h.toLowerCase().trim());
  if(prefer){ for(const p of prefer){ const i=lower.findIndex(h=>h===p.toLowerCase()); if(i>=0) return i; } }
  for(const kw of keywords){ const i=lower.findIndex(h=>h.includes(kw)); if(i>=0) return i; }
  return -1;
}
function guessTypeFromText(txt){
  const t=(txt||"").toLowerCase();
  if(t.includes("strength")||t.includes("weight")||t.includes("웨이트")||t.includes("근력")) return "strength";
  if(t.includes("interval")||t.includes("hiit")||t.includes("인터벌")) return "interval";
  if(t.includes("hyrox")||t.includes("wod")||t.includes("crossfit")||t.includes("circuit")||t.includes("카디오")||t.includes("cardio")||t.includes("서킷")) return "wod";
  if(t.includes("yoga")||t.includes("stretch")||t.includes("mobility")||t.includes("recovery")||t.includes("회복")||t.includes("요가")||t.includes("스트레칭")) return "recovery";
  if(t.includes("run")||t.includes("러닝")||t.includes("jog")||t.includes("조깅")||t.includes("트레드밀")||t.includes("트랙")) return "run";
  return "run";
}
function durationStrToMin(str){
  if(!str)return null;
  const s=String(str).trim();
  if(s===""||s==="--") return null;
  if(s.includes(":")){ const sec=parseTimeToSec(s); return sec!=null? round1(sec/60): null; }
  const n=Number(s.replace(/,/g,""));
  return isNaN(n)? null : n;
}
// Garmin sometimes reports short/track activities' distance in meters (e.g. "5,990" or "810")
// and longer/free activities in km with a decimal (e.g. "6.01"). Heuristic: no decimal point
// + value >=100 -> treat as meters and convert to km. Also strips thousands-separator commas.
function parseDistanceToKm(raw, unit){
  if(raw==null) return null;
  const s=String(raw).trim();
  if(s===""||s==="--") return null;
  const hasDecimal = s.includes(".");
  const numeric = Number(s.replace(/,/g,""));
  if(isNaN(numeric)||numeric<=0) return null;
  let km = (!hasDecimal && numeric>=100) ? numeric/1000 : numeric;
  if(unit==="mi") km *= 1.60934;
  return round1(km);
}
function parseGarminCsv(text, unit){
  const rows=parseCSV(text);
  if(rows.length<2) return { rows:[], error:"CSV에서 데이터 행을 찾지 못했습니다." };
  const headers=rows[0];
  const iDate=guessColumn(headers,["날짜","date"]);
  const iType=guessColumn(headers,["활동 종류","활동종류","activity type","제목","title","type"]);
  const iDist=guessColumn(headers,["거리","distance"]);
  const iDur=guessColumn(headers,["이동 시간","moving time","경과 시간","elapsed time","시간","time","duration"], ["이동 시간","moving time"]);
  const iHr=guessColumn(headers,["평균 심박","평균심박","avg hr","average heart rate","heart rate"]);
  const iPace=guessColumn(headers,["평균 페이스","페이스","avg pace","pace"]);
  if(iDate<0){ return { rows:[], error:"날짜 컴럼을 찾지 못했습니다. Garmin/COROS/Strava 활동 내보내기 CSV인지 확인해주세요." }; }
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row || row.every(c=>c==="")) continue;
    const rawDate=row[iDate]||"";
    const dateMatch = rawDate.match(/\d{4}-\d{2}-\d{2}/);
    let dateStr = dateMatch ? dateMatch[0] : null;
    if(!dateStr){ const d=new Date(rawDate); if(!isNaN(d)) dateStr=d.toISOString().slice(0,10); }
    if(!dateStr) continue;
    const typeText = iType>=0? row[iType] : "";
    const distanceKm = iDist>=0 ? parseDistanceToKm(row[iDist], unit) : null;
    const durationMin = iDur>=0 ? durationStrToMin(row[iDur]) : null;
    const avgHrRaw = iHr>=0 ? row[iHr] : null;
    const avgHr = (avgHrRaw && avgHrRaw!=="--") ? (Number(avgHrRaw.replace(/,/g,""))||null) : null;
    let avgPaceSecKm = null;
    if(iPace>=0 && row[iPace] && row[iPace]!=="--" && row[iPace].includes(":")) avgPaceSecKm = parseTimeToSec(row[iPace]);
    else if(distanceKm && durationMin) avgPaceSecKm = Math.round((durationMin*60)/distanceKm);
    out.push({ id:uid(), date:dateStr, type:guessTypeFromText(typeText), rawType:typeText, distanceKm, durationMin, avgPaceSecKm,
      avgHr, hrDrift:"", recoveryDrop:"", intensityRpe:5, painFlag:false, painArea:"", note:typeText||"", source:"csv" });
  }
  return { rows: out, error: out.length? null : "가져올 수 있는 행이 없습니다. 파일 형식을 확인해주세요." };
}

      <h2 class="section-title">타임라인</h2>
      <div class="roadmap-track" style="margin-top:10px;">
        <div class="phase-block">
          ${blocks.map(b=>`<div class="phase-seg" style="flex:${b.weeks};background:${phaseColor[b.phase]}22;border-right:1px solid var(--bg);">
            <div style="font-family:var(--font-mono);font-size:10px;color:${phaseColor[b.phase]};">${b.phase}</div>
            <div style="font-size:10px;color:var(--gray-dim);">${b.weeks}주</div>
          </div>`).join("")}
        </div>
      </div>
    </div>`}
  `;
}

/* ---------------------------------------------------------------------- */
/* 24. PAGE: MODEL EXPLANATION                                             */
/* ---------------------------------------------------------------------- */
function renderModel(wrap){
  wrap.innerHTML = `
    <div><div class="eyebrow">EXPLAINABLE MODEL</div><h1 class="page-title">모델 설명</h1></div>
    <div class="card">
      <h2 class="section-title">HPI (HYROX Performance Index)</h2>
      <p class="lead" style="margin:8px 0 14px;">HPI = Σ (Index Score × Weight). 모든 지표는 0-100으로 정규화된 뒤 가중합됩니다. AI 추론이 아닌 결정론적 계산식이며, 동일 입력에는 항상 동일 결과가 나옵니다(재현 가능).</p>
      <table><thead><tr><th>Index</th><th class="num">가중치</th><th>이유</th></tr></thead><tbody>
        ${Object.entries(INDEX_WEIGHTS).map(([k,v])=>`<tr><td>${INDEX_META[k].label}</td><td class="num mono">${Math.round(v*100)}%</td><td style="color:var(--gray);font-size:12px;">${INDEX_META[k].why}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="card">
      <h2 class="section-title">Division 지원</h2>
      <p class="lead" style="margin:8px 0;">Open · Pro · Open Doubles · Mixed Doubles · Pro Doubles 5개 Division 모두 8개 스테이션 + 러닝 + Roxzone 벤치마크를 개별로 갖고 있습니다. Doubles는 러닝은 파트너와 함께 동일 페이스로(개인전과 유사), 스테이션은 반씩 나눠 수행한다는 점을 반영해 스테이션 시간만 별도로 조정했고, Mixed Doubles는 동성 페어 대비 다소 느린 경향을 추가로 반영했습니다. 프로필에서 Division을 바꾸면 HPI·예측·Rule Engine·동일그룹 비교가 전부 자동으로 해당 Division 기준으로 재계산됩니다.</p>
    </div>
    <div class="card">
      <h2 class="section-title">정규화 방식</h2>
      <div class="kv"><span class="k">시간 지표 (낮을수록 좋음)</span><span class="v mono">Score = (Benchmark / Actual) × 100, clamp 0–100</span></div>
      <div class="kv"><span class="k">누적 지표 (높을수록 좋음)</span><span class="v mono">Score = (Actual / Target) × 100, clamp 0–100</span></div>
      <div class="kv"><span class="k">최소값 / 최대값</span><span class="v mono">0 / 100 (모든 Index 공통)</span></div>
    </div>
    <div class="card">
      <h2 class="section-title">예측 엔진</h2>
      <div class="kv"><span class="k">Predicted Time</span><span class="v mono">Baseline × (1 − ΔHPI×k − ConsistencyBonus + FatiguePenalty)</span></div>
      <div class="kv"><span class="k">k (개선율/HPI포인트)</span><span class="v mono">${STATE.settings.improvementPerHpiPoint}% (프로필에서 조정 가능)</span></div>
      <div class="kv"><span class="k">95% CI 폭</span><span class="v mono">Race Execution Index에 반비례 (페이싱 불균일 → CI 확대)</span></div>
      <div class="kv"><span class="k">4/8/12주 예측</span><span class="v mono">projectedHPI = HPI + 주간성장률×주수×0.92^(주수-1) (체감 성장)</span></div>
    </div>
    <div class="card">
      <h2 class="section-title">Fatigue Score</h2>
      <div class="kv"><span class="k">구성</span><span class="v mono">ACWR 과부하분 + 최근 3일 평균 RPE분 + 통증 플래그 (0-100, 높을수록 피로)</span></div>
      <div class="kv"><span class="k">ACWR</span><span class="v mono">최근 7일 부하 ÷ (최근 28일 부하/4)</span></div>
      <div class="kv"><span class="k">데이터 출처</span><span class="v mono">별도 회복 로그 없이 통합 훈련 기록(RPE·통증 여부)만으로 계산</span></div>

    <div class="card">

    </div>
    <div class="card">
      <h2 class="section-title">확장 방향</h2>
      <p class="lead">현재는 수동 입력 기반입니다. 구조상 Garmin/COROS/Polar/Apple Health/Strava API, CSV/Excel Import를 데이터 입력 페이지에 연결하는 형태로 확장 가능하며, HPI·Rule·Prediction 엔진 코드는 변경할 필요가 없습니다 (입력 소스만 STATE로 매핑하면 됩니다).</p>
    </div>
  `;
