      + `\nfinalPrediction: ${d.finalPrediction!=null?fmtTime(d.finalPrediction):"—"}`);
  }catch(e){ /* diagnostic only */ }
}
function computeBaseAnchorWithoutSimulation(hpiResult){
  const race = racesByDivision(STATE.profile.division)[0] || null;
  const recentActual = race && race.officialTime
    ? { value:parseTimeToSec(race.officialTime), date:race.date, ageDays:daysBetween(race.date, todayISO()) }
    : null;

  // A. fresh actual race -> unchanged top priority, exactly as before this pass
  if(recentActual && recentActual.ageDays<=STATION_STALE_DAYS){
    return { value:recentActual.value, source:"최근 대회 공식 기록", baselineHpiDate:recentActual.date,
      recentActual, bestRecentActual:recentActual, segmentEstimate:null, protectionWeight:0, anchorNote:null };
  }

  const candidates = getRecentActualCandidates();
  const bestRecentActual = candidates.length ? candidates.reduce((a,b)=> a.value<=b.value? a:b) : null;
  const segBaseline = getSegmentBaseline();
  const segmentEstimate = segBaseline ? { value:segBaseline.value, source:segBaseline.source, model:segBaseline.model } : null;

  if(!segmentEstimate){
    // B only
    if(bestRecentActual) return { value:bestRecentActual.value,
      source:`최근 실제 대회 기록 (${bestRecentActual.ageDays}일 전, ${RECENT_ACTUAL_WINDOW_DAYS}일 이내 최고 기록)`,
      baselineHpiDate:bestRecentActual.date, recentActual, bestRecentActual, segmentEstimate:null, protectionWeight:1, anchorNote:null };
    // neither B nor C -> fall back to raw stale race (unchanged old behavior) or null (caller tries D)
    if(recentActual) return { value:recentActual.value, source:"최근 대회 공식 기록 (경과됨)", baselineHpiDate:recentActual.date,
      recentActual, bestRecentActual:null, segmentEstimate:null, protectionWeight:1, anchorNote:null };
    return null;
  }
  if(!bestRecentActual){
    // C only — no real race within the recency window to protect against
    return { value:segmentEstimate.value, source:segmentEstimate.source, baselineHpiDate: race?race.date:null,
      recentActual, bestRecentActual:null, segmentEstimate, protectionWeight:0, anchorNote:null };
  }
  if(segmentEstimate.value<=bestRecentActual.value){
    // segment model already agrees with or beats the real result — nothing to protect
    return { value:segmentEstimate.value, source:segmentEstimate.source, baselineHpiDate: race?race.date:null,
      recentActual, bestRecentActual, segmentEstimate, protectionWeight:0, anchorNote:null };
  }
  // segment model is slower than a real recent result -> protect, smoothly, with explainable discount
  const freshness = clamp(1 - bestRecentActual.ageDays/RECENT_ACTUAL_WINDOW_DAYS, 0, 1);
  const counts = trainingCountByType(14);
  const trainingVolumeLow = Object.values(counts).reduce((a,b)=>a+b,0) < 3;
  const fatigueHigh = (hpiResult.fatigue||0) > 70;
  const hpiAtBestDate = getHpiAtDate(bestRecentActual.date);
  const hpiDeclined = hpiAtBestDate!=null && (hpiAtBestDate-hpiResult.hpi) > 5;
  const explainLabels = [trainingVolumeLow&&"최근 2주 훈련량 급감", fatigueHigh&&"현재 fatigue 높음", hpiDeclined&&"기록 당시 대비 HPI 하락"].filter(Boolean);
  const explainDiscount = explainLabels.length ? clamp(1-explainLabels.length*0.35, 0, 1) : 1;
  const protectionWeight = clamp(freshness*explainDiscount, 0, 1);
  const anchorValue = bestRecentActual.value*protectionWeight + segmentEstimate.value*(1-protectionWeight);
  const anchorNote = protectionWeight>0.05
    ? `실제 최근 기록(${fmtTime(bestRecentActual.value)}, ${bestRecentActual.ageDays}일 전) 보호 적용 — protection ${Math.round(protectionWeight*100)}%${explainLabels.length?` (설명 요인: ${explainLabels.join(", ")})`:""}`
    : `Segment 모델이 실제 최근 기록보다 느리지만 설명 요인이 있어 보호를 최소로만 적용함 (${explainLabels.join(", ")||"실제 기록이 오래됨"})`;
  return { value:anchorValue, source:`Segment 모델 + 최근 실제 기록 보호 (protection ${Math.round(protectionWeight*100)}%)`,
    baselineHpiDate: race?race.date:null, recentActual, bestRecentActual, segmentEstimate, protectionWeight, anchorNote };
}
function getBaselineTime(hpiResult){
  const anchor = computeCurrentAnchor(hpiResult);
  if(anchor) return anchor;
  // D. no race in the recency window at all AND no usable segment model: fall back to benchmark-table
  // estimate (8 runs + 8 stations + transition). review fix (ASIA benchmark -> Prediction baseline):
  // each leg/station/transition now prefers the imported Asia/Global derived P50
  // (getSegmentBenchmarkSec/runLegBenchmarkSec/transitionBenchmarkSec) over the static BENCH table,
  // same fallback chain as computeStationPriority/resolveSegment above — BENCH is now only used when
  // nothing has been imported yet, or no group in the chain has enough sample for that segment.
  const runTotal = RUN_KEYS.reduce((s,k)=>s+runLegBenchmarkSec(k).sec,0);
  const stationTotal = STATIONS.reduce((s,st)=>{ const d=getSegmentBenchmarkSec(st.key); return s+(d?d.sec:(bench()[st.key]||0)); },0);
  const transitionBench = transitionBenchmarkSec();
  const transitionTotal = transitionBench.sec;
  const refTotal = runTotal + stationTotal + transitionTotal;
  const estFactor = clamp(1 - ((hpiResult.hpi-50)/100)*0.5, 0.6, 1.5);
  return { value: refTotal*estFactor, source:"대회 기록 없음 → 현재 지표 기반 추정", baselineHpiDate:null,
    recentActual:null, bestRecentActual:null, segmentEstimate:null, protectionWeight:0, anchorNote:null,
    benchmarkSources:{ transition: transitionBench.source } };
}
/* ---------------------------------------------------------------------- */
/* GOAL-AWARE BASELINE (this bug-fix pass) — used ONLY by Goal Scenario /  */
/*     Target Gap / Goal Setting's "현재 예상 기록" display. getBaselineTime() */
/*     itself, predictTime(), buildRaceSegmentModel(), V1/V2 are untouched. */
/*                                                                          */
/* Root cause of the reported bug: Goal Setting's Division selector used to */
/* write DIRECTLY into STATE.profile.division (the athlete's base division, */
/* used everywhere — bench(), the 17-segment candidate functions). That     */
/* silently changed which race/segment data counted as "same division",    */
/* and combined with a separate divisionBase() bug (Mixed Doubles was      */
/* mis-bucketed as "Open" — now fixed above), a Mixed Doubles 1:09 race     */
/* could leak in as if it were Open-division evidence.                    */
/*                                                                          */
/* Fix: STATE.profile.division now ALWAYS means the athlete's real, base   */
/* division (restored to its original, stable meaning). A separate         */
/* STATE.profile.goalDivision (may be "" = same as base) is what Goal      */
/* Setting's Division selector now controls. Priority, spelled out exactly */
/* as requested:                                                          */
/*   goalDivision unset OR divisionBase(goalDivision)===divisionBase(division) */
/*     -> baseline behaves EXACTLY as before (getBaselineTime(), unchanged) */
/*   goalDivision set AND its base DIFFERS from the base division          */
/*     -> reuse predictDivisionTransition(division, goalDivision) — the    */
/*        SAME, unmodified algorithm the Division 전환 예측 page already    */
/*        uses — and take its predictedCenterNow as the "현재 예상 기록".    */
/*        Never falls back to raw same-division segment/race data for a    */
/*        mismatched division; if conversion itself is unavailable (no     */
/*        race at all in the base division), falls back to the plain      */
/*        getBaselineTime() value with that limitation flagged in `debug`. */
/* ---------------------------------------------------------------------- */
function getGoalAwareBaseline(hpiResult){
  const baseDiv = STATE.profile.division;
  const goalDiv = STATE.profile.goalDivision || baseDiv;
  const sameBase = divisionBase(goalDiv)===divisionBase(baseDiv);
  if(sameBase){
    const b=getBaselineTime(hpiResult);
    return { ...b, debug:{ path:"same-division", baseDiv, goalDiv, usedConversion:false } };
  }
  const baseRaceCount = racesByDivision(baseDiv).length;
  if(baseRaceCount===0){
    const b=getBaselineTime(hpiResult);
    return { ...b, debug:{ path:"cross-division-no-source-race-fallback", baseDiv, goalDiv, usedConversion:false,
      note:`${baseDiv} 기록이 없어 Division 전환 계산 불가 — 일반 baseline으로 대체됨` } };
  }
  const conv = predictDivisionTransition(baseDiv, goalDiv);
  if(!conv || conv.predictedCenterNow==null){
    const b=getBaselineTime(hpiResult);
    return { ...b, debug:{ path:"cross-division-conversion-unavailable-fallback", baseDiv, goalDiv, usedConversion:false } };
  }
  return { value:conv.predictedCenterNow, source:`Division 전환 예측 (${baseDiv} → ${goalDiv})`, baselineHpiDate:null,
    divisionConversion:conv, debug:{ path:"cross-division-conversion", baseDiv, goalDiv, usedConversion:true, confidence:conv.confidence, mode:conv.mode } };
}
/* ---------------------------------------------------------------------- */
/* CANONICAL CURRENT-PERFORMANCE BASELINE (audit item #3)                  */
/*   Single source of truth for "현재 예상 기록", reused by every page:      */
/*   기록 예측 (getBaselineTime), 목표 설정 (buildSegmentGapAnalysis),        */
/*   Goal Scenario (getGoalAwareBaseline), Division 전환 (computeDivision-   */
/*   Transition/computeDoublesToSingles), Dashboard.                        */
/*   Implementation note: getBaselineTime()'s existing cascade (fresh race  */
/*   > segment model > stale race > benchmark×HPI) is NOT duplicated here — */
/*   this just re-runs that exact same function under a temporary division  */
/*   context, so "same input data -> same base division -> same baseline"   */
/*   is structurally guaranteed rather than merely intended.                */
/* ---------------------------------------------------------------------- */
function withDivisionContext(division, fn){
  const prevDiv = STATE.profile.division, prevGoal = STATE.profile.goalDivision;
  try{
    STATE.profile.division = division;
    STATE.profile.goalDivision = ""; // avoid recursively triggering goal-aware branching while swapped
    return fn();
  } finally {
    STATE.profile.division = prevDiv;
    STATE.profile.goalDivision = prevGoal;
  }
}
function getCurrentPerformanceBaseline(hpiResult, division){
  const targetDiv = division || STATE.profile.division;
  if(targetDiv===STATE.profile.division) return getBaselineTime(hpiResult);
  return withDivisionContext(targetDiv, ()=>getBaselineTime(calcHPI()));
}
function getHpiAtDate(dateStr){
  const hist=[...STATE.hpiHistory].filter(h=>h.date<=dateStr).sort((a,b)=>b.date.localeCompare(a.date));
  return hist[0]? hist[0].hpi : null;
}
function hpiTrendPerWeek(){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length<2) return null;
  const first=hist[0], last=hist[hist.length-1];
  const wks=weeksBetween(first.date,last.date);
  if(wks<2) return null; // too little real time span to trust as a sustained weekly rate -> use phase default instead
  const rate=(last.hpi-first.hpi)/wks;
  return clamp(rate,-3,3); // sanity cap: genuine week-over-week HPI trends rarely exceed ~3pts/week
}
function defaultWeeklyGrowth(phase){
  return { Base:0.8, Build:0.5, Peak:0.2, Taper:0.0 }[phase] || 0.3;
}
function currentPhase(){
  const target=STATE.profile.targetDate;
  if(!target) return "Build";
  const wksLeft=weeksBetween(todayISO(), target);
  if(wksLeft<0) return "Taper";
  if(wksLeft<=1.5) return "Taper";
  if(wksLeft<=4) return "Peak";
  if(wksLeft<=8) return "Build";
  return "Base";
}
function daysToRace(){
  if(!STATE.profile.targetDate) return null;
  return daysBetween(todayISO(), STATE.profile.targetDate);
}

/* ---------------------------------------------------------------------- */
/* 4d. PREDICTION CONFIDENCE — weighted data-completeness (not field count) */
/*     Drives how much the prediction is allowed to move away from the      */
/*     Anchor (current actual PB). Sparse data -> low confidence -> the      */
/*     prediction stays close to the Anchor instead of swinging wildly.     */
/* ---------------------------------------------------------------------- */
function calcPredictionConfidence(){
  const races=STATE.races;
  const race=latestRace();
  const items=[
    // High importance (0.56 total)
    { w:0.13, ok: !!(race && race.officialTime) },
    { w:0.13, ok: !!(race && RUN_KEYS.every(k=>race.runs?.[k]) && STATIONS.every(s=>race.stations?.[s.key])) },
    { w:0.10, ok: races.length>=2 },
    { w:0.10, ok: recentTraining(14).length>0 },
    { w:0.10, ok: recentMileageAvg(8)!=null },
    // Medium importance (0.24 total) — spec §17: GAP/Aerobic TE/Training Load are Garmin-derived
    // supplementary signals, correctly weighted below the "high" tier (real race/station/HR-paired
    // data) but above pure self-report.
    { w:0.08, ok: recentHrLog(5).length>0 },
    { w:0.07, ok: STATE.trainingLog.filter(l=>isRunType(l.type)).length>=4 },
    { w:0.05, ok: !!(STATE.running.thresholdPace || STATE.running.intervalPace) },
    { w:0.02, ok: STATE.trainingLog.some(l=>l.avgGapSecKm!=null) },
    { w:0.02, ok: STATE.trainingLog.some(l=>l.aerobicTrainingEffect!=null || l.trainingLoad!=null) },
    // Low importance (0.20 total)
    { w:0.05, ok: !!STATE.profile.height },
    { w:0.05, ok: !!STATE.profile.weight },
    { w:0.05, ok: !!STATE.profile.bodyFat },
    { w:0.05, ok: !!STATE.profile.skeletalMuscle },
  ];
  // spec (Confidence 통합): blends the per-Index data-coverage confidence (calcIndexConfidence — the
  // same signal shown on the Prediction page's "능력 요약" cards) into this checklist-based confidence,
  // so adding data that raises an Index's confidence also visibly moves Prediction's confidence/range.
  // Previously these were two unconnected systems computing a similar thing independently. The
  // existing 12-item checklist stays the dominant signal (85%) — this is additive, not a replacement,
  // so existing Prediction confidence behavior/tuning is preserved for anyone who was already HIGH/LOW.
  const checklistConfidence = items.reduce((s,i)=>s+(i.ok?i.w:0),0);
  const indexConfidences = ["running","engine","strengthEnd","skill","recovery","raceExec"]
    .map(k=>calcIndexConfidence(k)).filter(Boolean);
  const indexConfidenceAvg = indexConfidences.length
    ? mean(indexConfidences.map(c=>c.coverageTotal? c.coverageCount/c.coverageTotal : 0))
    : 0;
  const confidence = clamp(checklistConfidence*0.85 + (indexConfidenceAvg||0)*0.15, 0, 1);
  const label = confidence>=0.65?"HIGH":confidence>=0.35?"MEDIUM":"LOW";
  const missing=[];
  if(!(race && RUN_KEYS.every(k=>race.runs?.[k]) && STATIONS.every(s=>race.stations?.[s.key]))) missing.push("최근 대회의 전체 Run/Station 스플릿");
  if(races.length<2) missing.push("과거 대회 기록 2회 이상 (추세 파악용)");
  if(!recentTraining(14).length) missing.push("최근 14일 훈련 기록");
  if(recentMileageAvg(8)==null) missing.push("최근 8주 러닝 거리");
  if(!recentHrLog(5).length) missing.push("최근 훈련의 심박 데이터");

  // category-level 🟢/🟡/🔴 breakdown for the "Prediction에 영향을 준 데이터" UI panel
  const runCount = race ? RUN_KEYS.filter(k=>race.runs?.[k]).length : 0;
  const stCount = race ? STATIONS.filter(s=>race.stations?.[s.key]).length : 0;
  const trainCount = recentTraining(14).length;
  const statusOf=(n,full)=> n>=full? "green" : n>0 ? "yellow" : "red";
  const categories = [
    { label:"최근 HYROX 기록", status: race&&race.officialTime? "green":"red" },
    { label:"최근 Run 기록", status: statusOf(runCount,8) },
    { label:"Station 기록", status: statusOf(stCount,8) },
    { label:"최근 훈련 데이터", status: statusOf(trainCount,4) },
  ];
  return { confidence, label, missing: missing.slice(0,4), categories };
}

/* ---------------------------------------------------------------------- */
/* 4b. PREDICTION ACCURACY TRACKING (spec §1)                              */
/*     Every time a prediction snapshot is recorded (recordHpiSnapshot),    */
/*     it's matched against whichever real race result comes next          */
/*     chronologically — recomputed fresh each call (never mutated/cached）  */
/*     so edited/deleted race history is always reflected correctly.        */
/*     Feeds MAE / median error / range-coverage back into predictTime()'s  */
/*     range width via getRangeCalibrationMultiplier() — the range widens   */
/*     or narrows based on MEASURED past accuracy, never shrunk arbitrarily.*/
/* ---------------------------------------------------------------------- */
// spec: NOT a fixed 68%/95% textbook CI — this range is a hand-tuned display band (see the
// HIGH/MEDIUM/LOW seconds table above). We treat "about 70% of real outcomes should land inside it"
// as the calibration target and tune the multiplier toward that as real match data accumulates.
const PREDICTION_TARGET_COVERAGE = 0.70;
const PREDICTION_CALIBRATION_MIN_SAMPLES = 5; // don't recalibrate off 1-2 lucky/unlucky data points

// Matches every prediction snapshot to the first real race whose date is after the snapshot's date.
// A snapshot with no later race yet is simply unmatched (not an error) — most snapshots will be
// unmatched most of the time; that's expected, not a data problem.
function computePredictionAccuracy(){
  const races=[...STATE.races].filter(r=>r.officialTime && parseTimeToSec(r.officialTime)!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const snapshots=[...STATE.predictionHistory].sort((a,b)=>a.date.localeCompare(b.date));
  const matched=[];
  snapshots.forEach(snap=>{
    const nextRace=races.find(r=>r.date>snap.date);
    if(!nextRace || snap.predictedSec==null) return;
    const actualSec=parseTimeToSec(nextRace.officialTime);
    const errorSec=actualSec-snap.predictedSec;                 // signed: positive = actual slower than predicted
    const absErrorSec=Math.abs(errorSec);
    const withinRange = (snap.ciLow!=null && snap.ciHigh!=null) ? (actualSec>=snap.ciLow && actualSec<=snap.ciHigh) : null;
    // PHASE 5 STEP 5-B — shadow-match Candidate V1/V2 against the same actual result, IF this snapshot
    // happened to capture them (older snapshots recorded before Step 5/5-B won't have these fields —
    // left as null/undefined, never fabricated). Purely additive: does not touch errorSec/absErrorSec/
    // withinRange above, which getRangeCalibrationMultiplier() depends on for Production range tuning.
    const v1ErrorSec = snap.candidateV1Sec!=null ? actualSec-snap.candidateV1Sec : null;
    const v2ErrorSec = snap.candidateV2Sec!=null ? actualSec-snap.candidateV2Sec : null;
    matched.push({ snapDate:snap.date, raceDate:nextRace.date, predictedSec:snap.predictedSec, actualSec,
      errorSec, absErrorSec, withinRange, confidenceLabel:snap.confidenceLabel,
      candidateV1Sec: snap.candidateV1Sec ?? null, v1ErrorSec, v1AbsErrorSec: v1ErrorSec!=null?Math.abs(v1ErrorSec):null,
      candidateV2Sec: snap.candidateV2Sec ?? null, v2ErrorSec, v2AbsErrorSec: v2ErrorSec!=null?Math.abs(v2ErrorSec):null });
  });
  if(matched.length<2) return { sufficient:false, matchedCount:matched.length, matched };
  const maeSec = mean(matched.map(m=>m.absErrorSec));
  const meanErrorSec = mean(matched.map(m=>m.errorSec)); // spec ⑨: Mean Bias — signed, actual-predicted
  const errSorted=matched.map(m=>m.errorSec).sort((a,b)=>a-b);
  const mid=Math.floor(errSorted.length/2);
  const medianErrorSec = errSorted.length%2 ? errSorted[mid] : (errSorted[mid-1]+errSorted[mid])/2;
  const withRange=matched.filter(m=>m.withinRange!=null);
  const coverage = withRange.length ? withRange.filter(m=>m.withinRange).length/withRange.length : null;
  // shadow-backtest aggregates for V1/V2 — only over the subset of matched rows that actually captured
  // that candidate (real users' history will be a mix of pre/post-Step-5 snapshots for a while)
  const withV1 = matched.filter(m=>m.v1AbsErrorSec!=null), withV2 = matched.filter(m=>m.v2AbsErrorSec!=null);
  const shadowV1 = withV1.length ? { n:withV1.length, maeSec: mean(withV1.map(m=>m.v1AbsErrorSec)), biasSec: mean(withV1.map(m=>m.v1ErrorSec)) } : null;
  const shadowV2 = withV2.length ? { n:withV2.length, maeSec: mean(withV2.map(m=>m.v2AbsErrorSec)), biasSec: mean(withV2.map(m=>m.v2ErrorSec)) } : null;
  return { sufficient:true, matchedCount:matched.length, matched, maeSec, meanErrorSec, medianErrorSec, coverage, coverageSampleSize:withRange.length,
    shadowV1, shadowV2 }; // additive fields — nothing above this line changed
}

// Prediction Bias Calibration (spec ⑨/⑩): errorSec = actual-predicted (positive = model predicted
// FASTER than what actually happened, i.e. model was too optimistic; negative = model predicted
// SLOWER than actual, i.e. too conservative). Below PREDICTION_BIAS_MIN_SAMPLES this returns a 0
// adjustment (no behavior change at all — same as before this feature existed). Once enough matched
// real outcomes exist, HALF the measured median bias is applied (a conservative partial correction,
// never a full snap-to-history override), capped so a handful of noisy outcomes can't swing forecasts
// wildly. Deliberately NEVER applied to the horizon=0 Current Anchor (spec ①/⑩ — Anchor and forecast
// calibration must stay separate) — predictTime() only applies this to horizonWeeks>0 forecasts.
const PREDICTION_BIAS_MIN_SAMPLES = 5;
const PREDICTION_BIAS_MAX_ADJUST_SEC = 90;
function getPredictionBiasCalibration(){
  const acc = computePredictionAccuracy();
  if(!acc.sufficient || acc.matchedCount<PREDICTION_BIAS_MIN_SAMPLES){
    return { adjustmentSec:0, meanBiasSec:acc.meanErrorSec ?? null, medianBiasSec:acc.medianErrorSec ?? null, n:acc.matchedCount||0, applied:false };
  }
  const adjustmentSec = clamp(acc.medianErrorSec*0.5, -PREDICTION_BIAS_MAX_ADJUST_SEC, PREDICTION_BIAS_MAX_ADJUST_SEC);
  return { adjustmentSec, meanBiasSec:acc.meanErrorSec, medianBiasSec:acc.medianErrorSec, n:acc.matchedCount, applied:true };
}

// Range calibration (spec: "range을 임의로 좁히는 것이 아니라 실제 데이터가 쌓이면 calibration").
// Below the minimum sample size this returns exactly 1 (no change to the hand-tuned defaults above).
// Once enough matched real outcomes exist, the multiplier is driven purely by measured coverage vs
// the target — under-coverage (band too narrow, real results falling outside it) widens the range;
// over-coverage (band comfortably wider than needed) narrows it, capped so a single good/bad streak
// can't swing it to an extreme.
function getRangeCalibrationMultiplier(){
  const acc=computePredictionAccuracy();
  if(!acc.sufficient || acc.coverageSampleSize<PREDICTION_CALIBRATION_MIN_SAMPLES || acc.coverage==null) return 1;
  const gap = PREDICTION_TARGET_COVERAGE - acc.coverage; // >0 = under-covering (band too narrow)
  return gap>0 ? clamp(1+gap*1.5, 1, 1.8) : clamp(1+gap*0.5, 0.7, 1);
}

function predictTime(hpiResult, horizonWeeks=0){
  const k = Number(STATE.settings.improvementPerHpiPoint)/100; // fraction per HPI point, default 0.35%
  const baseline=getBaselineTime(hpiResult);
  const confInfo = calcPredictionConfidence();
  const confidence = confInfo.confidence;

  if(horizonWeeks===0){
    // spec ①: CURRENT must equal Canonical Current Performance Baseline EXACTLY — no HPI growth, no
    // future-improvement projection, no Tier-2 training-volume signal, no fatigue projection, no
    // consistency bonus. Those are all forward-looking adjustments (spec ⑦/⑧) and must never leak
    // into "current", regardless of confidence. Only the CI range (display-only uncertainty band, not
    // the center) still varies with confidence/execution/calibration, same math as before this pass.
    const predicted = baseline.value;
    const raceExecScore = hpiResult.indices.raceExec.score ?? 60;
    const confidenceHalfWidthSec = { HIGH: 90, MEDIUM: 135, LOW: 180 }[confInfo.label] ?? 180;
    const executionAdjustmentSec = clamp((70-raceExecScore)*0.75, -22.5, 22.5);
    const calibMult = getRangeCalibrationMultiplier();
    const rangeHalfWidthSec = clamp((confidenceHalfWidthSec + executionAdjustmentSec) * calibMult, 75, 300);
    return { predicted, ciLow:predicted-rangeHalfWidthSec, ciHigh:predicted+rangeHalfWidthSec, baseline,
      projectedHpi:hpiResult.hpi, deltaHpi:0, tier2Gap:0, improvementProb:null, horizonWeeks:0, fraction:0,
      confidence, confidenceLabel:confInfo.label, missingData:confInfo.missing, dataCategories:confInfo.categories,
      rawModelPrediction:predicted, biasCalibration:{ adjustmentSec:0, applied:false, n:0, meanBiasSec:null, medianBiasSec:null } };
  }

  // horizonWeeks > 0: forward-looking forecast, always starting from the SAME Current Anchor
  // (baseline.value, computed once above — identical to what horizonWeeks===0 returns) so 4/8/12-week
  // numbers can never drift the "current" number itself (spec ⑦).
  const baselineHpi = baseline.baselineHpiDate? getHpiAtDate(baseline.baselineHpiDate) : null;
  const refHpi = baselineHpi!=null? baselineHpi : Math.max(30, hpiResult.hpi-8);

  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const dampedGrowth = growth * Math.pow(0.92,Math.max(0,horizonWeeks-1)); // diminishing returns
  const projectedHpi = clamp(hpiResult.hpi + dampedGrowth*horizonWeeks, 0, 100);

  const deltaHpi = projectedHpi - refHpi;

  // Data priority hierarchy: Tier 1 (station tests within 14d + PBs) should drive the large majority
  // of any predicted change; Tier 2 (Garmin/training-log volume & HR trend, EMA-smoothed above) is a
  // supporting signal only, hard-capped so it can never move the prediction by more than ~4% on its own.
  const hpiTier1 = calcHPI(true);
  const tier2Gap = hpiResult.hpi - hpiTier1.hpi; // how many HPI points Tier-2 signals are currently adding/removing
  const tier2FractionRaw = tier2Gap * k;
  const TIER2_CAP = 0.04; // ±4%, middle of the requested 3-5% band
  const tier2Excess = tier2FractionRaw - clamp(tier2FractionRaw, -TIER2_CAP, TIER2_CAP);

  const counts=trainingCountByType(14);
  const targetSessions = 8; // rough target sessions/2wk for full consistency bonus
  const consistency = clamp(Object.values(counts).reduce((a,b)=>a+b,0)/targetSessions,0,1.3);
  // deliberately small cap: showing up consistently is a minor tiebreaker, not a driver of the prediction.
  // Real capability change (fresh station benchmark tests, PB updates) flows through deltaHpi*k above,
  // which is where the model's weight is meant to live — training volume alone must not inflate the forecast.
  const consistencyBonus = clamp(consistency-0.5,0,0.8) * 0.005; // up to -0.5% max

  const projectedFatigue = horizonWeeks>0 && currentPhase()==="Taper" ? Math.max(20,hpiResult.fatigue-15*horizonWeeks) : hpiResult.fatigue;
  const fatiguePenalty = projectedFatigue>70 ? ((projectedFatigue-70)/10)*0.01 : 0;

  // Raw model fraction (wider bound — this is the "if we fully trusted the model" number)
  const rawFraction = clamp(deltaHpi*k - tier2Excess - consistencyBonus + fatiguePenalty, -0.5, 0.3);
  const rawModelPrediction = baseline.value * (1 - rawFraction);

  // Anchor + Model blend: sparse data -> low confidence -> prediction stays close to the Anchor
  // (the athlete's actual current PB) instead of swinging wildly on thin evidence.
  const blended = baseline.value*(1-confidence) + rawModelPrediction*confidence;

  // spec ⑨/⑩: Prediction Bias Calibration — applied ONLY here (the forward-looking forecast delta),
  // never to the horizon=0 Anchor above. Below min sample this is a no-op (adjustmentSec=0).
  const biasCalibration = getPredictionBiasCalibration();
  const predicted = blended + biasCalibration.adjustmentSec;
  const fraction = 1 - (predicted/baseline.value); // effective fraction after blending+calibration, for display/back-compat

  // Prediction interval — intentionally narrower than the previous ±1.5~6.5% model.
  // The forecast itself is unchanged; only the displayed uncertainty band is calibrated.
  // HIGH: ±1:15~1:30, MEDIUM: ±1:45~2:15, LOW: ±2:30~3:00 BEFORE real-data calibration.
  // calibMult (spec §1) then widens/narrows this based on MEASURED coverage from real race outcomes
  // once enough of them exist — never an arbitrary manual narrowing. Cap raised from 3:00 to 5:00 to
  // give calibration room to widen when real data shows the band running too tight.
  const raceExecScore = hpiResult.indices.raceExec.score ?? 60;
  const confidenceHalfWidthSec = { HIGH: 90, MEDIUM: 135, LOW: 180 }[confInfo.label] ?? 180;
  const executionAdjustmentSec = clamp((70-raceExecScore)*0.75, -22.5, 22.5);
  const calibMult = getRangeCalibrationMultiplier();
  const rangeHalfWidthSec = clamp((confidenceHalfWidthSec + executionAdjustmentSec) * calibMult, 75, 300);
  const ciLow = predicted - rangeHalfWidthSec;
  const ciHigh = predicted + rangeHalfWidthSec;

  const trendBonus = (growth||0)*5;
  const fatiguePenaltyPts = hpiResult.fatigue>70? (hpiResult.fatigue-70)*0.6:0;
  const improvementProb = clamp(50 + trendBonus - fatiguePenaltyPts + (consistency-0.7)*8, 5, 95);

  return { predicted, ciLow, ciHigh, baseline, projectedHpi, deltaHpi, tier2Gap, improvementProb, horizonWeeks, fraction,
    confidence, confidenceLabel:confInfo.label, missingData:confInfo.missing, dataCategories:confInfo.categories, rawModelPrediction,
    biasCalibration };
}

function fatiguePenaltySeconds(fatigueScore){
  return fatigueScore>70 ? ((fatigueScore-70)/10)*0.01 : 0;
}

/* ---------------------------------------------------------------------- */
/* 5b-2. V3 — SEGMENT-BASED RACE PERFORMANCE MODEL                         */
/*     Decomposes race time into its 17 constituent segments (8 Runs,      */
/*     8 Stations, Transition/Roxzone). Builds a "Current Estimated Race   */
/*     Time" from segment-level actuals whenever they exist, instead of    */
/*     a single flat number. Reuses the existing per-station freshness/    */
/*     adjustment logic (getStationDataMeta) rather than duplicating it.   */
/*     Each segment is tagged with a `basis` so the UI can always show     */
/*     whether a number is real, adjusted, or a reference benchmark —      */
/*     never displayed as a real stat when it isn't one.                   */
/* ---------------------------------------------------------------------- */
const SEGMENT_LIST = [
  ...RUN_KEYS.map(k=>({ type:"run", key:`run${k}`, runIdx:k, label:`Run ${k}` })),
  ...STATIONS.map(s=>({ type:"station", key:s.key, label:s.label })),
  { type:"transition", key:"transition", label:"Transition/Roxzone" },
];
// ASIA/Global derived-benchmark hookup (review item #3): previously ONLY computeStationPriority()
// consulted DERIVED_BENCHMARK — the 17-segment Anchor model (and therefore getBaselineTime() /
// predictTime() / Goal Setting / Division Transition, everything downstream of it) fell straight to
// the static hardcoded BENCH table whenever a segment had no real athlete data at all. That's the
// literal mechanism behind "Row 1000m 기준 2:30" showing up as a benchmark-only segment value even
// though the real Asia P50 for this athlete's Division/Gender/AgeBand is ~5:07-5:45 — BENCH's static
// number, not the imported Asia data, was what actually fed the prediction. Fixed by routing every
// benchmark-only lookup used by the segment model through the SAME queryDerivedBenchmark() fallback
// chain (ASIA -> ASIA_AGE_RELAXED -> GLOBAL_HISTORICAL -> GLOBAL_HISTORICAL_AGE_RELAXED ->
// GLOBAL_MATRIX) computeStationPriority already uses, before falling back to BENCH. Real personal
// data (actual/actual-adjusted/actual-stale/estimated-training-pace) is untouched and still always
// wins — this only changes what fills in for segments with NO personal data at all.
function getSegmentBenchmarkSec(segmentKey){
  const ageBand = deriveAgeBand(STATE.profile.age);
  const benchGender = deriveBenchmarkGender();
  const derived = queryDerivedBenchmark(currentPredictionDivision(), benchGender, ageBand, segmentKey);
  if(derived && derived.p50) return { sec:derived.p50, source:derived.benchmark_source, sampleN:derived.sample_n, confidence:derived.confidence };
  return null;
}
// KEY-MAPPING FIX: segment keys passed to queryDerivedBenchmark() must be the SAME key strings this
// app already uses everywhere else for these segments — SEGMENT_LIST's own seg.key ("run1".."run8"
// for run legs, "transition" for roxzone, STATIONS[].key for stations, e.g. "sledPush") — not a
// separately-invented naming scheme. computeStationPriority() already queries stations this way
// (`s.key`, camelCase, e.g. "sledPush" — NOT the snake_case "sled_push" used by the UNRELATED
// EXTERNAL_RACE_DB/RACE_RECORD_SCHEMA peer-DB system). Previously this function used "run_"+runIdx
// and "roxzone", which don't match SEGMENT_LIST's "run1".."run8"/"transition" keys and therefore never
// matched anything in derived_benchmark.json, silently falling through to STATIC_FALLBACK for every
// run leg and the transition segment regardless of what was actually imported.
function segmentBenchmarkWithFallback(segKey, staticFallbackSec){
  const derived = getSegmentBenchmarkSec(segKey);
  return { sec: derived ? derived.sec : staticFallbackSec, source: derived ? derived.source : "STATIC_FALLBACK" };
}
// HYROX run legs are 1km each. Per-leg derived benchmark (segment key "run1".."run8", matching
// SEGMENT_LIST's own run seg.key) preferred over the flat static bench().runKm.
function runLegBenchmarkSec(runIdx){
  return segmentBenchmarkWithFallback("run"+runIdx, bench().runKm);
}
function runBenchmarkSec(){ return bench().runKm; } // back-compat: flat estimate, callers with no specific leg
// transition/roxzone: segment key "transition" (matching SEGMENT_LIST's own transition seg.key, NOT
// "roxzone"). Static fallback fixed at 300s (5min) — matches the existing peer-benchmark "roxzone"
// base (PEER_SEGMENTS: { key:"roxzone", base:300 }) — since SEGMENT_LIST's transition segment is the
// FULL race Transition/Roxzone aggregate, not one single station-to-station gap; runKm*0.15 (~45-50s)
// was scaled for the latter and understated the former by ~6x. Only applies when no derived ASIA/
// Global row exists at all — the derived chain (ASIA -> ... -> GLOBAL_MATRIX) is unchanged and still
// takes priority whenever a matching row is available.
function transitionBenchmarkSec(){
  return segmentBenchmarkWithFallback("transition", 300);
}


// spec (Simulation -> 17-segment connection, same official-priority rule as collectStationCandidates
// above): a Simulation run leg's actual distance is converted to its 1km-pace equivalent (exact
// division, no invented factor) since every run segment elsewhere in this app represents "time for
// this 1km leg". Distance MUST be present — a run entry with a time but no distance is skipped
// entirely rather than assumed to be 1km. No-simulation users: identical output to before (empty loop).
// spec (Simulation -> 17-segment connection, same official-priority rule as collectStationCandidates
// above): a Simulation run leg's actual distance is converted to its 1km-pace equivalent (exact
// division, no invented factor) since every run segment elsewhere in this app represents "time for
// this 1km leg". Distance MUST be present — a run entry with a time but no distance is skipped
// entirely rather than assumed to be 1km. No-simulation users: identical output to before (empty loop).
// Division-aware: races/simulations are filtered to the current profile's Division base first (see
// divisionBase()/collectStationCandidates() above for the full rationale).
function runLegCandidates(runIdx){
  const myDiv=currentProfileDivisionBase();
  const out=[...STATE.races].filter(r=>{
    return PREDICTION_DIVISION_OVERRIDE ? r.division===myDiv : divisionBase(r.division)===myDiv;
  })
    .map(r=>({ date:r.date, sec:parseTimeToSec(r.runs?.[runIdx]), source:"race" }))
    .filter(c=>c.sec!=null);
  // doc12 §3: 더 이상 "최근 공식 기록<=21일" 이유만으로 Simulation 후보를 배제하지 않음 — 항상 추가하고
  // recency 정렬로 실제 더 최근인 쪽이 자연스럽게 선택되도록 함 (collectStationCandidates와 동일 원칙).
  STATE.simulationTests.filter(t=>{
    return PREDICTION_DIVISION_OVERRIDE ? t.division===myDiv : divisionBase(t.division)===myDiv;
  }).forEach(t=>{
    const r=t.runs && t.runs[runIdx];
    if(!r || !r.time || r.distanceM==null || r.distanceM<=0) return; // never guess a missing distance
    const timeSec=parseTimeToSec(r.time);
    if(!timeSec) return;
    out.push({ date:t.date, sec:(timeSec/r.distanceM)*1000, source:"simulation" });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}
function transitionCandidates(){
  const myDiv=currentProfileDivisionBase();
  const out=[...STATE.races].filter(r=>{
    return PREDICTION_DIVISION_OVERRIDE ? r.division===myDiv : divisionBase(r.division)===myDiv;
  })
    .map(r=>({ date:r.date, sec:parseTimeToSec(r.transition), source:"race" }))
    .filter(c=>c.sec!=null);
  STATE.simulationTests.filter(t=>{
    return PREDICTION_DIVISION_OVERRIDE ? t.division===myDiv : divisionBase(t.division)===myDiv;
  }).forEach(t=>{
    if(!t.transition) return;
    const sec=parseTimeToSec(t.transition);
    if(!sec) return;
    out.push({ date:t.date, sec, source:"simulation" });
  });
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out;
}

// resolves ONE segment's current value. Priority: fresh actual (<=14d, same threshold as stations
// elsewhere) > stale actual with a small capped nudge from the training-log trend (mirrors
// getStationDataMeta's own logic, reused for stations) > benchmark reference (flagged, not "actual").
// spec (doc8, 추가 필수사항): "10K TT를 HYROX Run pace와 동일시하지 말고, 기존 HYROX 데이터에서 확인
// 가능한 관계/보정 로직을 사용" — a flat 10K TT pace is NOT the same as HYROX run-leg pace (fatigue,
// footing, station transitions all slow it down), so this derives the athlete's OWN personal ratio
// between their real HYROX run-leg pace (race or simulation) and their nearest-preceding 10K TT pace,
// from their own paired history only. Never a universal constant, never used with fewer than 2 pairs.
const TENK_PAIR_WINDOW_DAYS = 45;
function computePersonalRunToTenKRatio(){
  const myDiv=currentProfileDivisionBase();
  const runEvents=[];
  [...STATE.races].filter(r=>divisionBase(r.division)===myDiv).forEach(r=>{
    const legs=RUN_KEYS.map(k=>parseTimeToSec(r.runs?.[k])).filter(v=>v!=null);
    if(legs.length) runEvents.push({ date:r.date, paceSecKm: mean(legs) });
  });
  STATE.simulationTests.filter(t=>{
    return PREDICTION_DIVISION_OVERRIDE ? t.division===myDiv : divisionBase(t.division)===myDiv;
  }).forEach(t=>{
    const legs=RUN_KEYS.map(k=>{
      const r=t.runs&&t.runs[k]; if(!r||!r.time||!r.distanceM) return null;
      const sec=parseTimeToSec(r.time); return sec? (sec/r.distanceM)*1000 : null;
    }).filter(v=>v!=null);
    if(legs.length) runEvents.push({ date:t.date, paceSecKm: mean(legs) });
  });
  const tenKEvents = STATE.trainingLog.filter(l=>l.type==="tt" && l.distanceKm!=null && l.distanceKm>=9 && l.distanceKm<=11 && l.avgPaceSecKm)
    .map(l=>({ date:l.date, paceSecKm:Number(l.avgPaceSecKm) }));
  if(!runEvents.length || !tenKEvents.length) return null;
  const ratios=[];
  runEvents.forEach(re=>{
    const nearby = tenKEvents.filter(te=>{ const d=daysBetween(te.date, re.date); return d>=0 && d<=TENK_PAIR_WINDOW_DAYS; })
      .sort((a,b)=>daysBetween(a.date,re.date)-daysBetween(b.date,re.date));
    if(nearby.length) ratios.push(re.paceSecKm/nearby[0].paceSecKm);
  });
  if(ratios.length<2) return null;
  ratios.sort((a,b)=>a-b);
  const mid=Math.floor(ratios.length/2);
  const median = ratios.length%2 ? ratios[mid] : (ratios[mid-1]+ratios[mid])/2;
  // sanity bounds only guard a single noisy pair from producing a nonsense multiplier — the value
  // itself always comes from the athlete's own real paired data, never invented.
  return { ratio: clamp(median, 0.7, 1.6), n: ratios.length };
}
function resolveSegment(seg){
  const b=bench();
  if(seg.type==="station"){
    const meta=getStationDataMeta()[seg.key];
    const stationBench = segmentBenchmarkWithFallback(seg.key, b[seg.key]);
    const benchmark = stationBench.sec, benchmarkSource = stationBench.source;
    if(meta && meta.value){
      return { ...seg, sec:parseTimeToSec(meta.value), date:meta.date, ageDays:meta.ageDays, isFresh:meta.isFresh,
        source:meta.source, adjusted:meta.adjusted, benchmark, benchmarkSource,
        basis: meta.isFresh?"actual":(meta.adjusted?"actual-adjusted":"actual-stale") };
    }
    return { ...seg, sec:null, benchmark, benchmarkSource, basis:"benchmark-only" };
  }
  if(seg.type==="run"){
    const legBench = runLegBenchmarkSec(seg.runIdx);
    const cands=runLegCandidates(seg.runIdx);
    if(cands.length){
      const top=cands[0]; const ageDays=daysBetween(top.date, todayISO()); const isFresh=ageDays<=STATION_STALE_DAYS;
      let sec=top.sec, adjusted=false;
      if(!isFresh){
        const oldPace=avgRunPaceNear(top.date,10), recentPace=avgRunPaceNear(todayISO(),10);
        if(oldPace && recentPace){
          const adjustPct=clamp((oldPace-recentPace)/oldPace, -MAX_STALE_ADJUST_PCT, MAX_STALE_ADJUST_PCT);
          if(Math.abs(adjustPct)>0.002){ sec=top.sec*(1-adjustPct); adjusted=true; }
        }
      }
      return { ...seg, sec, rawSec:top.sec, date:top.date, ageDays, isFresh, source:top.source, adjusted,
        benchmark:legBench.sec, benchmarkSource:legBench.source, basis: isFresh?"actual":(adjusted?"actual-adjusted":"actual-stale") };
    }
    // no race run-split at all -> fall back to recent logged running pace (Tier 2 signal only),
    // refined by the personal 10K->HYROX-run-leg calibration above when enough of the athlete's own
    // paired data exists — otherwise identical to the previous flat recentRunPaceAvg() behavior.
    const paceAvg=recentRunPaceAvg(21);
    const latestTenK = STATE.trainingLog.filter(l=>l.type==="tt" && l.distanceKm!=null && l.distanceKm>=9 && l.distanceKm<=11 && l.avgPaceSecKm)
      .sort((a,b)=>b.date.localeCompare(a.date))[0];
    const personalRatio = latestTenK ? computePersonalRunToTenKRatio() : null;
    if(latestTenK && personalRatio && daysBetween(latestTenK.date, todayISO())<=21){
      const calibratedSec = Number(latestTenK.avgPaceSecKm) * personalRatio.ratio;
      const sec = paceAvg ? (calibratedSec+paceAvg)/2 : calibratedSec;
      return { ...seg, sec, benchmark:legBench.sec, benchmarkSource:legBench.source, basis:"estimated-10k-calibrated",
        source:"trainingLog", calibration:{ ratio:Math.round(personalRatio.ratio*100)/100, pairSamples:personalRatio.n, tenKDate:latestTenK.date } };
    }
    if(paceAvg) return { ...seg, sec:paceAvg, benchmark:legBench.sec, benchmarkSource:legBench.source, basis:"estimated-training-pace", source:"trainingLog" };
    return { ...seg, sec:null, benchmark:legBench.sec, benchmarkSource:legBench.source, basis:"benchmark-only" };
  }
  // transition
  const transBench = transitionBenchmarkSec();
  const cands=transitionCandidates();
  if(cands.length){
    const top=cands[0]; const ageDays=daysBetween(top.date, todayISO());
    return { ...seg, sec:top.sec, date:top.date, ageDays, isFresh: ageDays<=STATION_STALE_DAYS, source:top.source,
      benchmark: transBench.sec, benchmarkSource:transBench.source, basis: ageDays<=STATION_STALE_DAYS?"actual":"actual-stale" };
  }
  return { ...seg, sec:null, benchmark: transBench.sec, benchmarkSource:transBench.source, basis:"benchmark-only" };
}

function buildRaceSegmentModel(){
  const segments = SEGMENT_LIST.map(resolveSegment);
  const withActual = segments.filter(s=>s.basis && s.basis.startsWith("actual"));
  const dataCoverage = withActual.length / segments.length; // 0~1 — how much of the total rests on real data
  let total=0;
  segments.forEach(s=>{ total += (s.sec!=null ? s.sec : s.benchmark); });
  return { segments, total, dataCoverage, segmentCount:segments.length, actualCount:withActual.length };
}

// only trusted as the primary "current estimate" anchor once at least half the 17 segments are
// backed by real data — below that, getBaselineTime() falls through to its existing behavior.
function getSegmentBaseline(){
  const model=buildRaceSegmentModel();
  if(model.actualCount < model.segmentCount*0.5) return null;
  return { value: model.total, source: `Segment 모델 (${model.actualCount}/${model.segmentCount}개 구간 실측 기반)`, model };
}

/* ---------------------------------------------------------------------- */
/* 5c. PREDICTION ATTRIBUTION — "왜 예상 기록이 바뀌었는가", 지수별로 분해   */
/*     Compares the two most recent HPI snapshots and converts each        */
/*     index's score change into a seconds-equivalent, using the same      */
/*     weights/k the prediction engine itself uses — so the breakdown      */
/*     always sums to the actual predicted-time change (no hidden terms).  */
/* ---------------------------------------------------------------------- */
function computePredictionAttribution(){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length<2) return null;
  const prev=hist[hist.length-2], curr=hist[hist.length-1];
  const hpiResult=calcHPI();
  const k=Number(STATE.settings.improvementPerHpiPoint)/100;
  const baseline=getBaselineTime(hpiResult).value;
  const items=Object.keys(INDEX_WEIGHTS).map(key=>{
    if(prev[key]==null||curr[key]==null) return null;
    const deltaScore=curr[key]-prev[key];
    // positive deltaScore (improvement) should REDUCE predicted time -> negative seconds
    const timeImpact = -(deltaScore*INDEX_WEIGHTS[key]*k*baseline);
    return { key, label:INDEX_META[key].label.replace(" Index",""), deltaScore, timeImpact };
  }).filter(Boolean);
  if(prev.fatigue!=null && curr.fatigue!=null){
    const deltaPenalty = fatiguePenaltySeconds(curr.fatigue)-fatiguePenaltySeconds(prev.fatigue);
    items.push({ key:"fatigue", label:"Fatigue", deltaScore:curr.fatigue-prev.fatigue, timeImpact: deltaPenalty*baseline });
  }
  items.sort((a,b)=>a.timeImpact-b.timeImpact);
  const totalTimeImpact=items.reduce((s,i)=>s+i.timeImpact,0);
  return { fromDate:prev.date, toDate:curr.date, items, totalTimeImpact };
}

// V3 (spec §35): breaks the index-level attribution above down further into individual segments
// (Running/Sled Push/Wall Ball/Transition...) instead of stopping at "Running Index" / "Strength
// Endurance Index". No new totals are invented — each index's timeImpact is split across ITS OWN
// segments (via segmentIndexKey(), same mapping used by §5 Target Gap Decomposition and §9 Training
// Priority) in proportion to each segment's Realistic improvement potential, so the segment-level
// breakdown always sums to exactly the same total as the index-level one. Indices with no matching
// segments (or where segment weights are all zero) are kept at index level rather than fabricating a split.
function buildPredictionAttributionV3(){
  const attr=computePredictionAttribution();
  if(!attr) return null;
  const segAnalysis=buildSegmentGapAnalysis();
  const items=[];
  attr.items.forEach(item=>{
    if(item.key==="fatigue"){ items.push({ label:"Training Trend / Fatigue", timeImpact:item.timeImpact, isIndexLevel:true }); return; }
    const segs=segAnalysis.segments.filter(s=>segmentIndexKey(s)===item.key);
    const totalWeight=segs.reduce((s,x)=>s+x.realisticSec,0);
    if(!segs.length || totalWeight<=0){ items.push({ label:item.label, timeImpact:item.timeImpact, isIndexLevel:true }); return; }
    segs.forEach(s=>{ items.push({ label:s.label, timeImpact:item.timeImpact*(s.realisticSec/totalWeight), isIndexLevel:false, parentIndex:item.label }); });
  });
  items.sort((a,b)=>a.timeImpact-b.timeImpact);
  return { fromDate:attr.fromDate, toDate:attr.toDate, items, totalTimeImpact:attr.totalTimeImpact };
}

/* ---------------------------------------------------------------------- */
/* 5d. A / B / C GOAL SCENARIOS — Challenge / Realistic / Safe             */
/* ---------------------------------------------------------------------- */
function computeGoalScenarios(){
  const hpiResult=calcHPI();
  const priority=computeTrainingPriority();
  const topTraining=priority[0]?.label?.replace(" Index","") || "—";
  const priorityTop3=priority.slice(0,3).map(p=>p.label.replace(" Index",""));
  const dLeft=daysToRace();
  const weeksToRace = dLeft!=null ? clamp(dLeft/7,1,52) : null;

  // V3 (spec §28): scenarios are built from the ACTUAL runway to race day, not fixed 4/8/12wk anchors.
  // Safe = early portion of the runway (quick, low-risk win), Realistic = most of it, Challenge = the
  // full remaining time. Without a race date, fall back to the old 4/8/12wk planning default (flagged).
  let wSafe, wReal, wChallenge, hasRaceDate;
  if(weeksToRace!=null){
    wSafe=clamp(weeksToRace*0.25,1,weeksToRace); wReal=clamp(weeksToRace*0.6,1,weeksToRace); wChallenge=weeksToRace;
    hasRaceDate=true;
  } else {
    wSafe=4; wReal=8; wChallenge=12; hasRaceDate=false;
  }
  // IMPORTANT: A/B/C milestone forecasts must use the SAME selected goal Division as the
  // current baseline. The previous implementation only made currentSec goal-aware while
  // pSafe/pReal/pChallenge silently stayed on STATE.profile.division, so Open Doubles and
  // Pro Doubles could show the same 8-week milestone even when their current baselines differed.
  const goalDivForScenario = STATE.profile.goalDivision || STATE.profile.division;
  const predictGoalScenario = (weeks)=>withDivisionContext(goalDivForScenario, ()=>predictTime(calcHPI(), weeks));
  const pSafe=predictGoalScenario(wSafe), pReal=predictGoalScenario(wReal), pChallenge=predictGoalScenario(wChallenge);
  const goalAwareNow=getGoalAwareBaseline(hpiResult);
  const currentSec=goalAwareNow.value;

  const risks=[];
  if(hpiResult.fatigue>60) risks.push("현재 피로도가 높음 — 무리한 강도 상승은 부상 위험을 키울 수 있음");
  if(hpiResult.indices.recovery.score!=null && hpiResult.indices.recovery.score<60) risks.push("회복 지표가 낮음 — 목표 기간 내내 훈련을 꾸준히 유지할 수 있는지가 관건");
  if(dLeft!=null && dLeft<28) risks.push("대회까지 4주 미만 — 큰 폭의 향상보다 컨디션 관리가 우선");
  if(!risks.length) risks.push("현재 특별한 위험 신호는 없음");

  const volumeNote=(weeks)=> weeks<=4 ? "고강도 최소화, 컨디션 관리 중심" : weeks<=8 ? "주 4-5회, 약점 영역 집중 보강" : "주 5-6회, 베이스 구축 후 레이스 특이성 강화";

  const buildScenario=(key,label,sub,pred,weeks,probRaw)=>({
    key, label, sub, predicted:pred.predicted, ciLow:pred.ciLow, ciHigh:pred.ciHigh, weeks:round1(weeks),
    currentGapSec: currentSec-pred.predicted, prob: clamp(probRaw,5,95), risks: risks.slice(0,2), training: topTraining,
    primaryLimiter: priorityTop3[0]||"—", recommendedVolume: volumeNote(weeks) });

  return {
    A: buildScenario("A","Challenge","도전적인 목표", pChallenge, wChallenge, pChallenge.improvementProb-25),
    B: buildScenario("B","Realistic","현재 데이터 기준 현실적인 목표", pReal, wReal, pReal.improvementProb),
    C: buildScenario("C","Safe","달성 가능성이 높은 목표", pSafe, wSafe, pSafe.improvementProb+20),
    hasRaceDate, currentSec, goalAwareDebug:goalAwareNow.debug,
  };
}

/* ---------------------------------------------------------------------- */
/* 5e. GOAL PLAN — target time vs current, decomposed by priority          */
/*     (impact × improvability), NOT proportionally split across splits.   */
/*     Reuses the already-tested prediction/priority/scenario engines      */
/*     rather than inventing a parallel calculation path.                  */
/* ---------------------------------------------------------------------- */
function computeGoalPlan(){
  const targetSec=parseTimeToSec(STATE.profile.targetTime);
  if(!targetSec) return null;
  const hpiResult=calcHPI();
  const baseline=getGoalAwareBaseline(hpiResult); // was getBaselineTime() directly — see getGoalAwareBaseline() header for why
  const currentSec=baseline.value;
  const totalGapSec=currentSec-targetSec; // positive = need to get faster

  const priority=computeTrainingPriority();

  // V3: segment-level Target Gap Decomposition (spec §5) replaces the old proportional-by-priority-
  // score split. Aggregated into the same run/station/roxzone buckets so the existing summary bar UI
  // is unchanged, but the underlying numbers now come from 17 individually-modeled segments.
  const segmentGap=calculateTargetGap();
  let decomposition;
  if(segmentGap && !segmentGap.alreadyMet){
    const sumBy=(pred)=>segmentGap.segments.filter(pred).reduce((s,x)=>s+x.allocatedSec,0);
    decomposition = {
      run: sumBy(s=>s.type==="run"),
      station: sumBy(s=>s.type==="station"),
      roxzone: sumBy(s=>s.type==="transition"),
    };
  } else {
    decomposition = { run: totalGapSec*0.5, station: totalGapSec*0.4, roxzone: totalGapSec*0.1 };
  }

  const scenarios=computeGoalScenarios();
  let probability, feasibility;
  if(totalGapSec<=0){ probability=95; feasibility="already-met"; }
  else if(targetSec>=scenarios.C.predicted){ probability=88; feasibility="safe"; }
  else if(targetSec>=scenarios.B.predicted){ probability=65; feasibility="realistic"; }
  else if(targetSec>=scenarios.A.predicted){ probability=35; feasibility="challenge"; }
  else { probability=12; feasibility="unrealistic"; }

  // V3 (spec §27): even if the HPI-trend-based scenario check above looked optimistic, if the segment
  // model shows the gap exceeds the AGGRESSIVE ceiling summed across all 17 segments, the honest read
  // is "달성 가능성이 낮음" — never respond to an extreme target by silently implying more intensity fixes it.
  if(segmentGap && !segmentGap.alreadyMet && segmentGap.feasibility==="beyond-model"){
    feasibility="unrealistic"; probability=Math.min(probability,15);
  }

  const weeksToRace=daysToRace()!=null ? Math.max(0,daysToRace()/7) : null;
  const goalDivForMilestone = STATE.profile.goalDivision || STATE.profile.division;
  const milestones=[4,8,12].map(w=>({
    weeks:w,
    predicted:withDivisionContext(goalDivForMilestone, ()=>predictTime(calcHPI(),w)).predicted
  }));

  const priorityTop3=priority.slice(0,3).map(p=>p.label.replace(" Index",""));

  // never overstate certainty on thin data: widen the probability into a range and flag it as an
  // estimate rather than showing a single confident-looking percentage.
  const confInfo=calcPredictionConfidence();
  const probLow=clamp(probability-Math.round((1-confInfo.confidence)*25),3,95);
  const probHigh=clamp(probability+Math.round((1-confInfo.confidence)*25),3,95);

  return { targetSec, currentSec, totalGapSec, decomposition, segmentGap, probability, probLow, probHigh, feasibility, scenarios, milestones,
    weeksToRace, priorityTop3, baselineSource:baseline.source, confidence:confInfo.confidence, confidenceLabel:confInfo.label, missingData:confInfo.missing,
    goalAwareDebug:baseline.debug };
}

function analyzeBottleneck(hpiResult){
  const race=latestRace(); const b=bench(); const st=latestStationValues();
  const items=[];
  STATIONS.forEach(s=>{
    const sec=parseTimeToSec(st[s.key]); const bb=b[s.key];
    if(sec&&bb){ const gapPct=((sec-bb)/bb)*100; items.push({ label:s.label, key:s.key, kind:"station", gapPct, actual:sec, bench:bb }); }
  });
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
    const avgRun=mean(runsSec.filter(v=>v!=null));
    if(avgRun){ const gapPct=((avgRun-b.runKm)/b.runKm)*100; items.push({ label:"Running (평균 스플릿)", key:"run", kind:"run", gapPct, actual:avgRun, bench:b.runKm }); }
  }
  items.sort((a,b2)=>b2.gapPct-a.gapPct);
  const worstIndexEntry = Object.entries(hpiResult.indices).sort((a,b2)=>(a[1].score??100)-(b2[1].score??100))[0];
  return { items: items.slice(0,8), worstIndex: worstIndexEntry ? {key:worstIndexEntry[0], ...worstIndexEntry[1]} : null };
}

/* ---------------------------------------------------------------------- */
/* 5a. TRAINING PRIORITY ENGINE                                            */
/*     Training data feeds BOTH the race prediction (already wired into    */
/*     the HPI/prediction engines above) AND next-training-direction        */
/*     decisions here. Priority is NOT "whichever index scores lowest" —    */
/*     it's Impact(race-time weight) × Improvability(headroom), so a index  */
/*     that's already 90+ never gets over-prioritized just because it's     */
/*     numerically the smallest gap to another 90+ index.                  */
/* ---------------------------------------------------------------------- */
// within ONE race: how much did each station's fatigue carry into the run right after it,
// relative to that race's own average run pace (the "general" baseline for that day)?
function computeStationInducedDegradation(race){
  if(!race) return [];
  const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
  const avgRun=mean(runsSec.filter(v=>v!=null));
  if(!avgRun) return [];
  const out=[];
  STATIONS.forEach(s=>{
    const map=STATION_RUN_MAP[s.key];
    if(map.after==null) return; // Wall Ball finishes the race, no run after it
    const afterSec=runsSec[map.after-1];
    if(afterSec!=null) out.push({ key:s.key, label:s.label, afterRunSec:afterSec, baselineSec:avgRun, degradationSec: afterSec-avgRun });
  });
  return out.sort((a,b)=>b.degradationSec-a.degradationSec);
}

/* ---------------------------------------------------------------------- */
/* 5a-3. V3 — RACE EXECUTION DIAGNOSIS (spec §16)                          */
/*     Run1→Run8 slowing down does NOT automatically mean "부족한 러닝     */
/*     체력" — it could be station-induced fatigue carrying into the next  */
/*     run, or a pure pacing problem (starting too fast). This checks how   */
/*     much of the measured Run1→Run8 fade the measured post-station        */
/*     slowdowns (computeStationInducedDegradation) actually account for,   */
/*     rather than asserting a cause without evidence.                      */
/* ---------------------------------------------------------------------- */
function analyzeRaceExecution(race){
  race = race || latestRace();
  if(!race) return null;
  const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k]));
  const first=runsSec[0], last=runsSec[7];
  if(first==null || last==null) return null;
  const fadeSec=last-first;
  const fadePct=(fadeSec/first)*100;
  const degradation=computeStationInducedDegradation(race);
  const explainedSec=degradation.reduce((s,d)=>s+Math.max(0,d.degradationSec),0);
  // bounded diagnostic, not a full reconciliation (Run1 has no preceding station) — only meant to
  // show roughly how much of the overall fade lines up with measured post-station slowdowns.
  const explainedRatio = fadeSec>0 ? clamp(explainedSec/fadeSec,0,1.5) : null;
  let diagnosis;
  if(fadeSec<=0){
    diagnosis={ key:"good", label:"Pacing 양호", detail:"Run1 대비 Run8이 느려지지 않았습니다." };
  } else if(explainedRatio!=null && explainedRatio>=0.7){
    diagnosis={ key:"station", label:"Station-induced Fatigue가 주요 원인",
      detail:`측정된 스테이션 이후 Run 저하분(${fmtTime(explainedSec)})이 전체 페이스 저하(${fmtTime(fadeSec)})의 대부분을 설명합니다 — 러닝 체력 부족보다 스테이션→러닝 전환 능력이 핵심일 가능성이 높습니다.` };
  } else if(explainedRatio!=null && explainedRatio>=0.3){
    diagnosis={ key:"mixed", label:"Station 영향 + Pacing 혼합",
      detail:"측정된 스테이션 저하만으로는 전체 페이스 저하를 다 설명하지 못합니다 — 초반 오버페이스 가능성도 함께 점검해보세요." };
  } else {
    diagnosis={ key:"pacing", label:"Pacing 문제 가능성",
      detail:"스테이션 저하로 설명되는 부분이 적어, 초반 오버페이스 등 페이싱 전략이 원인일 가능성이 있습니다." };
  }
  return { fadeSec, fadePct, explainedSec, explainedRatio, diagnosis, degradation };
}


// per-index recency-weighted trend from hpiHistory: is this index ACTUALLY improving over the
// long term, or just "doing well recently"? (spec explicitly wants these kept separate)
function indexLongTermTrend(key, weeks=8){
  const hist=[...STATE.hpiHistory].sort((a,b)=>a.date.localeCompare(b.date));
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-weeks*7);
  const inWindow=hist.filter(h=>new Date(h.date)>=cutoff && h[key]!=null);
  if(inWindow.length<2) return null;
  const first=inWindow[0][key], last=inWindow[inWindow.length-1][key];
  const wks=Math.max(1,weeksBetween(inWindow[0].date, inWindow[inWindow.length-1].date));
  return (last-first)/wks; // points/week
}

/* ---------------------------------------------------------------------- */
/* 5a-2. V3 — TRAINING PRIORITY ALGORITHM (6-factor, spec §9)              */
/*     Priority = Race Impact × Performance Gap × Trainability × Urgency ×  */
/*     Specificity × Recovery Modifier (each normalized 0..1).              */
/*     Reuses calculateTrainability() and segmentIndexKey() from the        */
/*     Target Gap Decomposition engine (§5) rather than inventing a         */
/*     parallel weighting — Specificity IS literally "what share of the     */
/*     current goal gap does this index's own segments account for".       */
/*     A 90+ index never wins purely on Gap; a low-urgency/low-trainability */
/*     index never wins on a small raw score alone (spec §10).             */
/* ---------------------------------------------------------------------- */
// how many weeks of lead-time this index typically needs to show real adaptation — strength
// endurance is slow to build, skill/technique work is fast, so "urgent" means different things.
const INDEX_ADAPTATION_LEAD_WEEKS = { running:6, engine:5, strengthEnd:8, skill:3, raceExec:2, recovery:1 };

function computeUrgency(key, weeksToRace){
  const lead=INDEX_ADAPTATION_LEAD_WEEKS[key] ?? 4;
  return clamp(1-(weeksToRace-lead)/12, 0.15, 1);
}

// what share of the CURRENT target-gap this index's own segments are responsible for (reuses
// calculateTargetGap()/segmentIndexKey() from §5 — not a second, disconnected weighting scheme).
// Recovery has no segments of its own, so its specificity falls back to overall race relevance.
function computeSpecificity(key, raceImpactNorm){
  if(key==="recovery") return raceImpactNorm;
  const targetGap=calculateTargetGap();
  if(!targetGap || targetGap.alreadyMet) return raceImpactNorm; // no goal set -> fall back to overall race relevance
  const ownShare=targetGap.segments.filter(s=>segmentIndexKey(s)===key).reduce((s,x)=>s+x.allocatedSec,0);
  return clamp(ownShare/Math.max(1,targetGap.totalGapSec), 0, 1);
}

// for the Recovery index ITSELF, rising fatigue should RAISE its priority (it's the thing that
// needs attention); for every other index, rising fatigue caps how hard it should be pushed right
// now regardless of how high its Impact×Gap×Trainability×Urgency product otherwise is (spec §21).
function computeRecoveryModifier(key, fatigue){
  if(key==="recovery") return clamp(fatigue/100, 0.3, 1);
  return clamp(1-(fatigue-50)/100, 0.35, 1);
}

const INDEX_STATIC_TRAINING_HINT = {
  running:    "Threshold Run / Interval + 주간 러닝량 점진적 증가",
  engine:     "SkiErg / Row / Burpee 컨디셔닝 서킷",
  strengthEnd:"Sled Push/Pull + Lunge fatigue-resistance 훈련",
  skill:      "Wall Ball 반복 + 전환(Transition) 동작 드릴",
  recovery:   "훈련 볼륨 조절 + Mobility/Recovery 세션 추가",
  raceExec:   "페이싱 시뮬레이션 + 전환 스피드 드릴",
};
// spec: "목표 기록에 미치는 영향" — reuses the SAME sorted order/scores as computeTrainingPriority()
// (no separate formula), just translated into a 높음/보통/낮음 label by rank so it reads as plain
// language instead of another raw number.
function indexInfluenceLabel(rank){
  if(rank<2) return { label:"높음", color:"var(--red)" };
  if(rank<4) return { label:"보통", color:"var(--amber)" };
  return { label:"낮음", color:"var(--gray-dim)" };
}
// one "현재:" sentence per index, built from score band + the index's own oneLiner — never a separate
// fabricated claim, just the existing description reframed as strong/weak based on the existing score band.
function indexCurrentStatement(key, score){
  const meta=INDEX_META[key], band=indexStatusBand(score);
  if(score==null) return `${meta.oneLiner} — 아직 데이터가 부족해 정확히 평가하기 어렵습니다.`;
  if(band.label==="매우 강점"||band.label==="강점") return `${meta.oneLiner}이 우수한 편이며, 목표 기록에 긍정적으로 기여하고 있습니다.`;
  if(band.label==="양호") return `${meta.oneLiner} 수준이 양호합니다.`;
  return `${meta.oneLiner}이 상대적으로 부족합니다.`;
}
function computeTrainingPriority(){
  const hpiResult=calcHPI();
  const maxWeight=Math.max(...Object.values(INDEX_WEIGHTS));
  const dRace=daysToRace();
  const weeksToRace = dRace!=null ? clamp(dRace/7,0.5,52) : 8; // no race date set -> neutral assumption, same as §5

  const rows=Object.entries(INDEX_WEIGHTS).map(([key,impactWeight])=>{
    const score=hpiResult.indices[key].score;
    const headroom = score!=null ? Math.max(0,100-score) : 50;
    const trend=indexLongTermTrend(key,8);

    const raceImpact=clamp(impactWeight/maxWeight,0,1);
    const performanceGap=clamp(headroom/100,0,1);
    const trainabilityV3=calculateTrainability(key);
    const urgency=computeUrgency(key,weeksToRace);
    const specificity=computeSpecificity(key,raceImpact);
    const recoveryModifier=computeRecoveryModifier(key,hpiResult.fatigue);

    const priorityScore = raceImpact*performanceGap*trainabilityV3*urgency*specificity*recoveryModifier*100;

    return { key, label:INDEX_META[key].label, score, headroom, trend, impactWeight, priorityScore,
      sufficient: score!=null && score>=85,
      v3: { raceImpact, performanceGap, trainability:trainabilityV3, urgency, specificity, recoveryModifier } };
  });
  rows.sort((a,b)=>b.priorityScore-a.priorityScore);
  return rows;
}

/* ---------------------------------------------------------------------- */
/* 5b-2b. STATION-LEVEL PRIORITY — separate from Index priority (spec)     */
/*     "strengthEnd가 낮다" ≠ "Sled가 가장 약하다". HPI Index priority above */
/*     stays as the whole-fitness view; THIS is what decides which actual  */
/*     station gets trained day-to-day, based only on real station records */
/*     vs benchmark — never on which Index the station happens to roll up  */
/*     into. A station with no real record is excluded outright, never     */
/*     guessed at.                                                         */
/* ---------------------------------------------------------------------- */
const STATION_PARENT_INDEX = { ski:"engine", row:"engine", burpee:"engine",
  sledPush:"strengthEnd", sledPull:"strengthEnd", lunge:"strengthEnd", carry:"strengthEnd", wallball:"skill" };
// how quickly each station typically responds to focused training — skill/technique-dominant
// stations (Burpee, Wall Ball) adapt faster than raw strength-endurance stations (Sled, Lunge).
const STATION_TRAINABILITY = { ski:0.75, row:0.75, burpee:0.85, sledPush:0.65, sledPull:0.65, lunge:0.55, carry:0.60, wallball:0.80 };
function computeStationPriority(){
  const meta=getStationDataMeta();
  const b=bench();
  const hpiResult=calcHPI();
  const dRace=daysToRace();
  const weeksToRace = dRace!=null ? clamp(dRace/7,0.5,52) : 8;
  const maxImpact=Math.max(...Object.values(IMPACT_WEIGHTS));
  const ageBand = deriveAgeBand(STATE.profile.age);
  const benchGender = deriveBenchmarkGender();
  const rows=[];
  STATIONS.forEach(s=>{
    const m=meta[s.key];
    if(!m || !m.value) return; // no real record for this station -> excluded, never fabricated
    const actualSec=parseTimeToSec(m.value);
    // Phase 2-2: real Asia/Global Derived Benchmark preferred over the static hardcoded BENCH table,
    // via the fixed fallback chain (queryDerivedBenchmark) — falls through to the exact previous
    // behavior (bench()) whenever nothing is imported yet or no group in the chain has enough sample.
    const derived = queryDerivedBenchmark(STATE.profile.division, benchGender, ageBand, s.key);
    const benchSec = derived ? derived.p50 : b[s.key];
    if(!actualSec || !benchSec) return;
    const gapPct = (actualSec-benchSec)/benchSec; // positive = slower than benchmark
    const performanceGap = clamp(gapPct,0,1.5)/1.5; // only "slower than bench" counts toward priority
    const raceImpact = clamp((IMPACT_WEIGHTS[s.key]||5)/maxImpact,0,1);
    const trainability = STATION_TRAINABILITY[s.key] ?? 0.7;
    const parentIndex = STATION_PARENT_INDEX[s.key];
    const urgency = computeUrgency(parentIndex, weeksToRace);
    const dataConfidence = m.isFresh ? 1.0 : 0.6;
    const recoveryModifier = computeRecoveryModifier(parentIndex, hpiResult.fatigue);
    const priorityScore = performanceGap*raceImpact*trainability*urgency*dataConfidence*recoveryModifier*100;
    rows.push({ key:s.key, label:s.label, actualSec, benchSec, gapPct, priorityScore, isFresh:m.isFresh, ageDays:m.ageDays,
      benchSource: derived ? derived.benchmark_source : "STATIC_FALLBACK",
      benchConfidence: derived ? derived.confidence : "LOW",
      benchSampleN: derived ? derived.sample_n : null });
  });
  rows.sort((a,b2)=>b2.priorityScore-a.priorityScore);
  return rows;
}

/* ---------------------------------------------------------------------- */
/* 5b-4. V3 — PER-RECOMMENDATION "왜 이 훈련인가?" BREAKDOWN (spec §33)     */
/*     Structured 6-point explanation for the single top-fired rule,        */
/*     reusing values already computed elsewhere (Training Priority §9,     */
/*     Target Gap §5, Station-induced Degradation §15) — nothing new is     */
/*     computed just for this display, so it can never drift from the      */
/*     actual reasoning behind the recommendation.                          */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/* 5b-5. V3 — "추천하지 않는 훈련" (spec §32)                               */
/*     Explicit avoid-list: which sessions are NOT recommended right now    */
/*     and why — reusing already-fired safety/fatigue/pain rules and the    */
/*     shouldDeloadNow() decision, rather than inventing a parallel check.  */
/* ---------------------------------------------------------------------- */
const AVOID_RULE_MAP = {
  "FAT-1": "Interval / Simulation / 고강도 전체",
  "RACE-1": "모든 고강도 세션 (Threshold·Interval·WOD·Simulation)",
  "TAP-1": "새로운 자극의 고강도 세션",
  "TAP-2": "Shakeout 외 모든 훈련",
  "INJ-1": "통증 부위 관련 동작",
  "FAT-2": "이번 주 볼륨 증가",
  "FAT-5": "추가 고강도 세션",
};
function buildAvoidList(ruleResult, painR){
  const items=[];
  ruleResult.fired.forEach(r=>{
    const avoid=AVOID_RULE_MAP[r.id];
    if(avoid) items.push({ avoid, reason:r.reasonText, ruleId:r.id, priority:r.priority });
  });
  const deload=shouldDeloadNow();
  if(deload.needed && !items.some(i=>i.ruleId==="FAT-1"||i.ruleId==="RACE-1")){
    items.push({ avoid:"새로운 고강도 세션 추가", reason:deload.reasons.join(" · "), ruleId:"DEL-3", priority:"Medium" });
  }
  if(painR && !items.some(i=>i.ruleId==="INJ-1")){
    items.push({ avoid:`${painR.rawArea} 통증과 겹치는 동작 (${painR.restrict.join(", ")})`, reason:`최근 ${painR.ageDays}일 전 통증 보고`, ruleId:"PAIN", priority:painR.isSevere?"Critical":"High" });
  }
  return items;
}

// Estimates the predicted-time impact of focusing on `indexKey` (spec §2: "이 훈련이 목표 기록에
//어떤 영향을 주는지"). Reuses the existing Target Gap Decomposition (segmentIndexKey/
// calculateSegmentPotential) — sums the Realistic-scenario potential improvement across every
// segment mapped to this index. Returns null (never a fabricated number) when there isn't enough
// data to run that decomposition, e.g. no race data to build a segment model from.
function estimateIndexTrainingImpact(indexKey){
  if(!indexKey) return null;
  let gapAnalysis;
  try{ gapAnalysis = buildSegmentGapAnalysis(); } catch(e){ return null; }
  if(!gapAnalysis || !gapAnalysis.segments || !gapAnalysis.segments.length) return null;
  const related = gapAnalysis.segments.filter(s=>segmentIndexKey(s)===indexKey);
  if(!related.length) return null;
  const realisticSec = related.reduce((sum,s)=>sum+s.realisticSec,0);
  if(!(realisticSec>0)) return null;
  return { realisticSec, segmentCount:related.length };
}

function buildTopRecommendationReasoning(ruleResult){
  const topRule=ruleResult.fired[0];
  if(!topRule) return null;
  const priority=computeTrainingPriority();
  const top=priority[0];
  const dLeft=daysToRace();
  const degradation=computeStationInducedDegradation(latestRace());
  const topDeg=degradation[0];
  const plan=computeGoalPlan();
  const hpiResult=ruleResult.ctx.hpiResult;
  const impact = top ? estimateIndexTrainingImpact(top.key) : null;
  return {
    action: topRule.actionText, reason: topRule.reasonText, ruleId: topRule.id,
    points: [
      { label:"현재 가장 큰 제한 영역", value: top? top.label : "데이터 부족" },
      { label:"Race Impact", value: top? `${Math.round(top.impactWeight*100)}%` : "—" },
      { label:"목표 기록 Gap", value: plan? (plan.totalGapSec>0 ? `-${fmtTime(plan.totalGapSec)}` : "이미 달성") : "목표 미설정" },
      { label:"Station-induced Run Degradation", value: (topDeg && topDeg.degradationSec>0) ? `${topDeg.label} +${round1((topDeg.degradationSec/topDeg.baselineSec)*100)}%` : "유의미한 저하 없음" },
      { label:"대회까지", value: dLeft!=null ? `${dLeft}일` : "미설정" },
      { label:"Recovery", value: hpiResult.fatigue>65 ? "주의 필요" : "양호" },
    ],
    // spec §2: 실제 계산 가능한 경우에만 표시 — 임의 수치 생성 금지
    impact: impact
      ? { label:"이 훈련(관련 구간)의 목표 기록 영향(Realistic 추정)", value:`-${fmtTime(impact.realisticSec)} (${impact.segmentCount}개 구간 합산)` }
      : { label:"이 훈련의 목표 기록 영향", value:"데이터 부족 — 대회 기록/목표 기록 입력 시 계산됩니다" },
  };
}


function buildLimitingFactorNarrative(priority, asArray=false){
  const sufficient=priority.filter(r=>r.sufficient).map(r=>r.label.replace(" Index",""));
  const limiting=priority.filter(r=>!r.sufficient).slice(0,2).map(r=>r.label.replace(" Index",""));
  const parts=[];
  if(sufficient.length) parts.push(`현재 ${sufficient.join("·")}은(는) 목표 기록에 충분한 수준입니다.`);
  if(limiting.length) parts.push(`${limiting.join("·")}이(가) 현재 기록을 가장 크게 제한하고 있어 우선 훈련 대상입니다.`);
  if(!parts.length) parts.push("모든 영역이 고르게 발달되어 있습니다 — 유지 훈련과 레이스 특이성 훈련을 병행하세요.");
  return asArray ? parts : parts.join(" ");
}

/* ---------------------------------------------------------------------- */
/* 5b-3. V3 — SEGMENT GAP ANALYSIS & TARGET GAP DECOMPOSITION              */
/*     "현재 기록이 느리다고 해서 그 차이 전체를 개선 가능하다고 판단하지    */
/*     않는다" (spec §6): each of the 17 segments gets a Conservative /     */
/*     Realistic / Aggressive potential-improvement figure, driven by       */
/*     Trainability (headroom × long-term trend of the related HPI index),  */
/*     time-to-race, and data confidence — NOT a flat % of the raw gap.     */
/*     The Target Gap (current estimate − target time) is then allocated    */
/*     across segments in proportion to each segment's Realistic potential  */
/*     (spec §5: "단순히 모든 segment에 비례 배분하지 말 것" — the weights    */
/*     used ARE segment-specific, not an even split of the raw time gap).   */
/* ---------------------------------------------------------------------- */
// maps a segment to the HPI index that best represents its trainability signal (reuses each
// station's existing `group` field and the existing per-index long-term-trend calculation —
// no separate trainability model/history is invented).
function segmentIndexKey(seg){
  if(seg.type==="run") return "running";
  if(seg.type==="transition") return "raceExec";
  const groupMap={ engine:"engine", strength:"strengthEnd", skill:"skill" };
  return groupMap[STATIONS.find(s=>s.key===seg.key)?.group] || "strengthEnd";
}

// 0..1 — how much room + real momentum this index has to improve through training.
// headroom (100-score) alone would treat "low score, but flat/declining for 8wk" the same as
// "low score, climbing steadily" — trendFactor separates those two very different situations.
function calculateTrainability(indexKey){
  const hpiResult=calcHPI();
  const score=hpiResult.indices[indexKey]?.score;
  const headroom = score!=null ? clamp((100-score)/100,0,1) : 0.5; // no score yet -> assume moderate, not maximal
  const trend=indexLongTermTrend(indexKey,8);
  const trendFactor = trend==null ? 0.85 : clamp(0.6+trend*0.15, 0.4, 1.3); // no trend data -> neutral, not optimistic
  return clamp(headroom*trendFactor, 0.05, 1);
}

// per-segment Conservative / Realistic / Aggressive potential improvement, in seconds, versus
// this segment's own benchmark (not versus an arbitrary elite standard). Modulated by trainability,
// time-to-race (compressed near race day — spec §28), and data confidence (a segment resolved only
// from a benchmark-reference, with zero real measurement, cannot claim a large realistic gain —
// we simply don't know the true current level well enough).
function calculateSegmentPotential(seg, weeksToRace){
  const indexKey=segmentIndexKey(seg);
  const currentSec = seg.sec!=null ? seg.sec : seg.benchmark;
  const hasRealData = seg.sec!=null;
  const gapToBenchSec = Math.max(0, currentSec - seg.benchmark);
  const trainability = calculateTrainability(indexKey);
  const timeFactor = clamp(weeksToRace/12, 0.25, 1); // 12wk+ = full scope; compresses as race nears
  const dataConfidence = hasRealData ? (seg.isFresh?1:0.75) : 0.35;

  const conservativeSec = gapToBenchSec * clamp(0.12*trainability*timeFactor*dataConfidence, 0, 0.6);
  const realisticSec    = gapToBenchSec * clamp(0.30*trainability*timeFactor*dataConfidence, 0, 0.75);
  const aggressiveSec   = gapToBenchSec * clamp(0.50*trainability*timeFactor*dataConfidence, 0, 0.9);

  return { ...seg, indexKey, currentSec, gapToBenchSec, trainability, hasRealData,
    conservativeSec, realisticSec, aggressiveSec,
    confidence: hasRealData ? (seg.isFresh?"high":"medium") : "low" };
}

/* ---------------------------------------------------------------------- */
/* PHASE 5 STEP 1 (revised) — projectSegment(): Index-trend-aware segment    */
/*     projection, SIGN-ONLY (no cross-scale division). APPROVED           */
/*     CONSTRAINTS (verbatim, all satisfied below):                        */
/*     1. Index trend reuses hpiHistory + indexLongTermTrend(key,8) as-is — */
/*        no new data structure.                                           */
/*     2. Index Trainability reuses calculateTrainability(indexKey) as the  */
/*        single source of truth — not recomputed, comes in via            */
/*        calculateSegmentPotential()'s own .trainability field.            */
/*     3. Segment->Index mapping reuses segmentIndexKey()/STATION_PARENT_   */
/*        INDEX (segmentIndexKey internally uses STATIONS[].group, same     */
/*        grouping STATION_PARENT_INDEX encodes elsewhere) — not reinvented.*/
/*     4. Segment potential reuses calculateSegmentPotential() wholesale —  */
/*        conservative/realistic/aggressive/confidence all come from there.*/
/*     5. Realistic potential is a HARD CEILING — projectedImprovementSec   */
/*        never exceeds realisticSec, and never goes below 0.               */
/*     6. Confidence reuses calculateSegmentPotential()'s own .confidence — */
/*        no second, overlapping confidence multiplier introduced here.     */
/*     7. Recovery never appears here: segmentIndexKey() can only return    */
/*        "running"/"raceExec"/"engine"/"strengthEnd"/"skill" — Recovery    */
/*        has no segment of its own in the 17-segment race model, excluded  */
/*        BY CONSTRUCTION, not by a special-case filter here.               */
/*                                                                          */
/*     REVISION: the previous version divided indexLongTermTrend() (a per- */
/*     Index points/week rate) by defaultWeeklyGrowth() (the OVERALL HPI's  */
/*     neutral points/week rate) to build a ratio — those two numbers are   */
/*     on different, uncalibrated scales (one Index's own momentum vs a     */
/*     blended-across-6-indices baseline), so dividing them silently        */
/*     invented an unvalidated scaling constant. Replaced with a SIGN-ONLY  */
/*     rule that needs no cross-metric conversion at all:                   */
/*       trend > 0 (Index genuinely improving)  -> full realisticSec        */
/*       trend < 0 (Index genuinely declining)  -> 0 (no improvement        */
/*         projected — NOT a negative/regression value either, since        */
/*         estimating HOW MUCH it will get worse would need the same kind   */
/*         of unvalidated magnitude constant this revision is removing)     */
/*       trend === 0 or null (flat / no history yet) -> realisticSec * 0.5  */
