<!DOCTYPE html>
<html lang="ko" style="background:#0A0A0B;">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<script>
  // HPS build cache-buster.
  // A new build version forces Safari/GitHub Pages to request this HTML again.
  (function(){
    var HPS_BUILD_VERSION = "20260820-division-fix-01";
    try {
      var url = new URL(window.location.href);
      if (url.searchParams.get("hpsv") !== HPS_BUILD_VERSION) {
        url.searchParams.set("hpsv", HPS_BUILD_VERSION);
        window.location.replace(url.toString());
      }
    } catch (e) {}
  })();

<title>HPS — HYROX Performance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --surface:#141416; --surface2:#1C1C1F; --surface3:#232326;
  --line:#28282C; --orange:#FF5A1F; --orange-dim:#C2450F; --orange-glow:rgba(255,90,31,.16);
  --white:#F5F4F1; --gray:#9497A0; --gray-dim:#5C5E66;
  --green:#33D17A; --red:#FF4D4D; --amber:#FFB020;
  --crit:#FF4D4D; --high:#FF9A3D; --med:#FFB020; --low:#5C8CFF;
  --font-display:'Barlow Condensed',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{margin:0;padding:0;background:var(--bg) !important;color:var(--white);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
::selection{background:var(--orange-glow);}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; min-height:100vh; background:var(--bg);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.brand-mark{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.5px; color:var(--white); display:flex; align-items:center; gap:8px;}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange);}
.brand-sub{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; margin-top:4px; text-transform:uppercase;}
.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-group-label{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1.5px; text-transform:uppercase; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--gray); font-weight:500; transition:background .15s, color .15s; user-select:none;
}
.nav-item:hover{background:var(--surface2); color:var(--white);}
.nav-item.active{background:var(--orange-glow); color:var(--orange); font-weight:600;}
.nav-item .n-ico{width:16px; text-align:center; font-size:13px; opacity:.9;}
.sidebar-foot{padding:14px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--gray-dim); font-family:var(--font-mono); line-height:1.6;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:56px 34px 60px; background:var(--bg);}
.page{display:none; flex-direction:column; gap:18px; max-width:1180px;}
.page.active{display:flex;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:600;}
.eyebrow.gray{color:var(--gray-dim);}
h1.page-title{font-family:var(--font-display); font-size:32px; font-weight:800; margin:2px 0 0; letter-spacing:.3px;}
h2.section-title{font-family:var(--font-display); font-size:22px; font-weight:800; margin:0; letter-spacing:.3px;}
p.lead{font-size:12.5px; color:var(--gray); margin:0; line-height:1.6; max-width:640px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px;}
.card.tight{padding:14px 16px;}
.grid{display:grid; gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11.5px; color:var(--gray); font-weight:600;}
input,select,textarea{
  background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--white);
  padding:9px 10px; font-size:13px; font-family:var(--font-body); outline:none; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange-dim);}
input[type=date]{font-family:var(--font-mono); color-scheme:dark;}
input[type=checkbox]{width:auto;}
textarea{resize:vertical; min-height:60px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; background:var(--orange); color:#100; border:none;
  border-radius:9px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:filter .15s, transform .1s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--surface3); color:var(--white); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--gray); border:1px solid var(--line);}
.btn.danger{background:transparent; color:var(--red); border:1px solid rgba(255,77,77,.35);}
.btn.sm{padding:6px 11px; font-size:11.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; color:var(--gray-dim); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--white);}
tr:last-child td{border-bottom:none;}
td.num, th.num{font-family:var(--font-mono); text-align:right;}

.badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.badge.crit{background:rgba(255,77,77,.14); color:var(--crit);}
.badge.high{background:rgba(255,154,61,.14); color:var(--high);}
.badge.med{background:rgba(255,176,32,.14); color:var(--med);}
.badge.low{background:rgba(92,140,255,.14); color:var(--low);}
.badge.elite{background:rgba(51,209,122,.16); color:var(--green);}
.badge.phase-base{background:rgba(148,151,160,.14); color:var(--gray);}
.badge.phase-build{background:rgba(255,176,32,.14); color:var(--amber);}
.badge.phase-peak{background:var(--orange-glow); color:var(--orange);}
.badge.phase-taper{background:rgba(51,209,122,.14); color:var(--green);}

.bar-track{flex:1; height:6px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.stat-num{font-family:var(--font-mono); font-weight:700;}
.mono{font-family:var(--font-mono);}
.empty-note{font-size:12.5px; color:var(--gray-dim); text-align:center; padding:22px 10px; border:1px dashed var(--line); border-radius:10px;}
.divider{height:1px; background:var(--line); margin:4px 0;}
.hstack{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.chip{font-family:var(--font-mono); font-size:10.5px; padding:4px 9px; border-radius:20px; background:var(--surface2); border:1px solid var(--line); color:var(--gray); cursor:pointer;}
.chip.on{background:var(--orange-glow); color:var(--orange); border-color:transparent;}
.list-remove{cursor:pointer; color:var(--gray-dim); font-size:14px;}
.list-remove:hover{color:var(--red);}
.reason-line{font-size:11.5px; color:var(--gray); font-family:var(--font-mono); line-height:1.6;}
.rule-id{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim);}
::placeholder{color:var(--gray-dim);}

.toast{position:fixed; bottom:20px; right:24px; background:var(--surface3); border:1px solid var(--line); border-left:3px solid var(--orange); padding:11px 16px; border-radius:9px; font-size:12.5px; z-index:999; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;}
.toast.show{opacity:1; transform:translateY(0);}

/* ---------- DATA STATUS / COACH LEVEL / MODAL (no-data-required layer) ---------- */
.status-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:10px;}
.status-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--gray);}
.status-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.status-dot.on{background:var(--green); box-shadow:0 0 6px rgba(51,209,122,.5);}
.status-dot.off{background:var(--gray-dim);}
.coach-level-badge{font-family:var(--font-display); font-weight:700; font-size:13px; padding:4px 12px; border-radius:20px; letter-spacing:.3px;}
.coach-level-badge.basic{background:rgba(92,140,255,.14); color:var(--low);}
.coach-level-badge.personal{background:rgba(255,176,32,.14); color:var(--amber);}
.coach-level-badge.advanced{background:var(--orange-glow); color:var(--orange);}
.pz-bar-track{width:100%; height:7px; border-radius:6px; background:var(--surface3); overflow:hidden; margin-top:8px;}
.pz-bar-fill{height:100%; background:linear-gradient(90deg,var(--orange-dim),var(--orange)); border-radius:6px; transition:width .3s;}
.qbtn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:9px; background:var(--surface2); border:1px solid var(--line); color:var(--white); font-size:12.5px; cursor:pointer; user-select:none; transition:background .15s,border-color .15s;}
.qbtn:hover{border-color:var(--gray-dim);}
.qbtn.on{background:var(--orange-glow); color:var(--orange); border-color:transparent; font-weight:700;}
.qbtn-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); z-index:1010; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .18s;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal-panel{width:100%; max-width:520px; max-height:88vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:20px 20px calc(26px + env(safe-area-inset-bottom)); transform:translateY(16px); transition:transform .18s;}
.modal-overlay.show .modal-panel{transform:translateY(0);}
@media (min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-panel{border-radius:16px; margin-bottom:0;}
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-close{cursor:pointer; color:var(--gray); font-size:18px; line-height:1; padding:4px;}
.modal-step-dots{display:flex; gap:5px; margin-bottom:14px;}
.modal-step-dots span{width:20px; height:3px; border-radius:2px; background:var(--line);}
.modal-step-dots span.done{background:var(--orange);}
.data-tier-note{font-size:11.5px; color:var(--gray); background:var(--surface2); border-radius:8px; padding:9px 11px; margin-top:10px; line-height:1.5;}

/* signature race-strip */
.race-strip{display:flex; gap:2px; align-items:flex-end; height:64px; padding:0 2px;}
.race-strip .seg{flex:1; border-radius:3px 3px 1px 1px; position:relative; min-width:4px; transition:height .3s;}
.race-strip .seg.run{background:linear-gradient(180deg, var(--orange), var(--orange-dim));}
.race-strip .seg.station{background:linear-gradient(180deg,#4B7BFF,#2C4FAD);}
.race-strip-labels{display:flex; gap:2px; margin-top:4px;}
.race-strip-labels span{flex:1; text-align:center; font-family:var(--font-mono); font-size:8px; color:var(--gray-dim); min-width:4px;}

.step-chain{display:flex; flex-direction:column; gap:0;}
.step-item{display:flex; gap:12px; padding:10px 0;}
.step-item .step-num{width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--orange); flex-shrink:0;}
.step-item .step-line{width:1px; background:var(--line); flex:1; margin:0 auto;}
.step-conn{display:flex; flex-direction:column; align-items:center; width:22px; flex-shrink:0;}
.step-conn .ln{width:1px; flex:1; background:var(--line); min-height:10px;}
.step-body{padding-top:1px;}
.step-q{font-size:11.5px; color:var(--gray-dim); text-transform:uppercase; letter-spacing:.5px; font-family:var(--font-mono);}
.step-a{font-size:13px; color:var(--white); margin-top:2px; font-weight:600;}
.step-conclusion{margin-top:6px; padding:12px 14px; background:var(--orange-glow); border-radius:10px; border-left:3px solid var(--orange);}
.step-conclusion .lbl{font-family:var(--font-mono); font-size:10px; color:var(--orange); letter-spacing:1px; text-transform:uppercase;}
.step-conclusion .val{font-size:14px; font-weight:700; margin-top:3px;}

.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
.day-card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:12px 10px; min-height:120px; display:flex; flex-direction:column; gap:6px;}
.day-card .d-name{font-family:var(--font-mono); font-size:10px; color:var(--gray-dim); letter-spacing:1px;}
.day-card .d-type{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.1;}
.day-card .d-desc{font-size:10.5px; color:var(--gray); line-height:1.4; flex:1;}
.day-card .d-meta{font-family:var(--font-mono); font-size:9.5px; color:var(--gray-dim);}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr);}}

.roadmap-track{position:relative; padding-left:2px;}
.phase-block{display:flex; gap:0; margin-bottom:2px; border-radius:8px; overflow:hidden;}
.phase-seg{padding:14px; position:relative;}
.tabs{display:flex; gap:4px; background:var(--surface2); padding:4px; border-radius:10px; width:fit-content; max-width:100%; flex-wrap:wrap;}
.tab{padding:7px 14px; border-radius:7px; font-size:12px; font-weight:600; color:var(--gray); cursor:pointer; white-space:nowrap;}
.tab.active{background:var(--orange); color:#100;}

.kv{display:flex; justify-content:space-between; font-size:12px; padding:5px 0; border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--gray-dim);}
.kv .v{font-family:var(--font-mono); font-weight:600;}

.mobile-menu-btn{display:none;}
.sidebar-overlay{display:none;}
.account-badge{
  position:fixed; top:14px; right:14px; z-index:1001;
  display:flex; align-items:center; gap:6px;
  background:var(--surface2); border:1px solid var(--line); border-radius:20px;
  padding:8px 14px; font-size:12px; font-weight:600; color:var(--white); cursor:pointer;
  transition:filter .15s;
}
.account-badge:hover{ filter:brightness(1.15); }
.account-badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--gray-dim); }
.account-badge.signed-in .dot{ background:var(--green); box-shadow:0 0 6px var(--green); }

@media(max-width:820px){
  #app{flex-direction:column;}
  .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:14px; left:14px; z-index:1001;
    width:40px; height:40px; border-radius:9px;
    background:var(--surface2); border:1px solid var(--line); color:var(--white);
    font-size:18px; cursor:pointer;
  }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:250px; max-width:82vw;
    flex-direction:column; overflow-y:auto; z-index:1000;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-overlay{
    display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .sidebar-overlay.show{ opacity:1; pointer-events:auto; }
  .nav{flex-direction:column; overflow-x:visible;}
  .nav-group-label{display:block;}
  .main{padding:64px 18px 92px;}
  /* iOS Safari auto-zooms the whole page when a focused input's font-size is under 16px — this is
     what caused "입력하면 화면이 확대되는" behavior. 16px here (vs 13px on desktop) stops that. */
  input,select,textarea{font-size:16px;}
  .bottom-nav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:1002;
    background:var(--surface); border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(0,0,0,.35);
  }
  .bottom-nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 4px; border-radius:10px; cursor:pointer; user-select:none;
    color:var(--gray-dim); font-family:var(--font-mono); font-size:10.5px; font-weight:600;
  }
  .bottom-nav-item .bn-ico{font-size:19px; line-height:1;}
  .bottom-nav-item.active{ color:var(--orange); }
  .bottom-nav-item.active .bn-ico{ filter:drop-shadow(0 0 6px var(--orange-glow)); }
}
@media(min-width:821px){ .bottom-nav{display:none;} }
@media(max-width:480px){
  .grid-2,.grid-3,.grid-4,.grid-6,.grid-auto{grid-template-columns:1fr;}
  input[type=date]{font-size:13px;}
}
input,select,textarea{min-width:0;}
</style>

<body style="background:#0A0A0B; margin:0;">
<div id="app">
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">☰</button>
  <div class="account-badge" id="account-badge"></div>

<script>
/* ============================================================
   HPS — HYROX Performance System
   Rule-based training engine. No AI calls. Pure deterministic JS.
   ============================================================ */

/* ---------------------------------------------------------------------- */
/* 0. CONSTANTS & REFERENCE DATA                                          */
/* ---------------------------------------------------------------------- */
const STATIONS = [
  { key:"ski",      label:"SkiErg",             unit:"1000m",  group:"engine" },
  { key:"sledPush",  label:"Sled Push",          unit:"50m",    group:"strength" },
  { key:"sledPull",  label:"Sled Pull",          unit:"50m",    group:"strength" },
  { key:"burpee",    label:"Burpee Broad Jump",  unit:"80m",    group:"engine" },
  { key:"row",       label:"Row",                unit:"1000m",  group:"engine" },
  { key:"carry",     label:"Farmer Carry",       unit:"200m",   group:"skill" },
  { key:"lunge",     label:"Sandbag Lunge",      unit:"100m",   group:"strength" },
  { key:"wallball",  label:"Wall Ball",          unit:"100reps",group:"skill" },
];
const RUN_KEYS = [1,2,3,4,5,6,7,8];
const DIVISIONS = ["Open","Pro","Open Doubles","Mixed Doubles","Pro Doubles"];

// Illustrative reference benchmark seconds per division (used only to normalize scores 0-100).
// Doubles: runs are completed together at ~unchanged individual pace, while station reps are
// split between partners. Public race-data analyses report doubles teams finishing ~22% faster
// overall than singles; since running is shared unchanged, that saving is concentrated in the
// station legs — solving for that split implies a ~0.46x station-time factor (worked out against
// this table's own Open row, not a literal population average). Mixed Doubles is commonly reported
// as ~5-10% slower than same-sex doubles pairs, so ~7% is applied on top of Open Doubles.

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round1=(v)=>Math.round(v*10)/10;

function fmtTime(totalSec){
  if(totalSec==null||isNaN(totalSec))return "--:--";
  totalSec=Math.round(totalSec);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function parseTimeToSec(str){
  if(str===undefined||str===null||str==="")return null;
  const parts=String(str).split(":").map(Number);
  if(parts.some((p)=>isNaN(p)))return null;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  return Number(parts[0]);
}
function fmtPace(secPerKm){
  if(secPerKm==null||isNaN(secPerKm))return "--:--/km";
  return fmtTime(secPerKm)+"/km";
}
// lower-is-better normalization: score = (benchmark/actual)*100, capped [0,100]
function scoreLowerBetter(actual, benchmark){
  if(!actual||actual<=0||!benchmark)return null;
  return clamp((benchmark/actual)*100,0,100);
}
// higher-is-better normalization: score = (actual/target)*100, capped [0,100]
function scoreHigherBetter(actual, target){
  if(actual==null||!target)return null;
  return clamp((actual/target)*100,0,100);
}
function weightedAvg(pairs){ // [[score,weight], ...] ignoring nulls, renormalizing weights
  const valid=pairs.filter(p=>p[0]!=null && !isNaN(p[0]));
  if(!valid.length)return null;
  const wsum=valid.reduce((s,p)=>s+p[1],0);
  return valid.reduce((s,p)=>s+p[0]*p[1],0)/wsum;
}
function mean(arr){ arr=arr.filter(v=>v!=null&&!isNaN(v)); return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
// linear-interpolation percentile (0..1), used by the event-based Podium benchmark below — a single
// very fast/slow event never dominates since it's one data point among many events, not a raw row.
function percentileOf(arr, p){
  const a=arr.filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y);
  if(!a.length) return null;
  if(a.length===1) return a[0];
  const idx=(a.length-1)*p;
  const lo=Math.floor(idx), hi=Math.ceil(idx);
  if(lo===hi) return a[lo];
  return a[lo] + (a[hi]-a[lo])*(idx-lo);
}
function medianOf(arr){ return percentileOf(arr, 0.5); }
function stdev(arr){
  arr=arr.filter(v=>v!=null&&!isNaN(v));
  if(arr.length<2)return 0;
  const m=mean(arr); return Math.sqrt(mean(arr.map(v=>(v-m)**2)));
}
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 2. STORAGE (persistent, artifact-safe: window.storage w/ in-memory fallback) */
/* ---------------------------------------------------------------------- */
const MEM_FALLBACK = {};
let storageWarned = false;
const StorageService = {
  async get(key, fallback){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){ /* key not found or storage unavailable */ }
    return key in MEM_FALLBACK ? MEM_FALLBACK[key] : fallback;
  },
  async set(key, value){
    MEM_FALLBACK[key]=value;
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(key, JSON.stringify(value), false);
      }
    }catch(e){
      // transient platform-side hiccup — MEM_FALLBACK above already keeps data intact for this session,
      // so this is non-fatal. Log once rather than spamming on every keystroke's debounced autosave.
      if(!storageWarned){ console.warn("자동저장에 일시적 문제가 있습니다 (세션 내 데이터는 유지됩니다):", e?.message||e); storageWarned=true; }
    }
  }
};

async function initSupabaseAuth(){
  if(!sbEnabled() || !window.supabase || !window.supabase.createClient) return;
  // persistSession (default true) is what makes "already logged in on this device" work automatically —
  // Supabase stores the session in localStorage and getSession() below restores it on the next page load.
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, storage: window.localStorage }
  });
  sbStatus = "signedOut";
  sb.auth.onAuthStateChange(async (event, session)=>{
    sbUser = session?.user || null;
    sbStatus = sbUser ? "signedIn" : "signedOut";
    if(sbUser && event==="SIGNED_IN") await pullFromSupabase();
    
    renderAll();
  });
  let { data, error } = await sb.auth.getSession();
  // bug fix (mobile "다시 들어가면 로그인 풀림"): a stored session whose short-lived ACCESS token has
  // expired should be silently refreshed using the long-lived REFRESH token — getSession() is supposed
  // to do this automatically, but on some mobile reloads (e.g. right after the OS resurrects a
  // previously-suspended/backgrounded tab) it can race and come back empty even though a valid refresh
  // token still exists in localStorage. Explicitly retry with refreshSession() once before concluding
  // the person is actually logged out, instead of dropping them to the login screen on a false negative.
  if(!data?.session){
    try{
      const refreshed = await sb.auth.refreshSession();
      if(refreshed?.data?.session) data = refreshed.data;
    }catch(e){ /* genuinely no valid session (real logout / revoked / never logged in) — fall through */ }
  }
  sbUser = data?.session?.user || null;
  sbStatus = sbUser ? "signedIn" : "signedOut";
  if(sbUser) await pullFromSupabase(); // same-device return visit: session restored, pull latest cloud data
  
}

  // requires "Confirm email" OFF in the Supabase dashboard (see setup notes above) — otherwise

async function pullFromSupabase(){
  if(!sb || !sbUser) return;
  sbStatus="syncing";
  try{
    const { data, error } = await sb.from("user_data").select("state").eq("user_id", sbUser.id).maybeSingle();
    if(!error && data && data.state){
      STATE = Object.assign(defaultState(), data.state);
      for(const k of ["profile","running","hr","strength","settings"]) STATE[k]=Object.assign(defaultState()[k], data.state[k]||{});
      showToast("클라우드에서 데이터를 불러왔습니다");
    } else if(!error && !data){
      await pushToSupabase(); // first login: seed cloud with current local state
    }
  }catch(e){ console.warn("supabase pull failed", e); }
  sbStatus="signedIn";
}
async function pushToSupabase(){
  if(!sb || !sbUser) return;
  try{ await sb.from("user_data").upsert({ user_id: sbUser.id, state: STATE, updated_at: new Date().toISOString() }); }
  catch(e){ console.warn("supabase push failed", e); }
}

// over an empty array, so `out`/candidate list is byte-identical to the pre-existing behavior.

  }).forEach(r=>{ const v=r.stations&&r.stations[key]; if(v) out.push({date:r.date, value:v, source:"race"}); });

  // 아예 배제했다 — 21일 이내 공식 기록이 있다는 이유만으로 그보다 더 최근의 좋은 Simulation 신호가

  // 쪽을 자연스럽게 선택하도록 한다 — 공식 기록을 무시하는 것도 아니고(더 최근이면 그대로 이김),

// average running pace (sec/km) from the unified training log within ±windowDays of centerDate
function avgRunPaceNear(centerDate, windowDays=10){
  const center=new Date(centerDate);
  const start=new Date(center); start.setDate(start.getDate()-windowDays);
  const end=new Date(center); end.setDate(end.getDate()+windowDays);
  const logs=STATE.trainingLog.filter(l=>isRunType(l.type)&&l.avgPaceSecKm && new Date(l.date)>=start && new Date(l.date)<=end);
  return logs.length? mean(logs.map(l=>Number(l.avgPaceSecKm))) : null;
}
// count of "strength"-type unified training log sessions within ±windowDays of centerDate (volume proxy)
function strengthSessionsNear(centerDate, windowDays=21){
  const center=new Date(centerDate);
  const start=new Date(center); start.setDate(start.getDate()-windowDays);
  const end=new Date(center); end.setDate(end.getDate()+windowDays);
  return STATE.trainingLog.filter(l=>l.type==="strength" && new Date(l.date)>=start && new Date(l.date)<=end).length;
}

//  - strength/grip stations get a much smaller capped ±2% nudge from strength-session volume change
//  - both require real training-log evidence on both sides; nothing is ever assumed without data
// spec §1 (Quick Calibration Test): a short isolated test — matched to the EXACT official HYROX
// distance for each station (1000m Ski/Row, 50m Sled Push/Pull, 80m Burpee) plus 1km Run TT (also
// the exact distance of one HYROX run leg) — so results feed directly into the real data pipeline
// (stationTests / trainingLog) without any invented conversion factor. Each test raises confidence

const QUICK_TEST_OPTIONS = [
  { key:"run1km", label:"1km Run TT", unit:"1km", isRunning:true },
  { key:"ski", label:"SkiErg 1000m", unit:"1000m" },
  { key:"row", label:"Row 1000m", unit:"1000m" },
  { key:"sledPush", label:"Sled Push", unit:"50m" },
  { key:"sledPull", label:"Sled Pull", unit:"50m" },
  { key:"burpee", label:"Burpee Broad Jump", unit:"80m" },
  { key:"carry", label:"Farmers Carry", unit:"200m" },
  { key:"lunge", label:"Sandbag Lunge", unit:"100m" },
  { key:"wallball", label:"Wall Ball", unit:"100reps" },

function getStationDataMeta(){
  const meta={};
  STATIONS.forEach(s=>{
    const candidates=collectStationCandidates(s.key);
    if(!candidates.length){ meta[s.key]=null; return; }
    const top=candidates[0];
    const ageDays=daysBetween(top.date, todayISO());
    const isFresh=ageDays<=STATION_STALE_DAYS;
    let valueStr=top.value, adjusted=false, adjustPct=0;
    if(!isFresh && ENGINE_STATIONS_ADJUSTABLE.includes(s.key)){
      const oldPace=avgRunPaceNear(top.date,10), recentPace=avgRunPaceNear(todayISO(),10);
      if(oldPace && recentPace){
        adjustPct = clamp((oldPace-recentPace)/oldPace, -MAX_STALE_ADJUST_PCT, MAX_STALE_ADJUST_PCT);
        if(Math.abs(adjustPct)>0.002){
          const sec=parseTimeToSec(top.value);
          if(sec){ valueStr=fmtTime(sec*(1-adjustPct)); adjusted=true; }
        }
      }
    } else if(!isFresh && STRENGTH_STATIONS_ADJUSTABLE.includes(s.key)){
      const oldVol=strengthSessionsNear(top.date,21), recentVol=strengthSessionsNear(todayISO(),21);
      if(recentVol>=MIN_STRENGTH_SESSIONS_FOR_SIGNAL || oldVol>=MIN_STRENGTH_SESSIONS_FOR_SIGNAL){
        const denom=Math.max(oldVol,MIN_STRENGTH_SESSIONS_FOR_SIGNAL);
        adjustPct = clamp((recentVol-oldVol)/denom, -1, 1) * MAX_STRENGTH_STALE_ADJUST_PCT;
        if(Math.abs(adjustPct)>0.002){
          const sec=parseTimeToSec(top.value);
          if(sec){ valueStr=fmtTime(sec*(1-adjustPct)); adjusted=true; }
        }
      }
    }
    meta[s.key]={ value:valueStr, rawValue:top.value, date:top.date, ageDays, isFresh, source:top.source, adjusted, adjustPct };
  });
  return meta;
}
function latestStationValues(){
  const meta=getStationDataMeta();
  const out={};
  STATIONS.forEach(s=>{ out[s.key]= meta[s.key]? meta[s.key].value : undefined; });

}
function isRunType(t){ return t==="run"||t==="interval"||t==="long"||t==="tt"; }

// hilly run's "true" running-ability signal is more accurately reflected by GAP than by raw pace when
// both exist. Preferred whenever present; falls back to raw pace otherwise. Never a separate scoring
// bonus on its own — this only decides WHICH pace value represents a given session more accurately.
function effectivePaceSecKm(entry){
  return (entry.avgGapSecKm!=null && entry.avgGapSecKm>0) ? entry.avgGapSecKm : entry.avgPaceSecKm;
}
// average pace (sec/km) across recent trainingLog running entries that actually have a computed
// avgPaceSecKm (i.e. both distance AND duration were captured) — used as a Tier-2 fallback/supplement
// signal for Running Index so day-to-day logged runs (quick log, manual, CSV/Apple) can move the score,
// not only official race splits or PB fields.
// kind param (spec): "interval" pulls the structured Interval Work Pace (rep pace only, recovery
// excluded) from interval-type entries specifically. Any other/no kind EXCLUDES interval-type entries
// entirely — an interval session's overall avgPaceSecKm blends work+recovery and isn't a genuine
// easy/tempo/long/threshold effort, so it must not distort those pace estimates (spec: "인터벌 기록이
// 일반 러닝 평균 페이스 때문에 Running Index를 왜곡하지 않도록").
function recentRunPaceAvg(days=21, kind=null){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  if(kind==="interval"){
    const logs=STATE.trainingLog.filter(l=>l.type==="interval" && l.intervalWorkPaceSecKm && new Date(l.date)>=cutoff);
    return logs.length? mean(logs.map(l=>Number(l.intervalWorkPaceSecKm))) : null;
  }
  const logs=STATE.trainingLog.filter(l=>isRunType(l.type) && l.type!=="interval" && effectivePaceSecKm(l) && new Date(l.date)>=cutoff);

// HR-efficiency trend (spec §3/§6): "동일/유사 페이스에서 HR이 낮아지는 추세는 긍정적 적응 신호".
// Uses non-interval run entries carrying BOTH avgHr and a usable pace (GAP preferred — spec: GAP-based
// and raw-pace entries aren't literally mixed here, each entry just uses its OWN best available pace
// signal, which is what makes different-terrain runs actually comparable in the first place), splits
// the recent window into an earlier and later half chronologically, and compares an efficiency factor
// (speed per heartbeat) between them. Requires >=6 paired samples before returning anything — a
// handful of noisy days shouldn't read as an aerobic-adaptation trend either way.
function computeHrEfficiencyTrend(days=42){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  const logs=STATE.trainingLog.filter(l=>isRunType(l.type)&&l.type!=="interval"&&l.avgHr&&effectivePaceSecKm(l)&&new Date(l.date)>=cutoff)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length<6) return null;
  const mid=Math.floor(logs.length/2);
  const effOf=l=>(60/Number(effectivePaceSecKm(l)))/Number(l.avgHr); // km/min per bpm — higher is more efficient
  const earlierEff=mean(logs.slice(0,mid).map(effOf)), laterEff=mean(logs.slice(mid).map(effOf));
  if(!earlierEff || !laterEff) return null;
  const pctChange=((laterEff-earlierEff)/earlierEff)*100;
  return { earlierEff, laterEff, pctChange, sampleSize:logs.length };
}
// weekly running-distance series from the unified training log, most-recent week first,
// including weeks with 0km so genuine gaps are reflected (not skipped).
function weeklyKmSeries(weeksBack=8){
  const out=[];
  for(let i=0;i<weeksBack;i++){
    const end=new Date(); end.setDate(end.getDate()-7*i);
    const start=new Date(end); start.setDate(start.getDate()-7);
    out.push(STATE.trainingLog.filter(l=>{ const d=new Date(l.date); return d>start && d<=end && isRunType(l.type); })
      .reduce((s,l)=>s+(Number(l.distanceKm)||0),0));
  }
  return out;
}

/* 4a-2. BODY METRICS HISTORY (spec: 날짜별 체중/체지방률/골격근량 기록)      */
/*     One entry per measurement date, upserted (never duplicated) —        */
/*     latest values mirror into profile.weight/bodyFat/skeletalMuscle so   */
/*     existing consumers of those fields (grip-strength ratio, data-       */
/*     completeness score, etc.) keep working unchanged.                    */
/* ---------------------------------------------------------------------- */
function sortedBodyMetrics(){ return [...STATE.bodyMetricsHistory].sort((a,b)=>a.date.localeCompare(b.date)); }
function latestBodyMetric(){ const s=sortedBodyMetrics(); return s.length? s[s.length-1] : null; }
// adds a new dated record, or updates the existing record for that exact date (spec §6: never a
// duplicate for the same date). After saving, re-syncs profile.weight/bodyFat/skeletalMuscle to
// whichever record is now chronologically latest (handles out-of-order entry/edits correctly).
function upsertBodyMetric({ date, weight, bodyFat, muscleMass }){
  if(!date) return;
  const idx=STATE.bodyMetricsHistory.findIndex(m=>m.date===date);
  const rec={ id: idx>=0?STATE.bodyMetricsHistory[idx].id:uid(), date,
    weight: weight!=null && weight!=="" ? Number(weight) : null,
    bodyFat: bodyFat!=null && bodyFat!=="" ? Number(bodyFat) : null,
    muscleMass: muscleMass!=null && muscleMass!=="" ? Number(muscleMass) : null };

function deleteBodyMetric(id){

function syncProfileToLatestBodyMetric(){
  const latest=latestBodyMetric();
  if(!latest) return;
  if(latest.weight!=null) STATE.profile.weight=String(latest.weight);
  if(latest.bodyFat!=null) STATE.profile.bodyFat=String(latest.bodyFat);
  if(latest.muscleMass!=null) STATE.profile.skeletalMuscle=String(latest.muscleMass);

// change over the last N days: latest value vs the closest record at-or-before (today - days).
// Returns null when there isn't an earlier comparison point yet — never fabricated.
function bodyMetricChange(field, days=30){
  const s=sortedBodyMetrics().filter(m=>m[field]!=null);
  if(s.length<2) return null;
  const latest=s[s.length-1];
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  const earlierCandidates=s.filter(m=>m.date<=cutoffStr);
  const compare = earlierCandidates.length? earlierCandidates[earlierCandidates.length-1] : s[0];
  if(compare.id===latest.id) return null;

function bodyMetricsInRange(field, rangeKey){

  const s=sortedBodyMetrics().filter(m=>m[field]!=null);
  if(days==null) return s;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  return s.filter(m=>new Date(m.date)>=cutoff);
}

function recentMileageAvg(weeks=8){

  sensitive:{ label:"민감", desc:"최근 훈련 변화에 더 빠르게 반응합니다." },
};
function currentEmaAlpha(){ return SENSITIVITY_ALPHA[STATE.settings.predictionSensitivity] ?? SENSITIVITY_ALPHA.recommended; }
function readEma(key, rawValue){
  const s = STATE.emaState || {};
  if(rawValue==null) return s[key]!=null ? s[key] : null; // no fresh signal -> hold last smoothed value if any
  return s[key]!=null ? s[key] : rawValue; // first-ever observation: no history to smooth against yet
}
function commitEma(key, rawValue){
  if(rawValue==null) return;
  if(!STATE.emaState) STATE.emaState={};
  const prev=STATE.emaState[key];
  const alpha=currentEmaAlpha();
  STATE.emaState[key] = (prev==null) ? rawValue : prev*(1-alpha)+rawValue*alpha;
}
// recomputes the raw Tier-2 sub-scores fresh and folds them into their EMA trails. Called only at
// genuine new-data-entry events (recordHpiSnapshot), never on every render, so the smoothing reflects
// real observations over time rather than re-converging on every page view.
function commitTrainingTrendEma(){
  const b=bench();
  const avgKm=recentMileageAvg(8);
  commitEma("runningMileage", avgKm!=null? scoreHigherBetter(avgKm, b.weeklyKm) : null);
  const race=latestRace();
  let rawFade=null;
  if(race){ const r1=parseTimeToSec(race.runs?.[1]), r8=parseTimeToSec(race.runs?.[8]);
    if(r1&&r8){ const fadePct=((r8-r1)/r1)*100; rawFade=clamp(100-Math.max(0,fadePct)*4,0,100); } }
  commitEma("runningFade", rawFade);
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  commitEma("engineDrift", driftVals.length? clamp(100-(mean(driftVals)-b.hrDrift)*8,0,100) : null);
  const recDropVals=hrLogs.map(h=>Number(h.recoveryDrop)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  commitEma("engineRec", recDropVals.length? scoreHigherBetter(mean(recDropVals), b.hrRecoveryDrop) : null);
  // interval work pace (spec) — same raw-score formula as calcRunningIndex's 3c, committed here so it
  // actually gets EMA-smoothed like the other Tier-2 signals above (a single interval session should
  // move Running Index gradually, not all at once).
  const recentIntervalPace=recentRunPaceAvg(21,"interval");
  commitEma("intervalWorkPace", recentIntervalPace!=null ? scoreLowerBetter(recentIntervalPace, b.runKm*0.90) : null);
  // resting HR trend (spec §1/§6) — same formula as calcRecoveryIndex, committed here for EMA smoothing.
  const hrTrend=restingHrTrend();
  commitEma("recoveryRestingHr", hrTrend ? clamp(100-Math.max(0,hrTrend.deltaBpm)*7,0,100) : null);
  // HR efficiency trend (spec §3) — same formula as calcRunningIndex's HR-efficiency sub-score,
  // committed here for EMA smoothing.
  const hrEff=computeHrEfficiencyTrend();
  commitEma("hrEfficiency", hrEff ? clamp(50+hrEff.pctChange*4,0,100) : null);
  // Training Load trend (spec §9) — same formula as calcRecoveryIndex, committed here for EMA smoothing.
  const loadTrend=computeTrainingLoadTrend();
  commitEma("recoveryTrainingLoad", loadTrend ? clamp(100-Math.max(0,loadTrend.ratio-1.0)*60,0,100) : null);
}

// ---- Running Index ----
function calcRunningIndex(tier1Only=false){
  const b=bench(); const race=latestRace();
  const detail=[];
  // 1) race-pace score: avg run split vs benchmark per-km pace
  let racePaceScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length){
      const avgSplit=mean(runsSec);
      racePaceScore=scoreLowerBetter(avgSplit, b.runKm);
      detail.push(`최근 대회 평균 러닝 스플릿 ${fmtTime(avgSplit)}/km vs 기준 ${fmtTime(b.runKm)}/km`);
    }
  }
  if(racePaceScore==null && STATE.running.thresholdPace){
    const th=parseTimeToSec(STATE.running.thresholdPace);
    racePaceScore=scoreLowerBetter(th, b.runKm*0.92);
    detail.push(`대회 기록 없음 → Threshold Pace ${fmtTime(th)}/km 로 대체 추정`);
  }
  // 2) PB score — best available PB normalized to a 1km-equivalent pace vs benchmark
  let pbScore=null;
  const pb5=parseTimeToSec(STATE.running.pb5k), pb10=parseTimeToSec(STATE.running.pb10k), pbH=parseTimeToSec(STATE.running.pbHalf);
  const pacesFromPb=[];
  if(pb5) pacesFromPb.push(pb5/5);
  if(pb10) pacesFromPb.push(pb10/10);
  if(pbH) pacesFromPb.push(pbH/21.0975);
  if(pacesFromPb.length){ pbScore=scoreLowerBetter(Math.min(...pacesFromPb), b.runKm*0.85); detail.push(`최고 PB 페이스 ${fmtTime(Math.min(...pacesFromPb))}/km`); }
  // 3) weekly mileage adequacy — Tier 2 (training-trend), EMA-smoothed so one big/small week doesn't swing it
  const avgKm=recentMileageAvg(8);
  const rawMileageScore= avgKm!=null ? scoreHigherBetter(avgKm, b.weeklyKm) : null;
  const mileageScore = tier1Only ? null : readEma("runningMileage", rawMileageScore);
  if(avgKm!=null) detail.push(`최근 8주 평균 주간거리 ${round1(avgKm)}km vs 목표 ${b.weeklyKm}km${tier1Only?"":" (EMA 스무딩 적용)"}`);
  // 3b) recent logged-run pace — Tier 2, EMA-smoothed. Lets day-to-day training-log entries (quick log,
  // manual, CSV/Apple) that carry both distance+duration influence Running Index directly, not only
  // official race splits/PB — most useful precisely when race data is stale, sparse, or missing.
  // Interval-type entries are EXCLUDED here (spec) — their overall session pace blends work+recovery
  // and isn't a genuine easy/tempo/long/threshold effort; interval capability is scored separately below.
  const recentPace=recentRunPaceAvg(21);
  const rawRecentPaceScore = recentPace!=null ? scoreLowerBetter(recentPace, b.runKm) : null;
  const recentPaceScore = tier1Only ? null : readEma("recentRunPace", rawRecentPaceScore);
  if(recentPace!=null) detail.push(`최근 3주 훈련 기록 러닝 평균 페이스(인터벌 제외) ${fmtTime(recentPace)}/km vs 기준 ${fmtTime(b.runKm)}/km (일일 운동기록 기반)`);
  // 3c) interval work pace — Tier 2, EMA-smoothed, separate signal from 3b. Uses the structured
  // Interval Work Pace (rep-only, recovery excluded) so a genuinely fast interval session properly
  // credits Running Index instead of being diluted/hidden inside the general recent-pace average.
  // Null (no weight applied, weightedAvg renormalizes) for anyone without structured interval logs —
  // never fabricated, never required.
  const recentIntervalPace=recentRunPaceAvg(21,"interval");
  const rawIntervalPaceScore = recentIntervalPace!=null ? scoreLowerBetter(recentIntervalPace, b.runKm*0.90) : null;
  const intervalPaceScore = tier1Only ? null : readEma("intervalWorkPace", rawIntervalPaceScore);
  if(recentIntervalPace!=null) detail.push(`최근 3주 Interval Work Pace ${fmtTime(recentIntervalPace)}/km vs 기준 ${fmtTime(b.runKm*0.90)}/km (반복 구간만, 회복 제외)`);
  // 3d) HR efficiency trend — Tier 2, EMA-smoothed (spec §3). Same pace, lower HR over time = positive
  // aerobic adaptation signal. Neutral baseline 50 when no trend data; null (no data) when <6 paired
  // HR+pace samples exist, which weightedAvg renormalizes away entirely.
  const hrEffTrend=computeHrEfficiencyTrend();
  const rawHrEfficiencyScore = hrEffTrend ? clamp(50+hrEffTrend.pctChange*4,0,100) : null;
  const hrEfficiencyScore = tier1Only ? null : readEma("hrEfficiency", rawHrEfficiencyScore);
  if(hrEffTrend) detail.push(`동일 페이스대 심박 효율 추세 ${hrEffTrend.pctChange>=0?"+":""}${round1(hrEffTrend.pctChange)}% (표본 ${hrEffTrend.sampleSize}건, EMA 스무딩 적용)`);
  // 4) pacing fade (run1 vs run8) — Tier 2, EMA-smoothed
  let rawFadeScore=null;
  if(race){
    const r1=parseTimeToSec(race.runs?.[1]), r8=parseTimeToSec(race.runs?.[8]);
    if(r1&&r8){ const fadePct=((r8-r1)/r1)*100; rawFadeScore=clamp(100-Math.max(0,fadePct)*4,0,100); detail.push(`Run1→Run8 페이스 저하 ${round1(fadePct)}%`); }
  }
  const fadeScore = tier1Only ? null : readEma("runningFade", rawFadeScore);
  const score = weightedAvg([[racePaceScore,0.30],[pbScore,0.15],[recentPaceScore,0.15],[mileageScore,0.12],[fadeScore,0.08],[intervalPaceScore,0.10],[hrEfficiencyScore,0.10]]);
  return { score, detail, sub:{racePaceScore,pbScore,recentPaceScore,mileageScore,fadeScore,intervalPaceScore,hrEfficiencyScore} };
}

// ---- Engine Index ----
function calcEngineIndex(tier1Only=false){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const skiSec=parseTimeToSec(st.ski), rowSec=parseTimeToSec(st.row), burpeeSec=parseTimeToSec(st.burpee);
  const skiRowScore = weightedAvg([[scoreLowerBetter(skiSec,b.ski),0.5],[scoreLowerBetter(rowSec,b.row),0.5]]);
  if(skiSec) detail.push(`SkiErg ${fmtTime(skiSec)} vs 기준 ${fmtTime(b.ski)}`);
  if(rowSec) detail.push(`Row ${fmtTime(rowSec)} vs 기준 ${fmtTime(b.row)}`);
  const burpeeScore = scoreLowerBetter(burpeeSec,b.burpee);
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const rawDriftScore = driftVals.length ? clamp(100-(mean(driftVals)-b.hrDrift)*8,0,100) : null;
  const driftScore = tier1Only ? null : readEma("engineDrift", rawDriftScore);
  if(driftVals.length) detail.push(`최근 훈련기록 평균 HR Drift ${round1(mean(driftVals))}% vs 기준 ${b.hrDrift}%${tier1Only?"":" (EMA 스무딩 적용)"}`);
  const recDropVals=hrLogs.map(h=>Number(h.recoveryDrop)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const rawRecScore = recDropVals.length ? scoreHigherBetter(mean(recDropVals), b.hrRecoveryDrop) : null;
  const recScore = tier1Only ? null : readEma("engineRec", rawRecScore);
  if(recDropVals.length) detail.push(`1분 Recovery HR 하강폭 평균 ${round1(mean(recDropVals))}bpm vs 목표 ${b.hrRecoveryDrop}bpm${tier1Only?"":" (EMA 스무딩 적용)"}`);
  const score = weightedAvg([[skiRowScore,0.35],[burpeeScore,0.15],[driftScore,0.30],[recScore,0.20]]);
  return { score, detail, sub:{skiRowScore,burpeeScore,driftScore,recScore} };
}

// ---- Strength Endurance Index ----
function calcStrengthIndex(){
  const b=bench(); const st=latestStationValues();
  const detail=[];
  const pushSec=parseTimeToSec(st.sledPush), pullSec=parseTimeToSec(st.sledPull), lungeSec=parseTimeToSec(st.lunge), carrySec=parseTimeToSec(st.carry);
  const sledScore=weightedAvg([[scoreLowerBetter(pushSec,b.sledPush),0.5],[scoreLowerBetter(pullSec,b.sledPull),0.5]]);
  if(pushSec) detail.push(`Sled Push ${fmtTime(pushSec)} vs 기준 ${fmtTime(b.sledPush)}`);
  if(pullSec) detail.push(`Sled Pull ${fmtTime(pullSec)} vs 기준 ${fmtTime(b.sledPull)}`);
  const lungeScore=scoreLowerBetter(lungeSec,b.lunge);
  const carryScore=scoreLowerBetter(carrySec,b.carry);
  const sq=Number(STATE.strength.squat), dl=Number(STATE.strength.deadlift), bw=Number(STATE.profile.weight);
  let rawScore=null;
  if(sq&&dl&&bw){ const ratio=(sq+dl)/bw; rawScore=scoreHigherBetter(ratio,b.squatDL); detail.push(`(Squat+Deadlift)/체중 = ${round1(ratio)} vs 목표 ${b.squatDL}`); }
  const score = weightedAvg([[sledScore,0.35],[lungeScore,0.20],[rawScore,0.30],[carryScore,0.15]]);
  return { score, detail, sub:{sledScore,lungeScore,rawScore,carryScore} };
}

// ---- HYROX Skill Index ----
function calcSkillIndex(){
  const b=bench(); const st=latestStationValues(); const race=latestRace();
  const detail=[];
  const wbSec=parseTimeToSec(st.wallball);
  const wbScore=scoreLowerBetter(wbSec,b.wallball);
  if(wbSec) detail.push(`Wall Ball ${fmtTime(wbSec)} vs 기준 ${fmtTime(b.wallball)}`);
  let transScore=null;
  if(race && race.officialTime){
    const total=parseTimeToSec(race.officialTime);
    const trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ const pct=(trans/total)*100; transScore=clamp(100-Math.max(0,pct-6)*10,0,100); detail.push(`전환시간 비중 ${round1(pct)}% (총 시간 대비)`); }
  }
  let consistScore=null;
  const vals=STATIONS.map(s=>{ const sec=parseTimeToSec(st[s.key]); const bb=b[s.key]; return sec&&bb? sec/bb : null; }).filter(v=>v!=null);
  if(vals.length>=3){ const sd=stdev(vals); consistScore=clamp(100-sd*220,0,100); detail.push(`스테이션별 벤치마크 대비 변동계수 ${round1(sd*100)}%`); }
  const score = weightedAvg([[wbScore,0.35],[transScore,0.35],[consistScore,0.30]]);
  return { score, detail, sub:{wbScore,transScore,consistScore} };
}

// ---- Recovery Index ----
// Resting HR trend (spec §1/§6): compares a recent (7d) window against a preceding baseline (8-30d
// back) window — NOT a single reading against yesterday — so one unusually high/low morning reading
// can't swing Recovery on its own. Requires at least 2 readings in EACH window before returning a
// score; below that, returns null (feeds into the EMA/weightedAvg "no data" path like everything else).
function restingHrTrend(){
  const log=[...STATE.restingHrLog].sort((a,b)=>a.date.localeCompare(b.date));
  const now=new Date();
  const cutoff7=new Date(now); cutoff7.setDate(cutoff7.getDate()-7);
  const cutoff30=new Date(now); cutoff30.setDate(cutoff30.getDate()-30);
  const recent=log.filter(r=>new Date(r.date)>=cutoff7);
  const baseline=log.filter(r=>new Date(r.date)>=cutoff30 && new Date(r.date)<cutoff7);
  if(recent.length<2 || baseline.length<2) return null;
  const recentAvg=mean(recent.map(r=>r.value)), baselineAvg=mean(baseline.map(r=>r.value));
  return { recentAvg, baselineAvg, deltaBpm:recentAvg-baselineAvg, recentN:recent.length, baselineN:baseline.length };
}
// spec §9: Training Load/TSS is a LOAD trend, not a performance trend — "TSS 증가 ≠ Fitness 증가".
// Mirrors ACWR's acute:chronic shape (7d load vs 28d/4 weekly-average load) so it reads on the same
// scale, but stays a SEPARATE, supplementary signal — never replaces the existing ACWR (still computed
// from RPE×duration as before). Returns null when there's no Training Load data at all (never estimated).
function computeTrainingLoadTrend(){
  const now=new Date();
  const cutoff7=new Date(now); cutoff7.setDate(cutoff7.getDate()-7);
  const cutoff28=new Date(now); cutoff28.setDate(cutoff28.getDate()-28);
  const withLoad=STATE.trainingLog.filter(l=>l.trainingLoad!=null && !isNaN(Number(l.trainingLoad)));
  if(!withLoad.length) return null;
  const load7=withLoad.filter(l=>new Date(l.date)>=cutoff7).reduce((s,l)=>s+Number(l.trainingLoad),0);
  const load28=withLoad.filter(l=>new Date(l.date)>=cutoff28).reduce((s,l)=>s+Number(l.trainingLoad),0);
  const weeklyAvg28=load28/4;
  if(weeklyAvg28<=0) return null;
  const ratio=load7/weeklyAvg28; // >1 = this week loaded above the last-4-week average
  return { load7:round1(load7), load28:round1(load28), weeklyAvg28:round1(weeklyAvg28), ratio, trend: ratio>1.15?"상승":ratio<0.85?"하강":"유지" };
}
// spec §8: Aerobic Training Effect trend — training-STIMULUS trend, display/interpretation only.
// Deliberately never touches any score (spec's explicit prohibition: "TE 4 이상이면 HPI 상승" 금지) —
// this exists purely so the Dashboard can show "왜" the Running/Engine trend looks the way it does.
function computeAerobicTeTrend(days=42){
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  const logs=STATE.trainingLog.filter(l=>l.aerobicTrainingEffect!=null && new Date(l.date)>=cutoff)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(logs.length<4) return null;
  const mid=Math.floor(logs.length/2);
  const earlierAvg=mean(logs.slice(0,mid).map(l=>Number(l.aerobicTrainingEffect)));
  const laterAvg=mean(logs.slice(mid).map(l=>Number(l.aerobicTrainingEffect)));
  if(earlierAvg==null||laterAvg==null) return null;
  return { earlierAvg, laterAvg, delta:laterAvg-earlierAvg, latest:Number(logs[logs.length-1].aerobicTrainingEffect), sampleSize:logs.length };
}
function calcRecoveryIndex(){
  const detail=[];
  const acwr=calcACWR();
  const acwrScore = acwr!=null? clamp(100-Math.abs(acwr-1.0)*90,0,100) : null;
  if(acwr!=null) detail.push(`ACWR(급성:만성 부하비) ${round1(acwr)} (이상 범위 0.8~1.3)`);
  const recent7=recentTraining(7);
  const rpeVals=recent7.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpeTrendScore = rpeVals.length? clamp(100-(mean(rpeVals)-5)*10,0,100) : null;
  if(rpeVals.length) detail.push(`최근 7일 평균 RPE ${round1(mean(rpeVals))} (기준 5)`);
  const trainingDays = new Set(recent7.map(l=>l.date)).size;
  const restDays = clamp(7-trainingDays,0,7);
  // bug fix (same class as the recentMileageAvg fix): with ZERO training-log history at all (not
  // just this week — a brand-new profile with no logged activity anywhere), "0 training days this
  // week" was being scored as "100% perfect rest compliance" — the app can't actually tell the
  // difference between "genuinely resting" and "hasn't logged anything yet", so this must be null
  // (unknown), not a flattering default. Someone who HAS logged history and had a real rest week
  // still correctly scores this normally.
  const hasAnyTrainingHistory = STATE.trainingLog.length>0;
  const restScore = hasAnyTrainingHistory ? scoreHigherBetter(restDays, 1.5) : null;
  if(hasAnyTrainingHistory) detail.push(`최근 7일 중 훈련일 ${trainingDays}일 (추정 휴식일 ${restDays}일 vs 목표 1.5일)`);
  // resting HR trend — Tier 2, EMA-smoothed (spec §1/§6). +1bpm elevated vs baseline costs ~7pts,
  // capped — a real but gradual signal, not a single-day panic trigger.
  const hrTrend=restingHrTrend();
  const rawRestingHrScore = hrTrend ? clamp(100-Math.max(0,hrTrend.deltaBpm)*7,0,100) : null;
  const restingHrScore = readEma("recoveryRestingHr", rawRestingHrScore);
  if(hrTrend) detail.push(`최근 7일 평균 휴식 심박 ${round1(hrTrend.recentAvg)}bpm vs 이전 기준 ${round1(hrTrend.baselineAvg)}bpm (${hrTrend.deltaBpm>=0?"+":""}${round1(hrTrend.deltaBpm)}bpm, EMA 스무딩 적용)`);
  // Training Load trend (spec §9) — Tier 2, EMA-smoothed, light weight (0.10). Supplements ACWR
  // (still computed exactly as before) rather than replacing it — only contributes when Garmin/Training
  // Load data actually exists; null otherwise, weightedAvg renormalizes over the rest as usual.
  const loadTrend=computeTrainingLoadTrend();
  const rawLoadTrendScore = loadTrend ? clamp(100-Math.max(0,loadTrend.ratio-1.0)*60,0,100) : null;
  const loadTrendScore = readEma("recoveryTrainingLoad", rawLoadTrendScore);
  if(loadTrend) detail.push(`최근 7일 Training Load ${loadTrend.load7} vs 최근 4주 평균 ${round1(loadTrend.weeklyAvg28)} (비율 ${round1(loadTrend.ratio)}, EMA 스무딩 적용)`);
  const score = weightedAvg([[acwrScore,0.35],[rpeTrendScore,0.20],[restScore,0.20],[restingHrScore,0.15],[loadTrendScore,0.10]]);
  return { score, detail, sub:{acwrScore,rpeTrendScore,restScore,restingHrScore,loadTrendScore} };
}

// ---- Race Execution Index ----
function calcRaceExecIndex(){
  const detail=[]; const race=latestRace();
  let pacingScore=null, transSpeedScore=null;
  if(race){
    const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
    if(runsSec.length>=4){ const sd=stdev(runsSec); const m=mean(runsSec); const cv=sd/m; pacingScore=clamp(100-cv*100*6,0,100); detail.push(`러닝 스플릿 변동계수 ${round1(cv*100)}% (낮을수록 균일)`); }
    const total=parseTimeToSec(race.officialTime), trans=parseTimeToSec(race.transition);
    if(total&&trans!=null){ transSpeedScore=clamp(100-((trans/total)*100-6)*9,0,100); }
  }
  const races=[...STATE.races].sort((a,b)=>a.date.localeCompare(b.date));
  let consistScore=70;
  if(races.length>=2){
    const times=races.map(r=>parseTimeToSec(r.officialTime)).filter(v=>v);
    if(times.length>=2){ const sd=stdev(times); const m=mean(times); consistScore=clamp(100-(sd/m)*100*3,0,100); detail.push(`대회 기록 변동계수 ${round1((sd/m)*100)}%`); }
  } else detail.push("대회 기록 2회 미만 → 기본값(70) 사용");
  const score = weightedAvg([[pacingScore,0.40],[transSpeedScore,0.30],[consistScore,0.30]]);
  return { score, detail, sub:{pacingScore,transSpeedScore,consistScore} };
}

function calcACWR(){
  // acute = last 7d load (duration*rpe), chronic = last 28d/4 weekly avg
  const load=(logs)=>logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0);
  const cutoff7=new Date(); cutoff7.setDate(cutoff7.getDate()-7);
  const cutoff28=new Date(); cutoff28.setDate(cutoff28.getDate()-28);
  const acute=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff7));
  const chronic4wk=load(STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff28))/4;
  if(!chronic4wk)return null;
  return acute/chronic4wk;
}

/* ---------------------------------------------------------------------- */
/* 4b-2. V3 — TRAINING LOAD BY SESSION TYPE (spec §21)                     */
/*     "1시간 Easy Run과 1시간 HYROX Simulation은 같은 RPE여도 피로 특성이   */
/*     다르다" — duration×RPE alone treats them identically. Each session   */
/*     type gets a fatigue-cost multiplier so Running/Strength/HYROX/High-  */
/*     intensity load can be told apart, and a weighted ACWR variant is     */
/*     available as a secondary signal (calcACWR() itself is left untouched */
/*     since several already-tuned thresholds elsewhere depend on it).      */
/* ---------------------------------------------------------------------- */
const LOAD_TYPE_MULTIPLIER = { run:1.0, long:1.0, interval:1.15, strength:1.1, wod:1.3, station:1.15, brick:1.3, sim:1.4, recovery:0.3, rest:0, shakeout:0.2 };
function computeTrainingLoadByType(days=7){
  const logs=recentTraining(days);
  const out={ running:0, strength:0, hyrox:0, highIntensity:0, total:0 };
  logs.forEach(l=>{
    const dur=Number(l.durationMin)||0, rpe=Number(l.intensityRpe)||5;
    const mult=LOAD_TYPE_MULTIPLIER[l.type] ?? 1.0;
    const load=dur*rpe/10*mult;
    out.total+=load;
    if(isRunType(l.type)) out.running+=load;
    else if(l.type==="strength") out.strength+=load;
    else if(["wod","station","brick","sim"].includes(l.type)) out.hyrox+=load;
    if(rpe>=8) out.highIntensity+=load;
  });
  return out;
}
function calcACWRWeighted(){
  const acute=computeTrainingLoadByType(7).total;
  const cutoff28=new Date(); cutoff28.setDate(cutoff28.getDate()-28);
  const logs28=STATE.trainingLog.filter(l=>new Date(l.date)>=cutoff28);
  const chronic4wk=logs28.reduce((s,l)=>{ const dur=Number(l.durationMin)||0, rpe=Number(l.intensityRpe)||5; const mult=LOAD_TYPE_MULTIPLIER[l.type]??1.0; return s+dur*rpe/10*mult; },0)/4;
  if(!chronic4wk) return null;
  return acute/chronic4wk;
}

function calcFatigueScore(){
  // 0-100, higher = more fatigued. V3 (spec §19-20): ACWR overload + RPE trend + pain — PLUS HR drift
  // and performance trend, so no single signal (esp. ACWR) drives this alone. Each new component
  // defaults to 0 without data, so behavior is unchanged for anyone without HR/history yet.
  const acwr=calcACWR();
  const acwrPenalty = acwr!=null? clamp((acwr-1.0)*60,0,50) : 0;
  const recent3=recentTraining(3);
  const rpeVals=recent3.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpePenalty = rpeVals.length? clamp((mean(rpeVals)-6)*9,0,35) : 0;
  const painPenalty = STATE.trainingLog.some(l=>l.painFlag && daysBetween(l.date, todayISO())<=3) ? 15 : 0;
  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const hrDriftPenalty = driftVals.length? clamp((mean(driftVals)-bench().hrDrift)*3,0,15) : 0;
  const trend=hpiTrendPerWeek();
  const perfDropPenalty = (trend!=null && trend<0) ? clamp(-trend*8,0,15) : 0;
  return clamp(acwrPenalty+rpePenalty+painPenalty+hrDriftPenalty+perfDropPenalty,0,100);
}

/* ---------------------------------------------------------------------- */
/* 4c. DELOAD AUTO-RECOMMENDATION                                          */
/*     Dedicated 6-component weighted fatigue read specifically for the    */
/*     "회복 주기" (recovery-cycle) coaching setting — separate from the    */
/*     general calcFatigueScore() used by the Rule Engine/Dashboard, so     */
/*     that tuning this doesn't disturb the already-tuned safety rules.    */
/* ---------------------------------------------------------------------- */
const DELOAD_WEIGHTS = { trainingLoad:0.30, rpe:0.20, hrDrift:0.15, performanceDrop:0.15, recentHighIntensity:0.10, recoveryPain:0.10 };
function calcDeloadFatigueScore(){
  const b=bench();
  const acwr=calcACWR();
  const trainingLoadScore = acwr!=null ? clamp((acwr-1.0)*70,0,100) : 0;

  const recent7=recentTraining(7);
  const rpeVals=recent7.map(l=>Number(l.intensityRpe)).filter(v=>!isNaN(v)&&v);
  const rpeScore = rpeVals.length ? clamp((mean(rpeVals)-5)*15,0,100) : 0;

  const hrLogs=recentHrLog(5);
  const driftVals=hrLogs.map(h=>Number(h.hrDrift)).filter(v=>!isNaN(v)&&v!=null&&v!=="");
  const hrDriftScore = driftVals.length ? clamp((mean(driftVals)-b.hrDrift)*10,0,100) : 0;

  const trend=hpiTrendPerWeek();
  const performanceDropScore = (trend!=null && trend<0) ? clamp(-trend*20,0,100) : 0;

  const counts7=trainingCountByType(7);
  const highIntensityCount=(counts7.wod||0)+(counts7.interval||0);
  const recentHighIntensityScore = clamp((highIntensityCount-2)*25,0,100);

  const painFlag = STATE.trainingLog.some(l=>l.painFlag && daysBetween(l.date, todayISO())<=7);
  const trainingDays=new Set(recent7.map(l=>l.date)).size;
  const restDays=clamp(7-trainingDays,0,7);
  const recoveryPainScore = painFlag ? 100 : clamp((2-restDays)*30,0,100);

  return clamp(
    trainingLoadScore*DELOAD_WEIGHTS.trainingLoad + rpeScore*DELOAD_WEIGHTS.rpe + hrDriftScore*DELOAD_WEIGHTS.hrDrift +
    performanceDropScore*DELOAD_WEIGHTS.performanceDrop + recentHighIntensityScore*DELOAD_WEIGHTS.recentHighIntensity +
    recoveryPainScore*DELOAD_WEIGHTS.recoveryPain, 0, 100);
}
// 높은 피로 → 4주 / 정상 → 5주 / 낮은 피로 + 적응 양호(HPI 상승 추세) → 6주
function getRecommendedDeloadWeeks(){
  const score=calcDeloadFatigueScore();
  const trend=hpiTrendPerWeek();
  if(score>=65) return 4;
  if(score<35 && trend!=null && trend>0) return 6;
  return 5;
}
function getEffectiveDeloadWeeks(){
  const mode=STATE.settings.deloadMode || "auto";
  if(mode==="auto") return getRecommendedDeloadWeeks();
  if(mode==="custom") return clamp(Number(STATE.settings.deloadCustomWeeks)||5,2,10);
  return Number(mode)||5;
}

// V3 (spec §19): "Deload가 필요하다는 판단"과 "몇 주마다 Deload하는지"를 분리한다. Cadence
// (getRecommendedDeloadWeeks) is a planning input for the settings page; THIS function is the direct,
// same-week decision — driven by current fatigue + performance trend + recent high-intensity volume +
// active pain, never by "it's been N weeks" alone.
function shouldDeloadNow(){
  const score=calcDeloadFatigueScore();
  const trend=hpiTrendPerWeek();
  const reasons=[];
  if(score>=65) reasons.push(`Deload Fatigue Score ${round1(score)} (65 이상)`);
  if(trend!=null && trend<-0.3) reasons.push(`최근 HPI 추세 하락 (${round1(trend)}/주)`);
  const recent7=recentTraining(7);
  const highIntensityCount=recent7.filter(l=>["wod","interval","sim"].includes(l.type)).length;
  if(highIntensityCount>=4) reasons.push(`최근 7일 고강도 세션 ${highIntensityCount}회`);
  if(getPainRestrictions()!=null) reasons.push("최근 5일 내 통증 보고");
  return { needed: score>=75 || reasons.length>=2, reasons, score };
}

// spec (Score/Confidence 분리 — all 6 indices): "Running Index 72, Confidence LOW" and "Running
// Index 72, Confidence HIGH" must both be representable — the SAME score can carry different
// confidence depending on how much real data backs it. This is purely ADDITIVE (a new .confidence
// field alongside the existing .score) — no existing score/weight/calculation logic changes, so
// nothing that already reads hpiResult.indices[key].score is affected.
function calcIndexDataCoverage(key){
  const meta=getStationDataMeta();
  if(key==="engine"){
    const stations=["ski","row","burpee"];
    const present=stations.filter(s=>meta[s]);
    return { coverageCount:present.length, coverageTotal:stations.length, freshCount:present.filter(s=>meta[s].isFresh).length };
  }
  if(key==="strengthEnd"){
    const stations=["sledPush","sledPull","lunge","carry"];
    const present=stations.filter(s=>meta[s]);
    return { coverageCount:present.length, coverageTotal:stations.length, freshCount:present.filter(s=>meta[s].isFresh).length };
  }
  if(key==="running"){
    let count=0; const total=5;
    const race=latestRace();
    if(race && race.runs && Object.values(race.runs).some(v=>v)) count++;
    if(parseTimeToSec(STATE.running.pb5k) || parseTimeToSec(STATE.running.pb10k)) count++;
    if(recentRunPaceAvg(21)!=null) count++;
    if(recentRunPaceAvg(21,"interval")!=null) count++;
    if(computeHrEfficiencyTrend()!=null) count++;
    return { coverageCount:count, coverageTotal:total, freshCount:count };
  }
  if(key==="skill"){
    let count=0; const total=3;
    const race=latestRace();
    if(meta.wallball) count++; // Wall Ball station data (any source)
    if(race && race.officialTime && race.transition) count++; // transition-% signal
    const stCount=STATIONS.filter(s=>meta[s.key]).length;
    if(stCount>=3) count++; // enough stations for the cross-station consistency signal
    return { coverageCount:count, coverageTotal:total, freshCount:count };
  }
  if(key==="recovery"){
    let count=0; const total=4;
    if(calcACWR()!=null) count++;
    const recent7=recentTraining(7);
    if(recent7.some(l=>!isNaN(Number(l.intensityRpe))&&l.intensityRpe)) count++;
    if(recent7.length>0) count++; // real recent training-log activity (not just the default "fully rested" fallback)
    if(restingHrTrend()!=null) count++;
    return { coverageCount:count, coverageTotal:total, freshCount:count };
  }
  if(key==="raceExec"){
    let count=0; const total=3;
    const race=latestRace();
    if(race){
      const runsSec=RUN_KEYS.map(k=>parseTimeToSec(race.runs?.[k])).filter(v=>v!=null);
      if(runsSec.length>=4) count++;
      if(race.officialTime && race.transition!=null && race.transition!=="") count++;
    }
    if(STATE.races.length>=2) count++;
    return { coverageCount:count, coverageTotal:total, freshCount:count };
  }
  return null;
}
function calcIndexConfidence(key){
  const cov=calcIndexDataCoverage(key);
  if(!cov) return null;
  const ratio = cov.coverageTotal ? cov.coverageCount/cov.coverageTotal : 0;
  const label = ratio>=0.6 ? "HIGH" : ratio>0 ? "MEDIUM" : "LOW";
  return { label, ...cov };
}
// spec ③: a sparse-data athlete whose few available data points happen to be favorable can produce
// an overall HPI that reads as high-confidence, well-rounded fitness — even though most of the score
// is really "we don't know, so weightedAvg only averaged the 1-2 things we do have". This regresses
// each index's contribution to the OVERALL HPI toward a neutral midpoint (50) in proportion to how
// sparse its data is — full data (coverage ratio 1) leaves it untouched; zero real data pulls it at
// most halfway toward neutral (never fully erases what a single real measurement does mean). This
// only affects the blended HPI headline number — each Index's own displayed .score (on the ability
// cards, Training Priority, Station Priority, etc.) is completely untouched, so nothing else changes.
function confidenceAdjustedScore(index){
  if(index.score==null) return null;
  const conf=index.confidence;
  if(!conf || !conf.coverageTotal) return index.score;
  const ratio=clamp(conf.coverageCount/conf.coverageTotal,0,1);
  const shrink=(1-ratio)*0.5;
  return index.score*(1-shrink) + 50*shrink;
}
function calcHPI(tier1Only=false){
  const running=calcRunningIndex(tier1Only), engine=calcEngineIndex(tier1Only), strengthEnd=calcStrengthIndex(),
        skill=calcSkillIndex(), recovery=calcRecoveryIndex(), raceExec=calcRaceExecIndex();
  const fatigue=calcFatigueScore();
  const indices={running,engine,strengthEnd,skill,recovery,raceExec};
  // additive: confidence/coverage attached alongside score for every index
  ["running","engine","strengthEnd","skill","recovery","raceExec"].forEach(k=>{ indices[k].confidence = calcIndexConfidence(k); });
  // tier1Only excludes Recovery entirely (it has no test/PB equivalent — it's inherently a training-
  // trend signal) and Running/Engine already dropped their Tier2 sub-scores above; weightedAvg
  // renormalizes across whatever's left automatically via its null-filtering.
  const weightKeys = tier1Only ? Object.keys(INDEX_WEIGHTS).filter(k=>k!=="recovery") : Object.keys(INDEX_WEIGHTS);
  const hpi = weightedAvg(weightKeys.map(k=>[confidenceAdjustedScore(indices[k]), INDEX_WEIGHTS[k]]));
  return { hpi, indices, fatigue };
}

/* ---------------------------------------------------------------------- */
/* 5. PREDICTION ENGINE                                                    */
/*    Explainable formula:                                                 */
/*    PredictedTime = Baseline × (1 - ΔHPI×k - ConsistencyBonus + FatiguePenalty) */
/*    CI width driven by Race Execution Index (pacing consistency).        */
/* ---------------------------------------------------------------------- */
/* ---------------------------------------------------------------------- */
/* CURRENT ANCHOR — baseline hierarchy with Recent-Actual protection        */
/*   A. Fresh actual race (<=STATION_STALE_DAYS)        -> use directly     */
/*      (unchanged, top priority, same as before this pass)                */
/*   B. Best recent actual race within RECENT_ACTUAL_WINDOW_DAYS, even if   */
/*      not "fresh" by the 14-day station-staleness definition             */
/*   C. Segment model (>=50% real segment coverage, unchanged calculation)  */
/*   D. Benchmark x HPI estimate (unchanged, see getBaselineTime below)     */
/*                                                                          */
/*   Why this exists: previously, the moment a race passed 14 days old,    */
/*   the model jumped straight to the Segment Model (C) and would use it   */
/*   even when it was SLOWER than a real recent finish — i.e. the model    */
/*   could "forget" that the athlete had already run e.g. 1:17:05 by       */
/*   quoting a blended synthetic 1:21:24 as "current ability". B now sits  */
/*   between A and C specifically to catch that case.                      */
/*                                                                          */
/*   When B exists and is FASTER than or equal to C: no conflict, C is     */
/*   used as-is (segment model already agrees a real result is achievable  */
/*   or better). When C is SLOWER than B, the anchor is pulled toward B —  */
/*   NOT hard-overridden to B (an unexplained "PB forever" anchor is also  */
/*   wrong) — via a smooth, fully-explainable blend:                       */
/*     freshness       = how recent B is (linear decay to 0 over the       */
/*                        window — an old best-recent-actual naturally     */
/*                        stops protecting)                                */
/*     explainDiscount = reduced further when there's a real, already-     */
/*                        computed reason C could legitimately be slower   */
/*                        right now: low recent training volume, HPI       */
/*                        decline since B's date, or high current fatigue  */
/*                        — each such signal cuts protection by 35%        */
/*     protectionWeight = freshness * explainDiscount                      */
/*     anchor = B*protectionWeight + C*(1-protectionWeight)                */
/*   No arbitrary hardcoded offsets ("-2min", "snap to PB") anywhere here. */
/* ---------------------------------------------------------------------- */
const RECENT_ACTUAL_WINDOW_DAYS = 180;
function getRecentActualCandidates(){
  return racesByDivision(STATE.profile.division)
    .filter(r=>r.officialTime && daysBetween(r.date, todayISO())<=RECENT_ACTUAL_WINDOW_DAYS)
    .map(r=>({ value:parseTimeToSec(r.officialTime), date:r.date, ageDays:daysBetween(r.date, todayISO()) }));
}

/* ---------------------------------------------------------------------- */
/* SIMULATION -> RACE-LEVEL ANCHOR (doc12 긴급 수정 요청)                    */
/*   Previously a Simulation's own `totalTime` was NEVER consulted as a     */
/*   race-level performance signal — only its individual Run/Station/      */
/*   Transition splits fed the 17-segment model (buildRaceSegmentModel()). */
/*   A Full Simulation with a genuinely fast totalTime but no (or partial)  */
/*   segment breakdown therefore had ZERO effect on getBaselineTime()'s     */
/*   Anchor. Below adds `getBestSimulationCandidate()` as an explicit,      */
/*   confidence-scored race-level signal, and computeCurrentAnchor() now    */
/*   blends it into whatever Anchor Step A/B/C/D would otherwise produce — */
/*   never a full override (Simulation != official result, principle §7),  */
/*   never fully ignored (the actual bug being fixed).                     */
/* ---------------------------------------------------------------------- */
const SIM_MIN_CONFIDENCE_FOR_ANCHOR = 0.35; // below this, Simulation still feeds 17-segment candidates
                                             // (unchanged, existing mechanism) but is not trusted enough
                                             // to move the race-level Anchor directly.
const SIM_MAX_ANCHOR_WEIGHT = 0.5;          // hard cap — even a perfect-confidence Simulation never
                                             // exceeds 50% blend weight, so Anchor never just "becomes"
                                             // the Simulation time outright (forbidden by principle §3).
const SIM_SLOWER_DAMPEN = 0.15;             // when the Simulation is SLOWER than the current Anchor,
                                             // its pull is dampened hard — a single off-day Simulation
                                             // should not meaningfully worsen the prediction (TEST-03).
// Confidence factors (spec §4): type (Full>Half>Custom) × freshness (decays to 0 over the same
// RECENT_ACTUAL_WINDOW_DAYS used for official actuals) × completeness (Run1-8 + Station×8 + Transition
// filled — a Full Simulation with every segment filled gets the highest possible confidence, per spec).
function simulationConfidence(sim){
  const typeWeight = { full:1.0, half:0.65, custom:0.4 }[sim.type] || 0.4;
  const runsFilled = RUN_KEYS.filter(k=>sim.runs && sim.runs[k] && sim.runs[k].time).length;
  const stationsFilled = STATIONS.filter(s=>sim.stations && sim.stations[s.key] && sim.stations[s.key].time).length;
  const transFilled = sim.transition ? 1 : 0;
  const completeness = (runsFilled+stationsFilled+transFilled)/17;
  const completenessFactor = 0.5 + completeness*0.5; // 0.5 (totalTime only) .. 1.0 (fully detailed)
  const ageDays = daysBetween(sim.date, todayISO());
  const freshness = clamp(1 - ageDays/RECENT_ACTUAL_WINDOW_DAYS, 0, 1);
  return clamp(typeWeight*freshness*completenessFactor, 0, 1);
}
// Picks the single best-qualifying Simulation as a race-level candidate — highest confidence first,
// most recent as tiebreaker. Only considers entries with a parseable totalTime, matching the current
// profile's Division base, within the same recency window official actuals use.
function getBestSimulationCandidate(){
  const myDiv = currentProfileDivisionBase();
  const cands = STATE.simulationTests
    .filter(t=>divisionBase(t.division)===myDiv && t.totalTime)
    .map(t=>{
      const value=parseTimeToSec(t.totalTime);
      if(value==null) return null;
      const ageDays=daysBetween(t.date, todayISO());
      if(ageDays>RECENT_ACTUAL_WINDOW_DAYS) return null;
      return { value, date:t.date, ageDays, type:t.type, confidence:simulationConfidence(t) };
    })
    .filter(Boolean);
  if(!cands.length) return null;
  cands.sort((a,b)=> b.confidence-a.confidence || a.ageDays-b.ageDays);
  return cands[0];
}
// Wraps whatever computeBaseAnchorWithoutSimulation() (Steps A/B/C/D, entirely unchanged logic) would
// have returned, then blends in a qualifying Simulation. Asymmetric on purpose: a FASTER Simulation is
// trusted up to SIM_MAX_ANCHOR_WEIGHT (a real improvement signal worth reflecting); a SLOWER Simulation
// is trusted at only SIM_MAX_ANCHOR_WEIGHT×SIM_SLOWER_DAMPEN (present, but not allowed to needlessly
// drag the prediction backward off one off-day session — TEST-03).
function computeCurrentAnchor(hpiResult){
  const base = computeBaseAnchorWithoutSimulation(hpiResult);
  const simCandidate = getBestSimulationCandidate();
  const simQualifies = !!(simCandidate && simCandidate.confidence>=SIM_MIN_CONFIDENCE_FOR_ANCHOR);

  if(!base){
    // D 이전 단계: 공식 기록도 Segment 모델도 전혀 없는 경우 — TEST-02: totalTime만 있는 Simulation도
    // 최소한의 race-level 신호로는 반영되어야 한다.
    if(simQualifies){
      const result = { value:simCandidate.value, source:`Simulation 기록 (${simCandidate.type}, ${simCandidate.ageDays}일 전) — 공식대회/구간 데이터 없음`,
        baselineHpiDate:simCandidate.date, recentActual:null, bestRecentActual:null, segmentEstimate:null,
        protectionWeight:1, anchorNote:null, simulationEstimate:simCandidate, simulationUsed:true, simulationWeight:1 };
      logPredictionDebug({ officialBaseline:null, simulationBaseline:simCandidate.value, segmentBaseline:null,
        simulationUsed:true, simulationWeight:1, finalPrediction:result.value });
      return result;
    }
    logPredictionDebug({ officialBaseline:null, simulationBaseline:simCandidate?simCandidate.value:null, segmentBaseline:null,
      simulationUsed:false, simulationWeight:0, finalPrediction:null });
    return null;
  }
  if(!simQualifies){
    logPredictionDebug({ officialBaseline:base.recentActual?base.recentActual.value:(base.bestRecentActual?base.bestRecentActual.value:null),
      simulationBaseline:simCandidate?simCandidate.value:null, segmentBaseline:base.segmentEstimate?base.segmentEstimate.value:null,
      simulationUsed:false, simulationWeight:0, finalPrediction:base.value });
    return { ...base, simulationEstimate:simCandidate||null, simulationUsed:false, simulationWeight:0 };
  }
  const isFaster = simCandidate.value<=base.value;
  const rawWeight = clamp(simCandidate.confidence, 0, SIM_MAX_ANCHOR_WEIGHT);
  const weight = isFaster ? rawWeight : rawWeight*SIM_SLOWER_DAMPEN;
  const blendedValue = base.value*(1-weight) + simCandidate.value*weight;
  const result = { ...base, value:blendedValue,
    source: `${base.source} + Simulation(${simCandidate.type}, ${simCandidate.ageDays}일 전) 반영 ${Math.round(weight*100)}%`,
    simulationEstimate:simCandidate, simulationUsed:true, simulationWeight:weight };
  logPredictionDebug({ officialBaseline:base.recentActual?base.recentActual.value:(base.bestRecentActual?base.bestRecentActual.value:null),
    simulationBaseline:simCandidate.value, segmentBaseline:base.segmentEstimate?base.segmentEstimate.value:null,
    simulationUsed:true, simulationWeight:weight, finalPrediction:result.value });
  return result;
}
// 요청 §6: 콘솔에서 Simulation이 실제로 prediction에 반영되었는지 즉시 확인 가능하도록.
function logPredictionDebug(d){
  try{
    console.log(`[Prediction Debug]\nofficialBaseline: ${d.officialBaseline!=null?fmtTime(d.officialBaseline):"—"}`
      + `\nsimulationBaseline: ${d.simulationBaseline!=null?fmtTime(d.simulationBaseline):"—"}`
      + `\nsegmentBaseline: ${d.segmentBaseline!=null?fmtTime(d.segmentBaseline):"—"}`
      + `\nsimulationUsed: ${d.simulationUsed}\nsimulationWeight: ${round1((d.simulationWeight||0)*100)}%`
