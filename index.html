      <div class="kv"><span class="k">Tier 1 (메인 드라이버)</span><span class="v mono">14일 이내 스테이션 테스트 · PB — 즉시 반영, 스무딩 없음</span></div>
      <div class="kv"><span class="k">Tier 2 (보조 드라이버)</span><span class="v mono">Garmin/훈련 로그 부하·페이스·HR 추세 — EMA(α=${currentEmaAlpha()}, 현재 "${SENSITIVITY_META[STATE.settings.predictionSensitivity]?.label}" 설정)로 스무딩, 예측 기여도 최대 ±4% 하드캡</span></div>
      <p class="lead" style="margin-top:8px;">Running/Engine Index 안에서도 두 계층이 나뉩니다: 대회·PB·스테이션 실측치(Tier 1)는 그대로 반영되고, 주간거리·페이스 저하·HR Drift·Recovery HR처럼 훈련 로그에서 뽑아낸 추세치(Tier 2)는 새 데이터가 들어올 때마다 지수이동평균으로 완만하게 갱신됩니다 — 한 번의 좋은(혹은 나쁜) 세션이 점수를 훅 바꾸지 않습니다. 예측 계산 시에는 Tier 1만으로 계산한 HPI와 실제 HPI의 차이(Tier 2 기여분)를 따로 떼어내, 그 차이가 예측 기록을 ±4% 넘게 움직이지 못하도록 초과분을 깎아냅니다. 14일이 지난 스테이션 테스트는 심폐 스테이션(Ski/Row/Burpee)만 실측 러닝 페이스 추세로 최대 ±5%, 근력·그립 스테이션(Sled/Carry/Lunge/Wall Ball)은 최근 웨이트 세션 빈도로 최대 ±2%까지만 보정하며, 두 경우 모두 근거 데이터가 없으면 보정하지 않습니다. "예측 및 훈련 설정"에서 조정하는 예측 민감도(보수적/추천/민감)가 이 EMA α값을 결정하는 유일한 사용자 노출 파라미터입니다 — 그 외 가중치·상한·탄성계수는 전부 모델 내부에서 고정 관리합니다.</p>
    </div>
    <div class="card">
      <h2 class="section-title">Deload(회복 주기) 자동 추천</h2>
      <p class="lead" style="margin:8px 0;">전용 Deload Fatigue Score(0-100, Rule Engine의 일반 Fatigue Score와는 별도 지표)를 6개 요소 가중합으로 계산합니다.</p>
      <table><thead><tr><th>구성요소</th><th class="num">가중치</th></tr></thead><tbody>
        <tr><td>Training Load (ACWR)</td><td class="num mono">30%</td></tr>
        <tr><td>RPE (최근 7일)</td><td class="num mono">20%</td></tr>
        <tr><td>HR / HR Drift</td><td class="num mono">15%</td></tr>
        <tr><td>Performance 감소 추세</td><td class="num mono">15%</td></tr>
        <tr><td>최근 고강도 훈련 빈도</td><td class="num mono">10%</td></tr>
        <tr><td>Recovery / 통증</td><td class="num mono">10%</td></tr>
      </tbody></table>
      <div class="kv" style="margin-top:8px;"><span class="k">판정 기준 (주기, 계획용)</span><span class="v mono">점수≥65 → 4주 · 35~65 → 5주 · &lt;35 & HPI 상승추세 → 6주</span></div>
      <div class="kv"><span class="k">현재 Deload Fatigue Score</span><span class="v mono">${round1(calcDeloadFatigueScore())} / 100 → 자동 추천 ${getRecommendedDeloadWeeks()}주</span></div>
      <div class="divider" style="margin:10px 0;"></div>
      <div class="kv"><span class="k">지금 당장 필요 여부 (V3, 주기와 별개 판단)</span><span class="v mono" style="color:${shouldDeloadNow().needed?'var(--red)':'var(--green)'};">${shouldDeloadNow().needed?"필요":"불필요"}</span></div>
      <p class="lead" style="margin-top:6px;">"몇 주마다 Deload할지"(위 주기)와 "이번 주에 실제로 Deload가 필요한지"(이 판단)는 분리되어 있습니다 — 후자는 현재 Deload Fatigue Score·HPI 추세·최근 고강도 빈도·통증을 매주 직접 재판단하며, 필요 시 주간 계획에서 실제로 세션 볼륨을 줄입니다(고정 주기를 기다리지 않음).</p>
    </div>
    <div class="card">
      <h2 class="section-title">Fatigue Score</h2>
      <div class="kv"><span class="k">구성</span><span class="v mono">ACWR 과부하분 + 최근 3일 평균 RPE분 + 통증 플래그 + HR Drift분 + Performance 하락추세분 (0-100, 높을수록 피로)</span></div>
      <div class="kv"><span class="k">ACWR</span><span class="v mono">최근 7일 부하 ÷ (최근 28일 부하/4)</span></div>
      <div class="kv"><span class="k">데이터 출처</span><span class="v mono">별도 회복 로그 없이 통합 훈련 기록(RPE·통증 여부)만으로 계산</span></div>
      <div class="divider" style="margin:10px 0;"></div>
      <div class="eyebrow gray">Training Load by Type (V3, 최근 7일 — 세션 종류별 피로 특성 구분)</div>
      <p class="lead" style="margin:6px 0 8px;">동일 RPE·시간이어도 Easy Run과 HYROX Simulation은 피로 특성이 다릅니다 — 종류별 가중치(Run/Strength ×1.0-1.1, WOD/Brick ×1.3, Simulation ×1.4, Recovery ×0.3)를 적용해 구분합니다.</p>
      ${(() => { const t=computeTrainingLoadByType(7); const wAcwr=calcACWRWeighted();
        return `<div class="kv"><span class="k">Running Load</span><span class="v mono">${round1(t.running)}</span></div>
        <div class="kv"><span class="k">Strength Load</span><span class="v mono">${round1(t.strength)}</span></div>
        <div class="kv"><span class="k">HYROX Load (WOD/Brick/Sim/Station)</span><span class="v mono">${round1(t.hyrox)}</span></div>
        <div class="kv"><span class="k">고강도(RPE≥8) Load</span><span class="v mono">${round1(t.highIntensity)}</span></div>
        <div class="kv"><span class="k">가중 ACWR (참고 지표)</span><span class="v mono">${wAcwr!=null?round1(wAcwr):"데이터 부족"}</span></div>`; })()}
    </div>
    <div class="card">
      <h2 class="section-title">Rule Engine</h2>
      <p class="lead" style="margin:8px 0;">${RULES.length}개 규칙, 10개 카테고리(Recovery/Fatigue/Running/Strength/HYROX Station/Race Preparation/Weekly Planning/Deload/Taper/Injury Prevention). 각 규칙은 IF(조건) → THEN(추천) 구조이며 Priority(Critical/High/Medium/Low)로 충돌을 해결합니다. 새 규칙은 RULES 배열에 객체 하나만 추가하면 확장됩니다 — 다른 코드 변경 불필요.</p>
    </div>
    <div class="card">
      <h2 class="section-title">확장 방향</h2>
      <p class="lead">현재는 수동 입력 기반입니다. 구조상 Garmin/COROS/Polar/Apple Health/Strava API, CSV/Excel Import를 데이터 입력 페이지에 연결하는 형태로 확장 가능하며, HPI·Rule·Prediction 엔진 코드는 변경할 필요가 없습니다 (입력 소스만 STATE로 매핑하면 됩니다).</p>
    </div>
  `;
}

/* ---------------------------------------------------------------------- */
/* 24b. PAGE: ACCOUNT (login / signup / Google OAuth)                      */
/* ---------------------------------------------------------------------- */
function renderAccount(wrap){
  wrap.innerHTML = `
    <div><div class="eyebrow">ACCOUNT</div><h1 class="page-title">로그인 / 계정</h1></div>
    <div class="card">
      ${!sbEnabled() ? `<p class="lead" style="margin:6px 0;">아직 설정 전입니다. 코드 상단 <span class="mono">SUPABASE_URL</span> / <span class="mono">SUPABASE_ANON_KEY</span>를 채우면 로그인해서 여러 기기에서 같은 기록을 불러올 수 있어요. 이 값들은 클라이언트에 노출돼도 안전한 공개 키이며, 실제 접근 제어는 Supabase의 Row Level Security 정책으로 이뤄집니다.</p>`
      : sbStatus==="signedIn" ? `
        <div class="row-between">
          <span class="reason-line" style="font-family:var(--font-body);">로그인됨: <b style="color:var(--white);">${escapeHtml(STATE.profile.username||STATE.profile.name||"")}</b></span>
          <button class="btn sm ghost" id="sb-signout">로그아웃</button>
        </div>
        <p class="lead" style="margin-top:8px;">입력하실 때마다 자동으로 클라우드에 저장되고, 같은 브라우저에서는 다음에 열 때 자동으로 로그인됩니다.</p>
      ` : `
        <div class="tabs">
          <div class="tab ${ACCOUNT_UI_MODE==="login"?"active":""}" data-account-tab="login">로그인</div>
          <div class="tab ${ACCOUNT_UI_MODE==="signup"?"active":""}" data-account-tab="signup">회원가입</div>
        </div>
        ${ACCOUNT_UI_MODE==="signup" ? `
          <div class="grid grid-2" style="margin-top:14px;">
            ${field("아이디", `<input id="sb-username" placeholder="영문/숫자">`)}
            ${field("이름", `<input id="sb-name" placeholder="이름">`)}
            ${field("생년월일 (YYYY-MM-DD)", `<input id="sb-birthday" type="text" inputmode="numeric" placeholder="1995-03-14" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">`)}
            ${field("비밀번호", `<input id="sb-pw" type="password" placeholder="6자 이상">`)}
          </div>
          <div style="margin-top:12px;"><button class="btn sm secondary" id="sb-signup">회원가입</button></div>
        ` : `
          <div class="grid grid-2" style="margin-top:14px;">
            ${field("아이디", `<input id="sb-username" placeholder="아이디">`)}
            ${field("비밀번호", `<input id="sb-pw" type="password" placeholder="비밀번호">`)}
          </div>
          <div style="margin-top:12px;"><button class="btn sm" id="sb-signin">로그인</button></div>
        `}
        <div id="sb-status" style="margin-top:10px;"></div>
      `}
    </div>
  `;
  wrap.querySelectorAll("[data-account-tab]").forEach(t=>t.addEventListener("click",()=>{ ACCOUNT_UI_MODE=t.dataset.accountTab; renderAll(); }));
  wrap.querySelector("#sb-signin")?.addEventListener("click",async ()=>{
    const username=wrap.querySelector("#sb-username").value.trim(), pw=wrap.querySelector("#sb-pw").value;
    if(!username||!pw){ showToast("아이디/비밀번호를 입력해주세요"); return; }
    const statusEl=wrap.querySelector("#sb-status");
    statusEl.innerHTML=`<div class="reason-line">로그인 중...</div>`;
    const err=await sbSignIn(username,pw);
    if(err) statusEl.innerHTML=`<div class="reason-line" style="color:var(--red);">${escapeHtml(err)}</div>`;
    else { showToast("로그인되었습니다"); renderAll(); }
  });
  wrap.querySelector("#sb-signup")?.addEventListener("click",async ()=>{
    const username=wrap.querySelector("#sb-username").value.trim(), pw=wrap.querySelector("#sb-pw").value,
      name=wrap.querySelector("#sb-name").value.trim(), birthday=wrap.querySelector("#sb-birthday").value;
    if(!username||!pw){ showToast("아이디/비밀번호를 입력해주세요"); return; }
    if(pw.length<6){ showToast("비밀번호는 6자 이상이어야 합니다"); return; }
    const statusEl=wrap.querySelector("#sb-status");
    statusEl.innerHTML=`<div class="reason-line">가입 처리 중...</div>`;
    const err=await sbSignUp(username,pw,name,birthday);
    if(err) statusEl.innerHTML=`<div class="reason-line" style="color:var(--red);">${escapeHtml(err)}</div>`;
    else { showToast("가입 완료 — 자동으로 로그인되었습니다"); renderAll(); }
  });
  wrap.querySelector("#sb-signout")?.addEventListener("click",async ()=>{ await sbSignOut(); showToast("로그아웃되었습니다"); renderAll(); });
}

/* ---------------------------------------------------------------------- */
/* 25. INIT                                                                 */
/* ---------------------------------------------------------------------- */
(async function init(){
  initMobileMenu();
  initDateTextMasking();
  document.getElementById("modal-overlay")?.addEventListener("click",(e)=>{ if(e.target.id==="modal-overlay") closeModal(); });
  await loadState();
  await loadExternalRaceDb();
  await loadDerivedBenchmark();
  renderAll();
  if(sbEnabled()){ await initSupabaseAuth(); renderAll(); }
})();
</script>

<script>
  // HPS cache cleanup.
  // This build does NOT register a service worker. If an older build registered one,
  // remove it and its caches so it cannot keep serving an old index.html.
  (async function(){
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          try { await reg.unregister(); } catch (e) {}
        }
      }
      if (window.caches) {
        const keys = await caches.keys();
        for (const key of keys) {
          try { await caches.delete(key); } catch (e) {}
        }
      }
    } catch (e) {
      console.warn('HPS cache cleanup skipped:', e);
    }
  })();
</script>
