/*         (the existing neutral-default convention already used elsewhere  */
/*         in this app, e.g. Phase 4's overall-HPI projection — reused, not */
/*         a new constant)                                                  */
/*     Calibrating whether "full ceiling on positive trend" is the RIGHT    */
/*     amount is explicitly deferred to Step 2's Backtest comparison, not   */
/*     decided here.                                                       */
/* ---------------------------------------------------------------------- */
function projectSegment(seg, weeksToRace){
  const potential = calculateSegmentPotential(seg, weeksToRace); // constraints 2,3,4,6 — reused wholesale
  const indexKey = potential.indexKey;
  const trend = indexLongTermTrend(indexKey, 8); // constraint 1 — points/week, null if <2 snapshots in window
  let projectedImprovementSec;
  if(trend==null || trend===0) projectedImprovementSec = potential.realisticSec*0.5; // flat/no-data -> neutral midpoint
  else if(trend>0) projectedImprovementSec = potential.realisticSec; // improving -> full realistic ceiling (constraint 5)
  else projectedImprovementSec = 0; // declining -> no improvement projected (sign-only, no invented regression magnitude)
  const projectedSec = clamp(potential.currentSec - projectedImprovementSec, potential.benchmark*0.5, potential.currentSec*1.15); // sanity bounds only
  return { ...potential, indexTrend: trend, projectedImprovementSec: round1(projectedImprovementSec), projectedSec: round1(projectedSec) };
}

/* ---------------------------------------------------------------------- */
/* PHASE 5 STEP 2 — predictTimeSegmentModel(): candidate future-time model, */
/*     assembled ENTIRELY from projectSegment() across the same 17 segments */
/*     buildRaceSegmentModel() already uses. Standalone / parallel to       */
/*     predictTime() — never called by it, never calls it, not wired into  */
/*     recordPredictionSnapshot() or any UI yet. Exists so Step 3's         */
/*     Backtest can compute both models side-by-side on identical data and  */
/*     compare, per the approved Phase 5 promotion criteria (constraint 9/  */
/*     10 in the design doc: never auto-promoted, only after Backtest shows */
/*     a real improvement). No new calibration constant is introduced here  */
/*     — this function only sums what projectSegment() already produces.    */
/* ---------------------------------------------------------------------- */
function predictTimeSegmentModel(weeksToRace){
  const model = buildRaceSegmentModel(); // same current-state model predictTime()'s own Anchor already uses
  const wtr = weeksToRace!=null ? weeksToRace : (daysToRace()!=null ? clamp(daysToRace()/7,0.5,52) : 8);
  const projectedSegments = model.segments.map(seg=>projectSegment(seg, wtr));
  const currentTotalSec = projectedSegments.reduce((s,x)=>s+x.currentSec,0);
  const projectedTotalSec = projectedSegments.reduce((s,x)=>s+x.projectedSec,0);
  const totalImprovementSec = round1(currentTotalSec-projectedTotalSec);
  return { segments:projectedSegments, currentTotalSec:round1(currentTotalSec), projectedTotalSec:round1(projectedTotalSec),
    totalImprovementSec, weeksToRace:wtr, dataCoverage:model.dataCoverage,
    modelVersion:"SEGMENT-CANDIDATE-v0.1" }; // distinct from predictTime()'s MODEL_VERSION="FP-1.0" — never conflated
}

/* ---------------------------------------------------------------------- */
/* PHASE 5 STEP 4-C — predictTimeSegmentModelV2(): Race-level magnitude-    */
/*     aware candidate (frozen regression, validated across 3 independent  */
/*     synthetic seeds in Step 3-E~4-B offline analysis: MAE improvement    */
/*     over both predictTime() and predictTimeSegmentModel()/V1 on every   */
/*     seed's holdout). CANDIDATE/DEBUG ONLY — not called by predictTime(), */
/*     not called by recordPredictionSnapshot(), not shown anywhere in the  */
/*     normal user-facing UI. Segment allocation was tried (Step 4-A) and   */
/*     explicitly REJECTED (hurt Negative-trend cases across all 3 seeds)   */
/*     — this function deliberately stays race-level per Step 4-B's         */
/*     conclusion. The decomposition below is display-only explanation,    */
/*     mathematically exact (see comment on decomposeV2Improvement), and   */
/*     is never read back into the prediction itself.                      */
/* ---------------------------------------------------------------------- */
const V2_COEF = { a: -3.0614, b: 0.6883 }; // frozen — validated on 3 independent seeds, do not retune here
function decomposeV2Improvement(segments, sumTrend){
  // EXACT identity, not an approximation: totalImprovement = a + b*sumTrend
  // = a + b*(Σrunning + Σengine + ΣstrengthEnd + Σskill + ΣraceExec)
  // so each Index's own contribution is exactly b*(that Index's own trend sum); `a` is the regression
  // intercept and isn't attributable to any Index, shown separately. Display-only — see header.
  // bug fix (found via full-cohort verification): rounding each contribution to 1 decimal BEFORE
  // summing them doesn't always reconstruct round1(a+b*sumTrend) exactly (classic "sum of rounded
  // parts != rounded sum" — up to ~0.1s off across 439 real test rows). Returning UNROUNDED
  // contributions/intercept here so contributions+intercept always reconstructs the raw total exactly;
  // rounding for display happens only at render time in the UI template, not in this data.
  const byIndex = { running:0, engine:0, strengthEnd:0, skill:0, raceExec:0 };
  segments.forEach(s=>{ if(byIndex[s.indexKey]!=null) byIndex[s.indexKey] += (s.indexTrend||0); });
  const contributions = {};
  Object.entries(byIndex).forEach(([k,sumForIndex])=>{ contributions[k] = V2_COEF.b*sumForIndex; });
  return { contributions, intercept: V2_COEF.a };
}
function predictTimeSegmentModelV2(weeksToRace){
  const model = buildRaceSegmentModel(); // identical 17-segment current-state anchor as V1 — no re-derivation
  const wtr = weeksToRace!=null ? weeksToRace : (daysToRace()!=null ? clamp(daysToRace()/7,0.5,52) : 8);
  // segments here only need indexKey+indexTrend (for sumTrend and the decomposition) — reuse the exact
  // same per-segment resolution calculateSegmentPotential() already does via segmentIndexKey()/indexLongTermTrend()
  const potentials = model.segments.map(seg=>calculateSegmentPotential(seg, wtr));
  // bug fix (found via real-code vs offline-simulation mismatch): calculateSegmentPotential() itself
  // never sets .indexTrend — that field is only added by projectSegment() (V1's function). Calling
  // indexLongTermTrend() directly here, the same way projectSegment() does, instead of assuming it's
  // already present on calculateSegmentPotential()'s output.
  const potentialsWithTrend = potentials.map(p=>({ ...p, indexTrend: indexLongTermTrend(p.indexKey, 8) }));
  const sumTrend = potentialsWithTrend.reduce((s,x)=>s+(x.indexTrend||0),0);
  const currentTotalSec = potentialsWithTrend.reduce((s,x)=>s+x.currentSec,0);
  const totalImprovementSec = round1(V2_COEF.a + V2_COEF.b*sumTrend);
  // same sanity-bound clamp already used by V1/predictTime() elsewhere — not a new constant
  const projectedTotalSec = round1(clamp(currentTotalSec-totalImprovementSec, currentTotalSec*0.5, currentTotalSec*1.15));
  const decomposition = decomposeV2Improvement(potentialsWithTrend, sumTrend); // DISPLAY ONLY — see function header
  return { currentTotalSec:round1(currentTotalSec), projectedTotalSec, totalImprovementSec, sumTrend:round1(sumTrend),
    weeksToRace:wtr, decomposition, coefficients:V2_COEF, modelVersion:"SEGMENT-CANDIDATE-V2-v0.1" };
}

function buildSegmentGapAnalysis(){
  const model=buildRaceSegmentModel();
  const dRace=daysToRace();
  const hasRaceDate = dRace!=null;
  const weeksToRace = hasRaceDate ? clamp(dRace/7, 0.5, 52) : 8; // no race date set -> neutral 8wk assumption, flagged in UI
  const segments=model.segments.map(s=>calculateSegmentPotential(s, weeksToRace));
  const totals={
    conservative: segments.reduce((s,x)=>s+x.conservativeSec,0),
    realistic:    segments.reduce((s,x)=>s+x.realisticSec,0),
    aggressive:   segments.reduce((s,x)=>s+x.aggressiveSec,0),
  };
  // BUG FIX (audit item #1/#8): this used to always report the 17-segment-model total (model.total)
  // as "현재 예상 기록", regardless of whether getBaselineTime() — the function the 기록 예측 page
  // actually uses — would have trusted a fresher single official race time instead. That's exactly
  // why Goal Setting (segment-model total) and Prediction (fresh-race-first) could disagree even for
  // the SAME division. Now both read through the identical getCurrentPerformanceBaseline() cascade;
  // `model`/`model.total` are kept below for the per-segment breakdown (still real and useful), just
  // no longer used as the top-line number.
  const currentEstimate = getCurrentPerformanceBaseline(calcHPI()).value;
  return { segments, totals, weeksToRace, hasRaceDate, currentEstimate, model };
}

// Target Gap Decomposition (spec §5): allocates the total time gap across segments weighted by
// each segment's OWN realistic potential — a segment that's slow but not very trainable right now
// gets a small share even if its raw gap looks large; a highly-trainable segment gets more.
function calculateTargetGap(){
  const targetSec=parseTimeToSec(STATE.profile.targetTime);
  if(!targetSec) return null;
  const gapAnalysis=buildSegmentGapAnalysis();
  // Goal-aware override for the AGGREGATE current estimate ONLY (see getGoalAwareBaseline() header) —
  // when a separate goalDivision is set and differs from the base division, the top-line "현재 예상
  // 기록"/gap number comes from the same predictDivisionTransition() the Division 전환 예측 page uses,
  // instead of the raw same-division 17-segment sum. Per-segment breakdown below (which still reflects
  // the athlete's OWN training data structure) is intentionally left as-is — reallocating gap seconds
  // across segments the athlete has real data for is still useful context even when the headline number
  // is division-converted; segmentGoalAware.debug records which path was actually used.
  const goalAware=getGoalAwareBaseline(calcHPI());
  const currentEstimate = goalAware.debug.usedConversion ? goalAware.value : gapAnalysis.currentEstimate;
  const totalGapSec=currentEstimate-targetSec; // positive = need to get faster

  if(totalGapSec<=0){
    return { targetSec, totalGapSec, currentEstimate, alreadyMet:true,
      segments:[], gapAnalysis, feasibility:"already-met", goalAwareDebug:goalAware.debug };
  }
  const {realistic:sumRealistic, aggressive:sumAggressive} = gapAnalysis.totals;
  const segments=gapAnalysis.segments.map(s=>{
    const weight = sumRealistic>0 ? s.realisticSec/sumRealistic : 1/gapAnalysis.segments.length;
    return { ...s, allocatedSec: totalGapSec*weight, weight };
  }).sort((a,b)=>b.allocatedSec-a.allocatedSec);

  let feasibility;
  if(totalGapSec<=sumRealistic) feasibility="realistic";
  else if(totalGapSec<=sumAggressive) feasibility="aggressive";
  else feasibility="beyond-model"; // target gap exceeds even the aggressive ceiling summed across all 17 segments

  return { targetSec, totalGapSec, currentEstimate, alreadyMet:false,
    segments, sumRealistic, sumAggressive, feasibility, weeksToRace:gapAnalysis.weeksToRace, hasRaceDate:gapAnalysis.hasRaceDate,
    goalAwareDebug:goalAware.debug };
}

/* ---------------------------------------------------------------------- */
/* 5b. DIVISION TRANSITION PREDICTION ENGINE                               */
/*     Open<->Pro, Doubles->Singles. Real race-pair data takes priority     */
/*     over generic benchmark-gap fallbacks. Direct (station-time) and      */
/*     Secondary (station-induced run degradation) impact are separated,   */
/*     never double-counted: Direct + Secondary + Transition + Residual    */
/*     always reconciles exactly to the observed total time difference.    */
/*     Not surfaced on the Dashboard — see the "모델 설명" page / "Division */
/*     전환 예측" page only.                                                */
/* ---------------------------------------------------------------------- */
// official HYROX sequence: Run1,Ski,Run2,SledPush,Run3,SledPull,Run4,Burpee,Run5,Row,Run6,Carry,Run7,Lunge,Run8,WallBall
const STATION_RUN_MAP = {
  ski:{before:1,after:2}, sledPush:{before:2,after:3}, sledPull:{before:3,after:4}, burpee:{before:4,after:5},
  row:{before:5,after:6}, carry:{before:6,after:7}, lunge:{before:7,after:8}, wallball:{before:8,after:null},
};
// stations whose load actually changes across most division transitions (used for generic fallback estimates)
const LOAD_VARIABLE_STATIONS = ["sledPush","sledPull","carry","lunge","wallball"];

function racesByDivision(div){ return STATE.races.filter(r=>r.division===div).sort((a,b)=>b.date.localeCompare(a.date)); }

// decompose ONE race-pair (same athlete, two divisions) into Direct / Secondary / Transition / Residual,
// reconciling exactly to the observed total time difference (principle: never double-count the same effect).
function decomposeRacePair(raceFrom, raceTo){
  const totalFrom=parseTimeToSec(raceFrom.officialTime), totalTo=parseTimeToSec(raceTo.officialTime);
  if(!totalFrom||!totalTo) return null;
  const runsFrom=RUN_KEYS.map(k=>parseTimeToSec(raceFrom.runs?.[k]));
  const runsTo=RUN_KEYS.map(k=>parseTimeToSec(raceTo.runs?.[k]));
  const validRunDeltas=RUN_KEYS.map((k,i)=> (runsFrom[i]!=null&&runsTo[i]!=null)? runsTo[i]-runsFrom[i] : null).filter(v=>v!=null);
  // "general" run degradation: the portion of run-time change NOT attributable to any specific station
  // (overall fitness/pacing/conditions difference between the two races)
  const generalRunDegradation = validRunDeltas.length? mean(validRunDeltas) : 0;

  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    const secFrom=parseTimeToSec(raceFrom.stations?.[s.key]), secTo=parseTimeToSec(raceTo.stations?.[s.key]);
    if(secFrom!=null && secTo!=null) directImpact[s.key]=secTo-secFrom;
    const map=STATION_RUN_MAP[s.key];
    if(map.after!=null && runsFrom[map.after-1]!=null && runsTo[map.after-1]!=null){
      const afterDelta = runsTo[map.after-1]-runsFrom[map.after-1];
      secondaryImpact[s.key] = afterDelta - generalRunDegradation; // excess beyond general degradation = station-induced
    }
  });
  const transFrom=parseTimeToSec(raceFrom.transition), transTo=parseTimeToSec(raceTo.transition);
  const transitionImpact = (transFrom!=null&&transTo!=null) ? transTo-transFrom : null;

  const directSum=Object.values(directImpact).reduce((a,b)=>a+b,0);
  const secondarySum=Object.values(secondaryImpact).reduce((a,b)=>a+b,0);
  const totalActual = totalTo-totalFrom;
  const accountedSoFar = directSum+secondarySum+(transitionImpact||0);
  const residual = totalActual-accountedSoFar; // whatever the decomposition doesn't explain (general fitness delta, race-day variance, etc.)

  return { fromDate:raceFrom.date, toDate:raceTo.date, totalActual, directImpact, secondaryImpact, transitionImpact, residual, generalRunDegradation, directSum, secondarySum };
}

// find up to maxPairs (fromDivision race, toDivision race) pairs, most recent toDivision race first,
// each paired with its temporally-nearest fromDivision race (within ~9 months if possible)
function pairRacesForTransition(fromDiv, toDiv, maxPairs=5){
  const fromRaces=racesByDivision(fromDiv), toRaces=racesByDivision(toDiv);
  if(!fromRaces.length||!toRaces.length) return [];
  const pairs=[];
  toRaces.slice(0,maxPairs).forEach(toRace=>{
    let best=null, bestGap=Infinity;
    fromRaces.forEach(fromRace=>{
      const gap=Math.abs(daysBetween(fromRace.date, toRace.date));
      if(gap<bestGap){ bestGap=gap; best=fromRace; }
    });
    if(best){
      const d=decomposeRacePair(best, toRace);
      if(d) pairs.push({ ...d, withinWindow: bestGap<=270 });
    }
  });
  return pairs;
}

// recency-weighted personal transition pattern from real race pairs (most recent weighted highest)
function weightedPersonalPattern(pairs){
  if(!pairs.length) return null;
  const weights = pairs.map((_,i)=>Math.pow(0.6,i));
  const wsum=weights.reduce((a,b)=>a+b,0);
  const wAvg=(getter)=>{
    let s=0,ws=0;
    pairs.forEach((p,i)=>{ const v=getter(p); if(v!=null){ s+=v*weights[i]; ws+=weights[i]; } });
    return ws? s/ws : null;
  };
  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    directImpact[s.key]=wAvg(p=>p.directImpact[s.key]);
    secondaryImpact[s.key]=wAvg(p=>p.secondaryImpact[s.key]);
  });
  const transitionImpact=wAvg(p=>p.transitionImpact);
  const residual=wAvg(p=>p.residual);
  // adaptation trend: oldest pair's total loss vs newest pair's total loss
  const sorted=[...pairs].sort((a,b)=>a.toDate.localeCompare(b.toDate));
  const adaptationImprovement = sorted.length>=2 ? (sorted[0].totalActual - sorted[sorted.length-1].totalActual) : null;
  return { directImpact, secondaryImpact, transitionImpact, residual, adaptationImprovement, pairCount:pairs.length };
}

/* ---------------------------------------------------------------------- */
/* SINGLE-PAIR RESIDUAL DISCOUNT (audit item #4/#5/#6 — root cause of the  */
/*   Open Doubles<->Pro Doubles "±1:16 both ways" bug)                      */
/*   decomposeRacePair()'s `residual` is defined as EXACTLY               */
/*     totalActual - (directSum+secondarySum+transitionImpact)             */
/*   for that one race pair. So with exactly one usable pair, feeding      */
/*   residual back in at full weight makes centerDelta reconcile EXACTLY   */
/*   to that single pair's observed total-time difference BY CONSTRUCTION —*/
/*   i.e. predictedCenterNow becomes just "the one real target-division    */
/*   race's actual time", regardless of what the real, physically-grounded */
/*   per-station Direct/Secondary splits say (e.g. Sandbag Lunge +2:47).    */
/*   That is exactly the "residual을 이용해 전환 효과를 거의 0으로 만드는"     */
/*   pattern the audit explicitly asked NOT to use. A single data point    */
/*   cannot separate a genuine division-transition effect from that race's */
/*   own day-to-day variance (pacing, weather, nerves, course), so its     */
/*   residual is heavily discounted (real station-level Direct/Secondary   */
/*   splits — genuine measured per-station deltas — are NOT discounted;    */
/*   only the leftover "unexplained by any station" portion is). 2+ pairs  */
/*   keep full weight (a real trend across multiple races is trustworthy). */
/* ---------------------------------------------------------------------- */
const SINGLE_PAIR_RESIDUAL_WEIGHT = 0.3;
function discountSinglePairResidual(pattern){
  return { ...pattern, residual:(pattern.residual||0)*SINGLE_PAIR_RESIDUAL_WEIGHT, residualDiscounted:true, residualWeight:SINGLE_PAIR_RESIDUAL_WEIGHT };
}

// official HYROX rulebook loaded-weight ratios, Pro/Open (men's Singles, 25/26-26/27 season).
// SkiErg/Row/Burpee/Running carry no added weight in Pro — only these 5 stations get heavier
// (spec §7/§8: weight-standard adjustment applies ONLY to Sled Push/Pull, Farmer Carry, Sandbag
// Lunge, Wall Ball; SkiErg/Row/Burpee/Running get none).
const LOAD_RATIO_OPEN_TO_PRO = { sledPush:202/152, sledPull:153/103, carry:64/48, lunge:30/20, wallball:9/6 };
// documented assumption: time increases sub-linearly with load increase, but NOT uniformly across
// station types. Sled Push/Pull are power/friction-driven (push against resistance) — response to
// added load is fairly linear since technique doesn't change much (~0.8-0.85). Wall Ball/Lunge are
// gravity + muscular-endurance driven — added load compounds with core/joint fatigue late in a long
// set, so the time hit is more severe and non-linear (~0.55-0.6). Farmer Carry sits in between
// (grip/core endurance, moderate non-linearity).
const LOAD_ELASTICITY = { sledPush:0.82, sledPull:0.85, carry:0.68, lunge:0.58, wallball:0.60 };
// SINGLE unified Open<->Pro load-effect engine (spec: "TARGET_DIVISION_STATION_MULT와 LOAD_RATIO_
// OPEN_TO_PRO가 중복으로 존재" — this replaces both, used by every division-transition path in the
// file: genericTransitionEstimate() below AND computeDoublesToSingles() above). Returns the fractional
// TIME CHANGE (e.g. -0.20 = 20% faster) for moving this station from the source weight standard to the
// target weight standard, for THIS athlete's own current pace — 0 when source===target (no weight
// change) or for stations with no documented weight difference (Ski/Row/Burpee/Running).
function divisionLoadAdjustmentPct(stationKey, sourceIsPro, targetIsPro){
  if(sourceIsPro===targetIsPro) return 0;
  const ratio=LOAD_RATIO_OPEN_TO_PRO[stationKey];
  if(!ratio) return 0;
  const elasticity=LOAD_ELASTICITY[stationKey] ?? 0.7;
  if(!sourceIsPro && targetIsPro) return (ratio-1)*elasticity;   // Open -> Pro: heavier, positive (slower)
  if(sourceIsPro && !targetIsPro) return (1/ratio-1)*elasticity; // Pro -> Open: lighter, negative (faster)
  return 0;
}

// generic fallback when no real toDivision race exists: applies the REAL official load-ratio for
// Open<->Pro to the athlete's own current station time (not a population-skill benchmark gap, which
// would conflate "how fast elite Pro athletes are" with "how much slower THIS athlete gets under more load").
function genericTransitionEstimate(fromDiv, toDiv){
  const st=latestStationValues();
  const sourceIsPro = fromDiv.includes("Pro"), targetIsPro = toDiv.includes("Pro");
  const directImpact={}, secondaryImpact={};
  STATIONS.forEach(s=>{
    const userSec=parseTimeToSec(st[s.key]);
    const pctChange = divisionLoadAdjustmentPct(s.key, sourceIsPro, targetIsPro);
    directImpact[s.key] = userSec!=null ? userSec*pctChange : 0;
    // no real before/after run data available in this division -> assume secondary impact is a documented
    // fraction of direct impact, heavier for load-variable (heavy/grip) stations
    const secFrac = LOAD_VARIABLE_STATIONS.includes(s.key) ? 0.28 : 0.12;
    secondaryImpact[s.key] = directImpact[s.key]*secFrac;
  });
  // no documented basis to assume a generic transition-time change between divisions -> leave at 0
  return { directImpact, secondaryImpact, transitionImpact:0, residual:0, adaptationImprovement:null, pairCount:0 };
}

// Range width for Division Transition predictions (spec fix — the old model applied rangePct to
// the ENTIRE predicted total time (baseline + delta), so even a small, uncertain delta on top of a
// large, already-measured baseline (~90min) produced a 20+ minute band. Baseline is a real past race
// result — its own uncertainty is just normal race-day variance, not division-transition uncertainty.
// The genuinely uncertain part is centerDelta (the modeled shift), so most of the range width should
// scale with |centerDelta|, plus a small fixed baseline race-day-variance term.
const TRANSITION_DELTA_UNCERTAINTY_PCT = { High:0.15, Medium:0.30, Low:0.50 };
const TRANSITION_BASELINE_NOISE_PCT   = { High:0.008, Medium:0.012, Low:0.02 }; // race-day variance only
function transitionRangeHalfWidth(centerDelta, baseline, confidence, deltaPctMultiplier=1){
  const deltaPct = (TRANSITION_DELTA_UNCERTAINTY_PCT[confidence] ?? TRANSITION_DELTA_UNCERTAINTY_PCT.Low) * deltaPctMultiplier;
  const noisePct = TRANSITION_BASELINE_NOISE_PCT[confidence] ?? TRANSITION_BASELINE_NOISE_PCT.Low;
  return Math.abs(centerDelta)*deltaPct + baseline*noisePct;
}
function computeDivisionTransition(fromDiv, toDiv){
  if(fromDiv===toDiv) return null;
  const fromRace=racesByDivision(fromDiv)[0];
  // BUG FIX (audit item #1/#2/#3): baseline used to be JUST the single most-recent fromDiv race's
  // officialTime — a third, independent definition of "current estimate", different from both
  // getBaselineTime() (기록 예측) and buildSegmentGapAnalysis() (목표 설정). A stale fromDiv race
  // total, or one where the segment model has better/fresher per-station data, would silently diverge
  // from what those other pages show for the same division. Now goes through the SAME canonical
  // getCurrentPerformanceBaseline() cascade, scoped to fromDiv — still gated on fromRace existing
  // (need at least one real race in fromDiv to have any transition basis at all; same gate as before).
  const baseline = fromRace ? getCurrentPerformanceBaseline(calcHPI(), fromDiv).value : null;
  const pairs = pairRacesForTransition(fromDiv, toDiv, 5);
  const usablePairs = pairs.filter(p=>Object.keys(p.directImpact).length>=3); // need reasonable station coverage
  let pattern, confidence, mode;
  if(usablePairs.length>=2){ pattern=weightedPersonalPattern(usablePairs); confidence="High"; mode="personal"; }
  else if(usablePairs.length===1){ pattern=discountSinglePairResidual(weightedPersonalPattern(usablePairs)); confidence="Medium"; mode="personal-1pair"; }
  else { pattern=genericTransitionEstimate(fromDiv,toDiv); confidence= fromRace? "Low":"Low"; mode="generic"; }
  if(!baseline) return null; // need at least a fromDivision race to project from

  const directSum=Object.values(pattern.directImpact).reduce((a,b)=>a+(b||0),0);
  const secondarySum=Object.values(pattern.secondaryImpact).reduce((a,b)=>a+(b||0),0);
  const transitionImpact=pattern.transitionImpact||0;
  const residual=pattern.residual||0;
  let centerDelta = directSum+secondarySum+transitionImpact+residual;

  // Pro/division-specific adaptation: if personal trend shows improving transition loss, extrapolate
  // a conservative half of the observed improvement forward
  let adaptationNote=null;
  if(pattern.adaptationImprovement!=null && pattern.adaptationImprovement>0){
    const adj = pattern.adaptationImprovement*0.5;
    centerDelta -= adj;
    adaptationNote = `과거 전환 손실이 개선 추세 (최근 ${round1(pattern.adaptationImprovement)}초 단축) → 절반만 반영해 -${round1(adj)}초 보정`;
  }

  const rangePct = { High:0.04, Medium:0.08, Low:0.15 }[confidence]; // kept only for back-compat display/labels
  const predictedCenterNow = baseline+centerDelta;
  const halfWidthNow = transitionRangeHalfWidth(centerDelta, baseline, confidence);
  const predictedNow = { low:predictedCenterNow-halfWidthNow, high:predictedCenterNow+halfWidthNow };

  // "8주 특화훈련 후": scale down the heavy-station direct+secondary impact by projected
  // Strength/Engine index improvement over 8 weeks (reuses the existing HPI growth-rate model)
  const hpiResult=calcHPI();
  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const projectedGainPts = clamp(growth*8*0.92, 0, 15); // same diminishing-returns damping as predictTime()
  const adaptationFactor = clamp(1-(projectedGainPts/100)*1.4, 0.6, 1.0); // heavy-station impact shrinks with fitness gain
  const centerDeltaAfterTraining = (directSum+secondarySum)*adaptationFactor + transitionImpact + residual - (adaptationNote? pattern.adaptationImprovement*0.5:0);
  const predictedCenterAfter = baseline+centerDeltaAfterTraining;
  const halfWidthAfter = transitionRangeHalfWidth(centerDeltaAfterTraining, baseline, confidence)*0.85; // slightly tighter — training reduces the delta itself, and its uncertainty with it
  const predictedAfterTraining = { low:predictedCenterAfter-halfWidthAfter, high:predictedCenterAfter+halfWidthAfter };

  const breakdown = STATIONS.map(s=>({
    key:s.key, label:s.label,
    direct:pattern.directImpact[s.key]||0, secondary:pattern.secondaryImpact[s.key]||0,
  })).sort((a,b)=>(b.direct+b.secondary)-(a.direct+a.secondary));

  return {
    fromDiv, toDiv, mode, confidence, baseline, pairCount:pattern.pairCount,
    directSum, secondarySum, transitionImpact, residual, adaptationNote,
    centerDelta, predictedCenterNow, abnormal: baseline>0 && Math.abs(centerDelta)>baseline*0.30, sanityCapPct:0.30,
    predictedNow, predictedAfterTraining, breakdown, topStations:breakdown.slice(0,3),
  };
}

/* Doubles -> Singles: driven by the athlete's OWN workload share per station in the doubles race.
   Per spec: if share data is missing, do NOT assume an even 50:50 split — flag high uncertainty instead. */
// per-station secondary (post-station fatigue spillover) multiplier — replaces the old flat 0.30
// for every station (spec §5). Reflects that heavy-load stations (Sled Push/Pull) carry more fatigue
// forward than skill/cardio-dominant stations (SkiErg/Row), with Lunge/Wall Ball (muscular endurance)
// in between. Always < 1 so secondary can never exceed direct impact for a given station.
const STATION_SECONDARY_MULT = {
  sledPush:0.35, sledPull:0.35,   // 높은 fatigue 영향
  lunge:0.30, wallball:0.30,      // muscular endurance 영향
  ski:0.20, row:0.20,             // 기존 심폐 능력 의존 — 상대적으로 적은 fatigue 전이
  burpee:0.25, carry:0.25,        // 복합적 영향
};
// modest, capped adjustment from the athlete's OWN existing HPI sub-score for that station's group
// (spec §3: Strength Endurance/Engine Index as supporting signal) — never fabricated, 1.0 (no
// adjustment) when the relevant index has no score yet.
function stationCapacityModifier(stationKey, hpiResult){
  const groupIndexMap = { ski:"engine", row:"engine", burpee:"engine", sledPush:"strengthEnd", sledPull:"strengthEnd", lunge:"strengthEnd", carry:"strengthEnd", wallball:"skill" };
  const idxKey = groupIndexMap[stationKey];
  const score = idxKey ? hpiResult.indices[idxKey]?.score : null;
  if(score==null) return 1.0;
  return clamp(1.15-(score/100)*0.30, 0.85, 1.15); // strong capacity(100) -> 0.85x, weak(0) -> 1.15x
}
// Non-linear, capped workload extrapolation (spec §2): personal share% is a WEAK supporting signal
// about how much of the total reps the athlete did — NOT a literal 1/share% time multiplier (that
// blows up unboundedly as share -> 0, which was the root cause of the 30+ minute mispredictions).
// Blends a typical even-split solo/doubles elapsed-time ratio (~1.6x, from a workload that's genuinely
// split roughly 50/50) with the naive share-based signal, weighted toward the naive signal only as
// share moves further from 50%, and hard-caps the result regardless of how extreme the input is.
function estimateSoloStationSec(doublesSec, sharePctRaw){
  const sharePct = clamp(Number(sharePctRaw)||50, 20, 80);
  const naiveRatio = 1/(sharePct/100);
  const typicalSoloRatio = 1.6;
  const distanceFrom50 = Math.abs(sharePct-50)/50; // 0 at 50%, 1 at the 20/80 clamp edges
  const blendedRatio = typicalSoloRatio*(1-distanceFrom50*0.5) + naiveRatio*(distanceFrom50*0.5);
  return doublesSec * clamp(blendedRatio, 1.15, 2.2);
}
// Fixed, confidence-tier range widths for Doubles->Singles specifically (spec §6): the CENTER estimate
// (baseline + centerDelta) is computed entirely separately, first, from real/estimated data. Only
// AFTER that is the display range applied — as a fixed absolute width by confidence tier, never as a
// percentage of the total predicted time and never scaled by how large centerDelta itself is (that
// coupling was what let a big, possibly-overestimated centerDelta drag the range even wider).
const DOUBLES_TRANSITION_RANGE_SEC = { High:210, Medium:360, Low:540 }; // ±3.5min / ±6min / ±9min (midpoints of the requested 3-4/5-7/8-10min bands)
// Target-DIVISION (Open vs Pro) implement-weight adjustment — UNIFIED with the real official-weight
// model (LOAD_RATIO_OPEN_TO_PRO / LOAD_ELASTICITY, defined below with genericTransitionEstimate) so
// there is exactly ONE Open<->Pro load-effect engine, used by both the Doubles->Singles path here AND
// the plain Singles<->Singles transition path. Earlier this file had a second, much weaker, made-up
// multiplier table (TARGET_DIVISION_STATION_MULT, ±10-15%) that produced a barely-visible Open vs Pro
// gap — replaced outright. divisionLoadAdjustmentPct() itself is defined below (needs LOAD_RATIO_OPEN_
// TO_PRO/LOAD_ELASTICITY, declared further down this file — safe because this is only ever CALLED
// later at runtime, never evaluated at top-level parse time, so no temporal-dead-zone issue).
// STEP 1 (spec): personal baseline from MULTIPLE recent races in that division when available, not
// just the single most recent one — recency-weighted (0.65^i decay, most recent race = full weight)
// so older races still count but contribute less. Falls back to the single race untouched when only
// one exists (no behavior change for the common case). Synthesizes a race-shaped object so every
// downstream consumer (computeDoublesToSingles, pairRacesForTransition, etc.) works unmodified.
function buildWeightedDivisionBaseline(div){
  const races = racesByDivision(div); // already sorted most-recent-first
  if(!races.length) return null;
  if(races.length===1) return races[0];
  const weights = races.map((r,i)=>Math.pow(0.65,i));
  const wAvg = (getter)=>{
    let sum=0, wgt=0;
    races.forEach((r,i)=>{ const v=getter(r); if(v!=null){ sum+=v*weights[i]; wgt+=weights[i]; } });
    return wgt>0 ? sum/wgt : null;
  };
  const officialTimeSec = wAvg(r=>parseTimeToSec(r.officialTime));
  const stations={};
  STATIONS.forEach(s=>{ const sec=wAvg(r=>parseTimeToSec(r.stations?.[s.key])); if(sec!=null) stations[s.key]=fmtTime(sec); });
  const runs={};
  RUN_KEYS.forEach(k=>{ const sec=wAvg(r=>parseTimeToSec(r.runs?.[k])); if(sec!=null) runs[k]=fmtTime(sec); });
  const transitionSec = wAvg(r=>parseTimeToSec(r.transition));
  return { name:`${div} (최근 ${races.length}건 가중평균)`, date:races[0].date, division:div,
    officialTime: officialTimeSec!=null? fmtTime(officialTimeSec) : races[0].officialTime,
    stations, runs, transition: transitionSec!=null? fmtTime(transitionSec) : races[0].transition,
    share: races[0].share||{}, // share% isn't meaningfully averageable across different partners/races — use most recent
    _weightedFromCount: races.length };
}
// STEP 10 (spec): prediction range decomposed by domain (Station/Fatigue/Transition — Running itself
// carries minimal DIVISION-driven uncertainty per spec §6, since division differences flow through
// station+fatigue, not running directly) instead of one flat confidence-tier number. Each domain's
// uncertainty scales with the SIZE of that domain's own estimated effect (a bigger extrapolated
// effect carries more absolute uncertainty) and shrinks as confidence improves.
const DOMAIN_UNCERTAINTY_PCT = { High:0.12, Medium:0.22, Low:0.35 };
function computeDomainUncertainty(confidence, singlesConversionSum, divisionAdjSum, secondarySum, transitionImpact, residual, baseline){
  const pct = DOMAIN_UNCERTAINTY_PCT[confidence] ?? DOMAIN_UNCERTAINTY_PCT.Low;
  const stationUnc = (Math.abs(singlesConversionSum)+Math.abs(divisionAdjSum))*pct;
  const fatigueUnc = Math.abs(secondarySum)*pct*1.2; // fatigue extrapolation carries somewhat more uncertainty than direct station time
  const transitionUnc = Math.abs(residual||0)*pct;
  const baselineNoise = baseline*0.008; // small fixed race-day variance term, same principle used in the division-transition range fix
  const total = clamp(stationUnc+fatigueUnc+transitionUnc+baselineNoise, 75, 600);
  return { stationUnc, fatigueUnc, transitionUnc, baselineNoise, total };
}
// STEP config separation (spec): named groupings over the existing constants/functions above —
// organizational only, no values or logic changed, so a future real-DB calibration pass has a clear
// place to update coefficients without hunting through the file. Written as functions (not eagerly
// evaluated const objects) because some referenced constants are declared later in the file —
// referencing them directly in a top-level const here would throw a temporal-dead-zone ReferenceError
// on page load and crash the whole script (this was a real bug, caught via a headless load test).
function DIVISION_FACTORS(){ return { peerBenchmark: PEER_DIVISION_ADJUST, loadRatioOpenToPro: LOAD_RATIO_OPEN_TO_PRO }; }
function SINGLES_FACTORS(){ return { doublesStationFactor: DOUBLES_STATION_FACTOR, estimateSoloStationSec }; }
function FATIGUE_FACTORS(){ return { secondaryMult: STATION_SECONDARY_MULT, capacityModifier: stationCapacityModifier, domainUncertaintyPct: DOMAIN_UNCERTAINTY_PCT, loadElasticity: LOAD_ELASTICITY }; }
function TRANSITION_FACTORS(){ return { legacyRangeSec: DOUBLES_TRANSITION_RANGE_SEC }; }
function computeDoublesToSingles(fromDiv, toDiv){
  const doublesRace = buildWeightedDivisionBaseline(fromDiv);
  if(!doublesRace) return null;
  // review fix (#1): baseline used to be JUST this weighted-average officialTime, a separate
  // definition from getBaselineTime()'s cascade (fresh race > segment model > stale race > benchmark)
  // that every other page (기록예측/목표설정/Singles<->Singles Division 전환) already goes through via
  // getCurrentPerformanceBaseline(). doublesRace itself is still used below for its per-station
  // `stations`/`share` breakdown (buildWeightedDivisionBaseline's weighted-average station splits are
  // real, useful signal for the solo-conversion math) — only the top-line total baseline is now canonical.
  const baseline = getCurrentPerformanceBaseline(calcHPI(), fromDiv).value;
  if(!baseline) return null;
  const share = doublesRace.share || {};
  const hasShareData = STATIONS.some(s=>share[s.key]!=null && share[s.key]!=="");
  const singlesRaces = racesByDivision(toDiv);
  const st = latestStationValues();
  const hpiResult = calcHPI();
  const stationMeta = getStationDataMeta();
  // bug fix + unification: sourceIsPro/targetIsPro feed the SAME divisionLoadAdjustmentPct() engine
  // used by genericTransitionEstimate() below — previously toDiv was only used to look up real races
  // (mode="personal" path), so the workload-extrapolation path produced nearly-identical numbers
  // regardless of target division, and a second/weaker made-up multiplier table existed in parallel.
  const sourceIsPro = fromDiv.includes("Pro");
  const targetIsPro = toDiv==="Pro";

  const directImpact={}, secondaryImpact={}, singlesConversionImpact={}, divisionAdjImpact={};
  let confidence, mode;
  if(singlesRaces.length){
    // best case: real singles race also exists for THIS specific target division — decompose
    // directly. Real data already reflects the correct division inherently (pairRacesForTransition
    // filters races BY toDiv), so no separate division-adjustment term is needed here.
    const pairs=pairRacesForTransition(fromDiv, toDiv, 3);
    const usable=pairs.filter(p=>Object.keys(p.directImpact).length>=3);
    if(usable.length){
      // audit item #4/#5: same single-pair residual discount as computeDivisionTransition() —
      // see discountSinglePairResidual() header. With exactly one pair, residual reconciles exactly
      // to that one pair's observed total difference by construction and is not trustworthy at full weight.
      const pattern = usable.length>=2 ? weightedPersonalPattern(usable) : discountSinglePairResidual(weightedPersonalPattern(usable));
      Object.assign(directImpact,pattern.directImpact); Object.assign(secondaryImpact,pattern.secondaryImpact);
      Object.assign(singlesConversionImpact,pattern.directImpact); // real data: no separate division term to split out
      // spec §9: 2+ real Doubles+Singles pairs -> High; a single real pair is still real personal data,
      // but one data point isn't enough to call High confidence -> Medium.
      confidence = usable.length>=2? "High":"Medium"; mode = usable.length>=2? "personal":"personal-1pair";
      var transitionImpact=pattern.transitionImpact||0, residual=pattern.residual||0, adaptationImprovement=pattern.adaptationImprovement;
    }
  }
  if(!Object.keys(directImpact).length){
    mode="workload";
    if(!hasShareData){
      confidence="Low";
      // no share info at all: cannot personalize -> generic doubles-station-factor reversal, explicitly flagged
      STATIONS.forEach(s=>{
        const doublesSec=parseTimeToSec(doublesRace.stations?.[s.key]);
        if(doublesSec!=null){
          const soloEstimate = doublesSec/DOUBLES_STATION_FACTOR;
          const baseDirect = soloEstimate-doublesSec; // division-neutral "singles conversion" (workload only)
          // real official-rulebook load effect (spec §6-10) — same divisionLoadAdjustmentPct() engine
          // as genericTransitionEstimate() below, applied to the FULL solo-estimate station time (not
          // just the incremental workload delta), so the magnitude matches an athlete's real per-station time.
          const pctChange = divisionLoadAdjustmentPct(s.key, sourceIsPro, targetIsPro);
          const divAdj = soloEstimate*pctChange;
          singlesConversionImpact[s.key]=baseDirect; divisionAdjImpact[s.key]=divAdj;
          directImpact[s.key]=baseDirect+divAdj;
          const mult=(STATION_SECONDARY_MULT[s.key]??0.25)*stationCapacityModifier(s.key,hpiResult);
          secondaryImpact[s.key]=directImpact[s.key]*mult;
        }
      });
    } else {
      // spec §9: share% alone (no supplementary station-test coverage) only earns Low confidence —
      // having a number typed into a field isn't the same as strong personalized evidence.
      const stationsWithShare = STATIONS.filter(s=>share[s.key]!=null&&share[s.key]!=="");
      const freshTestCoverage = stationsWithShare.length
        ? stationsWithShare.filter(s=>stationMeta[s.key]?.isFresh).length/stationsWithShare.length : 0;
      confidence = (stationsWithShare.length===STATIONS.length && freshTestCoverage>=0.5) ? "Medium" : "Low";
      STATIONS.forEach(s=>{
        const doublesSec=parseTimeToSec(doublesRace.stations?.[s.key]);
        const sharePct=Number(share[s.key]);
        if(doublesSec!=null && sharePct>0){
          const soloEstimate = estimateSoloStationSec(doublesSec, sharePct);
          const baseDirect = soloEstimate-doublesSec; // division-neutral "singles conversion" (workload consolidation only)
          const pctChange = divisionLoadAdjustmentPct(s.key, sourceIsPro, targetIsPro);
          const divAdj = soloEstimate*pctChange; // real official-rulebook load effect, applied to the full solo-estimate time
          singlesConversionImpact[s.key]=baseDirect; divisionAdjImpact[s.key]=divAdj;
          directImpact[s.key] = baseDirect+divAdj;
          const mult=(STATION_SECONDARY_MULT[s.key]??0.25)*stationCapacityModifier(s.key,hpiResult);
          secondaryImpact[s.key] = directImpact[s.key]*mult; // capped below direct impact by construction (mult<1)
        }
      });
    }
  }
  const transImpact = typeof transitionImpact!=="undefined" ? transitionImpact : 0;
  const resid = typeof residual!=="undefined" ? residual : 0;
  let directSum=Object.values(directImpact).reduce((a,b)=>a+(b||0),0);
  let secondarySum=Object.values(secondaryImpact).reduce((a,b)=>a+(b||0),0);
  let singlesConversionSum=Object.values(singlesConversionImpact).reduce((a,b)=>a+(b||0),0);
  let divisionAdjSum=Object.values(divisionAdjImpact).reduce((a,b)=>a+(b||0),0);
  let centerDelta = directSum+secondarySum+transImpact+resid;

  // spec §7: sanity check — if the estimated (non-real-pair) transition loss exceeds 30% of the
  // baseline, that's not a plausible Division-transition result; scale the extrapolated portion down
  // to the 30% ceiling and flag it, rather than silently presenting an implausible number as normal.
  const SANITY_CAP_PCT = 0.30;
  let sanityCapped=false;
  if(mode==="workload" && baseline>0 && centerDelta > baseline*SANITY_CAP_PCT){
    const capTarget = baseline*SANITY_CAP_PCT;
    const scale = capTarget/centerDelta;
    Object.keys(directImpact).forEach(k=>directImpact[k]*=scale);
    Object.keys(secondaryImpact).forEach(k=>secondaryImpact[k]*=scale);
    Object.keys(singlesConversionImpact).forEach(k=>singlesConversionImpact[k]*=scale);
    Object.keys(divisionAdjImpact).forEach(k=>divisionAdjImpact[k]*=scale);
    directSum*=scale; secondarySum*=scale; singlesConversionSum*=scale; divisionAdjSum*=scale;
    centerDelta = directSum+secondarySum+transImpact+resid;
    sanityCapped=true;
  }
  const abnormal = baseline>0 && Math.abs(centerDelta) > baseline*SANITY_CAP_PCT; // still flag even for mode==="personal" (real data can be surprising, but the person should know)

  const predictedCenterNow = baseline+centerDelta;
  // STEP 10 (spec): domain-decomposed uncertainty (Station/Fatigue/Transition) instead of one flat
  // confidence-tier width — see computeDomainUncertainty above.
  const domainUncertainty = computeDomainUncertainty(confidence, singlesConversionSum, divisionAdjSum, secondarySum, transImpact, resid, baseline);
  const halfWidthNow = domainUncertainty.total;
  const predictedNow = { low:predictedCenterNow-halfWidthNow, high:predictedCenterNow+halfWidthNow };

  const growth = hpiTrendPerWeek() ?? defaultWeeklyGrowth(currentPhase());
  const projectedGainPts = clamp(growth*8*0.92, 0, 15);
  const adaptationFactor = clamp(1-(projectedGainPts/100)*1.4, 0.6, 1.0);
  const centerDeltaAfter = (directSum+secondarySum)*adaptationFactor+transImpact+resid;
  const predictedCenterAfter = baseline+centerDeltaAfter;
  const halfWidthAfter = halfWidthNow*0.85;
  const predictedAfterTraining = { low:predictedCenterAfter-halfWidthAfter, high:predictedCenterAfter+halfWidthAfter };

  const breakdown = STATIONS.map(s=>({ key:s.key, label:s.label, direct:directImpact[s.key]||0, secondary:secondaryImpact[s.key]||0 }))
    .sort((a,b)=>(b.direct+b.secondary)-(a.direct+a.secondary));

  return { fromDiv, toDiv, mode, confidence, baseline, hasShareData, directSum, secondarySum,
    singlesConversionSum, divisionAdjSum, sourceWeightClass: sourceIsPro?"Pro":"Open", targetWeightClass: targetIsPro?"Pro":"Open", domainUncertainty,
    weightedFromCount: doublesRace._weightedFromCount || 1,
    transitionImpact:transImpact, residual:resid, centerDelta, predictedCenterNow, predictedNow, predictedAfterTraining,
    breakdown, topStations:breakdown.slice(0,3), sanityCapped, abnormal, sanityCapPct:SANITY_CAP_PCT };
}

function isDoublesDiv(d){ return (d||"").includes("Doubles"); }
function predictDivisionTransition(fromDiv, toDiv){
  if(isDoublesDiv(fromDiv) && !isDoublesDiv(toDiv)) return computeDoublesToSingles(fromDiv, toDiv);
  return computeDivisionTransition(fromDiv, toDiv);
}

/* ---------------------------------------------------------------------- */
/* AUDIT SELF-TEST SUITE (2026-08 baseline-consistency pass)               */
/*   Run from the browser console: runHpsAudit()                           */
/*   Covers Test 1-7 (baseline audit request) + Test A/D (DNA audit        */
/*   request). Read-only — restores STATE.profile exactly afterward via    */
/*   withDivisionContext()/manual snapshot, never persists/saves anything. */
/* ---------------------------------------------------------------------- */
function runHpsAudit(){
  const results=[]; const log=(name,pass,detail)=>{ results.push({name,pass,detail}); console.log(`[HPS AUDIT] ${pass?"PASS":"FAIL"} — ${name}: ${detail}`); };
  const snapDivision=STATE.profile.division, snapGoal=STATE.profile.goalDivision;
  // review item #2: Open<->Pro physical-load expectation. When mode==="generic" (no real race-pair
  // data at all) the load model is the ONLY thing driving the result, so an inversion there is a real
  // bug and hard-fails. When real personal-pair data is involved (mode starts with "personal"), the
  // athlete's own measured splits are legitimate signal and are allowed to disagree with the generic
  // physical expectation — that's reported side-by-side, never hard-failed, exactly as requested.
  function checkDivisionDirection(conv, fromDiv, toDiv){
    const sourceIsPro = fromDiv.includes("Pro"), targetIsPro = toDiv.includes("Pro");
    if(sourceIsPro===targetIsPro) return null; // not an Open<->Pro pair — no physical-load expectation to check
    const expectSlower = !sourceIsPro && targetIsPro; // Open->Pro should get slower (delta>=0); Pro->Open faster (delta<=0)
    const observedSlower = conv.centerDelta>=0;
    return { expectSlower, observedSlower, directionMatches: expectSlower===observedSlower, centerDelta:conv.centerDelta };
  }
  try{
    const divs = DIVISIONS.filter(d=>racesByDivision(d).length>0);
    if(divs.length<1){ console.log("[HPS AUDIT] no race data on file — cannot run baseline tests."); return { results, skipped:true }; }

    divs.forEach(div=>{
      STATE.profile.division = div; STATE.profile.goalDivision = "";
      const hpi = calcHPI();
      const baselineResult = getBaselineTime(hpi);
      const predictionBaseline = baselineResult.value;
      const goalBaseline = buildSegmentGapAnalysis().currentEstimate;
      const match = Math.abs(predictionBaseline-goalBaseline) < 0.5; // sub-second float tolerance
      log(`Test 1/2 — ${div} 기록예측 vs 목표설정 baseline 일치`, match,
        `기록예측=${fmtTime(predictionBaseline)}, 목표설정=${fmtTime(goalBaseline)}`);
      if(baselineResult.benchmarkSources){
        log(`Test 1/2 — ${div} 최종 benchmark fallback 사용 시 transition 소스`, true,
          `source=${baselineResult.benchmarkSources.transition} (경기 기록·segment 실측 모두 없어 전체가 benchmark 추정치인 경우에만 나타남)`);
      }
    });

    // Test 3/4/6/7 — Division transition, both directions, for every ordered pair of divisions with data
    for(let i=0;i<divs.length;i++) for(let j=0;j<divs.length;j++){
      if(i===j) continue;
      const fromDiv=divs[i], toDiv=divs[j];
      STATE.profile.division=fromDiv; STATE.profile.goalDivision="";
      const conv=predictDivisionTransition(fromDiv,toDiv);
      if(!conv){ log(`Test 3/4 — ${fromDiv} → ${toDiv}`, true, "변환 불가(데이터 없음) — 스킵"); continue; }
      log(`Test 3/4 — ${fromDiv} → ${toDiv}`, true,
        `pairCount=${conv.pairCount ?? "n/a"}, confidence=${conv.confidence}, mode=${conv.mode}, predictedCenterNow=${fmtTime(conv.predictedCenterNow)}, topStations=${(conv.topStations||[]).map(s=>s.label).join(",")}`);
      if((conv.pairCount??0)===1){
        log(`Test 6 — ${fromDiv} → ${toDiv} 1쌍 데이터 confidence/residual 처리`,
          conv.confidence==="Medium", `confidence=${conv.confidence} (Medium 기대), mode 관련 residual 할인 적용됨`);
      }
      if((conv.pairCount??0)>=2){
        log(`Test 7 — ${fromDiv} → ${toDiv} 2쌍+ personal trend 반영`,
          conv.confidence==="High", `confidence=${conv.confidence} (High 기대)`);
      }
      const dir = checkDivisionDirection(conv, fromDiv, toDiv);
      if(dir){
        if(conv.mode==="generic"){
          log(`Test Dir — ${fromDiv} → ${toDiv} 물리모델 방향성 (데이터 없음, 순수 load model)`, dir.directionMatches,
            `기대=${dir.expectSlower?"느려짐(Pro가 더 부담)":"빨라짐"}, 관측 delta=${round1(dir.centerDelta)}초`);
        } else {
          log(`Test Dir — ${fromDiv} → ${toDiv} 물리모델 vs 실측 방향 (참고용, 실측 데이터 우선이라 FAIL 처리 안 함)`, true,
            `물리모델 기대=${dir.expectSlower?"느려짐":"빨라짐"} · 실측 기반 관측=${dir.observedSlower?"느려짐":"빨라짐"} (delta=${round1(dir.centerDelta)}초, mode=${conv.mode})`
            + (dir.directionMatches?"":" ⚠ 실측이 물리모델과 반대 방향 — 개인 데이터가 그렇게 나타남, 데이터 더 쌓이면 재확인 권장"));
        }
      }
    }

    // Test 5 — switching division and back doesn't corrupt STATE or leak cross-division data
    const beforeRaceCount = STATE.races.length;
    const beforeDivision = snapDivision;
    STATE.profile.division = divs[0];
    STATE.profile.goalDivision = divs[1]||"";
    STATE.profile.division = beforeDivision;
    STATE.profile.goalDivision = snapGoal;
    log("Test 5 — Division 왕복 후 STATE 손상 없음", STATE.races.length===beforeRaceCount && STATE.profile.division===beforeDivision,
      `races.length ${beforeRaceCount}→${STATE.races.length}, division ${beforeDivision}→${STATE.profile.division}`);

    // Test A — DNA "나의 강점"에 Run 1~8이 개별 항목으로 나오지 않는지
    STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;
    const peer = computePeerAnalysis();
    if(peer){
      const top3 = buildStrengthsTop3(peer.segments);
      const anyIndividualRun = top3.some(s=>/^Run\s*\d/.test(s.label));
      log("Test A — DNA 나의 강점에 Run 1~8 개별 노출 없음", !anyIndividualRun, `top3 labels=${top3.map(s=>s.label).join(", ")}`);
    } else {
      log("Test A — DNA 나의 강점", true, "peer 분석 데이터 없음 — 스킵");
    }

    // Test RUN-DNA-01~10 (§27-12) — Run 1~8이 Station과 동일한 percentile/Z-score 파이프라인을
    // 실제로 통과하는지 검증. computePeerAnalysis()가 이미 만든 segments만 검사 — 새 계산 없음.
    if(peer){
      const runSegs = peer.segments.filter(s=>s.kind==="run");
      const runsWithActual = runSegs.filter(s=>s.actual!=null);
      log("TEST RUN-DNA-01 — 실측 있는 Run의 peerMean 존재", runsWithActual.every(s=>s.peerMean!=null),
        runsWithActual.map(s=>`${s.label}:${s.peerMean!=null?"OK":"MISSING"}`).join(", ")||"실측 Run 없음 — 스킵");
      log("TEST RUN-DNA-02 — 실측 있는 Run의 Z-score가 null 아님", runsWithActual.every(s=>s.z!=null),
        runsWithActual.map(s=>`${s.label}:z=${s.z!=null?round1(s.z):"null"}`).join(", ")||"실측 Run 없음 — 스킵");
      log("TEST RUN-DNA-03 — 실측 있는 Run의 percentile이 null 아님", runsWithActual.every(s=>s.percentile!=null),
        runsWithActual.map(s=>`${s.label}:${s.percentile!=null?round1(s.percentile)+"%":"null"}`).join(", ")||"실측 Run 없음 — 스킵");
      const fasterIsHigher = runsWithActual.every(s=> s.actual>=s.peerMean ? s.percentile<=50.5 : s.percentile>=49.5);
      log("TEST RUN-DNA-04 — Run percentile 방향(빠를수록 높음) 정상", fasterIsHigher,
        runsWithActual.map(s=>`${s.label}:${s.actual<s.peerMean?"<":">="}mean→${round1(s.percentile)}%`).join(", ")||"실측 Run 없음 — 스킵");
      log("TEST RUN-DNA-05 — Running Index가 Run 실측 percentile 평균과 일치",
        runsWithActual.length ? Math.abs(peer.strengthIdx.running - mean(runsWithActual.map(s=>s.percentile))) < 0.01 : true,
        runsWithActual.length ? `running=${round1(peer.strengthIdx.running)}, mean(runPct)=${round1(mean(runsWithActual.map(s=>s.percentile)))}` : "실측 Run 없음 — 스킵");
      const staticFallbackRuns = runsWithActual.filter(s=>s.benchmarkSource==="STATIC_FALLBACK");
      log("TEST RUN-DNA-06 — 실측 Run이 STATIC_FALLBACK으로 떨어지지 않음(데이터 있을 때)",
        staticFallbackRuns.length===0 || EXTERNAL_RACE_DB.length===0,
        staticFallbackRuns.length ? `STATIC_FALLBACK: ${staticFallbackRuns.map(s=>s.label).join(", ")} (EXTERNAL_RACE_DB=${EXTERNAL_RACE_DB.length}건)` : "정상");
      const top3S = buildStrengthsTop3(peer.segments), top3I = buildImprovementTop3(peer.impactList, peer.race);
      log("TEST RUN-DNA-07 — Run이 강점/개선 TOP3에 개별 노출되지 않음",
        !top3S.some(s=>/^Run\s*\d/.test(s.label)) && !top3I.some(s=>/^Run\s*\d/.test(s.label)),
        `강점=${top3S.map(s=>s.label).join(",")} · 개선=${top3I.map(s=>s.label).join(",")}`);
      log("TEST RUN-DNA-08 — Run 1~8이 하나의 Running 그룹으로 집계 가능", runSegs.length===8, `run segment=${runSegs.length}/8`);
      const dataRich = runsWithActual.filter(s=>s.peerIsReal);
      log("TEST RUN-DNA-09 — 실측 표본 충분한 Run이 데이터부족 표시 안 됨",
        dataRich.every(s=>s.percentile!=null), dataRich.length?`실제데이터 Run ${dataRich.length}개 모두 percentile 있음`:"실제(peerIsReal) Run 없음 — 스킵");
      log("TEST RUN-DNA-10 — Division/Gender/AgeGroup 변경 시 Run peer 통계 재계산 구조", true,
        "computePeerAnalysis()는 호출마다 STATE.profile 기준 groupFilters를 새로 만듦 — 캐시 없음");
    } else {
      log("TEST RUN-DNA-01~10", true, "peer 분석 데이터 없음 — 스킵");
    }

    // Test ASIA — per-segment derived-benchmark key-mapping verification (strengthened per follow-up
    // request): "적어도 하나는 매칭됨" 수준이 아니라, 17개 segment 각각에 대해 getSegmentBenchmarkSec()가
    // "매칭 가능하다"고 답하는데도 실제 resolveSegment() 결과가 STATIC_FALLBACK이면 그건 key 매핑 버그이므로
    // FAIL 처리한다. 매칭 가능한 row가 애초에 없는 경우(division/gender/ageBand 조합의 실측 표본 자체가 없음)는
    // STATIC_FALLBACK이 정상이므로 FAIL이 아니다.
    STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;
    if(DERIVED_BENCHMARK.length){
      const model = buildRaceSegmentModel();
      const runSegs = model.segments.filter(s=>s.type==="run");
      const stationSegs = model.segments.filter(s=>s.type==="station");
      const transSeg = model.segments.find(s=>s.type==="transition");
      const isDerived = s => !!(s.benchmarkSource && s.benchmarkSource!=="STATIC_FALLBACK");

      runSegs.forEach(s=>log(`Test ASIA-Run — ${s.label} (key=${s.key}) benchmark source`, true,
        `basis=${s.basis}, benchmarkSource=${s.benchmarkSource||"STATIC_FALLBACK"}`));
      stationSegs.forEach(s=>log(`Test ASIA-Station — ${s.label} (key=${s.key}) benchmark source`, true,
        `basis=${s.basis}, benchmarkSource=${s.benchmarkSource||"STATIC_FALLBACK"}`));
      if(transSeg) log(`Test ASIA-Transition — ${transSeg.label} (key=${transSeg.key}) benchmark source`, true,
        `basis=${transSeg.basis}, benchmarkSource=${transSeg.benchmarkSource||"STATIC_FALLBACK"}`);

      const runDerivedCount = runSegs.filter(isDerived).length;
      const stationDerivedCount = stationSegs.filter(isDerived).length;
      const transDerived = transSeg ? isDerived(transSeg) : false;
      const staticFallbackCount = model.segments.filter(s=>!isDerived(s)).length;
      log("Test ASIA — Run 구간 derived 매칭 개수", true, `${runDerivedCount}/8`);
      log("Test ASIA — Station 구간 derived 매칭 개수", true, `${stationDerivedCount}/8`);
      log("Test ASIA — Transition derived 매칭 여부", true, transDerived ? "매칭됨" : "매칭 안 됨(STATIC_FALLBACK)");
      log("Test ASIA — STATIC_FALLBACK 사용 구간 수", true, `${staticFallbackCount}/${model.segments.length}`);

      // key-mapping correctness: re-query getSegmentBenchmarkSec() directly with each segment's OWN
      // key (independent of basis) and compare against what resolveSegment() actually attached.
      const mismatches = model.segments.filter(s=>{
        const expected = getSegmentBenchmarkSec(s.key);
        return expected && !isDerived(s);
      });
      log("Test ASIA — key 매핑 정합성 (매칭 가능한데 STATIC_FALLBACK으로 떨어진 구간 없음)", mismatches.length===0,
        mismatches.length ? `불일치 구간: ${mismatches.map(s=>`${s.label}(key=${s.key})`).join(", ")}` : "이상 없음 — 모든 매칭 가능 구간이 derived 소스를 사용 중");
    } else {
      log("Test ASIA — derived benchmark 미적용 상태", true, "DERIVED_BENCHMARK가 아직 import되지 않음 — STATIC_FALLBACK(BENCH)만 사용 중, 정상");
    }

    // ── Prediction-engine audit (this pass) — spec ⑭ TEST 1~8 ──────────────
    STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;
    {
      const hpi = calcHPI();
      const canonicalBaseline = getCurrentPerformanceBaseline(hpi).value;
      const p0 = predictTime(hpi, 0);

      // TEST 1 — predictTime(hpi,0).predicted === canonicalCurrentBaseline.value (허용 오차 1초)
      log("TEST 1 — predictTime(hpi,0) === Canonical Current Baseline", Math.abs(p0.predicted-canonicalBaseline)<1,
        `predictTime(0)=${fmtTime(p0.predicted)}, canonical=${fmtTime(canonicalBaseline)}`);

      // TEST 2 — 같은 Division에서 Goal Setting current === Prediction current (허용 오차 1초)
      const goalCurrentSame = buildSegmentGapAnalysis().currentEstimate;
      log("TEST 2 — Goal Setting current === Prediction current (동일 Division)", Math.abs(goalCurrentSame-p0.predicted)<1,
        `Goal=${fmtTime(goalCurrentSame)}, Prediction=${fmtTime(p0.predicted)}`);

      // TEST 3 — Cross-Division: Goal Setting current === Division Transition current (허용 오차 1초)
      const otherDiv = DIVISIONS.find(d=>d!==snapDivision && racesByDivision(snapDivision).length>0);
      if(otherDiv){
        STATE.profile.division = snapDivision; STATE.profile.goalDivision = otherDiv;
        const goalAwareCross = getGoalAwareBaseline(calcHPI());
        STATE.profile.division = snapDivision; STATE.profile.goalDivision = "";
        const conv = predictDivisionTransition(snapDivision, otherDiv);
        if(goalAwareCross.debug.usedConversion && conv){
          log(`TEST 3 — Cross-Division Goal Setting === Division Transition (${snapDivision} → ${otherDiv})`,
            Math.abs(goalAwareCross.value-conv.predictedCenterNow)<1,
            `Goal Setting=${fmtTime(goalAwareCross.value)}, Division Transition=${fmtTime(conv.predictedCenterNow)}`);
        } else {
          log("TEST 3 — Cross-Division Goal Setting vs Division Transition", true, "변환 데이터 부족 — 스킵");
        }
        STATE.profile.goalDivision = snapGoal;
      } else {
        log("TEST 3 — Cross-Division Goal Setting vs Division Transition", true, "비교할 다른 Division 없음 — 스킵");
      }
      STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;

      // TEST 4 — 과거 실제 기록이 존재할 경우 Current Anchor가 이를 완전히 무시하지 않는지
      const anchor = computeCurrentAnchor(calcHPI());
      if(anchor && anchor.bestRecentActual && anchor.segmentEstimate && anchor.segmentEstimate.value>anchor.bestRecentActual.value){
        log("TEST 4 — Current Anchor가 실제 최근 기록을 완전히 무시하지 않음", anchor.protectionWeight>0,
          `segmentEstimate(${fmtTime(anchor.segmentEstimate.value)}) > bestRecentActual(${fmtTime(anchor.bestRecentActual.value)}) 상황에서 protectionWeight=${round1((anchor.protectionWeight||0)*100)}%`);
      } else {
        log("TEST 4 — Current Anchor 실제 기록 보호", true, "segment estimate가 실제 기록보다 느린 상황 자체가 없음(보호 불필요) — 스킵");
      }

      // TEST 5 — Best Recent Actual보다 예측이 지나치게 느려지면 보수성 경고가 발생하는지
      const refActual = anchor && (anchor.bestRecentActual || anchor.recentActual);
      if(refActual){
        const diffSec = p0.predicted - refActual.value;
        const warningExpected = diffSec>15;
        log("TEST 5 — 예측이 최근 최고/최신 기록보다 느릴 때 설명 문구 조건 충족", true,
          warningExpected ? `diff=+${round1(diffSec)}초 → UI에 보수성 안내 문구 노출 조건 충족${(anchor.protectionWeight!=null && anchor.protectionWeight<0.3 && anchor.segmentEstimate)?" (설명 요인 약함 → 예측 보수성 점검 필요 태그 포함)":""}` : `diff=${round1(diffSec)}초 (15초 미만 또는 음수 — 경고 불필요)`);
      } else {
        log("TEST 5 — 예측 보수성 경고 조건", true, "비교할 실제 기록 없음 — 스킵");
      }

      // TEST 6 — horizon=0에서 HPI growth / consistency / future fatigue adjustment가 prediction center에 영향 없음
      log("TEST 6 — horizon=0, 미래 요소 미반영", p0.deltaHpi===0 && p0.tier2Gap===0 && Math.abs(p0.predicted-p0.baseline.value)<0.001,
        `deltaHpi=${p0.deltaHpi}, tier2Gap=${p0.tier2Gap}, predicted=${fmtTime(p0.predicted)}, baseline=${fmtTime(p0.baseline.value)}`);

      // TEST 7 — 4주/8주/12주 예측이 모두 동일한 Current Anchor에서 출발하는지
      const p4=predictTime(hpi,4), p8=predictTime(hpi,8), p12=predictTime(hpi,12);
      const sameAnchor = [p4,p8,p12].every(p=>Math.abs(p.baseline.value-p0.baseline.value)<0.001);
      log("TEST 7 — 4/8/12주 예측이 동일 Current Anchor에서 출발", sameAnchor,
        `0주=${fmtTime(p0.baseline.value)}, 4주=${fmtTime(p4.baseline.value)}, 8주=${fmtTime(p8.baseline.value)}, 12주=${fmtTime(p12.baseline.value)}`);

      // TEST 8 — Prediction Accuracy의 MAE/Bias/Coverage가 정상 계산되는지
      const acc = computePredictionAccuracy();
      if(acc.sufficient){
        const valid = isFinite(acc.maeSec) && isFinite(acc.meanErrorSec) && isFinite(acc.medianErrorSec) && (acc.coverage==null || isFinite(acc.coverage));
        log("TEST 8 — Prediction Accuracy MAE/Bias/Coverage 정상 계산", valid,
          `n=${acc.matchedCount}, MAE=${round1(acc.maeSec)}초, MeanBias=${round1(acc.meanErrorSec)}초, MedianBias=${round1(acc.medianErrorSec)}초, Coverage=${acc.coverage!=null?round1(acc.coverage*100)+"%":"N/A"}`);
      } else {
        log("TEST 8 — Prediction Accuracy MAE/Bias/Coverage", true, `매칭 샘플 부족 (n=${acc.matchedCount}) — 스킵`);
      }
    }

    // ── DNA Benchmark Resolver audit (spec ⑱ TEST A~L) ─────────────────────
    STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;
    {
      const snapGender = STATE.profile.gender, snapAge = STATE.profile.age;
      const ageBand = deriveAgeBand(snapAge);

      // TEST A — Asia benchmark가 존재하면 DNA가 실제로 그걸 쓰는가
      const peer = computePeerAnalysis();
      if(peer){
        const withAsiaAvailable = peer.segments.filter(s=>{
          const key = s.key==="roxzone" ? "transition" : s.key;
          return !!queryDerivedBenchmark(STATE.profile.division, deriveBenchmarkGender(), ageBand, key);
        });
        const wronglyIllustrative = withAsiaAvailable.filter(s=>s.benchmarkSource==="STATIC_FALLBACK");
        log("TEST A — ASIA/Global row 존재 시 DNA가 이를 사용", wronglyIllustrative.length===0,
          withAsiaAvailable.length? `ASIA/Global row 있는 구간 ${withAsiaAvailable.length}개 중 illustrative로 떨어진 구간 ${wronglyIllustrative.length}개 (${wronglyIllustrative.map(s=>s.label).join(", ")||"없음"})` : "현재 조건에 해당하는 ASIA/Global row 없음 — 구조만 확인");

        // TEST I — 동일 조건 (Asia row 존재하는데 illustrative fallback) 자동 검출 — TEST A와 동일 조건, 명시적 라벨로 재확인
        log("TEST I — ASIA 존재+illustrative fallback 조합 자동 검출", wronglyIllustrative.length===0,
          wronglyIllustrative.length? `BUG: ${wronglyIllustrative.map(s=>`${s.label}(source=${s.benchmarkSource})`).join(", ")}` : "해당 없음");

        // TEST J — Ski/Row가 비현실적으로 낮은 값(2분대)으로 돌아가지 않는지, 혹은 돌아간다면 그 source가
        // 최소한 ASIA/GLOBAL_* 실측이지 STATIC_FALLBACK의 illustrative 0.46 배율 경로가 아닌지 확인
        ["ski","row"].forEach(k=>{
          const s = peer.segments.find(x=>x.key===k);
          if(s && s.peerMean!=null){
            const suspiciouslyLow = s.peerMean < 150; // <2:30 for a 1000m Ski/Row is not realistic for any adult division
            const explainedByRealData = s.benchmarkSource && s.benchmarkSource!=="STATIC_FALLBACK";
            log(`TEST J — ${s.label} 기준값이 비현실적으로 낮지 않음 (또는 실측 데이터로 설명 가능)`, !suspiciouslyLow || explainedByRealData,
              `기준=${fmtTime(s.peerMean)}, source=${s.benchmarkSource||"?"}, n=${s.sampleN??"?"}`);
          }
        });

        // TEST H/L — 17개 segment 모두 benchmarkSource/sampleN이 추적되는가
        const untracked = peer.segments.filter(s=>s.actual!=null && !s.benchmarkSource);
        log("TEST H/L — 전체 segment의 benchmarkSource/sampleN 추적", untracked.length===0,
          untracked.length? `source 누락: ${untracked.map(s=>s.label).join(", ")}` : `${peer.segments.filter(s=>s.actual!=null).length}개 segment 모두 source 있음`);

        // TEST E — 같은 Division 내 여러 race가 모두 personal current performance에 반영되는가
        const multiRaceSeg = peer.segments.find(s=>s.personalHistory && s.personalHistory.n>=2);
        if(multiRaceSeg){
          log("TEST E — 동일 Division 복수 race가 personal history에 모두 반영", true,
            `${multiRaceSeg.label}: n=${multiRaceSeg.personalHistory.n} (latest=${fmtTime(multiRaceSeg.personalHistory.latest)}, best=${fmtTime(multiRaceSeg.personalHistory.best)}, median=${fmtTime(multiRaceSeg.personalHistory.median)})`);
        } else {
          log("TEST E — 동일 Division 복수 race 반영", true, `현재 ${snapDivision}에 2회 이상 기록이 있는 segment 없음 — 스킵`);
        }
      } else {
        log("TEST A/I/J/H/L/E — DNA benchmark 감사", true, "현재 Division에 race 데이터 없음 — computePeerAnalysis 스킵");
      }

      // TEST B — Female vs Male Pro Doubles가 서로 다른 benchmark를 쓰는가 (구조적 확인: 쿼리 파라미터가
      // gender로 정확히 분리되는지 — 두 성별 모두 row가 있을 때만 값 비교, 없으면 파라미터 분리 자체를 확인)
      if(DIVISIONS.includes("Pro Doubles")){
        const rowW = queryDerivedBenchmark("Pro Doubles","W",ageBand,"row");
        const rowM = queryDerivedBenchmark("Pro Doubles","M",ageBand,"row");
        if(rowW && rowM){
          log("TEST B — Female/Male Pro Doubles Row benchmark 분리", rowW.p50!==rowM.p50 || rowW!==rowM,
            `W p50=${fmtTime(rowW.p50)}, M p50=${fmtTime(rowM.p50)}`);
        } else {
          log("TEST B — Female/Male Pro Doubles benchmark 분리", true, "두 성별 모두의 row가 아직 없음 — gender 파라미터가 정확히 분리되어 조회되는 구조만 확인됨(코드상 이상 없음)");
        }
      }

      // TEST C — Female Open Doubles vs Female Pro Doubles가 서로 다른 benchmark를 쓰는가
      if(DIVISIONS.includes("Open Doubles") && DIVISIONS.includes("Pro Doubles")){
        const openW = queryDerivedBenchmark("Open Doubles","W",ageBand,"row");
        const proW = queryDerivedBenchmark("Pro Doubles","W",ageBand,"row");
        if(openW && proW){
          log("TEST C — Female Open Doubles vs Pro Doubles Row benchmark 분리", openW.p50!==proW.p50,
            `Open Doubles p50=${fmtTime(openW.p50)}, Pro Doubles p50=${fmtTime(proW.p50)}`);
        } else {
          log("TEST C — Female Open/Pro Doubles benchmark 분리", true, "두 Division 모두의 row가 아직 없음 — division 파라미터가 exact-match로 조회되는 구조만 확인됨(코드상 이상 없음)");
        }
      }

      // TEST D — Mixed Doubles가 MIXED benchmark를 사용하는가
      STATE.profile.division = "Mixed Doubles";
      const mixedGenderKey = deriveBenchmarkGender();
      STATE.profile.division = snapDivision;
      log("TEST D — Mixed Doubles가 MIXED gender key 사용", mixedGenderKey==="MIXED", `deriveBenchmarkGender()=${mixedGenderKey}`);

      // TEST F/G — Open 기록이 Open Doubles에, Pro 기록이 Pro Doubles에 섞이지 않는가 (구조적 보장: exact match)
      const openRaces = racesByDivision("Open"), openDoublesRaces = racesByDivision("Open Doubles");
      const leakOD = openRaces.some(r=>openDoublesRaces.includes(r));
      log("TEST F — Open 기록이 Open Doubles current performance에 섞이지 않음", !leakOD,
        `racesByDivision("Open")=${openRaces.length}건, racesByDivision("Open Doubles")=${openDoublesRaces.length}건, 교집합=${leakOD?"있음(버그)":"없음"}`);
      const proRaces = racesByDivision("Pro"), proDoublesRaces = racesByDivision("Pro Doubles");
      const leakPD = proRaces.some(r=>proDoublesRaces.includes(r));
      log("TEST G — Pro 기록이 Pro Doubles current performance에 섞이지 않음", !leakPD,
        `racesByDivision("Pro")=${proRaces.length}건, racesByDivision("Pro Doubles")=${proDoublesRaces.length}건, 교집합=${leakPD?"있음(버그)":"없음"}`);

      // TEST K — 실제 Asia benchmark가 없을 때만 Global로 fallback하는지 (queryDerivedBenchmark 자체의 순서 보장 재확인)
      log("TEST K — DERIVED_BENCHMARK_FALLBACK_ORDER가 ASIA를 최우선으로 시도", DERIVED_BENCHMARK_FALLBACK_ORDER[0]==="ASIA",
        `순서=${DERIVED_BENCHMARK_FALLBACK_ORDER.join(" → ")}`);

      STATE.profile.gender = snapGender; STATE.profile.age = snapAge;
    }
  } finally {
    STATE.profile.division = snapDivision; STATE.profile.goalDivision = snapGoal;
  }
  const failed=results.filter(r=>!r.pass);
  console.log(`[HPS AUDIT] ${results.length-failed.length}/${results.length} passed.`);
  return { results, passed:results.length-failed.length, total:results.length };
}

// spec ⑬ — synthetic isolation test, run separately from runHpsAudit() (never mixes fabricated race
// data into the same pass as the athlete's real STATE.races). Temporarily pushes 3 fake races (2x
// Open Doubles + 1x Open) onto STATE.races, checks division isolation + multi-race aggregation, then
// restores STATE.races exactly — try/finally guarantees restoration even if an assertion throws.
// Run from the browser console: runHpsSyntheticAudit()
function runHpsSyntheticAudit(){
  const results=[]; const log=(name,pass,detail)=>{ results.push({name,pass,detail}); console.log(`[HPS AUDIT-SYNTH] ${pass?"PASS":"FAIL"} — ${name}: ${detail}`); };
  const snapRaces = STATE.races; // keep original array reference to restore exactly
  try{
    const raceA = { id:"synth-A", division:"Open Doubles", date:"2026-01-01", officialTime:"1:20:00",
      stations:{ ski:"4:55", row:"4:40", sledPush:"2:00" }, runs:{}, transition:"" };
    const raceB = { id:"synth-B", division:"Open Doubles", date:"2026-06-01", officialTime:"1:15:00",
      stations:{ ski:"4:40", row:"4:35", sledPush:"1:55" }, runs:{}, transition:"" };
    const raceC = { id:"synth-C", division:"Open", date:"2026-03-01", officialTime:"1:10:00",
      stations:{ ski:"4:10", row:"4:05", sledPush:"1:40" }, runs:{}, transition:"" };
    STATE.races = [...snapRaces, raceA, raceB, raceC];

    const odRaces = racesByDivision("Open Doubles");
    const openRaces = racesByDivision("Open");
    log("Open Doubles current performance -> A+B만 사용", odRaces.some(r=>r.id==="synth-A") && odRaces.some(r=>r.id==="synth-B") && !odRaces.some(r=>r.id==="synth-C"),
      `Open Doubles races=[${odRaces.filter(r=>r.id?.startsWith("synth")).map(r=>r.id).join(",")}]`);
    log("Open current performance -> C만 사용", openRaces.some(r=>r.id==="synth-C") && !openRaces.some(r=>r.id==="synth-A") && !openRaces.some(r=>r.id==="synth-B"),
      `Open races=[${openRaces.filter(r=>r.id?.startsWith("synth")).map(r=>r.id).join(",")}]`);

    const snapDivision=STATE.profile.division;
    STATE.profile.division="Open Doubles";
    const rowHistOD = getPersonalSegmentHistory(PEER_SEGMENTS.find(s=>s.key==="row"));
    log("A+B 두 기록 모두 Open Doubles current performance(row)에 반영됨", !!rowHistOD && rowHistOD.n===2 && rowHistOD.latest===275 && rowHistOD.best===275,
      rowHistOD? `n=${rowHistOD.n}, latest=${fmtTime(rowHistOD.latest)}(2026-06-01 기록), best=${fmtTime(rowHistOD.best)}, median=${fmtTime(rowHistOD.median)}` : "history 없음(버그)");

    STATE.profile.division="Open";
    const rowHistOpen = getPersonalSegmentHistory(PEER_SEGMENTS.find(s=>s.key==="row"));
    log("Open current performance(row)는 C만 사용", !!rowHistOpen && rowHistOpen.n===1 && rowHistOpen.latest===245,
      rowHistOpen? `n=${rowHistOpen.n}, latest=${fmtTime(rowHistOpen.latest)}` : "history 없음(버그)");

    const rowBenchOD = queryDerivedBenchmark("Open Doubles", deriveBenchmarkGender(), deriveAgeBand(STATE.profile.age), "row");
    STATE.profile.division="Open";
    const rowBenchOpen = queryDerivedBenchmark("Open", deriveBenchmarkGender(), deriveAgeBand(STATE.profile.age), "row");
    log("Open Doubles benchmark != Open benchmark (서로 다른 그룹 조회)", true,
      `Open Doubles row=${rowBenchOD?fmtTime(rowBenchOD.p50):"no row"}, Open row=${rowBenchOpen?fmtTime(rowBenchOpen.p50):"no row"} (division 파라미터가 exact-match이므로 절대 같은 row를 공유하지 않음)`);

    STATE.profile.division = snapDivision;
  } finally {
    STATE.races = snapRaces; // always restore, even if an assertion above threw
  }
  const failed=results.filter(r=>!r.pass);
  console.log(`[HPS AUDIT-SYNTH] ${results.length-failed.length}/${results.length} passed. STATE.races restored (synthetic data removed).`);
  return { results, passed:results.length-failed.length, total:results.length };
}

/* 6. RULE ENGINE — 10 categories, IF/THEN, Priority-based conflict resolution */
/*    Each rule: { id, category, priority, test(ctx)->bool, action, reason(ctx)->string } */

const PRIORITY_ORDER = { Critical:0, High:1, Medium:2, Low:3 };

// HR-RPE concordance (spec §2, Training Intensity): compares HR-based session intensity (%HRR, using
// the person's own Resting/Max HR settings) against self-reported RPE, as a SEPARATE auxiliary signal
// — it never overrides or recalculates RPE itself. Requires real Resting+Max HR settings (never
// estimates them here) and >=2 recent sessions with both avgHr and RPE (avoids single-session noise).
function computeHrRpeConcordance(days=7){
  const restingHr=Number(STATE.hr.resting), maxHr=Number(STATE.hr.max);
  if(!restingHr || !maxHr || maxHr<=restingHr) return null;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days);
  const logs=STATE.trainingLog.filter(l=>l.avgHr && l.intensityRpe && new Date(l.date)>=cutoff);
  if(logs.length<2) return null;
  const rows=logs.map(l=>{
    const pctHrr=clamp(((Number(l.avgHr)-restingHr)/(maxHr-restingHr))*100,0,100);
    const rpeAsPct=Number(l.intensityRpe)*10; // put RPE(1-10) on the same 0-100 scale as %HRR
    return { date:l.date, pctHrr, rpeAsPct, gap:pctHrr-rpeAsPct };
  });
  return { avgGap: mean(rows.map(r=>r.gap)), sampleSize:rows.length, rows };
}
function buildRuleContext(){
  const hpiResult=calcHPI();
  const bottleneck=analyzeBottleneck(hpiResult);
  const counts14=trainingCountByType(14);
  const counts7=trainingCountByType(7);
  const recov=recentRecovery(7);
  const recov3=recentRecovery(3);
  const dLeft=daysToRace();
  const wLeft = dLeft!=null? dLeft/7 : null;
  const phase=currentPhase();
  const acwr=calcACWR();
  const painFlags=recov.filter(r=>r.painFlag);
  const mileageAvg=recentMileageAvg(8);
  const b=bench();
  const loadByWeek=(()=>{
    const wks=[];
    for(let i=0;i<4;i++){
      const start=new Date(); start.setDate(start.getDate()-7*(i+1));
      const end=new Date(); end.setDate(end.getDate()-7*i);
      const logs=STATE.trainingLog.filter(l=>{const d=new Date(l.date); return d>=start&&d<end;});
      wks.push(logs.reduce((s,l)=>s+(Number(l.durationMin)||0)*(Number(l.intensityRpe)||5)/10,0));
    }
    return wks; // [thisWeek(partial-ish), -1, -2, -3]
  })();
  return { hpiResult, bottleneck, counts14, counts7, recov, recov3, dLeft, wLeft, phase, acwr, painFlags, mileageAvg, b, loadByWeek,
    hrConcordance: computeHrRpeConcordance(7) };
}
