/* ---------------------------------------------------------------------- */
/* 13b. HYROX RESULT OCR IMPORT                                            */
/*      Client-side only: no HYROX site scraping, no paid OCR/AI API.      */
/*      Tesseract.js runs entirely in the browser. Images are held in      */
/*      memory only and discarded after parsing — never uploaded anywhere. */
/* ---------------------------------------------------------------------- */
function defaultOcrState(){ return { images:[], status:"idle", progress:0, warnings:[], rawText:"" }; }
let OCR_STATE = defaultOcrState();
let RC_PREFILL = null;      // parsed race draft, feeds the "rc" form as prefilled (still editable) values
let RC_OCR_CONF = null;     // per-field confidence map for badge display
let RC_SOURCE_TYPE = null;  // "OCR_USER_UPLOAD" once a draft has been filled from an image
let OCR_RAW_OPEN = false;   // debug panel toggle for viewing raw recognized text

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
// Resize + grayscale + simple contrast stretch. Kept lightweight (no full convolution) so it
// stays fast on mobile, but this is the part of the pipeline most responsible for OCR accuracy.
// Upscale + sharpen + auto dark/light detection + Otsu binarization. Tesseract's models are trained
// overwhelmingly on dark text on a light background, so a UI screenshot in dark mode (light text on a
// dark card) reads much worse than the same content light-mode — auto-inverting when the image is
// predominantly dark fixes that without the person needing to know or care. Otsu thresholding (finds
// the brightness cutoff that best separates two clusters — text vs background — rather than a plain
// linear min/max stretch) produces cleaner, crisper glyph edges, which is usually the single biggest
// lever for OCR accuracy on compressed screenshots.
function preprocessForOcr(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      // more aggressive upscale for small source images — Tesseract accuracy drops sharply below
      // roughly 300dpi-equivalent text height, and small phone-screenshot crops are common.
      const targetW = img.width<700 ? 2000 : img.width<1100 ? 1700 : Math.min(img.width,2000);
      const scale = targetW/img.width;
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
      ctx.drawImage(img,0,0,w,h);
      const imgData=ctx.getImageData(0,0,w,h);
      const d=imgData.data;

      // 1) grayscale + histogram (for Otsu threshold + dark/light detection)
      const gray=new Uint8ClampedArray(w*h);
      const hist=new Array(256).fill(0);
      let sum=0;
      for(let i=0,p=0;i<d.length;i+=4,p++){
        const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        gray[p]=g; hist[Math.round(g)]++; sum+=g;
      }
      const meanBrightness=sum/gray.length;

      // 2) Otsu's method: find the threshold maximizing between-class variance
      let sumAll=0; for(let t=0;t<256;t++) sumAll+=t*hist[t];
      let wB=0,sumB=0,maxVar=0,threshold=128;
      const total=gray.length;
      for(let t=0;t<256;t++){
        wB+=hist[t]; if(wB===0) continue;
        const wF=total-wB; if(wF===0) break;
        sumB+=t*hist[t];
        const mB=sumB/wB, mF=(sumAll-sumB)/wF;
        const varBetween=wB*wF*(mB-mF)*(mB-mF);
        if(varBetween>maxVar){ maxVar=varBetween; threshold=t; }
      }

      // 3) dark-mode screenshots (mean brightness low = mostly dark background) get inverted so the
      // final image is always dark-text-on-light-background, matching what Tesseract expects.
      const invert = meanBrightness<115;

      // 4) light sharpening (3x3 unsharp-ish kernel) on the grayscale buffer before binarizing —
      // counteracts the softness canvas scaling introduces, which otherwise blurs thin glyph strokes.
      const sharp=new Uint8ClampedArray(w*h);
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const idx=y*w+x;
          if(x===0||y===0||x===w-1||y===h-1){ sharp[idx]=gray[idx]; continue; }
          const c=gray[idx], up=gray[idx-w], down=gray[idx+w], left=gray[idx-1], right=gray[idx+1];
          sharp[idx]=clamp(c*5-up-down-left-right, 0, 255);
        }
      }

      for(let i=0,p=0;i<d.length;i+=4,p++){
        let v = sharp[p] > threshold ? 255 : 0; // Otsu binarization
        if(invert) v = 255-v;
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(imgData,0,0);
      resolve(canvas);
    };
    img.onerror=()=>reject(new Error("image load failed"));
    img.src=dataUrl;
  });
}
async function handleOcrFiles(fileList){
  const files=Array.from(fileList||[]).filter(f=>f.type && f.type.startsWith("image/"));
  for(const f of files){
    try{ const dataUrl=await fileToDataUrl(f); OCR_STATE.images.push({ dataUrl }); }catch(e){ console.warn("ocr file read failed", e); }
  }
  OCR_STATE.status="idle"; OCR_STATE.warnings=[];
  renderAll();
}

  for(const f of files){
    try{ const dataUrl=await fileToDataUrl(f); TL_OCR_STATE.images.push({ dataUrl }); }catch(e){ console.warn("training log ocr file read failed", e); }

// Recognized-label → canonical field-key aliasing. Tolerant of OCR noise (missing spaces,
// hyphens, stray punctuation) — labels are normalized before matching.
function normalizeOcrLabel(s){
  return String(s).replace(/[^A-Za-z0-9가-힣'\- ]/g," ").replace(/\s+/g," ").trim().toUpperCase();
}
function ocrMatchLabelKey(label){
  const L=normalizeOcrLabel(label);
  if(!L) return null;
  // "RUN 1"/"RUN1"/"RUNNING 1" — the official results.hyrox.com page uses "Running N"
  let m=L.match(/\bRUN(?:NING)?\s*[-]?\s*([1-8])\b/);
  if(m) return "run"+m[1];
  if(/SKI\s*-?\s*ERG/.test(L)) return "ski";
  if(/SLED\s*-?\s*PUSH/.test(L)) return "sledPush";
  if(/SLED\s*-?\s*PULL/.test(L)) return "sledPull";
  if(/BURPEE/.test(L) || /\bBBJ\b/.test(L)) return "burpee";
  if(/FARMER'?S?\s*CARRY/.test(L)) return "carry";
  if(/SANDBAG\s*LUNGE/.test(L)) return "lunge";
  if(/WALL\s*BALL/.test(L)) return "wallball";
  if(/ROX\s*-?\s*ZONE/.test(L)) return "transition"; // "Roxzone" / "Roxzone Time"
  if(/\b(TOTAL\s*TIME|OVERALL\s*TIME|FINISH(?:ING)?\s*TIME|TOTAL\s*RESULT)\b/.test(L)) return "officialTime";
  // "Row"/"1000m Row" — matched last and narrowly (word boundary) so it never grabs "Roxzone"/"Row Total"
  if(/\bROW\b/.test(L) && !/ROXZONE/.test(L) && !/\bTOTAL\b/.test(L)) return "row";
  return null;
}
// mm:ss / h:mm:ss parser+validator. Never silently "fixes" an out-of-range value (e.g. 4:72) —
// flags it instead so it surfaces as a review item rather than a wrong number being saved.
function ocrNormalizeTime(raw){
  const m=String(raw).trim().match(/^(\d{1,2})(?::(\d{1,2}))(?::(\d{1,2}))?$/);
  if(!m) return {ok:false, value:raw};
  let h=null,mm,ss;
  if(m[3]!==undefined){ h=Number(m[1]); mm=Number(m[2]); ss=Number(m[3]); } else { mm=Number(m[1]); ss=Number(m[2]); }
  if(ss>59 || mm>59 || (h!==null && h>23)) return {ok:false, value:raw};
  // Official HYROX results pages render every split time in HH:MM:SS even for sub-hour splits
  // (e.g. a 3m40s SkiErg shows as "00:03:40"). OCR reads that literally, which would otherwise get
  // stored as "0:03:40" — reads like an hh:mm:ss value even though it's really mm:ss data. Since
  // every field this app stores station/run splits in expects mm:ss, a 0-hour OCR read is collapsed
  // back down to mm:ss here so it matches the format used everywhere else (manual entry, display,
  // parseTimeToSec). Only applies when h===0 — a real h:mm:ss total (e.g. officialTime) is untouched.
  if(h===0){ h=null; }
  const value = h!==null ? `${h}:${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${mm}:${String(ss).padStart(2,"0")}`;
  return {ok:true, value};
}
const OCR_PURE_TIME_RE=/^\d{1,2}:\d{1,2}(?::\d{1,2})?$/;
const OCR_EXPECTED_ORDER=["run1","ski","run2","sledPush","run3","sledPull","run4","burpee","run5","row","run6","carry","run7","lunge","run8","wallball"];
// Parses combined OCR text (+ optional per-word confidence list from Tesseract) into a race draft.
// Label→time association is done line-by-line (same line, or the next 1-2 lines) using the fixed
// HYROX station order as a structural prior, per the alias table above.
function parseHyroxOcrText(text, words){
  const lines=String(text).split(/\n/).map(l=>l.trim()).filter(Boolean);
  const runs={}, stations={};
  let officialTime=null, transition=null;
  const wordQueue=(words||[]).slice();
  const matchedOrder=[];
  const warnings=[];
  const confMap={};
  function takeConfidenceFor(timeStr){
    const cleaned=timeStr.replace(/\s+/g,"");
    for(let i=0;i<wordQueue.length;i++){
      const wt=(wordQueue[i].text||"").replace(/\s+/g,"");
      if(wt===cleaned){ const c=wordQueue[i].confidence; wordQueue.splice(i,1); return c; }
    }
    return null;
  }
  function assign(key, rawTime){
    const norm=ocrNormalizeTime(rawTime);
    const conf=takeConfidenceFor(rawTime);
    let confLabel;
    if(!norm.ok){ confLabel="error"; warnings.push(`${key} 값(${rawTime})이 올바른 시간 형식이 아닌 것 같습니다 — 확인해주세요`); }
    else confLabel = conf==null ? null : (conf>=75 ? "high" : "low");
    if(key.startsWith("run")) runs[key.replace("run","")]=norm.ok?norm.value:rawTime;
    else if(key==="officialTime") officialTime=norm.ok?norm.value:rawTime;
    else if(key==="transition") transition=norm.ok?norm.value:rawTime;
    else stations[key]=norm.ok?norm.value:rawTime;
    confMap[key]=confLabel;
    if(!matchedOrder.includes(key)) matchedOrder.push(key);
  }
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    // Find the first time-like token anywhere in the line (not just at the end) — real result
    // screens often trail a rank/place column after the time (e.g. "01  1000m SkiErg  00:03:40  13"),
    // so anchoring only to line-end would miss it.
    const timeMatch=line.match(/(\d{1,2}:\d{1,2}(?::\d{1,2})?)/);
    let labelPart, timeStr;
    if(timeMatch){ labelPart=line.slice(0,timeMatch.index).trim(); timeStr=timeMatch[1]; } else { labelPart=line; timeStr=null; }
    const key=ocrMatchLabelKey(labelPart);
    if(!key) continue;
    if(!timeStr){
      for(let j=i+1;j<Math.min(i+3,lines.length);j++){ if(OCR_PURE_TIME_RE.test(lines[j])){ timeStr=lines[j]; break; } }
    }
    if(timeStr) assign(key, timeStr);
  }
  // Event name: prefer the actual "Race" row value from results.hyrox.com (e.g. "Race" → "2026 Chengdu")
  // over a generic "HYROX ..." text-search, which can otherwise pick up page chrome like a URL bar.
  let name="";
  const raceLineIdx=lines.findIndex(l=>normalizeOcrLabel(l)==="RACE");
  if(raceLineIdx>=0 && lines[raceLineIdx+1] && !OCR_PURE_TIME_RE.test(lines[raceLineIdx+1])) name=lines[raceLineIdx+1].trim();
  if(!name){ const eventMatch=text.match(/HYROX\s+[A-Za-z가-힣][^\n]{0,28}/); if(eventMatch) name=eventMatch[0].trim().replace(/\s+/g," "); }
  const dateMatch=text.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  const date=dateMatch? `${dateMatch[1]}-${String(dateMatch[2]).padStart(2,"0")}-${String(dateMatch[3]).padStart(2,"0")}` : "";
  let lastIdx=-1, orderOk=true;
  matchedOrder.forEach(k=>{ const idx=OCR_EXPECTED_ORDER.indexOf(k); if(idx===-1) return; if(idx<lastIdx) orderOk=false; lastIdx=Math.max(lastIdx,idx); });
  if(!orderOk) warnings.push("구간 순서가 예상과 달라 확인이 필요합니다");
  const allTimes=[...Object.values(runs), ...Object.values(stations)].map(parseTimeToSec).filter(v=>v!=null);
  const sum=allTimes.length? allTimes.reduce((a,b)=>a+b,0) : null;
  const totalSec=officialTime? parseTimeToSec(officialTime) : null;
  if(sum!=null && totalSec!=null && totalSec < sum*0.9) warnings.push("총 기록이 구간 합계보다 지나치게 작습니다 — 확인해주세요");
  return { fields:{ name, date, officialTime, runs, stations, transition }, confMap, warnings };
}
function ocrErrorText(e){
  if(!e) return "알 수 없는 오류";
  if(typeof e==="string") return e;
  if(e.message) return e.message;
  if(e.name) return e.name;
  try{ return JSON.stringify(e); }catch(_){ return String(e); }
}
/* ---------------------------------------------------------------------- */
/* TRAINING LOG OCR — parallel pipeline to the Race OCR above, same        */
/*     Tesseract/preprocessForOcr() infra reused, different label set      */
/*     (Garmin/Strava/watch summary screens instead of HYROX results).     */
/*     Extracted fields ALWAYS land in an editable draft first — never     */
/*     saved directly — per spec: "내용은 사용자가 확인/수정한 후 저장".      */
/* ---------------------------------------------------------------------- */
function defaultTlOcrState(){ return { images:[], status:"idle", progress:0, warnings:[], rawText:"" }; }
let TL_OCR_STATE = defaultTlOcrState();
let TL_OCR_DRAFT = null; // editable fields after parsing, null until something's been read
const TL_OCR_TYPE_KEYWORDS = {
  run:["run","running","러닝","달리기","조깅","jogging"],
  interval:["interval","인터벌"],
  strength:["strength","weight training","weight","웨이트","근력","kettlebell","케틀벨","bench press","벤치프레스","squat","스쿼트","deadlift","데드리프트","total sets","total reps","세트","반복"],
  wod:["wod","hyrox","crossfit","hiit","히트","circuit","서킷","workout"],
  conditioning:["conditioning","컨디셔닝","cardio","카디오","rowing","row erg","로잉","skierg","ski erg","스키에르그","cycling","사이클링","사이클","bike","바이크"],
  recovery:["recovery","회복","rest","휴식"]
};
function tlOcrGuessType(text){
  const low=String(text||"").toLowerCase();
  // Specific strength signals beat a generic "Workout" title.
  const strengthSignals=TL_OCR_TYPE_KEYWORDS.strength;
  if(strengthSignals.some(k=>low.includes(k.toLowerCase()))) return "strength";
  if(TL_OCR_TYPE_KEYWORDS.wod.some(k=>low.includes(k.toLowerCase()))) return "wod";
  if(TL_OCR_TYPE_KEYWORDS.interval.some(k=>low.includes(k.toLowerCase()))) return "interval";
  if(TL_OCR_TYPE_KEYWORDS.run.some(k=>low.includes(k.toLowerCase()))) return "run";
  if(TL_OCR_TYPE_KEYWORDS.conditioning.some(k=>low.includes(k.toLowerCase()))) return "conditioning";
  if(TL_OCR_TYPE_KEYWORDS.recovery.some(k=>low.includes(k.toLowerCase()))) return "recovery";
  return null;
}

// label -> field. These are intentionally broad because Garmin/Apple/Strava
// screens put labels and values in different OCR orders.
const TL_OCR_LABEL_MAP = {
  distanceKm: ["distance","거리","킬로미터"],
  durationMin: ["time","duration","moving time","elapsed time","총 시간","운동 시간","시간","소요시간","운동시간"],
  avgPaceSecKm: ["avg pace","average pace","pace","평균 페이스","페이스"],
  avgHr: ["avg hr","average hr","avg heart rate","average heart rate","평균 심박","평균심박","평균 심박수"],
  maxHr: ["max hr","maximum hr","max heart rate","최대 심박","최고심박","최대 심박수"],
  intensityRpe: ["rpe","perceived exertion","자각강도"]
};
function tlOcrParseNumber(str){ const m=String(str).match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function tlOcrParseDuration(str){
  const s=String(str||"").trim();
  const hmsMatch=s.match(/\b(\d{1,2}):(\d{2}):(\d{2})\b/);
  if(hmsMatch) return Math.round((Number(hmsMatch[1])*3600+Number(hmsMatch[2])*60+Number(hmsMatch[3]))/6)/10;
  const msMatch=s.match(/\b(\d{1,3}):(\d{2})\b/);
  if(msMatch) return Math.round((Number(msMatch[1])*60+Number(msMatch[2]))/6)/10;
  const numMatch=s.match(/(\d+(?:\.\d*)?)\s*(?:min|mins|분)\b/i);
  return numMatch ? parseFloat(numMatch[1]) : null;
}
function tlOcrParsePace(str){
  const m=String(str||"").match(/\b(\d{1,2}):(\d{2})\b/);
  return m ? Number(m[1])*60+Number(m[2]) : null;
}
function tlOcrNormalizeText(text){
  return String(text||"")
    .replace(/\u2019|\u2018/g,"'")
    .replace(/\u2033/g,'"')
    .replace(/\r/g,'\n')
    .replace(/[ \t]+/g,' ');
}

// Extract every time-shaped value once. This is the important fallback for
// screens where OCR returns ALL labels first and ALL values later, e.g.:
//   총 시간 / 운동 시간 / 휴식 시간 / ... / 54:53 / 30:23 / 24:30
function tlOcrTimeCandidates(text){
  const out=[];
  const t=tlOcrNormalizeText(text);
  for(const m of t.matchAll(/\b(\d{1,2}:\d{2}:\d{2})\b/g)){
    const minutes=tlOcrParseDuration(m[1]);
    if(minutes!=null && minutes>0 && minutes<=720) out.push({text:m[1],minutes,index:m.index});
  }
  for(const m of t.matchAll(/\b(\d{1,3}:\d{2})\b/g)){
    const minutes=tlOcrParseDuration(m[1]);
    if(minutes!=null && minutes>0 && minutes<=720) out.push({text:m[1],minutes,index:m.index});
  }
  // Deduplicate exact OCR repeats.
  return out.filter((x,i,a)=>a.findIndex(y=>y.text===x.text)===i);
}
function tlOcrPickDuration(text){
  const t=tlOcrNormalizeText(text);
  const candidates=tlOcrTimeCandidates(t);
  if(!candidates.length) return null;

  // 1) Explicit total-duration label, including OCR's label/value reversal.
  const totalPatterns=[
    /총\s*시간[^\d]{0,80}(\d{1,2}:\d{2}(?::\d{2})?)/i,
    /(\d{1,2}:\d{2}(?::\d{2})?)[^\d]{0,80}총\s*시간/i,
    /elapsed\s*time[^\d]{0,80}(\d{1,2}:\d{2}(?::\d{2})?)/i,
    /(\d{1,2}:\d{2}(?::\d{2})?)[^\d]{0,80}elapsed\s*time/i,
    /\btime\b[^\d]{0,80}(\d{1,2}:\d{2}(?::\d{2})?)/i
  ];
  for(const re of totalPatterns){
    const m=t.match(re);
    if(m){
      const minutes=tlOcrParseDuration(m[1]);
      if(minutes!=null) return {minutes,matchedText:m[1],confidence:"high"};
    }
  }

  // 2) If several time values exist and labels are stacked separately,
  //    the total session duration is normally the largest duration.
  //    This correctly handles Garmin HIIT: 54:53 / 30:23 / 24:30.
  candidates.sort((a,b)=>b.minutes-a.minutes);
  return {minutes:candidates[0].minutes,matchedText:candidates[0].text,confidence:"medium"};
}
function tlOcrPickDate(text){
  const t=String(text||"");
  let m=t.match(/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=t.match(/(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/);
  if(m) return `${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  m=t.match(/\b(?:Jan|January|Feb|February|Mar|March|Apr|April|May|Jun|June|Jul|July|Aug|August|Sep|September|Oct|October|Nov|November|Dec|December)\s+(\d{1,2}),?\s+(\d{4})\b/i);
  if(m){
    const names={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
    const monthText=t.match(/\b(\w+)\s+\d{1,2},?\s+\d{4}\b/i)[1].toLowerCase();
    return `${m[2]}-${String(names[monthText]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  }
  // Relative date is safe to resolve only when explicitly present.
  if(/\byesterday\b|어제/i.test(t)){
    const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);
  }
  if(/\btoday\b|오늘/i.test(t)) return todayISO();
  return null;
}

function parseTrainingLogOcrText(text){
  const normalized=tlOcrNormalizeText(text);
  const lines=normalized.split("\n").map(l=>l.trim()).filter(Boolean);
  const fields={
    date:tlOcrPickDate(normalized),
    type:tlOcrGuessType(normalized),
    distanceKm:null,
    durationMin:null,
    avgPaceSecKm:null,
    avgHr:null,
    maxHr:null,
    intensityRpe:null
  };
  const warnings=[];

  // ------------------------------------------------------------
  // Duration: robust to both label->value and stacked label/value OCR.
  // ------------------------------------------------------------
  const duration=tlOcrPickDuration(normalized);
  if(duration) fields.durationMin=duration.minutes;

  // ------------------------------------------------------------
  // Distance: label/value + bare unit fallback.
  // ------------------------------------------------------------
  let m=normalized.match(/distance[^\d]{0,40}(\d+(?:\.\d+)?)\s*(?:km|mi)?/i)
      || normalized.match(/거리[^\d]{0,40}(\d+(?:\.\d+)?)\s*(?:km|킬로미터)?/i)
      || normalized.match(/\b(\d+(?:\.\d+)?)\s*(km|킬로미터)\b/i);
  if(m){
    const n=parseFloat(m[1]);
    if(Number.isFinite(n) && n>0 && n<1000) fields.distanceKm=n;
  }

  // ------------------------------------------------------------
  // Pace. Avoid treating HIIT's duration values as pace unless a pace label
  // actually exists.
  // ------------------------------------------------------------
  m=normalized.match(/(?:avg\.?\s*pace|average\s*pace|pace|평균\s*페이스|페이스)[^\d]{0,30}(\d{1,2})['’:]\s*(\d{2})/i);
  if(m) fields.avgPaceSecKm=Number(m[1])*60+Number(m[2]);
  if(fields.avgPaceSecKm==null && fields.distanceKm!=null && fields.durationMin!=null){
    fields.avgPaceSecKm=Math.round((fields.durationMin*60)/fields.distanceKm);
  }

  // ------------------------------------------------------------
  // HR. Two OCR layouts are supported:
  //   label -> 151 bpm
  //   labels stacked first -> 151 bpm / 190 bpm / 37 bpm later
  // Never let a duration such as 54:53 become an HR value.
  // ------------------------------------------------------------
  const bpmValues=[...normalized.matchAll(/\b(\d{2,3})\s*bpm\b/gi)].map(x=>Number(x[1]));
  const hasAvgHrLabel=/(?:avg\.?\s*heart\s*rate|average\s*heart\s*rate|평균\s*심박(?:수)?|평균심박)/i.test(normalized);
  const hasMaxHrLabel=/(?:max\.?\s*heart\s*rate|maximum\s*heart\s*rate|최대\s*심박(?:수)?|최고심박)/i.test(normalized);
  if(bpmValues.length){
    if(hasAvgHrLabel) fields.avgHr=bpmValues[0];
    if(hasMaxHrLabel) fields.maxHr=bpmValues.length>1?bpmValues[1]:bpmValues[0];
  }else{
    m=normalized.match(/(?:avg\.?\s*heart\s*rate|average\s*heart\s*rate|평균\s*심박(?:수)?|평균심박)[^\d:]{0,40}(\d{2,3})(?![:\d])/i);
    if(m) fields.avgHr=Number(m[1]);
    m=normalized.match(/(?:max\.?\s*heart\s*rate|maximum\s*heart\s*rate|최대\s*심박(?:수)?|최고심박)[^\d:]{0,40}(\d{2,3})(?![:\d])/i);
    if(m) fields.maxHr=Number(m[1]);
  }

  // ------------------------------------------------------------
  // RPE, if present.
  // ------------------------------------------------------------
  m=normalized.match(/(?:rpe|perceived\s*exertion|자각강도)[^\d]{0,20}(\d{1,2})/i);
  if(m){ const n=Number(m[1]); if(n>=1 && n<=10) fields.intensityRpe=n; }

  // If no explicit type was found, distance+pace is a safe run heuristic.
  if(!fields.type && fields.distanceKm!=null && fields.avgPaceSecKm!=null) fields.type="run";

  if(!fields.durationMin){
    warnings.push("운동시간을 인식하지 못했습니다. 운동시간을 직접 입력해주세요.");
  }
  if(!fields.date){
    warnings.push("날짜를 정확히 인식하지 못했습니다 — 아래에서 직접 확인해주세요.");
  }
  if(fields.distanceKm==null){
    warnings.push("거리 정보 없음 — 이 운동 유형에서는 정상입니다.");
  }
  return {fields,warnings,durationConfidence:duration?.confidence||null};
}

function tlOcrMergeFields(list){
  const merged={date:null,type:null,distanceKm:null,durationMin:null,avgPaceSecKm:null,avgHr:null,maxHr:null,intensityRpe:null};
  const typeRank={strength:5,wod:5,interval:4,run:4,conditioning:3,recovery:2};
  for(const f of list){
    if(!merged.date && f.date) merged.date=f.date;
    if(f.type && (!merged.type || (typeRank[f.type]||0)>(typeRank[merged.type]||0))) merged.type=f.type;
    if(merged.distanceKm==null && f.distanceKm!=null) merged.distanceKm=f.distanceKm;
    if(merged.durationMin==null && f.durationMin!=null) merged.durationMin=f.durationMin;
    if(merged.avgPaceSecKm==null && f.avgPaceSecKm!=null) merged.avgPaceSecKm=f.avgPaceSecKm;
    if(merged.avgHr==null && f.avgHr!=null) merged.avgHr=f.avgHr;
    if(merged.maxHr==null && f.maxHr!=null) merged.maxHr=f.maxHr;
    if(merged.intensityRpe==null && f.intensityRpe!=null) merged.intensityRpe=f.intensityRpe;
  }
  return merged;
}

async function runTrainingLogOcrPipeline(){
  if(!window.Tesseract){ TL_OCR_STATE.status="error"; TL_OCR_STATE.warnings=["OCR 엔진 스크립트를 불러오지 못했습니다 (네트워크 문제일 수 있어요). 다시 시도해주세요."]; renderAll(); return; }
  TL_OCR_STATE.status="processing"; TL_OCR_STATE.progress=0; TL_OCR_STATE.rawText=""; renderAll();
  const workerOk=await canUseWebWorker();
  if(!workerOk){
    TL_OCR_STATE.status="error";
    TL_OCR_STATE.warnings=["이 미리보기 화면은 보안 정책상 OCR에 필요한 웹 워커 실행이 막혀 있어요. 파일을 다운로드한 뒤 Safari나 Chrome 같은 일반 브라우저 앱에서 직접 열어 다시 시도해주세요."];
    renderAll(); return;
  }

  let combinedText="";
  const imageErrors=[];
  const parsedImages=[];

  for(let i=0;i<TL_OCR_STATE.images.length;i++){
    try{
      const canvas=await preprocessForOcr(TL_OCR_STATE.images[i].dataUrl);
      let data=null;
      try{
        ({data}=await Tesseract.recognize(canvas,"eng+kor",{
          logger:(m)=>{
            if(m.status==="recognizing text"){
              TL_OCR_STATE.progress=Math.round(((i+m.progress)/TL_OCR_STATE.images.length)*100);
              const el=document.getElementById("tl-ocr-progress-text");
              if(el) el.textContent=`기록을 읽고 있어요… (${TL_OCR_STATE.progress}%)`;
            }
          }
        }));
      }catch(langErr){
        // Korean traineddata may be unavailable in some environments.
        ({data}=await Tesseract.recognize(canvas,"eng",{
          logger:(m)=>{
            if(m.status==="recognizing text"){
              TL_OCR_STATE.progress=Math.round(((i+m.progress)/TL_OCR_STATE.images.length)*100);
              const el=document.getElementById("tl-ocr-progress-text");
              if(el) el.textContent=`기록을 읽고 있어요… (${TL_OCR_STATE.progress}%)`;
            }
          }
        }));
      }
      const text=data?.text||"";
      combinedText += `\n----- 이미지 ${i+1} -----\n${text}`;
      if(text.trim()) parsedImages.push(parseTrainingLogOcrText(text).fields);
    }catch(e){
      console.warn("Training log OCR failed on image",i,e);
      imageErrors.push(`이미지 ${i+1}: ${ocrErrorText(e)}`);
    }
  }

  TL_OCR_STATE.rawText=combinedText.trim();
  if(!parsedImages.length){
    TL_OCR_STATE.status="error";
    TL_OCR_STATE.warnings=imageErrors.length?imageErrors:["OCR 엔진이 이미지에서 아무 글자도 읽지 못했습니다. 화면 캡처가 선명한지 확인 후 다시 시도해주세요."];
    renderAll(); return;
  }

  const fields=tlOcrMergeFields(parsedImages);
  const allWarnings=[];
  if(!fields.durationMin) allWarnings.push("운동시간을 인식하지 못했습니다. 운동시간을 직접 입력해주세요.");
  if(!fields.date) allWarnings.push("날짜를 정확히 인식하지 못했습니다 — 아래에서 직접 확인해주세요.");
  if(fields.distanceKm==null) allWarnings.push("거리 정보 없음 — 이 운동 유형에서는 정상입니다.");
  allWarnings.push(...imageErrors);

  // NEVER auto-save. Date stays blank when the screenshot does not contain a
  // usable date; this prevents silently registering a workout on today's date.
  TL_OCR_DRAFT={
    date:fields.date||"",
    type:fields.type||"conditioning",
    distanceKm:fields.distanceKm,
    durationMin:fields.durationMin,
    avgPaceSecKm:fields.avgPaceSecKm,
    avgHr:fields.avgHr,
    maxHr:fields.maxHr,
    intensityRpe:fields.intensityRpe
  };
  TL_OCR_STATE.status="done";
  TL_OCR_STATE.warnings=allWarnings;
  renderAll();
}

function saveTlOcrDraft(){
  if(!TL_OCR_DRAFT) return;
  const d=TL_OCR_DRAFT;
  if(!d.date){ showToast("날짜를 입력해주세요"); return; }
  if(d.durationMin==null){ showToast("운동시간을 확인하지 못했습니다. 운동시간을 직접 입력해주세요."); return; }

  // Prevent exact OCR/manual re-imports from being registered twice.
  const same=(a,b)=>a.date===b.date && a.type===b.type &&
    Number(a.durationMin||0)===Number(b.durationMin||0) &&
    ((a.distanceKm==null&&b.distanceKm==null)||Number(a.distanceKm||0)===Number(b.distanceKm||0));
  if(STATE.trainingLog.some(x=>same(x,d))){
    showToast("같은 날짜·운동유형·시간·거리가 이미 등록되어 있어 저장하지 않았습니다");
    return;
  }

  STATE.trainingLog.push({ id:uid(), date:d.date, type:d.type||"conditioning",
    distanceKm:d.distanceKm!=null?Number(d.distanceKm):null,
    durationMin:Number(d.durationMin),
    avgPaceSecKm:d.avgPaceSecKm!=null?Number(d.avgPaceSecKm):null,
    avgHr:d.avgHr!=null?Number(d.avgHr):null,
    maxHr:d.maxHr!=null?Number(d.maxHr):null,
    intensityRpe:d.intensityRpe!=null?Number(d.intensityRpe):null,
    source:"ocr" });
  recordHpiSnapshot(); persist();
  TL_OCR_DRAFT=null; TL_OCR_STATE=defaultTlOcrState();
  showToast("OCR로 읽은 훈련 기록을 저장했습니다");
  renderAll();
}
// Preflight check: some embedded/sandboxed webviews (e.g. in-app previews) block Web Worker
// creation outright, which makes Tesseract.recognize() fail on every image with no useful detail.
// Detecting this up front lets us give a clear, specific message instead of a generic one.
function canUseWebWorker(){
  return new Promise((resolve)=>{
    try{
      if(typeof Worker==="undefined"){ resolve(false); return; }
      const blob=new Blob(["self.onmessage=function(){self.postMessage('ok');};"], {type:"application/javascript"});
      const url=URL.createObjectURL(blob);
      const w=new Worker(url);
      const timer=setTimeout(()=>{ try{w.terminate();}catch(_){ } resolve(false); }, 1500);
      w.onmessage=()=>{ clearTimeout(timer); try{w.terminate();}catch(_){ } URL.revokeObjectURL(url); resolve(true); };
      w.onerror=()=>{ clearTimeout(timer); try{w.terminate();}catch(_){ } URL.revokeObjectURL(url); resolve(false); };
      w.postMessage("ping");
    }catch(e){ resolve(false); }
  });
}
async function runOcrPipeline(){
  if(!window.Tesseract){ OCR_STATE.status="error"; OCR_STATE.warnings=["OCR 엔진 스크립트를 불러오지 못했습니다 (네트워크 문제일 수 있어요). 다시 시도해주세요."]; renderAll(); return; }
  OCR_STATE.status="processing"; OCR_STATE.progress=0; OCR_STATE.rawText=""; renderAll();
  const workerOk=await canUseWebWorker();
  if(!workerOk){
    OCR_STATE.status="error";
    OCR_STATE.warnings=["이 미리보기 화면은 보안 정책상 OCR에 필요한 웹 워커 실행이 막혀 있어요. 파일을 다운로드한 뒤 Safari나 Chrome 같은 일반 브라우저 앱에서 직접 열어 다시 시도해주세요."];
    renderAll(); return;
  }
  let combinedText="", allWords=[];
  const imageErrors=[];
  for(let i=0;i<OCR_STATE.images.length;i++){
    try{
      const canvas=await preprocessForOcr(OCR_STATE.images[i].dataUrl);
      const { data }=await Tesseract.recognize(canvas, "eng", {
        logger:(m)=>{
          if(m.status==="recognizing text"){
            OCR_STATE.progress=Math.round(((i+m.progress)/OCR_STATE.images.length)*100);
            const el=document.getElementById("ocr-progress-text");
            if(el) el.textContent=`기록을 읽고 있어요… (${OCR_STATE.progress}%)`;
          }
        }
      });
      combinedText += "\n"+(data.text||"");

    }catch(e){
      console.warn("OCR failed on image", i, e);
      imageErrors.push(`이미지 ${i+1}: ${ocrErrorText(e)}`);
    }

// Extracts image File/Blob objects out of a paste ClipboardEvent (covers both the common
// dataTransfer.files path and the items[] path some browsers use for screenshot pastes).
function extractClipboardImages(e){
  const dt = e.clipboardData || window.clipboardData;
  if(!dt) return [];
  const files=[];
  if(dt.files && dt.files.length) Array.from(dt.files).forEach(f=>{ if(f.type && f.type.startsWith("image/")) files.push(f); });
  if(!files.length && dt.items) Array.from(dt.items).forEach(it=>{
    if(it.kind==="file" && it.type && it.type.startsWith("image/")){ const f=it.getAsFile(); if(f) files.push(f); }
  });
  return files;
}
// spec: "하이록스 기록올릴때 이미지 복사붙여넣기되게" — lets a person paste a copied results
// screenshot directly instead of only file-upload/camera. Reuses the exact same handleOcrFiles()
// path as file upload, so nothing downstream (OCR pipeline, parsing, confidence badges) changes.
function handleOcrPasteEvent(e){
  const files=extractClipboardImages(e);

}

function hyroxCsvClean(v){
  if(v===undefined || v===null) return "";

  return ["","–","—","-","N/A","NA","null","undefined"].includes(s) ? "" : s;
}
function hyroxCsvDivision(v){
  const s=hyroxCsvClean(v).toUpperCase();

  if(s.includes("PRO") && s.includes("DOUBLES")) return "Pro Doubles";
  if(s.includes("DOUBLES")) return "Open Doubles";
  if(s.includes("PRO")) return "Pro";

}
function hyroxTimeValue(v){
  const s=hyroxCsvClean(v);

    const n=Number(s);
    if(Number.isFinite(n) && n>=0 && n<100000){
      const sec=Math.round(n);
      const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), ss=sec%60;

    }

}

function hyroxDetectFormat(headers){

async function ensureSheetJS(){

async function readHyroxUploadFile(file){

}

async function uploadHyroxRawCsv(file,onProgress){

  // the upsert, so the uploader's own DNA/Peer calc immediately reflects the SAME data every other
  // user's browser will pick up next time they load. `converted` below is still computed from THIS
  // upload's rows purely for the Run/Station coverage diagnostic message — it no longer feeds
  // EXTERNAL_RACE_DB directly (syncExternalRaceDbFromSupabase() does that from the real shared table).
  await syncExternalRaceDbFromSupabase();
  const converted = unique.map(hyroxDbRowToExternal).filter(Boolean);
  // diagnostic (spec §27-9/27-10): how many of the just-imported rows actually got a Run split —
  // lets the person confirm the CSV header-alias fix worked without needing console access.
  const runCoverage = converted.filter(r=>[r.run_1,r.run_2,r.run_3,r.run_4,r.run_5,r.run_6,r.run_7,r.run_8].some(v=>v!=null)).length;
  const stationCoverage = converted.filter(r=>[r.ski,r.sled_push,r.sled_pull,r.burpee,r.row,r.carry,r.lunge,r.wallball].some(v=>v!=null)).length;

  let postCount = null, newRecords = null;
  try{ const { count } = await sb.from("hyrox_results").select("id",{count:"exact",head:true}); postCount = count;
    if(preCount!=null) newRecords = Math.max(0, postCount-preCount); }catch(e){ /* count 조회 실패 — 로그에는 null로 남김, 업로드 결과 자체엔 영향 없음 */ }

  // spec (doc4 §5/§6): 이 업로드가 실제로 무엇을 몇 건 바꿨는지 — Event/Date/Source/Raw/Valid/
  // Duplicate/New/UpdatedAt — 나중에 "어떤 대회 데이터를 추가해서 DNA 기준이 바뀌었는지" 추적 가능하게.
  const uniqueEvents = [...new Set(unique.map(r=>r.event).filter(Boolean))];
  await appendHyroxUploadLog({
    id: uid(), uploadedAt: new Date().toISOString(), fileName: file.name, format,
    events: uniqueEvents.slice(0,5), // 파일 하나에 여러 대회가 섞여 있을 수 있음 — 상위 5개만 기록
    rawParsed: data.length, validRows: rows.length, duplicatesInFile: rows.length-unique.length,
    uploadedRows: unique.length, newRecords, totalAfter: postCount,
  });

  return {imported:unique.length,totalParsed:data.length,format,duplicates:rows.length-unique.length,peerDbAdded:converted.length,runCoverage,stationCoverage,newRecords,totalAfter:postCount};
}
// spec (doc4 §5): 누적 로그는 여러 관리자가 같은 화면에서 봐야 하므로 shared:true로 저장한다.
// 최근 100건만 유지 — 무한정 커지지 않도록.
async function appendHyroxUploadLog(entry){
  try{
    let log = await StorageService.get("hps:hyroxUploadLog:v1", []);
    if(!Array.isArray(log)) log=[];
    log.unshift(entry);
    log = log.slice(0,100);
    if(window.storage && window.storage.set) await window.storage.set("hps:hyroxUploadLog:v1", JSON.stringify(log), true);
    else await StorageService.set("hps:hyroxUploadLog:v1", log);
  }catch(e){ console.warn("upload log 저장 실패(업로드 자체는 정상 처리됨):", e?.message||e); }
}
async function loadHyroxUploadLog(){
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get("hps:hyroxUploadLog:v1", true);
      return r ? JSON.parse(r.value) : [];
    }
  }catch(e){ /* 키 없음 — 정상 */ }
  return await StorageService.get("hps:hyroxUploadLog:v1", []);
}
/* ----------------------------------------------------------------------
 * HYROX RESULT SEARCH DB — Supabase-backed
 *
 * IMPORTANT:
 * - Athlete/result rows are NOT embedded in this HTML anymore.
 * - The public site reads them from Supabase via the RPC function
 *   `search_hyrox_results`.
 * - Admins can add official race data from the HPS Admin page by uploading the
 *   original HYROX CSV; no manual CSV conversion or HTML rebuild is needed.
 * ---------------------------------------------------------------------- */
let HYROX_SEARCH_DB = null; // true after Supabase is reachable
let HYROX_SEARCH_DB_PROMISE = null;
let HYROX_SEARCH_DB_COUNT = null;
let HYROX_DB_QUERY = "";
let HYROX_DB_RESULTS = [];
let HYROX_DB_SELECTED = null;

function hyroxDbReady(){
  return !!HYROX_SEARCH_DB;
}

async function ensureHyroxSearchDb(){
  if(HYROX_SEARCH_DB) return HYROX_SEARCH_DB;
  if(HYROX_SEARCH_DB_PROMISE) return HYROX_SEARCH_DB_PROMISE;
  HYROX_SEARCH_DB_PROMISE = (async()=>{
    if(!window.supabase || !window.supabase.createClient){
      throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    }
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
      throw new Error("Supabase URL / anon key가 index.html에 설정되지 않았습니다.");
    }
    // Reuse the existing global client when authentication has already initialized it.
    if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Lightweight connectivity + count check. Athlete rows themselves are never
    // downloaded up front; only matching rows are requested when the user searches.
    const { count, error } = await sb
      .from("hyrox_results")
      .select("id", { count:"exact", head:true });
    if(error) throw error;
    HYROX_SEARCH_DB_COUNT = count;
    HYROX_SEARCH_DB = true;
    return HYROX_SEARCH_DB;
  })();
  try{
    return await HYROX_SEARCH_DB_PROMISE;
  }catch(e){
    HYROX_SEARCH_DB_PROMISE=null;
    HYROX_SEARCH_DB=null;
    throw e;
  }
}

function normalizeHyroxSearchText(v){
  // BUG FIX: NFD decomposes accented Latin (café -> cafe + combining mark, stripped below on purpose)
  // but it ALSO decomposes precomposed Hangul syllables into individual jamo (세 -> ㅅ+ㅔ), which then
  // fall outside the "가-힣" allowed range below and get silently wiped out -> Korean searches like
  // "세희" were being normalized down to an empty string before ever reaching the server. Re-composing
  // with NFC right after stripping Latin combining marks puts Hangul jamo back into whole syllables
  // (a no-op for input that was already NFC, which is how Korean IME input normally arrives) while
  // still keeping the Latin-accent-stripping behavior intact.
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC")
    .toLowerCase().replace(/[^a-z0-9가-힣]+/g," ").trim();
}

function mapHyroxDbRow(row){
  return {
    n:row.name||"",
    e:row.event||"",
    d:row.division||"",
    g:row.gender||"",
    a:row.age_group||"",
    b:row.bib||"",
    rk:row.overall_rank==null?"":String(row.overall_rank),
    ag:row.age_group_rank==null?"":String(row.age_group_rank),
    t:row.total_time||"",
    u:Array.isArray(row.runs_json) ? row.runs_json : (typeof row.runs_json==="string" ? JSON.parse(row.runs_json||"[]") : []),
    s:Array.isArray(row.stations_json) ? row.stations_json : (typeof row.stations_json==="string" ? JSON.parse(row.stations_json||"[]") : []),
    z:row.transition||"",
  };
}

// Supabase RPC performs token-aware search, so "Joshua White" also finds
// "White, Joshua" without downloading the whole athlete database.
async function searchHyroxByName(query, limit=20){
  if(!HYROX_SEARCH_DB) await ensureHyroxSearchDb();
  const q=normalizeHyroxSearchText(query);
  if(q.length<2) return [];
  if(!sb) throw new Error("Supabase 연결이 초기화되지 않았습니다.");

  const safeLimit=Math.max(1,Math.min(Number(limit)||20,50));
  const { data, error } = await sb.rpc("search_hyrox_results", {
    search_text:q,
    result_limit:safeLimit
  });
  if(error) throw error;
  return (data||[]).map((row,i)=>({r:mapHyroxDbRow(row),i,score:i}));
}

function hyroxSourceBadge(r){
  const parts=[r.e, r.d, r.g, r.a].filter(Boolean);
  return parts.join(" · ");
}

// doc7 §3 fix: "불러옴" previously just wrote silently into a draft (RC_PREFILL) with a toast,
// with no visible confirmation step — on the mobile 기록 page in particular, there was no
// "기록 추가" button anywhere nearby to actually finish the save, so the record was never
// written to STATE.races even though the toast implied success. Now this only stages a
// confirmation-modal draft (HYROX_IMPORT_DRAFT); STATE.races is untouched until the user
// explicitly presses "기록 추가" inside that modal (see renderHyroxImportConfirmModal below).
let HYROX_IMPORT_DRAFT = null;
// user request: HYROX 기록 가져오기에서 division이 "Open Doubles"로 저장돼 있어도 실제 gender가
// "Mixed"라면 Mixed Doubles로 등록되어야 한다 — 일부 원본 데이터가 Doubles를 성별 구분 없이 뭉뚱그려
// "Open Doubles"로만 저장해 둔 경우를 가져오기 시점에 바로잡는다. Open Doubles가 아니거나 gender가
// Mixed가 아니면 원래 division을 그대로 유지한다.
function reconcileDivisionWithGender(division, genderRaw){
  const g=String(genderRaw||"").trim().toLowerCase();
  if(division==="Open Doubles" && g.includes("mixed")) return "Mixed Doubles";
  return division;
}
function importHyroxDbRecord(index){
  const item=HYROX_DB_RESULTS?.[index];
  const r=item?.r;
  if(!r) return;
  const runs={};
  RUN_KEYS.forEach((k,i)=>{ runs[k]=r.u?.[i]||""; });
  const stations={};
  STATIONS.forEach((s,i)=>{ stations[s.key]=r.s?.[i]||""; });
  HYROX_IMPORT_DRAFT = {
    name:r.n||"",
    date:"",
    division:reconcileDivisionWithGender(r.d||DIVISIONS[0], r.g),
    officialTime:r.t||"",
    runs, stations, transition:r.z||"",
    share:{},
    _fromHyroxDb:true,
    _hyroxSource:r.e||"",
    _hyroxAge:r.a||"",
    _hyroxGender:r.g||"",
    _hyroxRank:r.rk||"",
    _hyroxBib:r.b||""
  };
  HYROX_DB_SELECTED=index;
  renderHyroxImportConfirmModal();
  openModal();
}

function bindHyroxNameSearch(wrap){
  const input=wrap.querySelector("#hyrox-name-search");
  const btn=wrap.querySelector("#hyrox-name-search-btn");
  const runSearch=async()=>{
    const q=input?.value.trim()||"";
    HYROX_DB_QUERY=q;
    if(q.length<2){
      HYROX_DB_RESULTS=[];
      const st=wrap.querySelector("#hyrox-db-status");
      if(st) st.textContent="이름을 2글자 이상 입력해주세요.";
      const rs=wrap.querySelector("#hyrox-name-results");
      if(rs) rs.innerHTML="";
      return;
    }
    try{
      if(!hyroxDbReady()) await ensureHyroxSearchDb();
      HYROX_DB_RESULTS=await searchHyroxByName(q,20);
      renderAll();
    }catch(e){
      const st=wrap.querySelector("#hyrox-db-status");
      if(st){ st.style.color="var(--red)"; st.textContent="Supabase 백데이터를 불러오지 못했습니다: "+(e.message||e); }
    }
  };
  btn?.addEventListener("click",runSearch);
  input?.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); runSearch(); }});
  wrap.querySelectorAll("[data-hyrox-import]").forEach(b=>{
    b.addEventListener("click",()=>importHyroxDbRecord(Number(b.dataset.hyroxImport)));
  });
  if(!HYROX_SEARCH_DB){
    ensureHyroxSearchDb().then(()=>{
      if(HYROX_DB_QUERY && HYROX_DB_QUERY.trim().length>=2){
        searchHyroxByName(HYROX_DB_QUERY,20).then(r=>{
          HYROX_DB_RESULTS=r;
          if(CURRENT_PAGE==="races") renderAll();
        });
      } else if(CURRENT_PAGE==="races") renderAll();
    }).catch(e=>{
      const st=wrap.querySelector("#hyrox-db-status");
      if(st){ st.style.color="var(--red)"; st.textContent="Supabase 백데이터 연결 실패: "+(e.message||e); }
    });
  }
}

function recordHpiSnapshot(){
  commitTrainingTrendEma(); // fold this event's Tier-2 signal into the EMA trail before scoring
  const h=calcHPI();
  STATE.hpiHistory.push({ id:uid(), date:todayISO(), hpi:h.hpi, running:h.indices.running.score, engine:h.indices.engine.score,
    strengthEnd:h.indices.strengthEnd.score, skill:h.indices.skill.score, recovery:h.indices.recovery.score, raceExec:h.indices.raceExec.score,
    fatigue:h.fatigue });
  recordPredictionSnapshot(h);
}
// PHASE 1 (Baseline frozen at sha256 bf1263e5... — see /hps_regtest/baseline.json): snapshots are now
// append-only / immutable, never overwritten — this replaces the previous same-date-overwrite bug.
// predictTime() itself is completely untouched by this change; only how its result gets STORED changed.
// Historical entries created before this refactor are NOT backfilled with the new fields below — they
// simply won't have modelVersion/benchmarkVersion/etc, which is the correct "unavailable, not invented"
// behavior for data that didn't exist at the time. raceReadiness/raceDnaState/athleteDataState/
// trainingDataWindow are intentionally left out of this schema for now rather than filled with a
// home-grown formula — those concepts don't have a validated calculation in the app yet (Fitness vs
// Readiness separation is Phase 4/8 work) and inventing one here would violate the "don't invent
// weights" principle. They'll be added in the phase that actually defines them.
const MODEL_VERSION = "FP-1.0"; // current predictTime() — Anchor+aggregate-fraction blend, with a
  // 17-segment (8 run + 8 station + 1 transition, buildRaceSegmentModel()) bottom-up ANCHOR/baseline
  // when >=50% of segments have real data. The forward projection on top of that anchor (HPI-trend-
  // driven fraction) is still a single aggregate adjustment, not simulated per-segment — see Phase 5.
const BENCHMARK_VERSION = "STATIC-FALLBACK-v1.0"; // no real Reference DB connected yet (Phase 2)
function recordPredictionSnapshot(hpiResult){
  const pred=predictTime(hpiResult||calcHPI(), 0); // PRODUCTION value — unchanged, still the only thing predictedSec/ciLow/ciHigh reflect
  if(pred.predicted==null || isNaN(pred.predicted)) return;
  const date=todayISO();
  // PHASE 5 STEP 5-B — also capture Candidate V1 alongside V2 (same defensive/additive pattern),
  // so real accumulated snapshots can later support a Baseline/V1/V2 three-way shadow backtest, not
  // just Baseline/V2. Neither candidate is read by predictTime()/HPI/Training/Division — pure logging.
  let candidateV1Sec = null;
  try{ const v1 = predictTimeSegmentModel(); candidateV1Sec = v1.projectedTotalSec; }catch(e){ /* candidate unavailable this time — leave null */ }
  let candidateV2Sec = null;
  try{ const v2 = predictTimeSegmentModelV2(); candidateV2Sec = v2.projectedTotalSec; }catch(e){ /* candidate unavailable this time — leave null, not an error */ }
  const entry={ id:uid(), date,
    modelVersion: MODEL_VERSION, benchmarkVersion: BENCHMARK_VERSION,
    targetDivision: STATE.profile.division || null, targetDate: STATE.profile.targetDate || null, targetTime: STATE.profile.targetTime || null,
    currentFitness: hpiResult ? hpiResult.hpi : null,
    predictedSec:pred.predicted, ciLow:pred.ciLow, ciHigh:pred.ciHigh,
    confidence:pred.confidence, confidenceLabel:pred.confidenceLabel, baselineSource:pred.baseline.source,
    candidateV1Sec, candidateV2Sec }; // additive-only fields, Production display never reads these
  STATE.predictionHistory.push(entry); // append-only — never overwrite a same-date entry, never touch older entries
}

/* 19. CSV IMPORT (Garmin Connect-style export) — no AI, pure parsing       */
/* ---------------------------------------------------------------------- */
function parseCSV(text){
  // RFC4180-ish parser: handles quoted fields with embedded commas/newlines/escaped quotes.
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], next=text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==""));
}
function guessColumn(headers, keywords, prefer){
  const lower=headers.map(h=>h.toLowerCase().trim());
  if(prefer){ for(const p of prefer){ const i=lower.findIndex(h=>h===p.toLowerCase()); if(i>=0) return i; } }
  for(const kw of keywords){ const i=lower.findIndex(h=>h.includes(kw)); if(i>=0) return i; }
  return -1;
}
function guessTypeFromText(txt){
  const t=(txt||"").toLowerCase();
  if(t.includes("strength")||t.includes("weight")||t.includes("웨이트")||t.includes("근력")) return "strength";
  if(t.includes("interval")||t.includes("hiit")||t.includes("인터벌")) return "interval";
  if(t.includes("hyrox")||t.includes("wod")||t.includes("crossfit")||t.includes("circuit")||t.includes("카디오")||t.includes("cardio")||t.includes("서킷")) return "wod";
  if(t.includes("yoga")||t.includes("stretch")||t.includes("mobility")||t.includes("recovery")||t.includes("회복")||t.includes("요가")||t.includes("스트레칭")) return "recovery";
  if(t.includes("run")||t.includes("러닝")||t.includes("jog")||t.includes("조깅")||t.includes("트레드밀")||t.includes("트랙")) return "run";
  return "run";
}
function durationStrToMin(str){
  if(!str)return null;
  const s=String(str).trim();
  if(s===""||s==="--") return null;
  if(s.includes(":")){ const sec=parseTimeToSec(s); return sec!=null? round1(sec/60): null; }
  const n=Number(s.replace(/,/g,""));
  return isNaN(n)? null : n;
}
// Garmin sometimes reports short/track activities' distance in meters (e.g. "5,990" or "810")
// and longer/free activities in km with a decimal (e.g. "6.01"). Heuristic: no decimal point
// + value >=100 -> treat as meters and convert to km. Also strips thousands-separator commas.
function parseDistanceToKm(raw, unit){
  if(raw==null) return null;
  const s=String(raw).trim();
  if(s===""||s==="--") return null;
  const hasDecimal = s.includes(".");
  const numeric = Number(s.replace(/,/g,""));
  if(isNaN(numeric)||numeric<=0) return null;
  let km = (!hasDecimal && numeric>=100) ? numeric/1000 : numeric;
  if(unit==="mi") km *= 1.60934;
  return round1(km);
}
// spec §3: synonym column lists — Garmin/COROS/Strava export column names vary by device/app version
// and locale; only columns that actually exist in the uploaded CSV are used, everything else stays null.
const AVG_HR_COLUMNS = ["평균 심박","평균심박","avg hr","average heart rate","avg. heart rate","heart rate"];
const MAX_HR_COLUMNS = ["최대 심박","최대심박","max hr","maximum heart rate","max. heart rate"];
const GAP_COLUMNS = ["avg gap","average gap","grade adjusted pace","gap"];
const ELEV_GAIN_COLUMNS = ["고도 상승","상승고도","elev gain","elevation gain","total ascent","ascent"];
const ELEV_LOSS_COLUMNS = ["고도 하강","하강고도","elev loss","elevation loss","total descent","descent"];
const AEROBIC_TE_COLUMNS = ["유산소 트레이닝 효과","aerobic training effect","aerobic te"];
const TRAINING_LOAD_COLUMNS = ["트레이닝 부하","training load","tss","training stress score"];
const CADENCE_COLUMNS = ["평균 케이던스","케이던스","avg cadence","average cadence","cadence"];
function parseGarminCsv(text, unit){
  const rows=parseCSV(text);
  if(rows.length<2) return { rows:[], error:"CSV에서 데이터 행을 찾지 못했습니다." };
  const headers=rows[0];
  const iDate=guessColumn(headers,["날짜","date"]);
  const iType=guessColumn(headers,["활동 종류","활동종류","activity type","제목","title","type"]);
  const iDist=guessColumn(headers,["거리","distance"]);
  const iDur=guessColumn(headers,["이동 시간","moving time","경과 시간","elapsed time","시간","time","duration"], ["이동 시간","moving time"]);
  const iHr=guessColumn(headers,AVG_HR_COLUMNS);
  const iPace=guessColumn(headers,["평균 페이스","페이스","avg pace","pace"]);
  const iMaxHr=guessColumn(headers,MAX_HR_COLUMNS);
  const iGap=guessColumn(headers,GAP_COLUMNS);
  const iElevGain=guessColumn(headers,ELEV_GAIN_COLUMNS);
  const iElevLoss=guessColumn(headers,ELEV_LOSS_COLUMNS);
  const iAerobicTe=guessColumn(headers,AEROBIC_TE_COLUMNS);
  const iLoad=guessColumn(headers,TRAINING_LOAD_COLUMNS);
  const iCadence=guessColumn(headers,CADENCE_COLUMNS);
  if(iDate<0){ return { rows:[], error:"날짜 컬럼을 찾지 못했습니다. Garmin/COROS/Strava 활동 내보내기 CSV인지 확인해주세요." }; }
  const numOrNull=(raw)=>{ if(raw==null) return null; const s=String(raw).trim(); if(s===""||s==="--") return null; const n=Number(s.replace(/,/g,"")); return isNaN(n)?null:n; };
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row || row.every(c=>c==="")) continue;
    const rawDate=row[iDate]||"";
    const dateMatch = rawDate.match(/\d{4}-\d{2}-\d{2}/);
    let dateStr = dateMatch ? dateMatch[0] : null;
    if(!dateStr){ const d=new Date(rawDate); if(!isNaN(d)) dateStr=d.toISOString().slice(0,10); }
    if(!dateStr) continue;
    const typeText = iType>=0? row[iType] : "";
    const distanceKm = iDist>=0 ? parseDistanceToKm(row[iDist], unit) : null;
    const durationMin = iDur>=0 ? durationStrToMin(row[iDur]) : null;
    const avgHrRaw = iHr>=0 ? row[iHr] : null;
    const avgHr = (avgHrRaw && avgHrRaw!=="--") ? (Number(avgHrRaw.replace(/,/g,""))||null) : null;
    const maxHrRaw = iMaxHr>=0 ? row[iMaxHr] : null;
    const maxHr = (maxHrRaw && maxHrRaw!=="--") ? (Number(maxHrRaw.replace(/,/g,""))||null) : null;
    let avgPaceSecKm = null;
    if(iPace>=0 && row[iPace] && row[iPace]!=="--" && row[iPace].includes(":")) avgPaceSecKm = parseTimeToSec(row[iPace]);
    else if(distanceKm && durationMin) avgPaceSecKm = Math.round((durationMin*60)/distanceKm);
    // spec §4: Garmin's own directly-provided Avg Pace/GAP is preferred over a distance÷duration
    // derivation whenever the CSV provides it directly (already the case for avgPaceSecKm above).
    let avgGapSecKm = null;
    if(iGap>=0 && row[iGap] && row[iGap]!=="--" && row[iGap].includes(":")) avgGapSecKm = parseTimeToSec(row[iGap]);
    const elevationGainM = iElevGain>=0 ? numOrNull(row[iElevGain]) : null;
    const elevationLossM = iElevLoss>=0 ? numOrNull(row[iElevLoss]) : null;
    const aerobicTrainingEffect = iAerobicTe>=0 ? numOrNull(row[iAerobicTe]) : null;
    const trainingLoad = iLoad>=0 ? numOrNull(row[iLoad]) : null;
    const avgCadence = iCadence>=0 ? numOrNull(row[iCadence]) : null;
    out.push({ id:uid(), date:dateStr, type:guessTypeFromText(typeText), rawType:typeText, distanceKm, durationMin, avgPaceSecKm,
      avgHr, maxHr, hrDrift:"", recoveryDrop:"", intensityRpe:5, painFlag:false, painArea:"", note:typeText||"", source:"csv",
      avgGapSecKm, elevationGainM, elevationLossM, aerobicTrainingEffect, trainingLoad, avgCadence });
  }
  return { rows: out, error: out.length? null : "가져올 수 있는 행이 없습니다. 파일 형식을 확인해주세요." };
}

/* ---------------------------------------------------------------------- */
/* 19b. APPLE HEALTH XML IMPORT — parses Health app's export.xml           */
/*      Uses regex extraction rather than DOMParser: export.xml can be     */
/*      hundreds of MB with millions of samples: full DOM parsing would    */
/*      hang the browser tab. We only need <Workout ...> opening tags and  */
/*      resting-heart-rate <Record ...> tags, both self-contained in a     */
/*      single element, so a regex scan is far lighter and just as exact.  */
/* ---------------------------------------------------------------------- */
function extractXmlAttrs(tagStr){
  const attrs={}; const re=/(\w[\w:.-]*)="([^"]*)"/g; let m;
  while((m=re.exec(tagStr))) attrs[m[1]]=m[2];
  return attrs;
}
function mapAppleWorkoutType(activityType){
  const t=(activityType||"").toLowerCase();
  if(t.includes("strengthtraining")) return "strength";
  if(t.includes("hiit")||t.includes("intervaltraining")) return "interval";
  if(t.includes("crosstraining")||t.includes("coretraining")||t.includes("functionalstrength")||t.includes("mixedcardio")) return "wod";
  if(t.includes("yoga")||t.includes("cooldown")||t.includes("flexibility")||t.includes("mindandbody")||t.includes("preparationandrecovery")) return "recovery";
  if(t.includes("running")) return "run";
  return "run";
}
function parseAppleHealthXml(text, unit){
  const workouts=[], restingHr=[];
  const workoutTagRe=/<Workout\b([^>]*)>/g; let m;
  while((m=workoutTagRe.exec(text))){
    const a=extractXmlAttrs(m[1]);
    const dateStr=(a.startDate||"").slice(0,10);
    if(!dateStr) continue;
    const durationMin = a.duration!=null ? round1(Number(a.duration)) : null;
    let distanceKm = a.totalDistance!=null ? Number(a.totalDistance) : null;
    if(distanceKm!=null && a.totalDistanceUnit==="mi") distanceKm*=1.60934;
    if(distanceKm!=null) distanceKm=round1(distanceKm);
    const avgPaceSecKm = (distanceKm && durationMin) ? Math.round((durationMin*60)/distanceKm) : null;
    workouts.push({ id:uid(), date:dateStr, type:mapAppleWorkoutType(a.workoutActivityType), rawType:(a.workoutActivityType||"").replace("HKWorkoutActivityType",""),
      distanceKm, durationMin, avgPaceSecKm, avgHr:null, hrDrift:"", recoveryDrop:"", intensityRpe:5, painFlag:false, painArea:"", note:"", source:"apple" });
  }
  const restingTagRe=/<Record\b[^>]*type="HKQuantityTypeIdentifierRestingHeartRate"[^>]*>/g;
  while((m=restingTagRe.exec(text))){
    const a=extractXmlAttrs(m[0]);
    const dateStr=(a.startDate||"").slice(0,10);
    if(dateStr && a.value) restingHr.push({ date:dateStr, value:Math.round(Number(a.value)), source:"apple" });
  }
  return { workouts, restingHr, error: (workouts.length||restingHr.length) ? null : "가져올 수 있는 운동/심박 기록을 찾지 못했습니다. Health 앱 → 프로필 → 데이터 내보내기(export.xml)가 맞는지 확인해주세요." };
}

/* 17b. WEEKLY TRAINING COMPOSITION BAR (최근 7일 훈련 비중)                */
/* ---------------------------------------------------------------------- */
const TRAIN_TYPE_COLORS = {
  run:{ color:"var(--orange)", label:"러닝" }, interval:{ color:"var(--orange)", label:"인터벌" }, long:{ color:"var(--orange)", label:"롱런" }, tt:{ color:"var(--orange)", label:"TT" },
  strength:{ color:"var(--low)", label:"웨이트" }, wod:{ color:"var(--amber)", label:"HYROX WOD" }, recovery:{ color:"var(--green)", label:"Recovery" },
  conditioning:{ color:"#FF9A3D", label:"컨디셔닝" }, hybrid:{ color:"#B490FF", label:"하이브리드" },
};
const REST_DAY_META = { color:"var(--gray-dim)", label:"Rest" };
const BOX_TYPE_COLOR = { "웨이트":"var(--low)", "하이브리드":"#B490FF", "컨디셔닝":"#FF9A3D", "기타":"var(--gray-dim)" };
function weeklyCompositionDays(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dateStr=d.toISOString().slice(0,10);
    const entries=STATE.trainingLog.filter(l=>l.date===dateStr);
    const dayIdx=(d.getDay()+6)%7; // 0=Mon..6=Sun, matches STATE.boxSchedule's key convention
    days.push({ date:dateStr, weekday:WEEKDAYS[dayIdx], dayIdx, isToday:i===0, entries });
  }
  return days;
}
function dominantDayMeta(entries, dayIdx){
  if(entries.length){
    const top=[...entries].sort((a,b)=>(b.intensityRpe||0)-(a.intensityRpe||0))[0];
    if(TRAIN_TYPE_COLORS[top.type]) return TRAIN_TYPE_COLORS[top.type];
  }
  // bug fix: box days (e.g. a fixed "웨이트" day at the person's CrossFit box) were showing as "Rest"
  // whenever nothing was separately logged via Quick Log for that date — even though the app already
  // knows that weekday has a scheduled box session. Falls back to the box's own configured type.
  const box = dayIdx!=null ? STATE.boxSchedule[dayIdx] : null;
  if(box && box.active && box.type) return { color: BOX_TYPE_COLOR[box.type]||"#B490FF", label:`박스: ${box.type}` };
  return REST_DAY_META;
}
function renderWeeklyCompositionBar(){
  const days=weeklyCompositionDays();
  const legendSeen={};
  const segs=days.map(d=>{
    const meta=dominantDayMeta(d.entries, d.dayIdx);
    legendSeen[meta.label]=meta.color;
    const title=`${d.date} · ${meta.label}${d.entries.length?` (${d.entries.length}건)`:""}`;
    return `<div title="${title}" style="flex:1;background:${meta.color};height:100%;${d.isToday?"box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);":""}"></div>`;
  }).join("");
  const dayLabels=days.map(d=>`<div style="flex:1;text-align:center;font-size:10px;color:${d.isToday?"var(--white)":"var(--gray-dim)"};font-weight:${d.isToday?"700":"400"};">${d.weekday}</div>`).join("");
  const legend=Object.entries(legendSeen).map(([label,color])=>`<span class="hstack" style="gap:5px;font-size:10.5px;color:var(--gray);"><span style="width:8px;height:8px;border-radius:2px;background:${color};display:inline-block;"></span>${label}</span>`).join("");
  return `
    <div class="card">
      <div class="eyebrow gray">최근 7일 훈련 비중</div>
      <div style="display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:10px;gap:2px;">${segs}</div>
      <div style="display:flex;margin-top:5px;">${dayLabels}</div>
      <div class="hstack" style="gap:14px;flex-wrap:wrap;margin-top:10px;">${legend}</div>
    </div>`;
}

/* ---------------------------------------------------------------------- */
/* 5g. V3 — QUALITATIVE FEASIBILITY LABELS (spec §7, §23, §40)             */
/*     "달성확률 78%"처럼 calibration되지 않은 숫자를 실제 확률처럼 보여주지  */
/*     않는다. 내부적으로는 여전히 0-100 스코어를 계산해 정렬/임계값 판단에   */
/*     쓰지만, 사람에게 보여주는 건 항상 🟢/🟡/🟠/🔴 정성 라벨 + 근거뿐이다. */
/* ---------------------------------------------------------------------- */
function probToQualLabel(prob){
  if(prob>=72) return { emoji:"🟢", label:"높은 가능성" };
  if(prob>=48) return { emoji:"🟡", label:"현실적 도전" };
  if(prob>=25) return { emoji:"🟠", label:"공격적 목표" };
  return { emoji:"🔴", label:"현재 데이터 기준 어려움" };
}
// general momentum read (NOT tied to a specific target) — driven directly by the measured HPI
// trend rather than an invented "improvement probability %".
function trendQualitativeLabel(){
  const growth=hpiTrendPerWeek();
  if(growth==null) return { emoji:"🟡", label:"추세 데이터 부족", color:"var(--amber)" };
  if(growth>=0.6) return { emoji:"🟢", label:"상승세 뚜렷", color:"var(--green)" };
  if(growth>0.1) return { emoji:"🟡", label:"완만한 상승", color:"var(--amber)" };
  if(growth>=-0.1) return { emoji:"🟠", label:"정체", color:"var(--high)" };
  return { emoji:"🔴", label:"하락 추세", color:"var(--red)" };
}
// the "근거" bullet list that must always accompany a qualitative feasibility label (spec §7 example
// format) — built entirely from numbers already computed elsewhere (Target Gap Decomposition §5,
// Training Priority §9, HPI trend), nothing invented for the purpose of this list.
function buildGoalFeasibilityReasons(plan){
  const reasons=[];
  reasons.push(plan.weeksToRace!=null ? `대회까지 ${Math.round(plan.weeksToRace)}주` : "대회 날짜 미설정 (8주 기준으로 가정)");
  reasons.push(`현재 예상 기록 ${fmtTime(plan.currentSec)} (${plan.baselineSource})`);
  reasons.push(plan.totalGapSec>0 ? `목표 Gap ${fmtTime(plan.totalGapSec)}` : "이미 목표 기록 이내");
  if(plan.segmentGap && !plan.segmentGap.alreadyMet){
    plan.segmentGap.segments.slice(0,2).forEach(s=>{
      const potLabel = s.trainability>=0.6?"높음":s.trainability>=0.35?"중간":"낮음";
      reasons.push(`${s.label} 개선 가능성 ${potLabel}`);
    });
    if(plan.segmentGap.feasibility==="beyond-model") reasons.push("17개 구간 Aggressive 개선 합으로도 Gap을 다 설명하지 못함");
  }
  const growth=hpiTrendPerWeek();
  reasons.push(growth!=null ? `최근 8주 HPI 추세 ${growth>=0?"+":""}${round1(growth)}/주` : "HPI 추세 데이터 부족 (스냅샷 2회 이상 필요)");
  reasons.push(calcHPI().fatigue>65 ? "최근 피로도 높음" : "최근 피로도 정상");
  return reasons;
}

const FEASIBILITY_META = {
  "already-met": { emoji:"🟢", label:"이미 달성권", color:"var(--green)", msg:"현재 기준으로 이미 목표 기록을 달성했거나 근접해 있습니다. 더 도전적인 목표를 설정해보세요." },
  "safe": { emoji:"🟢", label:"높은 가능성", color:"var(--green)", msg:"현재 데이터 기준으로 무난히 달성 가능한 목표입니다." },
  "realistic": { emoji:"🟡", label:"현실적 도전", color:"var(--orange)", msg:"꾸준히 훈련하면 현실적으로 도달 가능한 목표입니다." },
  "challenge": { emoji:"🟠", label:"공격적 목표", color:"var(--amber)", msg:"달성하려면 우선순위 영역에 집중한 훈련이 필요합니다. 불가능하지는 않지만 여유는 크지 않습니다." },
  "unrealistic": { emoji:"🔴", label:"현재 데이터 기준 어려움", color:"var(--red)", msg:"현재 데이터와 남은 기간을 기준으로 이 목표는 달성 가능성이 낮습니다. 아래 대안 목표를 참고해주세요." },
};
let GOAL_GAP_EXPANDED = null; // key of the currently expanded "목표 기록을 위한 개선 계획" row, or null
// per-category (run/station/roxzone) breakdown for the click-to-expand detail (spec):
// 현재 예상 기록 → 목표 기록 → 필요한 개선 → 현실적 단축 목표. Returns null when segment-level data
// isn't available (e.g. proportional fallback decomposition) — never fabricates a range in that case.
function computeCategoryGapDetail(plan, k){
  if(!plan.segmentGap || plan.segmentGap.alreadyMet) return null;
  const typeMatch = { run:"run", station:"station", roxzone:"transition" }[k];
  const segs = plan.segmentGap.segments.filter(s=>s.type===typeMatch);
  if(!segs.length) return null;
  const currentSec = segs.reduce((s,x)=>s+x.currentSec,0);
  const neededSec = segs.reduce((s,x)=>s+x.allocatedSec,0); // == plan.decomposition[k]
  const targetSec = currentSec - neededSec;
  const conservativeSec = segs.reduce((s,x)=>s+x.conservativeSec,0);
  const realisticSec = segs.reduce((s,x)=>s+x.realisticSec,0);
  return { currentSec, targetSec, neededSec, conservativeSec, realisticSec };
}

  wrap.querySelector("#goal-save").addEventListener("click",()=>{

    const goalDivSelected=wrap.querySelector("#goal-target-division").value;

    // base" default stays meaningful even if the athlete's base division is ever changed elsewhere
    STATE.profile.goalDivision = goalDivSelected===STATE.profile.division ? "" : goalDivSelected;

function renderPrediction(wrap){

  const priority=computeTrainingPriority();

  // but near race day the ACTUAL weekly plan is safety-overridden (Taper/Race Urgency), which used to
  // create a confusing mismatch: this page would say "Running 1순위" while the real week was all
  // Shakeout/Rest with no explanation of why. ruleOverride surfaces that context wherever priority is shown.
  const ruleResultForOverride=evaluateRules();
  const overrideInfo=computeSafetyOverrideSuppression(ruleResultForOverride.fired);
  const overrideRuleLabel = ruleResultForOverride.fired.find(r=>["TAP-1","TAP-2","RACE-1"].includes(r.id));
  const narrativeParts=[...buildLimitingFactorNarrative(priority,true), ...fitnessProfileNarrative(true)];
  const race=latestRace();
  const degradation=computeStationInducedDegradation(race);
  const acwr=calcACWR();
  const attribution=buildPredictionAttributionV3();
  const goals=computeGoalScenarios();
  const dLeft=daysToRace();
  const potentialWeeks = dLeft!=null ? clamp(Math.round(dLeft/7),1,20) : 12;
  const potential = predictTime(hpiResult, potentialWeeks);
  const confBadgeCls = p0.confidenceLabel==="HIGH"?"elite":p0.confidenceLabel==="MEDIUM"?"med":"crit";
  const confColor = p0.confidenceLabel==="HIGH"?"var(--green)":p0.confidenceLabel==="MEDIUM"?"var(--amber)":"var(--red)";
  const predAcc = computePredictionAccuracy();
  const calibMult = getRangeCalibrationMultiplier();
  wrap.innerHTML = `

      </div>

/* 9d. RACE DNA — user-friendly translation layer (spec)                   */
/*     computePeerAnalysis()'s segments/impactList/strengthIdx keep their   */
/*     exact existing shape/math (still used by HPI/Prediction/Training     */
/*     Engine) — everything below only reframes that SAME data for the     */
/*     main Race DNA screen. The old radar + full Z-score table move into   */
/*     a collapsed "상세 분석" section, still reachable, not deleted.        */
/* ---------------------------------------------------------------------- */
function peerScoreBand(score){
  if(score==null) return { label:"데이터 부족", color:"var(--gray-dim)" };
  if(score>=80) return { label:"강점", color:"var(--green)" };
  if(score>=60) return { label:"양호", color:"var(--low)" };
  return { label:"개선 필요", color:"var(--amber)" };
}
const RACE_DNA_TYPE_AXES = [
  { key:"running", emoji:"🏃", label:"페이스형" },
  { key:"power", emoji:"💪", label:"파워형" },
  { key:"engine", emoji:"❤️", label:"심폐형" },
  { key:"fatigueResistance", emoji:"🔋", label:"지구력형" },
  { key:"transition", emoji:"⚡", label:"전환형" },
  { key:"grip", emoji:"🎯", label:"기술형" },
];
// Combines up to 2 axes into a "페이스형 + 파워형" style label — only when there's enough segment
// data AND a real, meaningful standout (score>=60 "양호" and clearly above the athlete's own average
// across axes). Never forces a classification on thin data (spec §1/§8: "근거가 부족하면 단정하지
//마세요") — returns insufficient:true instead, and the UI shows "데이터 수집 중".
const RACE_DNA_MIN_SEGMENTS_FOR_TYPE = 10;
function raceDnaTypeCombo(strengthIdx, dataSource){
  if(!dataSource || dataSource.totalSegmentCount < RACE_DNA_MIN_SEGMENTS_FOR_TYPE) return { insufficient:true };
  const vals = RACE_DNA_TYPE_AXES.map(ax=>({ ...ax, score:strengthIdx[ax.key] })).filter(a=>a.score!=null);
  if(vals.length<4) return { insufficient:true };
  const avg = mean(vals.map(v=>v.score));
  const qualifying = vals.filter(v=>v.score>=60 && (v.score-avg)>=8).sort((a,b)=>(b.score-avg)-(a.score-avg));
  if(!qualifying.length) return { insufficient:false, types:[], balanced:true };
  return { insufficient:false, types:qualifying.slice(0,2), balanced:false };
}
// BUG FIX (DNA audit item #2/#3): Run 1~8 used to compete as 8 separate "강점" candidates, so the
// list could show e.g. "Run 3 / Run 2 / Run 4" instead of a single "Running" entry — not how HYROX
// athletes think about their own strengths. 17-segment internal data (segments, passed in) is
// UNCHANGED; only this user-facing "나의 강점" list now collapses the 8 run legs into one "Running"
// candidate before ranking, exactly like the Impact/Loss side already does for its "Running (8구간
// 합)" line (see computePeerAnalysis's runTimeLoss). Score = mean of the 8 individual run
// percentiles — no new weighting invented, same underlying z/percentile values.
function buildStrengthsTop3(segments){
  const runSegs = segments.filter(s=>s.kind==="run" && s.actual!=null && s.percentile!=null);
  const otherSegs = segments.filter(s=>s.kind!=="run" && s.actual!=null && s.percentile!=null);
  const candidates = [...otherSegs];
  if(runSegs.length) candidates.push({ label:"Running", percentile: mean(runSegs.map(s=>s.percentile)) });
  const sorted=[...candidates].sort((a,b)=>b.percentile-a.percentile).slice(0,3);
  const templates=["현재 구간 중 가장 안정적인 수행 능력","그룹 평균보다 뚜렷하게 앞서는 구간","꾸준히 강점으로 나타나는 구간"];
  return sorted.map((s,i)=>({ label:s.label, desc:templates[i]||"강점 구간", score:Math.round(s.percentile) }));
}
// spec §3: individual station bottlenecks (NOT the aggregate "Running (8구간 합)" line — that's used
// in the separate 기록 손실 분석 section) + a specific "후반 Running" item when measured post-station
// degradation (computeStationInducedDegradation, already real data) is large enough to call out.
function buildImprovementTop3(impactList, race){
  const stationItems = impactList.filter(c=>c.key!=="run" && c.timeLoss>0).slice(0,3)
    .map(c=>({ label:c.label, key:c.key, reason:`기준 기록보다 ${fmtTime(Math.abs(c.timeLoss))} 느림` }));
  const items=[...stationItems];
  const degradation=computeStationInducedDegradation(race);
  const topDeg=degradation.find(d=>d.degradationSec>0);
  if(topDeg){
    const pct=(topDeg.degradationSec/topDeg.baselineSec)*100;
    if(pct>=8){
      const degItem={ label:"후반 Running", key:"run_fatigue", reason:`${topDeg.label} 이후 Running 페이스가 평균보다 ${round1(pct)}% 이상 저하` };
      if(items.length<3) items.push(degItem); else items[2]=degItem;
    }
  }
  return items.slice(0,3);
}
/* ---------------------------------------------------------------------- */
/* 9f. UNIFIED DNA-BASED WEAKNESS/STRENGTH RANKING (doc7 §8-15)            */
/*     Single source of truth for "개선 필요/우선순위" and "강점" everywhere  */
/*     (Dashboard / 기록예측 / DNA / Podium). Wraps the SAME real peer        */
/*     Z-score/percentile-weighted DNA engine the DNA page already shows     */
/*     (computePeerAnalysis -> buildImprovementTop3/buildStrengthsTop3) —    */
/*     no new statistics, no separate benchmark-gap or Impact×Gap×          */
/*     Trainability ranking competing with it. Every screen that wants      */
/*     "which area needs work" must call THIS, not compute its own.         */
/*     Falls back to the existing Training Priority index-ranking (already  */
/*     a real, separately-used engine for weekly planning) ONLY when there  */
/*     is no race in the current division to run DNA/peer analysis on at    */
/*     all — never invents a third ranking, and the fallback is labeled so  */
/*     the UI can be honest about which source produced the list.          */
/* ---------------------------------------------------------------------- */
function getDnaWeaknessRanking(n=3){
  const peer = computePeerAnalysis();
  if(peer){
    const top3 = buildImprovementTop3(peer.impactList, peer.race).slice(0,n);
    if(top3.length) return { source:"dna", items: top3 };
  }
  const priority = computeTrainingPriority();
  return { source:"trainingPriority", items: priority.slice(0,n).map(p=>({ label:INDEX_META[p.key].friendly, key:p.key, reason:null })) };
}
function getDnaStrengthRanking(n=3){
  const peer = computePeerAnalysis();
  if(peer){
    const top3 = buildStrengthsTop3(peer.segments).slice(0,n);
    if(top3.length) return { source:"dna", items: top3.map(s=>({ label:s.label, key:null, reason:s.desc })) };
  }
  const hpiResult = calcHPI();
  const ranked = Object.entries(hpiResult.indices).filter(([k,v])=>v.score!=null).sort((a,b)=>b[1].score-a[1].score).slice(0,n);
  return { source:"hpi", items: ranked.map(([k,v])=>({ label:INDEX_META[k].friendly, key:k, reason:null })) };
}
const STATION_TRAINING_HINT = {
  ski:"SkiErg 인터벌", row:"Row 인터벌", burpee:"Burpee Broad Jump 반복",

}

function sessionColor(type){

let MODEL_TAB = "model";
let MODEL_PAGE_UNLOCKED = false; // resets every session (not persisted) — must re-enter code each fresh load, matching a lightweight "not for general users" gate rather than real security
function renderModel(wrap){
  if(!MODEL_PAGE_UNLOCKED){
    wrap.innerHTML = `
      <div><div class="eyebrow">EXPLAINABLE MODEL</div><h1 class="page-title">모델 설명</h1></div>
      <div class="card" style="max-width:360px;">
        <div class="eyebrow gray">🔒 접근 코드 필요</div>
        <p class="lead" style="margin:8px 0 12px;">이 페이지는 개발/분석용 상세 설명이라 접근 코드가 필요합니다.</p>
        <input id="model-gate-code" type="password" placeholder="접근 코드" style="max-width:220px;">
        <div class="hstack" style="margin-top:10px;"><button class="btn sm" id="model-gate-submit">확인</button></div>
        <div id="model-gate-error" style="margin-top:8px;font-size:12px;color:var(--red);"></div>
      </div>
    `;
    const submit=()=>{
      const val=wrap.querySelector("#model-gate-code").value;
      if(val==="sehiyes"){ MODEL_PAGE_UNLOCKED=true; renderAll(); }
      else wrap.querySelector("#model-gate-error").textContent="코드가 올바르지 않습니다.";
    };
    wrap.querySelector("#model-gate-submit").addEventListener("click", submit);
    wrap.querySelector("#model-gate-code").addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
    return;
  }
  wrap.innerHTML = `
    <div><div class="eyebrow">EXPLAINABLE MODEL</div><h1 class="page-title">모델 설명</h1></div>
    <div class="tabs">
      <div class="tab ${MODEL_TAB==="model"?"active":""}" data-model-tab="model">모델 설명</div>
      <div class="tab ${MODEL_TAB==="rules"?"active":""}" data-model-tab="rules">Rule Engine</div>
      <div class="tab ${MODEL_TAB==="plan"?"active":""}" data-model-tab="plan">훈련계획 (코치 사고 과정)</div>
      <div class="tab ${MODEL_TAB==="dna"?"active":""}" data-model-tab="dna">DNA 데이터</div>
    </div>
    <div id="model-tab-body"></div>
  `;
  wrap.querySelectorAll("[data-model-tab]").forEach(t=>t.addEventListener("click",()=>{ MODEL_TAB=t.dataset.modelTab; renderAll(); }));
  const body=wrap.querySelector("#model-tab-body");
  if(MODEL_TAB==="rules") renderRules(body);
  else if(MODEL_TAB==="plan") renderModelPlanningTab(body);
  else if(MODEL_TAB==="dna") renderModelDnaImportTab(body);
  else renderModelExplainTab(body);
}

      <p class="reason-line" style="margin:8px 0;color:var(--orange);">
        이 탭은 기존 모델 설명 접근 코드로 보호됩니다. 이미 DNA에 등록된 기록을 선수 검색 DB로 옮기거나 새 대회 검색 데이터를 추가할 때 사용합니다.
